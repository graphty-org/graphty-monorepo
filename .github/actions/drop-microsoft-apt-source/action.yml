name: Drop the Microsoft apt sources
description: >
    Removes every apt source on the runner that points at packages.microsoft.com (microsoft-prod,
    azure-cli, ...). The hosted Ubuntu images ship them, nothing in this repository installs from
    them, and when that server answers 403 `apt-get update` exits 100 and fails the job before a
    test runs (run 37244710257). It also makes apt drop a connection that stalls for 20 s and retry
    a download up to 5 times (/etc/apt/apt.conf.d/99-ci-timeouts): in run 40555956340 apt spent 24
    minutes fetching 114 MB from Ubuntu's Azure mirror, connections stalled for up to 148 s, and the
    job hit its time limit. Run it before the first apt use in a job: `playwright install
    --with-deps`, `playwright install-deps`, `visual-review install-browser` or `apt-get`.
runs:
    using: composite
    steps:
        - shell: bash
          run: "{ grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -fv"
        - shell: bash
          run: |
              printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "5";' \
                  | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
