name: Install Playwright's system packages
description: >
    Installs the system packages Chromium needs (`playwright install-deps chromium`) from .deb files
    cached per runner image and Playwright version, instead of running apt on every job. apt took 15 s
    at the median and 30 s on average per job, 7 s of it `apt-get update` and a long download tail; a
    hit restores the files and runs only dpkg. The cached set is exactly what apt chose on the same
    runner image (ImageVersion) for the same Playwright version, so a hit installs the same packages
    a miss would have on that image; either way the step fails unless every package Playwright lists
    is installed afterwards. Run drop-microsoft-apt-source first: a miss uses apt.
inputs:
    working-directory:
        description: The directory whose `pnpm exec playwright` is used, so its version keys the cache.
        default: .
runs:
    using: composite
    steps:
        - id: key
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          # ImageVersion keys the cache because a deb cached on an older image would downgrade packages.
          run: echo "key=playwright-debs-${ImageOS:?}-${ImageVersion:?}-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

        - id: cache
          uses: actions/cache@v4
          with:
              path: ~/.cache/playwright-debs
              key: ${{ steps.key.outputs.key }}

        - shell: bash
          working-directory: ${{ inputs.working-directory }}
          env:
              HIT: ${{ steps.cache.outputs.cache-hit }}
          run: '"$GITHUB_ACTION_PATH/install.sh"'
