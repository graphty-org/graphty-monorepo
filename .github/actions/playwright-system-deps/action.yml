name: Install Playwright's system packages
description: >
    Installs the system packages Chromium needs (`playwright install-deps chromium`) from .deb files
    cached per runner image and Playwright version, instead of running apt on every job. apt took 15 s
    at the median and 30 s on average per job (about 69 job-hours a week), 7 s of it `apt-get update`
    and a long download tail; a hit restores the files and runs only dpkg (about 5 s). The cached set
    is exactly what apt chose on the same runner image (ImageVersion) for the same Playwright
    version, so a hit installs the same packages a miss would have on that image. Run
    drop-microsoft-apt-source first: a miss uses apt.
inputs:
    working-directory:
        description: The directory whose `pnpm exec playwright` is used, so its version keys the cache.
        default: .
runs:
    using: composite
    steps:
        - id: key
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          # ImageVersion keys the cache because a deb cached on an older image would downgrade packages.
          run: echo "key=playwright-debs-${ImageOS:?}-${ImageVersion:?}-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

        - id: cache
          uses: actions/cache@v4
          with:
              path: ~/.cache/playwright-debs
              key: ${{ steps.key.outputs.key }}

        - shell: bash
          working-directory: ${{ inputs.working-directory }}
          env:
              HIT: ${{ steps.cache.outputs.cache-hit }}
          run: |
              dir=~/.cache/playwright-debs
              shopt -s nullglob
              if [ "$HIT" = "true" ]; then
                  debs=("$dir"/*.deb)
                  echo "Installing ${#debs[@]} cached packages"
                  if [ ${#debs[@]} -gt 0 ]; then sudo dpkg -i "${debs[@]}"; fi
                  exit 0
              fi
              sudo rm -f /var/cache/apt/archives/*.deb
              log=$(mktemp)
              pnpm exec playwright install-deps chromium | tee "$log"
              mkdir -p "$dir"
              debs=(/var/cache/apt/archives/*.deb)
              # An empty cache is right only when apt installed nothing; otherwise apt deleted its
              # downloads and every hit would install too little (missing fonts change screenshots).
              if [ ${#debs[@]} -eq 0 ] && ! grep -q '^0 upgraded, 0 newly installed' "$log"; then
                  echo "::error::apt installed packages but kept no .deb files in /var/cache/apt/archives"
                  exit 1
              fi
              if [ ${#debs[@]} -gt 0 ]; then cp "${debs[@]}" "$dir"/; fi
