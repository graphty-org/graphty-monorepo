# Dependabot version and security updates. Every pull request targets master, the default branch, and
# merges like any other once CI is green: the pipeline-round skill turns on its auto-merge (merge commit)
# as graphty-agent (CLAUDE.md, "Shipping a change").
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      labels: ["dependencies"]
      commit-message:
          prefix: "chore(deps)"
      # Storybook's packages must move in lockstep: a bump of `storybook` alone leaves the addons
      # and renderers on the old version and Storybook refuses to start. The group comes first
      # (Dependabot puts a dependency in the first group that matches) and takes every update type,
      # so a major moves them together too. addon-console is a separate project with its own versions.
      groups:
          storybook:
              applies-to: version-updates
              patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
              exclude-patterns: ["@storybook/addon-console"]
          storybook-security:
              applies-to: security-updates
              patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
              exclude-patterns: ["@storybook/addon-console"]
          npm-minor-and-patch:
              update-types: ["minor", "patch"]

    - package-ecosystem: github-actions
      directories: ["/", "/.github/actions/*"]
      # visual-seed.yml is generated by `visual-review init` from visual-review/templates/visual-seed.yml,
      # and a test fails when the two differ, so a bump of the generated file alone broke master (#3898).
      # Its action versions move by editing the template and regenerating, never here.
      exclude-paths: [".github/workflows/visual-seed.yml"]
      schedule:
          interval: weekly
          day: monday
      labels: ["dependencies"]
      commit-message:
          prefix: "chore(deps)"
      groups:
          actions-minor-and-patch:
              update-types: ["minor", "patch"]
