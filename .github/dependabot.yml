# Dependabot opens SECURITY updates only. Routine version updates are off (`open-pull-requests-limit: 0`,
# GitHub's documented switch: version updates stop, security updates continue), because they failed many
# pull requests at once several times: Storybook bumped out of lockstep, and Actions bumps of the generated
# visual-seed.yml (#3898). Routine refreshes happen once per production promotion instead: promote.yml's
# "Refresh dependencies" job runs tools/dependency-refresh.mjs, which opens one grouped pull request (owner,
# 2026-10-27). A security update targets master and merges like any other once CI is green
# (dependabot-automerge.yml arms auto-merge, except for GitHub Actions, which the owner merges).
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 0
      labels: ["dependencies"]
      commit-message:
          prefix: "chore(deps)"
      # One pull request per security fix batch. Storybook's packages must move in lockstep (a bump of
      # `storybook` alone leaves the addons and renderers behind and Storybook refuses to start), so they
      # come first in a group of their own: Dependabot puts a dependency in the first group that matches.
      # addon-console is a separate project with its own versions.
      groups:
          storybook-security:
              applies-to: security-updates
              patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
              exclude-patterns: ["@storybook/addon-console"]
          npm-security:
              applies-to: security-updates
              patterns: ["*"]

    - package-ecosystem: github-actions
      directories: ["/", "/.github/actions/*"]
      # visual-seed.yml is generated by `visual-review init` from visual-review/templates/visual-seed.yml,
      # and a test fails when the two differ, so a bump of the generated file alone broke master (#3898).
      # Its action versions move by editing the template and regenerating, never here.
      exclude-paths: [".github/workflows/visual-seed.yml"]
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 0
      labels: ["dependencies"]
      commit-message:
          prefix: "chore(deps)"
      groups:
          actions-security:
              applies-to: security-updates
              patterns: ["*"]
