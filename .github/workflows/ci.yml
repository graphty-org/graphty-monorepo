name: CI

on:
    push:
        branches: [master]
    pull_request:
        # No "labeled": no job reads labels any more (Chromatic's label is switched off), and Mergify adds
        # and removes labels (queued, dequeued) on every queued pull request, each of which re-ran all of CI.
        # A draft runs nothing (see the build job), so marking it ready ("ready_for_review") starts its run.
        types: [opened, synchronize, reopened, ready_for_review]
    # Manual trigger. GitHub twice declined to queue a run for a push to master
    # (4ca5f8a and 756117b both reached the remote with zero runs created for
    # their SHA, while every workflow showed state=active). Without a dispatch
    # trigger the only way to recover is an empty commit, which puts noise in
    # the history to work around a scheduling hiccup.
    workflow_dispatch:
        inputs:
            chromatic:
                description: "Publish Chromatic builds for the affected projects (billed per snapshot)"
                type: boolean
                default: false

# A new commit on a pull request cancels that pull request's older run: its result can no longer
# merge anything, and the runners it holds are what every other pull request is queued behind.
# A push to master never cancels (each master commit is released and deployed from its own run).
concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Note: We use local Nx caching only (no Nx Cloud)
# Cache is stored in .nx/cache and persisted via actions/cache

# Every job names ubuntu-24.04 rather than ubuntu-latest. The label is not a constant: it became 24.04 during
# 2026 with no change here, which is how the webgpu-graph-algorithms node shard came to judge its kernels on a
# Mesa software rasteriser (25.2.8 / LLVM 20) two major versions newer than the one every gate record measured
# (23.2.1 / LLVM 15) -- see webgpu-graph-algorithms/docs/decisions/G-ENV.md. GitHub has announced the same move
# again: ubuntu-latest becomes Ubuntu 26 from 2026-10-19 (actions/runner-images#14748). Naming the image makes
# that a commit we review rather than a Tuesday morning. Pinning is a no-op today; ubuntu-latest IS 24.04.
# Three kinds of run (design/ci/ci-cd-plan.md, sections 3, 5 and 8):
# - a pull request: the affected suite, the screenshots and the visual gate. A draft runs nothing:
#   agents iterate on drafts behind the local pre-push gate and mark them ready when done.
# - a Mergify merge-queue run: a draft pull request on a mergify/merge-queue/* branch, holding master
#   plus the pull requests being merged. It runs the FULL suite, every shard of every package, and is
#   held to master's rule that every job succeeds. "Queue Checks Pass" is its verdict.
# - a push to master or a manual dispatch: the full suite, which release.yml and deploy-pages.yml use.
jobs:
    # Build job - runs once, shares artifacts with test shards. Skipping it on a draft skips every job
    # that needs it; the two summary jobs check the same condition.
    build:
        name: Build
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'mergify/merge-queue/')
        runs-on: ubuntu-24.04
        # What the rest of the run tests, decided once here: the test job's matrix and the Chromatic jobs'
        # conditions read these instead of each asking nx again. See the "Plan" step below.
        outputs:
            full: ${{ steps.plan.outputs.full }}
            affected: ${{ steps.plan.outputs.affected }}
            test-matrix: ${{ steps.plan.outputs.test-matrix }}
            test-count: ${{ steps.plan.outputs.test-count }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Plan which packages this run tests. A pull request tests only what nx calls affected: the
            # packages it changed plus every package that depends on them. Each pull request run used to be
            # about 30 jobs against an organisation limit of about 60 concurrent jobs, so two open pull
            # requests queued each other; a pull request confined to graph-io now runs one test shard, not
            # twenty-one. A push to master and a manual dispatch pass every project as "affected", so they
            # run every shard and every Chromatic job exactly as before -- master is still fully tested
            # before release.yml publishes anything.
            # What counts as "everything" on a pull request is nx.json's sharedGlobals: the root TypeScript,
            # ESLint, Vite and Vitest configs, pnpm-workspace.yaml, .npmrc and every file under
            # .github/workflows (nx already treats nx.json, package.json and pnpm-lock.yaml that way). A
            # change to any of them affects every project, so it runs the full set here too.
            # The shard list itself lives in tools/ci-test-matrix.mjs, which filters it; the base is named
            # explicitly for the same reason as "Build affected (PR)" below. A merge-queue run is a pull
            # request event but tests everything, like master: full=true selects the master path for the
            # build and lint steps below as well.
            - name: Plan affected projects and test shards
              id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  HEAD_REF: ${{ github.head_ref }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  all=$(pnpm exec nx show projects --json)
                  if [[ "$EVENT" == "pull_request" && "$HEAD_REF" != mergify/merge-queue/* ]]; then
                      echo "full=false" >> "$GITHUB_OUTPUT"
                      affected=$(pnpm exec nx show projects --affected --base="origin/$BASE_REF" --head=HEAD --json)
                  else
                      echo "full=true" >> "$GITHUB_OUTPUT"
                      affected="$all"
                  fi
                  node tools/ci-test-matrix.mjs "$all" "$affected" | tee -a "$GITHUB_OUTPUT"

            # The shard groups, the draft and merge-queue conditions and the title check's queue exemption.
            - name: CI workflow tests
              run: pnpm run test:ci-workflows

            # Security audit - run early to catch vulnerabilities before building
            # Only fail on critical and high severity vulnerabilities
            - name: Security audit
              run: pnpm audit --audit-level=high

            - name: Cache Nx
              uses: actions/cache@v4
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
                      nx-${{ runner.os }}-build-

            # PR: Build then lint (build first for type dependencies). The base is named explicitly: the checkout
            # has every branch as a remote-tracking ref (fetch-depth 0) but no local master, and nx.json's
            # defaultBase "master" made nx affected fail with "unknown revision" on the first pull_request run
            - name: Build affected (PR)
              if: steps.plan.outputs.full == 'false'
              run: pnpm exec nx affected -t build --parallel=3 --base=origin/${{ github.base_ref }} --head=HEAD

            # Every test shard downloads every package's dist, so every package must be built even when the
            # pull request leaves it unaffected: an upload that finds no files creates no artifact, and the
            # shard's download then fails with "Artifact not found". This step used to name only
            # graph-format, graph-io and webgpu-graph-algorithms, the packages outside graphty's dependency
            # closure, which held while a pull request touching one of them also touched the element -- a
            # pull request confined to webgpu-graph-algorithms left graphty, graphty-element, remote-logger
            # and compact-mantine unbuilt and failed all twenty shards (run 35668273734). Building every
            # project is what master already does, and the Nx cache makes it a no-op for whatever the
            # affected build above produced.
            - name: Build the rest (PR), so every shard finds its artifact
              if: steps.plan.outputs.full == 'false'
              run: pnpm exec nx run-many -t build --parallel=3
              env:
                  NODE_OPTIONS: "--max-old-space-size=8192"
                  VITE_BASE_PATH: /
                  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
                  VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
                  VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Lint affected (PR)
              if: steps.plan.outputs.full == 'false'
              run: pnpm exec nx affected -t lint --parallel=3 --base=origin/${{ github.base_ref }} --head=HEAD

            # Master, every manual dispatch and every merge-queue run (full=true from the plan step): build
            # then lint (build first for type dependencies).
            # graphty build needs Sentry env vars for error tracking.
            #
            # The dispatch clause stands on its own rather than sitting inside the master test, because each
            # trigger has to reach exactly one build: a pull request builds in the steps above, a push to master
            # builds here, and a dispatch builds here whatever ref it names. The earlier shape, master AND (push
            # OR dispatch), left a dispatch against a BRANCH matching neither group -- nothing was built, the
            # uploads below found no files to attach, and all twenty test shards failed at their first artifact
            # download (run 35943267536, this branch). A branch dispatch cannot take the pull request's
            # `nx affected` path, which needs a base ref to diff against and a dispatch has none, so it takes
            # this one and builds every project -- which is what the shards need from it anyway.
            - name: Build all (master, a manual dispatch or the merge queue)
              if: steps.plan.outputs.full == 'true'
              run: pnpm exec nx run-many -t build --parallel=3
              env:
                  NODE_OPTIONS: "--max-old-space-size=8192"
                  VITE_BASE_PATH: /
                  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
                  VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
                  VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Lint all (master, a manual dispatch or the merge queue)
              if: steps.plan.outputs.full == 'true'
              run: pnpm exec nx run-many -t lint --parallel=3

            # Every package is built by now on both paths (PR builds the rest above). knip reads
            # source; the production pass counts only published entry points. The published-deps
            # check packs each package and compares what it ships with what it declares, so it
            # must run after the build. The same three steps run in tools/prepush.sh.
            - name: Knip (dead code detection)
              run: pnpm run lint:knip

            - name: Knip (production dependencies)
              run: pnpm run lint:knip:prod

            - name: Published dependencies
              run: pnpm run check:published-deps

            # The same three checks run in tools/prepush.sh. The first two read no build output; the
            # bundle size check measures graphty-element's dist/ against graphty-element/size-budgets.json.
            - name: ESLint root config
              run: pnpm run lint:eslint-root

            - name: Formatting (changed files)
              if: github.event_name == 'pull_request'
              run: pnpm run format:check:changed origin/${{ github.base_ref }}

            - name: Bundle size (graphty-element)
              run: pnpm run check:bundle-size

            # graphty-element's public API, as built, must match the committed report
            # (graphty-element/api/*.api.md, one per typed entry point in its package.json "exports").
            # A change fails here until `npm run api:report` in graphty-element regenerates the report,
            # so every API change shows up in the pull request as a diff of that report.
            # The same check runs in tools/prepush.sh.
            - name: Public API report (graphty-element)
              run: pnpm run check:api-report

            - name: Declared build tools
              run: pnpm run check:declared-tools

            # release-hold.json names only real nx projects, each with a reason and a date, so a typo
            # cannot silently release a package someone meant to hold. The same check runs in tools/prepush.sh.
            - name: Release hold list
              run: pnpm run check:release-hold

            # Element data sources read files through @graphty/graph-io importers, not their own
            # parsers. The same check runs in tools/prepush.sh.
            - name: Element data sources on graph-io
              run: pnpm run check:data-source-migration

            # The import reader of the script that prints the counts in design/graph-format/STATUS.md.
            - name: Migration count script
              run: pnpm run check:migration-counts

            # Reads source only. Any use of the legacy graph API (a legacy algorithms or layout
            # name, the legacy Graph, a positional layout, an element parser not on graph-io) fails.
            # The same check runs in tools/prepush.sh.
            - name: Legacy graph API use
              run: pnpm run check:legacy-use

            - name: Build Storybook (graphty-element)
              run: pnpm exec nx run graphty-element:build-storybook

            - name: Build Storybook (graphty)
              run: pnpm exec nx run graphty:build-storybook

            - name: Build Storybook (compact-mantine)
              run: pnpm exec nx run compact-mantine:build-storybook

            - name: Build Storybook (algorithms)
              run: pnpm exec nx run algorithms:build-storybook

            - name: Build Storybook (layout)
              run: pnpm exec nx run layout:build-storybook

            # Build unified documentation on every run, so a pull request that breaks the docs
            # (a dead link included: VitePress fails the build on one) fails here rather than on
            # master. The docs and both gh-pages builds are uploaded on every run because the
            # "Links" job checks every link to graphty.app against the site they assemble into.
            - name: Build docs
              run: npm run docs:build

            - name: Build algorithms gh-pages
              run: pnpm exec nx run algorithms:build:gh-pages

            - name: Build layout gh-pages
              run: pnpm exec nx run layout:build:gh-pages

            # Every package's dist in one artifact, so a test shard fetches them in one request.
            # The per-package artifacts below stay: release.yml and deploy-pages.yml download them
            # by name.
            - name: Upload all package builds
              uses: actions/upload-artifact@v4
              with:
                  name: build-packages
                  path: |
                      graph-format/dist/
                      graph-io/dist/
                      webgpu-graph-algorithms/dist/
                      graph-samples/dist/
                      algorithms/dist/
                      layout/dist/
                      graphty/dist/
                      graphty-element/dist/
                      remote-logger/dist/
                      compact-mantine/dist/
                  retention-days: 1

            - name: Upload graph-format build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-format
                  path: graph-format/dist/
                  retention-days: 1

            - name: Upload graph-io build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-io
                  path: graph-io/dist/
                  retention-days: 1

            - name: Upload webgpu-graph-algorithms build
              uses: actions/upload-artifact@v4
              with:
                  name: build-webgpu-graph-algorithms
                  path: webgpu-graph-algorithms/dist/
                  retention-days: 1

            - name: Upload graph-samples build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-samples
                  path: graph-samples/dist/
                  retention-days: 1

            - name: Upload algorithms build
              uses: actions/upload-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/
                  retention-days: 1

            - name: Upload layout build
              uses: actions/upload-artifact@v4
              with:
                  name: build-layout
                  path: layout/dist/
                  retention-days: 1

            - name: Upload graphty build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/
                  retention-days: 1

            - name: Upload graphty-element build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graphty-element
                  path: graphty-element/dist/
                  retention-days: 1

            - name: Upload remote-logger build
              uses: actions/upload-artifact@v4
              with:
                  name: build-remote-logger
                  path: remote-logger/dist/
                  retention-days: 1

            - name: Upload compact-mantine build
              uses: actions/upload-artifact@v4
              with:
                  name: build-compact-mantine
                  path: compact-mantine/dist/
                  retention-days: 1

            - name: Upload Storybook build (graphty-element)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (graphty)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (compact-mantine)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (algorithms)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (layout)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-layout
                  path: layout/storybook-static/
                  retention-days: 1

            # Upload documentation artifacts (deploy-pages publishes them; the Links job checks them)
            - name: Upload unified docs
              uses: actions/upload-artifact@v4
              with:
                  name: build-docs
                  path: docs/.vitepress/dist/
                  retention-days: 1

            - name: Upload algorithms gh-pages
              uses: actions/upload-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: algorithms/gh-pages/
                  retention-days: 1

            - name: Upload layout gh-pages
              uses: actions/upload-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: layout/gh-pages/
                  retention-days: 1

    # Sharded test jobs - run in parallel, collect coverage
    # Sharded test jobs - run in parallel, collect coverage. The matrix comes from the build job's plan
    # (tools/ci-test-matrix.mjs holds every shard and why it is split the way it is): every shard on master,
    # only the affected packages' shards on a pull request. A pull request that affects no package (a docs
    # or tools change) has no shards, and GitHub fails a job whose matrix is empty instead of skipping it,
    # so the job is skipped by its condition; "All Checks Pass" counts a skipped job as passing only on a
    # pull request.
    test:
        name: Test (${{ matrix.shard }})
        needs: build
        if: needs.build.outputs.test-count != '0'
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.test-matrix) }}

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # One download instead of one per package: about twenty shards starting at once, each
            # making ten requests, drew 403 errors from the artifact service (#252). The archive
            # keeps each package's path, so it unpacks into place at the repository root. A failed
            # download is tried once more.
            - name: Download all package builds
              id: download-packages
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Download all package builds (retry)
              if: steps.download-packages.outcome == 'failure'
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Cache Playwright browsers
              if: matrix.needs-browser
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install Playwright browsers
              if: matrix.needs-browser && steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium --with-deps

            - name: Install Playwright deps (if cached)
              if: matrix.needs-browser && steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            # webgpu-graph-algorithms node shard: Dawn needs a Vulkan ICD; ubuntu-24.04 has none preinstalled
            - name: Install Mesa lavapipe
              if: matrix.needs-lavapipe
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools

            # The software rasteriser this lane judges every kernel on is whatever apt resolves on the day, and it
            # moved two major Mesa versions (23.2.1 / LLVM 15 -> 25.2.8 / LLVM 20) without anything recording it.
            # Print the image, the C library and the installed Mesa version so a lane's environment is readable
            # from its own log instead of inferred from the runner label. Never fails the step.
            - name: Record the image, glibc and rasteriser versions
              if: matrix.needs-lavapipe
              run: |
                  { grep PRETTY_NAME /etc/os-release
                    ldd --version | head -1
                    dpkg-query -W -f '${Package} ${Version}\n' mesa-vulkan-drivers libvulkan1 libegl1
                  } || true

            - name: Locate the lavapipe ICD and export the lane's environment
              if: matrix.needs-lavapipe
              run: |
                  # find, not ls with globs: the ICD's file name moved between Mesa releases (lvp_icd.json on noble,
                  # lvp_icd.x86_64.json on jammy); an unmatched glob makes ls exit 2 under bash -e
                  icd=$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d /usr/lib/x86_64-linux-gnu/vulkan/icd.d -name 'lvp_icd*.json' 2>/dev/null | sort | head -1 || true)
                  if [ -z "$icd" ]; then
                      echo "::error::no lavapipe ICD json after installing mesa-vulkan-drivers"
                      dpkg -L mesa-vulkan-drivers | grep -i 'json\|lvp\|lavapipe' || true
                      exit 1
                  fi
                  echo "lavapipe ICD: $icd"
                  VK_DRIVER_FILES="$icd" vulkaninfo --summary 2>/dev/null | head -40 || true
                  {
                      echo "VK_DRIVER_FILES=$icd"
                      echo "GRAPHTY_GPU_ADAPTER=llvmpipe"
                      echo "GRAPHTY_GPU_REQUIRE=any"
                      echo "XDG_RUNTIME_DIR=/tmp"
                  } >> "$GITHUB_ENV"

            # A forked vitest worker that crashes must not spend minutes writing a multi-gigabyte core dump.
            # scripts/run-node-shard.js runs vitest under `ulimit -c 0`, but the runner's default core_pattern
            # pipes cores to a program, and the kernel ignores RLIMIT_CORE for a piped pattern (core(5)). A plain
            # file pattern makes the limit bind. Issue #273.
            - name: Write core dumps to a file so the shard's ulimit -c 0 holds
              if: matrix.shard == 'webgpu-graph-algorithms-node'
              run: echo "core_pattern was $(cat /proc/sys/kernel/core_pattern)" && sudo sysctl -w kernel.core_pattern=core

            - name: Run tests
              run: ${{ matrix.test-command }}

            - name: Upload blob report
              if: ${{ !cancelled() && startsWith(matrix.shard, 'graphty-element') }}
              uses: actions/upload-artifact@v4
              with:
                  name: blob-report-${{ matrix.shard }}
                  path: graphty-element/.vitest-reports/*
                  include-hidden-files: true
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (graphty-element)
              if: ${{ !cancelled() && startsWith(matrix.shard, 'graphty-element') }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: graphty-element/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: ignore

            # A shard group (tools/ci-test-matrix.mjs, GROUPS) uploads one artifact holding a
            # coverage-<shard>/lcov.info directory per member, the name each shard's own artifact had;
            # coverage.yml lifts them back out before tools/merge-coverage.sh reads them.
            - name: Collect the shard group's coverage
              if: ${{ !cancelled() && matrix.coverage }}
              env:
                  COVERAGE: ${{ matrix.coverage }}
              run: |
                  for pair in $COVERAGE; do
                      shard="${pair%%=*}" file="${pair#*=}"
                      [[ -f "$file" ]] || continue
                      mkdir -p "$RUNNER_TEMP/coverage/coverage-$shard"
                      cp "$file" "$RUNNER_TEMP/coverage/coverage-$shard/lcov.info"
                  done

            - name: Upload coverage (shard group)
              if: ${{ !cancelled() && matrix.coverage }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-group-${{ matrix.shard }}
                  path: ${{ runner.temp }}/coverage/
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (webgpu-graph-algorithms)
              if: ${{ !cancelled() && matrix.shard == 'webgpu-graph-algorithms-node' }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: webgpu-graph-algorithms/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: error
                  overwrite: true

            # The device-error project's own run: a second artifact for the same package, which
            # tools/merge-coverage.sh collects by the coverage-<package>-<shard> prefix and merges with the one
            # above before rewriting the paths (it already does this for the graphty-element shards).
            - name: Upload coverage (webgpu-graph-algorithms, the device-error project)
              if: ${{ !cancelled() && matrix.shard == 'webgpu-graph-algorithms-node' }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}-device-errors
                  path: webgpu-graph-algorithms/.coverage-parts/device-errors/lcov.info
                  retention-days: 1
                  if-no-files-found: error
                  overwrite: true

    # Chromatic visual regression testing (graphty-element)
    # ALL CHROMATIC JOBS ARE SWITCHED OFF (they need the repository variable CHROMATIC_ENABLED) until the self-hosted visual review replaces them:
    # Chromatic's paid plans have no hard spending cap. Turning one back on is an owner decision.
    # Chromatic bills every snapshot, and running it on every push cost thousands of dollars a month
    # (September 2026: 481,000 snapshots). So it is opt-in: a Chromatic job runs only on a pull request
    # that carries the "chromatic" label (and only when its package is affected, which includes a change
    # to anything it depends on), or on a manual dispatch with the chromatic input set. It never runs on
    # a push to master. Its Storybook is built in every run regardless, because the Links job checks the
    # assembled site.
    chromatic-element:
        name: Chromatic (graphty-element)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
        if: vars.CHROMATIC_ENABLED == 'owner-approved'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_ELEMENT }}
                  storybookBuildDir: ./graphty-element/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (graphty app)
    chromatic-app:
        name: Chromatic (graphty)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
