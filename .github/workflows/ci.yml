                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Dead links: relative links and anchors, this repository's files on GitHub, everything else
    # under github.com/graphty-org, and every link to graphty.app -- checked against the site the
    # next deploy would publish, assembled here from this run's artifacts by the same script
    # deploy-pages.yml runs. See tools/check-links.sh. External links are checked weekly instead
    # (links-weekly.yml), so another site's outage never fails a pull request.
    links:
        name: Links
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Download graphty build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/

            - name: Download unified docs
              uses: actions/download-artifact@v4
              with:
                  name: build-docs
                  path: docs/.vitepress/dist/

            - name: Download Storybook build (graphty-element)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/

            - name: Download Storybook build (graphty)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/

            - name: Download Storybook build (compact-mantine)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/

            - name: Download Storybook build (algorithms)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/

            - name: Download Storybook build (layout)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-layout
                  path: layout/storybook-static/

            - name: Download algorithms gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: algorithms/gh-pages/

            - name: Download layout gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: layout/gh-pages/

            - name: Assemble the GitHub Pages site
              run: ./tools/assemble-pages-site.sh "$RUNNER_TEMP/site"

            - name: Check links
              run: ./tools/check-links.sh --site "$RUNNER_TEMP/site"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The algorithms benchmark table (master branch only): a measurement, with no baseline to compare.
    # Advisory: release.yml, deploy-pages.yml and coverage.yml read the run's conclusion, and a
    # measurement with no pass/fail role must not hold them.
    performance:
        name: Performance Benchmarks
        needs: test
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Every package's dist: the benchmark runs algorithms from source under tsx, and that
            # source imports @graphty/graph-format, which resolves to graph-format's dist.
            - name: Download all package builds
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Run the algorithms benchmarks
              run: pnpm exec nx run algorithms:benchmark
              env:
                  CI: "true"
                  NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"

    # graphty-element's cost estimates held against a stopwatch (issue #236). The test times real
    # algorithm runs and scales the estimate by the element's own calibration probe, so it reads the
    # same on this runner as on a workstation. It runs on every pull request that affects
    # graphty-element and on every full run, and "All Checks Pass" needs it: a check that ran only on
    # master could only ever turn master red (design/ci/ci-cd-plan.md, section 3). Each failure names
    # the row, the graph, n, m, both times and the ratio; every row's ratio also lands in the job summary.
    cost-accuracy:
        name: Cost Estimate Accuracy
        needs: build
        if: contains(fromJSON(needs.build.outputs.affected), 'graphty-element')
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all package builds
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Time the estimates against real runs
              working-directory: graphty-element
              run: |
                  set -o pipefail
                  COST_GUARD_VERBOSE=1 npm run test:cost 2>&1 | tee "$RUNNER_TEMP/cost.log"

            - name: Write the ratios to the job summary
              if: ${{ !cancelled() }}
              run: |
                  {
                      echo "### Cost estimate / measured run (bounds 0.95 to 4)"
                      echo '```'
                      grep -E "ratio [0-9.]+, machine speed" "$RUNNER_TEMP/cost.log" || echo "no rows ran"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    # Visual review: screenshot every story of a built Storybook and compare it with the baseline PNGs
    # in visual-baselines/ (@graphty/visual-review in visual-review/, configured by
    # visual-review.config.json, design in design/visual-testing/design.md). This job is the "visual"
    # job of the package's workflow template (visual-review/templates/visual-review.yml) with two
    # differences: the matrix is written out here, and the Storybook is downloaded from this run's
    # build job instead of built again. A test (visual-review/test/workflows.test.mjs) keeps the
    # commands the same as the template's. The owner reviews
    # the uploaded captures in the page `visual-review serve` runs on their machine; that page finds this
    # job by its name ("visual (<project>)") and the artifact by "visual-<project>-<attempt>" (the attempt
    # avoids upload-artifact v4's same-name conflict on a re-run; readers take the highest attempt). Changes are never a failure here:
    # the job fails only when the tool itself crashes, and continue-on-error keeps even that from failing
    # the run, because release.yml, deploy-pages.yml and coverage.yml gate on the run's conclusion. What
    # blocks a pull request is the step in "All Checks Pass" that reads the results. 45 minutes: an
    # unseeded project captures every story twice (as new), about 7 minutes for graphty-element on a
    # 4-worker development machine; CI runners are slower and not yet measured.
    visual:
        name: visual (${{ matrix.project }})
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            # To download master's newest capture (the reference step below).
            actions: read
        continue-on-error: true
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: compact-mantine
                      artifact: build-storybook-compact-mantine
                    - project: graphty-element
                      artifact: build-storybook-element
                    - project: layout
                      artifact: build-storybook-layout
                    - project: algorithms
                      artifact: build-storybook-algorithms
                    - project: graphty
                      artifact: build-storybook-app
        steps:
            # Baseline PNGs are Git LFS objects. The checkout leaves them as pointer files (no job fetches
            # LFS objects by default); this job alone fetches them, and only its own project's, plus the
            # pinned fonts every capture draws with (visual-fonts/, the config's "fontconfig"). The objects
            # are cached in the Actions cache keyed by the pointer files' hash (which is the list of object
            # ids), so a run downloads from LFS only the images accepted since the cache was saved, and the
            # organisation's LFS bandwidth (250 GiB a month, a $0 budget that blocks rather than bills)
            # stays near zero. design/visual-testing/design.md section 7 has the estimate. Depth 2 for the
            # base branch tip (HEAD^1 of a pull request's merge commit), whose capture code runs below.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Restore this project's baseline images
              uses: actions/cache@v4
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ matrix.project }}-${{ hashFiles(format('visual-baselines/{0}/**/*.png', matrix.project), 'visual-fonts/fonts/**') }}
                  restore-keys: lfs-${{ matrix.project }}-

            - name: Fetch this project's baseline images and the pinned fonts from Git LFS
              run: git lfs pull --include "visual-baselines/${{ matrix.project }}/**,visual-fonts/**"

            # A pull request runs the base branch's copy of the tool (capture and the trusted code it
            # imports), never its own: code that wrote "unchanged" for everything would otherwise pass
            # the gate. A change to capture is first exercised here by the pull request after it.
            - name: Use the base branch's capture code
              if: github.event_name == 'pull_request'
              run: |
                  rm -rf visual-review/capture visual-review/trusted
                  git archive HEAD^1 visual-review/capture visual-review/trusted | tar -x

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Keyed by the Playwright version capture imports, so a bump downloads the matching Chromium.
            - name: Read the Playwright version
              id: playwright
              run: echo "version=$(node -p 'require("./visual-review/package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            # With the browser cached this installs only the system libraries Chromium needs.
            - name: Install Chromium
              run: pnpm exec visual-review install-browser

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.project }}/storybook-static/

            # A story with no baseline that looks as it does in master's newest capture is "unseeded"; one
            # that differs, or is new, is "new". Both block until the owner accepts the story or seeds it.
            # Without a reference (none downloaded) every story with no baseline is "new".
            - name: Download master's newest capture
              id: reference
              if: github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "dir=$(pnpm exec visual-review reference --project ${{ matrix.project }} --out "$RUNNER_TEMP/reference")" >> "$GITHUB_OUTPUT"

            - name: Capture
              run: pnpm exec visual-review capture --project ${{ matrix.project }} --out "$RUNNER_TEMP/visual" --reference "${{ steps.reference.outputs.dir }}"

            # Kept even when capture crashed, so the owner sees the partial results.json.
            - name: Upload captures
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-${{ matrix.project }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/visual/
                  retention-days: 30

            - name: Write the counts to the job summary
              if: always()
              run: |
                  f="$RUNNER_TEMP/visual/results.json"
                  {
                      echo "### Visual review (${{ matrix.project }})"
                      if [[ -f "$f" ]]; then
                          jq -r '"seeded: \(.seeded), complete: \(.complete), \(.items | length) of \(.expected) items, master reference run: \(.reference)",
                              "", "| status | items |", "|---|---|",
                              (.items | group_by(.status)[] | "| \(.[0].status) | \(length) |")' "$f"
                      else
                          echo "No results.json: capture did not start."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

    # Gate job - ensures all required checks pass before release/deploy. It is the required status check,
    # so it runs even when a job it needs failed (if: always()) and decides for itself.
    # On a pull request a job this run chose not to start (a test job or Chromatic job for an unaffected
    # package) is "skipped", and skipped counts as passing; failure and cancelled never do. Build is needed
    # here and must succeed, because when it fails every other job is skipped too, and without it that
    # would read as a pass. On master, dispatch and the merge queue (the build job's full=true) every job
    # must succeed: nothing is meant to be skipped there, so a skip means the plan went wrong and must
    # not pass silently. A draft skips this job with the rest of the run.
    all-checks:
        name: All Checks Pass
        needs:
            [
                build,
                test,
                links,
                cost-accuracy,
                chromatic-element,
                chromatic-app,
                chromatic-compact-mantine,
                chromatic-algorithms,
                chromatic-layout,
                visual,
            ]
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'mergify/merge-queue/'))
        runs-on: ubuntu-24.04
        steps:
            - name: Check all jobs passed
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  FULL: ${{ needs.build.outputs.full }}
              run: |
                  ok='["success"]'
                  [[ "$FULL" == "false" ]] && ok='["success","skipped"]'
                  jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
                  # Chromatic jobs are opt-in (see chromatic-element), so a skipped one passes on every event.
                  # The visual job never decides here, whatever result job-level continue-on-error makes
                  # it report: on a pull request the gate step below judges its results.json, and on
                  # master a capture crash must not hold release, deploy or coverage.
                  bad=$(jq -r --argjson ok "$ok" \
                      'to_entries[] | select(.key != "visual") | select(.value.result as $r | (($ok | index($r)) == null and ((.key | startswith("chromatic-")) and $r == "skipped" | not)) or (.key == "build" and $r != "success")) | .key' \
                      <<<"$NEEDS")
                  if [[ -n "$bad" ]]; then
                      echo "::error::jobs that did not pass: $(echo $bad)"
                      exit 1
                  fi
                  echo "All checks passed!"

            # Until the owner has reviewed a pull request's visual changes, it does not merge. A project
            # of the base branch's or this pull request's visual-review.config.json, or with baselines on the
            # base branch, seeded or not (it fails closed), fails here when its newest capture (the highest attempt
            # of this run, so "Re-run failed jobs" cannot skip it) holds anything but unchanged or
            # excluded items (so every story without an approved baseline blocks, unseeded included),
            # or when that capture is missing, unfinished or invalid. It also fails when
            # a baseline PNG or an excluding settings file differs from the base without a review record
            # added in the pull request that names its new hash. Once visual-review/passkeys.json on the
            # base branch holds a key, every record the pull request adds must also carry the owner's
            # passkey approval (Face ID) over exactly that record and this pull request number, by a key
            # read from the base branch, never from the pull request; a pull request that would leave no
            # key fails (visual-review/README.md, "What the gate does and does not guarantee"). Pull requests only, so
            # master's release, deploy and coverage never wait. The logic is visual-review/trusted/gate.mjs
            # (standard library only), run as the base branch has it, never the pull request's copy, so a
            # pull request cannot loosen the gate that judges it (a change to the gate is first exercised
            # by the pull request after it); it reads visual-review.config.json from the base tip (sparse
            # checkout keeps the root's files). Depth 2 so HEAD^1, the merge ref's first parent, is the base tip
            # the pull request was merged onto; blobs are fetched only for the changed baselines, which are
            # Git LFS pointer files naming the image's SHA-256, so no LFS object is downloaded here.
            - name: Check out the gate
              if: github.event_name == 'pull_request'
              uses: actions/checkout@v4
              with:
                  sparse-checkout: visual-review
                  fetch-depth: 2
                  filter: blob:none

            - name: Download visual captures
              if: github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  pattern: visual-*
                  path: ${{ runner.temp }}/visual

            - name: Check visual changes were accepted
              if: github.event_name == 'pull_request'
              env:
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  gate="$RUNNER_TEMP/gate"
                  mkdir -p "$gate"
                  git archive HEAD^1 visual-review/trusted | tar -x -C "$gate"
                  # The base branch's gate takes --pr once it checks passkeys; one from before that does not.
                  pr=()
                  if grep -q -- "--pr <number>" "$gate/visual-review/trusted/gate.mjs"; then pr=(--pr "$PR"); fi
                  node "$gate/visual-review/trusted/cli.mjs" gate --captures "$RUNNER_TEMP/visual" "${pr[@]}" --base HEAD^1 --head HEAD

    # The merge queue's verdict, which Mergify's merge_conditions name. The job exists in every run so
    # the check name is always reported, but it succeeds only when "All Checks Pass" succeeded, and on a
    # mergify/merge-queue/* branch only when the run was the full suite: a pass on a pull request's own
    # affected run can never stand in for the queue's run.
    queue-checks:
        name: Queue Checks Pass
        needs: [build, all-checks]
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'mergify/merge-queue/'))
        runs-on: ubuntu-24.04
        steps:
            - name: Check the run passed, and was the full suite in the queue
              env:
                  ALL_CHECKS: ${{ needs.all-checks.result }}
                  FULL: ${{ needs.build.outputs.full }}
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  echo "All Checks Pass: $ALL_CHECKS, full suite: $FULL, branch: ${HEAD_REF:-none}"
                  if [[ "$ALL_CHECKS" != "success" ]]; then
                      echo "::error::All Checks Pass did not succeed"
                      exit 1
                  fi
                  if [[ "$HEAD_REF" == mergify/merge-queue/* && "$FULL" != "true" ]]; then
                      echo "::error::a merge-queue run must run the full suite"
                      exit 1
                  fi
