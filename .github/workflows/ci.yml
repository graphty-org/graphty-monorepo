                  path: layout/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_LAYOUT }}
                  storybookBuildDir: ./layout/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Performance regression tests (algorithms only, master branch)
    performance:
        name: Performance Tests
        needs: test
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/

            - name: Download performance baseline
              uses: actions/download-artifact@v4
              with:
                  name: performance-baseline
                  path: algorithms/test/
              continue-on-error: true

            - name: Run performance regression tests
              run: pnpm exec nx run algorithms:benchmark
              env:
                  CI: "true"
                  NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"

            - name: Upload performance baseline
              uses: actions/upload-artifact@v4
              with:
                  name: performance-baseline
                  path: algorithms/test/performance-baseline.json
                  retention-days: 90
                  if-no-files-found: ignore

    # Gate job - ensures all required checks pass before release/deploy
    all-checks:
        name: All Checks Pass
        needs: [test, chromatic-element, chromatic-app, chromatic-compact-mantine, chromatic-algorithms, chromatic-layout]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check all jobs passed
              run: |
                  if [[ "${{ needs.test.result }}" != "success" ]]; then
                    echo "Test job failed"
                    exit 1
                  fi
                  if [[ "${{ needs.chromatic-element.result }}" != "success" ]]; then
                    echo "Chromatic (graphty-element) job failed"
                    exit 1
                  fi
                  if [[ "${{ needs.chromatic-app.result }}" != "success" ]]; then
                    echo "Chromatic (graphty) job failed"
                    exit 1
                  fi
                  if [[ "${{ needs.chromatic-compact-mantine.result }}" != "success" ]]; then
                    echo "Chromatic (compact-mantine) job failed"
                    exit 1
                  fi
                  if [[ "${{ needs.chromatic-algorithms.result }}" != "success" ]]; then
                    echo "Chromatic (algorithms) job failed"
                    exit 1
                  fi
                  if [[ "${{ needs.chromatic-layout.result }}" != "success" ]]; then
                    echo "Chromatic (layout) job failed"
                    exit 1
                  fi
                  echo "All checks passed!"
