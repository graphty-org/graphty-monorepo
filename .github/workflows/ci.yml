name: CI

on:
    push:
        branches: [master]
    pull_request:
    # Manual trigger. GitHub twice declined to queue a run for a push to master
    # (4ca5f8a and 756117b both reached the remote with zero runs created for
    # their SHA, while every workflow showed state=active). Without a dispatch
    # trigger the only way to recover is an empty commit, which puts noise in
    # the history to work around a scheduling hiccup.
    workflow_dispatch:

# Note: We use local Nx caching only (no Nx Cloud)
# Cache is stored in .nx/cache and persisted via actions/cache

jobs:
    # Lint PR titles with commitlint
    lint-pr:
        name: Lint PR Title
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Lint PR title
              run: echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint

    # Build job - runs once, shares artifacts with test shards
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Security audit - run early to catch vulnerabilities before building
            # Only fail on critical and high severity vulnerabilities
            - name: Security audit
              run: pnpm audit --audit-level=high

            - name: Cache Nx
              uses: actions/cache@v4
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
                      nx-${{ runner.os }}-build-

            # PR: Build then lint (build first for type dependencies). The base is named explicitly: the checkout
            # has every branch as a remote-tracking ref (fetch-depth 0) but no local master, and nx.json's
            # defaultBase "master" made nx affected fail with "unknown revision" on the first pull_request run
            - name: Build affected (PR)
              if: github.event_name == 'pull_request'
              run: pnpm exec nx affected -t build --parallel=3 --base=origin/${{ github.base_ref }} --head=HEAD

            # graph-format, graph-io and webgpu-graph-algorithms are not yet in graphty's dependency closure (the consumer
            # migration of design/graph-format section 14 is pending), so a PR that touches only the
            # older packages leaves their dist/ unbuilt; the Upload steps below would then produce no
            # artifact and every test shard's Download step would fail with "Artifact not found".
            # Build them explicitly; the Nx cache makes this a no-op when the affected build already did.
            - name: Build graph-format, graph-io and webgpu-graph-algorithms (PR)
              if: github.event_name == 'pull_request'
              run: pnpm exec nx run-many -t build --projects=graph-format,graph-io,webgpu-graph-algorithms --parallel=3

            - name: Lint affected (PR)
              if: github.event_name == 'pull_request'
              run: pnpm exec nx affected -t lint --parallel=3 --base=origin/${{ github.base_ref }} --head=HEAD

            # Master: Build then lint (build first for type dependencies)
            # graphty build needs Sentry env vars for error tracking
            - name: Build all (master)
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm exec nx run-many -t build --parallel=3
              env:
                  NODE_OPTIONS: "--max-old-space-size=8192"
                  VITE_BASE_PATH: /
                  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
                  VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
                  VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Lint all (master)
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm exec nx run-many -t lint --parallel=3

            - name: Build Storybook (graphty-element)
              run: pnpm exec nx run graphty-element:build-storybook

            - name: Build Storybook (graphty)
              run: pnpm exec nx run graphty:build-storybook

            - name: Build Storybook (compact-mantine)
              run: pnpm exec nx run compact-mantine:build-storybook

            - name: Build Storybook (algorithms)
              run: pnpm exec nx run algorithms:build-storybook

            - name: Build Storybook (layout)
              run: pnpm exec nx run layout:build-storybook

            # Build unified documentation (only on master, for deploy-pages)
            - name: Build docs
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: npm run docs:build

            - name: Build algorithms gh-pages
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm exec nx run algorithms:build:gh-pages

            - name: Build layout gh-pages
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm exec nx run layout:build:gh-pages

            - name: Upload graph-format build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-format
                  path: graph-format/dist/
                  retention-days: 1

            - name: Upload graph-io build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-io
                  path: graph-io/dist/
                  retention-days: 1

            - name: Upload webgpu-graph-algorithms build
              uses: actions/upload-artifact@v4
              with:
                  name: build-webgpu-graph-algorithms
                  path: webgpu-graph-algorithms/dist/
                  retention-days: 1

            - name: Upload algorithms build
              uses: actions/upload-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/
                  retention-days: 1

            - name: Upload layout build
              uses: actions/upload-artifact@v4
              with:
                  name: build-layout
                  path: layout/dist/
                  retention-days: 1

            - name: Upload graphty build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/
                  retention-days: 1

            - name: Upload graphty-element build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graphty-element
                  path: graphty-element/dist/
                  retention-days: 1

            - name: Upload remote-logger build
              uses: actions/upload-artifact@v4
              with:
                  name: build-remote-logger
                  path: remote-logger/dist/
                  retention-days: 1

            - name: Upload compact-mantine build
              uses: actions/upload-artifact@v4
              with:
                  name: build-compact-mantine
                  path: compact-mantine/dist/
                  retention-days: 1

            - name: Upload Storybook build (graphty-element)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (graphty)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (compact-mantine)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (algorithms)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (layout)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-layout
                  path: layout/storybook-static/
                  retention-days: 1

            # Upload documentation artifacts (only on master)
            - name: Upload unified docs
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              uses: actions/upload-artifact@v4
              with:
                  name: build-docs
                  path: docs/.vitepress/dist/
                  retention-days: 1

            - name: Upload algorithms gh-pages
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              uses: actions/upload-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: algorithms/gh-pages/
                  retention-days: 1

            - name: Upload layout gh-pages
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              uses: actions/upload-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: layout/gh-pages/
                  retention-days: 1

    # Sharded test jobs - run in parallel, collect coverage
    test:
        name: Test (${{ matrix.shard }})
        needs: build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard:
                    - graph-format
                    - graph-io
                    - webgpu-graph-algorithms-node
                    - webgpu-graph-algorithms-browser
                    - algorithms-default
                    - algorithms-browser
                    - layout
                    - graphty
                    - remote-logger
                    - compact-mantine
                    - graphty-element-default
                    - graphty-element-browser-1
                    - graphty-element-browser-2
                    - graphty-element-browser-3
                    - graphty-element-browser-4
                    - graphty-element-browser-5
                    - graphty-element-storybook-1
                    - graphty-element-storybook-2
                    - graphty-element-storybook-3
                    - graphty-element-storybook-4
                include:
                    # graph-format - single shard (Node.js, no browser)
                    - shard: graph-format
                      package: graph-format
                      test-command: pnpm exec nx run graph-format:coverage
                      needs-browser: false
                      needs-storybook: false
                    # graph-io - single shard (Node.js, no browser); resolves @graphty/graph-format through graph-format/dist
                    - shard: graph-io
                      package: graph-io
                      test-command: pnpm exec nx run graph-io:coverage
                      needs-browser: false
                      needs-storybook: false
                    # webgpu-graph-algorithms - two shards (design/webgpu/webgpu-acceleration-plan.md 12.5): the node
                    # project on Dawn over Mesa lavapipe with coverage (thresholds active) plus the no-subgroups twins
                    # pass, and the Chromium SwiftShader browser smoke. The node shard calls vitest directly: the
                    # nx -> npm -> vitest pipe chain starved the worker RPC for graph-format and graph-io (6fc56c1b).
                    # needs-lavapipe gates the apt install and the ICD lookup that export the lane's environment.
                    # The twin pass covers test/algorithms as well: pr-scale and pr-finalize declare
                    # needs: ["subgroups"] (they call wg_reduce_vec4) and their tests live there, so without that
                    # path the twin would never exercise the PageRank reduction on a device without the feature.
                    - shard: webgpu-graph-algorithms-node
                      package: webgpu-graph-algorithms
                      test-command: cd webgpu-graph-algorithms && pnpm exec vitest run --project=node --coverage && GRAPHTY_GPU_NO_SUBGROUPS=1 pnpm exec vitest run --project=node test/primitives test/layouts test/algorithms --passWithNoTests
                      needs-browser: false
                      needs-storybook: false
                      needs-lavapipe: true
                    # the browser smoke: scripts/run-browser-project.js wraps vitest in `timeout -k 10 600` and passes a
                    # timeout iff every test passed (browser.close() can hang after GPU work); SwiftShader flags come
                    # from the package's vitest.config.ts, not from CI
                    - shard: webgpu-graph-algorithms-browser
                      package: webgpu-graph-algorithms
                      test-command: cd webgpu-graph-algorithms && GRAPHTY_BROWSER_GPU=swiftshader GRAPHTY_GPU_REQUIRE=any node scripts/run-browser-project.js
                      needs-browser: true
                      needs-storybook: false
                    # algorithms - two shards (default and browser separated to avoid worker timeout)
                    # Each shard outputs to coverage/ directory; CI artifacts are named coverage-algorithms-{default,browser}
                    - shard: algorithms-default
                      package: algorithms
                      test-command: cd algorithms && pnpm exec vitest run --project=default --coverage
                      needs-browser: false
                      needs-storybook: false
                    - shard: algorithms-browser
                      package: algorithms
                      test-command: cd algorithms && pnpm exec vitest run --project=browser --coverage
                      needs-browser: true
                      needs-storybook: false
                    # layout - single shard
                    - shard: layout
                      package: layout
                      test-command: pnpm exec nx run layout:coverage
                      needs-browser: false
                      needs-storybook: false
                    # graphty - single shard (uses Playwright for browser-based vitest)
                    - shard: graphty
                      package: graphty
                      test-command: pnpm exec nx run graphty:coverage
                      needs-browser: true
                      needs-storybook: false
                    # remote-logger - single shard (has browser tests)
                    - shard: remote-logger
                      package: remote-logger
                      test-command: pnpm exec nx run remote-logger:coverage
                      needs-browser: true
                      needs-storybook: false
                    # compact-mantine - single shard (uses Playwright for browser-based vitest)
                    - shard: compact-mantine
                      package: compact-mantine
                      test-command: pnpm exec nx run compact-mantine:coverage
                      needs-browser: true
                      needs-storybook: false
                    # graphty-element default tests (Node.js, no browser)
                    - shard: graphty-element-default
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=default --reporter=blob --reporter=default --coverage
                      needs-browser: false
                      needs-storybook: false
                    # graphty-element browser tests (5 shards)
                    # Note: Using both blob and default reporters to capture test results and show failures in logs
                    - shard: graphty-element-browser-1
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=browser --project=interactions --shard=1/5 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: false
                    - shard: graphty-element-browser-2
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=browser --project=interactions --shard=2/5 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: false
                    - shard: graphty-element-browser-3
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=browser --project=interactions --shard=3/5 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: false
                    - shard: graphty-element-browser-4
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=browser --project=interactions --shard=4/5 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: false
                    - shard: graphty-element-browser-5
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=browser --project=interactions --shard=5/5 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: false
                    # graphty-element storybook tests (4 shards)
                    # Note: Using both blob and default reporters to capture test results and show failures in logs
                    - shard: graphty-element-storybook-1
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=storybook --shard=1/4 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: true
                    - shard: graphty-element-storybook-2
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=storybook --shard=2/4 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: true
                    - shard: graphty-element-storybook-3
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=storybook --shard=3/4 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: true
                    - shard: graphty-element-storybook-4
                      package: graphty-element
                      test-command: cd graphty-element && pnpm exec vitest run --project=storybook --shard=4/4 --reporter=blob --reporter=default --coverage
                      needs-browser: true
                      needs-storybook: true

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download graph-format build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-format
                  path: graph-format/dist/

            - name: Download graph-io build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-io
                  path: graph-io/dist/

            - name: Download webgpu-graph-algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-webgpu-graph-algorithms
                  path: webgpu-graph-algorithms/dist/

            - name: Download algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/

            - name: Download layout build
              uses: actions/download-artifact@v4
              with:
                  name: build-layout
                  path: layout/dist/

            - name: Download graphty build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/

            - name: Download graphty-element build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty-element
                  path: graphty-element/dist/

            - name: Download remote-logger build
              uses: actions/download-artifact@v4
              with:
                  name: build-remote-logger
                  path: remote-logger/dist/

            - name: Download compact-mantine build
              uses: actions/download-artifact@v4
              with:
                  name: build-compact-mantine
                  path: compact-mantine/dist/

            - name: Download Storybook build (graphty-element)
              if: matrix.needs-storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/

            - name: Cache Playwright browsers
              if: matrix.needs-browser
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install Playwright browsers
              if: matrix.needs-browser && steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium --with-deps

            - name: Install Playwright deps (if cached)
              if: matrix.needs-browser && steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            - name: Start Storybook server
              if: matrix.needs-storybook
              run: |
                  pnpm exec http-server graphty-element/storybook-static -p 9026 &
                  sleep 3

            # webgpu-graph-algorithms node shard: Dawn needs a Vulkan ICD; ubuntu-24.04 has none preinstalled
            - name: Install Mesa lavapipe
              if: matrix.needs-lavapipe
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools

            - name: Locate the lavapipe ICD and export the lane's environment
              if: matrix.needs-lavapipe
              run: |
                  # find, not ls with globs: the ICD's file name moved between Mesa releases (lvp_icd.json on noble,
                  # lvp_icd.x86_64.json on jammy); an unmatched glob makes ls exit 2 under bash -e
                  icd=$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d /usr/lib/x86_64-linux-gnu/vulkan/icd.d -name 'lvp_icd*.json' 2>/dev/null | sort | head -1 || true)
                  if [ -z "$icd" ]; then
                      echo "::error::no lavapipe ICD json after installing mesa-vulkan-drivers"
                      dpkg -L mesa-vulkan-drivers | grep -i 'json\|lvp\|lavapipe' || true
                      exit 1
                  fi
                  echo "lavapipe ICD: $icd"
                  VK_DRIVER_FILES="$icd" vulkaninfo --summary 2>/dev/null | head -40 || true
                  {
                      echo "VK_DRIVER_FILES=$icd"
                      echo "GRAPHTY_GPU_ADAPTER=llvmpipe"
                      echo "GRAPHTY_GPU_REQUIRE=any"
                      echo "XDG_RUNTIME_DIR=/tmp"
                  } >> "$GITHUB_ENV"

            - name: Run tests
              run: ${{ matrix.test-command }}

            - name: Upload blob report
              if: ${{ !cancelled() && startsWith(matrix.shard, 'graphty-element') }}
              uses: actions/upload-artifact@v4
              with:
                  name: blob-report-${{ matrix.shard }}
                  path: graphty-element/.vitest-reports/*
                  include-hidden-files: true
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (graphty-element)
              if: ${{ !cancelled() && startsWith(matrix.shard, 'graphty-element') }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: graphty-element/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (graph-format/graph-io/algorithms/layout/graphty/remote-logger/compact-mantine)
              if: ${{ !cancelled() && (matrix.shard == 'graph-format' || matrix.shard == 'graph-io' || startsWith(matrix.shard, 'algorithms-') || matrix.shard == 'layout' || matrix.shard == 'graphty' || matrix.shard == 'remote-logger' || matrix.shard == 'compact-mantine') }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: ${{ matrix.package }}/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (webgpu-graph-algorithms)
              if: ${{ !cancelled() && matrix.shard == 'webgpu-graph-algorithms-node' }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: webgpu-graph-algorithms/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: error
                  overwrite: true

    # Chromatic visual regression testing (graphty-element)
    chromatic-element:
        name: Chromatic (graphty-element)
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_ELEMENT }}
                  storybookBuildDir: ./graphty-element/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (graphty app)
    chromatic-app:
        name: Chromatic (graphty)
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_APP }}
                  storybookBuildDir: ./graphty/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (compact-mantine)
    chromatic-compact-mantine:
        name: Chromatic (compact-mantine)
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_COMPACT_MANTINE }}
                  storybookBuildDir: ./compact-mantine/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (algorithms)
    chromatic-algorithms:
        name: Chromatic (algorithms)
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_ALGORITHMS }}
                  storybookBuildDir: ./algorithms/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (layout)
    chromatic-layout:
        name: Chromatic (layout)
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
