name: CI

on:
    push:
        branches: [master]
    pull_request:
        # "labeled" re-runs CI when a label is added. (Chromatic, which used a label, is switched off.)
        types: [opened, synchronize, reopened, labeled]
    # Manual trigger. GitHub twice declined to queue a run for a push to master
    # (4ca5f8a and 756117b both reached the remote with zero runs created for
    # their SHA, while every workflow showed state=active). Without a dispatch
    # trigger the only way to recover is an empty commit, which puts noise in
    # the history to work around a scheduling hiccup.
    workflow_dispatch:
        inputs:
            chromatic:
                description: "Publish Chromatic builds for the affected projects (billed per snapshot)"
                type: boolean
                default: false

# Note: We use local Nx caching only (no Nx Cloud)
# Cache is stored in .nx/cache and persisted via actions/cache

jobs:
    # Build job - runs once, shares artifacts with test shards
    build:
        name: Build
        runs-on: ubuntu-latest
        # What the rest of the run tests, decided once here: the test job's matrix and the Chromatic jobs'
        # conditions read these instead of each asking nx again. See the "Plan" step below.
        outputs:
            affected: ${{ steps.plan.outputs.affected }}
            test-matrix: ${{ steps.plan.outputs.test-matrix }}
            test-count: ${{ steps.plan.outputs.test-count }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Plan which packages this run tests. A pull request tests only what nx calls affected: the
            # packages it changed plus every package that depends on them. Each pull request run used to be
            # about 30 jobs against an organisation limit of about 60 concurrent jobs, so two open pull
            # requests queued each other; a pull request confined to graph-io now runs one test shard, not
            # twenty-one. A push to master and a manual dispatch pass every project as "affected", so they
            # run every shard and every Chromatic job exactly as before -- master is still fully tested
            # before release.yml publishes anything.
            # What counts as "everything" on a pull request is nx.json's sharedGlobals: the root TypeScript,
            # ESLint, Vite and Vitest configs, pnpm-workspace.yaml, .npmrc and every file under
            # .github/workflows (nx already treats nx.json, package.json and pnpm-lock.yaml that way). A
            # change to any of them affects every project, so it runs the full set here too.
            # The shard list itself lives in tools/ci-test-matrix.mjs, which filters it; the base is named
            # explicitly for the same reason as "Build affected (PR)" below.
            - name: Plan affected projects and test shards
              id: plan
              run: |
                  all=$(pnpm exec nx show projects --json)
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      affected=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --json)
                  else
                      affected="$all"
                  fi
                  node tools/ci-test-matrix.mjs "$all" "$affected" | tee -a "$GITHUB_OUTPUT"

            # Security audit - run early to catch vulnerabilities before building
            # Only fail on critical and high severity vulnerabilities
            - name: Security audit
              run: pnpm audit --audit-level=high

            - name: Cache Nx
              uses: actions/cache@v4
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
                      nx-${{ runner.os }}-build-

            # PR: Build then lint (build first for type dependencies). The base is named explicitly: the checkout
            # has every branch as a remote-tracking ref (fetch-depth 0) but no local master, and nx.json's
            # defaultBase "master" made nx affected fail with "unknown revision" on the first pull_request run
            - name: Build affected (PR)
              if: github.event_name == 'pull_request'
              run: pnpm exec nx affected -t build --parallel=3 --base=origin/${{ github.base_ref }} --head=HEAD

            # Every test shard downloads every package's dist, so every package must be built even when the
            # pull request leaves it unaffected: an upload that finds no files creates no artifact, and the
            # shard's download then fails with "Artifact not found". This step used to name only
            # graph-format, graph-io and webgpu-graph-algorithms, the packages outside graphty's dependency
            # closure, which held while a pull request touching one of them also touched the element -- a
            # pull request confined to webgpu-graph-algorithms left graphty, graphty-element, remote-logger
            # and compact-mantine unbuilt and failed all twenty shards (run 35668273734). Building every
            # project is what master already does, and the Nx cache makes it a no-op for whatever the
            # affected build above produced.
            - name: Build the rest (PR), so every shard finds its artifact
              if: github.event_name == 'pull_request'
              run: pnpm exec nx run-many -t build --parallel=3
              env:
                  NODE_OPTIONS: "--max-old-space-size=8192"
                  VITE_BASE_PATH: /
                  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
                  VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
                  VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Lint affected (PR)
              if: github.event_name == 'pull_request'
              run: pnpm exec nx affected -t lint --parallel=3 --base=origin/${{ github.base_ref }} --head=HEAD

            # Master: Build then lint (build first for type dependencies)
            # graphty build needs Sentry env vars for error tracking
            - name: Build all (master)
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm exec nx run-many -t build --parallel=3
              env:
                  NODE_OPTIONS: "--max-old-space-size=8192"
                  VITE_BASE_PATH: /
                  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
                  VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
                  VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Lint all (master)
              if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm exec nx run-many -t lint --parallel=3

            # Every package is built by now on both paths (PR builds the rest above). knip reads
            # source; the production pass counts only published entry points. The published-deps
            # check packs each package and compares what it ships with what it declares, so it
            # must run after the build. The same three steps run in tools/prepush.sh.
            - name: Knip (dead code detection)
              run: pnpm run lint:knip

            - name: Knip (production dependencies)
              run: pnpm run lint:knip:prod

            - name: Published dependencies
              run: pnpm run check:published-deps

            # The same three checks run in tools/prepush.sh. The first two read no build output; the
            # bundle size check measures graphty-element's dist/ against graphty-element/size-budgets.json.
            - name: ESLint root config
              run: pnpm run lint:eslint-root

            - name: Formatting (changed files)
              if: github.event_name == 'pull_request'
              run: pnpm run format:check:changed origin/${{ github.base_ref }}

            - name: Bundle size (graphty-element)
              run: pnpm run check:bundle-size

            - name: Declared build tools
              run: pnpm run check:declared-tools

            # Element data sources read files through @graphty/graph-io importers, not their own
            # parsers. The same check runs in tools/prepush.sh.
            - name: Element data sources on graph-io
              run: pnpm run check:data-source-migration

            # The import reader of the script that prints the counts in design/graph-format/STATUS.md.
            - name: Migration count script
              run: pnpm run check:migration-counts

            # Reads source only. Any use of the legacy graph API (a legacy algorithms or layout
            # name, the legacy Graph, a positional layout, an element parser not on graph-io) fails.
            # The same check runs in tools/prepush.sh.
            - name: Legacy graph API use
              run: pnpm run check:legacy-use

            - name: Build Storybook (graphty-element)
              run: pnpm exec nx run graphty-element:build-storybook

            - name: Build Storybook (graphty)
              run: pnpm exec nx run graphty:build-storybook

            - name: Build Storybook (compact-mantine)
              run: pnpm exec nx run compact-mantine:build-storybook

            - name: Build Storybook (algorithms)
              run: pnpm exec nx run algorithms:build-storybook

            - name: Build Storybook (layout)
              run: pnpm exec nx run layout:build-storybook

            # Build unified documentation on every run, so a pull request that breaks the docs
            # (a dead link included: VitePress fails the build on one) fails here rather than on
            # master. The docs and both gh-pages builds are uploaded on every run because the
            # "Links" job checks every link to graphty.app against the site they assemble into.
            - name: Build docs
              run: npm run docs:build

            - name: Build algorithms gh-pages
              run: pnpm exec nx run algorithms:build:gh-pages

            - name: Build layout gh-pages
              run: pnpm exec nx run layout:build:gh-pages

            # Every package's dist in one artifact, so a test shard fetches them in one request.
            # The per-package artifacts below stay: release.yml and deploy-pages.yml download them
            # by name.
            - name: Upload all package builds
              uses: actions/upload-artifact@v4
              with:
                  name: build-packages
                  path: |
                      graph-format/dist/
                      graph-io/dist/
                      webgpu-graph-algorithms/dist/
                      graph-samples/dist/
                      algorithms/dist/
                      layout/dist/
                      graphty/dist/
                      graphty-element/dist/
                      remote-logger/dist/
                      compact-mantine/dist/
                  retention-days: 1

            - name: Upload graph-format build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-format
                  path: graph-format/dist/
                  retention-days: 1

            - name: Upload graph-io build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-io
                  path: graph-io/dist/
                  retention-days: 1

            - name: Upload webgpu-graph-algorithms build
              uses: actions/upload-artifact@v4
              with:
                  name: build-webgpu-graph-algorithms
                  path: webgpu-graph-algorithms/dist/
                  retention-days: 1

            - name: Upload graph-samples build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graph-samples
                  path: graph-samples/dist/
                  retention-days: 1

            - name: Upload algorithms build
              uses: actions/upload-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/
                  retention-days: 1

            - name: Upload layout build
              uses: actions/upload-artifact@v4
              with:
                  name: build-layout
                  path: layout/dist/
                  retention-days: 1

            - name: Upload graphty build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/
                  retention-days: 1

            - name: Upload graphty-element build
              uses: actions/upload-artifact@v4
              with:
                  name: build-graphty-element
                  path: graphty-element/dist/
                  retention-days: 1

            - name: Upload remote-logger build
              uses: actions/upload-artifact@v4
              with:
                  name: build-remote-logger
                  path: remote-logger/dist/
                  retention-days: 1

            - name: Upload compact-mantine build
              uses: actions/upload-artifact@v4
              with:
                  name: build-compact-mantine
                  path: compact-mantine/dist/
                  retention-days: 1

            - name: Upload Storybook build (graphty-element)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (graphty)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (compact-mantine)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (algorithms)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/
                  retention-days: 1

            - name: Upload Storybook build (layout)
              uses: actions/upload-artifact@v4
              with:
                  name: build-storybook-layout
                  path: layout/storybook-static/
                  retention-days: 1

            # Upload documentation artifacts (deploy-pages publishes them; the Links job checks them)
            - name: Upload unified docs
              uses: actions/upload-artifact@v4
              with:
                  name: build-docs
                  path: docs/.vitepress/dist/
                  retention-days: 1

            - name: Upload algorithms gh-pages
              uses: actions/upload-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: algorithms/gh-pages/
                  retention-days: 1

            - name: Upload layout gh-pages
              uses: actions/upload-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: layout/gh-pages/
                  retention-days: 1

    # Sharded test jobs - run in parallel, collect coverage
    # Sharded test jobs - run in parallel, collect coverage. The matrix comes from the build job's plan
    # (tools/ci-test-matrix.mjs holds every shard and why it is split the way it is): every shard on master,
    # only the affected packages' shards on a pull request. A pull request that affects no package (a docs
    # or tools change) has no shards, and GitHub fails a job whose matrix is empty instead of skipping it,
    # so the job is skipped by its condition; "All Checks Pass" counts a skipped job as passing only on a
    # pull request.
    test:
        name: Test (${{ matrix.shard }})
        needs: build
        if: needs.build.outputs.test-count != '0'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.test-matrix) }}

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # One download instead of one per package: about twenty shards starting at once, each
            # making ten requests, drew 403 errors from the artifact service (#252). The archive
            # keeps each package's path, so it unpacks into place at the repository root. A failed
            # download is tried once more.
            - name: Download all package builds
              id: download-packages
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Download all package builds (retry)
              if: steps.download-packages.outcome == 'failure'
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Cache Playwright browsers
              if: matrix.needs-browser
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install Playwright browsers
              if: matrix.needs-browser && steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium --with-deps

            - name: Install Playwright deps (if cached)
              if: matrix.needs-browser && steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            # webgpu-graph-algorithms node shard: Dawn needs a Vulkan ICD; ubuntu-24.04 has none preinstalled
            - name: Install Mesa lavapipe
              if: matrix.needs-lavapipe
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools

            - name: Locate the lavapipe ICD and export the lane's environment
              if: matrix.needs-lavapipe
              run: |
                  # find, not ls with globs: the ICD's file name moved between Mesa releases (lvp_icd.json on noble,
                  # lvp_icd.x86_64.json on jammy); an unmatched glob makes ls exit 2 under bash -e
                  icd=$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d /usr/lib/x86_64-linux-gnu/vulkan/icd.d -name 'lvp_icd*.json' 2>/dev/null | sort | head -1 || true)
                  if [ -z "$icd" ]; then
                      echo "::error::no lavapipe ICD json after installing mesa-vulkan-drivers"
                      dpkg -L mesa-vulkan-drivers | grep -i 'json\|lvp\|lavapipe' || true
                      exit 1
                  fi
                  echo "lavapipe ICD: $icd"
                  VK_DRIVER_FILES="$icd" vulkaninfo --summary 2>/dev/null | head -40 || true
                  {
                      echo "VK_DRIVER_FILES=$icd"
                      echo "GRAPHTY_GPU_ADAPTER=llvmpipe"
                      echo "GRAPHTY_GPU_REQUIRE=any"
                      echo "XDG_RUNTIME_DIR=/tmp"
                  } >> "$GITHUB_ENV"

            # A forked vitest worker that crashes must not spend minutes writing a multi-gigabyte core dump.
            # scripts/run-node-shard.js runs vitest under `ulimit -c 0`, but the runner's default core_pattern
            # pipes cores to a program, and the kernel ignores RLIMIT_CORE for a piped pattern (core(5)). A plain
            # file pattern makes the limit bind. Issue #273.
            - name: Write core dumps to a file so the shard's ulimit -c 0 holds
              if: matrix.shard == 'webgpu-graph-algorithms-node'
              run: echo "core_pattern was $(cat /proc/sys/kernel/core_pattern)" && sudo sysctl -w kernel.core_pattern=core

            - name: Run tests
              run: ${{ matrix.test-command }}

            - name: Upload blob report
              if: ${{ !cancelled() && startsWith(matrix.shard, 'graphty-element') }}
              uses: actions/upload-artifact@v4
              with:
                  name: blob-report-${{ matrix.shard }}
                  path: graphty-element/.vitest-reports/*
                  include-hidden-files: true
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (graphty-element)
              if: ${{ !cancelled() && startsWith(matrix.shard, 'graphty-element') }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: graphty-element/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (graph-format/graph-io/graph-samples/algorithms/layout/graphty/remote-logger/compact-mantine)
              if: ${{ !cancelled() && (matrix.shard == 'graph-format' || matrix.shard == 'graph-io' || matrix.shard == 'graph-samples' || startsWith(matrix.shard, 'algorithms-') || matrix.shard == 'layout' || matrix.shard == 'graphty' || matrix.shard == 'remote-logger' || matrix.shard == 'compact-mantine') }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: ${{ matrix.package }}/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload coverage (webgpu-graph-algorithms)
              if: ${{ !cancelled() && matrix.shard == 'webgpu-graph-algorithms-node' }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}
                  path: webgpu-graph-algorithms/coverage/lcov.info
                  retention-days: 1
                  if-no-files-found: error
                  overwrite: true

            # The device-error project's own run: a second artifact for the same package, which
            # tools/merge-coverage.sh collects by the coverage-<package>-<shard> prefix and merges with the one
            # above before rewriting the paths (it already does this for the graphty-element shards).
            - name: Upload coverage (webgpu-graph-algorithms, the device-error project)
              if: ${{ !cancelled() && matrix.shard == 'webgpu-graph-algorithms-node' }}
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.shard }}-device-errors
                  path: webgpu-graph-algorithms/.coverage-parts/device-errors/lcov.info
                  retention-days: 1
                  if-no-files-found: error
                  overwrite: true

    # Chromatic visual regression testing (graphty-element)
    # ALL CHROMATIC JOBS ARE SWITCHED OFF (they need the repository variable CHROMATIC_ENABLED) until the self-hosted visual review replaces them:
    # Chromatic's paid plans have no hard spending cap. Turning one back on is an owner decision.
    # Chromatic bills every snapshot, and running it on every push cost thousands of dollars a month
    # (September 2026: 481,000 snapshots). So it is opt-in: a Chromatic job runs only on a pull request
    # that carries the "chromatic" label (and only when its package is affected, which includes a change
    # to anything it depends on), or on a manual dispatch with the chromatic input set. It never runs on
    # a push to master. Its Storybook is built in every run regardless, because the Links job checks the
    # assembled site.
    chromatic-element:
        name: Chromatic (graphty-element)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
        if: vars.CHROMATIC_ENABLED == 'owner-approved'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_ELEMENT }}
                  storybookBuildDir: ./graphty-element/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (graphty app)
    chromatic-app:
        name: Chromatic (graphty)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
        if: vars.CHROMATIC_ENABLED == 'owner-approved'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_APP }}
                  storybookBuildDir: ./graphty/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (compact-mantine)
    chromatic-compact-mantine:
        name: Chromatic (compact-mantine)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
        if: vars.CHROMATIC_ENABLED == 'owner-approved'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_COMPACT_MANTINE }}
                  storybookBuildDir: ./compact-mantine/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (algorithms)
    chromatic-algorithms:
        name: Chromatic (algorithms)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
        if: vars.CHROMATIC_ENABLED == 'owner-approved'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_ALGORITHMS }}
                  storybookBuildDir: ./algorithms/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Chromatic visual regression testing (layout)
    chromatic-layout:
        name: Chromatic (layout)
        needs: build
        # Switched off: Chromatic has no spending cap and is being replaced (design/visual-testing/).
        # The variable is unset on purpose; setting it is an owner decision.
        if: vars.CHROMATIC_ENABLED == 'owner-approved'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-layout
                  path: layout/storybook-static/

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_LAYOUT }}
                  storybookBuildDir: ./layout/storybook-static
                  exitZeroOnChanges: false
                  # TurboSnap (onlyChanged) disabled - Vite doesn't generate preview-stats.json
                  # See: https://github.com/storybookjs/storybook/issues/27172

    # Dead links: relative links and anchors, this repository's files on GitHub, everything else
    # under github.com/graphty-org, and every link to graphty.app -- checked against the site the
    # next deploy would publish, assembled here from this run's artifacts by the same script
    # deploy-pages.yml runs. See tools/check-links.sh. External links are checked weekly instead
    # (links-weekly.yml), so another site's outage never fails a pull request.
    links:
        name: Links
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Download graphty build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/

            - name: Download unified docs
              uses: actions/download-artifact@v4
              with:
                  name: build-docs
                  path: docs/.vitepress/dist/

            - name: Download Storybook build (graphty-element)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: graphty-element/storybook-static/

            - name: Download Storybook build (graphty)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-app
                  path: graphty/storybook-static/

            - name: Download Storybook build (compact-mantine)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: compact-mantine/storybook-static/

            - name: Download Storybook build (algorithms)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: algorithms/storybook-static/

            - name: Download Storybook build (layout)
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-layout
                  path: layout/storybook-static/

            - name: Download algorithms gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: algorithms/gh-pages/

            - name: Download layout gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: layout/gh-pages/

            - name: Assemble the GitHub Pages site
              run: ./tools/assemble-pages-site.sh "$RUNNER_TEMP/site"

            - name: Check links
              run: ./tools/check-links.sh --site "$RUNNER_TEMP/site"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The algorithms benchmark table (master branch only): a measurement, with no baseline to compare
    performance:
        name: Performance Benchmarks
        needs: test
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Every package's dist: the benchmark runs algorithms from source under tsx, and that
            # source imports @graphty/graph-format, which resolves to graph-format's dist.
            - name: Download all package builds
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Run the algorithms benchmarks
              run: pnpm exec nx run algorithms:benchmark
              env:
                  CI: "true"
                  NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"

    # graphty-element's cost estimates held against a stopwatch (issue #236). The test times real
    # algorithm runs and scales the estimate by the element's own calibration probe, so it reads the
    # same on this runner as on a workstation. It is a measurement, not a gate: master and dispatch
    # only, and not in "All Checks Pass", so a drift shows as a red job on master and never blocks a
    # pull request. Each failure names the row, the graph, n, m, both times and the ratio; every
    # row's ratio also lands in the job summary.
    cost-accuracy:
        name: Cost Estimate Accuracy
        needs: build
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all package builds
              uses: actions/download-artifact@v4
              with:
                  name: build-packages
                  path: .

            - name: Time the estimates against real runs
              working-directory: graphty-element
              run: |
                  set -o pipefail
                  COST_GUARD_VERBOSE=1 npm run test:cost 2>&1 | tee "$RUNNER_TEMP/cost.log"

            - name: Write the ratios to the job summary
              if: ${{ !cancelled() }}
              run: |
                  {
                      echo "### Cost estimate / measured run (bounds 0.95 to 4)"
                      echo '```'
                      grep -E "ratio [0-9.]+, machine speed" "$RUNNER_TEMP/cost.log" || echo "no rows ran"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    # Visual review: screenshot every story of a built Storybook and compare it with the baseline PNGs
    # in visual-baselines/ (@graphty/visual-review in visual-review/, configured by
    # visual-review.config.json, design in design/visual-testing/design.md). This job is the "visual"
    # job of the package's workflow template (visual-review/templates/visual-review.yml) with two
    # differences: the matrix is written out here, and the Storybook is downloaded from this run's
    # build job instead of built again. A test (visual-review/test/workflows.test.mjs) keeps the
    # commands the same as the template's. The owner reviews
    # the uploaded captures in the page `visual-review serve` runs on their machine; that page finds this
    # job by its name ("visual (<project>)") and the artifact by "visual-<project>-<attempt>" (the attempt
    # avoids upload-artifact v4's same-name conflict on a re-run; readers take the highest attempt). Changes are never a failure here:
    # the job fails only when the tool itself crashes, and continue-on-error keeps even that from failing
    # the run, because release.yml, deploy-pages.yml and coverage.yml gate on the run's conclusion. What
    # blocks a pull request is the step in "All Checks Pass" that reads the results. 45 minutes: an
    # unseeded project captures every story twice (as new), about 7 minutes for graphty-element on a
    # 4-worker development machine; CI runners are slower and not yet measured.
    visual:
        name: visual (${{ matrix.project }})
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            # To download master's newest capture (the reference step below).
            actions: read
        continue-on-error: true
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: compact-mantine
                      artifact: build-storybook-compact-mantine
                    - project: graphty-element
                      artifact: build-storybook-element
                    - project: layout
                      artifact: build-storybook-layout
        steps:
            # Baseline PNGs are Git LFS objects. The checkout leaves them as pointer files (no job fetches
            # LFS objects by default); this job alone fetches them, and only its own project's. The objects
            # are cached in the Actions cache keyed by the pointer files' hash (which is the list of object
            # ids), so a run downloads from LFS only the images accepted since the cache was saved, and the
            # organisation's LFS bandwidth (250 GiB a month, a $0 budget that blocks rather than bills)
            # stays near zero. design/visual-testing/design.md section 7 has the estimate.
            - uses: actions/checkout@v4

            - name: Restore this project's baseline images
              uses: actions/cache@v4
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ matrix.project }}-${{ hashFiles(format('visual-baselines/{0}/**/*.png', matrix.project)) }}
                  restore-keys: lfs-${{ matrix.project }}-

            - name: Fetch this project's baseline images from Git LFS
              run: git lfs pull --include "visual-baselines/${{ matrix.project }}/**"

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Keyed by the Playwright version capture imports, so a bump downloads the matching Chromium.
            - name: Read the Playwright version
              id: playwright
              run: echo "version=$(node -p 'require("./visual-review/package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            # With the browser cached this installs only the system libraries Chromium needs.
            - name: Install Chromium
              run: pnpm exec visual-review install-browser

            - name: Download Storybook build
              uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.project }}/storybook-static/

            # Seeding is per story: a story with no baseline that looks as it does in master's newest capture is
            # "unseeded" and does not block this pull request; one that differs, or is new, blocks until the
            # owner accepts it. Without a reference (none downloaded) every story with no baseline is "new".
            - name: Download master's newest capture
              id: reference
              if: github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "dir=$(pnpm exec visual-review reference --project ${{ matrix.project }} --out "$RUNNER_TEMP/reference")" >> "$GITHUB_OUTPUT"

            - name: Capture
              run: pnpm exec visual-review capture --project ${{ matrix.project }} --out "$RUNNER_TEMP/visual" --reference "${{ steps.reference.outputs.dir }}"

            # Kept even when capture crashed, so the owner sees the partial results.json.
            - name: Upload captures
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-${{ matrix.project }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/visual/
                  retention-days: 30

            - name: Write the counts to the job summary
              if: always()
              run: |
                  f="$RUNNER_TEMP/visual/results.json"
                  {
                      echo "### Visual review (${{ matrix.project }})"
                      if [[ -f "$f" ]]; then
                          jq -r '"seeded: \(.seeded), complete: \(.complete), \(.items | length) of \(.expected) items, master reference run: \(.reference)",
                              "", "| status | items |", "|---|---|",
                              (.items | group_by(.status)[] | "| \(.[0].status) | \(length) |")' "$f"
                      else
                          echo "No results.json: capture did not start."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

    # Gate job - ensures all required checks pass before release/deploy. It is the required status check,
    # so it runs even when a job it needs failed (if: always()) and decides for itself.
    # On a pull request a job this run chose not to start (a test job or Chromatic job for an unaffected
    # package) is "skipped", and skipped counts as passing; failure and cancelled never do. Build is needed
    # here and must succeed, because when it fails every other job is skipped too, and without it that
    # would read as a pass. On master and dispatch every job must succeed: nothing is meant to be skipped
    # there, so a skip means the plan went wrong and must not pass silently.
    all-checks:
        name: All Checks Pass
        needs:
            [
                build,
                test,
                links,
                chromatic-element,
                chromatic-app,
                chromatic-compact-mantine,
                chromatic-algorithms,
                chromatic-layout,
                visual,
            ]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check all jobs passed
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  EVENT: ${{ github.event_name }}
              run: |
                  ok='["success"]'
                  [[ "$EVENT" == "pull_request" ]] && ok='["success","skipped"]'
                  jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
                  # Chromatic jobs are opt-in (see chromatic-element), so a skipped one passes on every event.
                  # The visual job never decides here, whatever result job-level continue-on-error makes
                  # it report: on a pull request the gate step below judges its results.json, and on
                  # master a capture crash must not hold release, deploy or coverage.
                  bad=$(jq -r --argjson ok "$ok" \
                      'to_entries[] | select(.key != "visual") | select(.value.result as $r | (($ok | index($r)) == null and ((.key | startswith("chromatic-")) and $r == "skipped" | not)) or (.key == "build" and $r != "success")) | .key' \
                      <<<"$NEEDS")
                  if [[ -n "$bad" ]]; then
                      echo "::error::jobs that did not pass: $(echo $bad)"
                      exit 1
                  fi
                  echo "All checks passed!"

            # Until the owner has reviewed a pull request's visual changes, it does not merge. A project
            # with baselines on the base branch fails here when its newest capture (the highest attempt
            # of this run, so "Re-run failed jobs" cannot skip it) holds anything but unchanged,
            # excluded or unseeded items (unseeded: no baseline yet, and this pull request does not
            # change it), or when that capture is missing, unfinished or invalid. It also fails when
            # a baseline PNG or an excluding settings file differs from the base without a review record
            # added in the pull request that names its new hash. So it shows the captures match the pull
            # request's baselines and that each baseline change is named (path and new hash) in a record;
            # it does NOT prove the owner pressed Finish, since anyone who can push can write a record
            # (visual-review/README.md, "What the gate does and does not guarantee"). Pull requests only, so
            # master's release, deploy and coverage never wait. The logic is visual-review/trusted/gate.mjs
            # (standard library only), run from this checkout rather than with npx as the package's
            # template does, so a change to the gate is tested by its own pull request; it reads
            # visual-review.config.json from the base tip (sparse checkout keeps the root's files). Depth 2 so HEAD^1, the merge ref's first parent, is the base tip
            # the pull request was merged onto; blobs are fetched only for the changed baselines, which are
            # Git LFS pointer files naming the image's SHA-256, so no LFS object is downloaded here.
            - name: Check out the gate
              if: github.event_name == 'pull_request'
              uses: actions/checkout@v4
              with:
                  sparse-checkout: visual-review
                  fetch-depth: 2
                  filter: blob:none

            - name: Download visual captures
              if: github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  pattern: visual-*
                  path: ${{ runner.temp }}/visual

            - name: Check visual changes were accepted
              if: github.event_name == 'pull_request'
              run: node visual-review/trusted/cli.mjs gate --captures "$RUNNER_TEMP/visual" --base HEAD^1 --head HEAD
