name: Coverage

# Coveralls' master coverage, from the release train's full run (release.yml, job "coverage"): a push to master
# runs no test shards, so the release train's CI call is the run that has coverage for a master commit. It reads
# the shards' artifacts from that same run.
on:
    workflow_call:
        inputs:
            ref:
                description: "the commit the coverage was measured on"
                type: string
                required: true

env:
    # A failed Actions cache restore waits one minute here, not 10 (#5098; see ci.yml).
    SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
    # Merge blob reports from graphty-element shards
    merge-reports:
        name: Merge Test Reports
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            - uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all blob reports
              uses: actions/download-artifact@v8
              with:
                  pattern: blob-report-*
                  path: graphty-element/.vitest-reports
                  merge-multiple: true

            - name: Merge test reports
              run: cd graphty-element && pnpm exec vitest --merge-reports || true

    # Merge and publish coverage to Coveralls
    coverage:
        name: Publish Coverage
        needs: merge-reports
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            # the workflow's tools/ and .github/actions/, not the checked-out commit's (tools/own-tools-overlay.test.mjs)
            - name: Use the workflow's own tools and actions
              env:
                  OVERLAY: tools .github/actions
              run: |
                  [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && exit 0
                  depth=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --depth=1 || true)
                  git fetch --quiet --no-tags $depth origin "$GITHUB_SHA"
                  git archive "$GITHUB_SHA" $OVERLAY | tar -x

            - uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all coverage reports
              uses: actions/download-artifact@v8
              with:
                  pattern: coverage-*
                  path: coverage-reports

            # A shard group's artifact (ci.yml, "Upload coverage (shard group)") holds one
            # coverage-<shard> directory per member: move them up beside the other shards' artifacts.
            - name: Lift the shard groups' coverage out of their artifacts
              run: |
                  shopt -s nullglob
                  for dir in coverage-reports/coverage-group-*/coverage-*; do
                      mv "$dir" coverage-reports/
                  done

            - name: List downloaded artifacts
              run: |
                  echo "Downloaded coverage artifacts:"
                  find coverage-reports -name 'lcov.info' -exec ls -la {} \;

            - name: Merge coverage reports
              run: ./tools/merge-coverage.sh --ci --artifacts coverage-reports

            - name: Publish to Coveralls
              if: hashFiles('coverage/lcov.info') != ''
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
                  # the tested commit, not the calling run's: the two differ when the caller tested another one
                  git-commit: ${{ inputs.ref }}
                  git-branch: master
