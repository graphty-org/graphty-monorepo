name: Coverage

# Coveralls' master coverage, from the release train's full run (release.yml, job "coverage"): a push to master
# runs no test shards, so the release train's CI call is the run that has coverage for a master commit. It reads
# the shards' artifacts from that same run.
on:
    workflow_call:
        inputs:
            ref:
                description: "the commit the coverage was measured on"
                type: string
                required: true

jobs:
    # Merge blob reports from graphty-element shards
    merge-reports:
        name: Merge Test Reports
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all blob reports
              uses: actions/download-artifact@v4
              with:
                  pattern: blob-report-*
                  path: graphty-element/.vitest-reports
                  merge-multiple: true

            - name: Merge test reports
              run: cd graphty-element && pnpm exec vitest --merge-reports || true

    # Merge and publish coverage to Coveralls
    coverage:
        name: Publish Coverage
        needs: merge-reports
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all coverage reports
              uses: actions/download-artifact@v4
              with:
                  pattern: coverage-*
                  path: coverage-reports

            # A shard group's artifact (ci.yml, "Upload coverage (shard group)") holds one
            # coverage-<shard> directory per member: move them up beside the other shards' artifacts.
            - name: Lift the shard groups' coverage out of their artifacts
              run: |
                  shopt -s nullglob
                  for dir in coverage-reports/coverage-group-*/coverage-*; do
                      mv "$dir" coverage-reports/
                  done

            - name: List downloaded artifacts
              run: |
                  echo "Downloaded coverage artifacts:"
                  find coverage-reports -name 'lcov.info' -exec ls -la {} \;

            - name: Merge coverage reports
              run: ./tools/merge-coverage.sh --ci --artifacts coverage-reports

            - name: Publish to Coveralls
              if: hashFiles('coverage/lcov.info') != ''
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
