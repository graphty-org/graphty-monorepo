name: Coverage

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    # Which run holds the coverage: master's own CI run when it ran the test shards, otherwise the merge
    # queue's run that passed the full suite on exactly this tree (ci.yml's plan job skips the shards on
    # such a push; tools/full-suite-proof.sh finds the run by its full-suite-passed-<tree> artifact).
    source:
        name: Find the run with the coverage
        runs-on: ubuntu-24.04
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        permissions:
            actions: read
            contents: read
        outputs:
            run-id: ${{ steps.find.outputs.run-id }}
        steps:
            - uses: actions/checkout@v4

            - id: find
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN: ${{ github.event.workflow_run.id }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  own=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" \
                      --jq '[.artifacts[] | select(.name | startswith("coverage-"))] | length')
                  if [[ "$own" != 0 ]]; then
                      run="$RUN"
                  else
                      run=$(./tools/full-suite-proof.sh "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq .commit.tree.sha)")
                  fi
                  [[ -n "$run" ]] || { echo "::warning::no run with coverage for ${SHA}"; exit 0; }
                  echo "coverage from run ${run}"
                  echo "run-id=${run}" >> "$GITHUB_OUTPUT"

    # Merge blob reports from graphty-element shards
    merge-reports:
        name: Merge Test Reports
        needs: source
        runs-on: ubuntu-24.04
        if: ${{ needs.source.outputs.run-id != '' }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all blob reports
              uses: actions/download-artifact@v4
              with:
                  pattern: blob-report-*
                  path: graphty-element/.vitest-reports
                  merge-multiple: true
                  run-id: ${{ needs.source.outputs.run-id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Merge test reports
              run: cd graphty-element && pnpm exec vitest --merge-reports || true

    # Merge and publish coverage to Coveralls
    coverage:
        name: Publish Coverage
        needs: [source, merge-reports]
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Download all coverage reports
              uses: actions/download-artifact@v4
              with:
                  pattern: coverage-*
                  path: coverage-reports
                  run-id: ${{ needs.source.outputs.run-id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: List downloaded artifacts
              run: |
                  echo "Downloaded coverage artifacts:"
                  find coverage-reports -name 'lcov.info' -exec ls -la {} \;

            - name: Merge coverage reports
              run: ./tools/merge-coverage.sh --ci --artifacts coverage-reports

            - name: Publish to Coveralls
              if: hashFiles('coverage/lcov.info') != ''
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
