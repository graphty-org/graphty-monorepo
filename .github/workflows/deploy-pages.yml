name: Deploy to beta.graphty.app

# Every green CI run of a push to master (the build) publishes the whole site -- the app, the docs, the
# Storybooks and the hosted data, assembled from exactly that run's artifacts -- as a beta build: a release of
# graphty-org/graphty-beta tagged build-<commit>, deployed to beta.graphty.app (tools/pages-builds.sh). The
# newest 30 builds are kept. graphty.app changes only when the owner promotes a beta build
# (promote-pages.yml), with one exception: the hosted datasets under /data/graph-samples/v1/ are append-only,
# so when this build's differ from graphty.app's, graphty.app is republished with the build it already serves
# and the new datasets (design/ci/fast-pipeline.md, section 4.6). To redeploy, re-run this workflow's run for
# that commit.
#
# Writing to graphty-beta takes the secret GRAPHTY_BETA_TOKEN: a fine-grained token for that repository
# alone with "Contents: read and write".
on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
        branches:
            - master

# One deploy at a time; a newer pending deploy replaces an older pending one.
concurrency:
    group: deploy-pages

env:
    RUN_ID: ${{ github.event.workflow_run.id }}
    SHA: ${{ github.event.workflow_run.head_sha }}

permissions:
    contents: read
    pages: write
    id-token: write
    actions: read # Required to download artifacts from other workflow runs

jobs:
    # Only a green CI run of a push to master deploys. When the newest beta build is of a newer commit (CI
    # runs finish out of order), there is nothing to do.
    check:
        name: Is a newer build out already
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        runs-on: ubuntu-24.04
        outputs:
            deploy: ${{ steps.newest.outputs.deploy }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: tools
            - id: newest
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  newest=$(tools/pages-builds.sh resolve newest 2>/dev/null || true)
                  newest_sha=${newest#build-}
                  echo "newest beta build: ${newest:-none}"
                  if [ -n "$newest" ] && [ "$newest_sha" != "$SHA" ] && \
                      [ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/${newest_sha}...${SHA}" --jq .status 2>/dev/null)" = behind ]; then
                      echo "::notice::the newest beta build, ${newest_sha}, is newer than ${SHA}"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  echo "deploy=true" >> "$GITHUB_OUTPUT"

    build:
        name: Assemble Site
        needs: check
        if: ${{ needs.check.outputs.deploy == 'true' }}
        runs-on: ubuntu-24.04
        outputs:
            data-changed: ${{ steps.data.outputs.changed }}
        steps:
            # The deployed commit, with history and tags, so the stamp below can name the app's release.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0

            # Download all artifacts from CI workflow
            - name: Download graphty app build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: ./graphty/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty-element Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: ./graphty-element/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-app
                  path: ./graphty/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download compact-mantine Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: ./compact-mantine/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: ./algorithms/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-layout
                  path: ./layout/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download cytoscape-extensions Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-cytoscape-extensions
                  path: ./cytoscape-extensions/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io-fidelity Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-graph-io-fidelity
                  path: ./graph-io/fidelity-stories/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download unified docs
              uses: actions/download-artifact@v4
              with:
                  name: build-docs
                  path: ./docs/.vitepress/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: ./algorithms/gh-pages/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: ./layout/gh-pages/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # graph-samples' datasets, every one of them: no package bundles their data. scripts/build-hosted.mjs
            # needs only Node and the builds of graph-format, graph-io (the Cytoscape and ontology datasets are
            # read by graph-io's own importers) and graph-samples (whose dist/data/v1/ holds the small datasets,
            # packed from the repository's data/, which the script copies beside the large ones it builds); it
            # records every source's URL and SHA-256, so its hash keys the download cache and an older cache
            # still serves the sources that did not change.
            - name: Download graph-format build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-format
                  path: ./graph-format/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-io
                  path: ./graph-io/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-samples build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-samples
                  path: ./graph-samples/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # Nothing is installed here, so graph-io's import of @graphty/graph-format is pointed at
            # the checkout's graph-format, the way the workspace links it
            - name: Link graph-format for graph-io
              run: mkdir -p graph-io/node_modules/@graphty && ln -s ../../../graph-format graph-io/node_modules/@graphty/graph-format

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Cache graph-samples dataset sources
              uses: actions/cache@v4
              with:
                  path: tmp/graph-samples-sources
                  key: graph-samples-sources-${{ hashFiles('graph-samples/scripts/build-hosted.mjs', 'graph-samples/scripts/graph-io-source.mjs') }}
                  restore-keys: graph-samples-sources-

            # Fails the deploy rather than publishing a site without the data fetchDataset() loads
            - name: Build graph-samples hosted datasets
              run: node graph-samples/scripts/build-hosted.mjs

            # Assemble the unified GitHub Pages site. The URL layout (what goes where, and the
            # /storybook/element/ -> /storybook/graphty-element/ redirects) lives in the script, which
            # CI's link check also runs, so every link to graphty.app is checked against this site.
            # The build stamp: the commit, and the app's release tag that holds it. nx tags the version
            # commit, a child of the released commit, so the oldest graphty@ tag containing the commit is
            # its release; when the release had nothing to version for the app, there is no such tag yet
            # and the newest one before it is the app's current release.
            - name: Assemble GitHub Pages site
              run: |
                  tag=$(git tag --contains "$SHA" --list 'graphty@[0-9]*' --sort=version:refname | head -1)
                  [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'graphty@[0-9]*' "$SHA" || echo none)
                  GRAPHTY_BUILD="commit=${SHA} release=${tag}" ./tools/assemble-pages-site.sh ./public
                  echo ""
                  echo "Site structure:"
                  find ./public -maxdepth 3 -name "index.html" | sort

            - name: Publish the beta build
              env:
                  GH_TOKEN: ${{ secrets.GRAPHTY_BETA_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::the secret GRAPHTY_BETA_TOKEN is not set, so nothing can be written to graphty-org/graphty-beta (see the top of deploy-pages.yml)"
                      exit 1
                  fi
                  tools/pages-builds.sh pack ./public "$RUNNER_TEMP/build"
                  {
                      echo "graphty-monorepo commit ${SHA} (https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}), built by https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}."
                      echo ""
                      echo "Stamp: \`$(grep -o 'name="graphty-build" content="[^"]*"' public/index.html | sed 's/.*content="//; s/"$//')\`"
                      echo ""
                      echo "To put this build on graphty.app, run \"Promote a beta build to graphty.app\" (https://github.com/${GITHUB_REPOSITORY}/actions/workflows/promote-pages.yml) with ${SHA:0:12}."
                  } > "$RUNNER_TEMP/notes.md"
                  tools/pages-builds.sh publish "$SHA" "$RUNNER_TEMP/build" "$RUNNER_TEMP/notes.md"

            # The datasets graph-samples and cytoscape-extensions download live on graphty.app, and a new npm
            # release may name one this build added: compare this build's index with the one graphty.app serves.
            - name: Did the hosted datasets change
              id: data
              run: |
                  if curl -fsSL --max-time 60 https://graphty.app/data/graph-samples/v1/index.json | cmp -s - public/data/graph-samples/v1/index.json; then
                      echo "graphty.app serves these datasets already"; echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::the hosted datasets changed; graphty.app gets them with the build it serves"; echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

    # graphty.app: the build it serves already, with the newest datasets laid over its own.
    data:
        name: Hosted data to graphty.app
        needs: build
        if: ${{ needs.build.outputs.data-changed == 'true' }}
        uses: ./.github/workflows/promote-pages.yml
        with:
            build: live
