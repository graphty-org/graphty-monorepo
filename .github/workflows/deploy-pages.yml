name: Deploy to GitHub Pages

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [master]
    # Manual trigger not supported - artifacts only available from CI workflow
    # To redeploy, re-run the CI workflow on master instead

permissions:
    contents: read
    pages: write
    id-token: write
    actions: read # Required to download artifacts from other workflow runs

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: Assemble Site
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Download all artifacts from CI workflow
            - name: Download graphty app build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: ./graphty/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty-element Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-element
                  path: ./graphty-element/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-app
                  path: ./graphty/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download compact-mantine Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-compact-mantine
                  path: ./compact-mantine/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-algorithms
                  path: ./algorithms/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout Storybook
              uses: actions/download-artifact@v4
              with:
                  name: build-storybook-layout
                  path: ./layout/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download unified docs
              uses: actions/download-artifact@v4
              with:
                  name: build-docs
                  path: ./docs/.vitepress/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-algorithms
                  path: ./algorithms/gh-pages/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout gh-pages
              uses: actions/download-artifact@v4
              with:
                  name: build-ghpages-layout
                  path: ./layout/gh-pages/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # graph-samples' hosted datasets. scripts/build-hosted.mjs needs only Node and graph-format's
            # build; it records every source's URL and SHA-256, so its hash keys the download cache
            # and an older cache still serves the sources that did not change.
            - name: Download graph-format build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-format
                  path: ./graph-format/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Cache graph-samples dataset sources
              uses: actions/cache@v4
              with:
                  path: tmp/graph-samples-sources
                  key: graph-samples-sources-${{ hashFiles('graph-samples/scripts/build-hosted.mjs') }}
                  restore-keys: graph-samples-sources-

            # Fails the deploy rather than publishing a site without the data fetchDataset() loads
            - name: Build graph-samples hosted datasets
              run: node graph-samples/scripts/build-hosted.mjs

            # Assemble the unified GitHub Pages site. The URL layout (what goes where, and the
            # /storybook/element/ -> /storybook/graphty-element/ redirects) lives in the script, which
            # CI's link check also runs, so every link to graphty.app is checked against this site.
            - name: Assemble GitHub Pages site
              run: |
                  ./tools/assemble-pages-site.sh ./public
                  echo ""
                  echo "Site structure:"
                  find ./public -maxdepth 3 -name "index.html" | sort

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
