name: Deploy to GitHub Pages

# Every green CI run of a push to master assembles graphty.app (the app, the docs, the Storybooks and the hosted
# data: one Pages site) from exactly that run's artifacts and keeps it as artifact site-<sha> (14 days). Only the
# version merge release.yml's land job pushes ("chore(release): publish <tags> onto master") deploys it, so
# graphty.app moves with npm's latest and nothing else moves it (design/ci/channels-pipeline.md, section 12,
# step 0). To redeploy, re-run this workflow's run for that version merge.
on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
        branches:
            - master

env:
    RUN_ID: ${{ github.event.workflow_run.id }}
    SHA: ${{ github.event.workflow_run.head_sha }}

permissions:
    contents: read
    pages: write
    id-token: write
    actions: read # Required to download artifacts from other workflow runs

jobs:
    # Only a green CI run of a push to master builds the site, and only a release's version merge deploys it: a
    # merge commit whose subject is the one release.yml's land job writes. The live page's build stamp says which
    # commit it serves; when it is this one (a re-run), or a newer one (CI runs finish out of order), there is
    # nothing to deploy.
    check:
        name: Is this a release to deploy
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        runs-on: ubuntu-24.04
        outputs:
            deploy: ${{ steps.live.outputs.deploy }}
        steps:
            - id: live
              env:
                  GH_TOKEN: ${{ github.token }}
                  MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
              run: |
                  # The subject alone proves nothing: any pull request can be merged with this subject. A real
                  # version merge's second parent is the version commit, which the release's tags point at, and
                  # only the release deploy key pushes those tags. So the first tag the subject names must
                  # point at this merge's second parent.
                  subject=${MESSAGE%%$'\n'*}
                  second="" target=""
                  case "$subject" in
                      "chore(release): publish "*" onto master")
                          tag=${subject#chore(release): publish }; tag=${tag% onto master}; tag=${tag%%,*}
                          second=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq 'if (.parents | length) == 2 then .parents[1].sha else "" end')
                          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$(jq -rn --arg t "$tag" '$t | @uri')" --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null || true)
                          case "$ref" in
                              "tag "*) target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref#tag }" --jq .object.sha) ;;
                              "commit "*) target=${ref#commit } ;;
                          esac ;;
                  esac
                  if [ -z "$second" ] || [ "$target" != "$second" ]; then
                      echo "::notice::${SHA} is not a release's version merge: its site is kept as artifact site-${SHA}, graphty.app stays"
                      echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  live=$(curl -fsSL --max-time 30 https://graphty.app/ | grep -o 'name="graphty-build" content="[^"]*"' || true)
                  echo "live stamp: ${live:-none}"
                  live_sha=$(sed -n 's/.*commit=\([0-9a-f]*\) .*/\1/p' <<< "$live")
                  case "$live" in
                      *"commit=${SHA} "*) echo "::notice::${SHA} is live already"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
                  esac
                  if [ -n "$live_sha" ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/${live_sha}...${SHA}" --jq .status 2>/dev/null)" = behind ]; then
                      echo "::notice::the live ${live_sha} is newer than ${SHA}"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  echo "deploy=true" >> "$GITHUB_OUTPUT"

    build:
        name: Assemble Site
        needs: check
        runs-on: ubuntu-24.04
        steps:
            # The deployed commit, with history and tags, so the stamp below can name the app's release.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0

            # Download all artifacts from CI workflow
            - name: Download graphty app build
              uses: actions/download-artifact@v8
              with:
                  name: build-graphty
                  path: ./graphty/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty-element Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-element
                  path: ./graphty-element/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-app
                  path: ./graphty/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download compact-mantine Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-compact-mantine
                  path: ./compact-mantine/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-algorithms
                  path: ./algorithms/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-layout
                  path: ./layout/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download cytoscape-extensions Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-cytoscape-extensions
                  path: ./cytoscape-extensions/storybook-static/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io-fidelity Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-graph-io-fidelity
                  path: ./graph-io/fidelity-stories/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download unified docs
              uses: actions/download-artifact@v8
              with:
                  name: build-docs
                  path: ./docs/.vitepress/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms gh-pages
              uses: actions/download-artifact@v8
              with:
                  name: build-ghpages-algorithms
                  path: ./algorithms/gh-pages/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout gh-pages
              uses: actions/download-artifact@v8
              with:
                  name: build-ghpages-layout
                  path: ./layout/gh-pages/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # graph-samples' datasets, every one of them: no package bundles their data. scripts/build-hosted.mjs
            # needs only Node and the builds of graph-format, graph-io (the Cytoscape and ontology datasets are
            # read by graph-io's own importers) and graph-samples (whose dist/data/v1/ holds the small datasets,
            # packed from the repository's data/, which the script copies beside the large ones it builds). With
            # --reuse-published it takes each large dataset already on graphty.app whose SHA-256 is the one
            # src/datasets/hosted.ts records, so a deploy never depends on the third-party source hosts (#3302);
            # only a dataset whose recorded checksum changed is built from its sources. The script records every
            # source's URL and SHA-256, so its hash keys the download cache for those builds.
            - name: Download graph-format build
              uses: actions/download-artifact@v8
              with:
                  name: build-graph-format
                  path: ./graph-format/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io build
              uses: actions/download-artifact@v8
              with:
                  name: build-graph-io
                  path: ./graph-io/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-samples build
              uses: actions/download-artifact@v8
              with:
                  name: build-graph-samples
                  path: ./graph-samples/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # Nothing is installed here, so graph-io's import of @graphty/graph-format is pointed at
            # the checkout's graph-format, the way the workspace links it
            - name: Link graph-format for graph-io
              run: mkdir -p graph-io/node_modules/@graphty && ln -s ../../../graph-format graph-io/node_modules/@graphty/graph-format

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Cache graph-samples dataset sources
              uses: actions/cache@v4
              with:
                  path: tmp/graph-samples-sources
                  key: graph-samples-sources-${{ hashFiles('graph-samples/scripts/build-hosted.mjs', 'graph-samples/scripts/graph-io-source.mjs') }}
                  restore-keys: graph-samples-sources-

            # Fails the deploy rather than publishing a site without the data fetchDataset() loads
            - name: Build graph-samples hosted datasets
              run: node graph-samples/scripts/build-hosted.mjs --reuse-published

            # The gazetteer the location map reads place names with (Natural Earth and GeoNames),
            # published at /data/gazetteer/v1/. GeoNames republishes its cities daily, so the cache
            # key carries the date: the files follow GeoNames within a day, and fail the deploy rather
            # than publishing a site whose place names cannot be read.
            - name: Date for the gazetteer sources
              id: gazetteer-date
              run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

            - name: Cache gazetteer sources
              uses: actions/cache@v4
              with:
                  path: tmp/gazetteer-sources
                  key: gazetteer-sources-${{ hashFiles('graphty-element/scripts/build-gazetteer.mjs') }}-${{ steps.gazetteer-date.outputs.day }}
                  restore-keys: gazetteer-sources-${{ hashFiles('graphty-element/scripts/build-gazetteer.mjs') }}-

            - name: Build the gazetteer
              run: node graphty-element/scripts/build-gazetteer.mjs

            # Assemble the unified GitHub Pages site. The URL layout (what goes where, and the
            # /storybook/element/ -> /storybook/graphty-element/ redirects) lives in the script, which
            # CI's link check also runs, so every link to graphty.app is checked against this site.
            # The build stamp: the commit, and the app's release tag that holds it. nx tags the version
            # commit, a child of the released commit, so the oldest graphty@ tag containing the commit is
            # its release; when the release had nothing to version for the app, there is no such tag yet
            # and the newest one before it is the app's current release.
            - name: Assemble GitHub Pages site
              run: |
                  tag=$(git tag --contains "$SHA" --list 'graphty@[0-9]*' --sort=version:refname | head -1)
                  [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'graphty@[0-9]*' "$SHA" || echo none)
                  GRAPHTY_BUILD="commit=${SHA} release=${tag}" ./tools/assemble-pages-site.sh ./public
                  echo ""
                  echo "Site structure:"
                  find ./public -maxdepth 3 -name "index.html" | sort

            # The site of every master build, one tarball, whether or not it deploys
            - name: Pack the site
              run: tar -cf "site-${SHA}.tar" -C ./public .

            - name: Upload the site
              uses: actions/upload-artifact@v7
              with:
                  name: site-${{ env.SHA }}
                  path: site-${{ env.SHA }}.tar
                  retention-days: 14
                  compression-level: 0
                  if-no-files-found: error
                  overwrite: true

            # The full run picks its candidate from the sites the results store lists (GET /v1/candidate). The token
            # is this run's OIDC token (audience graphty-results): only master's own deploy-pages.yml may record a
            # site. Fails open, like every call to the store: a missed record only delays that commit's full run.
            - name: Record the site in the results store
              env:
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
              run: |
                  if [ -z "$RESULTS_URL" ]; then echo "::notice::RESULTS_URL is not set; site-${SHA} is not recorded"; exit 0; fi
                  token=$(curl -fsS --max-time 5 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=graphty-results" | jq -r .value) &&
                  curl -fsS --max-time 5 -X POST "${RESULTS_URL%/}/v1/sites" -H "Authorization: Bearer $token" \
                      -H "content-type: application/json" -H "X-Results-Schema: 1" -d "{\"sha\":\"${SHA}\"}" ||
                      echo "::warning::the results store did not record site-${SHA}"

            - name: Setup Pages
              if: ${{ needs.check.outputs.deploy == 'true' }}
              uses: actions/configure-pages@v4

            - name: Upload Pages artifact
              if: ${{ needs.check.outputs.deploy == 'true' }}
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        name: Deploy
        needs: [check, build]
        if: ${{ needs.check.outputs.deploy == 'true' }}
        # One deploy at a time; a newer pending deploy replaces an older pending one. On this job, not the workflow,
        # so an ordinary master build, which only keeps its site, never replaces a release's pending deploy.
        concurrency:
            group: deploy-pages
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
