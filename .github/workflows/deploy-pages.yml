name: Deploy to GitHub Pages

# Every green CI run of a push to master assembles the site (the app, the docs, the Storybooks and the hosted data:
# one Pages site) from exactly that run's artifacts, keeps it as artifact site-<sha> (14 days) and deploys it to this
# repository's GitHub Pages, served at canary.graphty.app (the custom domain is a Pages setting of this repository,
# not a file in the site). Canary is the first channel (design/ci/channels-pipeline.md, section 3):
# nightly.graphty.app and graphty.app are served by graphty-nightly and graphty-site and move only by promotion
# (promote.yml, and the full run's nightly promotion). The deploy job always deploys master's newest green build's
# site, so re-running any run redeploys canary's newest site when canary is behind it.
#
# release.yml also calls it (input sha and run_id) for a held nightly candidate's head past its commit (a fix forward,
# design/ci/channels-pipeline.md section 3), which master never built: then it only assembles and keeps site-<sha>
# from that run's artifacts; it records nothing in the results store and deploys nothing.
run-name: Deploy ${{ github.event.workflow_run.head_sha }}
on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
        branches:
            - master
    workflow_call:
        inputs:
            sha:
                description: "the commit whose site to assemble"
                type: string
                required: true
            run_id:
                description: "the run that built it (its build-* and build-storybook-* artifacts)"
                type: string
                required: true

env:
    RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}

permissions:
    contents: read
    pages: write
    id-token: write
    actions: read # Required to download artifacts from other workflow runs

jobs:
    build:
        name: Assemble Site
        # Only a green CI run of a push to master assembles a site, or release.yml's call for a held head
        if: ${{ inputs.sha || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
        runs-on: ubuntu-24.04
        steps:
            # The deployed commit, with history and tags, so the stamp below can name the app's release.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0

            # the workflow's tools/ and .github/actions/, not the checked-out commit's (tools/own-tools-overlay.test.mjs)
            - name: Use the workflow's own tools and actions
              env:
                  OVERLAY: tools .github/actions
              run: |
                  [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && exit 0
                  depth=$([ "$(git rev-parse --is-shallow-repository)" = true ] && echo --depth=1 || true)
                  git fetch --quiet --no-tags $depth origin "$GITHUB_SHA"
                  rm -rf $OVERLAY
                  git archive "$GITHUB_SHA" $OVERLAY | tar -x

            # Download all artifacts from CI workflow
            - name: Download graphty app build
              uses: actions/download-artifact@v8
              with:
                  name: build-graphty
                  path: ./graphty/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty-element Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-element
                  path: ./graphty-element/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-app
                  path: ./graphty/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download compact-mantine Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-compact-mantine
                  path: ./compact-mantine/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-algorithms
                  path: ./algorithms/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-layout
                  path: ./layout/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download cytoscape-extensions Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-cytoscape-extensions
                  path: ./cytoscape-extensions/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io-fidelity Storybook
              uses: actions/download-artifact@v8
              with:
                  name: build-storybook-graph-io-fidelity
                  path: ./graph-io/fidelity-stories/storybook-static/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download unified docs
              uses: actions/download-artifact@v8
              with:
                  name: build-docs
                  path: ./docs/.vitepress/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms gh-pages
              uses: actions/download-artifact@v8
              with:
                  name: build-ghpages-algorithms
                  path: ./algorithms/gh-pages/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout gh-pages
              uses: actions/download-artifact@v8
              with:
                  name: build-ghpages-layout
                  path: ./layout/gh-pages/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # graph-samples' datasets, every one of them: no package bundles their data. scripts/build-hosted.mjs
            # needs only Node and the builds of graph-format, graph-io (the Cytoscape and ontology datasets are
            # read by graph-io's own importers) and graph-samples (whose dist/data/v1/ holds the small datasets,
            # packed from the repository's data/, which the script copies beside the large ones it builds). With
            # --reuse-published it takes each large dataset already on canary.graphty.app (or else graphty.app) whose SHA-256 is the one
            # src/datasets/hosted.ts records, so a deploy never depends on the third-party source hosts (#3302);
            # only a dataset whose recorded checksum changed is built from its sources. The script records every
            # source's URL and SHA-256, so its hash keys the download cache for those builds.
            - name: Download graph-format build
              uses: actions/download-artifact@v8
              with:
                  name: build-graph-format
                  path: ./graph-format/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io build
              uses: actions/download-artifact@v8
              with:
                  name: build-graph-io
                  path: ./graph-io/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-samples build
              uses: actions/download-artifact@v8
              with:
                  name: build-graph-samples
                  path: ./graph-samples/dist/
                  run-id: ${{ env.RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # Nothing is installed here, so graph-io's import of @graphty/graph-format is pointed at
            # the checkout's graph-format, the way the workspace links it
            - name: Link graph-format for graph-io
              run: mkdir -p graph-io/node_modules/@graphty && ln -s ../../../graph-format graph-io/node_modules/@graphty/graph-format

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Cache graph-samples dataset sources
              uses: actions/cache@v6
              with:
                  path: tmp/graph-samples-sources
                  key: graph-samples-sources-${{ hashFiles('graph-samples/scripts/build-hosted.mjs', 'graph-samples/scripts/graph-io-source.mjs') }}
                  restore-keys: graph-samples-sources-

            # Fails the deploy rather than publishing a site without the data fetchDataset() loads
            - name: Build graph-samples hosted datasets
              run: node graph-samples/scripts/build-hosted.mjs --reuse-published

            # The gazetteer the location map reads place names with (Natural Earth and GeoNames),
            # published at /data/gazetteer/v1/. Its sources are downloaded fresh on every deploy (no
            # cache: a cache restored into this privileged job could be poisoned), and a failed
            # download fails the deploy rather than publishing a site whose place names cannot be read.
            - name: Build the gazetteer
              run: node graphty-element/scripts/build-gazetteer.mjs

            # Assemble the unified GitHub Pages site. The URL layout (what goes where, and the
            # /storybook/element/ -> /storybook/graphty-element/ redirects) lives in the script, which
            # CI's link check also runs, so every link to graphty.app is checked against this site.
            # The build stamp: the commit, and the app's release tag that holds it. nx tags the version
            # commit, a child of the released commit, so the oldest graphty@ tag containing the commit is
            # its release; when the release had nothing to version for the app, there is no such tag yet
            # and the newest one before it is the app's current release.
            - name: Assemble GitHub Pages site
              run: |
                  tag=$(git tag --contains "$SHA" --list 'graphty@[0-9]*' --sort=version:refname | head -1)
                  [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'graphty@[0-9]*' "$SHA" || echo none)
                  GRAPHTY_BUILD="commit=${SHA} release=${tag}" ./tools/assemble-pages-site.sh ./public
                  echo ""
                  echo "Site structure:"
                  find ./public -maxdepth 3 -name "index.html" | sort

            # The site of every master build, one tarball, whether or not it deploys
            - name: Pack the site
              run: tar -cf "site-${SHA}.tar" -C ./public .

            - name: Upload the site
              uses: actions/upload-artifact@v7
              with:
                  name: site-${{ env.SHA }}
                  path: site-${{ env.SHA }}.tar
                  retention-days: 14
                  compression-level: 0
                  if-no-files-found: error
                  overwrite: true

            # The full run picks its candidate from the sites the results store lists (GET /v1/candidate). The token
            # is this run's OIDC token (audience graphty-results): only master's own deploy-pages.yml may record a
            # site. Fails open, like every call to the store: a missed record only delays that commit's full run. The
            # pipeline health API (HEALTH_API_URL) then gets the same record with its own token (audience graphty-health).
            - name: Record the site in the results store
              if: ${{ !inputs.sha }}
              env:
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: |
                  if [ -z "$RESULTS_URL" ]; then
                      echo "::notice::RESULTS_URL is not set; site-${SHA} is not recorded in the results store"
                  else
                      token=$(curl -fsS --max-time 5 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=graphty-results" | jq -r .value) &&
                      curl -fsS --max-time 5 -X POST "${RESULTS_URL%/}/v1/sites" -H "Authorization: Bearer $token" \
                          -H "content-type: application/json" -H "X-Results-Schema: 1" -d "{\"sha\":\"${SHA}\"}" ||
                          echo "::warning::the results store did not record site-${SHA}"
                  fi
                  if [ -n "$HEALTH_API_URL" ]; then
                      htoken=$(curl -fsS --max-time 2 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=graphty-health" | jq -r '.value // empty') || true
                      if [ -n "$htoken" ]; then
                          curl -fsS --max-time 2 -X POST "${HEALTH_API_URL%/}/v1/sites" -H "Authorization: Bearer $htoken" \
                              -H "content-type: application/json" -H "X-Results-Schema: 1" -d "{\"sha\":\"${SHA}\"}" || true
                      fi
                  fi

    # Canary always gets master's NEWEST green build, whichever build's run gets here: an older build's run deploys
    # the newest site too, so the order in which runs finish or queue does not matter, and a newest build whose own
    # deploy was replaced in the queue is still deployed by the next one. It deploys only when that build is ahead of
    # the commit canary's build stamp names, so nothing older ever replaces canary. Every read that fails (the Pages
    # settings, the runs list, canary itself, the compare, the artifact) fails the job, and master-guard reports it.
    deploy:
        name: Deploy
        needs: build
        # release.yml's call only assembles a site
        if: ${{ !inputs.sha }}
        # One deploy at a time; a later queued deploy replaces a pending one, which is harmless, since each deploys
        # the newest site. On this job, not the workflow, so every build still assembles and keeps its own site-<sha>.
        concurrency:
            group: deploy-pages
        permissions:
            contents: read
            pages: write
            id-token: write
            actions: read # the CI runs list, and the newest build's site-<sha> from that build's own run
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: live
              env:
                  GH_TOKEN: ${{ github.token }}
                  CANARY_URL: https://canary.graphty.app/
              run: |
                  fail() { echo "::error::$*: nothing is deployed"; exit 1; }
                  skip() { echo "::notice::$*"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
                  # Before the domain swap this repository's Pages domain was graphty.app, which only promotion may move
                  cname=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""') || fail "this repository's Pages settings could not be read"
                  [ "$cname" != graphty.app ] || skip "this repository's Pages domain is still graphty.app, which moves only by promotion"
                  [ "$cname" = canary.graphty.app ] || fail "this repository's Pages domain is '${cname}', not canary.graphty.app"
                  newest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""') || newest=""
                  [ -n "$newest" ] || fail "master's newest green build could not be read"
                  # the runs list can lag a run that just completed: the build that started this run counts too
                  if [ "$newest" != "$SHA" ]; then
                      order=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${newest}...${SHA}" --jq .status) || order=""
                      case "$order" in
                          ahead) newest="$SHA" ;;
                          behind | identical | diverged) ;;
                          *) fail "${SHA} could not be compared with ${newest}" ;;
                      esac
                  fi
                  # a query string of its own, so the Pages CDN answers with what is live now, not a cached page.
                  # Only a 200 with a build stamp is an answer. Anything else (a 404: this repository's Pages always
                  # serves a site, a 5xx, a 429, no answer, a body that breaks off after the headers) is a failed read.
                  page="${RUNNER_TEMP:-/tmp}/canary.html"
                  code=$(curl -sSL --max-time 30 -o "$page" -w '%{http_code}' "${CANARY_URL}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}") || code=000
                  live=""
                  case "$code" in
                      200) live=$(sed -n 's/.*name="graphty-build" content="commit=\([0-9a-f]\{7,40\}\)[ "].*/\1/p' "$page" | head -1)
                          [ -n "$live" ] || fail "canary.graphty.app answered without a build stamp" ;;
                      *) fail "canary.graphty.app could not be read (HTTP ${code})" ;;
                  esac
                  echo "canary serves: ${live:-nothing yet}; master's newest green build: ${newest}"
                  [ "$live" != "$newest" ] || skip "${newest} is live on canary already"
                  if [ -n "$live" ]; then
                      status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${live}...${newest}" --jq .status) || status=""
                      case "$status" in
                          ahead | diverged) ;;
                          behind | identical) skip "${newest} is not ahead of canary's ${live}" ;;
                          *) fail "canary's ${live} could not be compared with ${newest}" ;;
                      esac
                  fi
                  # this run's own site was uploaded by its build job moments ago: no list, which may not show it yet
                  if [ "$newest" = "$SHA" ]; then
                      { echo "sha=${newest}"; echo "run=${GITHUB_RUN_ID}"; echo "deploy=true"; } >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site-${newest}&per_page=1" --jq '.artifacts[0] // {} | if .expired then "expired" else (.workflow_run.id // "" | tostring) end') || fail "the artifacts of ${newest} could not be listed"
                  [ "$run" != expired ] || fail "site-${newest} has expired"
                  [ -n "$run" ] || skip "site-${newest} is not assembled yet: that build's own run deploys it"
                  { echo "sha=${newest}"; echo "run=${run}"; echo "deploy=true"; } >> "$GITHUB_OUTPUT"

            - name: Download the newest site
              if: ${{ steps.live.outputs.deploy == 'true' }}
              uses: actions/download-artifact@v8
              with:
                  name: site-${{ steps.live.outputs.sha }}
                  path: ./site/
                  run-id: ${{ steps.live.outputs.run }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # master's tip, like promote.yml: graphty/sites/canary.json may not exist at an older deployed commit
            - name: Check out canary's site.json
              if: ${{ steps.live.outputs.deploy == 'true' }}
              uses: actions/checkout@v7
              with:
                  sparse-checkout: graphty/sites
                  path: ./repo/

            # The kept site-<sha> has no site.json (a promotion writes its own); the canary deploy adds canary's.
            - name: Unpack the site and add canary's site.json
              if: ${{ steps.live.outputs.deploy == 'true' }}
              env:
                  NEWEST: ${{ steps.live.outputs.sha }}
              run: |
                  mkdir public
                  tar -xf "site/site-${NEWEST}.tar" -C public
                  jq . repo/graphty/sites/canary.json > public/site.json

            - name: Setup Pages
              if: ${{ steps.live.outputs.deploy == 'true' }}
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              if: ${{ steps.live.outputs.deploy == 'true' }}
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./public

            - name: Deploy to GitHub Pages
              if: ${{ steps.live.outputs.deploy == 'true' }}
              id: deployment
              uses: actions/deploy-pages@v5
