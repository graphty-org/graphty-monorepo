# Verification of golden in CI (design/ci/ci-full-testing.md, section 3.2): the full ci.yml suite on one golden
# commit, called exactly as the release train calls it. tools/verify.mjs starts a run by pushing the commit to a
# scratch branch and reads the run's result; on green it moves golden-verified.
#
# - golden-candidate: golden's newest commit; golden-cut-candidate: golden-cut's head after a cut-fix.
# - golden-bisect-1, golden-bisect-2: the points of a bisect that only fails in CI.
# A push trigger runs the pushed commit's own copy of this file, so it works before it reaches master. The
# dispatch (one call, `ref` and optional `shards`) works once this file is on master; a bisect point then runs
# only the failing shards.
#
# Every check is named "Verify / <job>", so this run's "Verify / All Checks Pass" can never stand in for the
# "All Checks Pass" master's ruleset requires, even when the cut pull request's head is this same commit. The
# pull-request-only steps of ci.yml (draft, early verdicts, the visual gate) do not run, and master-guard,
# deploy-pages and release (workflow_run of "CI", or pushes to master) never see this run. It gates no merge.
name: Golden verify

on:
    push:
        branches: [golden-candidate, golden-cut-candidate, golden-bisect-1, golden-bisect-2]
    workflow_dispatch:
        inputs:
            ref:
                description: "the commit to verify"
                type: string
                required: true
            shards:
                description: "a JSON list of test shard names to run alone (a CI bisect point); empty runs everything"
                type: string
                required: false
                default: ""

# One running and one pending run per scratch branch (or per dispatched commit); a newer pending run replaces
# an older one. tools/verify.mjs starts a new run only when its current one has ended, so this only backs it up.
# A dispatched commit has a group of its own, so two bisect points run side by side.
concurrency:
    group: golden-verify-${{ inputs.ref || github.ref_name }}
    cancel-in-progress: false

# What ci.yml asks for, as release.yml grants it: a called workflow cannot ask for more than its caller grants.
permissions:
    contents: read
    actions: read
    checks: write

jobs:
    verify:
        name: Verify
        uses: ./.github/workflows/ci.yml
        with:
            ref: ${{ inputs.ref || github.sha }}
            verify: true
            shards: ${{ inputs.shards || '' }}
        secrets: inherit
