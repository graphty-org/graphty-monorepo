# .github/workflows/gpu.yml -- the webgpu-graph-algorithms GPU lane: never a job of CI (a job whose runner is
# offline would queue for 24 hours and stall every pull request), but REQUIRED for a release: release.yml's gate
# job waits for this workflow's run on the released commit and refuses to publish unless it succeeded (owner
# decision, 2026-09-18). The lane runs on every master push, and on a pull request of this repository labelled
# `gpu`; there is NO nightly cron (owner decision, 2026-09-19 -- the gate already runs it on everything that
# reaches master, so a nightly only re-ran a commit the lane had already judged, on a paid runner).
# design/webgpu/webgpu-acceleration-plan.md sections 12.1-12.6; the staging lane ported with three
# changes: paths without the packages/ prefix, its own install and nx build on the runner (no artifact download,
# no needs: on CI), and pnpm/action-setup without package_json_file (the root package.json has packageManager).
name: GPU
on:
    push: { branches: [master] }
    pull_request: { types: [labeled, synchronize] }
    workflow_dispatch:
        inputs:
            # which machine serves the T4 job. The default is a machine.dev on-demand T4 (the Machine Provisioner app
            # is installed on the org; Ubuntu 22.04 with the NVIDIA driver and CUDA preinstalled; T4 4-vCPU on-demand
            # $0.018/min, spot $0.0045/min): on 2026-09-18 the GitHub-hosted gpu-linux-t4 runner of design 12.4 (runner
            # group `gpu`, $0.052/min) never dequeued a job -- one dispatch was refused on billing, the next sat queued
            # for 17 minutes with no runner -- while machine.dev provisioned in about a minute at a third of the price.
            # The hosted label stays a dispatch option. push / pull_request runs take the default.
            # GRAPHTY_RUNNER_CLASS stays gpu-linux-t4 either way: the class names the hardware, and
            # benchmarks/results/gpu-linux-t4.json is the T4 baseline whichever provider ran it.
            runner:
                description: "runs-on label for the T4 job"
                type: choice
                default: machine/gpu=t4/cpu=4/ram=16/tenancy=on_demand
                options:
                    - gpu-linux-t4
                    - machine/gpu=t4/cpu=4/ram=16/tenancy=on_demand
                    - machine/gpu=t4/cpu=4/ram=16/tenancy=spot
permissions: { contents: read }
concurrency:
    group: gpu-lane-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test-gpu:
        name: Test (NVIDIA T4)
        if: >-
            (github.event_name != 'pull_request' ||
             (github.event.pull_request.head.repo.full_name == github.repository &&
              contains(github.event.pull_request.labels.*.name, 'gpu')))
        runs-on: ${{ inputs.runner || 'machine/gpu=t4/cpu=4/ram=16/tenancy=on_demand' }} # a dispatch may pick the hosted gpu-linux-t4 (see the input); every other event: machine.dev on-demand
        timeout-minutes: 45
        env:
            GRAPHTY_GPU_REQUIRE: nvidia # a software adapter fails the job
            GRAPHTY_BROWSER_GPU: nvidia # --enable-unsafe-webgpu --enable-features=Vulkan --use-angle=vulkan --disable-vulkan-surface
            GRAPHTY_RUNNER_CLASS: gpu-linux-t4 # the benchmark runner class names the hardware (the T4), not the provider that ran it
            XDG_RUNTIME_DIR: /tmp
        defaults: { run: { working-directory: webgpu-graph-algorithms, shell: bash } }
        steps:
            - uses: actions/checkout@v4
            - name: Driver up (the partner image may need the modules loaded; G0 records whether this step is a no-op)
              run: before=$(lsmod | grep -c '^nvidia' || true); sudo modprobe nvidia nvidia_uvm && rc=0 || rc=$?; echo "modprobe exit=$rc nvidia modules before=$before after=$(lsmod | grep -c '^nvidia' || true)"; nvidia-smi; { cat /etc/os-release | head -2; ldd --version | head -1; uname -r; dpkg-query -W libegl1 mesa-vulkan-drivers libvulkan1 xvfb 2>&1 | head -5; ls /usr/share/vulkan/icd.d 2>&1 | head -12; echo DISPLAY=${DISPLAY:-unset}; } || true # the image facts of G0 rows F1-F3, F5, F6, F7, F9; the group never fails the step (under bash -eo pipefail a missing package, or head closing the pipe on ldd, would)
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22.x, cache: pnpm }
            - run: pnpm install --frozen-lockfile
              working-directory: .
              env: { HUSKY: "0" }
            - name: Build the package and what it depends on (nx follows ^build, so layout builds through its real edge; the negated implicit dependency keeps algorithms out)
              run: pnpm exec nx run-many -t build --projects=graph-format,webgpu-graph-algorithms
              working-directory: .
            - name: Adapter report (fails loudly on a software adapter; samples GPU utilisation for 10 s)
              run: node scripts/gpu-report.js > gpu-report.json && cat gpu-report.json # no pipe into tee: the report's non-zero exit must reach the step
            - name: graph-format GPU audit on NVIDIA (canary)
              working-directory: graph-format
              run: pnpm exec vitest run test/audit/gpu-upload.test.ts 2>&1 | tee canary.log && grep -q "adapter vendor=nvidia" canary.log # the audit skips on acquisition failure; the grep turns a skip or a lavapipe pick into a red step
            - run: pnpm exec vitest run --project=node --project=node-limits
            - run: GRAPHTY_GPU_NO_SUBGROUPS=1 pnpm exec vitest run --project=node # the whole node project on the twins
            - name: Cache Playwright browsers
              id: pw
              uses: actions/cache@v4
              with:
                  {
                      path: ~/.cache/ms-playwright,
                      key: "playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}",
                  }
            - if: steps.pw.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium --with-deps # a fresh VM each job
            - name: Browser smoke on NVIDIA
              run: node scripts/run-browser-project.js # G0 decides whether this needs `xvfb-run -a` on the T4 image (design 12.2)
            - name: graphty-element's accelerated layout on NVIDIA (the element is the only consumer that drives the layout kernels end to end)
              working-directory: graphty-element
              timeout-minutes: 20 # Chromium on the NVIDIA path can hang AFTER every test passed (webgpu-graph-algorithms R-13); bound it here rather than let it eat the job's 45
              run: pnpm exec nx run-many -t build --projects=@graphty/remote-logger,algorithms && pnpm exec vitest run --project=browser test/browser/webgpu-layout.test.ts # the job env already carries GRAPHTY_BROWSER_GPU=nvidia; nx resolves the workspace root from here. @graphty/remote-logger is the sibling nothing else in this job builds -- the element's runtime graph reaches it (src/Graph.ts -> src/logging/sinks/RemoteSink.ts) and its exports map has no src fallback; algorithms already builds through the ^build edge of the step above, so that half is a cache hit kept only in case the edge goes away
            - run: pnpm run bench # tsx benchmarks/run.ts -> benchmarks/out/gpu-linux-t4.json
            - run: node scripts/bench-compare.js # > 3x the checked-in baseline for THIS runner class (benchmarks/results/gpu-linux-t4.json) fails; no baseline -> every row "new", exit 0
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  {
                      name: "gpu-results-${{ github.run_id }}",
                      path: "webgpu-graph-algorithms/gpu-report.json\nwebgpu-graph-algorithms/benchmarks/out/",
                      retention-days: 90,
                      overwrite: true,
                  }
