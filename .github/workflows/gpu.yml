# .github/workflows/gpu.yml -- the webgpu-graph-algorithms GPU lane on an NVIDIA T4 (design/ci/ci-cd-plan.md section 7).
# Never a job of CI (a job whose runner is offline would queue for 24 hours and stall every pull request), but
# REQUIRED twice over:
# - for queue entry: .mergify.yml queues a pull request only once this workflow's "T4 GPU gate" check is green on its
#   head (or the pull request touches nothing the lane depends on). The gate passes when nx says the change does not
#   affect webgpu-graph-algorithms, when the T4 already passed on an earlier commit of the pull request and nothing
#   since affects it, or when the T4 passes on this commit. So the paid T4 runs once per pull request that affects the
#   package, again only when a later push affects it again, and never on a draft.
# - for a release: release.yml's gate job reads this workflow's run on the released commit and refuses to publish
#   unless it succeeded (owner decision, 2026-09-18). On master the same gate decides: a commit that does not affect
#   the package since the newest master commit the T4 passed on inherits that pass without a T4 run.
# The plan's nightly T4 run is OFF (the commented-out schedule below is its switch): spot tenancy is on hold (issue
# #1003) and the machine.dev balance cannot carry it yet. A red run on master opens a priority:critical issue
# (master-guard.yml) but never freezes the merge queue.
# A pull request's paired benchmark runs only the groups its change can move (scripts/bench-groups.js); every group is
# compared once a week instead, master's tip against the latest release, by gpu-weekly-paired.yml -- a workflow of
# its own so that its result never becomes the run release.yml's gate reads for a commit.
# The lane is ONE job, and needs a runner that lives longer than 30 minutes. On the free machine.dev plan a runner
# is terminated at that mark -- "free plan runners are limited to 30 minutes", the message that killed run
# 35664428780 with the benchmarks 77 seconds in and run 35666281226 on master -- and by 2026-09-21 the package's own
# suites no longer fit: 18 minutes for the node and node-limits projects (then one step, now two), 11.5 for the no-subgroups twins, a minute
# for the browser smoke, then the benchmarks, against 18 minutes for all of it a phase earlier. The growth is
# cumulative across P3, P5 and P4 rather than any one of them, and the million-node limits file alone, which runs
# nowhere else, is nine of those minutes. Splitting the work across matrix legs was tried and does not work on this
# provider: three legs at once are refused with "concurrent runner limit reached", and sequential legs never get a
# second machine, which suggests a run holds its runner until the whole run ends. The plan is therefore what had to
# change (owner decision, 2026-09-22); the timeout below is this job's own, inside whatever the plan now allows.
# A one-off credit bundle does NOT lift the cap: run 35748654167 (2026-09-22, bought credits on the account) ran
# every test step green on the T4 -- node and node-limits 17 minutes together, the no-subgroups twins 11.5, the browser
# smoke 1 -- and was then shut down 32 minutes in, a minute into the benchmarks, with "The runner has received a
# shutdown signal". The cap goes with the PLAN, and a subscription lifts it: on the very next run, 35775999450,
# the same job ran 33m40s and finished every step green, benchmarks and the regression comparison included.
# design/webgpu/webgpu-acceleration-plan.md sections 12.1-12.6; the staging lane ported with three
# changes: paths without the packages/ prefix, its own install and nx build on the runner (no artifact download,
# no needs: on CI), and pnpm/action-setup without package_json_file (the root package.json has packageManager).
name: GPU
on:
    push: { branches: [master] }
    # A draft runs nothing (every job's condition); marking it ready starts the run.
    pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
    # NIGHTLY T4 SWITCH, off: uncomment to run the T4 nightly on master's tip (on-demand, about $1.80 a night).
    # schedule: [{ cron: "23 6 * * *" }]
    workflow_dispatch:
        inputs:
            # which machine serves the T4 job. The default is a machine.dev spot T4 (on-demand before 2026-10-04) (the Machine Provisioner app
            # is installed on the org; the "Driver up" step below measured Ubuntu 22.04.5, glibc 2.35, libegl1 1.4.0-1
            # present and no /usr/share/vulkan/icd.d, on run 35922927676, 2026-09-23 -- and that 22.04 is what blocks
            # the `webgpu` 0.6.x bump on this lane: 0.5.0 moved its Linux build to 24.04 and its binary needs
            # GLIBCXX_3.4.32, which 22.04 does not ship. See webgpu-graph-algorithms/docs/decisions/G-ENV.md;
            # with the NVIDIA driver and CUDA preinstalled; T4 4-vCPU on-demand
            # $0.018/min, spot $0.0045/min): on 2026-09-18 the GitHub-hosted gpu-linux-t4 runner of design 12.4 (runner
            # group `gpu`, $0.052/min) never dequeued a job -- one dispatch was refused on billing, the next sat queued
            # for 17 minutes with no runner -- while machine.dev provisioned in about a minute at a third of the price.
            # The hosted label stays a dispatch option. push / pull_request runs take the default.
            # GRAPHTY_RUNNER_CLASS stays gpu-linux-t4 either way: the class names the hardware, and
            # benchmarks/results/gpu-linux-t4.json is the T4 baseline whichever provider ran it.
            runner:
                description: "runs-on label for the T4 job"
                type: choice
                default: machine/gpu=t4/cpu=4/ram=16/tenancy=spot
                options:
                    - gpu-linux-t4
                    - machine/gpu=t4/cpu=4/ram=16/tenancy=on_demand
                    - machine/gpu=t4/cpu=4/ram=16/tenancy=spot
permissions: { contents: read }
# One run at a time per pull request (and one for master pushes, one for a nightly), never cancelled: a newer push
# waits for the running T4 and then reuses its pass when its own change does not affect the package again, instead
# of throwing a paid hour away. A newer pending run replaces an older pending one, so at most two exist per group.
concurrency:
    group: gpu-lane-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
    cancel-in-progress: false

jobs:
    # Does this commit need the T4? A free GitHub runner answers before a paid one is asked for.
    decide:
        name: Does the change need the T4
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions: { contents: read, checks: read, pull-requests: read }
        outputs:
            run: ${{ steps.decide.outputs.run }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22.x, cache: pnpm }
            - run: pnpm install --frozen-lockfile
              env: { HUSKY: "0" }
            - name: Decide from nx affected and the T4's earlier passes
              id: decide
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  PR: ${{ github.event.pull_request.number }}
              run: bash tools/gpu-lane-needed.sh
    test-gpu:
        name: Test (NVIDIA T4)
        needs: decide
        # Never a fork's pull request: the lane is paid and runs the pull request's code on it.
        if: >-
            needs.decide.outputs.run == 'true' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # Spot by default (owner decision, 2026-10-04): $0.0045/min against $0.018/min on-demand, about 74% less. A
        # reclaimed spot runner fails the job with a lost-runner message; gpu-rerun-on-runner-loss.yml re-runs such a
        # run once, so a reclaim costs one retry, not a red lane. On-demand stays a dispatch option.
        runs-on: ${{ inputs.runner || 'machine/gpu=t4/cpu=4/ram=16/tenancy=spot' }} # a dispatch may pick on-demand or the hosted gpu-linux-t4 (see the input)
        # The whole job runs in a container because the HOST cannot be moved off Ubuntu 22.04 and `webgpu` 0.6.x
        # needs glibc 2.38. machine.dev has no image or operating-system selector: their label grammar is closed
        # (machine, then cpu= or gpu=, then architecture / cpu / ram / tenancy / regions / disk_size / disk_iops /
        # disk_throughput / metrics / metrics_interval / id) and their FAQ says every runner they provide is
        # Ubuntu 22.04, with no plan qualifier. What their GPU image DOES preinstall is Docker and the NVIDIA
        # Container Toolkit beside the driver, so the job can take its own userspace and still reach the card:
        # same runner, same label, same price, glibc 2.39. See webgpu-graph-algorithms/docs/decisions/G-ENV.md
        # section 3 item 2 for the alternatives that were rejected.
        # --gpus all needs the toolkit; it fails at "Initialize containers" if the driver is not up, which is the
        # loud failure we want. The host already has the modules loaded before any step runs (run 35922927676:
        # "modprobe exit=0 nvidia modules before=4 after=4"), which is what makes the dropped modprobe safe --
        # a container cannot load host kernel modules and must not need to.
        # NVIDIA_DRIVER_CAPABILITIES=all is load-bearing: the toolkit's default (utility,compute) injects CUDA but
        # NOT the Vulkan ICD or the EGL vendor json, and without those Dawn has no adapter at all.
        # --ipc=host gives Chromium a real /dev/shm; the 64 MB default crashes the browser smoke.
        # --privileged is load-bearing twice (owner decision, 2026-10-04): `nvidia-smi -lgc` needs it to lock the SM
        # clock for the benchmarks (issue #703; without it the lock is refused, run 37228458287), and the core_pattern
        # write of issue #273 needs a writable /proc/sys. The runner is a single-use machine.dev VM, so the wider
        # container boundary exposes nothing another job shares.
        container:
            image: ubuntu:24.04
            options: --gpus all --ipc=host --privileged
            env:
                NVIDIA_VISIBLE_DEVICES: all
                NVIDIA_DRIVER_CAPABILITIES: all
                DEBIAN_FRONTEND: noninteractive
        # The steps before the paired benchmark measured about 47 minutes on 2026-10-01 (run 36823257324, PR #663). The
        # paired benchmark runs 40 minutes at most when it selects a subset of the groups, 75 when a change selects all
        # of them: one full pass of every group is about 7.7 minutes on the T4 and the paired run makes eight (4 ABBA
        # rounds x 2 builds), about 65 minutes with the base build -- run 36882775800 (PR #663) hit the old 40-minute
        # step limit after about 5 of the 8 passes. 47 + 75 = 122, plus setup and the artifact upload: 130. Each step
        # that can hang keeps its own, tighter limit.
        # The container adds the image pull and the bootstrap apt: 10 more, 140.
        timeout-minutes: 140
        env:
            GRAPHTY_GPU_REQUIRE: nvidia # a software adapter fails the job
            GRAPHTY_BROWSER_GPU: nvidia # --enable-unsafe-webgpu --enable-features=Vulkan --use-angle=vulkan --disable-vulkan-surface
            GRAPHTY_RUNNER_CLASS: gpu-linux-t4 # the benchmark runner class names the hardware (the T4), not the provider that ran it
            XDG_RUNTIME_DIR: /tmp
        defaults: { run: { working-directory: webgpu-graph-algorithms, shell: bash } }
        steps:
            # Bootstrap, and it must come BEFORE checkout: a bare ubuntu:24.04 has no git, so actions/checkout
            # would silently fall back to downloading a repository tarball over the REST API. working-directory is
            # `/` because the job default points at a package directory that does not exist until checkout runs.
            # What each package is for: git for checkout; ca-certificates, curl and xz-utils for the Node tarball
            # actions/setup-node fetches (the runner's own node runs the actions, but the toolchain is installed
            # INSIDE the container, not reused from the host); libvulkan1 is the Khronos loader, which the NVIDIA
            # Container Toolkit does NOT inject -- it injects the driver's ICD beside it, and a loader-less
            # container reports no adapter; libegl1 because Dawn's NVIDIA ICD dlopen()s libEGL.so.1; sudo because
            # `playwright install --with-deps` shells out to it when it is present and apt otherwise.
            - name: Bootstrap the container (git for checkout, the Vulkan loader and libEGL for Dawn)
              working-directory: /
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      ca-certificates curl git gnupg sudo xz-utils \
                      libvulkan1 libegl1 libgl1
            - uses: actions/checkout@v4
            # The workspace is owned by the runner's user, not the container's root, so git refuses it ("dubious
            # ownership", run 37247157286) once checkout's own temporary exception is gone. The pull request steps
            # that diff against the base commit and build it for the paired benchmark need git.
            - name: Let git use the checkout inside the container
              working-directory: .
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            # No modprobe: a container cannot load host kernel modules, and it does not need to -- the host has
            # them up before the job starts (run 35922927676: "modprobe exit=0 nvidia modules before=4 after=4"),
            # and --gpus all fails at container creation if the driver is not there. This step records the
            # container's own floor instead, which is the whole point of the move, and fails LOUDLY if the card
            # or the Vulkan ICD did not make it through: a silent fall through to no adapter is what the lane
            # exists to prevent, and GRAPHTY_GPU_REQUIRE=nvidia would catch it later and less clearly.
            - name: Container floor and driver passthrough (the image facts of G0 rows F1-F3, F5, F6, F7, F9)
              run: |
                  { grep PRETTY_NAME /etc/os-release; ldd --version | head -1; uname -r
                    dpkg-query -W -f '${Package} ${Version}\n' libvulkan1 libegl1 libgl1
                    ls -1 /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>&1 | head -12
                    ls -1 /usr/share/glvnd/egl_vendor.d 2>&1 | head -5
                    echo "DISPLAY=${DISPLAY:-unset}"; } || true
                  nvidia-smi
                  test -e /usr/share/vulkan/icd.d/nvidia_icd.json -o -e /etc/vulkan/icd.d/nvidia_icd.json \
                    || { echo "::error::no NVIDIA Vulkan ICD in the container -- NVIDIA_DRIVER_CAPABILITIES must include graphics"; exit 1; }
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22.x, cache: pnpm }
            - run: pnpm install --frozen-lockfile
              working-directory: .
              env: { HUSKY: "0" }
            - name: Build the package and what it depends on (nx follows ^build, so layout builds through its real edge; the negated implicit dependency keeps algorithms out)
              run: pnpm exec nx run-many -t build --projects=graph-format,webgpu-graph-algorithms
              working-directory: .
            - name: Adapter report (fails loudly on a software adapter; samples GPU utilisation for 10 s)
              run: node scripts/gpu-report.js > gpu-report.json && cat gpu-report.json # no pipe into tee: the report's non-zero exit must reach the step
            - name: graph-format GPU audit on NVIDIA (canary)
              working-directory: graph-format
              run: pnpm exec vitest run test/audit/gpu-upload.test.ts 2>&1 | tee canary.log && grep -q "adapter vendor=nvidia" canary.log # the audit skips on acquisition failure; the grep turns a skip or a lavapipe pick into a red step
            # A forked vitest worker that crashes must not spend minutes writing a multi-gigabyte core dump.
            # scripts/run-node-shard.js runs vitest under `ulimit -c 0`, but the kernel ignores RLIMIT_CORE when
            # core_pattern pipes to a program (core(5)); a plain file pattern makes the limit bind. core_pattern is
            # global to the host; the job container is --privileged (above), so /proc/sys is writable from inside it
            # and the write reaches the host's kernel. Issue #273.
            - name: Write core dumps to a file so the shard's ulimit -c 0 holds
              run: |
                  echo "core_pattern was $(cat /proc/sys/kernel/core_pattern)"
                  # read back: procps' sysctl prints "ignoring: Read-only file system" and still exits 0 (run 37140992259)
                  sysctl -w kernel.core_pattern=core
                  [ "$(cat /proc/sys/kernel/core_pattern)" = core ] \
                    || { echo "::error::kernel.core_pattern is still $(cat /proc/sys/kernel/core_pattern): the container is not privileged and issue #273's guard does not hold"; exit 1; }
            # Every node project goes through scripts/run-node-shard.js: it forwards every argument, exits with
            # vitest's own code, and on a non-zero exit or 90 seconds of silence prints the test files that started
            # but never reported, the process table and a Node diagnostic report per surviving process (G4-F14).
            # Each project is an invocation of its own. vitest reads fileParallelism from the ROOT config, so the
            # config serialises a whole run that selects node-device-errors or node-limits; naming either beside
            # `node` would serialise the main suite too.
            - run: node scripts/run-node-shard.js --project=node
            # The files that break a device on purpose: a worker they kill takes eleven files with it instead of
            # the whole lane.
            - run: node scripts/run-node-shard.js --project=node-device-errors
            # The multi-gigabyte limit files (test/limits, oom-scope asks for exactly maxBufferSize), one at a
            # time and after the main suite, so an out-of-memory test never shares the GPU with ordinary tests
            # and a crash in one never takes the main suite's results with it (issue #274).
            - run: node scripts/run-node-shard.js --project=node-limits
            # The twin pass, in two invocations because the device-error files are their own project now.
            # `--project=node` is 114 of the 125 node files; the second line is the remaining eleven, which without
            # it would run under the subgroups feature only -- and they are the device-loss and lifecycle paths,
            # where a missing-subgroup code path is most likely to behave differently.
            - run: GRAPHTY_GPU_NO_SUBGROUPS=1 node scripts/run-node-shard.js --project=node
            - run: GRAPHTY_GPU_NO_SUBGROUPS=1 node scripts/run-node-shard.js --project=node-device-errors
            # The key carries the container image, not just runner.os. Playwright downloads a browser build
            # matched to the distribution it detects, and every other lane keys on `Linux` alone -- so without
            # this the 22.04 build another job saved would be restored into a 24.04 container and run against the
            # wrong shared libraries. HOME is the container's, so the path is consistent within the job.
            - name: Cache Playwright browsers
              id: pw
              uses: actions/cache@v4
              with:
                  {
                      path: ~/.cache/ms-playwright,
                      key: "playwright-${{ runner.os }}-ubuntu2404-${{ hashFiles('pnpm-lock.yaml') }}",
                  }
            - if: steps.pw.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium --with-deps # a fresh VM each job
            # The cache holds the browser, not its system libraries, and the container starts bare every job: on a
            # hit the step above is skipped and chrome-headless-shell cannot load libglib-2.0.so.0 (run 37211866080).
            - if: steps.pw.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium
            - name: Browser smoke on NVIDIA
              run: node scripts/run-browser-project.js # G0 decides whether this needs `xvfb-run -a` on the T4 image (design 12.2)
            - name: graphty-element's accelerated layout on NVIDIA (the element is the only consumer that drives the layout kernels end to end)
              working-directory: graphty-element
              timeout-minutes: 20 # Chromium on the NVIDIA path can hang AFTER every test passed (webgpu-graph-algorithms R-13); bound it here rather than let it eat the job's 45
              run: pnpm exec nx run-many -t build --projects=@graphty/remote-logger,algorithms,graph-io,layout,graph-samples && pnpm exec vitest run --project=browser test/browser/webgpu-layout.test.ts # the job env already carries GRAPHTY_BROWSER_GPU=nvidia; nx resolves the workspace root from here. Every workspace package the element imports resolves to its dist (no src fallback), so each must be built: graph-format and webgpu-graph-algorithms by the step above, the rest here. Keep this list in step with graphty-element/package.json -- graph-io missing from it broke this step when the element began reading csv and json through graph-io
            # Issue #703: the 10k layout-fr rows swung x1.0 to x3.6 between T4 runs on unchanged code, in the
            # profiler's GPU time as well as the wall time, so the card itself ran the kernels slower. NVIDIA's power
            # governor holds the SM clock low under the sparse one-step dispatches of a small rung (finding G3-F1),
            # how low differs from one machine.dev instance to the next, and the untimed warm-up burst of the layout
            # groups is the same sparse pattern, so it cannot lift it. The SM clock is therefore locked for the
            # benchmarks at the card's maximum -- the clock the baseline's good runs ran at, so the baseline and the
            # gating targets of benchmarks/results/targets.json stay comparable -- with persistence mode on so the lock
            # survives the moments no process holds the device. nvidia-smi logs the clock, P-state and power draw
            # every 200 ms while the benchmarks run; the step after them reduces the log to each group's min and
            # median (gpu-clocks.json), which bench-compare.js quotes beside a regression. A refused lock FAILS the
            # lane: benchmarks at the governor's clock are the x3.6 noise this lock exists to remove, so they must
            # not run and be compared. The lock needs the container's --privileged (above).
            - name: Lock the SM clock at the card's maximum and start the clock log
              id: clocks
              run: |
                  max=$(nvidia-smi --query-gpu=clocks.max.sm --format=csv,noheader,nounits | head -1 | tr -d ' ')
                  sudo nvidia-smi -pm 1 || true
                  sudo nvidia-smi -lgc "$max,$max" \
                    || { echo "::error::nvidia-smi -lgc $max,$max was refused: is the job container still --privileged? (issue #703)"; exit 1; }
                  echo "SM clock locked at $max MHz"
                  nohup nvidia-smi --query-gpu=timestamp,clocks.sm,clocks.max.sm,pstate,power.draw --format=csv -lms 200 > gpu-clocks.csv 2>&1 &
                  echo $! > gpu-clocks.pid
            - name: Benchmarks (tsx benchmarks/run.ts -> benchmarks/out/gpu-linux-t4.json; every line stamped with the local time nvidia-smi's log carries)
              run: pnpm run bench 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date '+%Y/%m/%d %H:%M:%S.%3N')" "$line"; done | tee bench.log # pipefail carries the bench's exit code through the loop and tee
            - name: Stop the clock log and summarize the SM clock of every benchmark group
              if: ${{ !cancelled() && steps.clocks.outcome == 'success' }}
              run: |
                  kill "$(cat gpu-clocks.pid)" || true
                  [ -f bench.log ] || { echo "no bench.log: the benchmarks did not run"; exit 0; }
                  node scripts/gpu-report.js --clocks gpu-clocks.csv bench.log > gpu-clocks.json && cat gpu-clocks.json
            - run: node scripts/bench-compare.js # > 3x the checked-in baseline for THIS runner class (benchmarks/results/gpu-linux-t4.json) fails; no baseline -> every row "new", exit 0
            # The paired check (issue #276): the base commit and this pull request alternated on the same card, so
            # clock and thermal drift cancel and the threshold can be tight (scripts/bench-ab.js). Pull requests
            # only, and only the benchmark groups the change can move: scripts/bench-groups.js maps every group to
            # the src files its benchmark reaches through imports and selects the groups that reach a changed file.
            # A change to a file every group depends on (device setup, the WGSL prelude, shared constants), or to a
            # file no benchmark reaches, selects all of them; a change outside src selects none and skips the step.
            # The checkout is the merge commit at depth 1; deepening it to 2 brings in its first parent, the base
            # branch tip the merge was made on.
            - name: Choose the paired benchmark's groups from the files the pull request changed
              id: select
              if: github.event_name == 'pull_request'
              run: |
                  git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
                  base=$(git rev-parse HEAD^1)
                  groups=$(git diff --name-only "$base" HEAD | node scripts/bench-groups.js --base "$base")
                  if [ -z "$groups" ]; then
                      echo "no change under webgpu-graph-algorithms/src since $base: paired benchmark skipped"
                  fi
                  # a subset fits the step's original 40 minutes; every group needs about 65 (see the job's timeout)
                  if [ "$groups" = all ]; then timeout=75; else timeout=40; fi
                  { echo "base=$base"; echo "groups=$groups"; echo "timeout=$timeout"; } >> "$GITHUB_OUTPUT"
            - name: Paired benchmark against the base commit (the groups chosen above)
              if: github.event_name == 'pull_request' && steps.select.outputs.groups != ''
              timeout-minutes: ${{ steps.select.outputs.timeout && fromJSON(steps.select.outputs.timeout) || 40 }}
              env: { BASE: "${{ steps.select.outputs.base }}", BENCH_GROUPS: "${{ steps.select.outputs.groups }}" }
              run: |
                  echo "groups: $BENCH_GROUPS (base $BASE)"
                  if [ "$BENCH_GROUPS" = all ]; then
                      pnpm run bench:ab --base "$BASE" # no group names: each build runs its own, so a group new in this change still runs
                  else
                      pnpm run bench:ab --base "$BASE" $BENCH_GROUPS # word splitting intended: one argument per group
                  fi
            - name: Release the SM clock lock
              if: ${{ always() && steps.clocks.outcome != 'skipped' }}
              run: sudo nvidia-smi -rgc || true
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  {
                      name: "gpu-results-${{ github.run_id }}",
                      path: "webgpu-graph-algorithms/gpu-report.json\nwebgpu-graph-algorithms/gpu-clocks.csv\nwebgpu-graph-algorithms/gpu-clocks.json\nwebgpu-graph-algorithms/bench.log\nwebgpu-graph-algorithms/benchmarks/out/",
                      retention-days: 90,
                      overwrite: true,
                  }
    # The one check .mergify.yml waits for. It always reports on a ready pull request (a skipped check would read as
    # "no answer" and stall the queue), and fails on a draft so a stale pass can never stand for a draft's head.
    gate:
        name: T4 GPU gate
        needs: [decide, test-gpu]
        if: always()
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - env:
                  DRAFT: ${{ github.event.pull_request.draft == true }}
                  DECIDE: ${{ needs.decide.result }}
                  RUN: ${{ needs.decide.outputs.run }}
                  T4: ${{ needs.test-gpu.result }}
              run: |
                  if [[ "$DRAFT" == "true" ]]; then echo "::error::draft: the GPU lane does not run on a draft"; exit 1; fi
                  if [[ "$DECIDE" != "success" ]]; then echo "::error::could not decide whether the T4 must run ($DECIDE)"; exit 1; fi
