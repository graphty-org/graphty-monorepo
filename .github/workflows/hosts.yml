# .github/workflows/hosts.yml -- the webgpu-graph-algorithms host matrix: the other shader compilers (Dawn on Metal
# and on D3D12, WebKit). Never a job of CI, but REQUIRED for a release when it ran: release.yml's gate job waits
# for this workflow's run on the released commit and refuses to publish unless it succeeded (owner decision,
# 2026-09-18; design/webgpu/webgpu-acceleration-plan.md Review log, 2026-09-16, had it informational): the default lane covers Tint on Vulkan only, and a real WebKit / Metal defect (unread pipeline
# constants) was first seen on an iPad. macos-latest is an Apple Silicon VM with a Metal device (Dawn-node and
# Chromium on Metal; Playwright's WebKit 26.6 exposes WebGPU on it too, 26.0 does not); windows-latest has no GPU
# but Dawn's D3D12 backend enumerates WARP, Microsoft's software rasterizer, for Dawn-node and for the full Chromium
# build.
name: Hosts
on:
    push:
        branches: [master]
        paths: ["webgpu-graph-algorithms/**", "graph-format/**", "layout/**", ".github/workflows/hosts.yml", "pnpm-lock.yaml"]
    pull_request:
        paths: ["webgpu-graph-algorithms/**", "graph-format/**", "layout/**", ".github/workflows/hosts.yml", "pnpm-lock.yaml"]
    workflow_dispatch:
        inputs:
            scope:
                description: "What the Windows leg runs"
                required: false
                default: everything
                type: choice
                options:
                    - everything
                    - windows-scan-questions
permissions: { contents: read }
concurrency:
    group: hosts-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Test (${{ matrix.backend }} on ${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      backend: metal
                      node_adapter: "" # Dawn picks the runner's Metal device
                      browser_gpu: metal
                      webkit: "true"
                    - os: windows-latest
                      backend: d3d12
                      node_adapter: "Microsoft Basic Render Driver" # WARP, the software D3D12 adapter
                      browser_gpu: warp # the full Chromium build on Dawn's D3D12 backend over WARP (the headless shell grants nothing here)
                      webkit: "false"
        runs-on: ${{ matrix.os }}
        # 90, not 45: this phase's suites took the windows-latest leg past the old cap with its node project
        # still running (run 35664438016, killed at 45 minutes with test/sabotage/grid-pyramid.test.ts in flight,
        # which alone runs for a quarter of an hour there). WARP is a CPU rasterizer, so every kernel this phase
        # added compiles and runs on the processor; macos-latest finishes the same work in 28 minutes. The runners
        # are GitHub-hosted and this repository is public, so the extra wall clock costs nothing.
        timeout-minutes: 90
        env:
            GRAPHTY_GPU_REQUIRE: any # an adapter must exist; a missing one fails the run up front (test/setup/global.ts)
            GRAPHTY_GPU_ADAPTER: ${{ matrix.node_adapter }}
            GRAPHTY_BROWSER_GPU: ${{ matrix.browser_gpu }}
            # The narrow scope: dispatch only, Windows only. Selecting `windows-scan-questions` when starting the
            # workflow by hand replaces the Windows leg's suites and browser smokes with the seven questions below,
            # which take about a quarter of an hour instead of ninety minutes. `inputs` is empty on a push and on a
            # pull request, so this is `false` there and both legs run exactly what they ran before.
            NARROW: ${{ matrix.os == 'windows-latest' && inputs.scope == 'windows-scan-questions' }}
        defaults: { run: { working-directory: webgpu-graph-algorithms, shell: bash } }
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22.x, cache: pnpm }
            - run: pnpm install --frozen-lockfile
              working-directory: .
              env: { HUSKY: "0" }
            - run: pnpm exec nx run-many -t build --projects=graph-format,webgpu-graph-algorithms
              working-directory: .
            - name: Adapter report (informational on this lane; the JSON is uploaded)
              run: node scripts/gpu-report.js > gpu-report.json || echo "gpu-report.js exited $?"; cat gpu-report.json
            # ---------------------------------------------------------------------------------------------------
            # The narrow scope (NARROW above): seven questions about this one machine, asked in one run. Every multi-
            # block prefix sum is wrong on Dawn's D3D12 backend over the Microsoft Basic Render Driver, and with it the
            # sort, the grid build and every layout above them; three shader repairs have failed, the last one failing
            # byte for byte like the original. Each question is its own step, each may fail without stopping the next
            # (`continue-on-error`), and each prints its answer under the marker [warp-q], so one grep over the job log
            # tells the whole story. scripts/warp-question.sh runs the same four files every time -- the scan tests and
            # the two device probes -- under whichever Dawn toggles the question is about; it passes them through
            # GRAPHTY_DAWN_FEATURES, which test/setup/gpu.ts hands to dawn.create() when it builds the Dawn INSTANCE,
            # before any adapter is requested, which is early enough for use_dxc (the compiler choice is what Dawn
            # gates the `subgroups` and `shader-f16` features on, and the adapter advertises neither today).
            - name: "Scan questions (a): the adapter, before anything is changed"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: |
                  mkdir -p tmp/narrow
                  cp gpu-report.json tmp/narrow/report-before.json || true
                  echo "[warp-q] a $(grep -m1 '"vendor"' tmp/narrow/report-before.json || true)"
                  echo "[warp-q] a $(grep -m1 '"architecture"' tmp/narrow/report-before.json || true)"
                  echo "[warp-q] a $(grep -m1 '"device"' tmp/narrow/report-before.json || true)"
                  echo "[warp-q] a $(grep -m1 '"description"' tmp/narrow/report-before.json || true)"
                  echo "[warp-q] a $(grep -m1 '"webgpu"' tmp/narrow/report-before.json || true)"
                  echo "[warp-q] a the description above is the renderer's version string, and question (f) compares it"
            - name: "Scan questions (b): the baseline, no toggles"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: bash scripts/warp-question.sh b-baseline
            - name: "Scan questions (c): ask for the newer shader compiler (use_dxc)"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: |
                  bash scripts/warp-question.sh c-use-dxc use_dxc || true
                  log=tmp/narrow/c-use-dxc.log
                  if grep -qiE '^[[:space:]]*[WwEe](arning|rror):.*dxc' "$log"; then
                      echo "[warp-q] c Dawn spoke about the toggle it was handed:"
                      grep -iE '^[[:space:]]*[WwEe](arning|rror):.*dxc' "$log" | sed 's/^/[warp-q] c /' || true
                  else
                      echo "[warp-q] c Dawn printed no warning naming dxc -- it either took the toggle or dropped it in silence"
                  fi
                  # The independent test, which needs no log line at all: Dawn's D3D12 backend offers `shader-f16` and
                  # `subgroups` only through DXC, and this adapter offers neither today. If they appear here, DXC took.
                  if grep -m1 '\[gpu\] adapter vendor=' "$log" | grep -q 'shader-f16'; then
                      echo "[warp-q] c the adapter now lists shader-f16, which this backend has only under DXC: the toggle TOOK"
                  else
                      echo "[warp-q] c no shader-f16 in the adapter's feature list, the same list FXC produces: the toggle did NOT take"
                  fi
            - name: "Scan questions (d): the generated code for the failing kernel"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: bash scripts/warp-question.sh d-dump-shaders dump_shaders,disable_symbol_renaming scan_block
            # Dawn already compiles through FXC at optimisation level zero (its FxcOptimizations toggle is off by
            # default, "because FXC miscompiles in many cases when optimizations are enabled"), so the question has two
            # halves and both are cheap: emit_hlsl_debug_symbols adds D3DCOMPILE_DEBUG | D3DCOMPILE_SKIP_OPTIMIZATION on
            # top, and fxc_optimizations turns the optimiser on instead. If either shape changes the answer, the
            # compiler is in it.
            - name: "Scan questions (e1): skip shader optimisation (emit_hlsl_debug_symbols)"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: bash scripts/warp-question.sh e1-skip-optimisation emit_hlsl_debug_symbols
            - name: "Scan questions (e2): the other half -- turn the FXC optimiser on (fxc_optimizations)"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: bash scripts/warp-question.sh e2-fxc-optimisations fxc_optimizations
            - name: "Scan questions (e3): drop the injected zero-initialisation of workgroup memory"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: bash scripts/warp-question.sh e3-no-workgroup-init disable_workgroup_init
            - name: "Scan questions (f): Microsoft's redistributable WARP, if the process will load it"
              if: ${{ !cancelled() && env.NARROW == 'true' }}
              continue-on-error: true
              run: |
                  mkdir -p tmp/narrow
                  curl -sSL -o tmp/narrow/warp.zip https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP
                  powershell -Command "Expand-Archive -Path tmp/narrow/warp.zip -DestinationPath tmp/narrow/warp -Force"
                  echo "[warp-q] f package $(grep -m1 -o '<version>[^<]*' tmp/narrow/warp/*.nuspec || true)"
                  inbox=$(powershell -Command '(Get-Item C:\Windows\System32\d3d10warp.dll).VersionInfo.FileVersion' | tr -d '\r' || true)
                  echo "[warp-q] f the renderer in the box is d3d10warp.dll $inbox"
                  dll=$(find tmp/narrow/warp -iname d3d10warp.dll -ipath '*x64*' | head -1)
                  echo "[warp-q] f redistributable library $dll"
                  # Two directories, because either could be the one the loader reaches first: the directory of the
                  # runner's node.exe (the application directory), and the directory of the dawn-node addon, which is
                  # searched first for the addon's own dependencies and is where its d3dcompiler_47.dll already sits.
                  nodedir=$(dirname "$(command -v node)")
                  # node prints the addon's directory itself, with forward slashes: `require.resolve` hands back a
                  # C:\... path, and dirname would make "." of it in the runner's Git bash.
                  dawndir=$(node -e "const p=require('path');console.log(p.join(p.dirname(require.resolve('webgpu/package.json')),'dist').split(p.sep).join('/'))")
                  cp "$dll" "$nodedir/" || true
                  cp "$dll" "$dawndir/" || true
                  echo "[warp-q] f copied to $nodedir and $dawndir"
                  node scripts/gpu-report.js > tmp/narrow/report-after.json || echo "[warp-q] f gpu-report.js exited $?"
                  before=$(grep -m1 '"description"' tmp/narrow/report-before.json || true)
                  after=$(grep -m1 '"description"' tmp/narrow/report-after.json || true)
                  echo "[warp-q] f description before: $before"
                  echo "[warp-q] f description after:  $after"
                  if [ -z "$before" ] || [ -z "$after" ]; then
                      echo "[warp-q] f VERDICT: one of the two adapter reports has no description line, so there is"
                      echo "[warp-q] f VERDICT: nothing to compare and the run below settles nothing either way."
                  elif [ "$before" = "$after" ]; then
                      echo "[warp-q] f VERDICT: THE DESCRIPTION DID NOT CHANGE. The copied library was ignored, the same"
                      echo "[warp-q] f VERDICT: renderer answered, and the run below says NOTHING about a newer one."
                      echo "[warp-q] f VERDICT: Redistributable WARP is loaded only by a process that opts into the D3D12"
                      echo "[warp-q] f VERDICT: Agility SDK (an exported D3D12SDKVersion and a D3D12SDKPath), which"
                      echo "[warp-q] f VERDICT: node.exe does not, so this is the expected outcome and not a measurement."
                  else
                      echo "[warp-q] f VERDICT: the description CHANGED, so a different renderer answered and the run below"
                      echo "[warp-q] f VERDICT: is a real before-and-after on this machine."
                  fi
                  bash scripts/warp-question.sh f-redist-warp
            # ---------------------------------------------------------------------------------------------------
            # Every step from here on runs whatever the earlier ones did (`!cancelled()`), so one push reports every
            # lane's node suite, twins pass, flag probe and browser smokes at once instead of one finding per round.
            # Through scripts/run-node-shard.js: a worker that vanishes here leaves only "Channel closed", and the
            # wrapper names the test file that started and never reported. It exits with vitest's own code.
            - name: Node suite (Dawn on ${{ matrix.backend }})
              if: ${{ env.NARROW != 'true' }}
              run: node scripts/run-node-shard.js --project=node
            # The files that break a device on purpose, in an invocation of their own (one file at a time) so a
            # worker they kill takes eleven files with it instead of the whole lane.
            - name: Node suite, the device-error files (one file at a time)
              if: ${{ !cancelled() && env.NARROW != 'true' }}
              run: node scripts/run-node-shard.js --project=node-device-errors
            - name: Node suite, no-subgroups twins
              if: ${{ !cancelled() && env.NARROW != 'true' }}
              run: GRAPHTY_GPU_NO_SUBGROUPS=1 node scripts/run-node-shard.js --project=node test/primitives test/layouts --passWithNoTests
            # The same twin pass over the four device-error files under test/layouts (fa2-lifecycle, fr-lifecycle,
            # grid-lifecycle, force-simulation), which `--project=node` no longer reaches: 44 + 4 = the 48 layout
            # files this pass covered before the split. No --passWithNoTests -- an empty match means those files
            # moved and the twin pass shrank, and that should be red rather than green.
            - name: Node suite, no-subgroups twins (the device-error layout files)
              if: ${{ !cancelled() && env.NARROW != 'true' }}
              run: GRAPHTY_GPU_NO_SUBGROUPS=1 node scripts/run-node-shard.js --project=node-device-errors test/layouts
            - name: Crash reports (macOS -- a vitest worker that vanished with "Channel closed" left its native stack here)
              if: ${{ !cancelled() && env.NARROW != 'true' && runner.os == 'macOS' }}
              run: node scripts/print-crash-reports.mjs
            - name: Crash reports (Windows -- the Application log's faulting module and exception code of a vanished worker)
              if: ${{ !cancelled() && env.NARROW != 'true' && runner.os == 'Windows' }}
              shell: pwsh
              run: |
                  $since = (Get-Date).AddMinutes(-40)
                  $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction SilentlyContinue |
                      Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting', '.NET Runtime') }
                  if (-not $events) { Write-Output "no Application Error / Windows Error Reporting event since $since"; exit 0 }
                  foreach ($e in $events) {
                      Write-Output "==> $($e.TimeCreated) $($e.ProviderName) id $($e.Id)"
                      Write-Output $e.Message
                  }
            - name: Cache Playwright browsers
              if: ${{ !cancelled() && env.NARROW != 'true' }}
              id: pw
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/ms-playwright
                      ~/AppData/Local/ms-playwright
                  key: "playwright-hosts-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
            - if: ${{ !cancelled() && env.NARROW != 'true' && steps.pw.outputs.cache-hit != 'true' }}
              run: pnpm exec playwright install chromium
            - name: Probe Chromium flag sets (informational -- which flags grant which adapter on this host)
              if: ${{ !cancelled() && env.NARROW != 'true' }}
              continue-on-error: true
              run: node scripts/probe-browser-flags.mjs
            - name: Browser smoke (Chromium on ${{ matrix.backend }})
              if: ${{ !cancelled() && env.NARROW != 'true' }}
              run: node scripts/run-browser-project.js
            # WebKit exposes WebGPU on the runner's Metal device from WebKit 26.6 (Playwright 1.63, build 2359) and then
            # passes the whole browser project; the WebKit that Playwright 1.57 ships (26.0, build 2227) has no
            # navigator.gpu at all, and under GRAPHTY_GPU_REQUIRE=any every GPU test fails with E_NO_ADAPTER (32 of 38 in
            # run 35288880510) instead of testing anything. The probe decides: with WebGPU present the smoke gates the lane like the Chromium smoke;
            # without it the smoke is skipped and the probe's line says why (a Playwright bump restores the leg).
            - name: Probe WebKit for WebGPU
              id: webkit-probe
              if: ${{ !cancelled() && env.NARROW != 'true' && matrix.webkit == 'true' }}
              run: pnpm exec playwright install webkit && node scripts/probe-webkit-webgpu.mjs
            - name: Browser smoke (WebKit, the Safari proxy)
              if: ${{ !cancelled() && env.NARROW != 'true' && matrix.webkit == 'true' && steps.webkit-probe.outputs.webgpu == 'true' }}
              env: { GRAPHTY_BROWSER: webkit }
              run: node scripts/run-browser-project.js
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: "hosts-${{ matrix.backend }}-${{ github.run_id }}"
                  path: |
                      webgpu-graph-algorithms/gpu-report.json
                      webgpu-graph-algorithms/browser-results.json
                      webgpu-graph-algorithms/tmp/narrow/*.log
                      webgpu-graph-algorithms/tmp/narrow/report-*.json
                  if-no-files-found: ignore
                  retention-days: 14
                  overwrite: true
