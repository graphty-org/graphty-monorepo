name: Links (weekly)

# Every link in the repository's Markdown, MDX, HTML and package.json, external ones included,
# once a week. Dead ones go into one open issue labelled "dead-links", which each run rewrites and
# a clean run closes. This never fails a pull request: an external site going down is not
# something a contributor did. Our own links (relative, anchors, github.com/graphty-org,
# graphty.app) are gated on every pull request by the "Links" job in ci.yml instead. It also
# checks that the AI provider pages the graphty app links to (key and billing pages) still land
# where they did (tools/check-provider-links.mjs).
# See tools/check-links.sh.

on:
    schedule:
        - cron: "17 6 * * 1" # Mondays 06:17 UTC
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: links-weekly
    cancel-in-progress: true

env:
    # A failed Actions cache restore waits one minute here, not 10 (#5098; see ci.yml).
    SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
    external-links:
        name: External links
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Install lychee
              uses: ./.github/actions/lychee

            # tools/check-provider-links.mjs imports a TypeScript table, which Node 22 reads as is.
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Check every link
              id: check
              continue-on-error: true
              run: ./tools/check-links.sh --external "$RUNNER_TEMP/dead-links.md"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: File, update or close the dead-links issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  OUTCOME: ${{ steps.check.outcome }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  number="$(gh issue list --state open --label dead-links --json number --jq '.[0].number // empty')"
                  if [ "$OUTCOME" = "success" ]; then
                    if [ -n "$number" ]; then
                      gh issue close "$number" --comment "The weekly link check found no dead links ($RUN_URL)."
                    fi
                    exit 0
                  fi
                  {
                    echo "The weekly link check ($RUN_URL) found dead links. Each is a link to fix or to"
                    echo "remove; a pattern that can never be checked belongs in .lycheeignore with its reason."
                    echo "This issue is rewritten by every run and closed by the first clean one."
                    echo
                    head -c 60000 "$RUNNER_TEMP/dead-links.md" 2>/dev/null || echo "(no report: see the run log)"
                  } > "$RUNNER_TEMP/issue.md"
                  if [ -n "$number" ]; then
                    gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
                  else
                    gh label create dead-links --color B60205 --description "Found by the weekly link check" 2>/dev/null || true
                    gh issue create --title "Dead links found by the weekly link check" --label dead-links --body-file "$RUNNER_TEMP/issue.md"
                  fi

    # Every built-in network source's examples (graph-io descriptor `examples`: NDEx, the Neo4j demo
    # server, Hetionet, SPARQL endpoints, STRING, deps.dev, OpenAlex), loaded live from their public
    # servers by graph-io/scripts/live-examples.ts. A failure goes into one open issue labelled
    # "dead-network-examples", rewritten by each run and closed by a clean one; never a red build.
    network-examples:
        name: Network source examples
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Restore the pnpm store
              uses: ./.github/actions/restore-pnpm-store

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Build graph-format
              run: pnpm exec nx run graph-format:build

            - name: Load every example
              id: check
              continue-on-error: true
              working-directory: graph-io
              run: pnpm exec tsx scripts/live-examples.ts --report "$RUNNER_TEMP/examples.md"
              env:
                  GRAPH_IO_LIVE: "1"

            - name: File, update or close the dead-network-examples issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  OUTCOME: ${{ steps.check.outcome }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  number="$(gh issue list --state open --label dead-network-examples --json number --jq '.[0].number // empty')"
                  if [ "$OUTCOME" = "success" ]; then
                    if [ -n "$number" ]; then
                      gh issue close "$number" --comment "Every network source example loaded ($RUN_URL)."
                    fi
                    exit 0
                  fi
                  {
                    echo "The weekly check of graph-io's network source examples ($RUN_URL) found examples that"
                    echo "no longer load. Fix or replace each FAIL row in its source's descriptor"
                    echo "(graph-io/src/sources/<source>/descriptor.ts). This issue is rewritten by every run"
                    echo "and closed by the first clean one."
                    echo
                    head -c 60000 "$RUNNER_TEMP/examples.md" 2>/dev/null || echo "(no report: see the run log)"
                  } > "$RUNNER_TEMP/issue.md"
                  if [ -n "$number" ]; then
                    gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
                  else
                    gh label create dead-network-examples --color B60205 --description "Found by the weekly network examples check" 2>/dev/null || true
                    gh issue create --title "Network source examples that no longer load" --label dead-network-examples --body-file "$RUNNER_TEMP/issue.md"
                  fi
