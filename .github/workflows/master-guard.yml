#
# MASTER_GUARD_TOKEN is optional: a token that may open pull requests (contents and pull requests write). A pull
# request opened with the workflow's own token starts no workflows, so without it the revert pull request (or, when
# Actions may not open pull requests at all, the pushed revert branch) waits for a person or an agent; the issue
# says what to do.
name: Master guard

on:
    workflow_run:
        workflows: ["CI", "Deploy to GitHub Pages"]
        types: [completed]
        branches: [master]

# No concurrency group, not even one with cancel-in-progress: false. GitHub keeps one pending run per group and
# cancels it when the next arrives, so a red commit's revert would be lost. Two runs at once are safe: each revert
# names its own commit, and two runs that both open an issue for one cause close the newer as a duplicate
# (tools/master-guard.mjs fileIssue).
permissions:
    contents: write # push the revert branch
    pull-requests: write
    issues: write
    actions: write # read failed jobs' logs, re-run an external failure

jobs:
    guard:
        name: Revert and report
        # Only master's own runs: a fork's pull request from a branch named master also reports head_branch master.
        # The deploy runs on CI's workflow_run event; decide() in tools/master-guard.mjs filters each workflow's events.
        if: >-
            github.event.workflow_run.head_repository.full_name == github.repository &&
            (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_run')
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with: { ref: master, fetch-depth: 0 }
            - uses: actions/setup-node@v4
              with: { node-version: 22.x }
            - run: node tools/master-guard.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_TOKEN: ${{ secrets.MASTER_GUARD_TOKEN }}
