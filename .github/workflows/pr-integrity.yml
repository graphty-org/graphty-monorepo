name: PR Integrity

# The rules agents cannot be trusted to keep by themselves (design/ci/channels-pipeline.md section 6.4,
# tools/pr-integrity.mjs): no test weakened, no unapproved breaking change, baselines
# signed by the owner, and for the agent account's pull requests a Proof and a fresh review of the
# branch's own diff. A code owner's approval of the head clears test integrity and the breaking-change
# rule, and an agent review of the head (tools/pr-review.sh) clears each test-integrity finding it
# answers, so review events re-run it: a review needs no push. Never on comment events, whose runs attach
# to master's head and cannot satisfy a pull request's required check. No concurrency group, for
# pr-title.yml's reason.
on:
    pull_request:
        types: [opened, synchronize, edited, reopened]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    integrity:
        name: PR Integrity
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            # Master's own copy of the check, never the pull request's: a fix to the check reaches every open pull
            # request at its next run (a re-run included), and a pull request cannot change the check that judges it
            # (#4421). The head is fetched below as data only: the script reads it through git (merge base, diff,
            # log, `git show`) and never runs a file from it, so plain `pull_request` with a read-only token is
            # enough and nothing from the head executes. Full history, for the merge base, the commits and the
            # revert check; the checkout's fetch also gives origin/master.
            - uses: actions/checkout@v7
              with:
                  ref: master
                  fetch-depth: 0
                  lfs: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            # Every rule is measured from the head itself, not the merge ref, against its merge base with master.
            - name: Fetch the pull request's head
              env:
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: git fetch --no-tags origin "$HEAD_SHA"

            # The title, description and author come from the event file, never from the script text or an
            # environment variable (pr-issue-link.yml's reasons). The baselines signature is checked with
            # master's own visual-review/trusted (git archive inside the script).
            - name: Check the pull request
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node tools/pr-integrity.mjs --base origin/master
