name: PR Issue Link

# Fails a pull request whose description names no issue (issue #1611): a fix that does not say
# "Fixes #N" leaves its issue open, and nothing connects the two. tools/pr-issue-link.mjs reads the
# description; it accepts the forms githerd counts as a reference, or a line "No issue".
#
# Its own workflow, like pr-title.yml, so that editing the description re-runs it with no push:
# `edited` fires for body edits, and a re-run of a job would reuse the event's old body. No
# concurrency group, for pr-title.yml's reason: a cancelled required check dequeues a batch.
on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read

jobs:
    link-issue:
        name: Link PR Issue
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            # The description never goes into the script text (it is attacker-controlled on a fork's
            # pull request) nor into an environment variable (one over 128 KiB stops the runner from
            # starting the step): the script reads it from the event file, GITHUB_EVENT_PATH.
            - name: Check the description names an issue
              env:
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
              run: node tools/pr-issue-link.mjs
