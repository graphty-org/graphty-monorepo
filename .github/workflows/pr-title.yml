name: PR Title

# Its own workflow, not a job of CI, so that editing a pull request's title re-checks it: a
# re-run of a job reuses the event it started from, so a CI re-run after a rename still read the
# old title and failed. `edited` also fires for body edits; the check takes seconds.
#
# No concurrency group, on purpose. Mergify edits a merge-queue draft's body about once a minute,
# and each edit starts a run. In a group, every new run cancelled the one before it -- and even
# with cancel-in-progress off, a group keeps one pending run and cancels the others ("a higher
# priority waiting request exists"). A cancelled "Lint PR Title" is a required check that was
# interrupted, and Mergify dequeued the whole batch for it. Overlapping runs are harmless: each
# lints the title in its own event and finishes in seconds.
on:
    pull_request:
        # labeled and unlabeled: the owner's breaking-go label re-checks a breaking change at once.
        types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: read
    issues: read

jobs:
    lint-pr:
        name: Lint PR Title
        # A Mergify merge-queue draft (branch mergify/merge-queue/*) carries Mergify's own title, not a commit
        # message; the pull requests it holds were each checked here on their own. The whole job is skipped, not
        # one step: under merge_method merge-batch (.mergify.yml) GitHub merges the draft itself, so this required
        # check must be complete on the draft's head when Mergify merges, and Mergify edits the draft's body about
        # once a minute. A skipped job completes at once and counts as passing; a job that installs first stays in
        # progress for a minute after every edit. Only Mergify's own draft: the branch prefix alone is open to
        # anyone, a fork included, so the repository and author must match.
        if: ${{ !(startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'mergify[bot]') }}
        runs-on: ubuntu-24.04
        steps:
            # A breaking change bumps a published major, and nothing lowers it afterwards, so it reaches master
            # only with the owner's go: the label breaking-go, added by the owner. tools/pr-open.sh leaves
            # auto-merge off for one, but a breaking commit pushed after the pull request opened would merge
            # on its own without this check.
            - name: No breaking change without the owner's go
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  OWNER: apowers313
              run: |
                  msgs=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].commit.message')
                  # A here-string, not a pipe: grep -q exits at the first match, and under pipefail the writer's
                  # SIGPIPE would read as "no match".
                  if ! grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<<"$PR_TITLE"$'\n'"$msgs"; then
                      echo "no breaking change"; exit 0
                  fi
                  labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
                  by=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate \
                      --jq '.[] | select(.event == "labeled" and .label.name == "breaking-go") | .actor.login' | tail -1)
                  if grep -qx breaking-go <<<"$labels" && [ "$by" = "$OWNER" ]; then
                      echo "breaking change, with the owner's go"; exit 0
                  fi
                  echo "::error::this pull request holds a breaking change (type!: or BREAKING CHANGE); it merges only once $OWNER adds the label breaking-go"
                  exit 1

            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # The title goes through an environment variable, never into the script text: a title is
            # attacker-controlled on a fork's pull request, and `${{ }}` inside `run:` is pasted into the
            # shell before it runs.
            - name: Lint PR title
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
