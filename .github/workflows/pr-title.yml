name: PR Title

# Its own workflow, not a job of CI, so that editing a pull request's title re-checks it: a
# re-run of a job reuses the event it started from, so a CI re-run after a rename still read the
# old title and failed. `edited` also fires for body edits; the check takes seconds.
#
# No concurrency group, on purpose: even with cancel-in-progress off, a group keeps one pending run and
# cancels the others ("a higher priority waiting request exists"), and a cancelled "Lint PR Title" is a
# required check left red. Overlapping runs are harmless: each lints the title in its own event and
# finishes in seconds.
on:
    pull_request:
        # labeled and unlabeled: the owner's breaking-go label re-checks a breaking change at once.
        types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: read
    issues: read

env:
    # A failed Actions cache restore waits one minute here, not 10 (#5098; see ci.yml).
    SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
    lint-pr:
        name: Lint PR Title
        runs-on: ubuntu-24.04
        steps:
            # A breaking change bumps a published major, and nothing lowers it afterwards, so it reaches master
            # only with the owner's go: the label breaking-go, added by the owner. tools/pr-open.sh leaves
            # auto-merge off for one, but a breaking commit pushed after the pull request opened would merge
            # on its own without this check. A commit master's release-not-breaking.json lists is the owner's
            # ruling that it is not breaking, and is skipped (master's list, never the branch's: a pull request
            # cannot rule its own commit not breaking).
            - name: No breaking change without the owner's go
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  OWNER: apowers313
              run: |
                  # One GraphQL query, not three REST listings: the repository's GITHUB_TOKEN has about 1,000 REST
                  # requests an hour shared by every workflow, and running out failed this required check (#3824).
                  # --paginate walks the commits only; the labels and the label events repeat on every page.
                  q='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                    repository(owner: $owner, name: $name) {
                      notBreaking: object(expression: "master:release-not-breaking.json") { ... on Blob { text } }
                      pullRequest(number: $pr) {
                      labels(first: 100) { nodes { name } }
                      timelineItems(itemTypes: [LABELED_EVENT], last: 100) { nodes { ... on LabeledEvent { label { name } actor { login } } } }
                      commits(first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor } nodes { commit { oid message } } }
                    } } }'
                  # Fail closed: a breaking change never passes because the API could not be asked.
                  if ! pages=$(gh api graphql --paginate -f query="$q" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" 2>"$RUNNER_TEMP/gh.err"); then
                      cat "$RUNNER_TEMP/gh.err" >&2
                      if grep -qi 'rate limit' "$RUNNER_TEMP/gh.err"; then
                          echo "::error::GitHub API rate limit for this repository ran out; re-run this check"
                      else
                          echo "::error::could not read this pull request's commits and labels from the GitHub API; re-run this check"
                      fi
                      exit 1
                  fi
                  pr=$(jq -cs 'map(.data.repository.pullRequest)' <<<"$pages")
                  ruled=$(jq -cs '[.[0].data.repository.notBreaking.text // "{}" | fromjson | .notBreaking[]?.commit]' <<<"$pages")
                  msgs=$(jq -r --argjson ruled "$ruled" '.[].commits.nodes[].commit | select(.oid as $o | $ruled | index($o) | not) | .message' <<<"$pr")
                  # A here-string, not a pipe: grep -q exits at the first match, and under pipefail the writer's
                  # SIGPIPE would read as "no match".
                  if ! grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<<"$PR_TITLE"$'\n'"$msgs"; then
                      echo "no breaking change"; exit 0
                  fi
                  labels=$(jq -r '.[0].labels.nodes[].name' <<<"$pr")
                  by=$(jq -r '[.[0].timelineItems.nodes[] | select(.label.name == "breaking-go") | .actor.login] | last // ""' <<<"$pr")
                  if grep -qx breaking-go <<<"$labels" && [ "$by" = "$OWNER" ]; then
                      echo "breaking change, with the owner's go"; exit 0
                  fi
                  echo "::error::this pull request holds a breaking change (type!: or BREAKING CHANGE); it merges only once $OWNER adds the label breaking-go"
                  exit 1

            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # The title goes through an environment variable, never into the script text: a title is
            # attacker-controlled on a fork's pull request, and `${{ }}` inside `run:` is pasted into the
            # shell before it runs.
            - name: Lint PR title
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
