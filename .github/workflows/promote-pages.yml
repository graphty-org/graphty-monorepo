name: Promote a beta build to graphty.app

# graphty.app is the GitHub Pages site of graphty-org/graphty-site, which serves site/ of its main branch.
# This workflow copies one build that deploy-pages.yml already deployed to beta.graphty.app (this repository's
# own Pages site) into graphty-site as one commit, exactly as it was built, keeping the hosted datasets
# graphty.app already has (they are append-only, and a released package may name one an older build lacks).
# graphty-site's history is the history of promotions: rolling back is promoting an earlier build, or reverting
# a commit there. The builds of the last 90 days can be promoted.
#
# Run it by hand from master (Actions, "Promote a beta build to graphty.app", Run workflow). release.yml also
# calls it with data_only, to give graphty.app the hosted datasets of the commit it is about to publish without
# changing the build it serves. dry_run makes the commit and stops before pushing it.
#
# Writing to graphty-site takes the GitHub App whose id and private key are the secrets GRAPHTY_PAGES_APP_ID and
# GRAPHTY_PAGES_APP_KEY (see graphty-site's README, "Setup"). An app's tokens do not expire.
on:
    workflow_dispatch:
        inputs:
            build:
                description: 'newest, or the build''s commit (7 or more hex digits), as the runs of "Deploy to beta.graphty.app" name them'
                required: true
                default: newest
            dry_run:
                description: "Make the commit without pushing it"
                type: boolean
                default: false
    workflow_call:
        inputs:
            build:
                type: string
                required: true
            data_only:
                type: boolean
                default: false
        secrets:
            GRAPHTY_PAGES_APP_ID:
                required: true
            GRAPHTY_PAGES_APP_KEY:
                required: true

permissions:
    contents: read
    actions: read # the deployed builds are artifacts of deploy-pages.yml's runs

jobs:
    promote:
        name: ${{ inputs.data_only && 'Hosted data to graphty.app' || 'Promote to graphty.app' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: tools

            - name: Check the app secrets
              env:
                  APP_ID: ${{ secrets.GRAPHTY_PAGES_APP_ID }}
                  APP_KEY: ${{ secrets.GRAPHTY_PAGES_APP_KEY }}
              run: |
                  if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
                      echo "::error::the secrets GRAPHTY_PAGES_APP_ID and GRAPHTY_PAGES_APP_KEY are not both set, so nothing can be written to graphty-org/graphty-site (see the top of promote-pages.yml)"
                      exit 1
                  fi

            - id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.GRAPHTY_PAGES_APP_ID }}
                  private-key: ${{ secrets.GRAPHTY_PAGES_APP_KEY }}
                  owner: graphty-org
                  repositories: graphty-site

            - name: Commit to graphty-site
              env:
                  GH_TOKEN: ${{ github.token }}
                  SITE_TOKEN: ${{ steps.app-token.outputs.token }}
                  BUILD: ${{ inputs.build }}
                  MODE: ${{ inputs.data_only && 'data' || 'promote' }}
                  DRY: ${{ inputs.dry_run && '1' || '' }}
              run: tools/pages-builds.sh "$MODE" "$BUILD" ${DRY:+--dry-run} | tee -a "$GITHUB_STEP_SUMMARY"
