# Production promotion: puts a nightly on graphty.app and npm's `latest` (design/ci/channels-pipeline/channels.md,
# section 8). Also the rollback path: promote an earlier nightly, or with channel: nightly move `next` and
# nightly.graphty.app back. config_only redeploys what production serves with master's current
# graphty/sites/production.json, moving no tag.
#
# Every job that can change anything runs in environment `production`, whose required reviewer is the owner:
# nothing runs until he approves the pending deployment in GitHub. dry_run (the default) still waits for him,
# then checks everything and moves nothing. Every decision is in tools/channel/promote.mjs, with a test per
# refusal (tools/channel/promote.test.mjs); each step is idempotent, so a re-run finishes a partial promotion.
name: Promote

on:
    workflow_dispatch:
        inputs:
            nightly:
                description: "newest, or the nightly's candidate commit (7 or more hex digits)"
                required: true
                default: newest
            channel:
                description: production moves latest and graphty.app; nightly moves next and nightly.graphty.app back
                type: choice
                default: production
                options:
                    - production
                    - nightly
            dry_run:
                description: Check everything after the owner's approval, move nothing
                type: boolean
                default: true
            config_only:
                description: Redeploy what the channel serves with master's current site configuration; move no tag
                type: boolean
                default: false

# One promotion at a time; a second waits, never cancels the running one.
concurrency:
    group: promote
    cancel-in-progress: false

permissions:
    contents: read

env:
    CHANNEL: ${{ inputs.channel }}
    DRY_RUN: ${{ inputs.dry_run }}
    CONFIG_ONLY: ${{ inputs.config_only }}
    SITE_CONFIG: graphty/sites/${{ inputs.channel }}.json

jobs:
    promote:
        name: Promote (owner approval)
        if: ${{ github.ref == 'refs/heads/master' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90 # the smoke test of the candidate takes up to about 20 of these
        environment: production
        permissions:
            actions: read # the run's approvals: who approved is promotedBy
            contents: write # gh release edit
            issues: read # the publish hold
            id-token: write # the results store's record, and npm's trusted publishing for the dist-tags
        outputs:
            version_commit: ${{ steps.check.outputs.version_commit }}
            rollback: ${{ steps.check.outputs.rollback }}
            tag: ${{ steps.check.outputs.tag }}
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            # The runner context is not available in a job's env, so WORK is set here.
            - run: echo "WORK=$RUNNER_TEMP/promote" >> "$GITHUB_ENV"
            # Master's tip: the scripts and graphty/sites/<site>.json a promotion uses.
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # No registry URL input: it writes an npmrc that expects a token, which gets in the way of OIDC.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            # npm moves a dist-tag with trusted publishing (OIDC, no stored token) from 11.21.0 on. Each package
            # needs a trusted publisher for promote.yml, environment production, with "Allow npm dist-tag" ticked.
            - name: Upgrade npm for dist-tags with trusted publishing
              run: |
                  npm install -g npm@11.21.1
                  npm --version

            - name: Check that production asks the owner
              run: |
                  set -euo pipefail
                  reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
                      --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
                  [ "$reviewers" -gt 0 ] || {
                      echo "::error::environment production has no required reviewer, so nothing asked the owner"
                      exit 1
                  }

            - name: Gather the nightly, the store's record, npm and what the channel serves
              env:
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  NIGHTLY: ${{ inputs.nightly }}
              run: |
                  node tools/channel/promote.mjs gather --nightly "$NIGHTLY" --channel "$CHANNEL" \
                      $([ "$CONFIG_ONLY" = true ] && echo --config-only) --out "$WORK"

            - name: Refuse what may not be promoted
              id: check
              run: |
                  set -euo pipefail
                  node tools/channel/promote.mjs check "$WORK/facts.json" > "$WORK/plan.json"
                  jq -r '"Promote \(.tag) to \(.target): " + ((.moves | map("\(.package) \(.from // "none") -> \(.version)") | join(", ")) // "") + (if .rollback then " (rollback)" else "" end)' \
                      "$WORK/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
                  echo "version_commit=$(jq -r .versionCommit "$WORK/plan.json")" >> "$GITHUB_OUTPUT"
                  echo "rollback=$(jq -r .rollback "$WORK/plan.json")" >> "$GITHUB_OUTPUT"
                  echo "tag=$(jq -r '.tag // empty' "$WORK/plan.json")" >> "$GITHUB_OUTPUT"

            # The production smoke test of the candidate, before anything moves (a dry run too): every dry-run
            # route on the candidate's build, in a software-drawn Chromium, with no console error and a drawing
            # on the canvas, and graphty-element from its npm tarball in a blank page (graphty/acceptance/smoke.mjs).
            # A red one stops the promotion here. The smoke-published job runs it again on what was published.
            - uses: pnpm/action-setup@v6

            - name: Restore the pnpm store
              uses: ./.github/actions/restore-pnpm-store

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - uses: ./.github/actions/drop-microsoft-apt-source

            - name: Install Chromium and its system packages
              run: pnpm exec playwright install --with-deps chromium

            - name: Smoke test the candidate
              run: |
                  set -euo pipefail
                  mkdir -p "$WORK/candidate"
                  tar --zstd -xf "$WORK/site.tar.zst" -C "$WORK/candidate"
                  cp "$SITE_CONFIG" "$WORK/candidate/site.json" # what the site deploy adds
                  # the routes as they were at the candidate's commit: master's may walk a newer UI
                  commit=$(jq -r .commit "$WORK/plan.json")
                  git fetch --no-tags --depth 1 origin "$commit"
                  git checkout "$commit" -- graphty/acceptance/routes.mjs graphty/acceptance/readers.mjs design/ui/studio/tool/files
                  # the candidate's graphty-element, unless release-hold.json kept it off npm
                  element=$(jq -r '.versions["graphty-element"] // empty' "$WORK/channel.json")
                  if [ -n "$element" ] && npm view "@graphty/graphty-element@$element" version | grep -q .; then
                      node graphty/acceptance/smoke.mjs --dist "$WORK/candidate" --element "@graphty/graphty-element@$element"
                  else
                      echo "::notice::graphty-element ${element:-(none)} is not on npm: only the app's routes are tested"
                      node graphty/acceptance/smoke.mjs --dist "$WORK/candidate"
                  fi

            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                  name: smoke-candidate-${{ github.run_id }}
                  path: tmp/smoke

            # Before anything moves (a dry run too): re-sets each moved package's tag to the version it already has,
            # so a package whose trusted publisher is missing or lacks "Allow npm dist-tag" fails with nothing moved.
            - name: Check npm trusts this workflow for every package
              if: ${{ inputs.config_only != true }}
              run: node tools/channel/promote.mjs trust "$WORK/plan.json"

            - name: Move the dist-tags
              if: ${{ inputs.dry_run != true && inputs.config_only != true }}
              run: node tools/channel/promote.mjs move "$WORK/plan.json"

            - name: Write deployed.json and channel.json
              run: |
                  set -euo pipefail
                  approver=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
                      --jq '[.[] | select(.state == "approved")] | last | .user.login // empty')
                  node tools/channel/promote.mjs record "$WORK/plan.json" --config "$SITE_CONFIG" \
                      --config-ref "$GITHUB_SHA" --approver "${approver:-$GITHUB_ACTOR}" --out "$WORK/site"
                  cat "$WORK/site/deployed.json"

            - uses: actions/upload-artifact@v7
              with:
                  name: promote-${{ github.run_id }}
                  path: |
                      ${{ runner.temp }}/promote/plan.json
                      ${{ runner.temp }}/promote/site
                      ${{ runner.temp }}/promote/facts.json

            # graphty-site's deploy.yml checks the asset against deployed.json's sha256, overlays production's
            # datasets, writes site.json and deploys. Nightly's key lives in environment nightly: the
            # nightly-site job pushes there.
            - name: Check out graphty-site
              if: ${{ inputs.dry_run != true && inputs.channel == 'production' }}
              uses: actions/checkout@v7
              with:
                  repository: graphty-org/graphty-site
                  ssh-key: ${{ secrets.PRODUCTION_SITE_DEPLOY_KEY }}
                  path: site-repo

            - name: Push deployed.json to graphty-site
              if: ${{ inputs.dry_run != true && inputs.channel == 'production' }}
              run: tools/channel/promote-push.sh site-repo "$WORK/site"

            - name: Wait for graphty.app to serve it
              if: ${{ inputs.dry_run != true && inputs.channel == 'production' }}
              timeout-minutes: 30 # a hang guard only: the step ends when the site serves the stamp
              run: node tools/channel/promote.mjs wait "$WORK/plan.json" --config "$SITE_CONFIG"

            - name: Mark the GitHub releases
              if: ${{ inputs.dry_run != true && inputs.channel == 'production' && inputs.config_only != true }}
              run: node tools/channel/promote.mjs releases "$WORK/plan.json"

    # A nightly rollback: nightly.graphty.app's deploy key is in environment nightly only.
    nightly-site:
        name: Redeploy nightly.graphty.app
        needs: promote
        if: ${{ inputs.dry_run != true && inputs.channel == 'nightly' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        environment: nightly
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v8
              with:
                  name: promote-${{ github.run_id }}
                  path: ${{ runner.temp }}/promote
            - uses: actions/checkout@v7
              with:
                  repository: graphty-org/graphty-nightly
                  ssh-key: ${{ secrets.NIGHTLY_SITE_DEPLOY_KEY }}
                  path: site-repo
            - run: tools/channel/promote-push.sh site-repo "${{ runner.temp }}/promote/site"
            - timeout-minutes: 30 # a hang guard only
              run: node tools/channel/promote.mjs wait "${{ runner.temp }}/promote/plan.json" --config "$SITE_CONFIG"

    # The production smoke test again, on what was published: once npm's dist-tag shows the new graphty-element
    # and the site serves the build (the promote and nightly-site jobs waited for that), the same routes on the
    # live site and graphty-element from npm. A red one files an issue and tells the owner; it never reverts.
    smoke-published:
        name: Smoke test what was published
        needs: [promote, nightly-site]
        if: ${{ always() && inputs.dry_run != true && needs.promote.result == 'success' && needs.nightly-site.result != 'failure' && needs.nightly-site.result != 'cancelled' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        environment: release # Pushover
        permissions:
            contents: read
            issues: write # the red issue and the Release status comment
        env:
            GH_TOKEN: ${{ github.token }}
            GITHUB_TOKEN: ${{ github.token }}
            DIST_TAG: ${{ inputs.channel == 'production' && 'latest' || 'next' }}
            SITE_URL: ${{ inputs.channel == 'production' && 'https://graphty.app' || 'https://nightly.graphty.app' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            - name: Restore the pnpm store
              uses: ./.github/actions/restore-pnpm-store
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"
            - uses: ./.github/actions/drop-microsoft-apt-source
            - name: Install Chromium and its system packages
              run: pnpm exec playwright install --with-deps chromium
            - uses: actions/download-artifact@v8
              with:
                  name: promote-${{ github.run_id }}
                  path: ${{ runner.temp }}/promote
            # Only a graphty-element the plan moved is waited for: one already on the tag is there now.
            - name: Wait for npm to show the new graphty-element
              timeout-minutes: 20 # a hang guard only: the step ends when npm shows the version
              run: |
                  set -euo pipefail
                  element=$(jq -r '.moves[] | select(.package == "@graphty/graphty-element") | .version' \
                      "$RUNNER_TEMP/promote/plan.json")
                  element=${element:-$(npm view "@graphty/graphty-element@$DIST_TAG" version)}
                  until [ "$(npm view "@graphty/graphty-element@$DIST_TAG" version)" = "$element" ]; do
                      echo "npm $DIST_TAG is not $element yet"
                      sleep 15
                  done
                  echo "ELEMENT=$element" >> "$GITHUB_ENV"
            - name: Smoke test the site and the package
              id: smoke
              run: |
                  set -euo pipefail
                  commit=$(jq -r .commit "$RUNNER_TEMP/promote/plan.json")
                  git fetch --no-tags --depth 1 origin "$commit"
                  git checkout "$commit" -- graphty/acceptance/routes.mjs graphty/acceptance/readers.mjs design/ui/studio/tool/files
                  node graphty/acceptance/smoke.mjs --url "$SITE_URL" --element "@graphty/graphty-element@$ELEMENT" \
                      2>&1 | tee "$RUNNER_TEMP/smoke.log"
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                  name: smoke-published-${{ github.run_id }}
                  path: tmp/smoke
            - name: File the issue and tell the owner
              if: ${{ failure() }}
              env:
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
                  TAG: ${{ needs.promote.outputs.tag }}
              run: |
                  set -euo pipefail
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  {
                      echo "The production smoke test failed on $SITE_URL and @graphty/graphty-element@${ELEMENT:-?} after promote.yml published ${TAG:-the build} to $CHANNEL. Nothing was reverted."
                      echo
                      echo "Run: $run_url (the artifact smoke-published-${GITHUB_RUN_ID} holds each failed screen)"
                      echo
                      echo '```'
                      grep -E '^(FAILED|fail )' "$RUNNER_TEMP/smoke.log" 2>/dev/null | head -40 || echo "the smoke test did not report: read the run"
                      echo '```'
                  } > "$RUNNER_TEMP/issue.md"
                  issue=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Production smoke test red after promoting ${TAG:-a build} to $CHANNEL" \
                      --label bug --label priority:high --label effort:medium --body-file "$RUNNER_TEMP/issue.md")
                  node tools/release-status.mjs smoke-red --sha "${TAG#site-}" --what "$SITE_URL" \
                      --issue "${issue##*/}" --run "$run_url"

    # channel/<channel> follows what the channel serves. The deploy key never leaves environment release.
    channel-ref:
        name: Move channel/${{ inputs.channel }}
        needs: [promote, nightly-site]
        if: ${{ always() && inputs.dry_run != true && inputs.config_only != true && needs.promote.result == 'success' && needs.nightly-site.result != 'failure' && needs.nightly-site.result != 'cancelled' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: release # the deploy key
        permissions:
            contents: read
        env:
            COMMIT: ${{ needs.promote.outputs.version_commit }}
            ROLLBACK: ${{ needs.promote.outputs.rollback }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
            - run: |
                  set -euo pipefail
                  grep -Eqx '[0-9a-f]{40}' <<< "$COMMIT" || { echo "::error::no version commit in the plan"; exit 1; }
                  ref="refs/heads/channel/${CHANNEL}"
                  if [ "$ROLLBACK" = true ]; then
                      old=$(git ls-remote origin "$ref" | cut -f1)
                      git push --no-verify --force-with-lease="${ref}:${old}" origin "${COMMIT}:${ref}"
                  else
                      git push --no-verify origin "${COMMIT}:${ref}"
                  fi

    # The routine dependency refresh (Dependabot opens security updates only, .github/dependabot.yml): after
    # production moved forward, one grouped "chore(deps): refresh dependencies after promotion <tag>" pull
    # request, or none when nothing is newer (tools/dependency-refresh.mjs). It is opened as graphty-agent with
    # AGENT_AUTOMERGE_TOKEN (Contents and Pull requests write) from the master-only environment
    # dependabot-automerge, as dependabot-automerge.yml does, so its pushes start CI.
    dependency-refresh:
        name: Refresh dependencies
        needs: promote
        if: ${{ inputs.dry_run != true && inputs.config_only != true && inputs.channel == 'production' && needs.promote.result == 'success' && needs.promote.outputs.rollback != 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: dependabot-automerge
        permissions:
            contents: read
        env:
            GH_TOKEN: ${{ secrets.AGENT_AUTOMERGE_TOKEN }}
            TAG: ${{ needs.promote.outputs.tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  token: ${{ secrets.AGENT_AUTOMERGE_TOKEN }}
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
            # The script imports semver and runs visual-review init, both from the workspace's install.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"
            - name: Refresh and open the pull request
              env:
                  HUSKY: "0"
              run: |
                  set -euo pipefail
                  git config user.name graphty-agent
                  git config user.email 347682054+graphty-agent@users.noreply.github.com
                  node tools/dependency-refresh.mjs --label "${TAG:-$(date -u +%F)}"
