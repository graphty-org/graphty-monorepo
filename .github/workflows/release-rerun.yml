# .github/workflows/release-rerun.yml -- re-runs a finished run's failed jobs ONCE, on the same commit
# (design/ci/channels-pipeline.md section 3, "Same-commit re-run, once"). tools/release-rerun.mjs decides:
#
# - a full, restart or candidate Release run: its attempt-1 verdict deferred a red verdict (verdict-1.json) and only
#   lanes, the re-capture or the verdict failed: `gh run rerun --failed`, so the failed lanes and their dependents
#   run again on a fresh runner and the second attempt's verdict decides (a lane that passes is filed as flaky and
#   does not block). Never the version, land, publish or promote jobs: a failed one of those files what the verdict
#   deferred instead (tools/full-run.mjs file-deferred), since no second attempt will.
# - any other run that holds a T4 job (a GPU dispatch, a legacy or shadow Release run, the weekly paired benchmark):
#   re-run once only when every failed job lost its machine.dev runner (tools/gpu-runner-lost.sh), a spot reclaim and
#   not a test result. A workflow_call's jobs belong to the CALLER's run, so the train's T4 is seen through "Release".
# - a Release run whose verdict decided (not red) and then only the Verdict job failed (the screenshot gate, the
#   promotion decision or the hold errored): that job is re-run once.
# - a Release run's second attempt that ended cancelled with no verdict of its own (a newer dispatch replaced it while
#   pending): attempt 1's deferred red is filed, as a red second attempt would have.
#
# Only attempt 1 is ever re-run, so a run is re-run at most once.
name: Release rerun
on:
    workflow_run:
        workflows: ["GPU", "Release", "GPU weekly paired benchmark"]
        types: [completed]
    # a Release run on channel/full-run asks for itself (release.yml's watchers job): GitHub raises no workflow_run
    # event for a run a workflow's GITHUB_TOKEN dispatched
    workflow_dispatch:
        inputs:
            run:
                description: "The Release run to decide on (its id)"
                required: true
                type: string
permissions: { actions: write, checks: read, contents: read, issues: write, id-token: write }
jobs:
    rerun:
        name: Re-run once on the same commit
        # a job that hits its timeout-minutes ends cancelled, and so does its run; a second attempt that ended cancelled
        # (replaced while pending) may leave attempt 1's deferred red to file
        if: github.event_name == 'workflow_dispatch' || (contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.run_attempt == 1) || (github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.run_attempt == 2)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: master
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            # dispatched by a channel/full-run Release run's watchers job (no workflow_run event for it): wait for that run
            # to end, then describe it as the event would
            - name: Wait for the dispatched run to end
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN: ${{ inputs.run }}
              run: |
                  set -euo pipefail
                  gh run watch "$RUN" --repo "$GITHUB_REPOSITORY" --interval 20 > /dev/null || true
                  gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '"D_RUN=\(.id)",
                      "D_ATTEMPT=\(.run_attempt)", "D_CONCLUSION=\(.conclusion)", "D_TITLE=\(.display_title)",
                      "D_URL=\(.html_url)", "D_HEAD_SHA=\(.head_sha)", "D_STARTED=\(.run_started_at)"' >> "$GITHUB_ENV"

            - name: Re-run the failed jobs once, or file what the verdict deferred
              if: ${{ github.event_name != 'workflow_dispatch' || (contains(fromJSON('["failure","cancelled","timed_out"]'), env.D_CONCLUSION) && env.D_ATTEMPT == '1') || (env.D_CONCLUSION == 'cancelled' && env.D_ATTEMPT == '2') }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ github.token }}
                  RUN: ${{ github.event.workflow_run.id || env.D_RUN }}
                  WORKFLOW: ${{ github.event.workflow.name || 'Release' }} # workflow_run.name is the run-name, "Release (full)"
                  TITLE: ${{ github.event.workflow_run.display_title || env.D_TITLE }}
                  ATTEMPT: ${{ github.event.workflow_run.run_attempt || env.D_ATTEMPT }}
                  CONCLUSION: ${{ github.event.workflow_run.conclusion || env.D_CONCLUSION }}
                  RUN_URL: ${{ github.event.workflow_run.html_url || env.D_URL }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha || env.D_HEAD_SHA }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
              run: node tools/release-rerun.mjs
