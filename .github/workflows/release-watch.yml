# The backstop for the release announcements (tools/release-status.mjs): when a Release run ends badly
# (failure, cancelled, timed_out, startup_failure, action_required...) and no comment on the "Release status"
# issue already reports a failure of that run attempt, this comments there, mentioning RELEASE_NOTIFY. It catches
# the runs that never reached their own announce step: a run that started no job, a job that never got a runner,
# a whole run cancelled, an announce step that failed, a bookkeeping step that failed after the release landed.
# It runs as its own workflow run, so a broken or cancelled release run still triggers it.
#
# Not news, so silent: success, skipped and neutral runs; a pending run the release-train concurrency group
# replaced with a newer one (cancelled before any job started); a first attempt release-rerun.yml re-runs on the same
# commit or files itself (tools/release-rerun.mjs decides the same way for both), whose re-run announces itself.
# A shadow release run (run name "Release (shadow)", release.yml's default mode) is never announced: it publishes
# nothing, and its own held job comments on #3418 when it goes red.
name: Release watch

on:
    workflow_run:
        workflows: ["Release"]
        types: [completed]

permissions:
    actions: read
    checks: read
    contents: read
    issues: write

jobs:
    announce:
        name: Announce a release run that ended badly
        if: ${{ !contains(fromJSON('["success","skipped","neutral"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.display_title != 'Release (shadow)' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: master
                  sparse-checkout: tools

            - name: Comment on the Release status issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  STARTED: ${{ github.event.workflow_run.run_started_at }}
                  TITLE: ${{ github.event.workflow_run.display_title }}
              run: |
                  set -euo pipefail
                  # the decision release-rerun.yml takes on this run: anything but none, and that run announces it
                  out=$(mktemp)
                  RUN="$RUN_ID" WORKFLOW=Release GITHUB_OUTPUT="$out" node tools/release-rerun.mjs --dry ||
                      echo "::warning::could not ask tools/release-rerun.mjs; announcing"
                  decision=$(sed -n 's/^decision=//p' "$out")
                  if [ -n "$decision" ] && [ "$decision" != none ]; then
                      echo "run ${RUN_ID}: release-rerun.yml decides (${decision}); it announces itself"
                      exit 0
                  fi
                  node tools/release-status.mjs run-ended --run "$RUN_URL" --attempt "$ATTEMPT" \
                      --what "$CONCLUSION" --sha "$HEAD_SHA" --since "$STARTED"
