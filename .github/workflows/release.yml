name: Release

# Three triggers, one decision. A release needs CI, GPU and (when it ran) Hosts green on the same commit, and
# those lanes finish in any order, so the completion of each one starts this workflow and the gate below looks for
# the newest commit that is now green everywhere. workflow_dispatch is the manual retry: it runs the same gate and
# releases whatever it finds. To retry a failed publish, re-run the failed Release job: it finds the version commit
# it already made and publishes what is missing.
on:
    workflow_run:
        workflows: ["CI", "GPU", "Hosts"]
        types:
            - completed
        branches:
            - master
    workflow_dispatch:

# Runs queue behind one another rather than racing (a later pending run replaces an earlier pending one, which
# is harmless: every run re-evaluates master from scratch).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    # The release waits for every lane that ran on the released commit, not only CI (the owner's rule of
    # 2026-09-18: no release while any lane is red). GPU (gpu.yml, a machine.dev T4) and Hosts (hosts.yml, Dawn on
    # Metal and on D3D12/WARP, WebKit) are separate workflows so an offline runner can never stall a pull request,
    # and this job is where they become required. Hosts is filtered by paths, so a commit that touched none of
    # them has no Hosts run, which counts as nothing to wait for; CI and the GPU lane run on every push to master
    # and must exist.
    #
    # The released commit is the NEWEST commit on master's first-parent line, after the last release commit,
    # whose lanes all succeeded -- not necessarily master's tip. The GPU lane takes about 40 minutes and runs one
    # commit at a time (a newer push replaces the pending one, which ends cancelled), so when master moves faster
    # than that its tip is almost never green and waiting for the tip would never release. A commit whose lanes
    # failed, were cancelled or are still running is passed over, never released. A commit at or before the last
    # release commit is never a candidate, so a run that finds the newest green commit already released does
    # nothing, and a release never goes backwards.
    gate:
        name: Find the newest commit green on every lane
        runs-on: ubuntu-24.04
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        permissions:
            actions: read
            contents: read
        outputs:
            release: ${{ steps.lanes.outputs.release }}
            sha: ${{ steps.lanes.outputs.sha }}
            ci_run_id: ${{ steps.lanes.outputs.ci_run_id }}
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            # Commit history only (no trees or blobs): the gate reads subjects and parents, never files.
            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0
                  filter: tree:0

            - name: Pick the newest commit since the last release with CI, GPU and Hosts green
              id: lanes
              run: |
                  set -euo pipefail
                  skip() { echo "::notice::$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }
                  # Candidates, newest first: master's first-parent line down to the last release commit. A
                  # release commit (nx's "chore(release): publish", or the merge that lands one on a master that
                  # had moved on) carries [skip ci], so no lane ever runs on it; it is the floor.
                  candidates=()
                  while read -r sha subject; do
                      case "$subject" in "chore(release): publish"*) echo "last release: ${sha} ${subject}"; break ;; esac
                      candidates+=("$sha")
                  done < <(git log --first-parent --max-count=200 --format='%H %s' HEAD)
                  [ "${#candidates[@]}" -gt 0 ] || skip "nothing on master since the last release"
                  # Every lane's master runs, newest first, as "head_sha id status conclusion". The first line for a
                  # commit is its newest run (a re-run keeps its id and updates in place).
                  runs() {
                      gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?branch=master&per_page=100" \
                          --jq '.workflow_runs[] | "\(.head_sha) \(.id) \(.status) \(.conclusion // "-")"'
                  }
                  ci_runs=$(runs ci.yml); gpu_runs=$(runs gpu.yml); hosts_runs=$(runs hosts.yml)
                  newest() { awk -v s="$2" '$1 == s { print $2, $3, $4; exit }' <<< "$1"; }
                  # The release reuses the CI run's per-package builds (the downloads in the job below), and the
                  # deploy reuses its Storybooks, docs and example pages; CI keeps all of them for one day.
                  artifacts_ok() {
                      local live
                      live=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts?per_page=100" --jq '
                          [.artifacts[] | select(.expired | not) | .name] as $live
                          | ["graph-format", "graph-io", "webgpu-graph-algorithms", "graph-samples", "algorithms",
                             "layout", "graphty", "graphty-element", "remote-logger", "compact-mantine",
                             "storybook-element", "storybook-app", "storybook-compact-mantine",
                             "storybook-algorithms", "storybook-layout", "docs", "ghpages-algorithms",
                             "ghpages-layout"]
                          | map("build-" + .) - $live | length')
                      [ "$live" = 0 ]
                  }
                  for sha in "${candidates[@]}"; do
                      ci=$(newest "$ci_runs" "$sha"); gpu=$(newest "$gpu_runs" "$sha"); hosts=$(newest "$hosts_runs" "$sha")
                      echo "${sha}: ci=[${ci:-none}] gpu=[${gpu:-none}] hosts=[${hosts:-none (paths did not change)}]"
                      case "$ci" in *" completed success") ;; *) continue ;; esac
                      case "$gpu" in *" completed success") ;; *) continue ;; esac
                      case "$hosts" in "" | *" completed success") ;; *) continue ;; esac
                      ci_run_id=${ci%% *}
                      artifacts_ok "$ci_run_id" ||
                          skip "${sha} is green but CI run ${ci_run_id} no longer holds its builds; a newer green commit releases"
                      echo "every lane green on ${sha}; CI run ${ci_run_id} holds the build artifacts"
                      { echo "release=true"; echo "sha=${sha}"; echo "ci_run_id=${ci_run_id}"; } >> "$GITHUB_OUTPUT"
                      exit 0
                  done
                  skip "no commit since the last release is green on every lane yet; the next lane to finish tries again"

    release:
        name: Release
        runs-on: ubuntu-24.04
        needs: gate
        if: ${{ needs.gate.outputs.release == 'true' }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            # The release pushes its version commit and tags straight to master, which the
            # "Protect master" ruleset allows only for deploy keys. So the checkout (and every
            # git push after it) goes over SSH with the repo's release deploy key rather than
            # GITHUB_TOKEN, which a repository ruleset cannot exempt. npm trusted publishing is
            # unaffected: it proves this workflow's identity with the OIDC token (id-token:
            # write above), not with the git credential. GitHub API calls in this job still use
            # GITHUB_TOKEN.
            #
            # The checkout is the commit the gate found green, not master's tip: the CI artifacts below are
            # that commit's build, and the version commit nx makes must sit on the tree those lanes tested.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  fetch-depth: 0
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

            # A re-run of this job after a failed publish must not version the commit a second time: its
            # version commit and tags already exist. Find that commit (on master, or only on its tags when
            # landing it failed) and continue from it.
            - name: Look for a release commit already made on this commit
              id: existing
              run: |
                  release=$(git rev-list --parents --max-count=20 --grep='^chore(release): publish' origin/master --tags |
                      awk -v c="${{ needs.gate.outputs.sha }}" '$2 == c && NF == 2 { print $1; exit }')
                  if [ -n "$release" ]; then
                      echo "already versioned as ${release}; publishing from it"
                      git checkout --detach "$release"
                  fi
                  echo "commit=${release}" >> "$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@v4

            # Note: Do NOT set registry-url - it interferes with OIDC trusted publishing
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            # Upgrade npm to 11.5.1+ for OIDC trusted publishing support.
            #
            # Pinned to 11 rather than latest. nx builds its pnpm publish command
            # as `pnpm publish ... --no-git-checks`, and pnpm forwards that flag
            # to npm even though pnpm owns it. npm read unknown config as a
            # warning through 11.x and made it fatal in 12.0.0 (2026-07-08), so
            # `npm@latest` now fails every publish with
            # EUNKNOWNCONFIG: Unknown cli flag: --git-checks.
            #
            # 11.x still satisfies the 11.5.1+ this step exists for, and is the
            # line that published every current version on the registry. Drop the
            # pin once pnpm stops forwarding the flag or nx stops passing it.
            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@11
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Download build artifacts from CI workflow instead of rebuilding
            # This ensures we release the exact same code that was tested
            - name: Download graph-format build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-format
                  path: graph-format/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-io
                  path: graph-io/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download webgpu-graph-algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-webgpu-graph-algorithms
                  path: webgpu-graph-algorithms/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-samples build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-samples
                  path: graph-samples/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout build
              uses: actions/download-artifact@v4
              with:
                  name: build-layout
                  path: layout/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty-element build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty-element
                  path: graphty-element/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download remote-logger build
              uses: actions/download-artifact@v4
              with:
                  name: build-remote-logger
                  path: remote-logger/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download compact-mantine build
              uses: actions/download-artifact@v4
              with:
                  name: build-compact-mantine
                  path: compact-mantine/dist/
                  run-id: ${{ needs.gate.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Cache Nx
              uses: actions/cache@v4
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      nx-${{ runner.os }}-

            # nx.json's git.pushArgs makes nx push the new tags only (they carry the version commit with
            # them), not a branch: the version commit sits on the gate's commit, which need not be master's tip
            # any more. The next step puts it on master.
            - name: Version and Release
              if: ${{ steps.existing.outputs.commit == '' }}
              run: |
                  echo "npm version: $(npm --version)"
                  echo "node version: $(node --version)"
                  # Version, changelog, commit, tag and push -- but do NOT publish:
                  #
                  #   shouldPublish        = !!args.yes && !args.skipPublish && hasNewVersion
                  #   shouldPromptPublishing = !args.yes && !args.skipPublish && !args.dryRun && ...
                  #
                  # --skip-publish makes both false, so publishing happens exactly
                  # once, in the separate command below. Without it nx publishes
                  # here as well, and the second pass races npm's staged-publish
                  # window: nx skips a package only when it can already see the
                  # version in the registry, a just-published version is staged and
                  # not yet visible, so nx publishes it again and npm answers
                  # "409 Conflict - Cannot publish over previously staged version".
                  # That reported a red build on every release that had in fact
                  # published everything, and bailing on the first 409 left the
                  # packages behind it unpublished.
                  #
                  # --yes is deliberately absent: nx rejects it alongside
                  # --skip-publish as mutually exclusive, and it is not needed.
                  # Those two lines are the only places nx reads args.yes -- it
                  # exists solely to auto-answer the publish prompt, and skipping
                  # publishing means there is no prompt to answer. Versioning,
                  # changelog and the GitHub release never consult it.
                  pnpm exec nx release --skip-publish --verbose
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # OIDC trusted publishing - npm will use the GitHub Actions OIDC token
                  # Requires configuring trusted publishers on npmjs.com
                  NPM_CONFIG_PROVENANCE: true
                  # Clear any NODE_AUTH_TOKEN that might interfere with OIDC
                  NODE_AUTH_TOKEN: ""
                  # Disable husky hooks - they interfere with release commits
                  # (prepare-commit-msg tries to open TTY, pre-push runs tests again)
                  HUSKY: "0"

            # Put the version commit on master without rewriting either side. When master still points at the
            # gate's commit this is a fast-forward, exactly as before. When master has moved on, it is a merge
            # commit -- master's newer commits as the first parent, the version commit as the second -- so the
            # tags stay on the tree the lanes tested and npm ships, and they are reachable from master, which
            # is where nx looks for the last version (`git tag --merged`) next time. The merge's subject starts
            # with "chore(release): publish" and carries [skip ci]: no lane runs on it, and the gate treats it
            # as the last release, so the commits it merged in (newer than the released one, older than the
            # merge) are released by the first green commit after it. Only package.json version lines and
            # CHANGELOG.md files differ from the released commit, so the merge conflicts only if a commit on
            # master edited those same lines; then nothing lands or publishes, the tags are pushed already,
            # and a person merges the version commit by hand and re-runs this job. A push that loses a race
            # with a new master commit is retried on the new tip, never forced.
            - name: Put the version commit on master
              run: |
                  release=$(git rev-parse HEAD)
                  git worktree add --detach "$RUNNER_TEMP/land" >/dev/null
                  cd "$RUNNER_TEMP/land"
                  for try in 1 2 3 4 5; do
                      git fetch --quiet origin +refs/heads/master:refs/remotes/origin/master
                      if git merge-base --is-ancestor "$release" origin/master; then
                          echo "master holds ${release}"; exit 0
                      fi
                      git checkout --quiet --detach origin/master
                      git merge --no-verify --no-edit -m "chore(release): publish $(git log -1 --format=%h "$release") onto master [skip ci]" "$release" ||
                          { echo "::error::the version commit ${release} does not merge cleanly into master; merge it by hand, then re-run this job"; exit 1; }
                      git push --no-verify origin HEAD:refs/heads/master && { echo "master now holds ${release}"; exit 0; }
                      echo "try ${try}: master moved during the push; merging again"
                  done
                  echo "::error::could not land ${release} on master in five tries"; exit 1
              env:
                  HUSKY: "0"

            - name: Publish
              run: |
                  # The only publish. It is a separate command because `nx release`
                  # publishes only when it versioned something in the same run, so
                  # a release whose publish step fails could never be retried. The
                  # tags are already pushed, so the next run resolves the current
                  # version from them, finds no new conventional commits, reports
                  # "No changes were detected" and skips publishing. The packages
                  # stay tagged and unpublished for good. That is exactly what
                  # happened when npm 12 broke the publish command.
                  #
                  # `nx release publish` does not consult hasNewVersion: it
                  # publishes the versions in the manifests and queries the registry
                  # per package, skipping any version that is already there.
                  # Re-running this job after a failed publish finds the release
                  # commit already made (the lookup step above), skips versioning,
                  # and ships whatever is still missing.
                  #
                  # --nxBail=false is nx's default already (it reads NX_BAIL when the flag is absent); it is
                  # spelled out so one package's failed publish never stops the packages behind it.
                  #
                  # A failed publish does not fail this step: the next step, which polls the registry, decides.
                  # npm answers a retry inside its propagation window (up to about 7.5 minutes after it accepted
                  # an upload) with E409 "Cannot publish over previously staged version" (npm/cli#9889), which
                  # failed the 3.1.0 release although every version it refused was already published. Any other
                  # failure leaves a version missing, and the next step fails on it.
                  pnpm exec nx release publish --nxBail=false ||
                      echo "::warning::nx release publish reported a failure; the registry check below decides"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # OIDC trusted publishing - npm will use the GitHub Actions OIDC token
                  # Requires configuring trusted publishers on npmjs.com
                  NPM_CONFIG_PROVENANCE: true
                  # Clear any NODE_AUTH_TOKEN that might interfere with OIDC
                  NODE_AUTH_TOKEN: ""
                  # Disable husky hooks - they interfere with release commits
                  # (prepare-commit-msg tries to open TTY, pre-push runs tests again)
                  HUSKY: "0"

            # npm can accept a publish and still not serve it, and nx release publish skips any package whose
            # dependency failed. So the last word is the registry: every non-private package's version at the
            # version commit must be installable. npm takes a while to serve a fresh version (up to about 7.5
            # minutes), hence the bounded poll (20 tries, 30 s apart) against the registry before calling a
            # package missing.
            - name: Check every version is on npm
              run: |
                  missing() {
                      pnpm -r ls --depth -1 --json | jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"' |
                          while read -r spec; do
                              [ "$(npm view "$spec" version 2>/dev/null)" = "${spec##*@}" ] || echo "$spec"
                          done
                  }
                  for try in $(seq 1 20); do
                      absent=$(missing)
                      [ -n "$absent" ] || { echo "every package version is on npm"; exit 0; }
                      echo "try ${try}: not on npm yet: ${absent//$'\n'/ }"
                      sleep 30
                  done
                  for spec in $absent; do echo "::error::${spec} is versioned on master but not on npm; run this workflow again to publish it"; done
                  exit 1

    # graphty.app (the app, the docs, the Storybooks and the hosted data: one Pages site) goes live only after
    # a successful build and release, built from the released commit's CI artifacts. deploy-pages.yml skips a
    # commit that is live already, which is what a re-found commit with nothing to version looks like.
    deploy:
        name: Deploy graphty.app
        needs: [gate, release]
        permissions:
            contents: read
            pages: write
            id-token: write
            actions: read
        uses: ./.github/workflows/deploy-pages.yml
        with:
            run-id: ${{ needs.gate.outputs.ci_run_id }}
            sha: ${{ needs.gate.outputs.sha }}

    # The release commit carries [skip ci] (nx.json, release.git.commitMessage) so that pushing it cannot start
    # CI, the paid GPU lane, Hosts, the Pages deploy, and through CI's completion a second release. That also means
    # no push workflow ever looks at it, so this job is the one check the released tree gets: the version bumps,
    # the changelogs and the lockfile as nx release left them must still install, build and lint.
    verify-release-commit:
        name: Verify the release commit
        runs-on: ubuntu-24.04
        needs: release
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - name: Record the commit under test
              run: echo "verifying $(git log -1 --format='%H %s')"

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Build
              run: pnpm exec nx run-many -t build --parallel=3

            - name: Lint
              run: pnpm exec nx run-many -t lint --parallel=3
