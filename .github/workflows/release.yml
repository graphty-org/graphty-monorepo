name: Release
run-name: ${{ inputs.mode == 'legacy' && 'Release (legacy)' || inputs.mode == 'shadow' && 'Release (shadow)' || format('Release ({0})', inputs.mode || 'full') }}

# Four modes. The two of the 6-hour full run (channels pipeline steps 6 and 7, design/ci/channels-pipeline/channels.md
# sections 5 to 7; issues #3454 and #1020), which publish only to npm `next` and nightly.graphty.app:
#
# - full (the default, and every scheduled run): the pick job takes the newest master commit whose push build kept a
#   site (the results store's GET /v1/candidate) and does nothing when the store says it is judged, or when every
#   merge since a judged commit changes only versions or screenshot approvals (tools/release-diff.mjs; the commit
#   inherits that verdict). The lanes run on it, and the verdict job ends the run in one state, written to the store
#   (green-clean, green-images, red or owner-item). A red one files or updates the one "Full run red: <lane> on
#   <sha>" issue (bug, priority:critical), dispatches bisect.yml once, and is announced on the Release status
#   issue and through Pushover; a green one closes that issue. A store that does not answer makes the slot test
#   master's head ("unknown means run").
#   A green-clean verdict promotes the candidate to nightly in the same run (channels section 7), unless a publish
#   hold is open or the screenshot gate refuses the candidate's baselines against channel/nightly's: the version
#   job versions it, the land job pushes the version merge, its tags, the site-<sha> tag and channel/nightly, the
#   publish job publishes npm `next`, and the site job (environment `nightly`) hangs the commit's built site on the
#   site-<sha> prerelease, pushes deployed.json to graphty-org/graphty-nightly and ends on that deploy. A candidate
#   with nothing to version still moves the site and channel/nightly; npm `next` stays. green-images holds the
#   candidate for the owner's screenshot review (promote after approval, below) and is announced like a red run, once a week per set of changed screenshots. Every run's timings job also raises the age:nightly stall alarm.
# - restart: dispatched by ci.yml's release-due job when a green master build references the open red issue
#   (tools/release-due.mjs); the same run on the commit it was dispatched on.
#
# Same-commit re-run, once, and the held candidate (design/ci/channels-pipeline.md section 3, issue #3741):
#   - the recapture job shoots the stories the CI lane found changed or new again on a fresh runner and writes the
#     run's one gated capture, visual-final-<project>-<attempt>; a story that does not draw the same picture twice is
#     filed as flaky by the verdict;
#   - attempt 1 of a full or restart run that is red on a lane files nothing and announces nothing: release-rerun.yml
#     re-runs its failed jobs once (never version, land, publish), and that attempt's verdict decides; a lane green
#     on the re-run is filed "Flaky in full run" and does not block;
#   - a deciding verdict that is not green-clean holds its commit while nothing is held: branch channel/candidate,
#     the results store's hold and a "Nightly held on <sha12>" issue. While a hold stands, a slot first tests the held
#     head if no run judged it, else master's newest commit, whose verdict files red issues but never promotes or
#     replaces the hold. The held candidate promoting ends the hold (land), and so does the owner's
#     `-f mode=abandon` (environment production, then the abandon job).
#   - fix forward (tools/channel/candidate-fix.mjs): a held candidate is fixed on branches made from its head, named
#     for the hold issue. Before every full, restart and candidate pick, the candidate_fix job merges each such fix
#     that reached master (its last commit before tools/pr-open.sh merged master in; never master itself) into branch
#     channel/candidate and moves the hold's head. The pick then tests that head first, and re-tests only what the
#     fixes reach: the test shards nx calls affected (ci.yml `shards`, no screenshots there), T4, the audit, Hosts
#     and macOS work protection when their packages or the lockfile changed, and in the recapture job every story of
#     an affected Storybook, the other projects' captures carried over from the run before. The candidate_site job
#     assembles the head's site (deploy-pages.yml), which master never built. A red re-test goes to the hold issue
#     only. `candidate`: dispatched by ci.yml's release-due job when such a fix merges; a run like a full one that
#     tests only a moved held head, never master.
#
# Promote after approval (design/ci/channels-pipeline.md section 5, "Approval gates nightly"): a held head H whose
# verdict is green-images waits for the owner's screenshot review. His Finish opens an accept-only pull request: the
# accept commit on H, then the commit holding his signed approval of its baselines; its head P is the approval. When
# it merges, ci.yml's release-due job dispatches `-f mode=promote-nightly -f candidate=H -f accept=P`, and every full
# slot first catches up on such an approval (tools/channel/resume.mjs, in the pick job), so a slot that replaced a
# pending promote-nightly run loses nothing. Such a run tests nothing: the resume job runs the unchanged screenshot
# gate on the captures of the run that judged H (its visual-final-*) against P's baselines, then version, land,
# publish and site run on P with the builds that run kept (P changes only baselines and approvals), and the unhold
# job records `approved` and ends the hold. It promotes once: an approval nightly already holds,
# one for a head that is not the held one, one behind nightly, or one whose head's latest verdict is not green-images
# is refused, and the land job never moves channel/nightly backwards.
#
# And the two of rollout step 3 (design/ci/channels-pipeline/migration.md section 3; issue #3424):
#
# - shadow, only when dispatched with `-f mode=shadow` (it was the default before full): the lanes below run on
#   the candidate and the version job versions it, but nothing lands and nothing publishes (the approve, land and
#   publish jobs are skipped). A red shadow run opens no "Release held" issue: it comments once on #3418 instead.
#   Nothing announces it.
# - legacy, dispatched only on the owner's word (`gh workflow run release.yml --ref master -f mode=legacy`):
#   the same lanes, then the approve job waits in environment `production` for the owner, then land and publish
#   (npm `latest`) run in environment `release`, as described below. graphty.app does not follow it: graphty.app is
#   graphty-site's and moves only by promote.yml, so a legacy run moves npm `latest` alone. Its removal is still open on issue #3467.
#
# No workflow_run trigger: a master push never starts or restarts a release.
#
# The release train: one run tests a commit on every lane and, when all pass, publishes it (owner decision,
# 2026-10-11: "when the release starts it should run the testing itself (without a PR) and then directly publish
# if the testing passes"). It replaced a release pull request that waited in the merge queue behind every other
# pull request (design/ci/ci-cd-plan.md, sections 10 and 11). Master runs no tests (owner decision, 2026-10-06): the
# merge queue tests each batch's combined tree, and this train tests the exact commit it releases.
#
# 1. At 00:00, 06:00, 12:00 and 18:00 UTC, or at once when the owner dispatches it (the ad hoc release), the
#    pick job takes master's newest commit -- unless a "Release held" issue is open (a fix is in progress; a
#    dispatch runs anyway) or nothing releasable changed since the last release.
# 2. On that commit, in parallel: the FULL CI suite (ci.yml called on it, every shard of every package, which
#    also makes the builds this release ships), the paid NVIDIA T4 lane (gpu.yml), the host matrix (hosts.yml,
#    full scope), graphty-element's autosave on Safari, iOS and macOS WebKit (work-protection-macos.yml), the security audit of the shipped dependencies and the LLM regression tests (graphty-element's
#    llm-regression project: real, paid Google Gemini calls that check the model still picks the element's tools,
#    with the GOOGLE_API_KEY repository secret; a missing secret fails the job, it never skips, and a key or balance
#    the provider refuses holds the release as an owner item; once per UTC day, after the CI lane is green, and on
#    every dispatch by a person -- see the llm job). Coverage is published from the same CI run
#    (coverage.yml).
# 3. Only when all six pass, the version job versions the tested commit with nx release (one local commit holding
#    only version fields and changelogs). Anything red before the release lands holds the WHOLE release: nothing
#    pushed, nothing published, and the held job opens or updates the one train hold, a "Release held: <what>
#    failed on <sha>" issue for githerd to fix. A later train that lands closes it.
# 4. The land job merges that version commit into master's CURRENT tip and pushes the merge and one tag per
#    package ({projectName}@{version}, on the version commit) in one atomic push, with the release deploy key (the
#    only key master's ruleset lets push without a pull request). A master that moved meanwhile is fetched and
#    merged again; a real conflict in a version field or a changelog holds the release.
# 5. The publish job creates each package's GitHub release and publishes it to npm with trusted publishing (OIDC),
#    from the builds of this run's CI call. A failed publish opens its own, separate hold, a "Release held: publish
#    failed on <sha>" issue that no train retitles; re-running this run's failed jobs (gh run rerun <id> --failed)
#    re-runs only the publish job, which publishes what is missing and closes it. When npm accepted every missing
#    version and was only slow to list it, the next train attempt or master push closes it once npm lists them
#    (tools/publish-hold.mjs).
#
# Why that order: master and the tags change together (atomic push) BEFORE anything reaches npm. A failure before
# the push leaves nothing behind (a train hold; the next attempt starts over). A failure after it leaves master
# versioned and tagged with some versions missing from npm: the publish hold names the run to re-run, and no later
# train can version those numbers again, because they are tagged. npm never holds a version master does not.
#
# The file keeps its name because npm's trusted-publisher entry for every package names it.
#
# The scheduled attempts are not started by GitHub's cron: GitHub creates this repository's scheduled runs hours
# late or not at all (owner decision, 2026-10-07). Instead the Cloudflare Worker in tools/release-scheduler/
# dispatches release.yml with scheduled=true at 00:00, 06:00, 12:00 and 18:00 UTC as the graphty-release-scheduler
# GitHub App (setup and operation: tools/release-scheduler/README.md):
#   POST https://api.github.com/repos/graphty-org/graphty-monorepo/actions/workflows/release.yml/dispatches
#   {"ref":"master","inputs":{"scheduled":"true"}}   (answers HTTP 204)
# Such a run behaves exactly like a scheduled train attempt; a person can still dispatch it by hand.
#
# Ad hoc release: `gh workflow run release.yml --ref master`, optionally `-f packages=graph-format,graph-io` (nx
# project names) to release only those; every other project is held for that run, on top of release-hold.json.
on:
    workflow_dispatch:
        inputs:
            scheduled:
                description: "Set by the release scheduler: behave like a scheduled train attempt (skip while a held issue is open, or when nothing is releasable)"
                required: false
                default: false
                type: boolean
            packages:
                description: "Release only these nx projects (comma separated). Empty: every package with releasable commits."
                required: false
                default: ""
                type: string
            mode:
                description: "full: the full run on the newest unjudged candidate; a green-clean verdict whose screenshots pass promotes it to nightly (a version merge on master, npm next, nightly.graphty.app). restart: the same on this commit (ci.yml's release-due job). shadow: test and version master's head, publish nothing. legacy (owner only): test, wait for the owner in environment production, then land and publish to npm latest. abandon (owner only, environment production): end the held nightly candidate without promoting it. candidate (ci.yml's release-due job): merge the fixes made for the held candidate and re-test its new head. promote-nightly (ci.yml's release-due job): promote the candidate whose screenshots the owner approved, with its accept commit"
                required: false
                default: full
                type: choice
                options:
                    - full
                    - restart
                    - shadow
                    - legacy
                    - abandon
                    - candidate
                    - promote-nightly
            candidate:
                description: "promote-nightly: the candidate the owner approved (the full run's tested commit)"
                required: false
                default: ""
                type: string
            accept:
                description: "promote-nightly: the owner's approval, the head of his accept-only pull request on the candidate"
                required: false
                default: ""
                type: string

# One train at a time across all its jobs: a second train waits for the first, which has published (or held the
# release) by then, so the second finds nothing new to release or tries the newer commit, and never pays for a
# second T4 run on the same commit. Two master pushes in a row therefore never start two trains.
concurrency:
    group: release-train
    cancel-in-progress: false

# What started this run, as the jobs branch on it: "schedule" for a train attempt the release scheduler dispatched
# (scheduled=true), otherwise the event's name ("workflow_dispatch" for a person's ad hoc release). MODE is the
# dispatch's mode, full when it named none. DIST_TAG is the npm dist-tag the land and publish jobs release to: `latest`
# for a legacy run (behind the owner's production approval), `next` for the nightly promotion of a full or restart
# run (channels pipeline step 7, issue #3461). Both publish from the same job in environment `release`, so npm
# trusted publishing bound to that environment serves both.
env:
    TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled && 'schedule' || github.event_name }}
    MODE: ${{ inputs.mode || 'full' }}
    DIST_TAG: ${{ inputs.mode == 'legacy' && 'latest' || 'next' }}

jobs:
    # The run's durations against ci-budgets.json, and its rows to the results store (.github/actions/timings).
    # It needs every job, so it runs last, whatever happened; never fails. Called workflows' jobs are reported here too.
    timings:
        name: Timings
        needs:
            [
                candidate_fix,
                pick,
                ci,
                t4,
                hosts,
                autosave_macos,
                audit,
                llm,
                version_dry_run,
                coverage,
                candidate_site,
                recapture,
                verdict,
                keep_builds,
                resume,
                held,
                version,
                approve,
                land,
                publish,
                site,
            ]
        if: ${{ always() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read
            id-token: write
            issues: write # the age:nightly stall alarm
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      tools
                      .github/actions

            - uses: ./.github/actions/timings
              with:
                  results-url: ${{ vars.RESULTS_URL }}
                  health-api-url: ${{ vars.HEALTH_API_URL }}
                  kind: full

            # The stall alarm (design/ci/channels-pipeline.md section 7): age:nightly, the time since channel/nightly
            # last moved while canary holds an unpromoted commit (the store's GET /v1/release-state). Over 24 hours it
            # files or updates one priority:critical "Nightly stalled since <date>" issue naming what blocks it, over
            # 48 hours with an ACTION NEEDED line; it closes the issue once nightly moves. Fails open.
            - name: Check that nightly is not stalled (age:nightly)
              if: ${{ github.ref == 'refs/heads/master' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/channel/nightly.mjs stall

    # The candidate is master's newest commit. Every reason not to try is an event that has not happened yet
    # (owner rule: a state ends on the event that settles it, never on a count of hours).
    # Fix forward (design/ci/channels-pipeline.md section 3): each fix for the held candidate that reached master is
    # merged into branch channel/candidate, and the results store's hold moves to the new head, before the pick reads
    # it (tools/channel/candidate-fix.mjs advance). Every full, restart and candidate run does this, so a candidate
    # run replaced while pending loses nothing. The deploy key pushes channel/candidate; the job runs git, gh and the
    # script only, nothing installed. A failure only leaves the fixes for the next run: the pick still runs.
    candidate_fix:
        name: Merge fixes into the held candidate
        if: ${{ github.ref == 'refs/heads/master' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: release # the deploy key
        permissions:
            contents: read # the push goes over SSH with the deploy key, not with this token
            issues: write # the hold issue: the new head, a fix that cannot enter
            id-token: write # the results store's hold
        steps:
            # master's history: the fixes' merges since the held commit
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

            # the runner's own Node: nothing is installed next to the deploy key
            - name: Merge the fixes and move the hold
              env:
                  GH_TOKEN: ${{ github.token }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  node tools/channel/candidate-fix.mjs advance

    pick:
        name: Pick the release candidate
        needs: candidate_fix
        # !cancelled(): candidate_fix is skipped in most modes, and its failure only leaves the fixes for the next run
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && inputs.mode != 'abandon' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        # Pushover for a legacy run's announcement; a shadow run announces nothing, so it takes no environment
        environment: ${{ inputs.mode == 'legacy' && 'release' || '' }}
        permissions:
            contents: write # delete the branch of a release pull request left from the old design
            actions: read # find an earlier shadow run on the same commit
            issues: write # close a publish hold npm has ended (tools/publish-hold.mjs settle)
            pull-requests: write # close that pull request
            id-token: write # a full run's pick reads the results store and records a verdict it inherits
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            release: ${{ steps.candidate.outputs.run || steps.releasable.outputs.release || 'false' }}
            sha: ${{ steps.resume.outputs.sha || steps.candidate.outputs.sha || steps.pending.outputs.sha }}
            good: ${{ steps.candidate.outputs.good }}
            build_run: ${{ steps.candidate.outputs.build_run }}
            # the held candidate's head (tools/full-run.mjs pick): "" none, "unknown" when the store did not answer
            held: ${{ steps.resume.outputs.held || steps.candidate.outputs.held }}
            # promote after approval (tools/channel/resume.mjs): sha is the owner's approval P, tested the candidate H the
            # lanes tested, source_run the run that judged H green-images (its captures and kept builds)
            resume: ${{ steps.resume.outputs.resume || 'false' }}
            tested: ${{ steps.resume.outputs.tested }}
            source_run: ${{ steps.resume.outputs.source_run || steps.forward.outputs.source_run }}
            # a fix forward's re-test (tools/channel/candidate-fix.mjs plan): forward is the held commit when the tested
            # head is past it; shards the ci.yml `shards` input (empty: the whole suite); hosts and macos "false" leave
            # those lanes out; capture the projects whose stories are all shot again
            forward: ${{ steps.candidate.outputs.forward }}
            shards: ${{ steps.forward.outputs.shards }}
            hosts: ${{ steps.forward.outputs.hosts }}
            macos: ${{ steps.forward.outputs.macos }}
            capture: ${{ steps.forward.outputs.capture }}
        steps:
            # The commit this run was started on (master's head when it was dispatched), so the run's commit,
            # Coveralls' commit and the tested commit are one and the same.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Skip while the previous release is pending
              id: pending
              env:
                  CANDIDATE: ${{ github.sha }}
                  # tools/publish-hold.mjs settle announces a hold npm ended, as the publish job would have
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
              run: |
                  set -euo pipefail
                  skip() { echo "::notice::$1"; echo "pending=true" >> "$GITHUB_OUTPUT"; exit 0; }
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  # A publish hold opened only because npm was slow to list versions it had accepted ends here, once
                  # npm lists them all; one npm refused stays for a person (tools/publish-hold.mjs). npm sends no
                  # event when it lists a version, so every train attempt and master push asks again.
                  publish_hold=$(tools/release-held.sh find "Release held: publish failed")
                  if [ -n "$publish_hold" ]; then
                      node tools/publish-hold.mjs settle --issue "$publish_hold" --run "$run_url" ||
                          echo "::warning::could not check publish hold #${publish_hold} against npm; the next attempt asks again"
                  fi
                  # Any hold, a train's or a publish's, stops the schedule (below).
                  held=$(tools/release-held.sh find)
                  # Cut-over from the release pull request design (2026-10-11): a release/train-* pull request still
                  # open would, if it merged, put a version commit on master that nothing tags or publishes. This
                  # train releases its commits instead. ponytail: delete this loop once no such pull request is left.
                  for number in $(gh pr list --state open --limit 200 --json number,headRefName \
                      --jq '.[] | select(.headRefName | startswith("release/train-")) | .number'); do
                      gh pr close "$number" --delete-branch --comment \
                          "Closed: releases no longer go through a pull request. ${run_url} tests master's newest commit and publishes it directly."
                  done
                  # A held release waits for its fix: a scheduled attempt skips, and an ad hoc dispatch runs
                  # anyway; a train hold closes when a legacy run lands, a publish hold when its re-run publish passes
                  # or when npm lists what it accepted (above). A full run's slot never skips for a hold: it
                  # publishes nothing, and canary's new commit may hold the fix (channels design, section 11).
                  if [ -n "$held" ] && [ "$TRIGGER" = schedule ] && [ "${MODE:-}" != full ] && [ "${MODE:-}" != restart ]; then
                      skip "the release is held (issue #${held}); a dispatch runs anyway"
                  fi
                  # A scheduled shadow run releases nothing, so master's tip stays releasable: without this, an
                  # unchanged master paid for the full suite, the T4, macOS and the LLM lane four times a day.
                  if [ "${MODE:-}" = shadow ] && [ "$TRIGGER" = schedule ]; then
                      tested=$(gh run list --workflow release.yml --commit "$CANDIDATE" --status success --limit 20 \
                          --json displayTitle --jq '[.[] | select(.displayTitle == "Release (shadow)")] | length')
                      [ "${tested:-0}" = 0 ] || skip "a shadow run already passed on ${CANDIDATE}; nothing new to test"
                  fi
                  # The newest version commit must carry its tags: the land job pushes them with it in one atomic
                  # push. A version commit without them (a release pull request of the old design merged with
                  # nothing to publish it) would make nx version from the previous tags and release the same
                  # versions a second time, so it holds the release until a person tags or reverts it.
                  last=$(git log -1 --no-merges --grep='^chore(release): publish' --format=%H HEAD)
                  while read -r project version; do
                      git rev-parse -q --verify "refs/tags/${project}@${version}" >/dev/null || {
                          echo "::error::the last version commit ${last} has no tag ${project}@${version}: it reached master without being released; tag and publish it, or revert it"
                          exit 1
                      }
                  done < <(git log -1 --format=%b "$last" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/\1 \2/p')
                  { echo "pending=false"; echo "sha=${CANDIDATE}"; } >> "$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@v6
              if: ${{ steps.pending.outputs.pending == 'false' }}

            - uses: actions/setup-node@v7
              if: ${{ steps.pending.outputs.pending == 'false' }}
              with:
                  node-version: 22.x
                  cache: "pnpm"

            # Promote after approval (tools/channel/resume.mjs): promote-nightly checks the approval it names; a full
            # slot first catches up on a held head whose approval merged, and then tests nothing.
            - name: Look for an approved candidate to promote
              id: resume
              if: ${{ steps.pending.outputs.pending == 'false' && (env.MODE == 'full' || env.MODE == 'promote-nightly') }}
              env:
                  CANDIDATE: ${{ inputs.candidate }}
                  ACCEPT: ${{ inputs.accept }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --heads origin refs/heads/channel/nightly >/dev/null; then
                      git fetch --quiet origin +refs/heads/channel/nightly:refs/remotes/origin/channel/nightly
                  fi
                  PUBLISH_HOLD=$(tools/release-held.sh find "Release held: publish failed") node tools/channel/resume.mjs check

            # A full run's candidate and whether it is already judged (tools/full-run.mjs pick), and the master
            # push run that built it, whose builds ci.yml reuses (`reuse_build_run`; empty: ci.yml builds).
            - name: Pick the full run's candidate
              id: candidate
              if: ${{ steps.pending.outputs.pending == 'false' && (env.MODE == 'full' || env.MODE == 'restart' || env.MODE == 'candidate') && steps.resume.outputs.resume != 'true' }}
              env:
                  HEAD_SHA: ${{ github.sha }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: |
                  set -euo pipefail
                  # the pick compares the candidate with channel/nightly (tools/full-run.mjs onNightly, hasNightly)
                  if git ls-remote --exit-code --heads origin refs/heads/channel/nightly >/dev/null; then
                      git fetch --quiet origin +refs/heads/channel/nightly:refs/remotes/origin/channel/nightly
                  fi
                  node tools/full-run.mjs pick
                  sha=$(sed -n 's/^sha=//p' "$GITHUB_OUTPUT" | tail -1)
                  # a held head past its commit is on channel/candidate, not on master
                  git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --quiet origin "$sha"
                  build=$(gh run list --workflow ci.yml --commit "$sha" --event push --status success --limit 1 \
                      --json databaseId --jq '.[0].databaseId // empty') || build=""
                  echo "build_run=${build}" >> "$GITHUB_OUTPUT"

            # what a fix forward's re-test runs: nx's affected projects over the held commit..the head
            - name: Plan the fix forward's re-test
              id: forward
              if: ${{ steps.candidate.outputs.run == 'true' && steps.candidate.outputs.forward != '' }}
              env:
                  BASE: ${{ steps.candidate.outputs.forward }}
                  SHA: ${{ steps.candidate.outputs.sha }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  HUSKY: "0"
              run: |
                  pnpm install --frozen-lockfile
                  node tools/channel/candidate-fix.mjs plan

            - name: Install dependencies
              if: ${{ steps.pending.outputs.pending == 'false' && env.MODE != 'full' && env.MODE != 'restart' && env.MODE != 'candidate' && env.MODE != 'promote-nightly' }}
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Versions the candidate locally, as the version job will; nothing leaves this runner. No version
            # commit means nothing releasable changed since the last release, and the full suite and the T4 are not
            # paid for.
            - name: Skip when nothing releasable changed
              id: releasable
              if: ${{ steps.pending.outputs.pending == 'false' && env.MODE != 'full' && env.MODE != 'restart' && env.MODE != 'candidate' && env.MODE != 'promote-nightly' }}
              env:
                  PACKAGES: ${{ inputs.packages }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  commit=$(tools/release-version.sh "$PACKAGES")
                  if [ -z "$commit" ]; then
                      echo "::notice::nothing releasable changed since the last release"
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "release=true" >> "$GITHUB_OUTPUT"
                      tags=$(git log -1 --format=%b "$commit" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/\1@\2/p' | paste -sd, -)
                      echo "tags=${tags}" >> "$GITHUB_OUTPUT"
                  fi

            # The owner's phone hears that a legacy run began testing a releasable candidate
            # (tools/release-status.mjs started; attempts that do nothing, and shadow runs, stay silent). A failure
            # here holds nothing.
            - name: Announce the train attempt
              if: ${{ steps.releasable.outputs.release == 'true' && inputs.mode == 'legacy' }}
              continue-on-error: true
              env:
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
                  SHA: ${{ steps.pending.outputs.sha }}
                  TAGS: ${{ steps.releasable.outputs.tags }}
              run: |
                  node tools/release-status.mjs started --sha "$SHA" --tags "$TAGS" \
                      --attempt "$GITHUB_RUN_ATTEMPT" --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

    # The full CI suite on exactly the candidate: every shard of every package, the links, the cost estimates,
    # the screenshots, and the per-package builds this release ships (no artifact of any other run is used).
    ci:
        name: CI
        needs: pick
        if: ${{ needs.pick.outputs.release == 'true' }}
        permissions:
            contents: read
            # its release-due job (master pushes only) dispatches release.yml, cancels a red run and notes it on the
            # Release status issue; a called workflow cannot ask for more than its caller grants, even for a job it skips
            actions: write
            # issues: write for its test job, which files the issue of a test the run proves flaky
            issues: write
            # ci.yml asks for it (a failed job marks the summary checks failed at once on a pull request);
            # a called workflow cannot ask for more than its caller grants.
            checks: write
            # the results store's credential (its test and timings jobs), and its timings job's comment
            id-token: write
            pull-requests: write
        uses: ./.github/workflows/ci.yml
        with:
            ref: ${{ needs.pick.outputs.sha }}
            reuse_build_run: ${{ needs.pick.outputs.build_run }}
            # a fix forward's re-test: only the affected shards, as a light run (no screenshots; the recapture job
            # shoots the affected Storybooks); empty: the whole suite
            shards: ${{ needs.pick.outputs.shards }}
        secrets: inherit

    # The paid NVIDIA T4 lane on exactly the candidate: gpu.yml's job, tests and benchmarks.
    t4:
        name: T4 GPU
        needs: pick
        if: ${{ needs.pick.outputs.release == 'true' }}
        permissions:
            contents: read
            # its timings job, which runs only when it is not called (it lists the run's jobs, OIDC for the store)
            actions: read
            id-token: write
        uses: ./.github/workflows/gpu.yml
        with:
            ref: ${{ needs.pick.outputs.sha }}

    # The host matrix (Dawn on Metal and D3D12 WARP, WebKit) on exactly the candidate, full scope.
    hosts:
        name: Hosts
        needs: pick
        # a fix forward that reaches neither webgpu-graph-algorithms, graph-format nor the lockfile leaves it out
        if: ${{ needs.pick.outputs.release == 'true' && needs.pick.outputs.hosts != 'false' }}
        permissions:
            contents: read
            # its timings job, which runs only when it is not called (it lists the run's jobs, OIDC for the store)
            actions: read
            id-token: write
        uses: ./.github/workflows/hosts.yml
        with:
            ref: ${{ needs.pick.outputs.sha }}

    # graphty-element's autosave on Apple's engines (Playwright's WebKit on macOS, real Safari, Safari on iOS in
    # the Simulator) on exactly the candidate: data a reader loses there is a release blocker like any other.
    autosave_macos:
        name: Work protection (macOS)
        needs: pick
        # a fix forward that reaches neither graphty-element nor the lockfile leaves it out
        if: ${{ needs.pick.outputs.release == 'true' && needs.pick.outputs.macos != 'false' }}
        permissions:
            contents: read
            # its timings job, which runs only when it is not called (it lists the run's jobs, OIDC for the store)
            actions: read
            id-token: write
        uses: ./.github/workflows/work-protection-macos.yml
        with:
            candidate: ${{ needs.pick.outputs.sha }}

    # The security audit lives here, not in CI: a high or critical advisory against the candidate's shipped
    # (production) dependencies holds the release, never an unrelated pull request. Development tools are left
    # out: they are not published. To release past an advisory that does not apply, add its GHSA to package.json
    # pnpm.auditConfig.ignoreGhsas with the reason. pnpm audit reads the lockfile; nothing is installed.
    audit:
        name: Security audit
        needs: pick
        if: ${{ needs.pick.outputs.release == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.pick.outputs.sha }}

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Security audit
              run: pnpm audit --prod --audit-level=high

    # graphty-element's llm-regression project on exactly the candidate: each case sends a prompt to Google
    # (gemini-3.8-flash, graphty-element/test/helpers/llm-regression-env.ts) and checks the model calls the element's
    # own tools with the right arguments. About 190 calls a release. It runs only here, never on a pull request or
    # in the merge queue, because every case is a paid API call. A missing or empty GOOGLE_API_KEY secret fails
    # the job: the tests would otherwise skip, and a release test that skips is worse than none. A missing secret,
    # or a key or balance the provider refuses (the harness prints ACCOUNT_REFUSED_MARKER), sets the job's
    # owner_item output, and the held job files the issue as the owner's to fix rather than a code defect. Each
    # case has a per-provider limit, 120 s on Google (graphty-element/test/helpers/llm-regression-env.ts), so the
    # job ends on its own.
    #
    # Once a UTC day (owner decision on #3418, about $29 a month against the ~$60 ceiling): it starts when the
    # CI lane is green, and runs the paid tests only when no release.yml run passed them yet that day, or when a
    # person dispatched this run (not a restart; tools/llm-due.mjs, which also warns as spend:llm at $60 in a month). Not due,
    # the job passes with its test step skipped. Undo: drop the due step's condition.
    llm:
        name: LLM regression
        needs: [pick, ci]
        if: ${{ needs.pick.outputs.release == 'true' && needs.ci.result == 'success' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: full-run # GOOGLE_API_KEY
        permissions:
            actions: read # earlier release.yml runs' jobs, for tools/llm-due.mjs
            contents: read
        outputs:
            owner_item: ${{ steps.llm.outputs.owner_item }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.pick.outputs.sha }}

            - name: Decide whether the LLM regression tests are due today
              id: due
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node tools/llm-due.mjs

            - uses: pnpm/action-setup@v6
              if: steps.due.outputs.due == 'true'

            - uses: actions/setup-node@v7
              if: steps.due.outputs.due == 'true'
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              if: steps.due.outputs.due == 'true'
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # graphty-element's tests resolve the workspace packages it depends on from their dist folders.
            - name: Build graphty-element and its dependencies
              if: steps.due.outputs.due == 'true'
              run: pnpm exec nx run graphty-element:build

            - name: LLM regression tests
              id: llm
              if: steps.due.outputs.due == 'true'
              working-directory: graphty-element
              env:
                  VITE_LLM_REGRESSION_PROVIDER: google
                  VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
              run: |
                  set -uo pipefail
                  if [ -z "${VITE_GOOGLE_API_KEY}" ]; then
                      echo "owner_item=the GOOGLE_API_KEY repository secret is missing or empty" >> "$GITHUB_OUTPUT"
                      echo "::error::the GOOGLE_API_KEY repository secret is missing or empty, so the LLM regression tests cannot run; add it under Settings > Secrets and variables > Actions"
                      exit 1
                  fi
                  npx vitest run --project llm-regression 2>&1 | tee "$RUNNER_TEMP/llm-regression.log"
                  status=${PIPESTATUS[0]}
                  if [ "$status" != 0 ] && grep -q '\[llm-regression\] provider refused the account' "$RUNNER_TEMP/llm-regression.log"; then
                      echo "owner_item=Google refused the account behind GOOGLE_API_KEY (a rejected key, or no credit left)" >> "$GITHUB_OUTPUT"
                      echo "::error::Google refused the account behind GOOGLE_API_KEY (a rejected key, or no credit left): an owner item, not a code defect"
                  fi
                  exit "$status"

    # The version and major-bump dry run, a lane like the others (design/ci/channels-pipeline/channels.md, "A planned
    # major or a first publish"; #3455): versions the candidate locally as the version job will, then fails when
    # that commit publishes a major or a project's first version with no entry in the code-owned
    # release-approvals.json (tools/release-approvals.mjs). Its `held` output names those projects. Nothing leaves
    # this runner.
    version_dry_run:
        name: Version dry run
        needs: pick
        if: ${{ needs.pick.outputs.release == 'true' }}
        runs-on: ubuntu-24.04
        # A runaway guard, not a budget: on 2026-10-26 nx release version spent 13 of its 15 minutes before
        # printing its first project, and the lane was cancelled (#3630). Why it is that slow is #3631.
        timeout-minutes: 40
        permissions:
            contents: read
        outputs:
            held: ${{ steps.approvals.outputs.held }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.pick.outputs.sha }}
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Version the candidate and check majors and first publishes
              id: approvals
              env:
                  PACKAGES: ${{ inputs.packages }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  commit=$(tools/release-version.sh "$PACKAGES")
                  if [ -z "$commit" ]; then
                      # full and restart runs skip the pick job's releasability check: a commit with nothing to
                      # release (only ci, docs or chore since the last tags) passes this lane
                      if [ "${MODE:-}" = full ] || [ "${MODE:-}" = restart ] || [ "${MODE:-}" = candidate ]; then
                          echo "::notice::nothing releasable changed on ${SHA}"
                          exit 0
                      fi
                      echo "::error::nx versioned nothing on ${SHA}, although the pick job did"
                      exit 1
                  fi
                  node tools/release-approvals.mjs dry-run "$SHA" "$commit"

    # Coveralls' master coverage, from the CI run above (a push to master runs no test shards). Advisory: it
    # never holds the release.
    coverage:
        name: Coverage
        needs: [pick, ci]
        if: ${{ needs.ci.result == 'success' }}
        permissions:
            contents: read
            actions: read
        uses: ./.github/workflows/coverage.yml
        with:
            ref: ${{ needs.pick.outputs.sha }}
        secrets: inherit

    # A lane that ends red files (or updates) the "Full run red" issue at once (tools/full-run.mjs lane-red), not at
    # the verdict hours later, so a fix that references it restarts the run at once (tools/release-due.mjs cancels
    # this run first). One small job per lane, because a job starts only when all it needs have ended. No concurrency
    # group: GitHub keeps one pending job per group and cancels the rest, which would drop a third lane's filing.
    # Two lanes ending red together may both create the issue; fileRed closes the newer as a duplicate. The verdict
    # needs them all, so it finds the one issue they left.
    ci_red:
        name: Red early (CI)
        needs: [pick, ci]
        if: ${{ !cancelled() && needs.ci.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: ci
                  RESULT: ${{ needs.ci.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    t4_red:
        name: Red early (T4 GPU)
        needs: [pick, t4]
        if: ${{ !cancelled() && needs.t4.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: t4
                  RESULT: ${{ needs.t4.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    hosts_red:
        name: Red early (Hosts)
        needs: [pick, hosts]
        if: ${{ !cancelled() && needs.hosts.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: hosts
                  RESULT: ${{ needs.hosts.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    autosave_macos_red:
        name: Red early (Work protection (macOS))
        needs: [pick, autosave_macos]
        if: ${{ !cancelled() && needs.autosave_macos.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: autosave_macos
                  RESULT: ${{ needs.autosave_macos.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    audit_red:
        name: Red early (Security audit)
        needs: [pick, audit]
        if: ${{ !cancelled() && needs.audit.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: audit
                  RESULT: ${{ needs.audit.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    llm_red:
        name: Red early (LLM regression)
        needs: [pick, llm]
        if: ${{ !cancelled() && needs.llm.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: llm
                  RESULT: ${{ needs.llm.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  OWNER_ITEM: ${{ needs.llm.outputs.owner_item }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    version_dry_run_red:
        name: Red early (Version dry run)
        needs: [pick, version_dry_run]
        if: ${{ !cancelled() && needs.version_dry_run.result == 'failure' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.pick.outputs.forward == '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # the red issue
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: File the red issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  LANE: version_dry_run
                  RESULT: ${{ needs.version_dry_run.result }}
                  SHA: ${{ needs.pick.outputs.sha }}
                  OWNER_ITEM: ${{ needs.version_dry_run.outputs.held }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node tools/full-run.mjs lane-red

    # The same-commit re-capture (design/ci/channels-pipeline.md section 3, "Same-commit re-run, once"): on a fresh
    # runner, shoots again only the stories the CI lane's capture (ci.yml's visual job) found changed or new, and
    # uploads the run's one gated capture, visual-final-<project>-<attempt>: the CI lane's capture with each re-shot
    # story's verdict replaced (tools/channel/recapture.mjs). A story stays changed only when both shots draw the
    # same picture; one that matches its baseline the second time, or draws a third picture (unstable, never
    # approvable), is listed in its flaky.json, which the verdict files as flaky. The verdict, the gate, the review
    # page and the promotion read only visual-final-*. ci.yml's visual job and gate are untouched. The projects are
    # ci.yml's visual matrix: a test keeps the two lists equal.
    recapture:
        name: Re-capture (${{ matrix.project }})
        needs: [pick, ci]
        if: ${{ !cancelled() && needs.ci.result == 'success' && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read # the CI lane's capture and Storybook, artifacts of this run
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: compact-mantine
                      artifact: build-storybook-compact-mantine
                    - project: graphty-element
                      artifact: build-storybook-element
                    - project: layout
                      artifact: build-storybook-layout
                    - project: algorithms
                      artifact: build-storybook-algorithms
                    - project: graphty
                      artifact: build-storybook-app
                    - project: cytoscape-extensions
                      artifact: build-storybook-cytoscape-extensions
                    - project: graph-io-fidelity
                      artifact: build-storybook-graph-io-fidelity
                      storybook: graph-io/fidelity-stories/storybook-static
        env:
            PROJECT: ${{ matrix.project }}
            # a fix forward's re-test (the pick's source_run and capture): the CI lane shot nothing, so this job shoots
            # every story of a Storybook the fixes reach (WHOLE) and carries the others' final captures over from the
            # run that judged the head before (CARRY), shooting their changed and new stories again
            WHOLE: ${{ needs.pick.outputs.source_run != '' && contains(fromJSON(needs.pick.outputs.capture || '[]'), matrix.project) }}
            CARRY: ${{ needs.pick.outputs.source_run != '' && !contains(fromJSON(needs.pick.outputs.capture || '[]'), matrix.project) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.pick.outputs.sha }}

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Download the CI lane's capture
              if: ${{ needs.pick.outputs.source_run == '' }}
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-${{ matrix.project }}-*
                  path: ${{ runner.temp }}/first

            - name: Download the final capture of the run that judged the head before
              if: ${{ env.CARRY == 'true' }}
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-final-${{ matrix.project }}-*
                  path: ${{ runner.temp }}/carried
                  run-id: ${{ needs.pick.outputs.source_run }}
                  github-token: ${{ github.token }}

            # visual-final-<p>-<n> is read as the first capture, visual-<p>-<n>
            - name: Read the carried capture as the first one
              if: ${{ env.CARRY == 'true' }}
              run: |
                  mkdir -p "$RUNNER_TEMP/first"
                  for d in "$RUNNER_TEMP"/carried/visual-final-*; do
                      [ -d "$d" ] && mv "$d" "$RUNNER_TEMP/first/visual-${d##*/visual-final-}"
                  done
                  true

            # stories empty: nothing to shoot again; dir empty: the CI lane has no capture, and no final capture is
            # uploaded, so the verdict says which capture is missing
            - name: Plan the re-capture
              id: plan
              if: ${{ env.WHOLE != 'true' }}
              run: node tools/channel/recapture.mjs plan --project "$PROJECT" --captures "$RUNNER_TEMP/first"

            # Restore only, in this job and every cache step below: it runs code checked out at the picked commit
            # in a privileged dispatch, so it never writes a cache another run would restore (cache poisoning)
            - name: Restore this project's baseline images
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              uses: actions/cache/restore@v4
              with:
                  path: .git/lfs/objects
                  key: lfs-${{ matrix.project }}-${{ hashFiles(format('visual-baselines/{0}/**/*.png', matrix.project), 'visual-fonts/fonts/**') }}
                  restore-keys: lfs-${{ matrix.project }}-

            - name: Fetch this project's baseline images and the pinned fonts from Git LFS
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              run: git lfs pull --include "visual-baselines/${PROJECT}/**,visual-fonts/**"

            - uses: pnpm/action-setup@v6
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}

            - name: Install dependencies
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Read the Playwright version
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              id: playwright
              run: echo "version=$(node -p 'require("./visual-review/package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"

            - name: Restore the cached Playwright browsers
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              uses: actions/cache/restore@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            - uses: ./.github/actions/drop-microsoft-apt-source
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}

            # apt, not ./.github/actions/playwright-system-deps, whose .deb cache would be saved from this job
            - name: Install Chromium and its system packages
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              working-directory: visual-review
              run: pnpm exec playwright install --with-deps chromium

            - name: Download Storybook build
              if: ${{ steps.plan.outputs.stories != '' || env.WHOLE == 'true' }}
              uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.storybook || format('{0}/storybook-static', matrix.project) }}/

            # a fix forward reaches this Storybook: every story, as the CI lane's capture would have
            - name: Shoot every story
              if: ${{ env.WHOLE == 'true' }}
              continue-on-error: true
              run: pnpm exec visual-review capture --project "$PROJECT" --out "$RUNNER_TEMP/first/visual-${PROJECT}-${GITHUB_RUN_ATTEMPT}"

            - name: Plan the re-capture of that capture
              id: whole
              if: ${{ env.WHOLE == 'true' }}
              run: node tools/channel/recapture.mjs plan --project "$PROJECT" --captures "$RUNNER_TEMP/first"

            - name: Shoot the changed and new stories again
              if: ${{ steps.plan.outputs.stories != '' || steps.whole.outputs.stories != '' }}
              env:
                  STORIES: ${{ steps.plan.outputs.stories || steps.whole.outputs.stories }}
              run: pnpm exec visual-review capture --project "$PROJECT" --out "$RUNNER_TEMP/second" --stories "$STORIES"

            - name: Build the final capture
              if: ${{ steps.plan.outputs.dir != '' || steps.whole.outputs.dir != '' }}
              env:
                  FIRST: ${{ steps.plan.outputs.dir || steps.whole.outputs.dir }}
                  SECOND: ${{ (steps.plan.outputs.stories != '' || steps.whole.outputs.stories != '') && format('{0}/second', runner.temp) || '' }}
              run: node tools/channel/recapture.mjs merge --first "$FIRST" --second "$SECOND" --out "$RUNNER_TEMP/final"

            - name: Upload the final capture
              if: ${{ steps.plan.outputs.dir != '' || steps.whole.outputs.dir != '' }}
              uses: actions/upload-artifact@v7
              with:
                  name: visual-final-${{ matrix.project }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/final/
                  retention-days: 30

    # A full run's one ending (channels design, sections 5 and 6): every lane's result and the screenshot captures
    # make one state, written to the results store (tools/full-run.mjs verdict). Red files or updates the "Full run
    # red" issue, dispatches bisect.yml once (with GITHUB_TOKEN's actions: write), and is announced; green closes
    # that issue, but only from a green commit whose history holds the red one. !cancelled(), so an abandoned or
    # timed-out lane is judged too (anything but success is red), while a run someone cancelled records nothing:
    # a red record would make the next slot skip that commit.
    # ponytail: one bisect dispatch here, after every lane; a ci-lane dispatch the moment ci.yml ends red would
    # start it about 45 minutes earlier.
    verdict:
        name: Verdict
        needs:
            [
                pick,
                ci,
                t4,
                hosts,
                autosave_macos,
                audit,
                llm,
                version_dry_run,
                recapture,
                candidate_site,
                ci_red,
                t4_red,
                hosts_red,
                autosave_macos_red,
                audit_red,
                llm_red,
                version_dry_run_red,
            ]
        # a pick that failed is judged too (red, its own lane), so a broken slot files the red issue
        if: ${{ !cancelled() && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && (needs.pick.outputs.release == 'true' || (needs.pick.result != 'success' && needs.pick.result != 'skipped')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: release # Pushover
        permissions:
            actions: write # dispatch bisect.yml; read the captures
            contents: read
            issues: write # the red issue
            id-token: write # the results store
        outputs:
            state: ${{ steps.verdict.outputs.state }}
            promote: ${{ steps.promote.outputs.promote }}
            screenshots: ${{ steps.gate.outputs.screenshots }}
            deferred: ${{ steps.verdict.outputs.deferred }}
            hold: ${{ steps.verdict.outputs.hold }}
        env:
            GH_TOKEN: ${{ github.token }}
            SHA: ${{ needs.pick.outputs.sha || github.sha }}
            GOOD: ${{ needs.pick.outputs.good }}
            RUN_ID: ${{ github.run_id }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            # Full history without file contents: a green verdict closes the red issue only from a later commit,
            # and the screenshot gate below reads the baselines' LFS pointers and the approvals from git and checks
            # an approval's commit is an ancestor.
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      tools
                      visual-review
                  fetch-depth: 0
                  filter: blob:none

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            # The run's one gated capture is the re-capture job's visual-final-<project>-<attempt>, renamed to the
            # visual-<project>-<attempt> the judge and the gate read; a project without one is missing, so red.
            - name: Download the final screenshot captures
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-final-*
                  path: ${{ runner.temp }}/final

            # verdict-<attempt>.json of earlier attempts: the lanes a re-run attempt finds green again are flaky
            - name: Download the earlier attempts' verdicts
              if: ${{ github.run_attempt > 1 }}
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: verdict-*
                  path: ${{ runner.temp }}/verdicts
                  merge-multiple: true

            - name: Judge the run
              id: verdict
              # a held head's site that failed to assemble (candidate_site) counts against the CI lane, whose builds it
              # packs: the one same-commit re-run assembles it again, and the head never promotes without one
              env:
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  CAPTURES: ${{ runner.temp }}/visual
                  LLM_OWNER_ITEM: ${{ needs.llm.outputs.owner_item }}
                  VERSION_HELD: ${{ needs.version_dry_run.outputs.held }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  HELD: ${{ needs.pick.outputs.held }}
                  FORWARD: ${{ needs.pick.outputs.forward }}
                  RECORDS: ${{ runner.temp }}/verdicts
                  RECORD: ${{ runner.temp }}/record/verdict-${{ github.run_attempt }}.json
                  LANES: >-
                      {"pick": "${{ needs.pick.result }}", "ci": "${{ needs.candidate_site.result == 'failure' && 'failure' || needs.ci.result }}", "llm": "${{ needs.llm.result }}", "t4": "${{ needs.t4.result }}",
                      "hosts": "${{ needs.pick.outputs.hosts == 'false' && 'unaffected' || needs.hosts.result }}",
                      "autosave_macos": "${{ needs.pick.outputs.macos == 'false' && 'unaffected' || needs.autosave_macos.result }}",
                      "audit": "${{ needs.audit.result }}", "version_dry_run": "${{ needs.version_dry_run.result }}",
                      "recapture": "${{ needs.recapture.result }}"}
              run: |
                  set -euo pipefail
                  mkdir -p "$CAPTURES" "$(dirname "$RECORD")"
                  for d in "$RUNNER_TEMP"/final/visual-final-*; do
                      [ -d "$d" ] && mv "$d" "$CAPTURES/visual-${d##*/visual-final-}"
                  done
                  node tools/full-run.mjs verdict

            # what this attempt decided, for a re-run attempt (flaky lanes) and for release-rerun.yml (deferred)
            - name: Keep this attempt's verdict
              uses: actions/upload-artifact@v7
              with:
                  name: verdict-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/record/verdict-${{ github.run_attempt }}.json
                  retention-days: 30

            # A deciding run that is not green-clean holds its commit while nothing is held (channels-pipeline.md
            # section 3): the results store's hold and the "Nightly held on <sha12>" issue here, branch
            # channel/candidate in the candidate_branch job (the deploy key). A verdict on the held head comments on
            # that issue. The store is what the next slot reads, so a failed store write fails the job.
            - name: Hold the candidate
              id: hold
              if: ${{ steps.verdict.outputs.hold == 'start' || steps.verdict.outputs.hold == 'update' }}
              env:
                  HOLD: ${{ steps.verdict.outputs.hold }}
                  STATE: ${{ steps.verdict.outputs.state }}
                  WHAT: ${{ steps.verdict.outputs.what }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: node tools/channel/hold.mjs "$HOLD"

            # A green-clean candidate reaches nightly only when its visual-baselines/ tree equals nightly's or
            # carries the owner's passkey-signed approval of exactly that tree (tools/channel/screenshot-gate.sh,
            # master's tip's gate run unchanged on this run's captures). A refusal is a decision (outcome=failure);
            # an error fails the job, so re-running its failed jobs retries the gate.
            - name: Check the candidate's screenshots against nightly's
              id: gate
              if: ${{ steps.verdict.outputs.state == 'green-clean' }}
              env:
                  HEAD_SHA: ${{ env.SHA }}
                  CAPTURES: ${{ runner.temp }}/visual
              run: tools/channel/screenshot-gate.sh

            # Whether the candidate promotes now: green-clean, the gate passed, and no publish hold open (a nightly
            # promotion of a new version set waits for the hold to clear; channels section 11). The why goes into
            # the run's summary; the age:nightly alarm reports a wait that lasts.
            - name: Decide the nightly promotion
              id: promote
              env:
                  STATE: ${{ steps.verdict.outputs.state }}
                  GATE: ${{ steps.gate.outputs.outcome }}
                  FIRST: ${{ steps.gate.outputs.first }}
                  HELD: ${{ needs.pick.outputs.held }}
              run: node tools/channel/nightly.mjs decide

            # green-images too: it waits for the owner's screenshot review, and without this the run ends green
            # while nightly silently stays put (#3698)
            # an attempt-1 red that waits for its same-commit re-run announces nothing: the re-run decides
            - name: Announce a red run, an owner item or changed screenshots
              if: ${{ steps.verdict.outputs.deferred != 'true' && (steps.verdict.outputs.state == 'red' || steps.verdict.outputs.state == 'owner-item' || steps.verdict.outputs.state == 'green-images') }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
                  STATE: ${{ steps.verdict.outputs.state }}
                  WHAT: ${{ steps.verdict.outputs.what }}
                  ISSUE: ${{ steps.verdict.outputs.issue }}
                  BISECT: ${{ steps.verdict.outputs.bisect }}
              run: |
                  node tools/release-status.mjs "$STATE" --sha "$SHA" --what "$WHAT" --issue "$ISSUE" \
                      --bisect "$BISECT" --attempt "$GITHUB_RUN_ATTEMPT" --run "$RUN_URL"

    # A held green-images head promotes later, after the owner's approval, from this run's builds (the resume job's
    # run uses them): CI keeps its own for a day, so they are kept here for 30 days, as the version job keeps a
    # promoted candidate's.
    keep_builds:
        name: Keep the held candidate's builds
        needs: [pick, verdict]
        if: ${{ !cancelled() && needs.verdict.outputs.state == 'green-images' && (needs.verdict.outputs.hold == 'start' || needs.verdict.outputs.hold == 'update') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            actions: read
        steps:
            - name: Download the tested commit's builds
              uses: actions/download-artifact@v8
              with:
                  pattern: "build-{graph-format,graph-io,webgpu-graph-algorithms,graph-samples,algorithms,layout,cytoscape-extensions,graphty,graphty-element,remote-logger,compact-mantine}"
                  path: ${{ runner.temp }}/builds

            - name: Keep the builds for the promotion after approval
              uses: actions/upload-artifact@v7
              with:
                  name: release-builds-${{ needs.pick.outputs.sha }}
                  path: ${{ runner.temp }}/builds
                  retention-days: 30
                  if-no-files-found: error
                  overwrite: true

    # A held head past its commit (a fix forward) has no master build, so no deploy-pages.yml run assembled its site:
    # this run assembles site-<head> from its own CI call's builds, the way deploy-pages.yml does for master, and keeps
    # it for the site job (now, or after the owner's screenshot approval). It deploys nothing.
    candidate_site:
        name: Assemble the held head's site
        needs: [pick, ci]
        if: ${{ !cancelled() && needs.pick.outputs.forward != '' && needs.ci.result == 'success' }}
        # deploy-pages.yml asks for these (its deploy job, which a call skips); a called workflow gets no more
        permissions:
            contents: read
            pages: write
            id-token: write
            actions: read
        uses: ./.github/workflows/deploy-pages.yml
        with:
            sha: ${{ needs.pick.outputs.sha }}
            run_id: ${{ format('{0}', github.run_id) }}

    # Promote after approval (design/ci/channels-pipeline.md section 5): the pick found the owner's approval P (his
    # accept-only pull request's head) of a green-images head H (tools/channel/resume.mjs). The captures of the run
    # that judged H (its visual-final-*, kept 30 days) are first read against P's baselines: a story whose captured PNG
    # is P's baseline byte for byte (the accept commit copies it) is unchanged, as a capture of P would find it
    # (tools/channel/recapture.mjs accepted). The unchanged screenshot gate then judges them with P's signed approval;
    # then the version, land, publish and site jobs promote P. A gate refusal promotes nothing and records `rejected` on H
    # with a comment on the hold issue, so no later slot tries the same approval again; an open publish hold only
    # waits (a full slot catches up once it closes).
    resume:
        name: Gate the approved candidate
        needs: pick
        if: ${{ needs.pick.outputs.resume == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            actions: read # the judging run's captures
            contents: read
            issues: write # the hold issue
            id-token: write # the results store
        outputs:
            promote: ${{ steps.promote.outputs.promote }}
            screenshots: ${{ steps.gate.outputs.screenshots }}
        env:
            GH_TOKEN: ${{ github.token }}
            SHA: ${{ needs.pick.outputs.tested }}
            ACCEPT: ${{ needs.pick.outputs.sha }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      tools
                      visual-review
                  fetch-depth: 0
                  filter: blob:none

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: Download the judging run's final screenshot captures
              uses: actions/download-artifact@v8
              with:
                  pattern: visual-final-*
                  path: ${{ runner.temp }}/final
                  run-id: ${{ needs.pick.outputs.source_run }}
                  github-token: ${{ github.token }}

            # renamed to the visual-<project>-<attempt> the gate reads, as the verdict job does
            - name: Check the approved screenshots against nightly's
              id: gate
              env:
                  HEAD_SHA: ${{ needs.pick.outputs.sha }}
                  CAPTURES: ${{ runner.temp }}/visual
              run: |
                  set -euo pipefail
                  mkdir -p "$CAPTURES"
                  for d in "$RUNNER_TEMP"/final/visual-final-*; do
                      [ -d "$d" ] && mv "$d" "$CAPTURES/visual-${d##*/visual-final-}"
                  done
                  node tools/channel/recapture.mjs accepted --captures "$CAPTURES" --head "$HEAD_SHA"
                  tools/channel/screenshot-gate.sh

            - name: Decide the nightly promotion
              id: promote
              env:
                  STATE: approved
                  GATE: ${{ steps.gate.outputs.outcome }}
                  HELD: ${{ needs.pick.outputs.held }}
              run: node tools/channel/nightly.mjs decide

            - name: Record a refused approval
              if: ${{ steps.gate.outputs.outcome == 'failure' }}
              env:
                  STATE: rejected
                  TESTED: ${{ needs.pick.outputs.tested }}
                  WHY: ${{ steps.promote.outputs.why }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: node tools/channel/resume.mjs record

    # The owner ends a held nightly candidate without promoting it (design/ci/channels-pipeline.md section 3):
    # `gh workflow run release.yml --ref master -f mode=abandon`. Environment production, so it waits for the owner's
    # approval in GitHub whoever dispatched it, as a legacy release does; then the abandon job clears the results
    # store's hold and closes the "Nightly held on" issue, and candidate_branch deletes branch channel/candidate.
    # The next slot tests master's newest commit again.
    abandon_approve:
        name: Owner approval (abandon the held candidate)
        if: ${{ inputs.mode == 'abandon' && github.ref == 'refs/heads/master' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: production # the owner's approval
        permissions: {}
        steps:
            - run: echo "the owner approved abandoning the held nightly candidate"

    abandon:
        name: Abandon the held candidate
        needs: abandon_approve
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # close the hold issue
            id-token: write # the results store
        outputs:
            base: ${{ steps.end.outputs.base }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: End the hold
              id: end
              env:
                  GH_TOKEN: ${{ github.token }}
                  WHY: abandoned by the owner
                  ABANDONED: "true"
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: node tools/channel/hold.mjs end

    # Branch channel/candidate (design/ci/channels-pipeline.md section 3), with the deploy key: pushed at the commit a
    # deciding verdict holds, deleted when the owner abandons the hold (land deletes it in its own push when the held
    # candidate promotes). It runs git only. The results store's hold is what the slots read, so a refused push (the
    # deploy-key ruleset does not cover channel/candidate yet: an owner item) only warns.
    candidate_branch:
        name: Move branch channel/candidate
        needs: [pick, verdict, abandon]
        if: ${{ !cancelled() && (needs.verdict.outputs.hold == 'start' || needs.abandon.result == 'success') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: release # the deploy key
        permissions:
            contents: read # the push goes over SSH with the deploy key, not with this token
        env:
            SHA: ${{ needs.pick.outputs.sha }}
            ABANDON: ${{ needs.abandon.result == 'success' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

            - name: Push or delete channel/candidate
              run: |
                  if [ "$ABANDON" = true ]; then
                      ref=:refs/heads/channel/candidate
                  else
                      git fetch --quiet origin "$SHA"
                      ref="${SHA}:refs/heads/channel/candidate"
                  fi
                  git push --no-verify origin "$ref" ||
                      echo "::warning::could not push ${ref}: add channel/candidate to the deploy-key ruleset (owner item); the hold stands in the results store"

    # Anything red before the release lands holds the whole release: nothing is pushed to master and nothing is
    # published. This job opens (or retitles and comments on) the open train hold, a "Release held: <what> failed
    # on <sha>" issue, which githerd turns into a fix job; an open publish hold ("Release held: publish failed") is
    # never touched. Scheduled trains skip while either is open; the train hold closes when a later train lands.
    # A train attempt ends with a landed release or with this issue, never with neither. So the condition is "the
    # release did not land", never a list of the results that count as red: a job's result is not only failure or
    # cancelled. On 2026-10-07 (run 37635516841) a GitHub Actions outage left CI's "All Checks Pass" queued for
    # good, its result "abandoned", the CI call ended neither failure nor cancelled, and a list of those two
    # skipped this job: the attempt ended red with no pull request and no issue. always(), so a cancelled run
    # still reports; a pick that failed (not one that skipped by design) is held too. A land job that pushed and
    # then failed a later step (closing the held issue) did not hold anything: the release went ahead, so this job
    # does not run, the publish job runs, and the land job reports that failure itself. A shadow run lands
    # nothing by design, so it reports only a version job that did not pass; and the owner declining the
    # production approval of a legacy run is his decision, not a failure, so it reports nothing.
    #
    # A shadow run opens no issue: it comments once on #3418 (the channels pipeline) and announces nothing.
    held:
        name: Hold the release
        needs:
            [pick, ci, t4, hosts, autosave_macos, audit, llm, version_dry_run, verdict, resume, version, approve, land]
        if: ${{ always() && (((inputs.mode == 'shadow' || inputs.mode == 'legacy') && ((needs.pick.result != 'success' && needs.pick.result != 'skipped') || (needs.pick.outputs.release == 'true' && (needs.version.result != 'success' || (needs.approve.result == 'success' && needs.land.outputs.pushed != 'true'))))) || ((inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.verdict.outputs.promote == 'true' && (needs.version.result != 'success' || needs.land.outputs.pushed != 'true')) || (needs.pick.outputs.resume == 'true' && needs.resume.outputs.promote == 'true' && (needs.version.result != 'success' || needs.land.outputs.pushed != 'true'))) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Pushover for a legacy hold's or a failed nightly promotion's announcement; a shadow run announces nothing,
        # so it takes no environment
        environment: ${{ inputs.mode != 'shadow' && 'release' || '' }}
        permissions:
            actions: read
            contents: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            SHA: ${{ needs.pick.outputs.sha || github.sha }}
            PICK_RESULT: ${{ needs.pick.result }}
            CI_RESULT: ${{ needs.ci.result }}
            T4_RESULT: ${{ needs.t4.result }}
            HOSTS_RESULT: ${{ needs.hosts.result }}
            AUTOSAVE_MACOS_RESULT: ${{ needs.autosave_macos.result }}
            AUDIT_RESULT: ${{ needs.audit.result }}
            LLM_RESULT: ${{ needs.llm.result }}
            LLM_OWNER_ITEM: ${{ needs.llm.outputs.owner_item }}
            VERSION_DRY_RUN_RESULT: ${{ needs.version_dry_run.result }}
            VERSION_RESULT: ${{ needs.version.result }}
            LAND_RESULT: ${{ needs.land.result }}
            # a nightly promotion's failure, a full run's or one after the owner's approval: its own issue
            NIGHTLY: ${{ inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate' || inputs.mode == 'promote-nightly' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      tools/release-held.sh
                      tools/gpu-runner-lost.sh
                      tools/release-status.mjs
                  sparse-checkout-cone-mode: false

            - name: Open or update the held-release issue
              id: hold
              run: |
                  set -euo pipefail
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  # Every job the train needs that did not succeed, by its result: failure, cancelled, or one GitHub
                  # gives no name in its docs (abandoned). Skipped is a consequence (versioning skips when a lane
                  # did not pass), never a cause.
                  what=()
                  llm_lane="LLM regression"
                  [ -z "$LLM_OWNER_ITEM" ] || llm_lane="LLM regression (owner item: Google account)"
                  results=()
                  for lane in "candidate pick=$PICK_RESULT" "CI=$CI_RESULT" "T4 GPU=$T4_RESULT" "Hosts=$HOSTS_RESULT" \
                      "work protection (macOS)=$AUTOSAVE_MACOS_RESULT" "security audit=$AUDIT_RESULT" "$llm_lane=$LLM_RESULT" "version dry run=$VERSION_DRY_RUN_RESULT" "versioning=$VERSION_RESULT" \
                      "landing on master=$LAND_RESULT"; do
                      results+=("${lane%%=*} ${lane#*=}")
                      case "${lane#*=}" in success | skipped) ;; *) what+=("${lane%%=*}") ;; esac
                  done
                  [ "${#what[@]}" != 0 ] || what+=("release train")
                  # The first attempt failed only because a spot runner was taken away (every failed job says its
                  # runner was lost): release-rerun.yml re-runs this run's failed jobs once when it
                  # ends, with the same test (tools/gpu-runner-lost.sh), so there is nothing to hold yet. A second
                  # loss, or any real failure beside the loss, opens the issue below.
                  if [ "$GITHUB_RUN_ATTEMPT" = 1 ] && tools/gpu-runner-lost.sh "$GITHUB_RUN_ID" 1; then
                      echo "::warning::release attempt on ${SHA} lost its T4 runner (a spot reclaim); its failed jobs are re-run once, no issue opened"
                      echo "reclaimed=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  what=$(printf '%s, ' "${what[@]}"); what=${what%, }
                  echo "what=${what}" >> "$GITHUB_OUTPUT"
                  title="Release held: ${what} failed on ${SHA:0:7}"
                  [ "$MODE" != shadow ] || title="Shadow release run: ${what} failed on ${SHA:0:7}"
                  # a nightly promotion's own issue, not a train hold: scheduled full runs keep going
                  [ "${NIGHTLY:-}" != true ] || title="Nightly promotion failed: ${what} on ${SHA:0:7}"
                  # Each job of this attempt that did not pass: failed, cancelled, or never finished (a job GitHub
                  # never ran stays queued with no conclusion: "none" here, as read collapses an empty tab field).
                  # Not this job, and not the advisory Coverage job.
                  jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
                      --jq '.jobs[] | select(.name != "Hold the release" and (.name | startswith("Coverage") | not)) | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.id)\t\(.conclusion // "none")\t\(.name)\t\(.status)\t\([.steps[] | select(.conclusion == "failure") | .name] | join("; "))"') ||
                      jobs="" # the issue matters more than its details
                  {
                      echo "The release train failed on ${SHA} (${what}): ${run_url}"
                      echo
                      echo "Results: $(printf '%s, ' "${results[@]}" | sed 's/, $//')"
                      [ -z "$jobs" ] || echo "Jobs that did not pass: $(cut -f3 <<<"$jobs" | paste -sd, - | sed 's/,/, /g')"
                      echo
                      if [ "$MODE" = legacy ]; then
                          echo "Nothing was pushed to master and nothing was published. The whole release is held until this is fixed on master. Scheduled runs skip while this issue is open. Name this issue in the fix without closing it (\`Refs #<this issue>\`), then dispatch the release again (\`gh workflow run release.yml --ref master -f mode=legacy\`). A legacy run that lands releases everything at once and closes this issue; one that fails again comments here."
                      elif [ "$MODE" = shadow ]; then
                          echo "A shadow run: it never pushes or publishes, and it holds nothing (release.yml, mode shadow)."
                      else
                          echo "The candidate was cleared for nightly (a green-clean verdict, or the owner's approval of its screenshots), but versioning or landing did not finish: nothing reached master, npm \`next\` did not move and channel/nightly did not move. Re-run the failed jobs of the run to retry."
                      fi
                      if [ -n "$LLM_OWNER_ITEM" ]; then
                          echo
                          echo "The LLM regression job did not fail on code: ${LLM_OWNER_ITEM}. There is no code to fix: it is an owner item. Fund the Google account (its Gemini API billing) or replace the GOOGLE_API_KEY repository secret, then \`gh workflow run release.yml --ref master\` retries at once (a dispatch runs despite this issue), or close this issue and the next scheduled train retries."
                      fi
                      if [ "$T4_RESULT" = failure ]; then
                          echo
                          echo "If the T4 job was refused or lost its runner (machine.dev: insufficient balance, concurrent runner limit, \"received a shutdown signal\", \"lost communication\"; such a job has no log below), there is no code to fix: it is an owner item. Restore the machine.dev capacity, then \`gh workflow run release.yml --ref master\` retries at once (a dispatch runs despite this issue), or close this issue and the next scheduled train retries."
                      fi
                      if grep -q $'^[0-9]*\tnone\t' <<<"$jobs" || [[ " ${results[*]} " != *" failure "* ]]; then
                          echo
                          echo "A job that never finished, or a lane that was cancelled or abandoned rather than failed, is usually GitHub Actions itself (an outage, a runner never assigned, a person cancelling the run), not the code: check https://www.githubstatus.com for the run's time. If nothing failed on its own, re-run the run's failed jobs (\`gh run rerun ${GITHUB_RUN_ID} --failed\`) or \`gh workflow run release.yml --ref master\` (a dispatch runs despite this issue)."
                      fi
                      echo
                      echo "What did not pass (each job's failed steps, then its FAIL and error lines):"
                      echo
                      echo '```'
                      [ -n "$jobs" ] || echo "(the run's jobs could not be read; open the run)"
                      while IFS=$'\t' read -r id conclusion name status steps; do
                          [ -n "$id" ] || continue
                          if [ "$conclusion" = none ]; then
                              echo "${name}: never finished (still ${status}): GitHub Actions did not run it"
                              continue
                          fi
                          echo "${name} (${conclusion}): ${steps}"
                          # a job the provider refused (no balance, no runner) has no log
                          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}/logs" 2>/dev/null |
                              sed 's/^[0-9TZ:.-]* //' | grep -E '(^| )(FAIL|##\[error\])' | head -60 || true
                      done <<<"$jobs"
                      echo '```'
                  } > "$RUNNER_TEMP/body.md"
                  if [ "${NIGHTLY:-}" = true ]; then
                      open=$(tools/release-held.sh open "$title" "$RUNNER_TEMP/body.md" "Nightly promotion failed:")
                      echo "issue=${open}" >> "$GITHUB_OUTPUT"
                      echo "::error::nightly promotion: ${what} failed on ${SHA}; nothing was pushed or published (issue ${open})"
                  elif [ "$MODE" = legacy ]; then
                      open=$(tools/release-held.sh open "$title" "$RUNNER_TEMP/body.md")
                      echo "issue=${open}" >> "$GITHUB_OUTPUT"
                      echo "::error::release held: ${what} failed on ${SHA}; nothing was pushed or published (issue ${open})"
                  else
                      { echo "**${title}**"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/comment.md"
                      gh issue comment 3418 --body-file "$RUNNER_TEMP/comment.md"
                      echo "::error::shadow release run: ${what} failed on ${SHA}; commented on #3418"
                  fi

            # The owner hears of every held legacy attempt (tools/release-status.mjs): always(), so a failure of the
            # step above is announced too. A lost spot runner is not an outcome: its failed jobs are re-run, and that
            # attempt announces its own result. A shadow run is not announced.
            - name: Announce the held release
              if: ${{ always() && steps.hold.outputs.reclaimed != 'true' && inputs.mode != 'shadow' }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
                  WHAT: ${{ steps.hold.outputs.what }}
                  ISSUE: ${{ steps.hold.outputs.issue }}
              run: |
                  outcome=held
                  [ "${NIGHTLY:-}" != true ] || outcome=nightly-held
                  node tools/release-status.mjs "$outcome" --sha "$SHA" --what "$WHAT" --issue "$ISSUE" \
                      --attempt "$GITHUB_RUN_ATTEMPT" --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

    # Versions the tested commit, only after the full suite, the T4, Hosts, work protection on macOS, the audit and the LLM regression tests
    # all passed on it. Nothing leaves this job but artifacts: the land job pushes, the publish job publishes. It
    # holds no deploy key, because it runs the repository's install scripts and nx.
    # A nightly promotion (full or restart) runs it only when the verdict job decided to promote.
    version:
        name: Version the release
        needs: [pick, ci, t4, hosts, autosave_macos, audit, llm, version_dry_run, verdict, resume]
        # a promotion after approval (resume) versions the owner's approval, which no lane of this run tested
        if: ${{ !cancelled() && ((needs.pick.outputs.release == 'true' && (((inputs.mode == 'shadow' || inputs.mode == 'legacy') && needs.ci.result == 'success' && needs.t4.result == 'success' && needs.hosts.result == 'success' && needs.autosave_macos.result == 'success' && needs.audit.result == 'success' && needs.llm.result == 'success' && needs.version_dry_run.result == 'success') || ((inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate') && needs.verdict.outputs.promote == 'true'))) || (needs.pick.outputs.resume == 'true' && needs.resume.outputs.promote == 'true')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            actions: read
            contents: read
        outputs:
            commit: ${{ steps.version.outputs.commit }}
            tags: ${{ steps.version.outputs.tags }}
        env:
            SHA: ${{ needs.pick.outputs.sha }}
        steps:
            # The version commit must sit on the tree the lanes tested.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.pick.outputs.sha }}
                  fetch-depth: 0

            # The builds of the CI call above, kept for 30 days under the commit's name, so a re-run of a failed
            # publish (gh run rerun <id> --failed) still finds them (CI keeps its own for a day).
            - name: Download the tested commit's builds
              if: ${{ needs.pick.outputs.resume != 'true' }}
              uses: actions/download-artifact@v8
              with:
                  pattern: "build-{graph-format,graph-io,webgpu-graph-algorithms,graph-samples,algorithms,layout,cytoscape-extensions,graphty,graphty-element,remote-logger,compact-mantine}"
                  path: ${{ runner.temp }}/builds

            # a promotion after approval: the builds the judging run kept for its held head (its keep_builds job);
            # the approval changes only visual-baselines/ and visual-review-approvals/, so they are its builds too
            - name: Download the approved candidate's builds
              if: ${{ needs.pick.outputs.resume == 'true' }}
              uses: actions/download-artifact@v8
              with:
                  name: release-builds-${{ needs.pick.outputs.tested }}
                  path: ${{ runner.temp }}/builds
                  run-id: ${{ needs.pick.outputs.source_run }}
                  github-token: ${{ github.token }}

            - name: Keep the builds for the publish job
              uses: actions/upload-artifact@v7
              with:
                  name: release-builds-${{ needs.pick.outputs.sha }}
                  path: ${{ runner.temp }}/builds
                  retention-days: 30
                  if-no-files-found: error
                  overwrite: true

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Version and changelogs only, as one commit (tools/release-version.sh). A package listed in
            # release-hold.json is neither versioned nor published -- not even as a dependent of a package that is
            # released. An ad hoc release with `packages` holds every other project too. To stop one package, add
            # it to release-hold.json; never disable this workflow (CLAUDE.md, "Release versioning"). nx tags,
            # pushes and creates nothing here: the land job pushes the commit with its tags.
            - name: Version the packages
              id: version
              env:
                  PACKAGES: ${{ inputs.packages }}
                  # the changelog renderer looks up commit authors' GitHub handles
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  commit=$(tools/release-version.sh "$PACKAGES")
                  if [ -z "$commit" ]; then
                      # a nightly promotion skips the pick job's releasability check: a candidate with nothing to
                      # version (only ci, docs or chore commits) still moves nightly's site, and npm next stays
                      if [ "$MODE" = full ] || [ "$MODE" = restart ] || [ "$MODE" = candidate ] || [ "$MODE" = promote-nightly ]; then
                          echo "::notice::nothing to version on ${SHA}: nightly moves its site only"
                          exit 0
                      fi
                      # the pick job versioned this same commit and found something to release
                      echo "::error::nx versioned nothing on ${SHA}, although the pick job did"
                      exit 1
                  fi
                  node tools/release-diff.mjs "$SHA" "$commit"
                  tags=$(git log -1 --format=%b "$commit" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/\1@\2/p' | paste -sd, -)
                  [ -n "$tags" ] || { echo "::error::${commit} lists no released project"; exit 1; }
                  git branch release "$commit"
                  git bundle create "$RUNNER_TEMP/release.bundle" release "^${SHA}"
                  { echo "commit=${commit}"; echo "tags=${tags}"; } >> "$GITHUB_OUTPUT"

            # The version commit itself, so the land job pushes exactly this commit (the tags name it, and the
            # publish job checks it out) without running nx again.
            - name: Keep the version commit for the land job
              if: ${{ steps.version.outputs.commit != '' }}
              uses: actions/upload-artifact@v7
              with:
                  name: release-commit-${{ needs.pick.outputs.sha }}
                  path: ${{ runner.temp }}/release.bundle
                  retention-days: 30
                  if-no-files-found: error
                  overwrite: true

    # A legacy run's one gate before anything leaves: the owner approves this job's deployment to environment
    # `production` in GitHub. A shadow run skips it, and so skips land and publish. The step refuses when
    # production has no required reviewer (an environment GitHub created on first use asks nobody), so a missing
    # setting can never publish unasked.
    approve:
        name: Owner approval (production)
        needs: [pick, version]
        if: ${{ inputs.mode == 'legacy' && needs.version.result == 'success' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: production
        permissions:
            actions: read
        steps:
            - name: Check that production asks the owner
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAGS: ${{ needs.version.outputs.tags }}
              run: |
                  set -euo pipefail
                  reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
                      --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
                  [ "$reviewers" -gt 0 ] || {
                      echo "::error::environment production has no required reviewer, so nothing asked the owner; add him as its reviewer and dispatch again"
                      exit 1
                  }
                  echo "the owner approved the release of ${TAGS}"

    # Puts the release on master: the version commit, merged into master's current tip, and one tag per package,
    # in one atomic push with the release deploy key (master's ruleset lets a deploy key push without a pull
    # request; GITHUB_TOKEN cannot be exempted). It runs git and the repository's own dependency-free scripts only:
    # no install, no nx, so no third-party code ever runs beside the key.
    land:
        name: Land the release on master
        needs: [pick, version, approve]
        # legacy: after the owner's production approval; a nightly promotion: once the version job passed
        if: ${{ !cancelled() && needs.version.result == 'success' && (needs.approve.result == 'success' || inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate' || inputs.mode == 'promote-nightly') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: release # the deploy key
        permissions:
            actions: read
            contents: read # the push goes over SSH with the deploy key, not with this token
            issues: write # close the train hold
        outputs:
            pushed: ${{ steps.push.outputs.pushed }}
        env:
            GH_TOKEN: ${{ github.token }}
            SHA: ${{ needs.pick.outputs.sha }}
            COMMIT: ${{ needs.version.outputs.commit }}
            TAGS: ${{ needs.version.outputs.tags }}
            HELD: ${{ needs.pick.outputs.held }}
            # the commit the lanes tested and whose site deploys: the candidate itself, or after the owner's approval
            # the candidate the approval (SHA) is made on
            TESTED: ${{ needs.pick.outputs.tested || needs.pick.outputs.sha }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: master
                  fetch-depth: 0
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

            - name: Download the version commit
              if: ${{ needs.version.outputs.commit != '' }}
              uses: actions/download-artifact@v8
              with:
                  name: release-commit-${{ needs.pick.outputs.sha }}
                  path: ${{ runner.temp }}/release

            # Where the tags point, and why: on the version commit itself, the tested commit plus its version
            # fields and changelogs -- exactly the source npm ships -- never on the merge, whose tree also holds
            # whatever reached master after the candidate was picked and was never tested or published. The merge
            # makes them reachable from master, which is all nx needs: next time `nx release version` finds each
            # package's last tag with `git tag --merged`, reads its version from the tag, and bumps it from the
            # conventional commits in tag..HEAD. Those are exactly the commits not in this release: the ones that
            # reached master after the candidate (the merge's first parent brings them in, and they are not
            # ancestors of the tag) and everything after the merge. The merge's own subject is a chore, which bumps
            # nothing, and starts "chore(release): publish" like the version commit, the pattern githerd reads a
            # release by. When master has not moved, the merge still records the release as one commit on
            # master's first-parent line, as the release pull request's merge commit did.
            #
            # The merge conflicts only when a commit on master since the candidate edited a version field or a
            # changelog line this release also writes: a hold with that message, nothing pushed or published.
            # A push that loses a race with a new master commit is merged again on the new tip, never forced.
            # Re-run after a push that landed: master already holds the version commit, and nothing is pushed.
            - name: Push the version commit and its tags to master
              id: push
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  refs=()
                  # A nightly's merge has its own subject, so deploy-pages.yml (which deploys graphty.app from a
                  # "chore(release): publish ... onto master" merge) never takes a nightly for a production release.
                  subject="chore(release): publish ${TAGS//,/, } onto master"
                  [ "$DIST_TAG" != next ] || subject="chore(release): nightly ${TAGS//,/, } onto master"
                  if [ -n "$COMMIT" ]; then
                      git fetch --quiet "$RUNNER_TEMP/release/release.bundle" release
                      [ "$(git rev-parse FETCH_HEAD)" = "$COMMIT" ] || { echo "::error::the kept version commit is not ${COMMIT}"; exit 1; }
                  fi
                  # A nightly promotion (npm next) also pushes the site tag, on the tested commit, which the site
                  # job's prerelease hangs the commit's built site on, and fast-forwards channel/nightly to the
                  # version commit, or to the tested commit when nothing was versioned
                  # (design/ci/channels-pipeline/channels.md section 2). Never forced: a candidate whose history
                  # lacks the current channel/nightly is refused here, by name, before anything is pushed.
                  if [ "$DIST_TAG" = next ]; then
                      target=${COMMIT:-$SHA}
                      if git ls-remote --exit-code --heads origin refs/heads/channel/nightly >/dev/null; then
                          git fetch --quiet origin +refs/heads/channel/nightly:refs/remotes/origin/channel/nightly
                          git merge-base --is-ancestor origin/channel/nightly "$target" || {
                              echo "::error::channel/nightly ($(git rev-parse --short origin/channel/nightly)) is not in the history of ${target}: this candidate is older than the current nightly, so nightly cannot move to it. Nothing was pushed or published."
                              exit 1
                          }
                      fi
                      tested=${TESTED:-$SHA}
                      site="site-${tested}"
                      if git ls-remote --exit-code --tags origin "refs/tags/${site}" >/dev/null; then
                          git fetch --quiet origin "+refs/tags/${site}:refs/tags/${site}"
                          [ "$(git rev-parse "refs/tags/${site}^{commit}")" = "$tested" ] ||
                              { echo "::error::tag ${site} exists already on another commit"; exit 1; }
                      else
                          git tag "$site" "$tested"
                      fi
                      refs+=("refs/tags/${site}:refs/tags/${site}" "${COMMIT:-$SHA}:refs/heads/channel/nightly")
                      # the held candidate promoting ends its hold (design/ci/channels-pipeline.md section 3): its
                      # branch goes in the same push; the unhold job clears the store and closes the issue
                      if [ "${HELD:-}" = "$tested" ] && git ls-remote --exit-code --heads origin refs/heads/channel/candidate >/dev/null; then
                          refs+=(":refs/heads/channel/candidate")
                      fi
                  fi
                  # Nothing versioned (a nightly only): master does not move, only the site tag and channel/nightly.
                  if [ -z "$COMMIT" ]; then
                      [ "$DIST_TAG" = next ] || { echo "::error::no version commit to land"; exit 1; }
                      git push --atomic --no-verify origin "${refs[@]}"
                      echo "nightly moves to ${SHA}, with no version commit"
                      echo "pushed=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  node tools/release-diff.mjs "$SHA" "$COMMIT"
                  for tag in ${TAGS//,/ }; do
                      refs+=("refs/tags/${tag}:refs/tags/${tag}")
                  done
                  for try in 1 2 3 4 5; do
                      git fetch --quiet origin +refs/heads/master:refs/remotes/origin/master
                      if git merge-base --is-ancestor "$COMMIT" origin/master; then
                          echo "master holds ${COMMIT} already"
                          echo "pushed=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                      for tag in ${TAGS//,/ }; do
                          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                              [ "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$COMMIT" ] ||
                                  { echo "::error::tag ${tag} exists already on another commit: these versions were released before"; exit 1; }
                          else
                              git tag "$tag" "$COMMIT"
                          fi
                      done
                      git checkout --quiet --detach origin/master
                      if ! git merge --no-ff --no-verify -m "$subject" "$COMMIT"; then
                          git merge --abort || true
                          echo "::error::the version commit ${COMMIT} (versions and changelogs of ${SHA}) does not merge cleanly into master: a commit on master since ${SHA} changed a version field or a CHANGELOG.md line this release also writes. Nothing was pushed or published. Undo that edit on master; the merge of the fix restarts the release."
                          exit 1
                      fi
                      # the merge brings master nothing but versions and changelogs: code reaches master only through
                      # master's own pull requests (design/ci/channels-pipeline.md section 3, "Nightly promotion")
                      node tools/release-diff.mjs origin/master HEAD || {
                          echo "::error::merging ${COMMIT} into master would bring in more than versions and changelogs (above). Nothing was pushed or published."
                          exit 1
                      }
                      if git push --atomic --no-verify origin HEAD:refs/heads/master "${refs[@]}"; then
                          echo "master now holds ${COMMIT}, tagged ${TAGS}"
                          echo "pushed=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                      # a nightly ref the push could not fast-forward is no master race: say so, not "master kept moving"
                      if [ "$DIST_TAG" = next ] &&
                          git fetch --quiet origin +refs/heads/channel/nightly:refs/remotes/origin/channel/nightly 2>/dev/null &&
                          ! git merge-base --is-ancestor origin/channel/nightly "$COMMIT"; then
                          echo "::error::channel/nightly moved to $(git rev-parse --short origin/channel/nightly) during the push, and ${COMMIT} lacks it: another promotion won. Nothing was pushed or published."
                          exit 1
                      fi
                      echo "try ${try}: master moved during the push; merging again on its new tip"
                  done
                  echo "::error::could not land ${COMMIT} on master in five tries: master kept moving or the push was refused"
                  exit 1
              env:
                  HUSKY: "0"

            # Everything passed and the release is on master: a held train is released by this one. Only the train
            # hold closes; a publish hold waits for its own re-run, or for the registry to list what it accepted.
            - name: Close the held-release issue
              # a train hold is a legacy release's; a nightly releases nothing to latest, so it closes none
              if: ${{ inputs.mode == 'legacy' }}
              run: |
                  set -euo pipefail
                  tools/release-held.sh close \
                      "The full CI suite, the T4 GPU lane, Hosts, the security audit and the LLM regression tests passed on ${SHA} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), and its release (${TAGS}) is on master; this train releases what the failed train held. A publish hold (\"Release held: publish failed\"), if one is open, is a separate issue and stays open until its own run is re-run or the registry lists what it accepted."

            # A step after the push failed: the release is not held (the held job skips) and the publish job still
            # runs, but the failure must not pass unseen. The run ends red, and this says what it means.
            - name: Report a failure after the release landed
              if: ${{ failure() && steps.push.outputs.pushed == 'true' }}
              run: |
                  msg="the release (${TAGS}) is on master and is being published, but a later step of this job failed (see the failed step above); the release is not held"
                  echo "::error::${msg}"
                  echo "Release landed, then a bookkeeping step failed: ${msg}" >> "$GITHUB_STEP_SUMMARY"

    # The held candidate promoted (design/ci/channels-pipeline.md section 3): land deleted branch channel/candidate in
    # its push; this clears the results store's hold and closes the "Nightly held on" issue (tools/channel/hold.mjs).
    unhold:
        name: End the nightly hold
        needs: [pick, land]
        # the held candidate promoted, or any candidate the owner approved (with no hold recorded, only `approved`)
        if: ${{ !cancelled() && needs.land.outputs.pushed == 'true' && ((needs.pick.outputs.held != '' && needs.pick.outputs.held == (needs.pick.outputs.tested || needs.pick.outputs.sha)) || needs.pick.outputs.resume == 'true') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # close the hold issue
            id-token: write # the results store
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: tools

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - name: End the hold
              env:
                  GH_TOKEN: ${{ github.token }}
                  WHY: promoted to nightly
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: node tools/channel/hold.mjs end

            # after the owner's approval: `approved` on the tested head, which candidates.mjs and the release state
            # read as promoted, and which keeps a second dispatch for the same approval from promoting again
            - name: Record the approval as promoted
              if: ${{ needs.pick.outputs.resume == 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  STATE: approved
                  TESTED: ${{ needs.pick.outputs.tested }}
                  ACCEPT: ${{ needs.pick.outputs.sha }}
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
              run: node tools/channel/resume.mjs record

    # Publishes what the land job put on master, from the builds of this run's CI call. always(): a land job that
    # pushed and then failed a bookkeeping step still publishes. A re-run of the run's failed jobs re-runs only this
    # job when it is the one that failed.
    publish:
        name: Publish the release
        needs: [pick, version, land]
        if: ${{ always() && needs.land.outputs.pushed == 'true' && needs.version.outputs.commit != '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 16
        environment: release # npm trusted publishing (OIDC), Pushover
        permissions:
            actions: read
            contents: write # the GitHub releases
            id-token: write
            issues: write # report a failed publish
        env:
            GH_TOKEN: ${{ github.token }}
            SHA: ${{ needs.pick.outputs.sha }}
            COMMIT: ${{ needs.version.outputs.commit }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.commit }}
                  fetch-depth: 0

            # A re-run (gh run rerun <id> --failed) tells the owner's phone it is retrying.
            - name: Announce a re-run of the publish
              if: ${{ github.run_attempt > 1 }}
              continue-on-error: true
              env:
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
              run: |
                  node tools/release-status.mjs started --sha "$SHA" --attempt "$GITHUB_RUN_ATTEMPT" \
                      --what "Publishing on re-run ${GITHUB_RUN_ATTEMPT}" --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

            - name: Download the tested builds
              uses: actions/download-artifact@v8
              with:
                  name: release-builds-${{ needs.pick.outputs.sha }}
                  path: ${{ runner.temp }}/builds

            - name: Put each build in its package
              run: |
                  for dir in "$RUNNER_TEMP"/builds/build-*; do
                      pkg=${dir##*/build-}
                      mkdir -p "${pkg}/dist"
                      cp -a "${dir}/." "${pkg}/dist/"
                  done

            - uses: pnpm/action-setup@v6

            # Note: Do NOT set registry-url - it interferes with OIDC trusted publishing
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: "pnpm"

            # Upgrade npm to 11.5.1+ for OIDC trusted publishing support.
            #
            # Pinned to 11 rather than latest. nx builds its pnpm publish command as `pnpm publish ...
            # --no-git-checks`, and pnpm forwards that flag to npm even though pnpm owns it. npm read unknown
            # config as a warning through 11.x and made it fatal in 12.0.0 (2026-07-08), so `npm@latest` fails
            # every publish with EUNKNOWNCONFIG: Unknown cli flag: --git-checks. Drop the pin once pnpm stops
            # forwarding the flag or nx stops passing it.
            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@11
                  npm --version

            # --ignore-scripts (nightly only): this job holds npm's OIDC, so no dependency's install script runs
            # beside it (the tarballs come from CI's build, which held no secret). A legacy release installs as before.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile ${{ inputs.mode != 'legacy' && '--ignore-scripts' || '' }}
              env:
                  HUSKY: "0"

            # One GitHub release per package the version commit lists, on the tag the land job pushed; its notes
            # are the changelog section nx wrote. A re-run skips the releases that exist already. A nightly (next)
            # release is a prerelease and never "Latest": that stays the production version's.
            - name: Create the GitHub releases
              id: tags
              run: |
                  set -euo pipefail
                  projects=()
                  tags=()
                  while read -r project version; do
                      projects+=("$project")
                      tag="${project}@${version}"
                      tags+=("$tag")
                      if gh release view "$tag" >/dev/null 2>&1; then echo "${tag} exists already"; continue; fi
                      root=$(pnpm exec nx show project "$project" --json | jq -r .root)
                      git diff -U0 "${COMMIT}^1" "$COMMIT" -- "${root}/CHANGELOG.md" | sed -n '/^+++/d; s/^+//p' > "$RUNNER_TEMP/notes.md"
                      flags=()
                      [ "$DIST_TAG" = latest ] || flags=(--prerelease --latest=false)
                      gh release create "$tag" --verify-tag "${flags[@]}" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
                  done < <(git log -1 --format=%b "$COMMIT" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/\1 \2/p')
                  [ "${#projects[@]}" -gt 0 ] || { echo "::error::${COMMIT} lists no released project"; exit 1; }
                  echo "projects=$(IFS=,; echo "${projects[*]}")" >> "$GITHUB_OUTPUT"
                  echo "tags=$(IFS=,; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"

            - name: Publish
              run: |
                  # `nx release publish` publishes the versions in the manifests and asks the registry per
                  # package, skipping any version already there, so re-running this job after a failed publish
                  # ships only what is missing. --nxBail=false: one package's failed publish never stops the
                  # packages behind it.
                  #
                  # A failed publish does not fail this step: the next step, which polls the registry, decides.
                  # npm answers a retry inside its propagation window (up to about 7.5 minutes after it accepted
                  # an upload) with E409 "Cannot publish over previously staged version" (npm/cli#9889), which
                  # failed the 3.1.0 release although every version it refused was already published.
                  #
                  # The output is kept for the failed-publish report, which reads npm's login error from it.
                  set -o pipefail
                  pnpm exec nx release publish --projects="$PROJECTS" --tag "$DIST_TAG" --nxBail=false 2>&1 | tee "$RUNNER_TEMP/publish.log" ||
                      echo "::warning::nx release publish reported a failure; the registry check below decides"
              env:
                  PROJECTS: ${{ steps.tags.outputs.projects }}
                  # OIDC trusted publishing: npm uses the GitHub Actions OIDC token (id-token: write above).
                  NPM_CONFIG_PROVENANCE: true
                  # Clear any NODE_AUTH_TOKEN that might interfere with OIDC
                  NODE_AUTH_TOKEN: ""
                  HUSKY: "0"

            # npm can accept a publish and still not serve it, and nx release publish skips any package whose
            # dependency failed. So the last word is the registry: every non-private package's version at the
            # version commit must be installable. npm takes a while to serve a fresh version (up to about 7.5
            # minutes), hence the bounded poll (20 tries, 30 s apart).
            - name: Check every version is on npm
              run: |
                  missing() {
                      pnpm -r ls --depth -1 --json | jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"' |
                          while read -r spec; do
                              [ "$(npm view "$spec" version 2>/dev/null)" = "${spec##*@}" ] || echo "$spec"
                          done
                  }
                  for try in $(seq 1 20); do
                      absent=$(missing)
                      [ -n "$absent" ] || { echo "every package version is on npm"; exit 0; }
                      echo "try ${try}: not on npm yet: ${absent//$'\n'/ }"
                      sleep 30
                  done
                  for spec in $absent; do echo "::error::${spec} is versioned on master but not on npm; re-run this job to publish it"; done
                  # for the report: whether npm accepted each of these and is only slow to list it
                  printf '%s\n' "$absent" > "$RUNNER_TEMP/absent.txt"
                  exit 1

            # A failed publish leaves master versioned and tagged with versions missing from npm, which no later
            # train can version again, so it is reported as a hold of its own: a "Release held: publish failed" issue, separate from
            # any train hold, which also stops the scheduled trains. A train never retitles it, and a second failure
            # of this run only comments on it. Re-running the failed jobs of this run publishes what is missing and
            # closes it; a hold whose missing versions npm accepted and was only slow to list is closed by the pick
            # job of a later run once npm lists them (tools/publish-hold.mjs).
            - name: Report a failed publish
              id: report
              if: ${{ failure() }}
              run: |
                  set -euo pipefail
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  # A package with no npm trusted publisher fails with npm's login error: its first publish, or one
                  # whose trusted-publisher configuration expired unused. Only the owner can fix that on npmjs.com,
                  # so the issue says so instead of reading as a code defect. nx prints each task's output under
                  # its "nx run <project>:nx-release-publish" line.
                  login=()
                  if [ -f "$RUNNER_TEMP/publish.log" ]; then
                      mapfile -t login < <(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/publish.log" | awk '
                          match($0, /nx run [^ ]+:nx-release-publish/) { p = substr($0, RSTART + 7, RLENGTH - 26) }
                          /requires you to be logged in to https:\/\/registry\.npmjs\.org/ && p != "" { print p; p = "" }' | sort -u)
                  fi
                  names=()
                  for project in "${login[@]}"; do
                      root=$(pnpm exec nx show project "$project" --json | jq -r .root)
                      names+=("$(jq -r .name "${root}/package.json")")
                  done
                  title="Release held: publish failed on ${SHA:0:7}"
                  # npm accepted every version the registry check could not find: the hold ends by itself once npm
                  # lists them (tools/publish-hold.mjs settle, in the pick job). Anything else needs a person.
                  marker=$(node tools/publish-hold.mjs classify --log "$RUNNER_TEMP/publish.log" --absent "$RUNNER_TEMP/absent.txt")
                  awaiting=$(sed -n 's/^<!-- publish-hold: awaiting-registry \(.*\) -->$/\1/p' <<<"$marker")
                  if [ "${#names[@]}" != 0 ]; then
                      title="${title}: owner must create the npm trusted publisher for ${names[*]}"
                  elif [ -n "$awaiting" ]; then
                      title="${title}: npm has not listed ${awaiting} yet"
                  fi
                  {
                      if [ -n "$awaiting" ]; then
                          echo "## Nothing to do: npm accepted ${awaiting} but has not listed it yet"
                          echo
                          echo "npm answered \"Published\" for every version the registry check could not find; npm sometimes takes much longer than that check waits to list one. This issue closes itself once npm lists them all: every release train attempt and every master push whose build passes checks npm again (release.yml's pick job, \`tools/publish-hold.mjs settle\`). Re-running the failed jobs (below) also clears it."
                          echo
                      fi
                      if [ "${#names[@]}" -gt 0 ]; then
                          echo "## OWNER ITEM: create the npm trusted publisher for ${names[*]}"
                          echo
                          echo "This is not a code defect: no pull request or agent can fix it. npm refused to publish ${names[*]} with \"This command requires you to be logged in to https://registry.npmjs.org/\". That is what npm trusted publishing (OIDC) answers when a package has no trusted-publisher configuration: its first publish, or a configuration that expired because no publish used it within 2 days of its creation (https://docs.npmjs.com/trusted-publishers/)."
                          echo
                          echo "1. On npmjs.com, for each package below, open its settings, Trusted Publisher, GitHub Actions, and enter: Organization or user \`${GITHUB_REPOSITORY%%/*}\`, Repository \`${GITHUB_REPOSITORY#*/}\`, Workflow filename \`release.yml\`, Environment left empty."
                          for name in "${names[@]}"; do echo "   - ${name}: https://www.npmjs.com/package/${name}/access"; done
                          echo "2. Re-run the failed publish at once: \`gh run rerun ${GITHUB_RUN_ID} --failed\`. The new configuration expires if no publish uses it within 2 days."
                          echo
                      fi
                      echo "The publish job failed on ${SHA} (released as ${COMMIT}): ${run_url}"
                      echo
                      echo "The release is on master and tagged, but its packages are not all on npm. Scheduled release trains skip while this issue is open. Read the failed step in the run, fix the cause (an npm rejection, a missing \`release-builds-<sha>\` artifact of the run), then re-run the failed jobs of run ${GITHUB_RUN_ID}: \`gh run rerun ${GITHUB_RUN_ID} --failed\`. The release stays held until that run is re-run and passes: a new release train cannot clear this, and a train that fails meanwhile opens its own, separate issue without touching this one. A publish that passes closes this issue. The builds the train kept expire 30 days after the train ran."
                      echo
                      echo "$marker"
                  } > "$RUNNER_TEMP/body.md"
                  open=$(tools/release-held.sh open "$title" "$RUNNER_TEMP/body.md" "Release held: publish failed")
                  echo "issue=${open}" >> "$GITHUB_OUTPUT"
                  echo "::error::publish failed on ${SHA}; issue ${open}"

            - name: Close the failed-publish issue
              run: |
                  tools/release-held.sh close \
                      "Published from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}: every package version is on npm." \
                      "Release held: publish failed"

            # The owner hears of every publish outcome (tools/release-status.mjs): released, with each package and
            # version, or failed. always(), so a failure anywhere above is announced; re-running the failed job
            # (gh run rerun <id> --failed) runs this step again and announces the re-run's outcome.
            # A nightly's success is announced once, by the site job ("Nightly PROMOTED"); its failure here.
            - name: Announce the publish outcome
              if: ${{ always() && (env.DIST_TAG == 'latest' || job.status != 'success') }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
                  OUTCOME: ${{ job.status == 'success' && 'published' || 'publish-failed' }}
                  TAGS: ${{ steps.tags.outputs.tags }}
                  ISSUE: ${{ steps.report.outputs.issue }}
              run: |
                  node tools/release-status.mjs "$OUTCOME" --sha "$SHA" --tags "$TAGS" --issue "$ISSUE" \
                      --attempt "$GITHUB_RUN_ATTEMPT" --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

    # The nightly site (design/ci/channels-pipeline/channels.md, sections 3 and 7, step 4): hangs the candidate's
    # built site (the site-<sha> artifact its master build's deploy-pages.yml run kept, byte for byte, compressed
    # as site.tar.zst) and channel.json on a public prerelease on the site-<sha> tag the land job pushed, pushes
    # deployed.json (tag, sha256, the master commit whose graphty/sites/nightly.json becomes site.json) to
    # graphty-org/graphty-nightly with that repository's deploy key, and ends on graphty-nightly's deploy
    # (tools/channel/site-deploy.yml, which refuses an asset whose sha256 is not deployed.json's) or on
    # nightly.graphty.app's build stamp naming the candidate. Then it records the promotion and both sha256s in
    # the results store and announces it. A failure files one priority:critical issue and is announced; a re-run
    # of the run's failed jobs re-runs this job alone. No dependency is installed: it holds a deploy key.
    site:
        name: Deploy the nightly site
        needs: [pick, verdict, resume, version, land, publish]
        if: ${{ !cancelled() && (inputs.mode == 'full' || inputs.mode == 'restart' || inputs.mode == 'candidate' || inputs.mode == 'promote-nightly') && needs.land.outputs.pushed == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: nightly # NIGHTLY_SITE_DEPLOY_KEY, Pushover
        permissions:
            actions: read # the deploy-pages.yml run's site artifact; graphty-nightly's deploy run
            contents: write # the prerelease on site-<sha>
            id-token: write # the results store
            issues: write # a failed deploy's issue; the Release status announcement
        env:
            GH_TOKEN: ${{ github.token }}
            # the commit whose built site deploys: the tested one (after the owner's approval, the candidate the accept
            # commit is parented on, which master built); TARGET is where the land job moved channel/nightly
            SHA: ${{ needs.pick.outputs.tested || needs.pick.outputs.sha }}
            TARGET: ${{ needs.version.outputs.commit || needs.pick.outputs.sha }}
            COMMIT: ${{ needs.version.outputs.commit }}
            TAGS: ${{ needs.version.outputs.tags }}
            SCREENSHOTS: ${{ needs.verdict.outputs.screenshots || needs.resume.outputs.screenshots }}
            SITE_REPO: graphty-org/graphty-nightly
            SITE_URL: https://nightly.graphty.app
            RUN_ID: ${{ github.run_id }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            # The deploy wait's limit counts from here, not from the wait, so however long the steps before it take
            # it fails by name before the job's timeout cancels the job (a cancel would skip the failure report).
            - name: Note the job's start
              run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

            # master's tip: the tools, and graphty/sites/nightly.json, which the site deploys as site.json
            - uses: actions/checkout@v7
              with:
                  ref: master
                  fetch-depth: 0
                  filter: blob:none
                  sparse-checkout: |
                      tools
                      graphty/sites

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            # Environment `nightly` is filled by the owner; a missing key fails here, by name, after the checkout,
            # so the failure report at the end can run.
            - name: Check the site's deploy key
              env:
                  KEY: ${{ secrets.NIGHTLY_SITE_DEPLOY_KEY }}
              run: |
                  [ -n "$KEY" ] || {
                      echo "::error::secret NIGHTLY_SITE_DEPLOY_KEY is missing from environment nightly: add graphty-nightly's write deploy key (private half) there, then re-run this run's failed jobs"
                      exit 1
                  }

            # A re-run of an older run's site job must not roll nightly.graphty.app back: deploy only while
            # channel/nightly is still this run's commit (the land job moved it; a later promotion moves it on).
            # Moved on is a skip, not a failure: every later step is skipped and no failed deploy is reported.
            - name: Check that nightly is still this run's
              id: current
              run: |
                  set -euo pipefail
                  git fetch --quiet --filter=blob:none origin +refs/heads/channel/nightly:refs/remotes/origin/channel/nightly
                  at=$(git rev-parse refs/remotes/origin/channel/nightly)
                  if [ "$at" = "$TARGET" ]; then
                      echo "ours=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::channel/nightly is at ${at} now, not this run's ${TARGET}: a later promotion moved it, so this run deploys nothing"
                      echo "ours=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download the candidate's built site
              if: ${{ steps.current.outputs.ours == 'true' }}
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/site" "$RUNNER_TEMP/out"
                  # by name: deploy-pages.yml keeps a master build's site, and a fix forward's run (candidate_site) a held
                  # head's; the newest unexpired one
                  id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site-${SHA}&per_page=10" \
                      --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
                  if [ -n "$id" ] && gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/site.zip" &&
                      unzip -q "$RUNNER_TEMP/site.zip" -d "$RUNNER_TEMP/site"; then
                      echo "site-${SHA} from artifact ${id}"
                      exit 0
                  fi
                  echo "::error::no run still keeps the artifact site-${SHA} (kept 14 days)"
                  exit 1

            - name: Pack the site and write channel.json
              if: ${{ steps.current.outputs.ours == 'true' }}
              id: pack
              run: |
                  set -euo pipefail
                  zstd -q -T0 "$RUNNER_TEMP/site/site-${SHA}.tar" -o "$RUNNER_TEMP/out/site.tar.zst"
                  site_sha=$(sha256sum "$RUNNER_TEMP/out/site.tar.zst" | cut -d' ' -f1)
                  config_ref=$(git rev-parse HEAD)
                  SITE_SHA256="$site_sha" CONFIG_REF="$config_ref" node tools/channel/nightly.mjs channel-json > "$RUNNER_TEMP/out/channel.json"
                  channel_sha=$(sha256sum "$RUNNER_TEMP/out/channel.json" | cut -d' ' -f1)
                  { echo "site_sha256=${site_sha}"; echo "channel_sha256=${channel_sha}"; echo "config_ref=${config_ref}"; } >> "$GITHUB_OUTPUT"

            # A public prerelease on the tag the land job pushed: never "Latest", which stays production's.
            - name: Hang the site on the site-<sha> prerelease
              if: ${{ steps.current.outputs.ours == 'true' }}
              run: |
                  set -euo pipefail
                  tag="site-${SHA}"
                  gh release view "$tag" >/dev/null 2>&1 ||
                      gh release create "$tag" --verify-tag --prerelease --latest=false --title "Nightly site ${SHA:0:7}" \
                          --notes "The built site of ${SHA}, promoted to nightly.graphty.app by ${RUN_URL}."
                  gh release upload "$tag" "$RUNNER_TEMP/out/site.tar.zst" "$RUNNER_TEMP/out/channel.json" --clobber

            - uses: actions/checkout@v7
              if: ${{ steps.current.outputs.ours == 'true' }}
              with:
                  repository: ${{ env.SITE_REPO }}
                  path: nightly-site
                  ssh-key: ${{ secrets.NIGHTLY_SITE_DEPLOY_KEY }}

            # deployed.json's history in graphty-nightly is the audit log of every nightly deploy.
            - name: Push deployed.json and channel.json to the site repository
              if: ${{ steps.current.outputs.ours == 'true' }}
              id: deployed
              env:
                  SITE_SHA256: ${{ steps.pack.outputs.site_sha256 }}
                  CONFIG_REF: ${{ steps.pack.outputs.config_ref }}
              run: |
                  set -euo pipefail
                  [ -f nightly-site/.github/workflows/deploy.yml ] || {
                      echo "::error::${SITE_REPO} has no .github/workflows/deploy.yml: commit tools/channel/site-deploy.yml there as deploy.yml"
                      exit 1
                  }
                  node tools/channel/nightly.mjs deployed-json > nightly-site/deployed.json
                  # what nightly serves, read by promote.mjs (--config-only, the rollback check), as promote-push.sh writes it
                  cp "$RUNNER_TEMP/out/channel.json" nightly-site/channel.json
                  cd nightly-site
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add deployed.json channel.json
                  git commit --quiet -m "deploy: nightly site-${SHA}" -m "${RUN_URL}"
                  git push --quiet origin HEAD
                  echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Wait for the site's deploy
              if: ${{ steps.current.outputs.ours == 'true' }}
              env:
                  PUSHED: ${{ steps.deployed.outputs.pushed }}
              run: node tools/channel/nightly.mjs wait

            - name: Record the promotion in the results store
              if: ${{ steps.current.outputs.ours == 'true' }}
              env:
                  RESULTS_URL: ${{ vars.RESULTS_URL }}
                  HEALTH_API_URL: ${{ vars.HEALTH_API_URL }}
                  SITE_SHA256: ${{ steps.pack.outputs.site_sha256 }}
                  CHANNEL_SHA256: ${{ steps.pack.outputs.channel_sha256 }}
              run: node tools/channel/nightly.mjs record

            # a gh error here (a rate limit, a 5xx) must not turn a deploy that worked into a failed one
            - name: Close the failed-deploy and failed-promotion issues
              if: ${{ steps.current.outputs.ours == 'true' }}
              continue-on-error: true
              run: |
                  # each runs even when the one before it failed; the step still reports a failure
                  rc=0
                  node tools/channel/nightly.mjs deployed || rc=$?
                  tools/release-held.sh close "Nightly promotion succeeded on ${SHA}: ${RUN_URL}" "Nightly promotion failed:" || rc=$?
                  tools/release-held.sh close "Nightly promotion succeeded on ${SHA}: ${RUN_URL}" "Nightly blocked:" || rc=$?
                  exit "$rc"

            - name: Announce the promoted nightly
              if: ${{ steps.current.outputs.ours == 'true' }}
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
              run: |
                  node tools/release-status.mjs nightly --sha "$SHA" --tags "$TAGS" --attempt "$GITHUB_RUN_ATTEMPT" --run "$RUN_URL"

            - name: Report a failed nightly deploy
              if: ${{ failure() }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY }}
                  PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
                  PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
              run: |
                  issue=$(node tools/channel/nightly.mjs failed)
                  node tools/release-status.mjs nightly-failed --sha "$SHA" --issue "$issue" --attempt "$GITHUB_RUN_ATTEMPT" --run "$RUN_URL"
