name: Release

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        # Only run if CI workflow succeeded
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: pnpm/action-setup@v4

            # Note: Do NOT set registry-url - it interferes with OIDC trusted publishing
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            # Upgrade npm to 11.5.1+ for OIDC trusted publishing support.
            #
            # Pinned to 11 rather than latest. nx builds its pnpm publish command
            # as `pnpm publish ... --no-git-checks`, and pnpm forwards that flag
            # to npm even though pnpm owns it. npm read unknown config as a
            # warning through 11.x and made it fatal in 12.0.0 (2026-07-08), so
            # `npm@latest` now fails every publish with
            # EUNKNOWNCONFIG: Unknown cli flag: --git-checks.
            #
            # 11.x still satisfies the 11.5.1+ this step exists for, and is the
            # line that published every current version on the registry. Drop the
            # pin once pnpm stops forwarding the flag or nx stops passing it.
            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@11
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # Download build artifacts from CI workflow instead of rebuilding
            # This ensures we release the exact same code that was tested
            - name: Download graph-format build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-format
                  path: graph-format/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graph-io build
              uses: actions/download-artifact@v4
              with:
                  name: build-graph-io
                  path: graph-io/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download webgpu-graph-algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-webgpu-graph-algorithms
                  path: webgpu-graph-algorithms/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download algorithms build
              uses: actions/download-artifact@v4
              with:
                  name: build-algorithms
                  path: algorithms/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download layout build
              uses: actions/download-artifact@v4
              with:
                  name: build-layout
                  path: layout/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty
                  path: graphty/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download graphty-element build
              uses: actions/download-artifact@v4
              with:
                  name: build-graphty-element
                  path: graphty-element/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download remote-logger build
              uses: actions/download-artifact@v4
              with:
                  name: build-remote-logger
                  path: remote-logger/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download compact-mantine build
              uses: actions/download-artifact@v4
              with:
                  name: build-compact-mantine
                  path: compact-mantine/dist/
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Cache Nx
              uses: actions/cache@v4
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      nx-${{ runner.os }}-

            - name: Version and Release
              run: |
                  echo "npm version: $(npm --version)"
                  echo "node version: $(node --version)"
                  # Version, changelog, commit, tag and push -- but do NOT publish:
                  #
                  #   shouldPublish        = !!args.yes && !args.skipPublish && hasNewVersion
                  #   shouldPromptPublishing = !args.yes && !args.skipPublish && !args.dryRun && ...
                  #
                  # --skip-publish makes both false, so publishing happens exactly
                  # once, in the separate command below. Without it nx publishes
                  # here as well, and the second pass races npm's staged-publish
                  # window: nx skips a package only when it can already see the
                  # version in the registry, a just-published version is staged and
                  # not yet visible, so nx publishes it again and npm answers
                  # "409 Conflict - Cannot publish over previously staged version".
                  # That reported a red build on every release that had in fact
                  # published everything, and bailing on the first 409 left the
                  # packages behind it unpublished.
                  #
                  # --yes is deliberately absent: nx rejects it alongside
                  # --skip-publish as mutually exclusive, and it is not needed.
                  # Those two lines are the only places nx reads args.yes -- it
                  # exists solely to auto-answer the publish prompt, and skipping
                  # publishing means there is no prompt to answer. Versioning,
                  # changelog and the GitHub release never consult it.
                  pnpm exec nx release --skip-publish --verbose

                  # The only publish. It is a separate command because `nx release`
                  # publishes only when it versioned something in the same run, so
                  # a release whose publish step fails could never be retried. The
                  # tags are already pushed, so the next run resolves the current
                  # version from them, finds no new conventional commits, reports
                  # "No changes were detected" and skips publishing. The packages
                  # stay tagged and unpublished for good. That is exactly what
                  # happened when npm 12 broke the publish command.
                  #
                  # `nx release publish` does not consult hasNewVersion: it
                  # publishes the versions in the manifests and queries the registry
                  # per package, skipping any version that is already there. The
                  # checkout above takes the branch tip, so re-running this job
                  # after a failed publish picks up the release commit and ships
                  # whatever is still missing.
                  pnpm exec nx release publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # OIDC trusted publishing - npm will use the GitHub Actions OIDC token
                  # Requires configuring trusted publishers on npmjs.com
                  NPM_CONFIG_PROVENANCE: true
                  # Clear any NODE_AUTH_TOKEN that might interfere with OIDC
                  NODE_AUTH_TOKEN: ""
                  # Disable husky hooks - they interfere with release commits
                  # (prepare-commit-msg tries to open TTY, pre-push runs tests again)
                  HUSKY: "0"
