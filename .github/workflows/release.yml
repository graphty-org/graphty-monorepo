name: Release

# A daily release train, landed through the merge queue like every other change (design/ci/ci-cd-plan.md,
# sections 10 and 11).
#
# 1. Once a day (the schedule), or at once when the owner dispatches it (the ad hoc release), the pick job finds
#    the newest master commit green on CI and Hosts, the t4 job runs the paid NVIDIA T4 lane (gpu.yml) on exactly
#    that commit, and only when it passes does the train job version it with nx release and open a "chore(release):
#    publish" pull request holding only version fields and changelogs. A red T4 holds the WHOLE release: no pull
#    request, nothing published, and the held job opens or updates one "Release held: T4 GPU failed on <sha>"
#    issue. The next train whose T4 passes releases everything at once and closes that issue (owner decision,
#    2026-10-06: the T4 runs only here, on manual dispatch and in the local pre-push gate). Mergify merges it ahead of waiting pull
#    requests (.mergify.yml's "release train" priority rule, which matches the branch, not a label) without
#    interrupting the batches already being checked.
# 2. That merge is a push to master, which starts the publish job: it tags each released package
#    {projectName}@{version}, creates its GitHub release and publishes it to npm with trusted publishing (OIDC),
#    from the build of the commit every lane tested.
#
# Nothing here pushes to master: the version commit reaches master only by the pull request. The file keeps its
# name because npm's trusted-publisher entry for every package names it.
#
# Ad hoc release: `gh workflow run release.yml --ref master`, optionally `-f packages=graph-format,graph-io` (nx
# project names) to release only those; every other project is held for that run, on top of release-hold.json.
on:
    schedule:
        - cron: "0 14 * * *"
    workflow_dispatch:
        inputs:
            packages:
                description: "Release only these nx projects (comma separated). Empty: every package with releasable commits."
                required: false
                default: ""
                type: string
    push:
        branches:
            - master

# One train at a time across all its jobs: a second train waits for the first, which has opened its pull request
# (or held the release) by then, so the second never runs a second paid T4 on the same commit. A push run (the
# publish job) gets a group of its own and never waits for a train.
concurrency:
    group: ${{ github.event_name == 'push' && format('release-push-{0}', github.run_id) || 'release-train' }}
    cancel-in-progress: false

jobs:
    # The candidate is the NEWEST commit on master's first-parent line, after the last release landed, whose lanes
    # all succeeded: CI must exist and be green; Hosts is filtered by paths, so a commit with no Hosts run has
    # nothing to wait for (owner rule of 2026-09-18: no release while any lane is red). A commit whose lanes failed,
    # were cancelled or are still running is passed over, never released. The T4 lane is not read here: it runs
    # on the candidate in the t4 job below.
    pick:
        name: Pick the release candidate
        if: ${{ github.event_name != 'push' && github.ref == 'refs/heads/master' }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
            pull-requests: read
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            release: ${{ steps.lanes.outputs.release }}
            sha: ${{ steps.lanes.outputs.sha }}
            ci_run_id: ${{ steps.lanes.outputs.ci_run_id }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - name: Pick the newest commit since the last release with CI and Hosts green
              id: lanes
              run: |
                  set -euo pipefail
                  skip() { echo "::notice::$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }
                  open=$(gh pr list --state open --limit 200 --json number,headRefName \
                      --jq '[.[] | select(.headRefName | startswith("release/train-")) | .number] | first // empty')
                  [ -z "$open" ] || skip "release pull request #${open} is still open; it must merge or close first"
                  # The newest version commit, and whether its publish run has tagged it yet. Until it has, nx
                  # would version from the previous tags and release the same versions a second time.
                  last=$(git log -1 --no-merges --grep='^chore(release): publish' --format=%H HEAD)
                  while read -r project version; do
                      git rev-parse -q --verify "refs/tags/${project}@${version}" >/dev/null ||
                          skip "the last release (${last}) has no tag ${project}@${version} yet; its publish run must finish first"
                  done < <(git log -1 --format=%b "$last" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/\1 \2/p')
                  # Candidates, newest first: master's first-parent line down to the commit that brought the last
                  # version commit in (its pull request's merge, or the version commit itself). Commits merged
                  # while that pull request waited are released with the first green commit after it.
                  candidates=()
                  while read -r sha; do
                      git merge-base --is-ancestor "$last" "${sha}^1" 2>/dev/null || { echo "last release lands at ${sha}"; break; }
                      candidates+=("$sha")
                  done < <(git log --first-parent --max-count=200 --format=%H HEAD)
                  [ "${#candidates[@]}" -gt 0 ] || skip "nothing on master since the last release"
                  # Every lane's master runs, newest first, as "head_sha id status conclusion". The first line for a
                  # commit is its newest run (a re-run keeps its id and updates in place).
                  runs() {
                      gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?branch=master&per_page=100" \
                          --jq '.workflow_runs[] | "\(.head_sha) \(.id) \(.status) \(.conclusion // "-")"'
                  }
                  ci_runs=$(runs ci.yml); hosts_runs=$(runs hosts.yml)
                  newest() { awk -v s="$2" '$1 == s { print $2, $3, $4; exit }' <<< "$1"; }
                  # The release ships the CI run's per-package builds, which CI keeps for one day.
                  artifacts_ok() {
                      local live
                      live=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts?per_page=100" --jq '
                          [.artifacts[] | select(.expired | not) | .name] as $live
                          | ["graph-format", "graph-io", "webgpu-graph-algorithms", "graph-samples", "algorithms",
                             "layout", "graphty", "graphty-element", "remote-logger", "compact-mantine"]
                          | map("build-" + .) - $live | length')
                      [ "$live" = 0 ]
                  }
                  for sha in "${candidates[@]}"; do
                      ci=$(newest "$ci_runs" "$sha"); hosts=$(newest "$hosts_runs" "$sha")
                      echo "${sha}: ci=[${ci:-none}] hosts=[${hosts:-none (paths did not change)}]"
                      case "$ci" in *" completed success") ;; *) continue ;; esac
                      case "$hosts" in "" | *" completed success") ;; *) continue ;; esac
                      ci_run_id=${ci%% *}
                      artifacts_ok "$ci_run_id" ||
                          skip "${sha} is green but CI run ${ci_run_id} no longer holds its builds; the next train tries a newer commit"
                      echo "CI and Hosts green on ${sha}; CI run ${ci_run_id} holds the build artifacts; the T4 runs on it next"
                      { echo "release=true"; echo "sha=${sha}"; echo "ci_run_id=${ci_run_id}"; } >> "$GITHUB_OUTPUT"
                      exit 0
                  done
                  skip "no commit since the last release is green on CI and Hosts yet; dispatch again once one is"

    # The paid NVIDIA T4 lane on exactly the candidate: gpu.yml's job, tests and benchmarks.
    t4:
        name: T4 GPU
        needs: pick
        if: ${{ needs.pick.outputs.release == 'true' }}
        permissions:
            contents: read
        uses: ./.github/workflows/gpu.yml
        with:
            ref: ${{ needs.pick.outputs.sha }}

    # A red T4 holds the whole release: this job opens no pull request and publishes nothing. It opens (or retitles
    # and comments on) the one open "Release held: T4 GPU failed on <sha>" issue, which githerd turns into a fix
    # job; the next train whose T4 passes releases everything and closes it.
    held:
        name: Hold the release (T4 failed)
        needs: [pick, t4]
        if: ${{ !cancelled() && needs.pick.outputs.release == 'true' && needs.t4.result == 'failure' }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            SHA: ${{ needs.pick.outputs.sha }}
        steps:
            - name: Open or update the held-release issue
              run: |
                  set -euo pipefail
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  title="Release held: T4 GPU failed on ${SHA:0:7}"
                  {
                      echo "The release train's T4 GPU run failed on ${SHA}: ${run_url}"
                      echo
                      echo "No release pull request was opened and nothing was published. The whole release is held until the T4 passes: fix webgpu-graph-algorithms (or whatever the T4 found) on master, then the next train (the daily 14:00 UTC run, or \`gh workflow run release.yml --ref master\`) re-runs the T4 and, when it passes, releases everything at once and closes this issue."
                      echo
                      echo "What failed (the T4 job's failed steps, then its FAIL and error lines):"
                      echo
                      echo '```'
                      gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
                          --jq '.jobs[] | select(.conclusion == "failure" and (.name | contains("NVIDIA T4"))) | "\(.id) \(.name): \([.steps[] | select(.conclusion == "failure") | .name] | join("; "))"' |
                          while read -r id rest; do
                              echo "$rest"
                              # a job the provider refused (no balance, no runner) has no log
                              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}/logs" 2>/dev/null |
                                  sed 's/^[0-9TZ:.-]* //' | grep -E '(^| )(FAIL|##\[error\])' | head -60 || true
                          done || echo "(the run's jobs could not be read; open the run)" # the issue matters more than its details
                      echo '```'
                  } > "$RUNNER_TEMP/body.md"
                  open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label gpu --limit 100 --json number,title \
                      --jq '[.[] | select(.title | startswith("Release held: T4 GPU failed on "))][0].number // empty')
                  if [ -n "$open" ]; then
                      gh issue edit "$open" -R "$GITHUB_REPOSITORY" --title "$title"
                      gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
                  else
                      open=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
                          --label bug --label priority:high --label gpu --label effort:medium --body-file "$RUNNER_TEMP/body.md")
                  fi
                  echo "::error::release held: the T4 GPU lane failed on ${SHA}; no release pull request was opened (issue ${open})"

    # Versions the candidate and opens the release pull request, only after the T4 passed on it.
    train:
        name: Open the release pull request
        needs: [pick, t4]
        if: ${{ needs.pick.outputs.release == 'true' && needs.t4.result == 'success' }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: write
            issues: write
            pull-requests: write
            statuses: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Close the held-release issue (the T4 passed)
              env:
                  SHA: ${{ needs.pick.outputs.sha }}
              run: |
                  set -euo pipefail
                  open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label gpu --limit 100 --json number,title \
                      --jq '[.[] | select(.title | startswith("Release held: T4 GPU failed on "))][0].number // empty')
                  [ -z "$open" ] || gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment \
                      "The T4 passed on ${SHA} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}); this train releases everything that was held."

            - uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            # The version commit must sit on the tree the lanes tested.
            - name: Check out the green commit
              env:
                  SHA: ${{ needs.pick.outputs.sha }}
              run: git checkout --quiet --detach "$SHA"

            # The tested builds, kept in this run for 30 days under the commit's name, so the publish job finds
            # them however long the pull request waits in the queue (CI keeps its own copy for one day).
            - name: Download the green commit's builds
              uses: actions/download-artifact@v4
              with:
                  pattern: "build-{graph-format,graph-io,webgpu-graph-algorithms,graph-samples,algorithms,layout,graphty,graphty-element,remote-logger,compact-mantine}"
                  path: ${{ runner.temp }}/builds
                  run-id: ${{ needs.pick.outputs.ci_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Keep the builds for the publish job
              uses: actions/upload-artifact@v4
              with:
                  name: release-builds-${{ needs.pick.outputs.sha }}
                  path: ${{ runner.temp }}/builds
                  retention-days: 30
                  if-no-files-found: error

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # A package listed in release-hold.json is left out of nx.json's release.projects in this checkout, so
            # it is neither versioned nor published -- not even as a dependent of a package that is released. An ad
            # hoc release with `packages` holds every other project too. nx commits only the manifests and
            # changelogs it wrote, never this nx.json edit. To stop one package, add it to release-hold.json; never
            # disable this workflow (CLAUDE.md, "Release versioning").
            - name: Leave out the held packages
              env:
                  PACKAGES: ${{ inputs.packages }}
              run: |
                  if [ -n "${PACKAGES// /}" ]; then
                      node tools/release-hold.mjs apply --only "$PACKAGES"
                  else
                      node tools/release-hold.mjs apply
                  fi

            # Version and changelogs only, as one commit. The tags and the GitHub releases wait for the merge (the
            # publish job), so a pull request that never merges leaves nothing behind; nothing is pushed by nx.
            - name: Version the packages
              id: version
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  jq '.release.git.tag = false | .release.git.push = false
                      | .release.changelog.projectChangelogs.createRelease = false' nx.json > "$RUNNER_TEMP/nx.json"
                  cp "$RUNNER_TEMP/nx.json" nx.json
                  pnpm exec nx release --skip-publish --verbose
                  if [ "$(git rev-parse HEAD)" = "$SHA" ]; then
                      echo "::notice::nothing to release since the last release"
                      echo "commit=" >> "$GITHUB_OUTPUT"
                  else
                      echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  SHA: ${{ needs.pick.outputs.sha }}
                  # the changelog renderer looks up commit authors' GitHub handles
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HUSKY: "0"

            # The release pull request gets no full CI: its code is the commit every lane already passed. What is
            # checked is that the version commit adds nothing else, and that its title is a valid commit message.
            # Those two results are reported under the names master's ruleset requires; a pull request opened with
            # GITHUB_TOKEN starts no workflow of its own. Any later push to the branch (Mergify bringing it up to
            # date, a person) starts CI and Lint PR Title as usual, and they report on the new head.
            - name: Open the release pull request
              if: ${{ steps.version.outputs.commit != '' }}
              env:
                  SHA: ${{ needs.pick.outputs.sha }}
                  COMMIT: ${{ steps.version.outputs.commit }}
                  CI_RUN: ${{ needs.pick.outputs.ci_run_id }}
                  PACKAGES: ${{ inputs.packages }}
              run: |
                  set -euo pipefail
                  node tools/release-diff.mjs "$SHA" "$COMMIT"
                  title="chore(release): publish"
                  printf '%s\n' "$title" | pnpm exec commitlint
                  branch="release/train-${GITHUB_RUN_ID}"
                  git push origin "${COMMIT}:refs/heads/${branch}"
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  kind=daily
                  [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || kind="ad hoc"
                  {
                      echo "The ${kind} release train versions ${SHA}, the newest master commit green on CI and Hosts (CI run ${CI_RUN}), after the T4 GPU lane passed on it in ${run_url}."
                      [ -z "${PACKAGES// /}" ] || echo "Only these packages are released: ${PACKAGES}."
                      echo
                      echo "Releases:"
                      git log -1 --format=%b "$COMMIT" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/- \1 \2/p'
                      echo
                      echo "This pull request changes only version fields and changelogs (tools/release-diff.mjs). When it merges, release.yml tags each package, creates its GitHub release and publishes it to npm from that commit's tested build. Opened by ${run_url}."
                  } > "$RUNNER_TEMP/body.md"
                  gh pr create --base master --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
                  for context in "All Checks Pass" "Lint PR Title"; do
                      gh api "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT}" -f state=success -f context="$context" \
                          -f description="release train: versions and changelogs only, on a commit green on every lane and the T4" \
                          -f target_url="$run_url" >/dev/null
                  done

    # Runs on the push that merges a release pull request: Mergify's merge commit names the release branch.
    publish:
        name: Publish the release
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '/release/train-') }}
        runs-on: ubuntu-24.04
        concurrency:
            group: release-publish
        permissions:
            actions: read
            contents: write
            id-token: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # The version commit this push brought onto master, and the green commit below it. Its builds must be
            # the ones a train run on master kept: that ties the publish to a commit the train found green.
            - name: Find the version commit
              id: commit
              env:
                  BEFORE: ${{ github.event.before }}
              run: |
                  set -euo pipefail
                  mapfile -t found < <(git log --no-merges --format=%H --grep='^chore(release): publish' "${BEFORE}..${GITHUB_SHA}")
                  [ "${#found[@]}" = 1 ] || { echo "::error::expected one version commit in ${BEFORE}..${GITHUB_SHA}, found ${#found[@]}"; exit 1; }
                  commit=${found[0]}
                  sha=$(git rev-parse "${commit}^1")
                  node tools/release-diff.mjs "$sha" "$commit"
                  run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-builds-${sha}" --jq '
                      [.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "master"
                          and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id] | first // empty')
                  [ -n "$run" ] || { echo "::error::no train run on master kept builds for ${sha}"; exit 1; }
                  echo "publishing ${commit} (versions on ${sha}) with the builds of train run ${run}"
                  git checkout --quiet --detach "$commit"
                  { echo "commit=${commit}"; echo "run=${run}"; echo "sha=${sha}"; } >> "$GITHUB_OUTPUT"

            - name: Download the tested builds
              uses: actions/download-artifact@v4
              with:
                  name: release-builds-${{ steps.commit.outputs.sha }}
                  path: ${{ runner.temp }}/builds
                  run-id: ${{ steps.commit.outputs.run }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Put each build in its package
              run: |
                  for dir in "$RUNNER_TEMP"/builds/build-*; do
                      pkg=${dir##*/build-}
                      mkdir -p "${pkg}/dist"
                      cp -a "${dir}/." "${pkg}/dist/"
                  done

            - uses: pnpm/action-setup@v4

            # Note: Do NOT set registry-url - it interferes with OIDC trusted publishing
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "pnpm"

            # Upgrade npm to 11.5.1+ for OIDC trusted publishing support.
            #
            # Pinned to 11 rather than latest. nx builds its pnpm publish command as `pnpm publish ...
            # --no-git-checks`, and pnpm forwards that flag to npm even though pnpm owns it. npm read unknown
            # config as a warning through 11.x and made it fatal in 12.0.0 (2026-07-08), so `npm@latest` fails
            # every publish with EUNKNOWNCONFIG: Unknown cli flag: --git-checks. Drop the pin once pnpm stops
            # forwarding the flag or nx stops passing it.
            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@11
                  npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: "0"

            # One tag and one GitHub release per package the version commit lists, on the version commit; its
            # notes are the changelog section nx wrote. nx reads these tags (`git tag --merged`) to find each
            # package's last version next time. A re-run skips the releases that exist already.
            - name: Tag the release
              id: tags
              env:
                  COMMIT: ${{ steps.commit.outputs.commit }}
              run: |
                  set -euo pipefail
                  projects=()
                  while read -r project version; do
                      projects+=("$project")
                      tag="${project}@${version}"
                      if gh release view "$tag" >/dev/null 2>&1; then echo "${tag} exists already"; continue; fi
                      root=$(pnpm exec nx show project "$project" --json | jq -r .root)
                      git diff -U0 "${COMMIT}^1" "$COMMIT" -- "${root}/CHANGELOG.md" | sed -n '/^+++/d; s/^+//p' > "$RUNNER_TEMP/notes.md"
                      gh release create "$tag" --target "$COMMIT" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
                  done < <(git log -1 --format=%b "$COMMIT" | sed -n 's/^- project: \([^ ]*\) \([^ ]*\)$/\1 \2/p')
                  [ "${#projects[@]}" -gt 0 ] || { echo "::error::${COMMIT} lists no released project"; exit 1; }
                  echo "projects=$(IFS=,; echo "${projects[*]}")" >> "$GITHUB_OUTPUT"

            - name: Publish
              run: |
                  # `nx release publish` publishes the versions in the manifests and asks the registry per
                  # package, skipping any version already there, so re-running this job after a failed publish
                  # ships only what is missing. --nxBail=false: one package's failed publish never stops the
                  # packages behind it.
                  #
                  # A failed publish does not fail this step: the next step, which polls the registry, decides.
                  # npm answers a retry inside its propagation window (up to about 7.5 minutes after it accepted
                  # an upload) with E409 "Cannot publish over previously staged version" (npm/cli#9889), which
                  # failed the 3.1.0 release although every version it refused was already published.
                  pnpm exec nx release publish --projects="$PROJECTS" --nxBail=false ||
                      echo "::warning::nx release publish reported a failure; the registry check below decides"
              env:
                  PROJECTS: ${{ steps.tags.outputs.projects }}
                  # OIDC trusted publishing: npm uses the GitHub Actions OIDC token (id-token: write above).
                  NPM_CONFIG_PROVENANCE: true
                  # Clear any NODE_AUTH_TOKEN that might interfere with OIDC
                  NODE_AUTH_TOKEN: ""
                  HUSKY: "0"

            # npm can accept a publish and still not serve it, and nx release publish skips any package whose
            # dependency failed. So the last word is the registry: every non-private package's version at the
            # version commit must be installable. npm takes a while to serve a fresh version (up to about 7.5
            # minutes), hence the bounded poll (20 tries, 30 s apart).
            - name: Check every version is on npm
              run: |
                  missing() {
                      pnpm -r ls --depth -1 --json | jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"' |
                          while read -r spec; do
                              [ "$(npm view "$spec" version 2>/dev/null)" = "${spec##*@}" ] || echo "$spec"
                          done
                  }
                  for try in $(seq 1 20); do
                      absent=$(missing)
                      [ -n "$absent" ] || { echo "every package version is on npm"; exit 0; }
                      echo "try ${try}: not on npm yet: ${absent//$'\n'/ }"
                      sleep 30
                  done
                  for spec in $absent; do echo "::error::${spec} is versioned on master but not on npm; re-run this job to publish it"; done
                  exit 1
