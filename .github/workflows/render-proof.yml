name: Render proof

# The whole of the render-parity and forced-batched test projects of graphty-element
# (design/rendering/row-renderer.md 7). By dispatch on a branch only: it gates nothing. A pull request runs only
# the forced-batched files its change selects, when it touches a browser test or the render path; the full run
# runs the whole of forced-batched too, in twelve shards
# (graphty-element-forced-batched-<n>, tools/ci-test-matrix.mjs), so this adds render-parity. Stages 11, 13 and 16 cite its run in
# their Proof.

on:
    workflow_dispatch:

permissions:
    contents: read

env:
    # Chromium crashes at launch (SIGSEGV) unless this is preset: see vitest.base.mjs (#3787).
    FC_FONTATIONS: "1"
    # Bounds a failed cache restore's wait to one minute instead of ten (#5098; see ci.yml).
    SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
    proof:
        name: ${{ matrix.run.name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                # forced-batched in the full run's shape: the same twelve shards (ELEMENT_BROWSER_PARTS in
                # tools/ci-test-matrix.mjs) and no GPU flags, so a green run here is a green full run, and a crash in
                # one file ends one shard rather than the whole project.
                run:
                    - {
                          name: render-parity webgl,
                          project: render-parity,
                          renderer: webgl,
                          gpu: swiftshader,
                          shard: "",
                      }
                    - {
                          name: render-parity webgpu,
                          project: render-parity,
                          renderer: webgpu,
                          gpu: swiftshader,
                          shard: "",
                      }
                    - { name: forced-batched 1, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=1/12 }
                    - { name: forced-batched 2, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=2/12 }
                    - { name: forced-batched 3, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=3/12 }
                    - { name: forced-batched 4, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=4/12 }
                    - { name: forced-batched 5, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=5/12 }
                    - { name: forced-batched 6, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=6/12 }
                    - { name: forced-batched 7, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=7/12 }
                    - { name: forced-batched 8, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=8/12 }
                    - { name: forced-batched 9, project: forced-batched, renderer: webgl, gpu: "", shard: --shard=9/12 }
                    - {
                          name: forced-batched 10,
                          project: forced-batched,
                          renderer: webgl,
                          gpu: "",
                          shard: --shard=10/12,
                      }
                    - {
                          name: forced-batched 11,
                          project: forced-batched,
                          renderer: webgl,
                          gpu: "",
                          shard: --shard=11/12,
                      }
                    - {
                          name: forced-batched 12,
                          project: forced-batched,
                          renderer: webgl,
                          gpu: "",
                          shard: --shard=12/12,
                      }
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: false
            # forced-batched runs oracle-scorecard.test.ts, which decodes these Git LFS pictures.
            - name: Fetch the style fidelity oracle pictures from Git LFS
              if: matrix.run.project == 'forced-batched'
              run: git lfs pull --include "$(node -p "require('./graphty-element/test/browser/oracle-scorecard-samples.json').map((id) => 'graph-io/test/fidelity/oracles/' + id + '.png').join(',')")"
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with: { node-version: 22.x, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec nx run graphty-element:build
            - uses: ./.github/actions/drop-microsoft-apt-source
            - run: pnpm exec playwright install --with-deps chromium
              working-directory: graphty-element
            - run: pnpm exec vitest run --project=${{ matrix.run.project }} ${{ matrix.run.shard }}
              working-directory: graphty-element
              env:
                  GRAPHTY_BROWSER_GPU: ${{ matrix.run.gpu }}
                  VITE_PARITY_RENDERER: ${{ matrix.run.renderer }}
