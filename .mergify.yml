# Mergify merges this repository's pull requests (https://docs.mergify.com).
#
# A pull request into master is queued for merging when it is ready, so nobody has to switch on
# auto-merge by hand. Mergify then keeps it up to date with master and merges it once the required
# checks pass on the updated branch. "All Checks Pass" includes the visual-review gate, so nothing
# merges with an image the owner has not approved.
#
# Held, never queued:
# - a breaking change (a "!" before the colon of a conventional-commit title, e.g. "feat(x)!: ...");
#   breaking changes wait for the grouped major release;
# - a pull request labeled "hold";
# - a draft.
# One check at a time, so Mergify checks each pull request in place on its own branch (see below).
merge_queue:
    max_parallel_checks: 1

# A fix for a red master goes first: label it "priority:critical". It jumps the queue and, since the
# queue checks one pull request at a time, interrupts the one being checked, which re-queues behind it.
priority_rules:
    - name: fix for a red master
      conditions:
          - label=priority:critical
      priority: high
      allow_checks_interruption: true

queue_rules:
    # The release pull request that release.yml opens (its priority:critical label puts it first).
    # Listed before "default", so it takes this rule: alone, and merged with a merge commit, whose
    # message names the release branch and so starts release.yml's publish job.
    - name: release
      batch_size: 1
      update_method: merge
      merge_method: merge
      queue_conditions:
          - head~=^release/train-
          - author=github-actions[bot]
          - label!=hold

    - name: default
      # One pull request at a time, checked in place on its own branch: the visual-review gate is
      # tied to the pull request's number, so a batch on a temporary branch would never pass it.
      batch_size: 1
      update_method: merge
      merge_method: merge
      # Checked for as long as a pull request is queued: adding "hold" (or retitling it as a breaking
      # change) takes an already-queued pull request out of the queue.
      queue_conditions:
          - label!=hold
          - "-title~=^[a-z]+(\\([^)]*\\))?!:"
      # No merge_conditions: Mergify checks a pull request in place only when the queue is
      # single-step (merge_conditions empty or equal to queue_conditions). With them it tested a
      # temporary draft pull request instead, whose title fails Lint PR Title and whose number the
      # visual-review gate does not know. The ruleset's required checks (All Checks Pass, Lint PR
      # Title) are added to the queue conditions by Mergify on its own.

# Merge Protections' auto-merge puts a pull request into the queue once it matches these conditions;
# the queue's own queue_conditions still gate it. (pull_request_rules would need Mergify's Workflow
# Automation product, which this repository does not use.)
merge_protections_settings:
    auto_merge_conditions:
        - base=master
        - -draft
        - -conflict
        - label!=hold
        - "-title~=^[a-z]+(\\([^)]*\\))?!:"
