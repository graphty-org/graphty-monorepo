# Mergify merges this repository's pull requests (https://docs.mergify.com).
#
# A pull request into master is queued for merging when it is ready, so nobody has to switch on
# auto-merge by hand. Mergify then keeps it up to date with master and merges it once the required
# checks pass on the updated branch. "All Checks Pass" includes the visual-review gate, so nothing
# merges with an image the owner has not approved.
#
# Held, never queued:
# - a breaking change (a "!" before the colon of a conventional-commit title, e.g. "feat(x)!: ...");
#   breaking changes wait for the grouped major release;
# - a pull request labeled "hold";
# - a draft.
# Batches: up to 4 ready pull requests are tested together on a temporary draft pull request, which
# runs the full suite on the combined tree ("Queue Checks Pass"). The batch grows with the backlog and
# waits at most 5 minutes to fill. Two batches are checked at once. A failing batch is split and
# retried in halves (bisection) until the culprit is found; nothing is retried as-is. The visual gate
# accepts a batch: it passes only when every capture equals an image the owner approved on one of the
# batch's pull requests (visual-review/trusted/gate.mjs, --queue-event).
merge_queue:
    max_parallel_checks: 2

# Two kinds of pull request go to the front of the queue: the daily release train (its branch and author,
# not a label) and a fix for a red master (label it "priority:critical"). Neither interrupts the batches
# already being checked: it takes the next free slot instead, so a running batch is never thrown away and
# re-run. A fix for a red master therefore waits for at most one in-flight batch (about 40 minutes).
priority_rules:
    - name: release train
      conditions:
          - head~=^release/train-
          - author=github-actions[bot]
      priority: high
      allow_checks_interruption: false

    - name: fix for a red master
      conditions:
          - label=priority:critical
      priority: high
      allow_checks_interruption: false

queue_rules:
    # The release pull request that release.yml opens (the "release train" priority rule puts it first).
    # Listed before "default", so it takes this rule: checked alone, never batched with other pull
    # requests, and merged with a merge commit, whose message names the release branch and so
    # starts release.yml's publish job. Like a batch, it merges only after the full suite passed
    # on top of master.
    - name: release
      batch_size: 1
      max_checks_retries: 0
      update_method: merge
      merge_method: merge
      queue_conditions:
          - head~=^release/train-
          - author=github-actions[bot]
          - label!=hold
      merge_conditions:
          - check-success=Queue Checks Pass

    - name: default
      batch_size:
          min: 1
          max: 4
      batch_max_wait_time: 5 min
      max_checks_retries: 0
      update_method: merge
      merge_method: merge
      # Checked for as long as a pull request is queued: adding "hold" (or retitling it as a breaking
      # change) takes an already-queued pull request out of the queue. A pull request enters only
      # once its own CI passed; the ruleset's required checks (All Checks Pass, Lint PR Title) are
      # added here by Mergify on its own.
      queue_conditions:
          - label!=hold
          - "-title~=^[a-z]+(\\([^)]*\\))?!:"
          # The T4 GPU lane (gpu.yml, design/ci/ci-cd-plan.md section 4): "T4 GPU gate" passes once the T4
          # passed for a pull request that affects webgpu-graph-algorithms, and at once for one that does not.
          # A pull request whose every file sits outside the GPU package's dependencies (the directories below;
          # tools/ci-workflows.test.mjs checks the list against the package graph) does not wait for the gate.
          - or:
                - check-success=T4 GPU gate
                - "-files~=^(?!(graphty-element|graphty|graph-io|remote-logger|compact-mantine|visual-review|visual-baselines|visual-fonts|design|docs)/)"
      # The batch merges only when the full suite passed on the combined tree.
      merge_conditions:
          - check-success=Queue Checks Pass

# Merge Protections' auto-merge puts a pull request into the queue once it matches these conditions;
# the queue's own queue_conditions still gate it. (pull_request_rules would need Mergify's Workflow
# Automation product, which this repository does not use.)
merge_protections_settings:
    auto_merge_conditions:
        - base=master
        - -draft
        - -conflict
        - label!=hold
        - "-title~=^[a-z]+(\\([^)]*\\))?!:"
