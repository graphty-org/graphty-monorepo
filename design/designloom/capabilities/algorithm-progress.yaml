id: algorithm-progress
name: Algorithm Progress Indication
category: performance
description: Report progress while a long algorithm or layout runs, matched to how long it is expected to take (a
    looped indicator for short waits, percent done and a rough time estimate for long ones), let the user stop it, and
    keep the interface responsive meanwhile.
status: planned
algorithms: []
