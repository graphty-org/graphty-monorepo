id: all-paths-finding
name: All Paths Finding
category: analysis
description: Answer "how do A and B connect?" beyond one shortest path -- all shortest paths with their ties, k
    shortest loopless paths, and bounded enumeration of simple paths -- constrained by edge type, direction and a hop
    limit, between single nodes or node sets, with the "no path" result and its reason and the weight convention used.
status: planned
algorithms:
    - depth-first-search
    - breadth-first-search
    - yen-k-shortest-paths
used_by_workflows:
    - W05
    - W06
    - W105
    - W108
    - W109
