    - path-finder-dialog
requirements:
    - "Must: Offer the path queries the research found in use, each as its own mode - all shortest paths (every tie), k shortest loopless paths (Yen), and all simple paths up to a hop limit"
    - "Must: For k shortest paths, state how ties at the k-th position are handled; Cypher picks among them arbitrarily"
    - "Must: Require a maximum hop count for simple-path enumeration (the number of simple paths can grow as O(n!)); the hop limit is a user choice with no fixed range (Bloom bounds shortest path at 20 hops, Linkurious templates default to 4 and allow 10, Defender blast radius stops at 7)"
    - "Must: Constrain paths by edge type (typed or metapath patterns), by direction or ignoring direction, and through required waypoint nodes"
    - 'Must: Accept a source set and a target set (for example "owned" to "Tier Zero"), not only two single nodes, and allow the search to run in reverse'
    - "Must: When paths are weighted, state whether the weight is read as a distance or as a strength and which conversion was used (weight-semantics); never leave the convention unlabeled"
    - "Must: Return paths ordered by length, or by summed or combined edge weight when the user ranks by weight"
    - "Must: Return the total path count with the list, and cap the number returned with a stated, adjustable cap; report that the cap was reached rather than silently truncating"
    - 'Must: Return "no path" with its reason as a code - different components, blocked by direction, blocked by edge type or time, or none within the hop limit'
    - "Library parity: Report which nodes appear in many of the returned paths (for example choke points) as counts per node; the application decides which to emphasize"
    - "Library parity: Report progress on long enumerations and let the user stop them, returning the paths found so far marked as partial (algorithm-progress)"
    - "Library parity: Let a selected path in the list select and highlight it in the drawing (path-highlighting)"
    - "Must: List each path node by node, deduplicated, and export the list with each path's id, length, weight and node sequence, and a chronological hop table when edges carry time"
    - "Library parity: Time-respecting paths are out of scope here; static paths overstate reachability on temporal data (temporal-and-dynamic-networks.md)"
sources:
    - title: NetworkX all_simple_paths
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.simple_paths.all_simple_paths.html
      summary: Enumerates simple paths with a cutoff depth; the number of simple paths can be O(n!), so large graphs
          may run for a very long time
    - title: NetworkX shortest_simple_paths
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.simple_paths.shortest_simple_paths.html
      summary:
          k shortest loopless paths (Yen), cited in design/user-research/network-scientists-and-analysis-method-validity.md
          (Workflow D, requirement R12)
    - title: Neo4j Cypher manual, shortest paths
      url: https://neo4j.com/docs/cypher-manual/current/patterns/shortest-paths/
      summary: ALL SHORTEST and SHORTEST k; when k cuts through a tie the choice is arbitrary
    - title: Neo4j Bloom scene interactions
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-visual-tour/bloom-scene-interactions/
      summary: Shortest path between two selected nodes, bounded at 20 hops (graph-database-query-and-expand-exploration.md)
    - title: Linkurious user manual
      url: https://doc.linkurious.com/user-manual/latest/page.html
      summary: Path query templates with a hop limit, default 4 and at most 10 (graph-database-query-and-expand-exploration.md)
    - title: Microsoft Defender XDR, investigate incidents
      url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
      summary: Blast radius shows top-rated paths to critical targets, at most seven hops; source-set to target-set path
          queries are a Must in cybersecurity-graph-work.md
    - title: Holme and Saramaki 2012, Temporal networks
      url: https://arxiv.org/abs/1108.1780
      summary: Time-respecting paths are not transitive; static aggregation overstates reachability
