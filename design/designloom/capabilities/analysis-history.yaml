requirements:
    - "Must: Record each step with an ISO 8601 timestamp and its type (import, filter, layout, algorithm run, style change, hand edit, selection or view change)"
    - "Must: For every algorithm and layout run, record the method, every parameter value, the software and package versions, and the seed actually used, including the random seed drawn when none was passed (seeded-runs, layout-force-directed)"
    - "Must: Record which edge-weight convention a run used (distance or strength, and any conversion) (weight-semantics)"
    - "Must: Record each import's settings and counts (import log), the data source and its version, and the thresholds applied, so the whole pipeline from file to figure is in the record"
    - "Must: Record a structured result summary for each run (for example community count, quality function and score) as values and codes; the application writes any sentence"
    - "Must: Mark which steps an assistant or automation made, so the user can disclose them"
    - "Must: Show the steps in order with the current position marked; preview a past state and restore it, working together with undo-redo for step-by-step undo and redo"
    - "Must: Export the record as structured data with all parameters, as a methods paragraph or legend block (source and version, filters, algorithms, layout and seed, time window, date), and as a script that re-runs the steps"
    - "Must: Replay a saved record on the same data or on a new version of it, reporting any step that cannot apply"
    - "Must: Save the record inside the session file so it survives closing and reopening (session-round-trip); warn before discarding unsaved history"
    - "Library parity: Clearing the history asks for confirmation, since it cannot be undone"
    - "Library parity: Any cap on the number of stored steps is a design goal to be measured, not a sourced requirement"
sources:
    - title: Heer et al. 2008, Graphical histories for visualization
      url: https://doi.org/10.1109/TVCG.2008.137
      summary: History of visualization states for revisiting, comparing and sharing analysis steps; cited for this
          record in design/user-research/data-preparation-and-import.md
    - title: Gephi FAQ
      url: http://gephi.org/faq/
      summary: Gephi has no undo; students-educators-and-first-time-users.md lists undo of every step and an
          exportable methods record (steps, settings, versions, assistant-made steps) as Musts
    - title: igraph cluster_leiden
      url: https://r.igraph.org/reference/cluster_leiden.html
      summary: Its own example sets a seed "for sake of reproducibility"; the research requires every run to record
          the seed it used (network-scientists-and-analysis-method-validity.md)
    - title: NetworkX spring_layout
      url: https://networkx.org/documentation/stable/reference/generated/networkx.drawing.layout.spring_layout.html
      summary: Layouts start from random positions unless seeded, so the seed must be recorded to reproduce a drawing
    - title: GraphSense paper
      url: https://arxiv.org/pdf/2102.13613
      summary: Investigators annotate nodes, export graphs and download audit logs of their interactions
          (law-enforcement-and-intelligence-analysts.md)
