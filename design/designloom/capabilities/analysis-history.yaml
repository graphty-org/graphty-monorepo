id: analysis-history
name: Analysis History
category: collaboration
description: Keep a methods record of the analysis -- every import, filter, layout, algorithm and style step with its
    parameters, seed, software versions and result -- that the user can browse, revisit, export as a methods text or
    script, and replay, so a figure or finding can be reproduced and its settings travel with it. Undo and redo of
    individual steps is undo-redo's job; this record is what they move through.
