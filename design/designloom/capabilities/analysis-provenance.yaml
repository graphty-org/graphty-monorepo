id: analysis-provenance
name: Analysis Provenance Record
category: analysis
description: Algorithm, version, parameters, seed, weight convention, null, layout settings and dataset hash recorded
    per result and exportable with figures, with a recipe that reproduces the analysis in igraph or NetworkX. Extends
    analysis-history, which lacks parameters and seeds. Also records the filters and
    thresholds (and the items they excluded) behind an exported figure or table, as vendor DNA autocluster reports do in
    their ReadMe.
