requirements:
    - Record every parameter of a map (sources, query, dates, counting, thresholds, normalization, layout, clustering
      resolution, seeds, thesaurus) as structured data that exports as a methods-section list and reruns to the same
      result.
    - Export the ordered list of steps, settings, seeds, data source and software versions, with steps made by an
      assistant marked, for a methods section or an AI-use disclosure.
    - Record and export every parameter that shaped a graph (source database and version, access date, confidence
      cutoff, k, TopK, cosine, resolution, edge threshold, enrichment background) as a methods paragraph and as data.
    - Generate a parameters block (data source and version, filters, algorithms and their settings, layout and seed,
      time window, date) as legend text and a methods paragraph that stays in sync with the current view.
    - Export the parameters behind a view (scope, caps, filters, merges, hidden nodes, contributing sources) alongside
      the image or edge list.
    - Record how a graph was built (unit, window, measure, threshold, vocabulary, coder, collocation parameter notation)
      with the graph and every exported figure.
