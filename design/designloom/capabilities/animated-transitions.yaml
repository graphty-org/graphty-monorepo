requirements:
    - "Library parity: Animate node positions from the old layout to the new one when the layout or its parameters change"
    - "Library parity: Fade nodes and edges out when a filter removes them and in when it restores them"
    - "Library parity: Animate expansion outward from the expanded node and collapse back into it"
    - "Library parity: Animate camera zoom and pan rather than jumping"
    - "Library parity: Expose duration and easing for each kind of transition as options; any default duration is a design choice recorded as such, since no source in the research sets one"
    - "Library parity: Allow staging a complex change (for example remove, then move, then add) rather than doing everything at once"
    - "Library parity: Honor the reader's prefers-reduced-motion setting, and offer an option that turns all transition motion off (instant changes) for any consumer, such as an embedded or published view"
    - "Library parity: When a new transition targets the same elements or property, replace the running one from its current state instead of jumping back to its start"
    - "Library parity: Report when a transition finishes, so a consumer can wait for it (for example before capturing an image)"
    - "Library parity: Keep transitions separate from temporal playback; time-based animation and video or HTML export with fixed timing belong to temporal-analysis and export"
sources:
    - title: Heer and Robertson 2007, Animated transitions in statistical data graphics
      url: https://doi.org/10.1109/TVCG.2007.70539
      summary: Studied animated and staged transitions between data graphics; cited for this record in
          design/user-research/data-preparation-and-import.md
    - title: Yee et al. 2001, Animated exploration of dynamic graphs with radial layout
      url: https://doi.org/10.1109/INFVIS.2001.963279
      summary: Animated transitions between graph layouts that keep the reader oriented
    - title: WCAG 2.2, Understanding 2.3.3 Animation from Interactions
      url: https://www.w3.org/WAI/WCAG22/Understanding/animation-from-interactions.html
      summary: Motion animation triggered by interaction can be disabled unless essential
    - title: MDN, prefers-reduced-motion
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion
      summary: The browser signal for a reader's reduced-motion preference
    - title: WCAG 2.2, Understanding 2.2.2 Pause, Stop, Hide
      url: https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html
      summary: Moving content that starts automatically needs a way to pause, stop or hide it;
          communicating-findings-and-deliverables.md R11 requires embeddable exports with motion off
