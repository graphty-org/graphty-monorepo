id: animated-transitions
name: Animated Transitions
category: visualization
description: Animate changes to the drawing (layout changes, filtering, expansion and collapse, camera moves) so the
    reader can follow elements from old to new positions, with duration and easing as options, and motion that can
    be turned off, following the reader's reduced-motion preference.
status: in-progress
notes: "Partly ships: animated layout transitions in graphty-element/src/transitions/ with a duration, and the layout transition row graphty/src/workspace/layout/TransitionRow.tsx; the app reads the reader's reduced-motion setting. Planned: filter fades, expansion and collapse animation, staged changes, easing options per transition kind and a finished event. Any requirement below that this note does not name as shipping counts as planned."
