id: annotation-coverage-flags
name: Annotation coverage beside scores
category: analysis
description: Show, per node, how many edges the source database records for it and how many of those neighbors were
    measured, and flag nodes below a chosen count, so a score resting on few known relationships, or a hub that is
    only well studied, is visible as such.
