id: annotation
name: Visualization Annotation
category: export
description: Two kinds of annotation the research found -- an annotation layer on the drawing (text, arrows, callouts,
    zones) that explains a finding and survives export, and notes attached to nodes and edges with author and date
    that are kept as data in the project and exported with it.
