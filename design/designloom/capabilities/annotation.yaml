requirements:
    - "Must: Add text labels, arrows, callouts with leader lines to nodes or edges, and zones (circle, rectangle, freeform outline) to the drawing"
    - "Library parity: Style annotations (text size, color, weight, fill and outline with opacity) through options; no source sets particular sizes or defaults"
    - "Library parity: Anchor each annotation either to nodes or edges (it follows them when the layout changes) or to a fixed place in the view"
    - "Library parity: Select, move, resize, edit and delete annotations with the pointer and the keyboard, and set their order relative to graph elements"
    - "Must: Show or hide the whole annotation layer, and keep annotations with the view bookmark they belong to (view-bookmarks), so a sequence of captioned views can be presented and published in order"
    - "Must: Include annotations in image and vector exports (PNG, SVG, PDF) as editable text where the format allows (export-image)"
    - "Should: Offer close-up insets and a mark for claims that are not yet confirmed, for evidence-grade figures"
    - "Must: Attach notes to nodes and edges with author and date, kept in the project file and visible in the details view"
    - "Should: Allow structured per-item annotation (for example a rating or a code) and export annotations as CSV or with the data, keyed by the original ids (data-export)"
    - "Library parity: Keep free-text notes distinct from provenance; source, confidence and verification status per claim belong to provenance-tracking"
    - "Library parity: Any limit on text length or annotation count is a design goal to be measured, not a sourced requirement"
sources:
    - title: Cambridge Intelligence Investigation Workflow
      url: https://cambridge-intelligence.com/investigation-workflow-annotations/
      summary: Annotations improve investigation workflow and reveal data narrative
    - title: RekomGNN usage scenario
      url: https://arxiv.org/html/2310.11562
      summary: Analysts rate questionable recommendations item by item and export the annotations as CSV
          (code-first-data-scientists-and-graph-ml.md); communicating-findings-and-deliverables.md separately makes an
          exportable annotation layer of text, arrows, callouts and zones a must (R9)
    - title: GraphSense paper
      url: https://arxiv.org/pdf/2102.13613
      summary:
          Investigators annotate nodes, export graphs and download audit logs (law-enforcement-and-intelligence-analysts.md);
          investigative-journalism-and-osint.md R17 makes dated, authored notes on nodes and edges a Must
    - title: Obsidian forum, How do you use the graph view
      url: https://forum.obsidian.md/t/how-do-you-use-the-graph-view/
      summary: Graph views are shared as screenshots, sometimes annotated in a separate drawing app
          (personal-knowledge-graphs-and-note-networks.md)
