id: attribute-band-filter
name: "Two-ended band filter on a node attribute"
category: interaction
description: "Filter nodes by a floor and a ceiling on a numeric attribute at the same time, applied live, with the surviving node and edge counts shown. Genetic genealogy filters matches to a band (more than 90 and less than 400 centimorgans; 50 to 400; 65 to 1,300) because close relatives connect to every cluster and distant ones add random edges; today the band is fixed at download time, so changing it costs hours."
status: planned
notes: "Research trace: genetic-genealogy-dna-match-networks.md section 10, table row 3 (Must)."
