requirements:
    - "Should: Derived-graph and backbone builder: correlation matrix to graph by proportional or absolute threshold;
      disparity filter for weighted one-mode graphs; SDSM or FDSM backbone for projections; signed weights"
    - "Must: Cut a dense weighted network to a readable backbone by a fixed weight cutoff, a per-node relative rule (each node's strongest k percent of ties, mutual or not), or a null-model significance filter, with tie count, density and community count updating live and the chosen rule recorded alongside every figure and measure."
    - "Must: Disparity-filter or threshold backbone for display while metrics use the full network, with node positions fixed across periods."
    - "Must: Top-N edges, minimum weight, minimum spanning tree, disparity filter and k nearest neighbors, always reporting drawn-of-total node and edge counts."
