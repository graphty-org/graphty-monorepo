requirements:
    - "Must: Calculate total node count as an integer"
    - "Must: Calculate total edge count as an integer"
    - "Library parity: Calculate graph density as edges / (n*(n-1)/2) for undirected, edges / (n*(n-1)) for directed"
    - "Must: Calculate average degree"
    - "Library parity: Calculate minimum degree and identify node(s) with minimum"
    - "Library parity: Calculate maximum degree and identify node(s) with maximum"
    - "Must: Report the number of connected components and the giant component's size and share of nodes"
    - "Must: Treat directedness, weight meaning, parallel edges and self-loops as a recorded representation decision (representation-transparency): report what was inferred from the data and let the caller change it"
    - "Must: Report the self-loop count and the parallel-edge count, and how each was counted"
    - "Must: Calculate diameter and average path length on the giant component, with its share of nodes stated; never return an error or 'infinite' for a disconnected graph"
    - "Must: Offer global efficiency (mean of 1/d over node pairs), which is defined on any graph"
    - "Library parity: Report global transitivity and average local clustering as two named values"
    - "Library parity: Return values at full precision; rounding and labels belong to the application"
    - "Library parity: Report progress on statistics that take noticeable time, and support cancelling them"
    - "Library parity: Return an 'empty graph' code, not an error, when node count is 0"
sources:
    - title: "Exploring and Analyzing Network Data with Python (Programming Historian)"
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: "First-pass descriptives: density, components, transitivity; nx.diameter fails on a disconnected graph, so take the largest component first"
    - title: "NetworkX global_efficiency"
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.efficiency_measures.global_efficiency.html
      summary: "Mean of 1/d over node pairs, defined on disconnected graphs"
    - title: "Scale-free networks are rare (Broido and Clauset 2019)"
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6399239/
      summary: "Turn every non-simple property (direction, weights, multi-edges) into simple graphs by a stated transformation"
