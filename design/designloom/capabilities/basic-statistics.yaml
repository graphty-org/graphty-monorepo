id: basic-statistics
name: Basic Graph Statistics
category: analysis
description: "Compute the fundamental metrics analysts check first on a new dataset: node and edge counts, density, average degree, connected components and the giant component's share, diameter and average path length on the giant component (or global efficiency, defined on any graph), and global transitivity and average local clustering as two separate values. The representation the numbers describe (directed or not, weights, parallel edges, self-loops) is reported with them."
status: in-progress
notes: "Partly ships: the element's graph values shown in graphty/src/workspace/inspector/GraphValues.tsx (node and edge counts, density, degree). Planned: diameter and average path length on the giant component, global efficiency, self-loop and parallel-edge counts, and an empty-graph code. Any requirement below that this note does not name as shipping counts as planned."
