id: bipartite-projection
name: Two-Mode Data and Projection
category: analysis
description: First-class bipartite data with a two-mode layout, projection to one mode with binary, sum or Newman
    weights, two-mode degree and clustering, and a warning that projection inflates clustering.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
