id: causal-path-analysis
name: Causal path analysis and adjustment sets
category: analysis
description: Use d-separation to classify paths as causal or biasing and as open or closed. Compute ancestor classes,
    minimal adjustment sets (total or direct effect, forced covariates, latents excluded), instruments, implied
