id: centrality-betweenness
name: Betweenness Centrality
category: analysis
description: "Calculate betweenness centrality - how often a node lies on shortest paths between other nodes. High-betweenness nodes act as bridges or brokers, and high-betweenness, low-degree brokers are missed by degree alone. Edge weights are read as distances, so a strength column (counts, volumes) must be converted first; the conventions used (weight reading, normalization, endpoints, sampling seed) are returned with the result, because igraph, NetworkX and Gephi differ on them."
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/BetweennessCentralityAlgorithm.ts runs Brandes on the undirected view with raw, unnormalized path counts, endpoints not counted, progress reports, and an optional Sampled sources count k (the result says it is sampled and how many sources). It reads no edge weight and never follows edge direction. Planned: weights read as distances with recorded conversions, rejection of zero or negative distances, directed shortest paths, normalized values, a seed for the sample, and a cost-based refusal that offers sampling. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Brandes algorithm O(nm) (shipped, undirected and unweighted only)
    - Approximate betweenness sampling (shipped as k sampled sources; seed not yet recorded)
