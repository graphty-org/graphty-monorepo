requirements:
    - "Library parity: Calculate betweenness centrality using Brandes algorithm with O(nm) complexity"
    - "Library parity: Calculate normalized betweenness as raw / ((n-1)*(n-2)/2) for undirected graphs"
    - "Library parity: Calculate normalized betweenness as raw / ((n-1)*(n-2)) for directed graphs"
    - "Library parity: State whether endpoints are counted (not counted by default, as in NetworkX)"
    - "Must: Read the edge weight as a distance (a larger value is a longer edge), as declared in weight-semantics; a column declared a strength is converted first by its recorded conversion (1/w, -log w or max-w), and the result records the column and the conversion used"
    - "Library parity: Reject zero or negative distances with an error code rather than computing"
    - "Must: Handle directed graphs using directed shortest paths"
    - "Library parity: Handle undirected graphs using undirected shortest paths"
    - "Library parity: Report progress on long calculations"
    - "Library parity: Support cancelling long-running calculations"
    - "Library parity: Support approximate betweenness from k sampled source nodes, with k set by the caller; the sample is seeded and k and the seed are recorded with the result"
    - "Library parity: Mark sampled results as approximate in the result"
    - "Library parity: Return an error code with the graph size when an exact calculation is estimated too expensive, and offer the sampled method"
    - "Must: Return the conventions used (normalization, endpoints, weight column and reading, conversion, sample size, seed) as values with the result"
    - "Library parity: Rank nodes by betweenness in descending order"
    - "Library parity: Return values at full precision; rounding and how many nodes to show belong to the application"
    - "Library parity: Store result as node attribute named 'betweenness'"
sources:
    - title: "NetworkX betweenness_centrality"
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.centrality.betweenness_centrality.html
      summary: "Weights are interpreted as distances and must be greater than zero; normalized by 2/((n-1)(n-2)) undirected; endpoints excluded by default; seed used only when k is set"
    - title: "igraph betweenness"
      url: https://r.igraph.org/reference/betweenness.html
      summary: "Uses a weight attribute by default when one exists, so a strength column is silently read as a distance"
    - title: "Gephi GraphDistance.java"
      url: https://github.com/gephi/gephi/blob/master/modules/StatisticsPlugin/src/main/java/org/gephi/statistics/plugin/GraphDistance.java
      summary: "Gephi's betweenness counts hops and never reads an edge weight"
    - title: "Node centrality in weighted networks (Opsahl, Agneessens and Skvoretz 2010)"
      url: https://toreopsahl.com/wp-content/uploads/2010/04/node_centrality_in_weighted_networks1.pdf
      summary: "Weighted centralities and the alpha blend of hop count and weight"
    - title: "Exploring and Analyzing Network Data with Python (Programming Historian)"
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: "High-betweenness, low-degree brokers are missed by degree alone"
