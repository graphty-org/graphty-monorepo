implemented_by_components:
    - algorithm-card
    - algorithm-panel
requirements:
    - "Library parity: Calculate closeness as (n-1) / sum(shortest_path_lengths) for each node"
    - "Library parity: Calculate normalized closeness scaled to 0-1 range"
    - "Library parity: Handle disconnected graphs using Wasserman-Faust formula: (reachable_nodes-1)^2 / ((n-1) * sum_of_distances), and record the rule used in the result"
    - "Must: Offer harmonic centrality (sum of 1/d, unreachable pairs add 0) as the variant defined on any graph"
    - "Must: Read the edge weight as a distance (a larger value is a longer edge), as declared in weight-semantics; a column declared a strength is converted first by its recorded conversion (1/w, -log w or max-w), and the result records the column and the conversion used"
    - "Library parity: Handle directed graphs with separate in-closeness and out-closeness options, and record which was used"
    - "Library parity: Assign closeness of 0.0 to nodes with no reachable neighbors, and record that rule"
    - "Library parity: Report progress on long calculations"
    - "Library parity: Rank nodes by closeness in descending order"
    - "Library parity: Return values at full precision; rounding and how many nodes to show belong to the application"
    - "Library parity: Store result as node attribute named 'closeness'"
    - "Library parity: Report average closeness for the graph"
    - "Library parity: Identify and flag nodes in disconnected components separately"
sources:
    - title: "NetworkX closeness_centrality"
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.centrality.closeness_centrality.html
      summary: "Scales by the reachable fraction (wf_improved=True), uses inward distance for directed graphs, and reads weights through a distance parameter"
    - title: "igraph closeness"
      url: https://r.igraph.org/reference/closeness.html
      summary: "Weights are interpreted as distances; closeness is meaningful only for connected graphs; unreachable vertices are omitted"
    - title: "Gephi GraphDistance.java"
      url: https://github.com/gephi/gephi/blob/master/modules/StatisticsPlugin/src/main/java/org/gephi/statistics/plugin/GraphDistance.java
      summary: "Gephi divides by the reachable count only, so a node in a two-node component scores the maximum"
    - title: "Axioms for Centrality (Boldi and Vigna)"
      url: https://arxiv.org/pdf/1308.2140
      summary: "Harmonic centrality sums 1/d, handles unreachable pairs, and satisfies all their axioms"
