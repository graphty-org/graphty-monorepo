id: centrality-closeness
name: Closeness Centrality
category: analysis
description: Calculate closeness centrality - how quickly a node can reach all others in the network. High-closeness
  nodes can disseminate information efficiently and are structurally central.
status: planned
algorithms:
  - Closeness centrality
  - BFS-based shortest paths
used_by_workflows:
  - W03
  - W08
implemented_by_components:
  - algorithm-card
  - algorithm-panel
requirements:
  - Calculate closeness as (n-1) / sum(shortest_path_lengths) for each node
  - Calculate normalized closeness scaled to 0-1 range
  - "Handle disconnected graphs using Wasserman-Faust formula: (reachable_nodes-1)^2 / ((n-1) * sum_of_distances)"
  - Store result with 6 decimal places precision
  - Support weighted graphs using weighted shortest paths
  - Handle directed graphs with separate in-closeness and out-closeness options
  - Assign closeness of 0.0 to nodes with no reachable neighbors
  - Complete calculation within 10 seconds for graphs under 10,000 nodes
  - Display progress indicator for calculations exceeding 3 seconds
  - Rank nodes by closeness in descending order
  - Display top-10 nodes by closeness in results panel
  - Store result as node attribute named 'closeness'
  - Report average closeness for the graph with 4 decimal places
  - Identify and flag nodes in disconnected components separately
sources:
  - title: Graph Analysis Textbook - Chapter 6
    url: https://graphty.app/docs/
    summary: Closeness centrality measures reach efficiency
