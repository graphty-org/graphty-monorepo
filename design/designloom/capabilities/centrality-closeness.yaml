id: centrality-closeness
name: Closeness Centrality
category: analysis
description: "Calculate closeness centrality - how close a node is to all others by shortest-path distance. Closeness is defined only on connected graphs, so the record states its disconnected-graph rule and offers harmonic centrality, which is defined on any graph. Edge weights are read as distances, and directed graphs state in- or out-distance."
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/ClosenessCentralityAlgorithm.ts runs on the undirected view by BFS, or by Dijkstra when a weight option names a column (read as a distance), with an optional Sampled sources count and progress reports. Planned: the Wasserman-Faust rule for disconnected graphs, harmonic centrality, separate in- and out-closeness, average closeness and flags for nodes in other components. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Closeness centrality (shipped)
    - BFS-based shortest paths (shipped; Dijkstra when weighted)
used_by_workflows:
    - W23
    - W176
    - W187
    - W205
