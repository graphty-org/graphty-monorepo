requirements:
    - "Library parity: Calculate raw degree (edge count) for each node as integer"
    - "Must: State whether a self-loop counts once or twice and whether parallel edges count separately, and record it in the result"
    - "Library parity: Calculate normalized degree as degree / (n-1)"
    - "Must: Calculate in-degree for directed graphs as count of incoming edges"
    - "Must: Calculate out-degree for directed graphs as count of outgoing edges"
    - "Must: Calculate total degree for directed graphs as in-degree + out-degree"
    - "Library parity: Calculate weighted degree (node strength) as sum of edge weights for weighted graphs"
    - "Must: Read the edge weight as a strength, as declared in weight-semantics; a column declared a distance is converted first, and the result records which"
    - "Library parity: Provide toggle between unweighted and weighted degree calculation"
    - "Library parity: Rank nodes by degree in descending order"
    - "Library parity: Store degree as node attribute named 'degree' (or 'in_degree', 'out_degree' for directed)"
    - "Must: Allow using degree for visual encoding (size, color) immediately after calculation"
    - "Library parity: Handle isolated nodes (degree 0) without error"
    - "Library parity: Report degree distribution statistics: mean, median, std dev, skewness; questions about the distribution's shape go to degree-distribution-fit, and this record never labels a distribution power-law or scale-free"
sources:
    - title: "NetworkX Graph.degree"
      url: https://networkx.org/documentation/stable/reference/classes/generated/networkx.Graph.degree.html
      summary: "Weighted degree is the sum of the edge weights for edges incident to that node"
    - title: "igraph degree"
      url: https://r.igraph.org/reference/degree.html
      summary: "Counts self-loops by default (loops = TRUE)"
    - title: "igraph page_rank"
      url: https://r.igraph.org/reference/page_rank.html
      summary: "igraph reads weights as strengths for PageRank but as distances for paths, so each weighted result must state its reading"
    - title: "Exploring and Analyzing Network Data with Python (Programming Historian)"
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: "Rank on several centralities; high-betweenness, low-degree brokers are missed by degree alone"
    - title: "Scale-free networks are rare (Broido and Clauset 2019)"
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6399239/
      summary: "Across 928 networks a log-normal fit at least as well as a power law for 88%; describe degree as heavy-tailed, not scale-free"
