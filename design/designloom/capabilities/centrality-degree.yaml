id: centrality-degree
name: Degree Centrality
category: analysis
description: "Calculate degree centrality - the number of connections a node has, the simplest measure of node importance and the one novices use most. Weighted degree is node strength, with weights read as strengths. Degree alone misses high-betweenness, low-degree brokers, so it is ranked alongside other centralities, and the result states how self-loops and parallel edges were counted."
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/DegreeAlgorithm.ts gives the raw degree per node, with inDegree and outDegree on a directed graph and a Direction option for the published value; parallel edges count once and isolated nodes get 0. Planned: normalized degree, weighted degree (strength) and its toggle, a recorded self-loop and parallel-edge convention, and distribution statistics (mean, median, standard deviation, skewness). Any requirement below that this note does not name as shipping counts as planned."
