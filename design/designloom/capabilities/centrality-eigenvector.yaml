id: centrality-eigenvector
name: Eigenvector Centrality
category: analysis
description: Calculate eigenvector centrality (Bonacich) - a node's score is proportional to the sum of its neighbors'
    scores, so ties to well-connected nodes count more. The score is defined within one connected component and is
    undefined on a directed acyclic graph; libraries differ in normalization and direction, so the result states the
    conventions it used.
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/EigenvectorCentralityAlgorithm.ts runs power iteration with Max Iterations, tolerance, Normalized and a Direction Mode (in, out or total), refuses a non-converged run with E_NOT_CONVERGED, and reports iterations. It reads no edge weight. Planned: max-equals-1 and unit Euclidean normalizations (today the normalized option is min-max), weights read as strengths, the giant-component rule with a code, and a code for directed acyclic graphs. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Eigenvector centrality (shipped)
    - Power iteration for dominant eigenvector (shipped)
