requirements:
    - "Library parity: Calculate eigenvector centrality using power iteration method"
    - "Library parity: Expose convergence tolerance and maximum iterations as options with documented defaults, and record the values used in the result"
    - "Library parity: Return a non-convergence error code with the iteration count reached, never a silently partial result"
    - "Library parity: Report the number of iterations used"
    - "Library parity: Normalize so the maximum score equals 1.0 and record the normalization in the result; offer unit Euclidean norm as an option, since NetworkX uses it, so results can be matched against NetworkX"
    - "Must: For directed graphs use the left dominant eigenvector (centrality flows in from in-neighbors) and record the direction in the result"
    - "Must: Read the edge weight as a strength, as declared in weight-semantics; a column declared a distance is converted first, and the result records the column and the conversion used"
    - "Must: On a disconnected graph compute on the giant component, assign 0 to nodes outside it, and return a code with the giant component's node count (the application writes the words)"
    - "Library parity: On a directed acyclic graph return a code saying the score is undefined, rather than all zeros"
    - "Library parity: Rank nodes by eigenvector centrality in descending order"
    - "Library parity: Store result as node attribute named 'eigenvector'"
sources:
    - title: Bonacich 1972, Factoring and weighting approaches to status scores and clique identification
      url: https://doi.org/10.1080/0022250X.1972.9989806
      summary: Origin of eigenvector centrality as a status score
    - title: Bonacich 1987, Power and centrality - a family of measures
      url: https://doi.org/10.1086/228631
      summary: Generalizes eigenvector centrality
    - title: NetworkX eigenvector_centrality
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.centrality.eigenvector_centrality.html
      summary: Unit Euclidean norm, left dominant eigenvector for directed graphs, weight read as connection strength
    - title: igraph eigen_centrality
      url: https://r.igraph.org/reference/eigen_centrality.html
      summary: On a disconnected graph all but one component score zero; on a DAG all scores are zero
