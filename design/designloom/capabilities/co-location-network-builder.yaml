id: co-location-network-builder
name: Co-Location Network Builder
category: analysis
description: Derive links between entities seen at the same place within a time tolerance at least N times, weighted by
    encounter count, with the individual sightings kept as evidence.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W100
    - W101
    - W172
    - W311
implemented_by_components: []
requirements:
    - Build individual-by-individual edges (simple ratio, half-weight index) from group sightings, detection streams or
      GPS relocations using time and distance thresholds.
    - "Build association networks from position tables: group fixes by a time threshold, then by distance (chain, all
      pairs, nearest neighbor), and compute an association index per period, with randomized null networks for
      comparison."
sources: []
