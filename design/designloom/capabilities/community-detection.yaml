requirements:
    - "Must: Leiden is the default community detection method; the quality function (modularity or Constant Potts Model) is an explicit, recorded choice"
    - "Must: Keep Louvain available, labeled as the method for reproducing older work (Gephi's Modularity is Louvain)"
    - "Must: Keep Label Propagation available; it is stochastic (random update order, random tie breaks), so it takes and records a seed like the others. Leiden is also faster than Louvain, so large graphs do not force a non-Leiden default"
    - "Must: Every run takes a seed and records the seed it used, also when none was passed; the result carries method, quality function, resolution, seed and iteration count"
    - 'Library parity: Calculate the modularity score Q as a descriptive value only; never use it as a threshold for "real communities" (no fixed Q cut-off), and allow comparing it with Q on degree-preserving randomizations (null-model-ensembles)'
    - "Must: Provide a resolution parameter whose range depends on the quality function - modularity's gamma around 1, CPM's resolution on the scale of edge density; a CPM default of 1 on an unweighted graph returns near-singletons and must never be the silent default"
    - "Must: Lower resolution values produce fewer, larger communities; higher values produce more, smaller communities; a resolution of 1 is not special, so sweeping it is supported (resolution-sweep)"
    - "Must: Read edge weights as strengths, as declared in weight-semantics (the opposite of path methods); for signed or correlation networks require dropping or separately handling negative weights"
    - "Must: Support repeated runs with partition agreement (NMI, adjusted Rand, variation of information), per-node co-assignment and a consensus partition (partition-stability, consensus-partition); offer stochastic block model inference as the inferential option (sbm-inference)"
    - "Library parity: Return community assignment as integer ID for each node (starting from 0)"
    - "Library parity: Report total number of communities detected"
    - "Library parity: Report size of each community (node count) sorted by size descending"
    - "Library parity: Report size of largest and smallest communities"
    - "Library parity: Return Louvain or Leiden aggregation levels as levels of one run, not as a statistically supported hierarchy; a supported hierarchy comes from the nested stochastic block model"
    - "Library parity: Store community assignment as node attribute named 'community'"
    - "Must: Return a code when all nodes fall in one community"
    - "Library parity: Handle disconnected components by detecting communities within each separately; Leiden guarantees each community is connected"
    - "Must: Offer the methods each population names, with the parameter vocabulary it already uses, so a tutorial can be followed literally - MCL inflation, which Cytoscape and stringApp call granularity (clusterMaker2 suggests 2.0, about 1.8 to 2.5; the Jensen Lab diseases tutorial sets 5; a student tutorial uses 4), with expansion and an edge-weight pruning threshold as advanced options"
    - "Must: Offer Infomap with a number of trials (igraph default 10) that uses edge direction when the graph is directed and accepts positive edge weights only; refuse, with a code, a graph that has zero or negative weights rather than dropping them silently"
    - "Library parity: Offer Walktrap with a random-walk length in steps (igraph default 4) and positive weights only"
    - "Library parity: Offer fast-greedy modularity agglomeration (Clauset-Newman-Moore, NodeXL's default Group by Cluster method, and clusterMaker2's Fast Greedy, which has no adjustable parameters); also Wakita-Tsurumi, NodeXL's option for large graphs"
    - "Must: Cut a hierarchical clustering by a fixed count, by a height, or by Dynamic Tree Cut with deepSplit 0 to 4 and a minimum module size (the WGCNA tutorial uses minimum module size 30, then merges modules whose eigengenes differ by less than a cut height of 0.25)"
    - "Must: Every method returns one community id per node; a method that leaves nodes unassigned (MCODE) belongs to dense-region-detection"
sources:
    - title: Traag, Waltman and van Eck 2019, From Louvain to Leiden - guaranteeing well-connected communities
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6435756/
      summary: Louvain gave up to 25% badly connected and 16% disconnected communities; Leiden guarantees connected ones and is faster
    - title: Blondel et al. 2008, Fast unfolding of communities in large networks (Louvain)
      url: https://doi.org/10.1088/1742-5468/2008/10/P10008
      summary: The Louvain method, kept for reproducing older work
    - title: Fortunato and Barthelemy 2007, Resolution limit in community detection
      url: https://arxiv.org/abs/physics/0607100
      summary: Modularity may merge modules with about sqrt(2L) internal links or fewer
    - title: Good, de Montjoye and Clauset 2010, Performance of modularity maximization in practical contexts
      url: https://arxiv.org/abs/0910.0165
      summary: Exponentially many near-optimal partitions; interpret modularity cautiously
    - title: Betzel 2020, Community detection in network neuroscience
      url: https://ar5iv.labs.arxiv.org/html/2011.06723
      summary: 100 Louvain runs give several distinct solutions; resolution sweeps and consensus clustering
    - title: igraph cluster_leiden
      url: https://r.igraph.org/reference/cluster_leiden.html
      summary: Clusters guaranteed connected; CPM resolution scale; set.seed for reproducibility
    - title: Raghavan, Albert and Kumara 2007, Near linear time algorithm to detect community structures
      url: https://arxiv.org/abs/0709.2938
      summary: Label propagation, stochastic update order and tie breaking
    - title: Peixoto 2023, Descriptive vs. inferential community detection in networks
      url: https://arxiv.org/abs/2112.00183v7
      summary: Modularity-style methods are descriptive; the nested SBM gives a supported hierarchy
    - title: Gephi Modularity source
      url: https://github.com/gephi/gephi/blob/master/modules/StatisticsPlugin/src/main/java/org/gephi/statistics/plugin/Modularity.java
      summary: Gephi Modularity is Louvain with resolution 1.0 and weights used
    - title: clusterMaker2 documentation
      url: https://rbvi.ucsf.edu/cytoscape/clusterMaker2
      summary: Network methods include MCL, MCODE, Leiden, Infomap, Fast Greedy, Label Propagation and Multilevel; MCL granularity (inflation) about 2.0, sensible 1.8 to 2.5; Fast Greedy has no adjustable parameters
    - title: Jensen Lab stringApp disease networks tutorial
      url: https://jensenlab.org/training/stringapp/diseases
      summary: Cluster network (MCL) button in the STRING Results panel, granularity (inflation) set to 5
    - title: igraph cluster_walktrap
      url: https://r.igraph.org/reference/cluster_walktrap.html
      summary: Random walk length steps defaults to 4; weights must be positive
    - title: igraph cluster_infomap
      url: https://r.igraph.org/reference/cluster_infomap.html
      summary: nb.trials defaults to 10; edge directions are taken into account
    - title: Pew Research Center 2014, How we analyzed Twitter social media networks
      url: https://legacy.pewresearch.org/wp-content/uploads/sites/9/2014/02/How-we-analyzed-Twitter-social-media-networks.pdf
      summary: NodeXL offers Clauset-Newman-Moore, Wakita-Tsurumi and Newman-Girvan clustering
    - title: WGCNA tutorial, automatic network construction (FemaleLiver-02)
      url: https://edo98811.github.io/WGCNA_official_documentation/FemaleLiver-02-networkConstr-auto.pdf
      summary: blockwiseModules with power 6, minModuleSize 30 and mergeCutHeight 0.25
    - title: dynamicTreeCut reference manual (CRAN)
      url: https://cran.r-project.org/web/packages/dynamicTreeCut/dynamicTreeCut.pdf
      summary: cutreeDynamic hybrid method takes deepSplit 0 to 4, higher values split clusters more readily, and a minimum cluster size
