id: community-detection
name: Community Detection
category: analysis
description: Identify densely connected groups (communities) within the network and assign each node to one. Leiden is
    the default method because Louvain can return badly connected or disconnected communities; modularity is reported
    as a descriptive value only, since it has a resolution limit and many near-equal optima. Every run is seeded and
    records its method, quality function, resolution and seed so a partition can be reproduced. The method list
    covers what each population actually runs - MCL for systems biologists (the STRING and clusterMaker2 tutorials),
    Clauset-Newman-Moore for NodeXL users, Infomap, Walktrap and fast-greedy for igraph users, and hierarchical
    clustering cut into modules for WGCNA users - not only modularity methods. Seeded dense-region finding (MCODE),
    which leaves nodes unassigned, is the separate dense-region-detection capability.
status: in-progress
notes: "Ships in graphty-element/src/algorithms: LouvainAlgorithm.ts (louvain; Resolution 1, Max Iterations 100,
    Tolerance), LeidenAlgorithm.ts (leiden; Resolution 1, Random Seed, Max Iterations, Threshold; modularity quality
    only, so the Constant Potts Model is planned), LabelPropagationAlgorithm.ts (label-propagation; Max Iterations,
    Random Seed), MarkovClusteringAlgorithm.ts (markov-clustering, MCL; Inflation 2 in 1.1 to 10, Expansion 2, Max
    Iterations 100, Self Loops on), HierarchicalClusteringAlgorithm.ts (hierarchical-clustering; Clusters 2, Linkage
    single; cuts to a fixed cluster count, no height or Dynamic Tree Cut yet), SpectralClusteringAlgorithm.ts
    (spectral-clustering; Clusters 2, Laplacian normalized, Random Seed) and GirvanNewmanAlgorithm.ts (girvan-newman;
    Max Communities, Min Community Size). Planned: Constant Potts Model quality for Leiden, Infomap, Walktrap,
    fast-greedy (Clauset-Newman-Moore), Wakita-Tsurumi, and dendrogram cutting by height or Dynamic Tree Cut. MCL's
    Inflation is the value Cytoscape and stringApp call granularity; the element's label does not say so yet."
algorithms:
    - Leiden algorithm (shipped; modularity quality)
    - Louvain algorithm (shipped)
    - Modularity optimization
    - Constant Potts Model (planned, as a Leiden quality function)
    - Label propagation (shipped)
    - Markov clustering, MCL (shipped; inflation, also called granularity)
    - Agglomerative hierarchical clustering (shipped with a fixed cluster count; height cut and Dynamic Tree Cut planned)
    - Spectral clustering (shipped)
    - Girvan-Newman edge betweenness (shipped)
    - Infomap (planned)
    - Walktrap (planned)
    - Fast-greedy modularity, Clauset-Newman-Moore (planned)
    - Wakita-Tsurumi (planned)
