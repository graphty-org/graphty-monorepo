id: community-profiling
name: Community Profiling
category: analysis
description: "Generate profiles for each detected community: size, internal density, attribute composition, top
    members, within-module hubs and connectors (Guimera-Amaral roles), and the edges between communities. Analysts use
    these to name clusters and to check them against outside evidence rather than treating a partition as final."
