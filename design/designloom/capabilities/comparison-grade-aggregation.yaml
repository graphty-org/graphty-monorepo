id: comparison-grade-aggregation
name: "Study attributes aggregated onto each comparison"
category: data
description: "When many studies share one edge (one treatment pair), compute edge attributes from the studies: counts and sums (studies, participants) and an ordinal grade by a chosen rule (majority, average or highest), then use them for width, color and labels. Stata networkplot edgecolor(by ...) and CINeMA offer exactly these three rules for risk of bias and indirectness; other tools color edges only from a precomputed column."
status: planned
notes: "Research trace: network-meta-analysis-evidence-networks.md section 10, table row 3."
