id: comparison-view
name: Comparison View
category: visualization
description: Compare two graph states or analysis results, side by side with a linked camera or overlaid on one shared
    layout, with the differences encoded explicitly (only in the first, only in the second, in both). Users compare
    time periods and survey waves, two versions of a graph, two connectomes or assembly graphs, two runs or settings of
    one method (for example Leiden at two resolutions, or two seeded layouts), and as-is against what-if scenarios.
    Gleicher et al. name the three designs this covers -- juxtaposition, superposition and explicit encoding of the
    difference -- and for a longer series of states, small multiples are an alternative to animation.
status: planned
