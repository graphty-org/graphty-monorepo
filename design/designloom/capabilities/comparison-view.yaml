requirements:
    - "Library parity: Show two graph views side by side, split vertically or horizontally, with a draggable divider"
    - "Should: Link the camera (pan, zoom, rotation) and the selection across both views by default, with a toggle for independent navigation (network-neuroscience-connectomics.md R14)"
    - "Should: Offer an overlay mode that draws both states on one shared layout as colored layers, with per-edge differences (process-mining-and-process-maps.md R16)"
    - "Should: Encode the difference explicitly with three classes -- only in the first, only in the second, in both -- for nodes and edges, as NetEvViz does, and mark matched items whose attributes changed; never rely on color alone to tell the classes apart"
    - "Should: Match nodes across the two states by id, or through a user-supplied id mapping when ids differ (survey waves, versions, two tools' outputs), and report how many nodes on each side were unmatched"
    - "Should: Report summary counts of new, removed and persistent edges and the Jaccard overlap, and rank nodes by a rewiring score (how much their neighborhood changed), as DyNet does (temporal-and-dynamic-networks.md T13)"
    - "Must: Keep node positions the same in both views by default (one shared layout), so differences are not confused with layout motion; when two layouts are themselves the comparison, each is seeded and its seed is shown"
    - "Should: Load any two states into the views -- temporal snapshots, survey waves, graph versions, filters, algorithm results or parameter settings, or a scenario against its baseline"
    - "Must: Label each view with what it holds -- the time window, or the algorithm with its parameters and seed"
    - "Should: Show a side-by-side table of the selected node's values, and of network-level measures, for both states"
    - "Library parity: Swap the two views"
    - "Must: Use the same encoding scales in both views (one color scale and one size scale fitted to both), and match community colors across the two partitions instead of reusing arbitrary label numbers"
    - "Should: For a series of more than two states, offer small multiples as an alternative to animation (temporal-and-dynamic-networks.md T12)"
sources:
    - title: Gleicher et al. 2011, Visual comparison for information visualization
      url: https://doi.org/10.1177/1473871611416549
      summary: Juxtaposition, superposition and explicit encoding as the three designs for visual comparison
    - title: Khurana et al. 2011, NetEvViz (NodeXL extension)
      url: https://www.cs.umd.edu/users/ben/papers/Khurana2011Visual.pdf
      summary: Two-period edge diff colored only-first, only-second and both (temporal-and-dynamic-networks.md 5.6)
    - title: DyNet, differential network analysis in Cytoscape
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5013899
      summary: Condition-specific edges on a union reference network, nodes ranked by rewiring score
    - title: Archambault, Purchase and Pinaud 2011, Animation, small multiples, and the effect of mental map preservation
      url: https://pubmed.ncbi.nlm.nih.gov/20498503/
      summary: Small multiples were faster than animation with no overall error difference
    - title: NeuroCave survey
      url: https://arxiv.org/pdf/1706.10297
      summary: General tools need two instances on two monitors to compare connectomes; NeuroCave answers with two synchronized side-by-side views, but as a separate web app with no scripting interface (network-neuroscience-connectomics.md)
