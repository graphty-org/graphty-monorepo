id: component-analysis
name: Connected Component Analysis
category: analysis
description: Identify connected components -- maximal subgraphs where every pair of nodes is reachable -- and the
    giant (largest) component with its share of nodes. Users read the component count as an import check (an
    unexpected count points to mismatched or duplicated ids, isolates to edges that did not attach), filter to the
    giant component to reduce clutter, and run path measures (diameter, average path length) on the giant component,
    since they are undefined on a disconnected graph.
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/ConnectedComponentsAlgorithm.ts (components on the undirected view, which are the weakly connected components of a directed graph) and StronglyConnectedComponentsAlgorithm.ts (Tarjan; the caveats say which kind ran). Planned: giant component numbered 0 with its share, isolate counts, show-only-this-component and giant-component filters, the size histogram and merging small components into an other category. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - BFS/DFS for undirected (shipped)
    - Tarjan's algorithm for strongly connected (shipped)
    - Kosaraju's algorithm (planned; Tarjan covers the same result)
