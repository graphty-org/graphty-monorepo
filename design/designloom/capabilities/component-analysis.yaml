requirements:
    - "Must: Find all connected components using BFS/DFS for undirected graphs"
    - "Must: Find weakly connected components for directed graphs (ignoring edge direction)"
    - "Must: Find strongly connected components for directed graphs using Tarjan's algorithm"
    - "Must: Report total number of components"
    - "Must: Report size (node count) of each component sorted by size descending"
    - "Must: Identify giant component as largest component; report its size and percentage of total nodes"
    - "Library parity: Assign component ID as integer to each node (starting from 0, giant component = 0)"
    - "Library parity: Store component ID as node attribute named 'component'"
    - "Library parity: State in the result which kind of component was computed (connected, weakly connected or strongly connected)"
    - 'Library parity: Return "the graph is connected" (one component) as a fact with a code, not as display text'
    - "Must: Report count and share of isolated nodes (components of size 1), so isolates from edges that did not attach are visible after an import"
    - "Must: Provide filter to show only nodes in specified component"
    - "Library parity: Provide filter to show only giant component; when the graph has one component, say the filter changes nothing rather than silently doing nothing"
    - "Must: Expose the giant component so path-based measures (diameter, average path length) can run on it with its share of nodes stated, instead of failing on a disconnected graph"
    - "Must: Display component size distribution histogram"
    - "Should: Support merging components below a user-chosen size into an 'other' category for display"
sources:
    - title: Tarjan 1972, Depth-first search and linear graph algorithms
      url: https://doi.org/10.1137/0201010
      summary: Linear-time strongly connected components by depth-first search
    - title: Programming Historian, Exploring and Analyzing Network Data with Python
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: Diameter fails on a disconnected graph; measure it on the largest component
    - title: Warwick IM904, Gephi giant-component and degree filters
      url: https://warwick.ac.uk/fac/cross_fac/cim/people/academic-technology/im904/week4
      summary: Students filter to the giant component in the standard Gephi workflow (students-educators-and-first-time-users.md)
