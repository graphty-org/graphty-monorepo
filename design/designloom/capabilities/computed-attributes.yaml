id: computed-attributes
name: Computed Attributes
category: analysis
description: Define custom node or edge attributes by combining existing metrics using formulas, enabling
    domain-specific scoring and ranking without hardcoded logic.
status: in-progress
notes: "Partly ships: the session's derived columns (deriveScore, derivedColumns in graphty-element/api/session.api.md) and graphty/src/workspace/data-place/ScoreDialog.tsx. Planned: aggregation over neighbor values, storing a result once as fixed values, and declaring a computed weight's meaning. Any requirement below that this note does not name as shipping counts as planned."
