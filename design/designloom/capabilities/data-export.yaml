id: data-export
name: Data Export
category: data
description: Export graph data for other tools, for code (R, Python) and for sharing, in every format graph-io writes,
    with computed attributes (centrality scores, community assignments, derived columns) included. Users across the
    research finish work elsewhere -- Gephi for figures, igraph or NetworkX for statistics, CATMAID or Cytoscape for
    domain views -- so a typed round trip that keeps ids, attributes, positions and the analysis settings is the
    requirement, not just a file in a named format.
status: in-progress
notes: "Partly ships: graph-io exporters and graphty/src/workspace/export/DataOutput.tsx. Planned: a record of how computed columns were made exported with the data, adjacency matrices for R and Python, and a byte-order-mark option. Any requirement below that this note does not name as shipping counts as planned."
