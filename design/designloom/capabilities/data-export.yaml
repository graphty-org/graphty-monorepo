requirements:
    - "Must: Export to CSV edge list format with configurable delimiter"
    - "Must: Export to CSV node list format with all attributes as columns, computed columns included (students-educators-and-first-time-users.md requirement 11, Must)"
    - "Should: Export to JSON node-link format per D3.js specification"
    - "Should: Export to GraphML and GEXF with computed attributes, the formats Gephi, NodeXL and the R and Python libraries exchange (network-scientists-and-analysis-method-validity.md R20)"
    - "Must: Export to every other format graph-io writes -- GML, Pajek, DOT, SIF, XGMML, CX, CX2, OBO, Cytoscape sessions and Neo4j CSV -- so a graph can go back to the tool it came from"
    - "Must: Include all original node and edge attributes in export"
    - "Must: Optionally include computed metrics (centrality scores, community IDs) as attributes"
    - "Should: Keep external node ids unchanged and write node positions, so a GraphML or GML round trip with another tool (for example CATMAID) loses nothing (network-neuroscience-connectomics.md R28)"
    - "Library parity: Write list and object attributes in a documented encoding rather than failing or dropping them (NetworkX's GraphML writer rejects list and dict values)"
    - "Must: Export a record of how computed columns were made -- algorithm, version, parameters, seed and edge-weight convention (strength or distance) -- alongside the data, so the analysis can be reproduced (network-scientists-and-analysis-method-validity.md R19)"
    - "Must: Export adjacency matrices and edge lists in forms R and Python read directly (ecological-interaction-networks.md)"
    - "Must: Export a per-edge table with endpoints, relationship, source and verification state matching what is on screen (investigative-journalism-and-osint.md R2)"
    - "Library parity: Export only filtered/selected subset when selection is active"
    - "Library parity: Export full graph when no selection is active"
    - "Library parity: Use UTF-8 encoding for all text exports"
    - "Library parity: Include byte-order mark (BOM) option for Excel compatibility"
    - "Library parity: Show a looped progress indicator for an export expected to take 2 seconds or more, and a percent-done indicator for one expected to take 10 seconds or more (NN/g)"
    - "Library parity: Return an export-failed error code with the specific reason on I/O failure"
    - "Library parity: Generate valid, parseable output that can be re-imported without data loss"
    - "Library parity: Write floating-point attributes at full precision, so re-importing gives the same values"
    - "Library parity: Escape special characters appropriately per format specification"
    - "Library parity: Provide download prompt with suggested filename based on graph name and format"
sources:
    - title: GraphML primer
      url: http://graphml.graphdrawing.org/primer/graphml-primer.html
      summary: GraphML structure, typed attribute keys and their defaults
    - title: GEXF file format
      url: https://gexf.net/
      summary: Gephi's exchange format with typed and dynamic attributes
    - title: Gephi CSV format
      url: http://docs.gephi.org/desktop/User_Manual/Import/CSV_Format/
      summary: Node and edge tables as Gephi reads them
    - title: Cytoscape supported network file formats
      url: https://manual.cytoscape.org/en/3.10.3/Supported_Network_File_Formats.html
      summary: The formats Cytoscape reads and writes
    - title: Nielsen Norman Group, Progress indicators
      url: https://www.nngroup.com/articles/progress-indicators/
      summary: Looped indicator for 2-10 second actions, percent-done for 10 seconds or more
