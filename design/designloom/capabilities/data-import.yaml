requirements:
    - "Must: Support CSV and TSV edge tables, node tables and adjacency lists with any single-character delimiter"
    - "Library parity: Support JSON node-link format per D3.js specification, and the other JSON graph dialects graph-io reads"
    - "Must: Support GraphML 1.1 XML format with attribute preservation"
    - "Must: Support GEXF 1.3 XML format with dynamic attribute support"
    - "Must: Support GML format with nested attribute structures"
    - "Must: Support DOT, Pajek, SIF, XGMML, CX, CX2, OBO, Cytoscape sessions (.cys) and Neo4j CSV"
    - "Must: Read a node sheet and an edge sheet from one .xlsx workbook as one graph, after listing its sheets (data-preparation-and-import.md requirement 26, Must)"
    - "Library parity: Auto-detect format from the extension of every format above, not only five"
    - "Library parity: Fall back to content inspection when extension is ambiguous or missing"
    - "Library parity: Show a looped indicator when a load is expected to take 2 seconds or more and a percent-done indicator (rows or bytes read) when it is expected to take 10 seconds or more; any update interval is a design goal, not evidence"
    - "Library parity: Read files as a stream whatever their size, so there is no size threshold to choose; where a format cannot stream (a whole-document XML parse), say so in the size check"
    - "Must: Allow source/target column selection for CSV edge lists"
    - "Must: Allow node ID column selection for CSV node lists"
    - "Must: Show the direction choice with its default named, and allow per-edge direction from a column (data-preparation-and-import.md requirement 2, Must)"
    - "Must: Offer a parallel-edge policy -- keep as multi-edges, or merge with count, sum, average, min, max, first or last (requirement 3, Must)"
    - "Must: Match edge endpoints against the node table, list the unmatched ids, and let the user create or drop them (requirement 4, Must)"
    - "Must: Show the key type used for matching (text or number) and offer trim and case normalization (requirement 5, Must)"
    - "Must: Never coerce identifiers such as SEPT2 to dates; show the inferred column types and let the user override them (requirement 11, Must; Ziemann et al. 2016)"
    - "Library parity: Decode by a fixed rule -- byte order mark, then a declared encoding, then UTF-8 -- and read bytes that are not UTF-8 and declare nothing as windows-1252 with a warning; let the user override the encoding"
    - "Library parity: Support UTF-8, UTF-16LE and UTF-16BE (by byte order mark) and windows-1252 (labels latin1 and iso-8859-1), plus any label the platform's decoder accepts"
    - "Library parity: Report parse errors with line number and column position"
    - "Must: Report the import's counts -- rows read and skipped with reasons, nodes, edges, endpoints created, duplicates merged, self-loops -- through import-report (requirement 1, Must)"
    - "Library parity: For a file over the drawing limit, show its size and the limit before loading and pre-choose a way through (the busiest nodes or the first rows), stating what was left out; never refuse it without one"
    - "Library parity: Return an unsupported-format error code listing every supported format when the format is unrecognized"
    - "Library parity: Return an encoding error code with the detected and expected encoding on character decode failure"
    - "Library parity: Allow partial import to continue after non-fatal parse errors"
    - "Must: Support directed and undirected graph import with explicit toggle"
    - "Must: Support weighted edges via a configurable weight column, and ask whether it is a strength or a distance (weight-semantics), since algorithms read the same column in opposite ways"
    - "Must: Preserve all source attributes as node/edge properties"
sources:
    - title: GraphML primer
      url: http://graphml.graphdrawing.org/primer/graphml-primer.html
      summary: GraphML structure and typed attribute keys
    - title: GEXF file format
      url: https://gexf.net/
      summary: Gephi's exchange format with typed and dynamic attributes
    - title: Gephi CSV format
      url: http://docs.gephi.org/desktop/User_Manual/Import/CSV_Format/
      summary: Node and edge tables, edge lists and adjacency lists as Gephi reads them
    - title: Cytoscape supported network file formats
      url: https://manual.cytoscape.org/en/3.10.3/Supported_Network_File_Formats.html
      summary: The network formats Cytoscape imports
    - title: Ziemann, Eren and El-Osta 2016, Gene name errors are widespread in the scientific literature
      url: https://doi.org/10.1186/s13059-016-1044-7
      summary: Spreadsheets silently convert gene symbols such as SEPT2 to dates
    - title: Nielsen Norman Group, Progress indicators
      url: https://www.nngroup.com/articles/progress-indicators/
      summary: Looped indicator for 2-10 second actions, percent-done for 10 seconds or more
    - title: Papa Parse documentation
      url: https://www.papaparse.com/docs
      summary: Streaming is necessary for large files that would otherwise crash the browser
    - title: WHATWG Encoding Standard
      url: https://encoding.spec.whatwg.org/
      summary: latin1 and iso-8859-1 decode as windows-1252; UTF-16 is UTF-16LE and UTF-16BE; byte-order-mark sniffing
    - title: ICU user guide, character set detection
      url: https://unicode-org.github.io/icu/userguide/conversion/detection.html
      summary: Encoding detection is "at best, an imprecise operation", so a fixed rule plus override replaces an accuracy target
