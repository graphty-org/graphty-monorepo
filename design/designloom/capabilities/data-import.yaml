id: data-import
name: Data Import
category: data
description: Load graph data from local files, URLs, clipboard paste and remote sources, with automatic format
    detection, field mapping and the decisions users are forced to make at import (direction, duplicate edges,
    unmatched endpoints, key types) made visible. It reads every format graph-io reads -- CSV and TSV (edge tables,
    node tables, adjacency lists), XLSX and XLSM, JSON (node-link and D3, JGF, Cytoscape.js, Graphology, vis, OBO
    Graphs, NetworkX adjacency_data and tree_data), GraphML, GEXF, GML, DOT, Pajek, SIF, XGMML, CX, CX2, OBO,
    Cytoscape sessions and Neo4j CSV -- plus graph-io's sources (Cypher, Gremlin and SPARQL endpoints, NDEx, Zenodo,
    figshare, GitHub, S3, REST, plain URLs). Other formats users bring belong to their own capabilities (matrix-import,
    biological-network-formats, bibliographic-record-import, rdf-import, security-format-import, event-log-import and
    others listed in data-preparation-and-import.md section 9.1); the import report, saved mappings, local-only
    processing and the size check are shared capabilities (import-report, saved-import-mappings,
    local-only-processing, progressive-loading).
status: in-progress
notes: "Partly ships: graph-io importers for the formats in graph-io/src (with BOM, UTF-16 and windows-1252 decoding in graph-io/src/common/input.ts) and graphty/src/workspace/data-page/DataPage.tsx. Planned: picking a node sheet and an edge sheet from one xlsx workbook, unmatched endpoint lists with create or drop, and the strength-or-distance question for a weight column. Any requirement below that this note does not name as shipping counts as planned."
