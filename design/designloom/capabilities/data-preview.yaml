requirements:
    - "Library parity: Show the first rows of the raw source in a table, with the separator, quote character and charset in use, and let the user change them"
    - "Library parity: Show the detected format and whether it was detected by extension or by content; when detection fails, list the formats that are read"
    - "Must: Let the user assign column roles: node id and label for a node table; source, target and optional type (direction or layer), weight and time columns for an edge table; an edge table alone is enough to build a graph"
    - "Must: Show each column's inferred type (string, integer, float, boolean, date, list) and let the user override it before import, since a column's type may not be changeable afterwards and unparseable cells become null"
    - "Must: Read identifier columns as strings by default and never coerce identifier-like values (SEPT2, MARCH1, leading zeros, 64-bit ids) to dates or numbers"
    - "Must: Show the direction setting with its default named, and per-edge direction from a column when one is assigned"
    - "Must: Show the parallel-edge policy that will apply (keep as multi-edges, or merge by count, sum, average, min, max, first, last)"
    - "Must: Show the counts the import will produce -- nodes, edges, endpoints that match no node id (with the unmatched ids listed and the choice to create or drop them), duplicate edges, self-loops -- before the user commits"
    - "Must: Show key-type mismatches (number versus string, whitespace, case) between node and edge tables before matching"
    - "Must: For an xlsx workbook, list the sheets and let the user pick a node sheet and an edge sheet as one graph"
    - "Library parity: Allow the user to exclude columns from import"
    - "Library parity: Flag a file whose row count sits at or just under Excel's 1,048,576-row limit as probably truncated"
    - "Must: When a source is too large to load whole, show its size and offer to sample, filter or aggregate before loading"
    - "Library parity: Show progress while the preview is generated and keep it cancellable"
    - "Library parity: Provide Cancel and Import; disable Import, with the reason returned as a code, while a required role (node id, or source and target) is unassigned"
    - "Should: Save, name and re-apply a column mapping to another file, and warn when a file does not fit it"
sources:
    - title: Data preparation, import and first assessment (sections 4.1, 4.2, 4.10; requirements 2-5, 10, 11, 14, 26)
      url: design/user-research/data-preparation-and-import.md
      summary: Column roles, direction default, parallel-edge merge, endpoint matching, key type, identifier safety,
          size check, saved mappings and workbook sheets are what import dialogs force users to decide
    - title: Gephi manual, CSV import
      url: http://docs.gephi.org/desktop/User_Manual/Import/CSV_Format/
      summary: Types are fixed before Finish, unparseable cells become null, Source and Target are mandatory, edges
          default to Directed
    - title: Cytoscape, Importing Network From Table
      url: https://cytoscape.org/cytoscape-tutorials/protocols/importing-network-from-table/
      summary: Assigning source, target and interaction columns; key-column matching for attribute tables
    - title: Ziemann, Eren and El-Osta 2016, Gene name errors are widespread in the scientific literature
      url: https://doi.org/10.1186/s13059-016-1044-7
      summary: Excel converts gene symbols such as SEPT2 to dates in published supplementary files
    - title: Microsoft, Excel specifications and limits
      url: https://support.microsoft.com/en-us/office/excel-specifications-and-limits-1672b34d-7043-467e-8e27-269d656771c3
      summary: A worksheet holds at most 1,048,576 rows
