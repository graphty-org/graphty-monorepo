id: data-preview
name: Data Preview
category: data
description: Preview a source before committing to a full import -- the detected format, the column roles (node id,
    source, target, type, weight, time), each column's inferred type with an override, sample rows, and the node and edge
    counts the import will produce -- so a user catches id mismatches, a wrong direction default, mangled identifiers
    and truncated files before loading.
status: in-progress
notes: "Partly ships: the table preview in graphty/src/workspace/data-page/DataPage.tsx. Planned: choosing sheets from an xlsx workbook, the near-Excel-row-limit warning, saved column mappings and sampling a source too large to load. Any requirement below that this note does not name as shipping counts as planned."
