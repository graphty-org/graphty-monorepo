requirements:
    - "Must: Detect node rows with a missing or empty id and edge rows with a missing source or target; report the count and the row numbers"
    - "Must: Match edge endpoints to node ids and list every unmatched id with its count; offer to create the missing nodes or drop those edges, never blocking the import and never dropping them silently"
    - "Must: Report key-type mismatches between node and edge tables (number versus string, whitespace, case) that stop ids from matching, and offer normalization (trim, case) at match time"
    - "Must: Count duplicate node ids and report which row was kept"
    - "Must: Count parallel edges (same source and target) and apply the chosen policy -- keep as multi-edges, or merge by count, sum, average, min, max, first or last -- and record the policy used"
    - "Must: Count self-loops and reciprocal pairs (A-B and B-A), and report how many reciprocal pairs were collapsed when a directed table is read as undirected"
    - "Must: Count isolated nodes (degree 0), which often mark edges that did not attach"
    - "Must: Flag columns whose values do not fit the inferred type, with the count of cells that failed to parse"
    - "Must: Flag identifiers that look converted by a spreadsheet (gene symbols such as SEPT2 turned into dates, long numeric ids rounded)"
    - "Library parity: Report per-attribute completeness as the count and share of non-null values"
    - 'Must: Report a missing respondent ("did not answer") separately from "no tie" when the data marks it'
    - "Should: Flag near-duplicate node names (fingerprint, n-gram, phonetic) for review and merge"
    - "Library parity: Classify each issue by whether it stops a graph from being built (no source or target column) or only needs a decision; the user can acknowledge or ignore each"
    - "Library parity: Return each issue as a code with its parameters and the affected ids; the application writes the words and any recommendation"
    - "Library parity: Show before and after counts for any fix (create missing nodes, drop edges, merge duplicates, remove self-loops) before applying it"
    - "Library parity: Show progress for long validations"
    - "Should: Export the issue list with the import settings and counts as JSON or CSV, as an import log for reproducibility"
sources:
    - title: Data preparation, import and first assessment (sections 4.1, 4.2, 4.9; requirements 1-5, 11, 12, 16, 19)
      url: design/user-research/data-preparation-and-import.md
      summary: Import report counts, endpoint matching with create-or-drop, key type, parallel-edge policy, identifier
          safety and an import log are Must or Should; no research or tool asks for a quality score
    - title: Gephi CSV import tutorial (seinecle)
      url: https://seinecle.github.io/gephi-tutorials/generated-html/importing-csv-data-in-gephi-en.html
      summary: Gephi's "Create missing nodes" choice when edge endpoints match no node
    - title: Cytoscape manual, Creating Networks
      url: https://manual.cytoscape.org/en/stable/Creating_Networks.html
      summary: A network can be built from an edge table alone
    - title: Gephi EdgeMergeStrategy API
      url: https://gephi.org/gephi/0.9.2/apidocs/org/gephi/io/importer/api/EdgeMergeStrategy.html
      summary: Parallel-edge merge options SUM, AVG, MAX, MIN, FIRST, LAST and NO_MERGE
    - title: Cytoscape Quick Tour
      url: https://manual.cytoscape.org/en/latest/Quick_Tour_of_Cytoscape.html
      summary: Remove Duplicated Edges and Remove Self-Loops as cleanup steps after import
    - title: Ziemann, Eren and El-Osta 2016, Gene name errors are widespread in the scientific literature
      url: https://doi.org/10.1186/s13059-016-1044-7
      summary: Excel converts gene symbols such as SEPT2 to dates
