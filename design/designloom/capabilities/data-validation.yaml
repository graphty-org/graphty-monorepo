id: data-validation
name: Data Validation
category: data
description: Check loaded graph data and report, as counts with the affected ids, what the import did and what looks
    wrong -- unmatched edge endpoints, duplicate node ids, parallel edges, self-loops, reciprocal pairs, isolates,
    missing ids, type mismatches and identifiers mangled by spreadsheets. Each issue is a code with its parameters and,
    where there is one, a choice (create or drop, merge or keep); nothing is dropped silently and there is no single
    quality score.
status: in-progress
notes: "Partly ships: the session's data issues (issues, ignoreIssue in graphty-element/api/session.api.md) listed by graphty/src/workspace/table/IssuesList.tsx. Planned: near-duplicate name detection, before-and-after counts for each fix, and export of the issue list as an import log. Any requirement below that this note does not name as shipping counts as planned."
