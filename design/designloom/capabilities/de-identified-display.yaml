id: de-identified-display
name: De-Identified Display Mode
category: visualization
description: A display mode that hides labels and identifying attributes for screen sharing and briefings, distinct from
    the underlying data, so a confidential investigation can be discussed without exposing identifiers.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W185
    - W186
    - W207
    - W208
    - W318
    - W320
    - W369
    - W61
    - W66
    - W71
    - W72
implemented_by_components: []
requirements:
    - Hide or anonymize nodes flagged as living or restricted in every view and export with one setting.
    - Replace handles and names of private individuals with stable pseudonyms in exported figures and data.
    - Hide or replace node labels and chosen attributes in exported images and files, verified absent from the output
      file; also field stripping before a web export is published.
    - Display mode that replaces names with stable pseudonyms everywhere, including exports.
