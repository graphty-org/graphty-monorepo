id: degree-analysis
name: Degree Analysis
category: analysis
description: Compute each node's degree (in- and out-degree for directed graphs, strength for a chosen weight column)
    and show the distribution, so users can rank hubs and catch import errors such as artifact hubs, doubled edges and
    isolates. The distribution is described, not labeled -- heavy-tailed or not -- and any power-law claim comes only
    from the Clauset-Shalizi-Newman fit in degree-distribution-fit, never from a p-value threshold here.
status: in-progress
notes: "Partly ships: degree and its histogram ship (graphty-element/src/algorithms/DegreeAlgorithm.ts, graphty/src/workspace/inspector/GraphValues.tsx); the CCDF view does not, and distribution fitting belongs to degree-distribution-fit."
algorithms:
    - Degree calculation
    - Complementary cumulative degree distribution (CCDF)
