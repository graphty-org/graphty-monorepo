id: dependency-propagation
name: Dependency Propagation with AND/OR Logic and Time Buffers
category: analysis
description: Propagate a disruption downstream where a node fails when any required input fails (AND) unless an
    alternate covers it (OR), with per-node and per-edge time buffers (inventory days, backup duration, time to severe
    impact) giving the time each downstream node fails, and weighted roll-up to terminal nodes (revenue, customers).
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
