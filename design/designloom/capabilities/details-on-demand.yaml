id: details-on-demand
name: Details on Demand
category: interaction
description: "Show comprehensive information for selected nodes or edges in a detail panel: all attributes, computed
    metrics with the settings that produced them, the source record behind the item, neighbor counts including
    neighbors not yet shown, and related context. Hover gives a short preview and a deliberate action opens the full
    details. The fourth step of Shneiderman's mantra: overview, zoom, filter, details-on-demand."
status: in-progress
notes: "Partly ships: graphty/src/workspace/inspector/NodeValues.tsx. Planned: hidden-degree counts, drilling into the records behind a node, aggregate statistics for a multi-selection, and a pinned detail panel. Any requirement below that this note does not name as shipping counts as planned."
