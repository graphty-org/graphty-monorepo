requirements:
    - "Must: Extract 1-hop neighborhood including ego node and all direct neighbors"
    - "Must: Extract N-hop neighborhood with configurable depth from 1 to at least 5 (default 1)"
    - "Must: Extract around one or many seed nodes at once"
    - "Must: Follow edges by direction (in, out or both) and by edge type, chosen separately"
    - "Must: Include all edges among extracted nodes (alter-alter ties) by default"
    - "Library parity: Provide option to include only edges connecting to ego (star pattern)"
    - "Must: State how direction is handled when computing ego measures (symmetrized or not), and record it with the result"
    - "Must: Calculate ego network size (node count excluding ego)"
    - "Must: Calculate ego network density among alters"
    - "Must: Calculate effective size, efficiency, constraint and hierarchy (Burt's structural holes measures); report constraint together with size, since constraint mostly tracks inverse network size"
    - "Must: Calculate alter composition and heterogeneity by a chosen attribute, and the E-I index"
    - "Must: Support filtering extracted network by edge type attribute"
    - "Must: Support filtering extracted network by node type attribute"
    - "Must: Display ego network in separate view or highlight within main view, with hop distance available as a visual channel"
    - "Must: Provide 'Expand' button to increase depth by 1 hop"
    - "Library parity: Provide 'Contract' button to decrease depth by 1 hop"
    - "Must: Display depth indicator showing current hop distance"
    - "Must: Report the node and edge count of the next hop before drawing it, show hidden degree on hubs, and never expand a hub automatically; the warning threshold and an optional node cap (with its sampling rule stated) are consumer options with a neutral default"
    - "Library parity: Allow aborting a long extraction, with progress shown"
    - "Must: Store ego network as subgraph that can be analyzed independently"
    - "Should: Hold many ego networks keyed by ego id as one collection, browsable singly and comparable"
sources:
    - title: Perry, Pescosolido and Borgatti 2018, Egocentric Network Analysis
      url: https://doi.org/10.1017/9781316443255
      summary: Ego extraction and the standard ego measures
    - title: Hoffmann, Introduction to SNA, structural holes
      url: https://jfb-h.github.io/intro-to-sna/08-structural-holes.html
      summary: Ego extraction from a whole network, symmetrize first, then size, effective size, efficiency, constraint
          and hierarchy
    - title: Academic social network research (section 5.4 and requirements table)
      url: design/user-research/academic-social-network-research.md
      summary: Ego extraction and measures beyond size, density and constraint (effective size, efficiency, hierarchy,
          E-I, composition, heterogeneity) are must-have; a many-small-networks mode is should-have
    - title: Burt's constraint mostly tracks network size (Strategy Science 2024)
      url: https://pubsonline.informs.org/doi/10.1287/stsc.2024.0297
      summary: Constraint largely reflects inverse network size, so it is read together with size
    - title: Neo4j Bloom, scene interactions
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-visual-tour/bloom-scene-interactions/
      summary: Advanced Expansion by relationship type, direction, neighbor category and limit
    - title: Graph database query and expand exploration (use case 1, requirement 5)
      url: design/user-research/graph-database-query-and-expand-exploration.md
      summary: Everything connected to an entity is a many-times-a-day need; hidden-degree badges and never
          auto-expanding a hub are Must
    - title: Personal knowledge graphs and note networks (requirement 5)
      url: design/user-research/personal-knowledge-graphs-and-note-networks.md
      summary: Local n-hop neighborhood from depth 1 to at least 5, separately per direction and edge kind
    - title: Code-first data scientists and graph ML (requirements table)
      url: design/user-research/code-first-data-scientists-and-graph-ml.md
      summary: k-hop neighborhood around one or many seeds, hop distance as a visual channel, a node cap with
          documented sampling are Must
    - title: Data preparation, import and first assessment (requirement 18)
      url: design/user-research/data-preparation-and-import.md
      summary: Many ego networks keyed by ego id as one collection is Should
