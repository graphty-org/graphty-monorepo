id: ego-network
name: Ego Network Extraction
category: analysis
description: Extract the ego network (local neighborhood) of one or more selected nodes - the seeds plus all nodes
    within N hops, by direction and edge type, and the edges among them - and compute the standard ego measures (size,
    density, effective size, efficiency, constraint, hierarchy, composition). Used to show everything connected to an
    entity, to investigate a hub without expanding it blindly, and to compute per-ego statistics in social research.
status: planned
algorithms:
    - BFS neighborhood extraction
