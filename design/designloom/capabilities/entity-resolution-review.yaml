id: entity-resolution-review
name: Entity Resolution with Review
category: visualization
description: Collapse several records (sequences, isolates, stays, claim lines) into one entity (person, holding,
    provider) with the collapse visible, and report identifier mismatches across input files with counts and the
    unmatched identifiers listed, instead of dropping rows silently.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
