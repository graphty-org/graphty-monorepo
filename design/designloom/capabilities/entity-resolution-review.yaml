requirements:
    - "Must: Identity resolution: several sequences or isolates collapsing to one person or holding, and a mismatch
      report when ids do not line up across files"
    - "Must: Suggest candidate duplicates across sources, review and merge them into identity nodes that keep every identifier, remember does-not-match decisions, and undo merges."
    - "Must: Propose, confirm, reject and undo merges of records that may be the same entity (fuzzy names, shared identifiers, heuristics such as co-spend or change), recording the reason for each merge, and keep 'possibly the same' tentative links that leave both records intact and are drawn differently from confirmed merges."
    - "Must: Step through duplicate-candidate groups with scores, each member's neighbors and source text, accept or reject each, and keep a merge and invalidation log that re-applies after a rebuild or re-extraction."
    - "Must: Detect near-duplicate node names and identifiers with fingerprint, n-gram, phonetic and edit-distance keys and present clusters for review before merging; complements node-merging, which only performs merges."
    - "Must: Many identifiers per node with assign, merge, remove and unmerge, survivor rules and an exclusion list; every change audited and reversible."
sources:
