id: event-table-to-graph
name: Event Table to Graph
category: analysis
description: Import timestamped event tables (time, sender, receiver, increment or replace) with a node table, and slice
    or aggregate them by time window.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W07
    - W112
    - W113
    - W293
    - W33
    - W36
implemented_by_components: []
requirements:
    - Pick entity columns from an event table (CSV or SIEM result) to generate entity nodes and event links, a
      hypergraph projection.
    - Aggregate raw events into host-to-host, account-to-host or subnet edges with counts, first and last seen and a
      minimum-weight threshold, and drill from an aggregated edge to its raw rows.
    - "Build a network from one-row-per-event tables: choose endpoint columns (including several recipient columns and
      pointer columns joined to another record), normalize identifiers, choose aggregation and weight rule or keep
      events as multi-edges with drill-down, or build a hypergraph."
sources: []
