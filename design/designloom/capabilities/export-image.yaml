requirements:
    - "Must: Export lossless PNG at high resolution and JPEG with configurable quality; first-time users asked for SVG and lossless PNG (students-educators-and-first-time-users.md, Bonsignore et al.)"
    - "Must: Export vector SVG and PDF with embedded fonts and Unicode text; course handouts and digital humanists treat SVG/PDF as a must, and Gephi Lite's image-only export is a documented gap"
    - "Must: Export the whole graph or a chosen region independent of the current viewport; exporting only the visible canvas is a documented Cytoscape frustration (communicating-findings-and-deliverables.md, R1)"
    - "Must: Set bitmap resolution directly (pixel size or scale factor), not through the on-screen zoom; print sizes and dpi presets belong to journal-figure-export"
    - "Must: Match the screen; colors, sizes, labels and fonts in the file are those displayed, so styling is not redone in a separate preview mode as in Gephi"
    - "Must: Offer a transparent background or a chosen background color (bibliometrics-and-science-mapping.md, figure export must)"
    - "Must: Include a legend generated from the live style for node and edge encodings inside the export, as editable text in vector formats (communicating-findings-and-deliverables.md, R3)"
    - "Must: Optionally include a parameters block (data source, filters, algorithms, layout and seed, thresholds, date) so the figure records how it was made (communicating-findings R4; genetic genealogy figure export must)"
    - "Must: Include annotations when the annotation layer holds any"
    - "Must: Draw labels without overlaps in the file, using label-overlap-removal at the export's size rather than the screen's, and list any label that could not be placed (communicating-findings R26)"
    - 'Must: Offer label-redacted export that hides or replaces node labels and chosen attributes and verifies they are absent from the file (communicating-findings R21, must for cyber; BloodHound users export after "Hide Labels")'
    - "Must: Offer a grayscale and colorblind check before export, since color often does not survive grayscale printing (communicating-findings R13)"
    - "Must: Show progress and allow cancel on large exports; a 50,000-node Gephi PDF export never finished"
    - "Library parity: Warn before export when the requested size exceeds what the browser or GPU can render, and report a failure as an error code with its reason"
    - "Library parity: Suggest a filename built from the graph name and a timestamp"
    - "Library parity: Capture a 3D or WebGL view through the element's own call, at any moment, with no renderer flag and no animation-frame timing on the consumer's side; 3d-force-graph users get blank or black images from canvas.toDataURL or html2canvas and have asked how since 2018 (3d-force-graph issues 25, 68, 189 and 564; react-force-graph issue 255 says the canvas is not exposed)"
sources:
    - title: Communicating findings and deliverables (user research)
      url: design/user-research/communicating-findings-and-deliverables.md
      summary: Export requirements R1, R3, R4, R13, R21; Cytoscape exports only the visible canvas; Gephi Preview
          restyling and a 50,000-node PDF export that never finished
    - title: Cytoscape manual, Export Your Data
      url: https://manual.cytoscape.org/en/3.10.3/_sources/Export_Your_Data.md.txt
      summary: PDF recommended for publication because it is vector
    - title: EnrichmentMap protocol, exporting figures and creating legends
      url: https://baderlab.github.io/EnrichmentMap_Protocol/exporting-figures-creating-legends-and-saving-work.html
      summary: Only the visible canvas is exported; parameters are copied into the legend by hand
    - title: cytoscape-discuss, bitmap resolution comes from zoom
      url: https://groups.google.com/g/cytoscape-discuss/c/WyE-wbZU0q0
      summary: Bitmap resolution is set by zoom rather than the DPI field
    - title: Bonsignore et al. 2009, First Steps to NetViz Nirvana
      url: https://www.cs.umd.edu/~ben/papers/Bonsignore2009First.pdf
      summary: NodeXL novices asked for SVG and lossless PNG export
    - title: Gephi Lite, differences with Gephi
      url: http://docs.gephi.org/lite/user-manual/differences-with-gephi/
      summary: Gephi Lite exports images only, without SVG or PDF
    - title: Cambridge Intelligence, intelligence dissemination with PDF exports
      url: https://cambridge-intelligence.com/intelligence-dissemination-with-pdf-exports/
      summary: Static exports lose tooltips; color does not survive grayscale printing
