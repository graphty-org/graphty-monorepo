id: export-image
name: Image Export
category: export
description: Export the graph as a static image (raster or vector) for presentations, reports and documents. The
    research finds the deliverable is rarely just a picture of the graph; it is a picture that matches the screen,
    covers the whole graph, and carries its legend and the parameters that produced it.
status: in-progress
notes: "Partly ships: PNG, JPEG, SVG and PDF figures with a legend from graphty-element/src/screenshot/ (figure.ts, figurePdf.ts, drawLegend.ts, transparency.ts) and graphty/src/workspace/export/CameraImageOutput.tsx. Planned: a parameters block, label-redacted export, a grayscale and colorblind check, and cancel on large exports. Any requirement below that this note does not name as shipping counts as planned."
