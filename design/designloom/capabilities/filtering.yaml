requirements:
    - "Must: Filter by a categorical attribute (show or hide each category), including multi-valued columns read as sets and category hierarchies where selecting a parent selects its descendants (knowledge-graph must-have)"
    - "Must: Filter by a numeric attribute with both a floor and a ceiling (a band), applied live as the control moves, with the matching count shown; genealogists' cM band is their main knob (genetic-genealogy must)"
    - "Must: Filter by any computed column (degree, centrality, community id, component id, confidence) through the same categorical and numeric filters; no fixed scale is assumed for a metric"
    - "Must: Provide degree-range and giant-component filters, the standard clutter reducers in Gephi teaching material (students-educators must, data-preparation)"
    - "Must: Provide noise controls for communication graphs - minimum connections, maximum recipients per record, hide detached nodes (ediscovery R7, must)"
    - "Must: Filter edges independently of nodes - by edge type or role, by attribute such as amount or currency, and by time range applied to edges before any aggregation (cybersecurity, financial-crime, ONA must-haves)"
    - "Must: Filter by date range, honoring uncertain or partial dates and validity intervals (digital humanities must, knowledge-graph should)"
    - "Must: Filter to the N-step neighborhood of selected or matched nodes, and expand a filtered set by depth (genome assembly must; personal knowledge graphs)"
    - "Should: Offer path-preserving filters that hide hubs or placeholders while keeping the routes through them (personal knowledge graphs, should)"
    - "Should: Hide chosen nodes (for example close relatives) without deleting them, and restore them; invert a filter"
    - "Library parity: Combine filters with AND by default, as ONA tools stack them, and offer OR where edge types are combined"
    - "Must: Report what is shown as 'showing N of M' for nodes and for edges (ediscovery R5, must)"
    - "Library parity: Show when any filter is active, and reset all filters in one step"
    - "Must: Keep node positions when filtering; positions must persist while attributes change (developers-embedding)"
    - "Library parity: Hide edges whose endpoint is filtered out"
    - "Must: Record the active filters with the view, so exports, bookmarks and the methods record state them (ediscovery R17; communicating-findings R4), and save filter presets (personal knowledge graphs, should)"
