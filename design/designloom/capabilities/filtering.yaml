      url: design/user-research/students-educators-and-first-time-users.md
      summary: Requirement 12 - giant-component and degree filters (must)
    - title: eDiscovery and legal communication analysis (user research)
      url: design/user-research/ediscovery-and-legal-communication-analysis.md
      summary: R5 showing N of M, R6 role filter, R7 noise controls, R17 view provenance
    - title: Genetic genealogy DNA match networks (user research)
      url: design/user-research/genetic-genealogy-dna-match-networks.md
      summary: Two-ended band filter on a node attribute with a live count (must); hide close relatives without
          destroying the original (should)
    - title: Gephi Quick Start
      url: http://gephi.org/quickstart/
      summary: Topology filters - Giant Component and Degree Range
    - title: Polinode networks guide
      url: https://docs.polinode.com/guide/networks.html
      summary: ONA filters stack with AND logic
