id: filtering
name: Graph Filtering
category: interaction
description: Show or hide nodes and edges by attribute value, structure, time or neighborhood, to cut a graph down to
    the subset a question needs. Across the research, filtering is part of the analysis (minimum connections, a cM
    band, a date range), so the active filters and the "N of M" shown must travel with the view.
status: in-progress
notes: "Partly ships: graphty/src/workspace/data-place/Filters.tsx, with filter words in graphty/src/workspace/data-place/filterWords.ts. Planned: path-preserving filters, ediscovery noise controls, uncertain-date filters and an OR mode across edge types. Any requirement below that this note does not name as shipping counts as planned."
