id: fixed-base-map-layout
name: Fixed base-map positions for overlays
category: visualization
description: Load node positions from a file and keep them fixed across loads, overlays and exports so units or periods
    can be compared on identical coordinates; size and color nodes by a unit's count or share.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W335
    - W57
    - W58
    - W60
implemented_by_components: []
requirements:
    - Keep node positions from a saved base map fixed while sizing or coloring nodes by a different unit's or period's
      counts, so overlays are comparable across periods and units.
