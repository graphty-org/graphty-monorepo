requirements:
    - "Must: Load a layout from file and keep positions fixed (base maps); size and color by a unit's share; compare
      units or years on identical coordinates"
    - "Must: Keep node positions supplied by the data (curated pathway maps, Escher maps, spatial or 3D residue coordinates, exported layouts) and draw on top of them without re-layout."
    - "Must: Place nodes at caller-supplied 2D or 3D coordinates (a UMAP or t-SNE projection of embeddings, 2D molecule coordinates, layer by token position) and link that view to a second layout of the same nodes with shared selection."
    - "Must: Per-node fixed or pinned coordinates supplied in the data and honored by every layout, kept across host refreshes."
    - "Must: Import and pin precomputed 3D positions (embeddings, anatomical coordinates, analyst mental-model layouts, saved layouts); map any attribute to the x, y or z axis, bin or sort nodes along an axis; switch between stored layouts with an animated transition."
