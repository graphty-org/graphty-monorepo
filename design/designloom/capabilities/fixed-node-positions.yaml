id: fixed-node-positions
name: Fixed Anatomical Node Positions
category: analysis
description: Place nodes at x, y, z coordinates from node attributes that no layout overrides, with a named coordinate
    space (MNI template, fsaverage, patient-native) recorded per graph to catch mismatches.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
