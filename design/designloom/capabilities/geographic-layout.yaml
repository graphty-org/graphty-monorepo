id: geographic-layout
name: Geographic layout over a basemap
category: visualization
description: Place nodes with locations (claim addresses, provider sites, regions) on a map layer and combine geographic
    position with network links.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
