requirements:
    - "Should: Geographic overlay of claims and addresses"
    - "Must: Use node coordinates as a fixed layout over a map, with raster and shapefile input and GIS export for spatial graphs."
    - "Must: Place nodes at latitude and longitude over a base map (or a user shapefile), draw edges as directed routes between places, and keep the map linked to network and timeline filters."
    - "Must: Place nodes from latitude/longitude or projected x/y on a basemap with synchronized zoom; draw edges straight or as stored polylines; list nodes missing coordinates instead of hiding them; switch between geographic, schematic and force layouts keeping the selection."
    - "Must: Place nodes at coordinates, polygon centroids or geocoded names on a basemap with a choice of projection, and show algorithm results (centrality size, community color, regions as filled areas) at their geographic positions."
    - "Must: Place nodes or pies at sampling coordinates on a map, with linked selection and colors shared between map, graph and legend."
