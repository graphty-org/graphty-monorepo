id: geospatial-file-io
name: "Geospatial file import and export"
category: data
description: "Import point, line and polygon features with their attributes from GeoJSON, shapefile, GeoPackage and KML or KMZ (and WKT or GeoJSON geometry columns in CSV), reading the declared coordinate reference system (.prj, GeoPackage metadata; GeoJSON is always WGS84 lon/lat per RFC 7946) and reprojecting to the display projection. Join features to graph nodes by zone id (reporting unmatched ids on both sides), accept H3 cell ids as zone ids, and place polygon nodes at a centroid, a point on the surface or a supplied population-weighted center. Optionally assign coordinate-only records to the containing polygon or H3 cell. Export nodes as points or their zone polygons, edges as lines, with computed attributes, to GeoJSON in WGS84 (and a zone-to-region lookup with region polygons). Supplies the boundary geometry that geographic-layout, od-flow-import and spatial-selection (imported hazard footprint) currently assume. Also reads networks that carry geometry - GraphML with coordinates, CSV with lat/lon, EPANET .inp water networks and MATPOWER or pandapower power cases - keeping coordinates and line geometry as attributes, and draws GeoJSON Point-with-area, Polygon and MultiPolygon features as nodes in their real shapes, with a check against a named geometry rule set (the EU deforestation regulation rules) that lists failing features before export. One record for all geospatial input (it absorbed geospatial-network-import and geojson-plot-nodes)."
status: planned
notes: "Research trace: geographic-flow-and-mobility-networks.md section 10, requirement R26 (Must); supply-chain-and-physical-infrastructure-networks.md section 10, requirements R19 (Must) and R44 (Should)."
