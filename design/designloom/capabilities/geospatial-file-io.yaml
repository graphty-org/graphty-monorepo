requirements:
    - "Must: Import zone boundaries (point, line and polygon features with attributes) from GeoJSON, shapefile,
      GeoPackage and KML or KMZ, reading the declared coordinate system and reprojecting; join features to nodes by zone
      id and report unmatched ids on both sides; accept H3 cell ids as zone ids"
    - "Must: Import GraphML with coordinates, GeoJSON/GeoPackage, EPANET .inp, MATPOWER/pandapower, KMZ, CSV with
      lat/lon"
    - "Should: Plot nodes from GeoJSON: Point with area or Polygon and MultiPolygon drawn as shapes on the map,
      validated against the EUDR Information System rules (closed rings, no holes or crossings, six decimals, 25 MB per
      statement)"
