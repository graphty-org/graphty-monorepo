implemented_by_components: []
requirements:
    - "Create and edit a graph by hand: add a vertex by clicking, connect two vertices, set weight and direction,
      delete, and type an edge list or adjacency matrix that becomes a drawing."
    - Create, link, relink and delete nodes and edges by hand, with hand placement kept across sessions and mixed node
      types (code, quotation, memo, document).
    - "Draw a directed graph by hand: add, rename and delete nodes and arrows with keyboard shortcuts, block cycles
      while drawing (lagged and temporal arcs exempt), and keep manual positions in the saved file."
