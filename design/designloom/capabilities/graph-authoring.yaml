id: graph-authoring
name: Hand Authoring on an Empty Canvas
category: analysis
description: Add, rename, delete and connect nodes and edges by click, drag and keyboard on an empty canvas, with pinned
    positions that survive layouts; every civic mapping method starts on paper and is retyped.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
