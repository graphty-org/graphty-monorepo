id: graph-rendering
name: Graph Rendering
category: visualization
description: Render graph data as a node-link diagram. Draw nodes as shapes and edges as lines connecting them,
    including directed, parallel and self-loop edges, in 2D or 3D on the same positions, with GPU acceleration so
    whole-graph overviews stay interactive.
status: in-progress
notes: "Partly ships: graphty-element (Babylon.js) draws nodes in many shapes, edges with arrowheads and tails, self-loops, curved and fanned parallel edges and 2D or 3D views through style layers, with meshes in graphty-element/src/meshes/. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Instanced rendering (shipped)
    - WebGL/WebGPU shaders (shipped)
    - Mesh batching (shipped)
