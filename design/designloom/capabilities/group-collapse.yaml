id: group-collapse
name: Group and Nested Containment Collapse
category: analysis
description: Reduced views of very large graphs by community, block-model level or k-core, with drill-down to members.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
