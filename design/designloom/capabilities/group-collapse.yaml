requirements:
    - Group nodes by an attribute or containment (team, application, site, schema, namespace, server over process, table
      over column) into collapsible boxes with aggregated edge counts and worst-of status rollup, expanding in place.
    - Nodes that stand for a cluster (a wallet cluster of addresses) and expand into members or collapse back, with
      membership evidence shown.
    - Group nodes by an attribute hierarchy (CIDR blocks, internal versus external, zones, code block groups) and
      collapse or expand each group.
    - Collapse a graph into a class-level or community-level summary graph for consumers who cannot read instance-level
      node-link diagrams.
    - Collapse nodes by a categorical attribute into group nodes sized by membership with aggregated edge weights,
      expand a group into subgroups, and show a group-by-group matrix of tie counts or weights.
    - Roll many nodes (pages, stories, accounts) up to one node per attribute value (domain, outlet, actor) with summed
      edge weights and a reversible mapping.
    - Aggregate nodes by geography, company or group with drill-down, and export with labels hidden or nodes grouped for
      confidential publication.
    - Color, group and collapse nodes by a level of an attached hierarchy (ICD chapter, MedDRA SOC or HLT, GO, chemical
      class), expanding back to members.
    - Nested groups that expand and collapse, laid out only when opened, with numeric per-node overlays summarized on
      collapsed groups.
    - Switch between person, address, domain and organization levels without re-importing.
