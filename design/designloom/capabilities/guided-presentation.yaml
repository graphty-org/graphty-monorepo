id: guided-presentation
name: Guided Presentation and Embed
category: export
description: Export an embeddable interactive view or print SVG of a verified subset with captions, disclaimers, a
    pinned manual layout, motion off, hover-highlighted paths, step-by-step reveal and phone-readable labels, plus a
    matching table of exactly the exported edges.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
