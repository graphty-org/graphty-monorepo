implemented_by_components: []
requirements:
    - Ordered steps each with a saved camera, focus or filter and Markdown text, played with transitions, published as a
      private, password or public link and embeddable with autoplay.
    - Ordered, captioned view states with text per step, published as PDF or slides or as a shareable, embeddable
      standalone HTML viewer with share controls, phone-readable labels, scroll-zoom and motion off, keyboard navigation
      and a tabular text alternative.
