requirements:
    - "Library parity: Expose hovered as a calculated value on the hovered node, its incident edges and its neighbors, so any style layer can emphasize them; hovering a port or node that highlights all its connections is how AWS and Azure dependency maps are read (dependency-and-impact-analysis), and headset users need hover to highlight incident edges (three-dimensional-and-immersive R6)"
    - "Library parity: Leave dimming of unrelated nodes and edges, and how strongly, to the style layers the consumer chooses; no fixed opacity is built in"
    - "Library parity: Show a node's label on hover even when labels are hidden; on-hover labels are a recommended alternative to color-coding many categories and a way to keep large graphs fast (Cambridge Intelligence; Cytoscape.js and yFiles performance guidance)"
    - "Library parity: Support hover on edges as well as nodes, showing the edge's label or attributes; Plotly's lack of edge hover is a documented frustration (code-first-data-scientists)"
    - "Library parity: Highlight a path on hover where the view is built around paths (WSJ network interactives)"
    - "Must: Report the hovered node or edge id, with neighbor and per-pair counts as data, to the host so it can show totals or a preview pane (ediscovery R9 sent/received/total on hover; personal knowledge graphs R4)"
    - "Library parity: Offer an option to extend the highlight beyond direct neighbors (default: direct neighbors only)"
    - "Library parity: Never make hover the only way to reach information; phones and published embeds have no hover, so a tap or selection must give the same result (WSJ, via journalism.co.uk)"
    - "Must: Support ray hover in XR headsets with a tolerance for small distant nodes (three-dimensional-and-immersive R6)"
    - "Library parity: Respond without perceptible delay, and do not trigger while panning or zooming"
    - "Library parity: Allow hover highlighting to be turned off; turning off pointer interaction is documented as the largest performance gain in 3d-force-graph"
