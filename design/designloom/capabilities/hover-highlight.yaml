id: hover-highlight
name: Hover Highlighting
category: interaction
description: Mark the node or edge under the pointer, with its incident edges and neighbors, as hovered so style layers
    can emphasize them, and reveal its label or details, for exploration without commitment. Hover never carries
    information that a tap or selection cannot also reach, since phones and published embeds have no hover.
status: in-progress
notes: "Partly ships: the hovered calculated value (graphty-element/src/NodeBehavior.ts) and its Hovered style layer. Planned: path highlight on hover, extending the highlight past direct neighbors, and ray hover with a tolerance in XR. Any requirement below that this note does not name as shipping counts as planned."
