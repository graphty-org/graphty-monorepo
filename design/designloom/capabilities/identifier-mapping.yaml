requirements:
    - "Must: Identifier mapping (symbol, Entrez, Ensembl, UniProt, STRING, KEGG, miRBase, BiGG) with match counts and
      Excel-mangled symbol detection; for plants, convert gene ids between genome releases from an old-to-new table and
      report how many changed (5.17)"
    - "Must: Map protein names, UniProt accessions, gene symbols, compound names, PubChem CIDs and InChIKeys with a species filter, and report matched, unmatched and duplicate identifiers instead of dropping them silently."
    - "Must: Maps protein names, UniProt ids, gene symbols, compound names, PubChem CIDs and InChIKeys to one another, with a species filter. Reports counts of matched, unmatched and duplicate ids and lists the unmatched ones instead of dropping them silently."
