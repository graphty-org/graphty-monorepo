id: input-output-exposure
name: "Direct and indirect exposure through the Leontief inverse"
category: analysis
description: "Compute each node's direct and total (indirect) exposure to a shock on a dense weighted input-output or trade matrix, including self-loops, and write the result as node attributes for encoding and ranking (Bank of England 2025 toolkit; Cerina et al. 2015)."
status: planned
notes: "Research trace: supply-chain-and-physical-infrastructure-networks.md section 5.12 (input-output and trade network exposure). No numbered requirement row backs it, so its requirements are Could and come after every Must and Should."
