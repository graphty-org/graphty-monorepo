implemented_by_components: []
requirements:
    - "Could: Compute each node's direct and total (direct plus indirect) exposure to a shock on a dense weighted input-output or trade matrix, keeping self-loops (a sector's purchases from itself)"
    - "Could: Write the exposures as node attributes for encoding, ranking and filtering, with the matrix year and the shock recorded"
