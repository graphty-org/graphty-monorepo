id: input-rederivation
name: Re-derive downstream networks from replaced inputs
category: analysis
description: Replace an input list (compounds after serum profiling, disease genes after GEO analysis, a changed cutoff)
    and rebuild every downstream network, count and figure while keeping styling and layout, with each step's count
    recorded.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W430
    - W431
    - W432
    - W439
    - W440
    - W441
implemented_by_components: []
requirements:
    - Swaps one input list, for example compounds measured in serum or disease genes from GEO, and rebuilds every
      downstream network, count and figure. Styling and layout are kept, and every threshold and step count is recorded
      so the numbers cannot drift.
