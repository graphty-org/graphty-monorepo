id: inter-cluster-link-counts
name: "Between-cluster connection counts"
category: analysis
description: "Report, per pair of clusters, the number of edges running between them and that number normalized per member, so a real relationship between two lines is distinguished from random links. Practitioners compute this by filtering to two clusters, reading the total edge count and subtracting each cluster's internal edges in a spreadsheet, and readers of the tutorial reported negative results from arithmetic mistakes."
