id: interactive-threshold
name: Interactive edge-weight threshold
category: analysis
description: Slide a correlation or weight threshold with live edge, component and module counts and the chosen value
    recorded with exports.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W170
    - W171
    - W260
    - W261
    - W263
    - W265
    - W396
    - W402
implemented_by_components: []
requirements:
    - A threshold control on an edge weight (importance, similarity, relative risk, ROR) that sparsifies the shown
      subgraph live and reports edges kept, edge density and component count.
    - An edge-attribute threshold slider that recomputes connected components or communities and recolors clusters as it
      moves, at 10^5 nodes and millions of edges.
