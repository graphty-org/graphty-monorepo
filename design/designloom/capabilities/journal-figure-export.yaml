requirements:
    - "Must: Figure export to journal specs: 90, 140, 190 mm widths; EPS, PDF, SVG, 300-1000 dpi TIFF; standard fonts;
      grayscale preview; pruning cutoff written in the figure note"
    - "Must: Export the whole graph or a chosen region independent of the viewport as vector SVG or PDF with embedded fonts and Unicode, or a bitmap at a physical size (mm or inches) and 300-600 dpi, with presets (85/114/174 mm columns, Letter, A4, A0, 16:9) and a legibility and grayscale preview; legend embedded in the export covering node and edge encodings."
    - "Must: Export SVG or PDF with subscripts and math labels, curved edges, a box to mark conditioning, black-and-white styles and journal column widths. Also covers SEM drawing conventions: ellipses for latents, rectangles for observed variables, residual arrows, and estimates with significance stars on the arrows."
    - "Must: No overlapping labels at the export's physical width and font size, resolved by label-overlap-removal
      before writing the file, so the figure needs no hand-editing (psychometric-network-analysis.md R11,
      network-pharmacology-herb-compound-target-networks.md R10)"
