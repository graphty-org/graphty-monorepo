id: label-overlap-removal
name: Label Overlap Removal
category: visualization
description: Place the node labels that are shown so that no two overlap and no label covers another node, on screen
    and in every exported figure, without hand-editing the file afterwards. Researchers in psychometrics, network
    pharmacology, ecology and social media analysis name overlapping labels as a reason their figures need Illustrator
    or Inkscape, and the tools they use either move nodes (Gephi Label Adjust), only reduce overlaps (yFiles generic
    labeling) or offer nothing for print (qgraph, Cytoscape).
status: planned
notes: "Research trace: psychometric-network-analysis.md requirement R11 (must); network-pharmacology-herb-compound-target-networks.md requirement R10 (must); ecological-interaction-networks.md (italic Latin labels with collision avoidance, should); communicating-findings-and-deliverables.md requirement R26. Not shipped: visual-encoding-nodes chooses which labels are visible but does not resolve overlaps."
algorithms: []
used_by_workflows:
