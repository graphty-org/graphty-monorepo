requirements:
    - "Library parity: Use GPU instanced rendering for node shapes and for edge lines"
    - "Should: Keep pan, zoom and selection interactive at the whole-graph overview sizes users report (10k to 100k+ nodes); track frame rate per graph size in a benchmark rather than promising fixed rates"
    - "Library parity: Skip nodes and edges outside the visible area (viewport culling), using a precomputed spatial index"
    - "Must: Hide labels below a readable on-screen size (level-of-detail labels), with the threshold an option"
    - "Library parity: Simplify node shapes and thin edges when they are too small on screen to tell apart, with the threshold an option"
    - "Must: Offer hiding edges while the view moves, as Cytoscape.js and yFiles do for large graphs"
    - "Library parity: Stop the render loop when nothing changes, and do not slow down each time the data is replaced (3d-force-graph's loop never stops above 5,000 nodes)"
    - 'Should: Keep labels fast on 10k+ nodes in 3D (3d-force-graph text sprites on 10,000+ nodes are "very slow")'
    - "Must: Apply attribute updates (color, size, label) many times a minute without moving nodes or restarting the layout"
    - "Must: Run large layouts off the main thread (worker or GPU) with progress, cancel and an optional time cap"
    - "Must: Reduce before drawing: aggregate nodes into supernodes (by community or a node column) sized by the count they hold, expanded on zoom-in or click; edge bundling or hiding as options"
    - "Must: Offer an optional visible-node cap with hidden-neighbor markers that show counts and expand on click (Grafana shows 200 nodes by default); the cap is the consumer's choice, so the element's default draws everything"
    - "Library parity: Gracefully degrade: reduce visual quality before dropping frames"
    - "Library parity: Expose rendering state as values (frame rate in debug mode, which optimizations are active) and a setting to force performance mode on, so an application can show its own indicator"
    - "Library parity: When a graph exceeds what the device can draw, report a code with the node and edge counts instead of a fixed node limit or English text, so the application can suggest filtering or sampling"
    - "Must: When WebGPU or workers are blocked (for example by a strict CSP), report a code instead of failing silently"
    - "Must: Performance tools: level-of-detail labels, hiding edges during interaction, WebGPU, worker layouts, layout
      time caps with progress"
    - "Library parity: Switch detail by how many objects are drawn as well as by on-screen size, as Cytoscape does (labels off above a node count, a coarse mode above a node-plus-edge count, less detail while the view moves), with each threshold an option"
    - "Library parity: Report which styles a fast rendering mode drops, as a value the application can show"
sources:
    - title: von Landesberger et al. 2011, Visual analysis of large graphs
      url: https://doi.org/10.1111/j.1467-8659.2011.01898.x
      summary: Survey of large-graph visualization and reduction; the reference for large-graph-rendering in
          data-preparation-and-import.md
    - title: Venturini, Jacomy and Jensen, What do we see when we look at networks
      url: https://arxiv.org/abs/1905.02202
      summary: Keeping every node visible "precludes the use of VNA on graphs of millions of nodes and edges"
    - title: yFiles, large graph performance
      url: https://docs.yworks.com/yfiles-html/dguide/large_graph_performance/
      summary: Level-of-detail styles and other large-graph tactics; a 10,000-node layout means "a waiting time of at
          least half a minute"
    - title: Cytoscape.js WebGL renderer preview
      url: https://blog.js.cytoscape.org/2025/01/13/webgl-preview/
      summary: 1,200 nodes and 16,000 edges went from about 20 to over 100 frames per second; the WebGL path has style gaps
    - title: Introducing cosmos.gl
      url: https://openjsf.org/blog/introducing-cosmos-gl
      summary: GPU simulation and rendering for "hundreds of thousands of points and links"
    - title: 3d-force-graph (README and issues 479, 491, 515)
      url: https://github.com/vasturiano/3d-force-graph
      summary:
          Text sprites slow on 10,000+ nodes; the animation loop never stops above 5,000 nodes; a request for WebGPU
          at 200k elements
    - title: Grafana Node Graph
      url: https://grafana.com/docs/grafana/latest/panels-visualizations/visualizations/node-graph/
      summary: Up to 200 visible nodes by default, hidden nodes behind count markers that expand on click
    - title: Developers Who Embed Graph Visualization in Products or Extend It With Plugins (section 10, table row 17)
      url: design/user-research/developers-embedding-and-extending-graph-visualization.md
      summary: "Must in the research. Covered by Designloom when researched: Partly"
    - title: Cytoscape User Manual, Rendering Engine
      url: https://manual.cytoscape.org/en/stable/Rendering_Engine.html
      summary: render.coarseDetailThreshold (default 4000 rendered nodes plus edges) and render.nodeLabelThreshold
          (default 200); detail is lowered further during interaction, when edges and charts may not be drawn
