id: large-graph-rendering
name: Large Graph Rendering
category: performance
description: Draw and interact with large graphs on the GPU, using level-of-detail, culling and reduction so the
    view stays interactive. Users ask for whole-graph overviews of 10k to 100k+ nodes, which need WebGL or GPU
    rendering, while most investigation views show a few hundred nodes at a time (Neo4j Browser starts at 300, Grafana
    shows 200 by default). At millions of nodes and edges no one draws every node; the graph is filtered, aggregated or
    coarse-grained first (Venturini, Jacomy and Jensen).
status: in-progress
notes: "Partly ships: graphty-element instanced meshes (graphty-element/src/meshes/), its largeGraphThreshold option, label minimum on-screen sizes (labelMinScreenSize) and off-thread or accelerated layouts. Planned: hiding edges while the view moves, supernode aggregation, a visible-node cap with hidden-neighbor markers, and a report of which styles a fast mode drops. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - GPU instancing (shipped)
    - Viewport culling (shipped)
    - Level-of-detail (shipped for labels)
    - Barnes-Hut for layout (shipped in the ngraph layout)
