requirements:
    - "Must: Fruchterman-Reingold as the default force model, and record which model produced a drawing (no source favors one model as a universal default)"
    - "Must: ForceAtlas2 as an alternative, exposing the parameters tutorials teach: scaling, gravity, LinLog mode and prevent overlap (there is no catch-all setting)"
    - "Must: Expose repulsion strength, attraction strength, ideal edge length and gravity as options, with the underlying algorithm's defaults"
    - "Must: Accept a seed and record the seed actually used, including the random one drawn when none was passed, so any drawing can be reproduced; the default stays unseeded"
    - "Must: Give the same drawing for the same seed however the data arrives (in one write or split across frames)"
    - "Library parity: Animate convergence in real time, with a pause and a reduced-motion option (WCAG 2.2.2 Pause, Stop, Hide)"
    - "Must: Pin individual nodes, or all selected nodes, to fixed positions, and honor fixed positions supplied in the data"
    - "Library parity: Stop automatically when node movement falls below a configurable threshold or at a configurable iteration cap, and report which rule ended the run (converged, iteration cap, stopped by the user) with the iteration count, so a figure from an unconverged layout is visible as such"
    - "Library parity: Provide a 'Stop layout' control to halt iteration manually"
    - "Must: Warm start from current or supplied positions, so a layout can be chained from a previous time window or refined after pinning qualifying nodes"
    - "Library parity: Place disconnected components in separate regions without overlap"
    - "Library parity: Use the Barnes-Hut approximation for large graphs, with its theta parameter exposed"
    - "Must: Signal when a layout is done (an event or a promise), report progress, and accept an optional time cap"
    - "Must: Record the algorithm, parameters, seed and stop rule with the layout, so they can be exported with a figure"
    - "Should: Allow two layouts of the same graph side by side for comparison"
    - 'Must: Layout as a recorded method: seeded force layouts with exposed parameters (scaling, gravity, LinLog,
      prevent overlap), visible convergence, pinned "qualifying" nodes, side-by-side comparison'
sources:
    - title: Fruchterman and Reingold 1991, Graph drawing by force-directed placement
      url: https://doi.org/10.1002/spe.4380211102
      summary: The force model used as the default
    - title: Jacomy et al. 2014, ForceAtlas2
      url: https://doi.org/10.1371/journal.pone.0098679
      summary: ForceAtlas2 and its scaling, gravity, LinLog and prevent-overlap settings
    - title: Venturini, Jacomy and Jensen, What do we see when we look at networks
      url: https://arxiv.org/abs/1905.02202
      summary: Visual network analysis; no catch-all setting; layout distance correlates poorly with shortest-path
          distance (R^2 0.167) and force layouts "do not produce coherent axes"
    - title: NetworkX spring_layout
      url: https://networkx.org/documentation/stable/reference/generated/networkx.drawing.layout.spring_layout.html
      summary: Layouts start from random coordinates unless a seed is passed
    - title: Grandjean, Introduction to network visualization with Gephi
      url: https://www.martingrandjean.ch/introduction-to-network-visualization-gephi/
      summary:
          The taught steps, Fruchterman-Reingold "until the graph stabilizes" then ForceAtlas2 with prevent overlap,
          with no record of when or why the layout stopped
    - title: ndtv compute.animation
      url: https://search.r-project.org/CRAN/refmans/ndtv/html/compute.animation.html
      summary: Each time slice seeded with the previous positions, for stable layouts across time
    - title: Network Scientists and the Validity of Core Analysis Methods (section 9, requirement R23)
      url: design/user-research/network-scientists-and-analysis-method-validity.md
      summary: "Must in the research. Covered by Designloom when researched: Partly: no seed, stop rule or comparison"
