id: layout-force-directed
name: Force-Directed Layout
category: visualization
description: Position nodes using force-directed algorithms that simulate physical forces - repulsion between all nodes
  and attraction along edges. Produces aesthetically pleasing layouts that reveal cluster structure naturally.
status: planned
algorithms:
  - Fruchterman-Reingold
  - ForceAtlas2
  - Barnes-Hut approximation
  - GPU-accelerated force calculation
used_by_workflows:
  - W02
  - W14
  - W15
implemented_by_components:
  - layout-option
  - layout-panel
requirements:
  - Implement Fruchterman-Reingold algorithm as default force model
  - Implement ForceAtlas2 algorithm as alternative for large graphs
  - Provide repulsion strength parameter adjustable from 0.1 to 10.0 (default 1.0)
  - Provide attraction strength parameter adjustable from 0.1 to 10.0 (default 1.0)
  - Provide ideal edge length parameter adjustable from 50 to 500 pixels (default 100)
  - Provide gravity parameter adjustable from 0.0 to 1.0 to pull nodes toward center
  - Display real-time layout animation at minimum 30fps during convergence
  - Allow pinning individual nodes to fixed positions via right-click menu
  - Allow pinning multiple selected nodes simultaneously
  - Detect convergence when average node movement falls below 0.1 pixels per iteration
  - Stop automatically when converged or after 1000 iterations maximum
  - Provide 'Stop layout' button to halt iteration manually
  - Support warm start using current positions as initial state
  - Place disconnected components in separate regions with 200px minimum gap
  - Use Barnes-Hut approximation (theta=0.8) for graphs over 1000 nodes
  - Complete initial layout of 1000-node graph within 3 seconds
  - Complete initial layout of 10,000-node graph within 15 seconds
sources:
  - title: Complete Graph Visualization Textbook - Chapter 4
    url: https://graphty.app/docs/
    summary: Force-directed algorithms including Fruchterman-Reingold and ForceAtlas2
