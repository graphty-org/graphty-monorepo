id: layout-force-directed
name: Force-Directed Layout
category: visualization
description: Position nodes by simulated forces, repulsion between all nodes and attraction along edges
    (Fruchterman-Reingold, ForceAtlas2). Applied analysts read the drawing as an analysis (visual network analysis),
    reading dense regions, empty space, bridges and poles. Positions are not measurements, though. Layout distance correlates
    poorly with shortest-path distance, the axes mean nothing, a visual cluster need not match a computed partition,
    and two runs differ unless seeded. So the layout is a recorded method, with parameters exposed, a seed accepted and
    recorded, and the rule that stopped it reported. The default stays unseeded; a consumer that wants the same drawing
    on every load passes a seed.
status: in-progress
notes: "Partly ships: Fruchterman-Reingold as the spring layout (graphty-element/src/layout/SpringLayoutEngine.ts, on the CPU or an accelerator), graphty-element/src/layout/ForceAtlas2LayoutEngine.ts (scaling ratio, gravity, strong gravity, LinLog, dissuade hubs, seed), D3GraphLayoutEngine.ts and NGraphLayoutEngine.ts (Barnes-Hut theta), with pinned nodes held by the layout. Planned: prevent overlap for ForceAtlas2, a recorded stop rule, the seed actually drawn recorded with the drawing, and two layouts side by side. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Fruchterman-Reingold (shipped as the spring layout)
    - ForceAtlas2 (shipped; no prevent overlap yet)
    - Barnes-Hut approximation (shipped in the ngraph layout (theta))
    - GPU-accelerated force calculation (shipped through webgpu-graph-algorithms)
