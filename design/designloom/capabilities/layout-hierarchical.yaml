requirements:
    - "Must: Assign nodes to layers from edge direction for DAGs (Graphviz dot ranks by network simplex)"
    - "Must: Assign layers from a node column when one is given (node type, generation, or trophic level including fractional values), not only from edge direction"
    - "Library parity: Minimize edge crossings between adjacent layers (barycenter or median heuristic), with the iteration count an option"
    - "Must: Support top-to-bottom (the default), bottom-to-top, left-to-right and right-to-left orientations"
    - "Must: Lay out graphs with cycles instead of refusing them: reverse a small set of back-edges for layering and report them as values, so a style layer can draw them distinctly"
    - "Must: Report that the graph contains cycles as a code, not as English text"
    - "Library parity: Provide an option to hide back-edges for a cleaner hierarchy"
    - "Library parity: Provide layer spacing and node spacing options"
    - "Library parity: Center a parent over its children and align nodes within a layer to reduce total edge length"
    - "Library parity: Handle multiple roots as separate hierarchies or under a virtual root"
    - "Must: Keep positions stable when parts of the graph are expanded or collapsed"
    - "Should: Respect a given order of a node's outgoing edges (for example taken and not-taken branches in control flow)"
    - "Library parity: Report progress and support cancel on large layered layouts (Grafana warns its layered layout 'can be slow when the graph has more than 500 nodes')"
sources:
    - title: Sugiyama, Tagawa and Toda 1981, Methods for visual understanding of hierarchical system structures
      url: https://doi.org/10.1109/TSMC.1981.4308636
      summary: The layered layout framework (layering, crossing reduction, coordinate assignment)
    - title: Gansner, Koutsofios, North and Vo 1993, A technique for drawing directed graphs
      url: https://doi.org/10.1109/32.221135
      summary: The Graphviz dot algorithm, ranking by network simplex
    - title: Grafana Node Graph
      url: https://grafana.com/docs/grafana/latest/panels-visualizations/visualizations/node-graph/
      summary: Layered is the default layout for service graphs and can be slow above 500 nodes
    - title: BloodHound graph controls
      url: https://bloodhound.specterops.io/analyze-data/explore/graph-controls
      summary: Attack-path results open in left-to-right ranked layers by default
    - title: cheddar, plots and statistics vignette
      url: https://packages.oit.ncsu.edu/cran/web/packages/cheddar/vignettes/PlotsAndStats.pdf
      summary: Food webs plotted by trophic level with basal species at the bottom; cycles from cannibalism and omnivory
