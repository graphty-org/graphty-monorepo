id: layout-hierarchical
name: Hierarchical Layout
category: visualization
description: Position nodes in ranked layers so edges flow one way (top-to-bottom or left-to-right), for
    dependency, lineage, attack-path, causal and family-tree graphs (the Sugiyama framework; graphty ships Graphviz
    dot). Users ask for left-to-right layers for lineage, build and attack-path results, top-to-bottom for
    infrastructure tiers and control flow, and generations in rows for genealogies. Layers do not always come from a
    DAG. Food webs place species by fractional trophic level, with cycles from cannibalism and omnivory, and
    multipartite graphs order tiers by a node column such as node type.
status: in-progress
notes: "Partly ships: the Graphviz dot engine, graphty-element/src/layout/GraphvizLayoutEngine.ts, with rankdir TB, LR, BT or RL and node and rank separation; dot breaks cycles itself and keeps a node budget and a time budget. Planned: layers from a node column, reported back-edges and a cycles code, hiding back-edges, positions kept stable across expand and collapse, and edge order constraints. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Sugiyama framework (shipped through Graphviz dot)
    - Network simplex layering (Graphviz dot) (shipped)
    - Barycenter crossing reduction (shipped as dot's median crossing reduction)
