requirements:
    - "Library parity: Place the designated focus node at the center"
    - "Library parity: Arrange 1-hop neighbors in the first ring, 2-hop neighbors in the second, and so on to a configurable maximum depth"
    - "Must: Accept several focus nodes, placing each node by its hop distance to the nearest focus"
    - "Library parity: Distribute nodes evenly by angle within each ring"
    - "Library parity: Allocate angular sectors proportional to subtree size for hierarchical data"
    - "Library parity: Provide ring spacing and maximum ring count options"
    - "Library parity: Collapse nodes beyond the maximum ring into a peripheral marker that carries their count"
    - "Library parity: Handle disconnected components by showing only the focus node's component, or placing the rest outside the rings"
    - "Must: Expose each node's ring (hop distance) as a value, so an application can label rings or count nodes per ring"
    - "Library parity: Reduce edge crossings within the angular constraints using local optimization"
    - "Library parity: Support changing the focus node via double-click on any node"
    - "Library parity: Animate the transition when the focus changes, keeping the angular order of nodes so the reader keeps their place, and skip the animation when reduced motion is requested"
    - "Library parity: Provide an option to show only nodes within N hops of the focus (default: all reachable)"
sources:
    - title: Yee, Fisher, Dhamija and Hearst 2001, Animated exploration of dynamic graphs with radial layout
      url: https://doi.org/10.1109/INFVIS.2001.963279
      summary: Radial layout around a focus node, with animated focus changes that preserve orientation and order
    - title: Perry, Pescosolido and Borgatti 2018, Egocentric Network Analysis
      url: https://doi.org/10.1017/9781316443255
      summary: Ego networks, their extraction and per-ego measures
    - title: GSS name generator (PMC9116615)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9116615
      summary: Personal-network surveys with small alter sets per ego
    - title: University of Minnesota Extension, Ripple Effect Mapping
      url: https://extension.umn.edu/learn-about/ripple-effect-mapping
      summary: Ripple Effects Mapping produces a radial tree of a program's effects
