id: layout-radial
name: Radial Layout
category: visualization
description: Position nodes in concentric rings around a focus node by hop distance (ego networks), or a tree
    around its root with angular sectors by subtree size. Personal-network researchers work with egos of about 5 to 50
    alters; code-first analysts ask for k-hop neighborhoods around one or many seed nodes with hop distance as a visual
    channel; systems mappers draw authored hierarchies such as Ripple Effects Mapping trees as radial trees. Changing
    the focus animates between layouts so the reader keeps their place (Yee et al. 2001).
status: in-progress
notes: "Partly ships: graphty-element/src/layout/RadialLayoutEngine.ts places one root at the center with nodes in rings by hop distance, with scaling options. Planned: several focus nodes, maximum depth and ring spacing options, a peripheral marker for collapsed rings, ring values on each node, crossing reduction, refocus by double-click with an order-keeping animation, and an N-hop limit. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - Radial tree layout (shipped)
    - Ego-centric placement (shipped for one root)
