requirements:
    - "Must: Tiered layout by a typed node column (intervention, early, intermediate, long-term outcome) with
      bottom-to-top pathways"
    - "Must: Arrange nodes in ordered tiers taken from a categorical node column (herb, compound, target, pathway) with within-tier order chosen to reduce edge crossings; layout-hierarchical derives layers from edge direction instead."
    - "Must: Places each node type (taken from a node column such as herb, compound, target, pathway, disease, taxon, metabolite) in its own ordered column or ring, orders nodes inside a tier to reduce crossings with adjacent tiers, and reproduces the same arrangement on reload; optional Sankey-like flow view."
    - "Must: Places a typed multipartite graph in ordered tiers (columns or concentric rings) taken from a node column such as herb, compound, target, pathway or disease. Nodes within each tier are ordered to reduce crossings with the next tier, and the same arrangement comes back on reload. A Sankey-like flow view is optional. Cytoscape's circle-per-type and hierarchical layouts each do only part of this."
