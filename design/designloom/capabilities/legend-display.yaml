requirements:
    - "Must: Generate the legend from the live style layers, so it uses exactly the mapping and palette of the drawn graph"
    - "Must: Cover categorical node color (category to color), quantitative node color (gradient with its minimum and maximum values), node size (representative sizes with their values) and node shape (shape to category)"
    - "Must: Cover edge encodings as well as node encodings: edge color by type, edge width by weight with its minimum and maximum, and edge line style"
    - "Library parity: For a weight-driven encoding, name the attribute behind it and state whether a larger value means a stronger or a more distant tie, never an unlabeled weight convention"
    - "Must: Include the legend inside exported images and vector figures, with its text kept as editable text in vector exports"
    - "Must: Offer a parameters and provenance block next to the legend (data source and version, filters, algorithms, layout and its seed, time window, date) for figures and methods text"
    - "Must: Return the legend as neutral structured data (encoding, attribute, entries, range values, units when the data declares them); wording, headings, order and placement are the application's"
    - "Must: Never rely on color alone: when color encodes a category, shape, size, pattern or a text label can carry the same information, and the legend shows it"
    - "Library parity: Let the application hide, collapse and place the legend so it does not cover the graph"
    - "Library parity: Support clicking a legend entry to select or filter the elements in that category, and shift-clicking to add or remove a category"
    - "Library parity: When a categorical legend is longer than the application chooses to show, return the count of entries left out instead of dropping them silently"
    - "Library parity: Update the legend in the same frame as the style change it describes, so the change feels instant"
sources:
    - title: "Cytoscape Legend Creator tutorial"
      url: "https://cytoscape.org/cytoscape-tutorials/protocols/legend-creator"
      summary: "Legend Creator builds legends from node mappings and does not support edge line style, color or thickness"
    - title: "Gephi: export visualizations as static images (University of Toronto)"
      url: "https://mdlutoronto.github.io/gephi-visualize-network-dataset/7-g-export-visualizations-as-static-images/"
      summary: "Gephi Preview export has no legend: use Illustrator or Inkscape to add one"
    - title: "EnrichmentMap protocol: exporting figures, creating legends and saving work"
      url: "https://baderlab.github.io/EnrichmentMap_Protocol/exporting-figures-creating-legends-and-saving-work.html"
      summary: "Figure legends and creation parameters are assembled by hand after export"
    - title: "Munzner, Visualization Analysis and Design (2014)"
      url: "https://doi.org/10.1201/b17511"
      summary: "Visual encoding channels and how a reader decodes them"
    - title: "WCAG 2.2 success criterion 1.4.1, Use of Color"
      url: "https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html"
      summary: "Color is not used as the only visual means of conveying information"
    - title: "User research: communicating findings and deliverables"
      url: "design/user-research/communicating-findings-and-deliverables.md"
      summary: "Must: a legend generated from the live style for node and edge encodings inside the export, plus a parameters and provenance block"
