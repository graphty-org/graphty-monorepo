id: legend-display
name: Legend Display
category: visualization
description: "Display legends that explain the visual encodings in use -- what node and edge colors, sizes, widths and shapes stand for -- generated from the live style so they never drift from the drawing, on screen and inside exported figures. People who publish network figures otherwise build legends by hand: Cytoscape's Legend Creator covers node mappings only, Gephi's Preview export has no legend, and parameters are copied into the legend from dialogs. The element returns the legend as structured data; the application decides its wording, grouping and placement."
status: in-progress
notes: "Partly ships: the element's legend attribute and graphty/src/workspace/canvas/LegendCard.tsx; the legend is drawn into figures by graphty-element/src/screenshot/drawLegend.ts. Planned: clicking a legend entry to select or filter its elements, a provenance block, and a count of entries left out. Any requirement below that this note does not name as shipping counts as planned."
