requirements:
    - "Must: Linked views over the same selection: network, tree, map, timeline, epi curve and table, with a selection
      in one applying to all"
    - "Must: Charts of node or edge attributes (creation date, followers, language, activity over time) where selecting a bar selects nodes and a graph selection updates the charts."
    - "Should: Scatter plot of two node attributes (for example impact versus spend, success rate versus count) linked to graph selection."
    - "Should: A scatter plot of an ordination (PCA, PCoA, spectral embedding) linked to the graph or tree, with selection flowing both ways."
