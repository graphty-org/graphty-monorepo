id: linked-views-selection
name: Linked Views Over One Selection
category: visualization
description: Network, tree, map, timeline, epidemic curve, interval (Gantt) and table views over the same data, where a
    selection made in any one view applies to all of them, including lasso selection on a map or a tree.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W210
    - W213
    - W215
    - W228
    - W396
    - W397
    - W401
    - W63
    - W67
    - W68
    - W71
    - W72
implemented_by_components: []
requirements:
    - Charts of node or edge attributes (creation date, followers, language, activity over time) where selecting a bar
      selects nodes and a graph selection updates the charts.
    - Scatter plot of two node attributes (for example impact versus spend, success rate versus count) linked to graph
      selection.
    - A scatter plot of an ordination (PCA, PCoA, spectral embedding) linked to the graph or tree, with selection
      flowing both ways.
