id: live-data-source
name: Live Graph Data Source
category: analysis
description: Connect to a graph database or warehouse graph (Neo4j Bolt/HTTP, Neptune, Gremlin Server, SPARQL endpoint,
    BigQuery/Spanner/Fabric/Oracle graphs) and fetch subgraphs on demand instead of importing a file; search, expand and
    paging run against the store, read-only by default, through a documented adapter so consumers write no fetch or
    mapping code.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
