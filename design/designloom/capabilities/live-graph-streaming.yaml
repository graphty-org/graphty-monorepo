id: live-graph-streaming
name: Live Graph History
category: analysis
description: Append new nodes and edges as they arrive without resetting the view, and flag movement on nodes the user
    has put on a watch list.
status: planned
notes: "Research trace: financial-crime-fraud-aml-kyc.md section 10, requirement 22 (Should)."
algorithms: []
used_by_workflows:
    - W122
    - W124
    - W312
    - W325
    - W333
    - W105
    - W3096
implemented_by_components: []
requirements:
    - "Should: Live-updating graph as new transactions arrive, and watch lists that flag movement on chosen nodes"
    - "Should: Append, change and delete events in a defined order without reload, a window that follows the latest event, and incremental layout; accept Gephi-streaming-style JSON mutation events."
    - "Must: Apply per-item changed, renamed, deleted and all-resolved events as small graph diffs without rebuilding or re-laying out the whole graph."
    - "Should: A live source that re-reads a running system's topology on change or on a timer, adds and removes nodes and edges without moving the ones that stay, and can be paused; also reads the same graph saved as DOT (a ROS node-and-topic graph; rqt_graph's auto-refresh request has been open since 2016)"
