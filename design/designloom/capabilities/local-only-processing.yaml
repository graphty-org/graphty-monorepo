requirements:
    - Work fully offline with no network calls for data, state that guarantee, and save encrypted projects for sensitive
      unpublished investigations.
    - All import, analysis and export run on the user's machine with no data sent to a server, and work offline, for
      engagement and incident data that cannot leave the environment.
    - Guarantee that imported text and transcripts are processed in the browser and never uploaded.
