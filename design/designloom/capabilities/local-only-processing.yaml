id: local-only-processing
name: Local-Only Processing with a Data Location Statement
category: analysis
description: Run the whole analysis in the browser with nothing uploaded, and state visibly where data goes.
    Identifiable surveillance, patient movement and claims data cannot leave the building, and in public health genomics
    the choice between local processing and a streaming server is a data-sensitivity decision made before a performance
    one.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
