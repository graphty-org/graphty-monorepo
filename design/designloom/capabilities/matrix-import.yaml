requirements:
    - "Must: Import a square adjacency matrix (text/CSV/TSV, whitespace, comma or tab) as a weighted graph; use
      header-row labels as node ids when present (XCP-D relmat TSV), else join a node table by row order; validate N x N
      and symmetry; treat zero as no edge"
    - "Must: Import a wide interaction matrix (names in first row and column) as a weighted bipartite or square directed graph, and split a long observation table into one network per site or season, optionally padded to one shared species list."
    - "Must: Import and export adjacency matrices, one matrix per relationship type, and respondent-by-member survey matrices with node attribute sheets."
    - "Must: Import a dense adjacency, correlation or topological overlap matrix, a long all-pairs table, or a sparse matrix with a node table (.h5ad), then sparsify by weight threshold or top-k per node with live edge, component and hub-retention counts and a recorded cut."
    - "Must: Read adjacency, incidence, similarity and distance matrices (and stacks of them), symmetrize, threshold by absolute value or proportional density, and preview edge count, density and components across a sweep before building."
    - "Must: Import a square weights or adjacency matrix (CSV with item names as header and row names) as a weighted, signed, undirected or directed graph with zeros as absent edges, plus an optional node table (label, full text, group, role)."
sources:
    - title: "Network Neuroscientists: Structural, Functional and Cellular Connectomics (section 10, requirement R1)"
