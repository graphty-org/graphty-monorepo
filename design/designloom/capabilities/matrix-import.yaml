id: matrix-import
name: Matrix and observation-table import
category: data
description: Import a square (or rectangular) weighted adjacency matrix from text/CSV/TSV, including BrainNet
    .node/.edge pairs and XCP-D relmat TSV; header labels or a row-order-joined node table give node ids; validates N x
    N shape and symmetry; zero means no edge.
