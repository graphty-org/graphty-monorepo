implemented_by_components: []
requirements:
    - Show the graph as an adjacency matrix heatmap reordered by a node attribute (network, module, hemisphere) with
      block outlines and diverging color for signed weights, selection linked to the node-link view.
    - Shaded adjacency matrix linked to the node-link view, sortable by marginal totals or module to reveal nestedness
      and modules.
    - Show a graph as an adjacency matrix reordered by cluster so clusters form blocks on the diagonal, linked to the
      node-link view.
    - Show the graph as an ordered adjacency matrix beside the node-link drawing, linked by selection.
    - Adjacency heatmap with ordering by module or attribute and block outlines, exportable as a figure panel.
