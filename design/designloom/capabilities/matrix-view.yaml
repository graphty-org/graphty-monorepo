id: matrix-view
name: Sortable adjacency matrix view
category: visualization
description: Adjacency matrix with hierarchical rows, triangularization and click-for-path, synchronized with the
    node-link view; also serves traceability matrices with empty-row gap detection.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
