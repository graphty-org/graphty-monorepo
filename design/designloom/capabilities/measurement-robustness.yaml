id: measurement-robustness
name: Measurement Robustness
category: analysis
description: Edge or node subsampling with rank correlation to the original, threshold and density sweeps, rerun spread,
    alternative representations and nulls.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
