id: metric-histograms
name: Metric Distribution Charts
category: visualization
description: "Display distribution charts for any numeric node or edge attribute: a histogram for values over a modest range and, for heavy-tailed quantities such as degree, strength and centrality, the complementary cumulative distribution (CCDF) on log-log axes, which needs no bins. Charts are linked to the graph: a bar or a brushed range selects its elements, and filtering updates the chart. The chart describes a distribution and never labels it 'power-law'; fitting belongs to degree-distribution-fit."
status: in-progress
notes: "Partly ships: the session's histogram and graphty/src/workspace/inspector/Distribution.tsx. Planned: the CCDF on log-log axes, distributions split or stacked by category, brushing bars to select, and CSV export of the bins. Any requirement below that this note does not name as shipping counts as planned."
