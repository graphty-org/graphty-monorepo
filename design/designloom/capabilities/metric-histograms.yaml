requirements:
    - "Library parity: Generate a histogram for any numeric node or edge attribute, with the bin rule named in the result and a caller override for bin count or bin width"
    - "Library parity: Offer the CCDF on log-log axes for degree, strength, centrality and other heavy-tailed attributes"
    - "Must: Never fit a line by least squares on a log-log histogram, and never classify the shape (normal, power-law, bimodal); a power-law judgment comes only from degree-distribution-fit as plausible, not plausible or alternative favored"
    - "Library parity: Provide log-scale toggles for the x axis (with logarithmic bins) and the y axis"
    - "Library parity: Show mean and median as distinct reference lines, and show spread by quartiles rather than a mean plus or minus standard deviation band, which misdescribes heavy-tailed attributes"
    - "Library parity: Return count, missing and invalid value counts, minimum, maximum, mean, median, quartiles and standard deviation as numbers"
    - "Library parity: Support clicking a bar to select the elements in its range, shift-clicking to add them, and brushing across bars to select a range"
    - "Library parity: Split or stack the distribution by a category such as node type, and overlay several distributions in distinct colors for comparison"
    - "Library parity: Update the chart when filters change the visible graph, fast enough to feel immediate, with progress feedback past about a second"
    - "Library parity: Export the chart through export-image and its data as CSV with bin edges and counts"
    - "Library parity: Return a code with the value count when there are too few values to chart, instead of an empty chart"
sources:
    - title: "Clauset, Shalizi and Newman, Power-law distributions in empirical data (2009)"
      url: "https://arxiv.org/abs/0706.1062"
      summary: "Plot the CCDF; least-squares fits on log-log histograms are biased; a power law is only ever plausible"
    - title: "Broido and Clauset, Scale-free networks are rare (2019)"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6399239/"
      summary: "Of 928 networks 4% met the strongest scale-free evidence; a log-normal fit at least as well for 88%"
    - title: "Neo4j Bloom scene interactions"
      url: "https://neo4j.com/docs/bloom-user-guide/current/bloom-visual-tour/bloom-scene-interactions/"
      summary: "Filter drawer with histograms and sliders; filtered elements grey out"
    - title: "i2 Analyst's Notebook: showing data distribution"
      url: "https://docs.i2group.com/anb/10.0.0/showing_data_distribution.html"
      summary: "Investigators read peaks in attribute histograms"
    - title: "Gephi Statistics Panel"
      url: "https://gephi.org/users/"
      summary: "Distribution charts for network metrics"
    - title: "User research: network scientists and analysis method validity"
      url: "design/user-research/network-scientists-and-analysis-method-validity.md"
      summary: "Keep histograms for small ranges, offer a log-log CCDF, drop power-law detection and mean-plus-sd outlier rules"
