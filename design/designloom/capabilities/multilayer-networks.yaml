id: multilayer-networks
name: Multilayer Networks
category: analysis
description: Layers and interlayer links as a data model; multilayer modularity sweeping coupling with resolution;
    per-layer communities with persistence; stacked-layer and edge-colored-by-layer views.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
used_by_workflows:
    - W09
    - W104
    - W217
    - W221
    - W225
    - W230
    - W303
    - W413
    - W46
implemented_by_components: []
requirements:
    - Treat each link type as a layer, compute measures per layer and on chosen overlays with per-type weights, and
      compare them side by side.
    - Model layers over one entity set (BOM over site, strand under circuit, trade and ownership edge families, facility
      on another sector's provider) and propagate impact across layers.
    - Import layers from per-layer files, a layer column or an extended edge list; keep layers distinct with optional
      weighted interlayer links; compute per-layer and cross-layer metrics (overlap, overlapping degree, participation,
      versatility); show stacked, side-by-side, edge-colored and flattened views.
    - Assign layers from a node attribute and arrange them side by side, stacked, star or cube; per-layer and
      cross-layer layouts; separate styling and filtering of inter-layer edges; multiple edge channels.
