requirements:
    - "Should: Treat each link type as a layer, compute measures per layer and on chosen overlays with per-type weights, and compare them side by side."
    - "Must: Model layers over one entity set (BOM over site, strand under circuit, trade and ownership edge families, facility on another sector's provider) and propagate impact across layers."
    - "Should: Import layers from per-layer files, a layer column or an extended edge list; keep layers distinct with optional weighted interlayer links; compute per-layer and cross-layer metrics (overlap, overlapping degree, participation, versatility); show stacked, side-by-side, edge-colored and flattened views."
    - "Must: Assign layers from a node attribute and arrange them side by side, stacked, star or cube; per-layer and cross-layer layouts; separate styling and filtering of inter-layer edges; multiple edge channels."
