id: multiplex-relations
name: Multiplex Relations
category: analysis
description: Several relations (link types) on one actor set, each switchable, combinable and exportable as its own edge
    list or matrix.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
