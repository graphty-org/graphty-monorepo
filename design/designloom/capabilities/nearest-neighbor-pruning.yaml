name: Nearest Neighbor Pruning of Weighted Edges
category: analysis
description: Keep each node's shortest (strongest) weighted link, with ties and near-ties admitted by a small epsilon,
    applied to one edge layer only, as a standard simplification of molecular distance networks before epidemiologic
