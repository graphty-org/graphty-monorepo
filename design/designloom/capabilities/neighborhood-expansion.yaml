requirements:
    - "Must: Expand the 1-hop neighbors of the selected node(s) with a single action"
    - "Must: Provide N-hop expansion with a caller-set depth (default 1)"
    - "Must: Filter expansion by relationship type, direction, neighbor category and attribute, with a maximum count and an order (most or least connected)"
    - "Must: Show each node's count of undisplayed neighbors before it is expanded"
    - "Must: Before expanding, return how many nodes and edges the expansion would add, as numbers the application words"
    - "Must: Above a threshold the consumer sets, open a selective expansion (types, categories, count) instead of adding everything, and never auto-expand a hub; the thresholds are options, and expansion is never refused outright"
    - "Must: When an expansion is capped, report how many of how many neighbors are shown and offer the next page or a refinement"
    - "Library parity: When filters match no neighbors, report that separately from a node having no more neighbors"
    - "Must: Reveal relationships among nodes already shown"
    - "Must: Keep the scene additive: new expansions add to the canvas, with dismiss, dismiss others and dismiss isolated nodes"
    - "Must: Place new nodes near the node they came from and integrate them with an incremental layout that keeps existing positions stable"
    - "Should: Mark newly added nodes briefly so the reader can see what the expansion added"
    - "Must: Provide collapse to hide expanded nodes, an expansion history with multiple undo levels, and the expansion source of each node for selective collapse"
    - "Must: State that algorithm results computed on a partially expanded subgraph describe the loaded subgraph, not the whole source"
    - "Library parity: Give progress feedback on expansions that take longer than about a second"
