id: neighborhood-expansion
name: Neighborhood Expansion
category: interaction
description: "Expand the view to show neighbors of selected nodes: start from a search result or a focused view and reveal context on demand (search, show context, expand on demand). Expansion is filtered (relationship type, direction, neighbor category, attribute, maximum count, most or least connected), shows each node's hidden degree before it expands, never auto-expands a hub, and reports when it shows only part of a neighborhood. Essential for investigation workflows."
status: in-progress
notes: "Partly ships: the session's expand for server-loaded nodes and graphty/src/workspace/server/NodeMenu.tsx. Planned: counts of undisplayed neighbors, an expansion size preview, capped expansions with paging, and an expansion history with undo. Any requirement below that this note does not name as shipping counts as planned."
