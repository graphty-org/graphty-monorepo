id: network-collection-small-multiples
name: Network Collections as Small Multiples
category: analysis
description: Load many separate networks (classrooms, egos, years, waves) and view them side by side with shared
    styling, a shared layout where nodes overlap, and a statistic per panel.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
