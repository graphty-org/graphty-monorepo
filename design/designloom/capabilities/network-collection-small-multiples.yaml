requirements:
    - "Should: Collections of many whole networks (classrooms, years) viewed as small multiples with shared styling"
    - "Must: Show many networks or time windows side by side with aligned node positions, shared colors and shared scales; beyond two-network comparison."
    - "Must: Open many small graphs together, draw them as small multiples with shared scales, and compare per-graph metrics grouped by metadata such as genre or decade."
    - "Must: Hold many networks over the same node set (per cell type, per condition, per cutoff): per-network centrality, two-network score scatter, one node's score across all networks with absent distinct from zero, locked positions and shared scales, and a difference view."
    - "Should: Filmstrip of windows on shared positions, a time-axis (timeline) view with nodes placed at their period, and an optional 3D stacked-layer view, as alternatives to animation."
