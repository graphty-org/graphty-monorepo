requirements:
    - "Library parity: Merge two or more selected nodes; return an error code when fewer than two are selected"
    - "Must: Resolve attribute conflicts per attribute: keep first, keep last, prefer a chosen source, combine into a list, or a numeric aggregate (sum, min, max, average)"
    - "Must: Keep every source value of each attribute with the winning value, the rule that chose it, and any manual pin or override"
    - "Library parity: Transfer all edges of the merged nodes to the resulting node, keeping their attributes"
    - "Must: Choose what happens to parallel edges the merge creates: keep them as multi-edges, or merge them with a count, sum, average, minimum, maximum, first or last"
    - "Library parity: Choose whether edges between the merged nodes become self-loops or are removed, and report which was done"
    - "Must: Unmerge: restore the original nodes, edges and values from the kept source records at any later time, not only through session undo"
    - "Must: Record merge, not-a-match and unmerge decisions with who made them and when; not-a-match pairs are not proposed again"
    - "Library parity: Preview a merge before it runs: the resulting attribute values, the edge count, and whether it would also join the entities' relationships"
    - "Must: A merge is always an explicit action, never applied automatically"
    - "Must: Batch merge from candidate groups (identical key attribute, or near-duplicates by fingerprint, n-gram or phonetic match), reviewed group by group with each candidate's neighbors and source text, with the number of groups shown first"
    - "Must: Keep a merge log that can be exported and re-applied after the data is rebuilt"
    - "Must: Optionally show the source records behind a merged node as a cluster around it, colored by source system"
    - "Library parity: Disable merging when the graph is read-only"
