id: node-merging
name: Node Merging
category: data
description: "Combine nodes that represent the same real-world entity into one node, consolidating their edges and attributes, for data cleaning and entity resolution. A merge is a reversible judgement: the source records and every source value are kept, the merge can be undone later (unmerge), and a 'not a match' decision is remembered so the pair is not proposed again."
status: in-progress
notes: "Partly ships: SessionDataApi.mergeNodes (graphty-element/src/session/commands/data.ts). Planned: unmerge from kept source records, a merge preview, a decision log with not-a-match pairs, and batch merge from candidate groups. Any requirement below that this note does not name as shipping counts as planned."
