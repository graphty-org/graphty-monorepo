requirements:
    - "Library parity: Select a single node with a click; clicking empty canvas clears the selection"
    - "Must: Add to the selection with a modifier-click and toggle one item with a second modifier, the platform's usual keys"
    - "Must: Select many nodes with a box drag and with a freeform lasso started from empty canvas"
    - "Must: Select by area on a map underlay (radius or polygon) when nodes have geographic positions"
    - "Library parity: Select all visible nodes, invert the selection, and clear it, each from a button and a keyboard shortcut"
    - "Must: Select by attribute criteria and by a selector that combines attribute tests with union and intersection"
    - "Should: Grow the selection by graph operations -- neighbors (in, out or both, one or n hops), ancestors and descendants on directed graphs, the same group or community as the selection"
    - "Library parity: Select edges by click, separately from nodes, and keep separate node and edge selection state"
    - "Must: Write the current selection to an editable group or tag attribute in one action (for example a migration move group)"
    - "Must: Emit the selection as a list of node and edge ids (or a neutral query descriptor) for a host application, a notebook or an external record list, and accept a selection set from them"
    - "Library parity: Show selection through the element's selected calculated value and an ordinary style layer, never by mutating a mesh; the selected state must not rely on color alone"
    - "Library parity: Expose the selection count and the selected ids through the public API so an application can show them"
    - "Must: Every selection action is reachable from the keyboard, not only by pointer"
sources:
    - title: Yi, Kang, Stasko and Jacko 2007, Toward a deeper understanding of the role of interaction in information visualization
      url: https://doi.org/10.1109/TVCG.2007.70515
      summary: Select (mark something as interesting) is one of seven interaction intents
    - title: AWS Migration Hub network diagram (dependency and impact analysis research, R7 and R23)
      url: https://docs.aws.amazon.com/migrationhub/latest/ug/network-diagram-how-to.html
      summary: Shift-click and Ctrl+drag-box multi-select, then group the selection as an application; lasso and
          modifier-click selection writing a group attribute is a Must
    - title: dbt node selection graph operators
      url: https://docs.getdbt.com/reference/node-selection/graph-operators
      summary: Selector syntax for descendants, ancestors and bounded hop counts, the pattern behind graph-operator selection
    - title: Relativity Communication analysis widget
      url: https://help.relativity.com/RelativityOne/Content/Relativity/Analytics/Communication_analysis.htm
      summary: Select Groups, Select Neighbors, Hide Selected; Apply writes selected nodes into the document search
          (ediscovery research, R1 and R22)
    - title: WCAG 2.2, Understanding 1.4.1 Use of Color
      url: https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html
      summary: Color must not be the only visual cue, so a selected state needs a non-color cue as well
    - title: User research -- supply chain and physical infrastructure networks (R4)
      url: design/user-research/supply-chain-and-physical-infrastructure-networks.md
      summary: Spatial selection by radius or polygon, then propagate, is a Must for infrastructure users
