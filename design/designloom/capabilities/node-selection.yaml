id: node-selection
name: Node Selection
category: interaction
description: Select one or more nodes or edges for further operations -- view details, run an algorithm seeded from the
    selection, filter, tag, or export. Select is one of the core interaction intents in visualization (Yi et al. 2007).
    Users build selections by click, modifier-click, box or freeform lasso, by attribute or selector, and by graph
    operations (neighbors, group, community), and they hand the selection on to another system as record ids --
    a review platform's search, a notebook, a migration group.
status: in-progress
notes: "Partly ships: graphty/src/workspace/selection/, the element's selected calculated value and its region select gesture (graphty-element/src/input/RegionSelectGesture.ts). Planned: selection by map area, invert selection, and writing the selection to a group attribute in one action. Any requirement below that this note does not name as shipping counts as planned."
