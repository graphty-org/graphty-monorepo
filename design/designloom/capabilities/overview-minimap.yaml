id: overview-minimap
name: Overview Minimap
category: interaction
description: Show a small overview of the whole graph with an indicator of the current viewport -- the overview+detail
    pattern (Cockburn, Karlson and Bederson 2009). It keeps users oriented when zoomed in and lets them jump to another
    region. Dependency-mapping tools ship it as an overview inset on large server maps, and embedding developers expect
    a minimap among the standard UI widgets (Cytoscape.js and G6 both ship one as a plugin).
status: in-progress
notes: "Partly ships: the element's minimap attribute (graphty-element/src/graphty-element.ts). Planned: an aggregated overview for large graphs and a replaceable overview widget. Any requirement below that this note does not name as shipping counts as planned."
algorithms: []
used_by_workflows:
    - W02
    - W05
    - W06
    - W07
    - W09
    - W115
    - W284
    - W418
    - W47
    - W63
    - W67
    - W69
    - W82
implemented_by_components:
    - minimap
requirements:
    - "Library parity: Show the whole graph at reduced scale, fitted to the overview's bounds"
    - "Library parity: Draw an indicator of the main view's current bounds and keep it in step with every pan and zoom"
    - "Library parity: Drag the indicator to pan the main view; click in the overview to center the main view there"
    - "Library parity: Draw the overview at reduced detail (for example no labels) so it stays cheap on large graphs, and offer an aggregated density view for graphs too dense to read as points"
    - "Library parity: Reflect graph changes (data, filters, layout) in the overview"
    - "Library parity: Expose visibility, position and size as options with neutral defaults; the application decides where it sits, whether it is shown and whether that preference is remembered"
    - "Library parity: The overview is an overlay and does not change how the main view frames the graph"
    - "Library parity: Expose the overview as a UI widget an embedding developer can replace or restyle, as Cytoscape.js and G6 do"
    - "Library parity: The overview and its controls are reachable from the keyboard"
sources:
    - title: Cockburn, Karlson and Bederson 2009, A review of overview+detail, zooming, and focus+context interfaces
      url: https://doi.org/10.1145/1456650.1456652
      summary: Defines overview+detail and reviews the evidence for it against zooming and focus+context
    - title: Azure Migrate agentless dependency analysis (dependency and impact analysis research, section 5.6)
      url: https://learn.microsoft.com/en-us/azure/migrate/how-to-create-group-machine-dependencies-agentless
      summary: Multi-server dependency map shown with an overview inset
    - title: Cytoscape.js extensions (developers embedding graph visualization research)
      url: https://js.cytoscape.org/#extensions
      summary: Minimaps are among the UI widgets developers add as plugins; G6 ships one too; a minimap extension
          point is a Should
