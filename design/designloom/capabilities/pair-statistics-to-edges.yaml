      url: "https://free.nchc.org.tw/bioconductor/packages/3.9/bioc/vignettes/GDCRNATools/inst/doc/GDCRNATools.html"
      summary: "gdcCEAnalysis tests each lncRNA-mRNA pair; gdcExportNetwork writes edges that carry no statistics"
