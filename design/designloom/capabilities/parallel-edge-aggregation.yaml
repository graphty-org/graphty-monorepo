requirements:
    - "Should: Transaction flow graphs: aggregate parallel transfers between two addresses with amounts summed per
      token; filter by amount, token and time; attribution label as a sourced node property; mark exchange nodes as
      off-chain dead ends; expand from an external explorer API (with R8)"
    - "Must: Keep many typed, directed, timestamped edges per node pair and show them as each edge, one edge per direction, or one edge per pair, with a count and summed attributes (duration, amount) that edge width and labels can use, while each underlying record stays retrievable."
    - "Must: Collapse many edges between the same pair of nodes (per pair and direction) into one drawn edge carrying count, sum, average, min, max, first and last date and net flow; style it by those values and expand it back into the child edges on demand. Filters apply to child edges before aggregation, and graph algorithms can run on either form."
    - "Should: Group parallel edges between two nodes into one with a count and sum, average, minimum or maximum of a property (for example total transferred amount)."
    - "Must: Keep one edge per letter or act between a pair and aggregate parallel edges to a weighted edge for display and metrics, with the underlying rows available on click."
sources:
