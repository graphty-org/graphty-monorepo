id: parallel-edge-aggregation
name: Parallel Edge Aggregation
category: analysis
description: Collapse parallel edges between two nodes into one edge per key (for example token), with summed amount,
    count and first and last time, reversible to the individual edges.
status: planned
notes: "Research trace: investigative-journalism-and-osint.md section 10, requirement R22 (Should)."
