requirements:
    - "Library parity: Style path nodes and edges through suggested style layers scoped to the path result; dimming everything else is the reader's choice, offered as an option and never written into the suggested layers"
    - "Library parity: Carry each node's position along the path (step number, hop distance from the source) as a result value that styles and labels can use"
    - "Must: Show every tied shortest path, or say how many ties exist when only one is drawn; showing one tie silently hides the alternatives"
    - "Library parity: Show several paths at once (k shortest, all shortest, paths to several targets) with a distinct, non-color cue for each as well as color, and a legend"
    - "Must: List the path step by step (node, edge type, node) in a form the application can show and export; selecting a step centers the view on it"
    - "Must: State the path's length in hops and, when weighted, its total and the weight convention used (distance, or a strength converted by a named rule such as 1/w)"
    - "Must: Honor direction, edge-type filters and a hop limit, and offer reversing the path direction"
    - "Must: When no path exists, return the reason as a code (disconnected, blocked by direction, edge type, hop limit or time order) rather than an empty highlight"
    - "Library parity: Keep the highlight through pan, zoom and layout changes until cleared, and clear it in one action"
    - "Library parity: Optionally animate traversal from source to target, with the speed as an option"
sources:
    - title: Lee et al. 2006, Task taxonomy for graph visualization
      url: https://doi.org/10.1145/1168149.1168168
      summary: Following a path between nodes is one of the core graph visualization tasks
    - title: User research -- network scientists and analysis method validity (Workflows C and D)
      url: design/user-research/network-scientists-and-analysis-method-validity.md
      summary: All-shortest and k-shortest paths with tie handling, typed and directed constraints, a "no path" result
          with its reason, and the weight convention reported
    - title: User research -- investigative journalism and OSINT (R5)
      url: design/user-research/investigative-journalism-and-osint.md
      summary: Shortest and all shortest paths between two named nodes with relationship-type filter and hop limit,
          listed name by name, is a Must
    - title: BloodHound search and pathfinding (cybersecurity research, section 5.1)
      url: https://bloodhound.specterops.io/analyze-data/explore/search
      summary: Pathfinding to up to three destinations combined, Reverse path, edge-type filter; clicking a node dims
          everything except paths through it
