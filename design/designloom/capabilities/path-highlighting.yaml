id: path-highlighting
name: Path Highlighting
category: interaction
description: Show paths between nodes in the graph -- one shortest path, every tied shortest path, k shortest paths,
    or paths constrained by edge type, direction or time -- styled so they stand out, with the path also listed step by
    step. Path following is a core graph task (Lee et al. 2006); investigators, journalists and security testers read
    a path name by name and need to see when a single drawn path hides tied alternatives.
status: in-progress
notes: "Partly ships: path results styled through their suggested style layers, started from graphty/src/workspace/analyze/PathForm.tsx. Planned: every tied path and several paths at once (these need all-shortest and k-shortest paths in shortest-path), and animated traversal. Any requirement below that this note does not name as shipping counts as planned."
