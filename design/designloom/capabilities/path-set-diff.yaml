id: path-set-diff
name: "Path Set Comparison for One Node"
category: analysis
description: "For one target node (a package), enumerate every root-to-target path in two versions of a graph (before and after a dependency override) and show them side by side or merged, marking paths whose target version changed, paths that disappeared or appeared, and paths that still reach an unwanted version. graph-diff compares whole graphs; this compares the path sets that explain one node."
