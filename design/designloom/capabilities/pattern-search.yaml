id: pattern-search
name: Subgraph Pattern Search
category: analysis
description: Find every place a small typed pattern occurs in the graph -- a fraud typology (fan-in, fan-out,
    pass-through, a cycle), an attack-path shape, a typed metapath between two nodes, a shared-identifier ring -- and
    show the matches. Users rarely draw patterns from scratch; a curator saves them as parameterized templates or
    search phrases that analysts run with one click. Counting a motif says nothing on its own; whether it is more
    common than chance depends on a null model that preserves the structure that is not the hypothesis.
status: planned
algorithms:
    - Subgraph isomorphism
    - VF2 algorithm
