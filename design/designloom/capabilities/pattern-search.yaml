requirements:
    - "Library parity: Define a pattern as a small graph of node and edge placeholders with type, direction and attribute constraints (comparison operators on attributes, including amounts and timestamps)"
    - "Must: Support variable-length steps with a bounded hop range, and time-ordered steps (each edge later than the last)"
    - "Must: Support typed metapath search between two given nodes, returning path counts per pattern with a per-pattern cap"
    - "Must: Save a pattern as a named, parameterized template whose typed inputs (a node, a node set, an edge, a value) are filled at run time; share, export and import templates as data"
    - "Library parity: Ship templates for common typologies -- fan-in, fan-out, pass-through, cycles, shared-identifier rings -- as data an application can show, replace or extend"
    - "Must: Report the total match count, and whether results were capped, before showing matches; never silently truncate"
    - "Must: Record the scope of every run -- the loaded graph or a stored graph behind it -- with the result"
    - "Library parity: Highlight each match through a style layer scoped to the match, list matches, and center the view on one when it is selected"
    - "Library parity: Rank matches by a chosen attribute or score"
    - "Library parity: Report progress, allow cancel, and return partial results flagged as partial when a run is stopped"
    - 'Library parity: Report "no match" as a result code, distinct from an error or a cancelled run'
    - "Must: For motif significance, compare counts with a degree-preserving randomized ensemble (or a null the user chooses) and report observed count, null mean, null standard deviation and z, with the seeds used"
sources:
    - title: Linkurious, top 10 query templates (graph database exploration research, S9)
      url: https://linkurious.com/blog/top-10-query-templates-to-accelerate-your-investigations/
      summary: Investigation templates with typed parameters that business users run without writing queries
    - title: Neo4j Bloom advanced search phrases (graph database exploration research, S8)
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-tutorial/search-phrases-advanced/
      summary: Parameterized search phrases as saved patterns; caps that hide result size confuse users
    - title: BloodHound Cypher search (cybersecurity research)
      url: https://bloodhound.specterops.io/analyze-data/explore/cypher-search
      summary: Saved, categorized pattern queries shared and exported as JSON; threat hunting runs saved patterns
    - title: Altman et al. 2023, realistic synthetic financial transactions for AML (financial crime research, section 7.2)
      url: https://arxiv.org/html/2306.16424v1
      summary: Laundering typologies as graph motifs (fan-in, fan-out, cycles and others) over a directed temporal
          multigraph; typology motif templates are a Should
    - title: User research -- knowledge graph engineers and GraphRAG
      url: design/user-research/knowledge-graph-engineers-and-graphrag.md
      summary: Typed-path (metapath) search between two nodes with path counts and a per-pattern cap is a Must for
          biomedical knowledge graphs
    - title: Artzy-Randrup et al. 2004, comment on network motifs (network scientists research, Workflow A)
      url: https://www.marcottelab.org/users/CH391L/Handouts/Networkmotifcomment1.pdf
      summary: A network with no motif-selecting rule produced the same "significant" motifs, so the null must preserve
          non-hypothesis structure
