id: period-change-table
name: "Per-category period change table"
category: analysis
description: "For a recurring deliverable, a table per category (finding type, group, cluster, attribute value) with the count at the end of the range, the change from the start of the range, the items resolved or retired and the items newly appeared within the range, and items hidden by a minimum group size flagged separately; plus trend lines of the headline measures over all periods. Modeled on BloodHound Posture's Count and Change columns, which keep resolved and deprecated paths in the table for the range."
status: planned
notes: "Research trace: communicating-findings-and-deliverables.md section 10, requirement R24 (Must)."
algorithms: []
used_by_workflows:
    - W323
    - W320
implemented_by_components: []
requirements:
    - "Must: Saved deliverable template (view, filters, style, legend, parameters, tables, fixed positions) that
      re-renders against new data, exportable on demand or on a schedule, or embedded live; before comparing it checks
      coverage, matches entities across periods (renames, merges, new, departed, suppressed), and adds a per-category
      change table with resolved items"
sources:
