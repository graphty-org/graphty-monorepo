id: phone-readable-embed
name: "Phone-readable embed"
category: export
description: "Publish an embed with layout motion stopped, a fixed layout, step-by-step reveal on scroll, and labels and explanatory text outside the canvas, so a phone reader with no hover can read it."
status: planned
notes: "Research trace: communicating-findings-and-deliverables.md section 10, requirement R11 (Should; Must for public-sector publishers)."
algorithms: []
used_by_workflows:
    - W318
implemented_by_components: []
requirements:
    - "Should: Publish an embed with layout motion stopped and a fixed layout"
    - "Should: Turn scroll-wheel zoom off in the embed, so the page scrolls"
    - "Should: Keep labels readable at phone width and put explanatory text outside the canvas, with every fact reachable without hover"
    - "Should: Offer keyboard navigation of nodes and edges and a tabular alternative"
