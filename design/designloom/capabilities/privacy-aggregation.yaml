id: privacy-aggregation
name: Privacy Aggregation and De-identification
category: analysis
description: Anonymize labels, suppress or merge groups below a minimum size, show only aggregates, hide individual
    links, suppress chosen attributes, and report individuals as percentile bands (top 5 or top 15 percent) instead of
    exact ranks.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
