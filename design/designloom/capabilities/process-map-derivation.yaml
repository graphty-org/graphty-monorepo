id: process-map-derivation
name: Process Map Derivation
category: visualization
description: Derive a directly-follows graph with artificial start and end from an event table, with the case notion and
    node attribute (activity, role, department, resource) as parameters, frequency and duration metrics on nodes and
    edges, and recomputation from the filtered table on every filter rather than deleting edges from the built graph.
