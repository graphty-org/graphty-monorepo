id: progressive-loading
name: Progressive Loading
category: performance
description: Load and display large graphs progressively -- read the file as a stream, show what has arrived while the
    rest loads, keep the page responsive, and report honest progress -- in the progressive visual analytics sense of
    useful partial results that users can act on (Stolper, Perer and Gotz 2014). The research targets are hundreds of
    thousands of candidate edges in public health without the tab dying (MicrobeTrace froze at 1,500 genomes), and
    database results whose real size is shown rather than silently capped.
