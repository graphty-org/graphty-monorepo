requirements:
    - "Library parity: Read files as a stream whatever their size, so there is no size threshold to choose; where a format cannot stream (a whole-document XML parse), say so in the size check before loading"
    - "Library parity: Parse off the main thread so pan, zoom and selection keep working while loading"
    - "Library parity: Show a looped indicator when a load is expected to take 2 seconds or more, and a percent-done indicator (rows or bytes read of the total) when it is expected to take 10 seconds or more; any update interval is a design goal"
    - "Must: Render nodes and edges as they become available, and let users interact with the part already loaded"
    - "Must: Mark any algorithm result computed on partly loaded data as partial, with the scope it ran on"
    - "Must: Before an expensive load or run, report the size and an estimated cost so the user can reduce first (filter, sample, threshold) instead of hanging the tab"
    - "Library parity: Offer to load a subset (a sample, a filtered slice, the top-N by an attribute) when the full load would not fit, and state on the view that it is a subset"
    - "Must: Report the total that exists (rows, nodes, edges) and how much was loaded; never cap silently"
    - "Library parity: Cancel a load in one action, release what was loaded, and report how far it got"
    - "Library parity: Report running out of memory as an error code with what was loaded, rather than a crashed tab"
    - "Library parity: Report the final summary (nodes, edges, elapsed time) as structured values the application can show"
    - "Library parity: Resume an interrupted network transfer when the server supports range requests"
sources:
    - title: Stolper, Perer and Gotz 2014, Progressive Visual Analytics
      url: https://doi.org/10.1109/TVCG.2014.2346574
      summary: Partial results shown and usable while a long computation continues
    - title: Nielsen Norman Group, progress indicators
      url: https://www.nngroup.com/articles/progress-indicators/
      summary: Looped indicator for 2-10 second actions, percent-done for 10 seconds or more; no update interval given
    - title: Papa Parse documentation (data preparation and import research, section 8)
      url: https://www.papaparse.com/docs
      summary: Streaming "is necessary for large files which would otherwise crash the browser"; local files read in
          chunks
    - title: MDN, Blob.stream()
      url: https://developer.mozilla.org/en-US/docs/Web/API/Blob/stream
      summary: Browsers expose files as streams
    - title: User research -- public health and molecular epidemiology (scale row)
      url: design/user-research/public-health-and-molecular-epidemiology.md
      summary: Hundreds of thousands of candidate edges interactively without the tab dying; honest progress and a cost
          warning before an expensive run
    - title: Neo4j Browser render limits (graph database exploration research, S16)
      url: https://community.neo4j.com/t/browser-node-relationship-limit/69507
      summary: Slowness at a few hundred nodes and freezes near 1,000; caps that hide result size confuse users
