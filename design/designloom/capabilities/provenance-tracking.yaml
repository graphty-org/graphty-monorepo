requirements:
    - Every node and edge traces to the source records behind it (file and row, extraction artifact, message), which can
      be opened from the element and exported as a list.
    - Carry and display the source of every node and edge (institution, filing or report, information-sharing response,
      statement file and page, vendor label set) and filter or style by source, so every exported number can be tied
      back to its origin.
    - From a node or edge, reach the source chunks, documents, episodes or knowledge sources it came from, and back from
      a source to the elements it produced; highlight the subgraph a given id list (such as a RAG answer's context)
      used.
    - Keep a citation, page or scene id, and evidence excerpt on every node and edge, show them on click, and carry them
      through import and export to the figure.
    - Every node and edge keeps or links its source records (post text, URL, timestamp, criterion that created a
      projected edge), opened from a click on the canvas.
    - Attach source, confidence and documents (record type, number, date, quantity, file reference) to edges and nodes;
      show unknown links as unknown rather than absent; list edges with no evidence.
    - Keep a reference to the source record or document on every node and edge created by import or extraction, so any
      link can be traced back to its row or document.
    - Attach record ids, exhibit or Bates numbers or URLs to nodes and edges and carry them through export as footnotes
      or a linked source table; an evidence-only mode that hides unconfirmed links and non-evidence attributes and a
      neutral-emphasis check.
    - Each edge records which source (custodian copy or production) produced it; observed versus partly observed nodes
      usable as a filter and as a caution on centrality.
    - Every node and edge keeps the ids of the passages, segments or concordance lines behind it; clicking or hovering
      shows them, sampled and fast when an edge rests on thousands.
    - Every node and edge records its source database, version, access date and evidence class (curated, predicted with
      native score, text-mined, measured, absorbed, metabolite); stylable and excludable by class to show what survives.
    - Every node and edge carries its source, database version, access date and evidence class (curated, predicted with
      its native score, text-mined, measured). The evidence class can be styled, for example dashed edges for
      predictions, and a whole class can be excluded to see what survives.
