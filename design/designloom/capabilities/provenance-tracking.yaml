id: provenance-tracking
name: Per-Item Provenance and Verification Status
category: analysis
description: Every node, edge and property value carries its source (document or dataset, URL, capture date and hash,
    first and last seen or cited, who added it), a verification status (accepted, conflict, work needed) and a
    confidence rating; visible in details, usable in filters and styling, and kept in every export.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
