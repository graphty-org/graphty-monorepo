id: rdf-import
name: RDF Import
category: data
description: Import RDF (Turtle, N-Triples, N-Quads/TriG, JSON-LD, RDF/XML) with prefix shortening, labels by language
    preference, a choice of literals as attributes or nodes and rdf:type as category or class nodes, kept datatypes and
    language tags, stable blank-node ids, named graphs as a filterable attribute and RDF-star statements as edge
    attributes.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
