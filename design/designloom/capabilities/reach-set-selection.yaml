id: reach-set-selection
name: Reach Set and Key-Player Selection
category: analysis
description: Find the smallest set of nodes whose k-step reach covers a target share of the network, and search for the
    node set whose removal most fragments it (key-player positive and negative problems), reporting coverage or
    fragmentation for the chosen set.
