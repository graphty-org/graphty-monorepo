id: reach-set-selection
name: Reach Set and Key-Player Selection
category: analysis
description: Find the smallest set of nodes whose k-step reach covers a target share of the network, and search for the
    node set whose removal most fragments it (key-player positive and negative problems), reporting coverage or
    fragmentation for the chosen set.
status: planned
notes: "Research trace: organizational-network-analysis-people-analytics.md section 9 (requirements implied: minimum set covering a share of the network within k steps, should-have; key-player set search, must-have) and section 4.4."
algorithms: []
used_by_workflows:
    - W190
    - W192
implemented_by_components: []
requirements:
    - "Should: Find the smallest set of nodes whose k-step reach covers a target share of the network (key-player positive problem), and report the coverage reached"
    - "Must: Search for the node set whose removal most fragments the network (key-player negative problem), and report the fragmentation"
    - "Should: Take k, the target share or set size and a seed, and record them with the result"
sources:
    - title: "Borgatti, Identifying sets of key players in a social network (Computational and Mathematical Organization Theory, 2006)"
      url: "https://doi.org/10.1007/s10588-006-7084-x"
      summary: "Key-player positive and negative problems, searched as a set"
    - title: "Organizational network analysis research, section 9"
      url: "design/user-research/organizational-network-analysis-people-analytics.md"
      summary: "Change-agent minimum reach set, should-have; key-player set search, must-have"
