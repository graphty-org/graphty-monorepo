id: relatedness-from-presence-matrix
name: "Relatedness Network from a Two-Mode Presence Table"
category: analysis
description: "From a two-mode value table (country by product, region by industry), binarize presence by revealed comparative advantage (threshold 1 by default, or a per-capita test, or a supplied matrix), project to a one-mode proximity network as the minimum of the two conditional probabilities, draw it as a maximum spanning tree plus links above a proximity threshold or a target average degree while metrics use the full matrix, and for one chosen entity rank its absent nodes by density (the proximity-weighted share of neighbors it already has) in a table linked to the canvas."
status: planned
notes: "Research trace: supply-chain-and-physical-infrastructure-networks.md section 10, requirement R45 (Should)."
