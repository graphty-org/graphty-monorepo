requirements:
    - "Should: Select one or more nodes for simulated removal via multi-select or list input"
    - "Should: Select one or more edges for simulated removal via multi-select or list input"
    - "Library parity: Remove as a block (all at once, a raid) or one at a time (a sequence of arrests), and record which was used"
    - "Should: Order a sequence by hand or by a chosen ranking (degree, betweenness, a supplied order); state whether the ranking is recomputed after each removal and record the choice with the result, because recomputation changes the outcome"
    - "Should: Report component count and the largest component's size and share of nodes before and after removal"
    - "Library parity: Report the nodes cut off from the largest component, as a count and a list"
    - "Must: Report fragmentation (the share of node pairs that can no longer reach each other) for key-player set removal"
    - "Must: Compute path statistics (average path length, diameter) on the largest component, or as harmonic or efficiency variants, so a disconnected result never returns an error"
    - "Should: Identify paths between chosen node pairs that break after removal"
    - "Must: On directed graphs, follow edge direction and chosen edge types: report the elements that depend only on the removed ones (blast radius) and say which edge types were followed"
    - "Library parity: In a two-mode graph, report nodes of the other level left with no links (secondary extinction)"
    - "Must: When a path measure reads an edge weight, read it as declared in weight-semantics and record the convention used"
    - "Must: Return each metric before and after with its absolute and relative change as values; no built-in severity bands (how to grade or word the change is the application's choice)"
    - "Library parity: Do not modify actual graph data; operate on simulated copy"
    - "Library parity: Provide 'Reset simulation' to clear the removal selection"
    - "Must: Compare several removal scenarios side by side"
    - "Must: Export the impact result as JSON or CSV with every metric, the removal order, the block or sequence setting and the ranking used"
    - "Library parity: Highlight affected nodes (cut off, dependent) through a style layer on the result"
sources:
    - title: Cavallaro et al. 2020, disrupting resilient criminal networks through data analysis (Montagna network)
      url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0236476
      summary: Sequential and block removal ranked by centrality, scored by largest-component size (cited in
          design/user-research/law-enforcement-and-intelligence-analysts.md)
    - title: Borgatti 2006, Identifying sets of key players in a social network
      url: https://doi.org/10.1007/s10588-006-7084-x
      summary: Key-player removal measured by fragmentation; ONA research marks non-destructive set removal a must-have
    - title: Holme, Kim, Yoon and Han 2002, attack vulnerability of complex networks
      url: https://arxiv.org/abs/cond-mat/0202410
      summary: Recalculated attacks are often more harmful than rankings computed once
    - title: Wandelt et al. 2018, comparative analysis of approaches to network dismantling
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6131543
      summary: Static betweenness attacks do much worse than recomputed ones; the recompute choice is part of the result
    - title: bipartite R package, second.extinct
      url: https://search.r-project.org/CRAN/refmans/bipartite/html/second.extinct.html
      summary: Removal order options and secondary extinctions in two-mode ecological networks
    - title: Edge Delta, blast radius is a graph query
      url: https://edgedelta.com/company/blog/blast-radius-is-a-graph-query
      summary: Blast radius follows dependency edges in the right direction; other edge types pull in everything
