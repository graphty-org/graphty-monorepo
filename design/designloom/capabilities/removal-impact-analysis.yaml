id: removal-impact-analysis
name: Removal Impact Analysis
category: analysis
description: Simulate removing chosen nodes or edges, one at a time or as a set, on a copy of the graph and report what
    changes -- components, the largest component, who is cut off, which paths break, and (following edge direction)
    what depends on the removed elements. Used for disruption planning against criminal networks, key-player sets in
    organizations, single points of failure in dependency graphs and species or habitat-patch loss in ecology. Curves
    over a whole removal sequence (giant-component share against fraction removed) belong to
    attack-robustness-curves.
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/RemovalImpactAlgorithm.ts removes given nodes and edges as a block on a simulated copy and reports components and the largest component's size before and after, nodes cut off and their share. Planned: one-at-a-time removal sequences with recomputed rankings, fragmentation, path statistics, broken pair paths, directed blast radius, secondary extinction in two-mode graphs, scenario comparison and export. Any requirement below that this note does not name as shipping counts as planned."
