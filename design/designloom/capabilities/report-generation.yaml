requirements:
    - "Should: Choose the deliverable type first (journal figure, court exhibit, regulatory filing, public-health partner summary, public embed) and apply its constraints to what the report may contain"
    - "Must: Generate the report as PDF with embedded fonts and Unicode, as a standalone HTML file, and as Markdown"
    - "Must: Include figures as vector graphics (SVG or PDF) of the whole graph or a chosen region, independent of the viewport, with raster images at print size (mm or inches, 300-600 dpi) where a raster is required"
    - "Must: Include a legend generated from the live style for both node and edge encodings, with editable text"
    - "Must: Include a parameters and provenance block: data source and version, filters, algorithms with their parameters and seeds, the edge-weight convention each one read (strength or distance), layout and its seed, time window, export date and tool version"
    - "Must: Carry per-element source references (record id, exhibit or Bates number, URL) into the report as footnotes or a linked table"
    - "Must: Include a graph statistics table: node count, edge count, density, components, and path statistics computed on the largest component (or a harmonic variant) so a disconnected graph never errors"
    - 'Must: Show a degree distribution as a complementary cumulative distribution on log-log axes; describe a heavy tail as heavy-tailed, and include a power-law fit only as the plausible / not plausible / alternative favored result of the Clauset-Shalizi-Newman protocol, never as "power law detected"'
    - "Library parity: Include ranked node tables for chosen measures, with the number of rows chosen by the author"
    - "Must: Include a community summary (count, size distribution, modularity) together with the method, quality function, resolution and seed; modularity is a descriptive value, never a threshold for real communities"
    - "Must: Include entity, edge and aggregate tables as tables, and export a filtered, column-chosen CSV with an optional size cap (a US SAR accepts one CSV of at most 1 MB)"
    - "Must: Publish named, captioned, timestamped saved views in order, with their annotations"
    - "Must: Offer label redaction (hide or replace node labels and chosen attributes, verified absent from the file) and an aggregate-only mode (group tables, no node-link diagram) with configurable small-cell suppression"
    - "Must: Offer an evidence-only mode that hides unconfirmed links and non-evidence attributes, with neutral emphasis"
    - "Library parity: Provide editable title, summary, methods and findings sections, and a toggle to include or exclude each section"
    - "Must: Save a report as a template (view, filters, style, legend, parameters, tables, fixed positions) that re-renders against new data; before comparing periods, check coverage, match entities across periods and add a change table"
    - "Must: Accessible output: heading hierarchy, alt text for every image, a text alternative (entity and relationship list), WCAG contrast, and a grayscale and colorblind check"
    - "Library parity: Show progress while the report is generated"
sources:
    - title: Cytoscape manual, Export Your Data
      url: https://manual.cytoscape.org/en/3.10.3/_sources/Export_Your_Data.md.txt
      summary: Export formats, web export limits and fonts; the requirements above come from
          design/user-research/communicating-findings-and-deliverables.md section 10
    - title: FinCEN SAR electronic filing requirements
      url: https://bsaefiling.fincen.treas.gov/docs/FinCENSARElectronicFilingRequirements.pdf
      summary: A SAR carries a narrative and at most one CSV attachment of 1 MB; no image
    - title: Maltego, five ways to export a graph for reporting
      url: https://www.maltego.com/blog/five-ways-to-export-maltego-graph-for-reporting/
      summary: Graph images, entity tables and PDF reports for investigations
    - title: United States v. Bray (6th Cir.)
      url: https://caselaw.findlaw.com/court/us-6th-circuit/1097222.html
      summary: Summary charts must be accurate and nonprejudicial
    - title: CDC guidance for health departments on cluster communication
      url: https://www.cdc.gov/hivpartners/php/cdr/health-department-guidance.html
      summary: Partners receive aggregate summaries, not network diagrams
    - title: NeoDash reports
      url: https://neo4j.com/labs/neodash/2.2/user-guide/reports/
      summary: Saved reports re-run their query and refresh, the pattern for recurring deliverables
    - title: Understanding the new ADA web accessibility requirements (UNC School of Government)
      url: https://www.sog.unc.edu/blogs/coates-canons/understanding-new-ada-web-accessibility-requirements-state-and-local-governments-2
      summary: WCAG 2.1 AA applies to state and local government web content, including PDFs
    - title: Clauset, Shalizi and Newman 2009, power-law distributions in empirical data
      url: https://arxiv.org/abs/0706.1062
      summary: The fitting protocol and why "power law detected" overstates a plausible fit
