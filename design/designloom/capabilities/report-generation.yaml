id: report-generation
name: Report Generation
category: export
description: Assemble a deliverable from the current analysis -- figures, a legend generated from the live style, a
    parameters and provenance block, tables and the analyst's own narrative -- shaped by the rules of whoever receives
    it (a journal, a court, a regulator, a public-health partner, a public embed). One-off deliverables are exported on
    demand; recurring ones are saved as templates that re-render against refreshed data. Several key deliverables are
    not graph images at all (narratives with a CSV, aggregate tables), so tables and structured exports are first-class
    outputs.
status: planned
