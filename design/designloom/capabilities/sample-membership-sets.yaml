id: sample-membership-sets
name: "Sample Membership Sets"
category: data
description: "Treat a list of sample or genome ids on a node or edge (Panaroo members and semicolon genomeIDs, resolved through the graph-level isolateNames list; PPanGGOLiN genome labels on edges) as a set attribute with a derived count, and join a per-sample metadata table (lineage, country, year, phenotype) through it, so nodes and edges can be colored, sized and filtered by count or by present in any, all or none of the samples matching a metadata condition, with per-selection tallies by metadata value."
