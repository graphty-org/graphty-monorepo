requirements:
    - "Should: Save the current filter configuration under a user-provided name"
    - "Library parity: Save an optional description with each filter"
    - "Library parity: Store all active filter criteria (attribute filters, range values, structural filters) as the ordered list of steps, with each step's on or off state"
    - "Library parity: Display saved filters list sorted by most recently used"
    - "Should: Apply saved filter with single click, restoring all filter criteria"
    - "Library parity: Display filter criteria summary in saved filter list item"
    - "Library parity: Provide 'Edit' action to modify saved filter name, description, or criteria"
    - "Library parity: Provide 'Delete' action with confirmation: 'Delete filter [name]?'"
    - "Library parity: Provide 'Duplicate' action to create copy of saved filter for modification"
    - "Should: Export saved filters as a JSON file, for version control and transfer"
    - "Library parity: Import saved filters from a JSON file"
    - "Library parity: Validate imported filters against current graph schema; warn on incompatible attributes"
    - "Must: Reapply a saved filter to refreshed or replacement data, reporting each criterion that names an attribute or value the new data lacks"
    - "Should: Share a filtered view as a link that reapplies the saved filter"
    - "Library parity: Mark each saved filter's origin (shipped, personal, shared) and let the list be filtered by it"
    - "Library parity: Support combining saved filters: 'Apply Filter A AND Filter B'"
    - "Library parity: Display indicator icon next to currently active saved filter"
    - "Must: Save saved filters in the project file as graphty-element rule sets, so they reopen with the project"
    - "Library parity: A saved filter used outside its project travels as an exported file or a link, not as account state"
sources:
    - title: Splunk Saved Searches
      url: https://docs.splunk.com/Documentation/Splunk/latest/Search/Savingsearches
      summary: Pattern for saving and reusing search configurations
    - title: BloodHound, Cypher search and saved queries
      url: https://bloodhound.specterops.io/analyze-data/explore/cypher-search
      summary: Saved queries filterable by category and source (prebuilt, personal, shared), and shared between users
    - title: Neo4j Bloom deep links
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-tutorial/deep-links/
      summary: A link that carries a search and runs it on open; the research found a link to a filtered view or a
          saved query is the shareable unit in dependency analysis
