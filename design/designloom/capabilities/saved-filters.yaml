id: saved-filters
name: Saved Filters
category: interaction
description: Save, name, combine and reapply filter and search configurations, so last month's analysis can be run on
    this month's file and a filtered view can be handed to someone else. Saved filters belong to the project and can be
    exported, versioned and shared as a file or a link. Searches with typed inputs that one user writes for others to run
    are parameterized-saved-searches.
status: in-progress
notes: "Partly ships: saved filters in graphty/src/workspace/data-place/Filters.tsx. Planned: export and import of saved filters as JSON, duplicate, a link that reapplies a filter, and an origin mark per saved filter. Any requirement below that this note does not name as shipping counts as planned."
