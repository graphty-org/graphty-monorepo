id: search
name: Node Search
category: interaction
description: Find specific nodes in the loaded graph by label or attribute value, tolerating name variants, and move
    the view and keyboard focus to a match. The entry point for locating a known entity (a person, a company, a gene, a
    neuron) before expanding, tracing paths or reading its details. Searching a database for nodes that are not yet
    loaded is a separate, search-first capability.
status: in-progress
notes: "Partly ships: graphty/src/workspace/graph-place/FindBox.tsx (opened with /). Planned: fuzzy and alias matching, a recent-query history, and a visible-nodes-only scope. Any requirement below that this note does not name as shipping counts as planned."
