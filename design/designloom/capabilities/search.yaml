requirements:
    - "Library parity: Open the search entry with the '/' keyboard shortcut; the entry is also reachable by Tab"
    - "Must: Search node labels for substring match (case-insensitive by default)"
    - "Must: Offer fuzzy matching that finds spelling and name variants of the query, and match alias or synonym attributes when the data has them"
    - "Must: Search node attribute values across all string attributes"
    - "Must: Display search results as scrollable list showing node label and matching attribute"
    - "Must: Report the total number of matches, and say so when the displayed list is cut short"
    - "Library parity: Highlight matching text in search results with bold or background color"
    - "Library parity: Update results incrementally while typing"
    - "Library parity: Highlight all matching nodes in the graph through a style layer on the match"
    - "Library parity: Choosing a result selects the node, centers the view on it and moves keyboard focus to it, so a screen reader announces it"
    - "Library parity: Double-click search result to select and zoom to node"
    - "Library parity: Support exact match mode via checkbox or 'exact:' prefix"
    - "Library parity: Support regex search via checkbox or 'regex:' prefix"
    - "Must: Support attribute-specific search: 'attribute:value' syntax (e.g., 'type:person')"
    - "Library parity: Display 'No results found' message when search yields no matches"
    - "Library parity: Clear search with Escape key or 'X' button"
    - "Library parity: Remember recent search queries in a history list"
    - "Library parity: Provide search scope option: 'All nodes' vs 'Visible nodes only'"
sources:
    - title: Neo4j Bloom search bar
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-visual-tour/search-bar/
      summary: Search-first exploration with full-text and property search
    - title: ICIJ and Neo4j, the Panama Papers graph
      url: https://neo4j.com/blog/cypher-and-gql/icij-neo4j-unravel-panama-papers
      summary: Journalists type a person's or company's name and need fuzzy-matched variants
    - title: TADA (CHI 2024), accessible node-link diagrams
      url: https://arxiv.org/html/2311.04502v4
      summary: Blind and low-vision readers need a find entry that moves focus to the match
    - title: GSK (ASSETS 2014), keyboard navigation of node-link diagrams
      url: https://ciigar.csc.ncsu.edu/files/bib/Balik2014-AccessGraphs.pdf
      summary: Jump-to-node by name for keyboard and screen-reader users
    - title: KeyLines accessibility
      url: https://cambridge-intelligence.com/build-accessible-data-visualization-apps-with-keylines/
      summary: Commercial toolkits leave a Tab-reachable search box to the embedder
