id: selection-statistics
name: Selection Statistics
category: analysis
description: Display aggregate statistics for the selected nodes beside the same statistics for the whole graph --
    size, internal and boundary edges, attribute summaries -- so a reader can see how a subset (a group, a community,
    a case) differs from the whole. Comparisons are descriptive; differences in network data are not tested with
    independent-sample tests, because nodes in a network are not independent observations.
