requirements:
    - "Library parity: Display count of selected nodes"
    - "Must: Display count of edges among selected nodes (induced subgraph edges) and the density of that subgraph"
    - "Must: Display count of edges connecting selected to unselected nodes (cut edges) and the E-I index of the selection (external minus internal over total, -1 all internal to +1 all external)"
    - "Must: Calculate mean, median, min, max for each numeric attribute of selected nodes"
    - "Must: Calculate value distribution (percentages) for each categorical attribute of selected nodes"
    - "Must: Display selection statistics alongside whole-graph statistics for comparison, as values and differences"
    - "Should: Compare heavy-tailed measures (degree, betweenness and other centralities) by median, rank or percentile, not by mean and standard deviations, which flag the tail by construction"
    - "Library parity: Display mini-histogram comparing selection distribution to graph distribution for numeric attributes"
    - "Library parity: Support comparing two simultaneous selections (Selection A vs Selection B)"
    - "Should: Do not report p-values from independent-sample tests; when a significance figure is shown it comes from a permutation or randomization null (for example random node sets of the same size) and names that null"
    - "Library parity: Export selection statistics as CSV with columns: attribute, selection_value, graph_value, difference"
    - "Library parity: Report an empty selection, and a selection too small for a meaningful summary, as states with a code the app words"
    - "Must: Support pinning statistics snapshot to compare against future selections"
sources:
    - title: Microsoft Viva Insights, change management ONA queries (E-I index)
      url: https://learn.microsoft.com/viva/insights/advanced/analyst/change-management-queries
      summary: E-I index from -1 (all internal) to +1 (all external) used to flag group insularity
    - title: Organizational network analysis and people analytics (requirement on E-I index and density within groups)
      url: design/user-research/organizational-network-analysis-people-analytics.md
      summary: E-I index and density within and between groups per attribute are must-have measures
    - title: Network scientists and analysis method validity (correction to W12; significance traditions)
      url: design/user-research/network-scientists-and-analysis-method-validity.md
      summary: Degree and betweenness are heavy-tailed so z-scores flag the tail; significance comes from randomized nulls or network models
    - title: Academic social network research (section 5.5, QAP and ERGM)
      url: design/user-research/academic-social-network-research.md
      summary: Network claims rest on permutation tests or statistical network models, not independent-sample tests
