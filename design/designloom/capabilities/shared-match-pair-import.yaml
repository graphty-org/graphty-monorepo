id: shared-match-pair-import
name: "Shared-match two-table import with vendor presets"
category: data
description: "Import a graph from two tables at once: a node table of DNA matches (identifier, display name, shared centimorgans, segments, predicted relationship, side, tree flag) and a pair table of matches who share DNA with each other, with per-vendor column presets (Ancestry, 23andMe, MyHeritage, FamilyTreeDNA, GEDmatch, DNAGedcom m_/icw_ files) so no header has to be renamed by hand before import. Today's tutorials require renaming matchid and icwid to source and target in a spreadsheet before Gephi will read the files."
