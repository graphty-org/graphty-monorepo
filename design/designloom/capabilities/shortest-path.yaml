requirements:
    - "Must: Find shortest path between user-specified source and target nodes"
    - "Must: Support unweighted paths (minimum hop count) using BFS"
    - "Must: Weighted paths minimize the sum of distances as declared in weight-semantics; a column declared a strength is converted first (for example 1/w), never read silently as a distance"
    - "Must: Return path as ordered list of node IDs from source to target"
    - "Must: Report path length as hop count for unweighted paths; for weighted paths report the total together with the weight column, its declared meaning and the conversion used"
    - "Must: When no path exists, return a no-path result with its reason (disconnected, or blocked by edge direction, edge type or the hop limit) as a code with parameters"
    - "Must: Find all shortest paths when several paths tie for the minimum, and report how many there are; never show one tie as if it were the only path"
    - "Must: Support directed path finding (follow edge direction) for directed graphs"
    - "Library parity: Support undirected path finding (ignore edge direction) for directed graphs"
    - "Must: Restrict paths to chosen edge types (relationship-type filter) and to a maximum number of hops"
    - "Must: Provide k shortest loopless paths (Yen's algorithm) with a user-chosen k, and state how ties at the k-th place are handled"
    - "Must: List each path node by node with the intermediate nodes' names and attributes, ranked by length"
    - "Library parity: Highlight path nodes and edges in graph visualization"
    - "Library parity: Allow stepping through path nodes one at a time"
    - "Library parity: Time-ordered (time-respecting) paths are out of scope here and belong to time-respecting-paths; a static path over time-stamped edges is labeled as ignoring time order"
sources:
    - title: Dijkstra 1959, A note on two problems in connexion with graphs
      url: https://doi.org/10.1007/BF01386390
      summary: The weighted shortest-path algorithm; weights are lengths (distances)
    - title: Opsahl, tnet -- Shortest paths in weighted networks
      url: https://toreopsahl.com/tnet/weighted-networks/shortest-paths/
      summary: Tie strengths must be inverted (1/w) so a stronger tie is a shorter distance; the conversion changes results
    - title: igraph betweenness (weights interpreted as distances)
      url: https://r.igraph.org/reference/betweenness.html
      summary: Path-based functions in igraph read weights as distances, so a strength column gives wrong paths unless converted
    - title: NetworkX shortest_simple_paths (Yen's k shortest loopless paths)
      url: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.simple_paths.shortest_simple_paths.html
      summary: k shortest loopless paths as practitioners compute them in code
    - title: Neo4j Cypher manual, shortest paths
      url: https://neo4j.com/docs/cypher-manual/current/patterns/shortest-paths/
      summary: SHORTEST k and ALL SHORTEST; when k cuts through a tie the choice is arbitrary
    - title: Holme and Saramaki 2012, Temporal networks
      url: https://arxiv.org/abs/1108.1780
      summary: Static aggregation overstates reachability; time-respecting paths are not transitive
    - title: Network scientists and analysis method validity (workflows C and D, requirement R12)
      url: design/user-research/network-scientists-and-analysis-method-validity.md
      summary: Weight convention, all-shortest and k-shortest with ties, type and direction constraints, "no path because"
    - title: Investigative journalism and OSINT (requirement R5)
      url: design/user-research/investigative-journalism-and-osint.md
      summary: Shortest and all shortest paths between two named nodes with relationship-type filter and hop limit is a Must
