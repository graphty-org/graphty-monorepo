id: shortest-path
name: Shortest Path Finding
category: analysis
description: Find the shortest path(s) between two specified nodes -- one path, all tied shortest paths, or the k
    shortest loopless paths -- and say which weight reading, direction and constraints produced them. Essential for
    "how do A and B connect, and through whom?", the core question in investigations, security and network science.
status: in-progress
notes: "Partly ships: graphty-element/src/algorithms/DijkstraAlgorithm.ts (weight read as a distance, Follow Edges out, in or all, Read Strength as Closeness for a cost of 1 over the weight, Time Order), BFSAlgorithm.ts (hop count, Max Depth) and AStarAlgorithm.ts, run from graphty/src/workspace/analyze/PathForm.tsx and drawn through suggested style layers. Planned: all tied shortest paths with their count, Yen's k shortest loopless paths (neither graphty-element nor algorithms has it), edge-type filters, a no-path reason code naming direction, type or hop limit, and stepping through a path. Any requirement below that this note does not name as shipping counts as planned."
algorithms:
    - BFS for unweighted (shipped)
    - Dijkstra for weighted (shipped)
    - Yen's k-shortest paths (planned)
