id: signed-edges
name: Signed Edges
category: analysis
description: Agreement and disagreement (positive and negative) ties kept distinct in styling and measures, with
    qualifier-based projection to congruence and conflict networks, normalization and time windows.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
