requirements:
    - Distinct styling and filtering for positive and negative edges, self-loops, and probability-weighted predicted
      versus observed edges.
    - Edge polarity (same or opposite direction) drawn as end labels or dashed lines, delay marks, and sign plus weight
      semantics on scales of 1-5, weak/medium/strong or -1 to 1.
    - "Treat edge sign (activation or inhibition) and direction as first-class: arrow versus T-bar styling, color by
      sign, in- and out-degree, directed and k-shortest paths, sign-consistent path checks, and analyses that state
      whether they treated the graph as directed."
    - Render activation and inhibition edges (arrow and bar ends) with direction, and two simultaneous node-state layers
      (observed value and predicted activity) with a legend; optionally propagate a simulated perturbation downstream.
    - Encode positive and negative edge weights with a colorblind-safe preset (blue and red), a non-color cue for
      negatives (dashed), width and saturation by absolute weight against a user-set maximum, a hide-below threshold
      that does not move the layout, and a cut point; the settings used are exposed as facts for a caption.
