requirements:
    - "Should: Similarity-matrix-to-network builder (case-by-type counts, Brainerd-Robinson and others) with an
      interactive threshold"
    - "Should: Build a kNN or mutual-top-K similarity graph from vectors, with k, metric, cutoff and component-size cap recorded with the graph."
    - "Must: Build a graph from an N x N distance or similarity matrix by mutual k-nearest-neighbors or threshold, optionally adding minimum spanning tree edges, and sweep k or threshold reporting communities per value."
    - "Must: Build a graph from a numeric table: metric choice, minimum and display thresholds with a predicted node and edge count plot, k-nearest-neighbor pruning, component-size filter, all recorded for provenance."
    - "Should: Import correlation and p-value matrices as a signed, weighted bipartite network with live |r| and p thresholds that are recorded with the network."
    - "Should: Imports a correlation matrix and its matching p-value matrix as a signed, weighted bipartite network, for example gut taxa against metabolites. Edges are thresholded live by absolute r and by p, and the thresholds are recorded on the network."
