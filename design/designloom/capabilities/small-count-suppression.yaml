id: small-count-suppression
name: Small-Count Suppression
category: analysis
description: A configurable rule that hides or masks any label, cell or exported value below a minimum count, applied
    consistently to the drawing, the tables and the export, including derivable values and complementary cells. Required
    for anything drawn from CMS research identifiable files or limited data sets.
