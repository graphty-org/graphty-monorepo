id: statistics-panel
name: Statistics Panel
category: export
description: Display a panel of the computed graph statistics and analysis results -- the descriptive table every
    study reports (size, density, reciprocity, transitivity, components, centralization, communities) -- with the
    parameters behind each value, so it can be cited in a report or copied into a methods section.
status: in-progress
notes: "Partly ships: graphty/src/workspace/inspector/GraphValues.tsx. Planned: the degree CCDF on log-log axes, export of statistics with their parameters, plain-language notes per metric, and stale marks after data or filters change. Any requirement below that this note does not name as shipping counts as planned."
