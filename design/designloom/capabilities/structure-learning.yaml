id: structure-learning
name: Causal structure learning
category: analysis
description: Learn a directed graph from tabular data with PC, GES or hill-climbing under tier and forbidden or required
    arc constraints. Bootstrap the search, report how often each arc and each direction appeared, and average the
    results above a threshold.
