id: style-presets
name: Visual Style Presets
category: export
description: Save and apply named visual styles (colors, sizes, labels, legend) so a deliverable looks the same every
    time it is regenerated. Built-in presets cover the constraints recipients actually impose -- print and journal
    figures that must survive grayscale and color-vision deficiency, accessible web embeds that must meet WCAG
    contrast, and neutral-emphasis court exhibits -- and users can save, share and reapply their own.
status: planned
algorithms: []
