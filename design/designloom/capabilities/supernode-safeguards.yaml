id: supernode-safeguards
name: Supernode Safeguards
category: analysis
description: Show each node's count of undrawn relationships before expanding, open a selective expand (by type,
    direction, neighbor category, most or least connected, maximum count) above a threshold, and never auto-expand a
    hub.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
