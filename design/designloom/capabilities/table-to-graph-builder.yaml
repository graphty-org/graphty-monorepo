id: table-to-graph-builder
name: Graph from a record table
category: analysis
description: Build a graph from a flat table without scripts - a post or action table, or an edge list from a BI tool,
    a CSV file or a notebook - by choosing which column pairs become edges (source and target), which column is the
    weight and which are node attributes; de-duplicate node ids, aggregate weights of repeated pairs, and keep 64-bit
    numeric IDs as text. One record for every population that starts from a table (it absorbed table-to-graph-binding).
status: planned
notes: "Research trace: social-media-disinformation-and-marketing.md section 10, requirement 2 (Must); developers-embedding-and-extending-graph-visualization.md section 10, table row 9 (Must)."
