requirements:
    - "Must: Read time from the documented time model (temporal-data-model-import) -- point events, intervals with multiple spells, snapshot series and time-varying attributes on nodes and edges -- not only a single edge timestamp"
    - "Must: State interval semantics with every window -- inclusive or half-open bounds, open-ended ends, time zone and granularity"
    - "Must: Bin into windows with user-set window length, step and overlap (sliding), and offer cumulative (expanding) windows from the start of the data"
    - "Must: Convert true point events to intervals with a user-set duration or decay, kept separate from start plus duration columns"
    - "Must: Aggregate parallel events within a window (count, sum, first, last) so styles and algorithms read one value"
    - "Must: Compute metrics per window over any built-in algorithm (counts, density, reciprocity, degree, centralities, clustering, components, communities), not a fixed short list"
    - "Library parity: Make it easy to rerun the same analysis at several window lengths, since slice structure depends on window length"
    - "Library parity: Display time series chart for selected metrics with time on x-axis"
    - "Should: Compare two periods -- new, removed and persistent nodes and edges, and a per-node rewiring score"
    - "Library parity: Calculate node and edge arrival and departure counts per window"
    - "Library parity: Report change between periods as values and differences; do not label change points or trends as significant from a fixed percent threshold or a fit statistic alone"
    - "Should: Match communities across windows and label births, deaths, merges and splits"
    - "Must: Support playback animation stepping through time windows, with positions kept stable (stable-temporal-layout) rather than re-laid out every frame"
    - "Should: Offer small multiples or a time axis as alternatives to animation"
    - "Must: Leave undated items under a stated rule (always shown, hidden, or flagged with counts of missing and invalid dates)"
    - "Must: Export per-window results as tidy CSV (window start, window end, metric, value) together with the window length, step, aggregation and interval semantics used"
    - "Library parity: Time-respecting paths and reachability belong to time-respecting-paths, not to per-window aggregates"
sources:
    - title: Holme and Saramaki 2012, Temporal networks
      url: https://arxiv.org/abs/1108.1780
      summary: Contact sequences and interval graphs; projecting a temporal network to a static graph always loses information
    - title: Raphtory view algorithms (rolling and expanding windows)
      url: https://raphtory.readthedocs.io/en/master/user-guide/algorithms/4_view-algorithms/
      summary: Rolling(window, step) and expanding views running algorithms such as PageRank per window
    - title: ndtv vignette
      url: https://cran.r-project.org/web/packages/ndtv/vignettes/ndtv.pdf
      summary: Window and step parameters; overlapping windows reduce abrupt change in animation
    - title: Archambault, Purchase and Pinaud 2011, Animation, small multiples, and the effect of mental map preservation
      url: https://pubmed.ncbi.nlm.nih.gov/20498503/
      summary: Small multiples were faster; animation more accurate for detecting appearance
    - title: Temporal and dynamic network data and analysis (sections 2, 7 and 11, requirements T1-T25)
      url: design/user-research/temporal-and-dynamic-networks.md
      summary: Time models, sliding and cumulative metrics, period comparison, stable layout, reproducible window parameters
