id: temporal-analysis
name: Temporal Analysis
category: analysis
description: Analyze how the network changes over time. Compute any built-in metric per time window (sliding or
    cumulative), compare periods, track arrivals and departures, and record the window parameters behind every result.
    Works on the time models users actually have -- point events, intervals with several spells, snapshot series and
    time-varying attributes on nodes and edges -- not only edges with one timestamp; results depend on window length,
    so the parameters are part of the result.
status: planned
algorithms:
    - Sliding and cumulative time windowing
    - Snapshot comparison (new, removed, persistent; rewiring)
    - Community matching across windows
