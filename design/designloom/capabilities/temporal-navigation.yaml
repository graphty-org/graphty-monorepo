requirements:
    - "Must: Display a time bar spanning the full time range of the data, with the range endpoints and the current window shown"
    - "Must: Show an activity histogram on the time bar, stackable by node or edge type, with bins that adapt to the zoom of the time axis"
    - "Must: Select a window with draggable start and end handles, by dragging across the bar, or by typed dates; also allow a single time point for snapshot series"
    - "Must: Play in three modes: sliding window, cumulative (the end grows, the start stays) and shrinking; with pause, speed, step forward and back, loop and playback backward"
    - "Must: Keep node positions stable during navigation; never re-lay out on every step by default. Offer one layout over the union of all times and chained seeding from the previous window, with optional anchoring strength"
    - "Must: Offer fading as well as hiding for items outside the window"
    - "Must: Define and show the rule for undated items (always shown, hidden, or flagged), with counts of missing and invalid dates"
    - "Must: State the window's interval semantics to the user: inclusive or half-open bounds, open-ended ends, time zone and granularity"
    - "Should: Selecting entities shows their activity on the time bar (selection lines); selecting a window highlights the entities active in it"
    - "Should: Offer small multiples (a filmstrip sharing one layout) and a time-axis view as alternatives to animation"
    - "Must: Make the map view and any linked timeline follow the time window"
    - "Should: Show the current window's dates during playback and record the window parameters, so screenshots and exports can be captioned with them"
    - "Must: Operate entirely by keyboard (step, play and pause) and let any playback be paused or stopped (WCAG 2.2 2.1.1 Keyboard and 2.2.2 Pause, Stop, Hide)"
sources:
    - title: KeyLines time bar
      url: https://developers.cambridge-intelligence.com/docs/keylines/time-bar
      summary: Histogram stackable by group, window handles, play with extend (cumulative), selection lines; filtering
          then re-running layout moves positions
    - title: Neo4j Bloom Slicer
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-tutorial/slicer/
      summary: Ranges over date or number properties with three play modes
    - title: Linkurious timeline
      url: https://doc.linkurious.com/user-manual/3.1/timeline
      summary: Histogram filter that counts missing and invalid date values separately
    - title: Palantir Vertex timeline
      url: https://palantir.com/docs/foundry/vertex/timeline/
      summary: Fades out-of-window items instead of hiding them
    - title: Gephi, Import Dynamic Data
      url: https://docs.gephi.org/desktop/User_Manual/Import_Dynamic_Data/
      summary: Interval bound semantics (inclusive or exclusive, missing end means infinite) for dynamic networks
    - title: ndtv compute.animation
      url: https://search.r-project.org/CRAN/refmans/ndtv/html/compute.animation.html
      summary: Chained layouts that seed each slice with the previous positions
    - title: Archambault, Purchase and Pinaud 2011, Animation, small multiples, and the effect of mental map preservation
      url: https://pubmed.ncbi.nlm.nih.gov/20498503/
      summary: Small multiples faster with no overall error difference; animation better for detecting appearance
    - title: Cambridge Intelligence, methods for visualizing dynamic networks
      url: https://cambridge-intelligence.com/methods-visualizing-dynamic-networks/
      summary: Animation, timelines and stacked 3D layers as ways to show time
    - title: WCAG 2.2
      url: https://www.w3.org/TR/WCAG22/
      summary: 2.1.1 Keyboard and 2.2.2 Pause, Stop, Hide apply to an animated graph
