id: temporal-navigation
name: Temporal Navigation
category: interaction
description: Navigate time-varying graph data with a time bar -- an activity histogram, a window with handles, and
    playback -- to see how the network changes. Investigators mostly use time as a filter (play the case forward, check
    event order), and every commercial investigation toolkit ships such a control (KeyLines and ReGraph time bar,
    Linkurious timeline, Neo4j Bloom Slicer, Palantir Vertex, i2). Positions must stay stable across time, and
    animation should be one option beside small multiples or a time axis, because a controlled study found small
    multiples faster with no overall error difference while animation was better for spotting appearances
    (Archambault, Purchase and Pinaud 2011). See design/user-research/temporal-and-dynamic-networks.md.
status: in-progress
notes: "Partly ships: graphty/src/workspace/time/TimeDock.tsx and the session's time window (setWindow, play, seek), including a cumulative mode. Planned: the activity histogram on the time bar, small multiples, and selection lines for selected entities. Any requirement below that this note does not name as shipping counts as planned."
