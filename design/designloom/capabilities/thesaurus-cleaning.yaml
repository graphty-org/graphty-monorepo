id: thesaurus-cleaning
name: Thesaurus-based entity cleaning
category: analysis
description: A reusable label-to-replacement table for any entity (terms, authors, organizations, assignees,
    references), edited in place, applied without re-importing, importable and exportable as a VOSviewer thesaurus file,
    with suggested variant groups (stems, abbreviations, company suffixes, subsidiary roll-up) and homonym warnings.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
