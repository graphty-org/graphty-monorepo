requirements:
    - "Must: Edge thresholding by absolute value, percentile/density, absolute value of signed weights;
      positive/negative split with diverging color"
    - "Must: Load a pairwise association table (coefficient and p-value) or matrix, keep edges by absolute coefficient and adjusted p cutoffs with a live histogram and counts, and re-run chosen metrics across several cutoffs into a sweep table."
    - "Should: Re-run a ranking or filter at several alternative cutoffs (STRING score, degree, centrality) and compare the resulting hub lists with persistence counts."
    - "Should: Re-runs a hub-screening rule at alternative cutoffs (such as STRING confidence or degree) and with alternative centralities, then compares the resulting hub lists with a persistence count for each node."
