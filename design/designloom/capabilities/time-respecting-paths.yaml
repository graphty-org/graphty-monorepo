requirements:
    - "Must: Forward and backward reachability from a chosen node within a time window along edges in correct chronological order, so a path that violates time order never appears. Plain reachability overstates risk in livestock tracing and in hospital movement work."
    - "Must: Find paths whose edges occur in time order (dated-event order), alongside the connecting network among seeds."
    - "Must: Find or expand directed paths where each hop happens after the previous one, optionally constrained by amount (each hop within a ratio of the last, or capped at the amount received), including cycle search for round-tripping and forward expansion from a seed transaction rather than a seed node."
    - "Must: Earliest-arrival paths, latency, forward and backward reachable sets and ordered cycle search with a maximum waiting time and optional per-hop attribute constraints (amount ratio); compare with static paths; export the path as an ordered timestamped list."
