requirements:
    - "Should: Show a preview for nodes and for edges (many tools cannot hover an edge at all; Plotly is one)"
    - "Library parity: Let the consumer choose which attributes and computed values appear (label, type, degree, an algorithm result), with a neutral default; graphty-element returns values, and the application writes any wording around them"
    - "Must: Edge previews can carry the endpoints, type, weight and aggregates such as sent, received and total counts or per-edge uncertainty (estimate and interval)"
    - "Must: Show the preview on keyboard focus as well as on hover, with the item's kind, name, degree split by direction and, for an edge, its far end"
    - "Should: On touch devices show the same preview on tap, and keep every previewed fact reachable without hover (selection detail, labels baked into exports)"
    - "Library parity: Keep the preview inside the viewport and off the item it describes"
    - "Library parity: The hover delay is a consumer option with a neutral default; after the delay, show and dismiss within the 0.1 second limit that feels instant"
    - "Must: Hand the hovered item's id to the host, so a host application can show its own preview (an Obsidian-style note pane, the records behind an edge)"
    - "Library parity: Allow tooltips to be turned off"
sources:
    - title: Yi, Kang, Stasko and Jacko 2007, The role of interaction in information visualization
      url: https://doi.org/10.1109/TVCG.2007.70515
      summary: Interaction taxonomy; details on demand is the "elaborate" intent tooltips serve
    - title: NN/g, Tooltip guidelines
      url: https://www.nngroup.com/articles/tooltip-guidelines/
      summary: Tooltips hold brief, supplementary information
    - title: Nielsen Norman Group, Response times, the 3 important limits
      url: https://www.nngroup.com/articles/response-times-3-important-limits/
      summary: 0.1 second feels instant
    - title: Neo4j Bloom scene interactions
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-visual-tour/bloom-scene-interactions/
