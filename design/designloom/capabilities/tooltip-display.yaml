id: tooltip-display
name: Tooltip Display
category: interaction
description: Show a short preview of a node or edge on hover or keyboard focus -- the attributes a reader needs to
    decide whether to open it -- without opening the full detail panel. Users across the research hover to preview and
    click to open (Neo4j Bloom caption properties, Obsidian note previews, e-discovery sender and date, text
    concordance lines). Hover is not available everywhere -- tooltips vanish from static exports and phone readers
    "can't rely on things like tool tips or hover", so nothing may be reachable only by hover. Which attributes to show,
    and the words around them, are the application's choice; graphty-element supplies the values.
status: in-progress
notes: "Partly ships: the element's tooltip style option (node.tooltip and edge.tooltip in graphty-element/api/schema.api.md). Planned: previews on keyboard focus and on tap, and the hover delay as a consumer option. Any requirement below that this note does not name as shipping counts as planned."
