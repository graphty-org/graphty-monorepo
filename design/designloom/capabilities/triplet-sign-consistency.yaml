id: triplet-sign-consistency
name: "Sign consistency across triplets"
category: analysis
description: "Check every A-B-C triplet of a typed network against an expected sign pattern (for ceRNA: lncRNA-mRNA correlation positive, each with the shared miRNA negative, lncRNA and mRNA changed in the same direction), and list or mark the triplets that contradict it."
status: planned
notes: "Research trace: systems-biology-omics-networks.md section 5.11 (ceRNA networks) and section 10, requirement 8 (M, sign-consistent paths)."
algorithms: []
used_by_workflows:
    - W251
implemented_by_components: []
requirements:
    - "Must: Check every A-B-C triplet of a typed network against an expected sign pattern given by the user (for ceRNA: lncRNA-mRNA correlation positive, each with the shared miRNA negative, both changed in the same direction)"
    - "Must: List the triplets that contradict the pattern and mark them through a style layer on the result"
sources:
