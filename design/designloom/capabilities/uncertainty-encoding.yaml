id: uncertainty-encoding
name: Certainty and Uncertain-Date Handling
category: visualization
description: Directed edges each carrying a probability or weight, drawn by opacity or width, with more than one
    candidate parent per node shown rather than only a consensus parent, and inferred (unobserved) nodes visually
    distinct from observed ones.
status: planned
notes: Proposed from the user research in design/user-research/ (see its README for the populations behind it).
algorithms: []
