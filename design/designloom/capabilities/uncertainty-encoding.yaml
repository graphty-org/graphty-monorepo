requirements:
    - "Should: Directed edges with a probability or weight per edge, drawn by opacity or width, and more than one
      candidate parent per node shown rather than only a consensus"
    - "Must: Store certainty or confidence and uncertain date ranges (before, after, between, partial dates) per node and edge; filter by threshold with a count of hidden items, and encode certainty visually (opacity, dashes)."
    - "Must: Per-edge uncertainty as edge data (interval, proportion non-zero, inclusion Bayes factor, direction probability) drawable as opacity, a three-state included/excluded/inconclusive style or arrowhead emphasis, with a linked strip of edges ordered by estimate."
    - "Must: Draw edge strength as thickness and direction confidence as its own mark, dash edges below a threshold the reader can change live, and show tiers as time bands."
