id: view-bookmarks
name: View Bookmarks
category: interaction
description: Save the current view state -- camera, filters, selection, styles and time window -- as a named view,
    and return to it later. Users reuse a handful of saved configurations over and over (Obsidian graph presets),
    share saved scenes view-only (Neo4j Aura Explore, Linkurious), and publish an ordered set of named, captioned views
    as slides or a PDF (Kumu presentations). A saved view is also provenance -- the filters, time window and parameters
    behind a figure travel with it.
status: in-progress
notes: "Partly ships: saved views in the Camera menu, graphty/src/workspace/toolbar/WorkspaceToolbar.tsx. Planned: export, import and shareable read-only links for views, and an ordered sequence of views published as a presentation. Any requirement below that this note does not name as shipping counts as planned."
