requirements:
    - "Must: Save the current view under a user-given name, with an optional caption and the time it was saved"
    - "Must: Store the camera (position, target and zoom; x, y, z in 3D), the active filters, the selection, the style layers, the time window and pinned positions"
    - "Must: Keep results scoped to a view (expansions, hidden nodes, computed values) with that view, never written back to the source data"
    - "Library parity: Restore all stored state when a view is opened; animate the camera unless the reader asks for reduced motion"
    - "Library parity: List saved views with rename, update (overwrite with the current view), reorder and delete"
    - "Must: Save views inside the project or session file, so they travel with the data rather than one browser"
    - "Should: Export and import saved views, and give a view a shareable link that opens it read-only"
    - "Must: Publish an ordered sequence of views as a presentation, PDF or slides, each with its caption"
    - "Must: Record each view's parameters (data source, filters, algorithms and their parameters, layout and seed, time window) so they can be exported with a figure as its provenance"
    - "Library parity: Any limit on the number of saved views is a consumer option, not a fixed cap"
sources:
    - title: Heer et al. 2008, Graphical histories for visualization
      url: https://doi.org/10.1109/TVCG.2008.137
      summary: Saving and revisiting visualization states during analysis
    - title: Obsidian forum, graph view presets
      url: https://forum.obsidian.md/t/graph-view-presets-to-save-and-load-filters-display-settings/8131
      summary: '"I re-use a handful of graph view filter configurations over and over"'
    - title: Neo4j Aura Explore, scenes and export
      url: https://neo4j.com/docs/aura/explore/explore-features/scenes-export/
      summary: Saved scenes shared view-only and copied to edit; deep links
    - title: Kumu presentations
      url: https://docs.kumu.io/guides/presentations
      summary: Each slide keeps its view, zoom, focus and filter
    - title: Google Model Explorer user guide
      url: https://github.com/google-ai-edge/model-explorer/wiki/2.-User-Guide
      summary: Bookmarked view states and permalinks
    - title: Linkurious user manual
      url: https://doc.linkurious.com/user-manual/latest/page.html
      summary: Visualizations shared as view-only, edit, or edit and share
