id: viewpoint-and-video-export
name: Named viewpoints, multi-view and video export
category: export
description: Save named camera viewpoints; export a canonical view set (named standard views, anatomical or along a
    layout's principal axes, laid out as one panel at a set DPI and physical size), a turntable or a fly-through video;
    a light print theme; and flatten a 3D view to 2D for a figure.
