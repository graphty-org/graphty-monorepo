requirements:
    - "Must: Map a numeric attribute (weight, count, or a sum over parallel events) to width, with a consumer-set range and an optional user-set maximum, so figures drawn separately share one scale"
    - "Must: Read the weight column's declared meaning (strength or distance) and show it in the legend; never map a distance to width as if it were a strength without a recorded conversion"
    - "Must: Encode signed weights by absolute value for width and saturation, sign by a colorblind-safe pair (blue and red, not green and red) plus a non-color cue such as dashed negatives (WCAG 1.4.1 Use of Color)"
    - "Must: Hide edges below a user-set minimum without moving the layout"
    - "Must: Map a categorical attribute (edge type, role) to color and to line style (solid, dashed, dotted)"
    - "Must: Map a numeric attribute to opacity, including per-edge uncertainty (estimate, interval, inclusion) as opacity or a three-state included, excluded or inconclusive style"
    - "Must: Show direction by arrowheads or by tapering, chosen by the consumer, with adjustable arrow size; render direction uncertainty (for example reduced arrowhead opacity)"
    - "Must: Draw typed parallel edges either as separate curved edges with increasing offset or merged into one per pair or per direction with count and sum; offset the two directions of a reciprocal pair"
    - "Library parity: Render self-loops, and let them be shown or hidden without dropping them from the data"
    - "Must: Curve edges as an option, curving longer edges more (flow maps)"
    - "Must: Offer edge bundling as an opt-in, never on by default, and say in the legend that bundled lines are not routes"
    - "Must: Display edge labels from an attribute (for example a count), and show the full label on hover or focus"
    - "Must: Hide all edges while keeping node positions, and fade or hide edges by a threshold or top-N for clutter control"
    - "Must: Include edge encodings in the generated legend, with the attribute and its range"
sources:
    - title: Holten and van Wijk 2009, A user study on visualizing directed edges in graphs
      url: https://doi.org/10.1145/1518701.1519054
      summary: Compares direction representations; tapered edges performed best in node-link diagrams
    - title: Munzner 2014, Visualization Analysis and Design
      url: https://doi.org/10.1201/b17511
      summary: Channels and their effectiveness for magnitude and category
    - title: Jenny et al., Design principles for origin-destination flow maps
      url: https://core.ac.uk/works/53876872
      summary:
          From 97 maps and a 215-participant study, curved beats straight, arrows beat tapering for direction, curve
          longer flows more
    - title: qgraph manual
      url: https://cran.r-project.org/web/packages/qgraph/qgraph.pdf
      summary: Width and saturation by absolute weight relative to maximum; minimum hides weak edges without moving the
          layout; the colorblind theme (blue positive, red negative) is the de facto standard
    - title: Opsahl, Agneessens and Skvoretz 2010, Node centrality in weighted networks
      url: https://toreopsahl.com/wp-content/uploads/2010/04/node_centrality_in_weighted_networks1.pdf
      summary: Weights as strengths versus distances and the conversion between them
    - title: WCAG 2.2, Understanding 1.4.1 Use of Color
      url: https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html
      summary: Color must not be the only visual means of conveying information
    - title: Gephi release notes
      url: https://github.com/gephi/gephi/releases
      summary: Gephi merges parallel edges on import and by default increases the edge weight
