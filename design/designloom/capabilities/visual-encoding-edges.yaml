id: visual-encoding-edges
name: Edge Visual Encoding
category: visualization
description: Map edge attributes to visual properties (color, width, opacity, line style, arrows, labels) to encode
    relationships. Width from a weight, count or summed attribute is a must across investigators, e-discovery,
    psychometrics and flow mapping, but a weight's meaning has to be explicit -- counts and correlations are strengths,
    kilometers and costs are distances -- so a wider line never silently means "farther". Signed weights need a
    colorblind-safe pair plus a non-color cue (qgraph's blue and red, dashed negatives). Direction is shown by arrows or
    tapering; tapering read best for node-link graphs (Holten and van Wijk 2009) while arrows beat tapering in flow maps
    (Jenny et al.), so both are options.
status: in-progress
notes: "Partly ships: style layers on session.styles (edge color, width, style, curvature, arrowheads, taper, labels), edited in graphty/src/workspace/style/BindingPopover.tsx. Planned: showing a weight column's declared meaning in the legend and uncertainty drawn as opacity or a dashed style from the data. Any requirement below that this note does not name as shipping counts as planned."
