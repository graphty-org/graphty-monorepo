requirements:
    - "Must: Map a categorical attribute or a partition (community, cluster, type) to color; the palette is a consumer option, and colorblind-safe palettes that avoid red-green pairs are offered"
    - "Library parity: When a category has more values than a palette can keep distinguishable, offer grouping the rest or another channel (shape, label, on-hover detail) instead of cycling colors"
    - "Library parity: Map a continuous attribute to a sequential or diverging color scale, by brightness or lightness rather than hue"
    - "Must: Map a numeric attribute or any computed ranking to size, with a consumer-set range and a linear, square-root (area) or log scale"
    - "Must: Default to uniform node size unless a stated measure is encoded"
    - "Must: Map a categorical attribute to shape, and allow color, size, shape and border encodings on the same nodes"
    - "Must: Keep color from being the only cue for a category or state (WCAG 1.4.1) and offer a grayscale check for print"
    - "Must: Offer label visibility modes: all, selected only, none, and above a size or ranking threshold; also short labels with full text in the legend or on hover"
    - "Must: Keep the labels a mode shows from overlapping each other or other nodes; placement, leader lines and the choice between moving labels only or nodes too belong to label-overlap-removal"
    - "Must: Let rule-based color groups (by query or by attribute) be saved with the view"
    - "Should: Highlight nodes whose computed community disagrees with where the layout places them, so a reader does not read a visual cluster as a computed one"
    - "Must: Generate a legend from the live style for every encoding, stating the attribute and its endpoints"
    - "Library parity: Apply encoding changes interactively on large graphs, with progress feedback for anything slower than about one second"
sources:
    - title: Munzner 2014, Visualization Analysis and Design
      url: https://doi.org/10.1201/b17511
      summary: Channels ranked by effectiveness; hue for categories, magnitude channels for ordered values
    - title: Venturini, Jacomy and Jensen, What do we see when we look at networks
      url: https://arxiv.org/abs/1905.02202
      summary: Size by a ranking, hue for categories and brightness for continuous variables, label by size threshold;
          visual clusters versus computed communities
    - title: Marai et al., Ten simple rules to create biological network figures for communication
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6762067
      summary: Avoid red-green, check grayscale, labels at caption size
    - title: WCAG 2.2, Understanding 1.4.1 Use of Color
      url: https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html
      summary: Color must not be the only visual means of conveying information
    - title: American Political Science Review, preparing your materials
      url: https://www.cambridge.org/core/journals/american-political-science-review/information/author-instructions/preparing-your-materials
      summary: Figures must be readable in grayscale
    - title: qgraph manual
      url: https://cran.r-project.org/web/packages/qgraph/qgraph.pdf
      summary: Short node labels with a legend of full item text (nodeNames) and colors by group
    - title: Nielsen Norman Group, Response times, the 3 important limits
      url: https://www.nngroup.com/articles/response-times-3-important-limits/
      summary: 1 second keeps the flow of thought; past that, show progress
