id: visual-encoding-nodes
name: Node Visual Encoding
category: visualization
description: Map node attributes and computed values to visual properties (color, size, shape, border, opacity,
    label) through rule-based style layers saved with the view. The near-universal recipe across the research is size by
    a ranking (degree, citations, shared cM) and color by a partition or category -- hue for categories, brightness for
    continuous values (Venturini, Jacomy and Jensen) -- with labels shown above a size threshold and an automatic legend.
    Published figures must survive grayscale printing and color-vision deficiency, so color is never the only cue, and
    uniform sizing is the default unless a stated measure is encoded.
status: in-progress
notes: "Partly ships: style layers on session.styles, edited in graphty/src/workspace/style/BindingPopover.tsx. Planned: highlighting nodes whose community disagrees with their place in the layout, and a grayscale check for print. Any requirement below that this note does not name as shipping counts as planned."
