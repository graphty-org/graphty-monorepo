id: zoom-pan
name: Zoom and Pan Navigation
category: interaction
description: Navigate the graph view by zooming (changing magnification) and panning (shifting the viewport), with
    one-step framing of the whole graph or the selection. Zooming is the "zoom" step of Shneiderman's "overview first,
    zoom and filter, then details-on-demand", but for large database-backed graphs users start from a search and
    expand rather than from a full overview (van Ham and Perer 2009), so framing a selection or a newly expanded
    neighborhood matters as much as framing the whole graph. Readers of embedded and published graphs need page scroll
    left alone, and keyboard and single-pointer users need navigation that does not depend on dragging.
status: in-progress
notes: "Partly ships: graphty-element/src/cameras/ and the zoom commands in graphty/src/workspace/toolbar/commands.ts. Planned: a consumer option that turns scroll-wheel zoom off for an embedding page, and a one-step return to the overview in headset modes. Any requirement below that this note does not name as shipping counts as planned."
