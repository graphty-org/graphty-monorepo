id: algorithm-panel
name: Algorithm Panel
category: display
description: Panel for selecting and running graph algorithms. Organizes algorithms by category with parameter configuration.
status: planned
implements_capabilities:
  - centrality-degree
  - centrality-betweenness
  - centrality-closeness
  - centrality-eigenvector
  - centrality-pagerank
  - community-detection
  - shortest-path
  - all-paths-finding
  - component-analysis
used_in_workflows:
  - W03
  - W04
  - W06
dependencies:
  - algorithm-card
  - select
  - divider
  - progress-bar
props:
  algorithms: AlgorithmDefinition[] - Available algorithms
  onRunAlgorithm: "(id: string, params: any) => void - Run algorithm handler"
  runningAlgorithm: string - Currently running algorithm ID
  results: AlgorithmResult - Last algorithm result
sources:
  - title: Progressive Disclosure for Complex Tools
    url: https://www.nngroup.com/articles/progressive-disclosure/
    summary: Showing algorithm options progressively based on user expertise level
  - title: Form Design Best Practices
    url: https://www.nngroup.com/articles/web-form-design/
    summary: Guidelines for parameter input forms with sensible defaults
version: 1.0.1
created_at: 2026-01-16T04:01:27.952Z
updated_at: 2026-01-16T16:40:38.271Z
