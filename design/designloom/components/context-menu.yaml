id: context-menu
name: Context Menu
category: utility
description: Right-click context menu with contextual actions based on clicked element (node, edge, or canvas).
status: planned
implements_capabilities:
  - node-selection
  - neighborhood-expansion
  - ego-network
used_in_workflows:
  - W02
  - W05
dependencies:
  - icon
  - keyboard-shortcut
  - divider
props:
  target: "string - Target type: 'node' | 'edge' | 'canvas'"
  targetId: string - ID of target element
  position: "{x: number, y: number} - Menu position"
  onAction: "(action: string, targetId: string) => void - Action handler"
  onClose: () => void - Close menu handler
