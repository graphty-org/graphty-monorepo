id: file-drop-zone
name: File Drop Zone
category: control
description: Drag-and-drop area for file uploads. Supports click-to-browse, file type validation, and visual feedback
  during drag operations.
status: planned
implements_capabilities:
  - data-import
used_in_workflows:
  - W14
  - W18
dependencies:
  - icon
  - button
props:
  onFilesSelected: "(files: File[]) => void - Handler when files are selected"
  accept: string - Accepted file types (e.g., '.csv,.json,.graphml')
  multiple: "boolean - Allow multiple files (default: false)"
  maxSize: number - Max file size in bytes
  disabled: "boolean - Disable the drop zone (default: false)"
sources: []
