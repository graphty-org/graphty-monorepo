id: legend-item
name: Legend Item
category: display
description: Single entry in a legend showing a visual symbol and its meaning. Supports color, shape, and size encodings.
status: planned
implements_capabilities:
  - legend-display
used_in_workflows:
  - W02
  - W04
dependencies:
  - color-swatch
  - tooltip
props:
  label: string - Legend entry label
  color: string - Symbol color
  shape: "string - Symbol shape: 'circle' | 'square' | 'triangle' | 'diamond'"
  size: number - Symbol size
  count: number - Optional count of items with this encoding
  onClick: () => void - Click handler for interactive legends
