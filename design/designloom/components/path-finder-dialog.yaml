id: path-finder-dialog
name: Path Finder Dialog
category: dialog
description: Dialog for finding paths between nodes. Supports shortest path, all paths, and k-shortest paths with
  configurable parameters.
status: planned
implements_capabilities:
  - shortest-path
  - all-paths-finding
  - path-highlighting
used_in_workflows:
  - W05
  - W06
  - W09
dependencies:
  - search-input
  - select
  - slider
  - checkbox
  - button
props:
  open: boolean - Whether dialog is open
  sourceNode: string - Source node ID
  targetNode: string - Target node ID
  onClose: () => void - Close handler
  onFindPaths: "(options: PathOptions) => void - Find paths handler"
sources:
  - title: Path Visualization in Graphs
    url: https://cambridge-intelligence.com/visualizing-paths/
    summary: Techniques for highlighting paths without losing graph context
  - title: Wizard Design Pattern
    url: https://www.nngroup.com/articles/wizards/
    summary: Multi-step dialog patterns for complex parameter selection
version: 1.0.1
created_at: 2026-01-16T04:01:56.567Z
updated_at: 2026-01-16T16:40:54.034Z
