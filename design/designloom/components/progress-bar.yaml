id: progress-bar
name: Progress Bar
category: display
description: Visual indicator of progress for long-running operations. Supports determinate and indeterminate modes.
status: planned
implements_capabilities:
  - algorithm-progress
used_in_workflows:
  - W01
  - W03
  - W18
  - W06
  - W09
  - W19
  - W04
dependencies: []
props:
  value: number - Progress percentage 0-100 (omit for indeterminate)
  label: string - Progress label
  showPercentage: "boolean - Display percentage text (default: false)"
  size: "string - Bar height: 'sm' | 'md' | 'lg' (default: 'md')"
  color: "string - Bar color (default: 'primary')"
sources:
  - title: Progress Indicator Best Practices
    url: https://www.nngroup.com/articles/progress-indicators/
    summary: When to use determinate vs indeterminate progress indicators
