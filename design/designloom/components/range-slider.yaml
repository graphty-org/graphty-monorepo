id: range-slider
name: Range Slider
category: control
description: Dual-handle slider for selecting a numeric range. Shows min/max values with optional histogram background.
status: planned
implements_capabilities:
  - filtering
used_in_workflows: []
dependencies:
  - slider
  - text-input
props:
  min: number - Minimum allowed value
  max: number - Maximum allowed value
  value: "[number, number] - Current range [min, max]"
  onChange: "(value: [number, number]) => void - Range change handler"
  step: "number - Step increment (default: 1)"
  label: string - Slider label
  histogram: number[] - Optional histogram data for background
sources: []
