id: search-input
name: Search Input
category: control
description: Text input specialized for search with search icon, clear button, and keyboard shortcuts. Shows loading
  state during search operations.
status: planned
implements_capabilities:
  - search
used_in_workflows:
  - W02
  - W06
  - W13
dependencies:
  - text-input
  - icon-button
  - icon
  - spinner
props:
  value: string - Current search query
  onChange: "(value: string) => void - Query change handler"
  onSubmit: "(value: string) => void - Search submit handler"
  placeholder: "string - Placeholder text (default: 'Search...')"
  loading: "boolean - Show loading indicator (default: false)"
  shortcut: string - Keyboard shortcut hint (e.g., '/')
sources:
  - title: Search Box Design
    url: https://www.nngroup.com/articles/search-visible-and-simple/
    summary: Making search discoverable with appropriate scope indication
version: 1.0.1
created_at: 2026-01-16T03:59:31.267Z
updated_at: 2026-01-16T16:41:03.570Z
