id: tooltip
name: Tooltip
category: utility
description: Contextual popup that appears on hover or focus. Displays additional information about an element without
  cluttering the UI.
status: planned
implements_capabilities:
  - tooltip-display
used_in_workflows:
  - W14
dependencies: []
props:
  content: ReactNode - Tooltip content
  children: ReactNode - Trigger element
  position: "string - Tooltip position: 'top' | 'bottom' | 'left' | 'right' (default: 'top')"
  delay: "number - Show delay in ms (default: 200)"
  disabled: "boolean - Disable tooltip (default: false)"
sources:
  - title: Tooltip Guidelines
    url: https://www.nngroup.com/articles/tooltip-guidelines/
    summary: When tooltips help vs hinder, timing, and accessibility considerations
version: 1.0.1
created_at: 2026-01-16T03:59:03.535Z
updated_at: 2026-01-16T16:41:03.357Z
