id: zoom-controls
name: Zoom Controls
category: control
description: Button group for controlling graph zoom level. Includes zoom in, zoom out, fit-to-view, and reset buttons.
status: planned
implements_capabilities:
  - zoom-pan
used_in_workflows:
  - W14
  - W02
  - W05
dependencies:
  - icon-button
  - tooltip
props:
  zoomLevel: number - Current zoom level (1 = 100%)
  onZoomIn: () => void - Zoom in handler
  onZoomOut: () => void - Zoom out handler
  onFitToView: () => void - Fit graph to viewport
  onReset: () => void - Reset to default zoom
  minZoom: "number - Minimum zoom level (default: 0.1)"
  maxZoom: "number - Maximum zoom level (default: 10)"
sources:
  - title: Zoom Interface Patterns
    url: https://www.nngroup.com/articles/zooming-controls/
    summary: Button vs slider vs scroll wheel trade-offs for zoom interfaces
version: 1.0.1
created_at: 2026-01-16T04:00:02.231Z
updated_at: 2026-01-16T16:41:02.946Z
