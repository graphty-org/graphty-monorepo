id: 3d-graph-embedder
name: Developer Embedding a 3D Graph
roster_persona: graph-product-frontend-engineer
tier: A
scope: in-scope
role: Independent Developer Building 3D Knowledge-Base and Network Views
quote: A script tag and graphData gets me a spinning 3D graph in ten minutes. Making it fast at ten thousand nodes, and usable in a headset, is the part nobody documents.
bio: >-
    Leo Brandt is an independent developer who builds a 3D "explore your notes" view as an Obsidian plugin, and builds
    3D network views for clients' websites. He starts from 3d-force-graph or react-force-graph, either by a script tag
    from a CDN or through the React packages that share one interface across 2D, 3D, VR and AR. He replaces node spheres
    with text sprites or custom three.js meshes, draws flow with directional particles, switches to a DAG mode for trees,
    and reaches into the scene, camera and renderer for anything the props do not cover. His graphs come from markdown
    links and tags, from a knowledge graph his LLM pipeline extracted, from a Neo4j query or from a code base's imports,
    usually a few hundred to ten thousand nodes. He copies the README's interaction examples: hover to highlight
    neighbors, click to fly the camera to a node and open his own side panel, frame the graph once the layout settles.
    In Next.js he loads the graph client-only. The evidence for this persona is open-source plugins, AI and developer
    tools on GitHub and issue threads; products with paying users that use the same libraries (SigNoz, cognee) chose
    the 2D package, and no commercial product built on a 3D graph library was found.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: basic
    domain_knowledge: intermediate
motivations:
    - Make a striking, explorable 3D view with very little code
    - Keep it smooth at the size of a real vault or client dataset
    - Offer a VR or AR mode without rewriting the app
    - Customize node appearance (labels, icons, meshes) to the content
behaviors:
    - Installs by script tag or npm and passes graphData with nodes and links
    - Colors nodes automatically by a group field and picks trackball, orbit or fly controls
    - Replaces nodes with text sprites or custom meshes and adds particles for flow
    - Tunes warmup and cooldown ticks, pauses the animation for a static view, and turns off pointer interaction for speed
    - Opens GitHub issues when labels or the render loop slow down at size
goals:
    - A 3D view that idles when nothing changes and stays interactive at 10,000+ nodes
    - Labels that remain readable without killing frame rate
    - A VR mode where a controller can select a node and the camera is reachable
    - A way to share or export a 3D view
    - A graph that appears already framed, and click-to-focus and hover-highlight without copying camera arithmetic
    - A graph that imports in a Next.js page without a client-only wrapper
frustrations:
    - Server-side rendering throws "window is not defined", and the dynamic-import fix breaks ref methods
    - zoomToFit after the engine stops fires many seconds late, so he polls with setTimeout
    - Screenshots of the 3D canvas come out blank or black
    - Text sprites on 10,000+ nodes are very slow
    - The animation loop never stops on graphs over 5,000 nodes and the view gets slower each time data is replaced
    - No WebGPU path for 200k elements
    - In VR it is unclear how to detect a controller touching a node, and the camera is not reachable as on desktop
    - Any React state change re-renders the whole VR graph
    - No documented route for exporting or sharing a 3D view
knows:
    - JavaScript, React, three.js basics and A-Frame
    - Plugin APIs of host apps such as Obsidian
refuses_to_learn:
    - Writing his own force simulation or renderer
    - Graph algorithms beyond grouping and coloring
context:
    frequency: as-needed
    devices:
        - desktop
        - laptop
        - vr-headset
    voluntary: true
workflows:
    - W279
    - W280
    - W283
    - W284
