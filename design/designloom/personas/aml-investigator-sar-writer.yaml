id: aml-investigator-sar-writer
name: AML Investigator and SAR Writer
role: Level 2 Financial Crimes Investigator / Suspicious Activity Report Writer, mid-size US bank
quote: I have thirty days from detection to decide and file. Show me every account this person touches, summed, so I investigate the network once instead of five alerts five times.
bio: >-
    Dana Whitfield is a Level 2 anti-money-laundering (AML) investigator at a mid-size US bank. Alerts that a Level 1
    reviewer could not close land in her queue in a vendor case manager (Actimize, Oracle FCCM or Verafin). For each
    escalated case she pulls 6 to 12 months of transactions for every subject account from core banking and wire screens,
    pivots them in Excel, checks LexisNexis and World-Check, and, where the bank has licensed one, opens an embedded graph
    view (Linkurious, Quantexa or a KeyLines panel) styled by "has open alert" and "has prior SAR". Her graph is a directed,
    timestamped multigraph: hundreds of wires and ACH payments between the same pair of accounts, which is a hairball until
    the parallel transactions are summed per pair and direction. She sees only the legs that touch her bank's customers;
    everything outside arrives as free-text counterparty names and partial account numbers, so the subject's graph is a star
    with external leaves until she groups the spellings and another bank answers a 314(b) request. Her output is not a
    picture but a decision (file or do not file a suspicious activity report) defended in front of a second reviewer or a
    committee, a narrative with the five essential elements (who, what, when, where, why), and supporting documentation
    retained for five years and producible to examiners on request.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Reach a supported, reasonable file or no-file decision inside the 30-day deadline (60 days when no suspect is identified)
    - Investigate a connected network once, as one case, instead of working each alert separately
    - Write a narrative that states who, what, when, where and why, since the SAR form accepts no attachments
    - Keep supporting documentation that reproduces every number in the narrative if an examiner or law enforcement asks
    - Spot continuing activity at the 90-day review by comparing counterparties and flows across two date ranges
behaviors:
    - Starts from the alert payload and the triggering transactions, then pulls 6 to 12 months of activity for all subjects
    - Looks at the 1 to 2 hop neighborhood of each subject, colored by open alerts and prior SARs, to decide one case or several
    - Groups free-text wire and ACH counterparty names into probable counterparties before graphing, keeping external counterparties as their own kind of node
    - Collapses parallel transactions into one summed edge per pair and direction with count, total, first and last date
    - Filters by date range and amount (for example cash just under 10,000 dollars) and reads histograms for structuring peaks
    - Tests the summed graph for fan-in, fan-out, pass-through, round-tripping cycles and sub-threshold cash
    - Sends 314(b) requests to registered peer banks where money leaves the bank and merges their answers into the case, noting the source of each leg
    - Researches subjects in screening lists and company registries and attaches the hits
    - Hands the second reviewer an image plus tables of sums, dates and paths, and writes the narrative from them
frustrations:
    - Most alerts are false positives (a RUSI working paper cites false-positive rates around 70 to 95 percent) and data gathering dominates the case
    - Hundreds of parallel transactions between two accounts draw as an unreadable bundle unless the tool sums them
    - The trail goes dark where funds leave the bank unless a 314(b) partner answers
    - The same counterparty appears under many spellings and partial account numbers
    - Nothing drawn in the graph flows into the narrative or the case file; numbers are retyped by hand
    - Graph tools that are expensive and hard to learn, so they are licensed for a few people only
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
workflows:
    - W06
    - W118
    - W120
sources:
    - title: FFIEC BSA/AML Examination Manual - Suspicious Activity Reporting
      url: https://bsaaml.ffiec.gov/manual/AssessingComplianceWithBSARegulatoryRequirements/04
      summary: Alert generation, alert management and SAR decision as separate components; decisions must be supported and reasonable
    - title: FinCEN SAR FAQs, October 2025 (NCUA copy)
      url: https://ncua.gov/regulation-supervision/regulatory-compliance-resources/bank-secrecy-act-resources/frequently-asked-questions-regarding-suspicious-activity-reporting
      summary: 30-day filing deadline, optional 90-day continuing-activity review with filing at 120 days, no-file documentation encouraged but not required
    - title: FinCEN - Suggestions for addressing common errors noted in suspicious activity reporting
      url: https://www.fincen.gov/resources/statutes-regulations/guidance/suggestions-addressing-common-errors-noted-suspicious
      summary: The narrative must cover the five essential elements; attachments are not accepted
    - title: FinCEN - SAR supporting documentation
      url: https://www.fincen.gov/index.php/resources/statutes-regulations/guidance/suspicious-activity-report-supporting-documentation
      summary: Supporting documentation is deemed filed, retained five years and produced on request
    - title: Bank of America - Global Financial Crimes investigator posting
      url: https://careers.bankofamerica.com/en-us/job-detail/24017594/global-financial-crimes-gfc-investigator-multiple-locations
      summary: Investigator and SAR writer role that works alerts end to end
    - title: Linkurious - AML investigation solution
      url: https://linkurious.com/aml-investigation-solution
      summary: Vendor; subject neighborhood styled by open alerts and prior SARs
    - title: Linkurious user manual 4.2 - Edge grouping
      url: https://doc.linkurious.com/user-manual/4.2/edgegrouping/
      summary: Parallel edges of one type and direction grouped with count, sum, average, min, max and first and last date
    - title: Morrison Foerster - FinCEN expands section 314(b) information-sharing guidance
      url: https://www.mofo.com/resources/insights/260617-fincen-expands-section-314-b-information-sharing-guidance
      summary: June 2026 fact sheet; suspected fraud alone qualifies, real-time sharing allowed, SARs themselves may not be shared
    - title: Open Ownership - What graph visualisation teaches us about beneficial ownership
      url: https://www.openownership.org/en/blog/what-graph-visualisation-teaches-us-about-beneficial-ownership/
      summary: Graph tools such as Linkurious and Neo4j Bloom liked but their expense and steep learning curve excluded many users
