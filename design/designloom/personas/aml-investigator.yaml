id: aml-investigator
name: AML Investigator
roster_persona: aml-investigator
tier: A
scope: in-scope
role: Level 2 Anti-Money-Laundering Investigator at a bank (consolidated; KYC and ownership, blockchain and FIU analysts as variants)
quote: The alert is one account. The case is the network around it. Give me the summed flows, the other open alerts and the reason each link exists, and let me write the narrative from that.
bio: >-
    Rebecca Whitfield is a Level 2 AML investigator at a mid-size US bank and the consolidated persona for the analysts who
    work an escalated alert or a generated case through to a file or no-file decision. Cases reach her from a vendor
    case manager (Actimize, Oracle FCCM, Verafin) or from a graph platform's alert list (Linkurious, Quantexa), where a
    saved detection query or a scored model raised them. She pulls 6 to 12 months of transactions for every subject,
    sums hundreds of parallel wires and ACH payments per account pair and direction, groups free-text counterparty
    spellings, checks the subject's 1 to 2 hop neighborhood for other open alerts and prior SARs, and tests typologies
    (fan-in, fan-out, pass-through, cycles, structuring) on the summed graph. Her output is a decision, a narrative with
    the five essential elements, and supporting documentation retained for five years. Most alerts are false positives
    (working-paper estimates of 70 to 95 percent), so the ranked case list and a fast, explainable dismissal matter as
    much as the deep investigation. Variants: corporate KYC and beneficial-ownership analysts, blockchain tracers, FIU
    and tax intelligence analysts; the forensic accountant splits between this persona and trial exhibit work. She does
    not code; graph literacy is operational (hops, linked, cluster, summed edge).
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Reach a supported, reasonable file or no-file decision inside the 30-day deadline
    - Work a connected network once, as one case, instead of five alerts five times
    - Dismiss false positives quickly with a rationale a quality-control reviewer accepts
    - Explain every link (which identifier, transaction, filing or registry record) in the narrative
    - Feed confirmed and dismissed outcomes back so the detection rules improve
behaviors:
    - Starts from the case list, sorted by score, amount or age, and opens the case graph rather than loading a file
    - Assigns cases, comments on them and moves them through Open, In progress, Confirmed or Dismissed
    - Collapses parallel transactions into one edge per pair and direction with count, sum, first and last date
    - Checks the subject's neighborhood for open alerts, prior SARs and shared identifiers, discounting identifiers shared by very many accounts
    - Filters by time window and amount and follows directed, time-ordered paths
    - Requests 314(b) information from peer banks and merges their legs into the case with the source recorded
    - Writes the narrative and saves the case graph and tables as supporting documentation
frustrations:
    - Alert queues dominated by false positives, with no explanation of why a case scored high
    - Hairballs from unsummed parallel transactions
    - The trail goes dark where money leaves the bank
    - Nothing drawn in the graph flows into the narrative or the case record
    - Dispositions that never reach the people tuning the rules
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
