sources:
    - title: A close look at the Gephi user community (Gephi blog, 6 Feb 2016)
      url: https://gephi.wordpress.com/2016/02/06/a-close-look-at-the-gephi-user-community/
      summary: 285 respondents (not representative); academia largest sector; 70% analyze social networks, 46% social media, 43% semantic; about a third use it weekly
    - title: Exploring and Analyzing Network Data with Python (Programming Historian)
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: Quaker correspondence network (119 nodes, 174 edges), NetworkX centralities, diameter error on disconnected graphs, write_gexf handoff to Gephi
    - title: Network analysis and visualization with R and igraph (Ognyanova)
      url: https://kateto.net/networks-r-igraph
      summary: The R igraph tutorial applied analysts learn from
    - title: Brown University Library Gephi guide
      url: https://libguides.brown.edu/gephi
      summary: Library-taught Gephi practice for applied researchers
    - title: Introduction to network visualization with Gephi (Grandjean)
      url: https://www.martingrandjean.ch/introduction-to-network-visualization-gephi/
      summary: Resolution "between 0.1 and 2", color by Modularity Class, ForceAtlas2 settings, SVG/PDF export, uncheck create missing nodes
    - title: Gephi bug 727701 - modularity varies between runs
      url: https://bugs.launchpad.net/gephi/+bug/727701
      summary: Different community counts per run; results can vary with the initial order of rows
    - title: Gephi system requirements
      url: https://gephi.org/users/requirements
      summary: About 2 GB RAM for 100,000 elements and more than 8 GB for about a million
    - title: How we analyzed Twitter social media networks with NodeXL (Pew Research, archived)
      url: https://web.archive.org/web/2020/https://legacy.pewresearch.org/wp-content/uploads/sites/9/2014/02/How-we-analyzed-Twitter-social-media-networks.pdf
      summary: NodeXL social-media workflow with CNM, Wakita-Tsurumi and Newman-Girvan clustering
    - title: Gephi Fieldnotes (van Geenen et al. 2023, Frontiers in Big Data)
      url: https://www.frontiersin.org/articles/10.3389/fdata.2022.510310/full
      summary: Readers take a sample map as the whole population; clusters checked against bios and PageRank rather than treated as final
