id: analyst-alex
name: Analyst Alex
roster_persona: analyst-alex
tier: B
scope: in-scope
role: Research Data Analyst (Digital Scholarship or Computational Social Science Lab)
quote: I need to find the groups and the important people and explain them to colleagues who have never heard of modularity -- and I'd like the groups to be the same tomorrow.
bio: >-
    Alex Moreno is a research data analyst in a digital-scholarship or computational social science lab; he also stands
    for policy and market researchers, communication and political-science researchers, social-media analysts and
    librarians who teach Gephi. He taught himself network analysis from the Programming Historian, Katherine Ognyanova's
    R igraph tutorials and library Gephi guides. He works in Gephi (0.10 or 0.11) plus NetworkX in a notebook, handing
    graphs between them with write_gexf; some colleagues pull social-media data into NodeXL in Excel. His data is
    correspondence networks (the Quaker lesson has 119 nodes and 174 edges), co-authorship and citation exports from Web
    of Science or Scopus, retweet and hashtag networks (10^3 to 10^5 nodes), and person-organization tables, all as CSV,
    with several categorical and date columns for coloring. Graphs are often directed and weighted but analyzed as
    undirected, and two-mode data is projected without saying so. For him the drawing is the analysis: a force-directed
    map colored by modularity class plus a paragraph naming groups and key actors is the usual deliverable. He works on
    a project basis -- weekly during a study, then idle.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Find "the groups" and "the important people" and explain them to non-network colleagues in a figure and a paragraph
    - Get the same answer twice, so a figure in a report does not change when it is rebuilt
    - Know which centrality to report and what it means for his domain (brokers vs popular actors)
    - Produce a figure readers do not misread as a whole population or as a map with meaningful distances
    - Hand results to a code-literate colleague without redoing the analysis
behaviors:
    - Follows tutorial recipes step by step (Grandjean's Gephi tutorial, Programming Historian, library guides)
    - Runs Gephi Modularity (Louvain) once, picks a resolution "between 0.1 and 2" by eye, and colors by Modularity Class
    - Sizes nodes by degree, runs Fruchterman-Reingold then ForceAtlas2 with Prevent Overlap, labels the biggest nodes
    - Computes degree, betweenness and eigenvector centrality in NetworkX and looks for high-betweenness, low-degree brokers
    - Hits nx.diameter errors on disconnected graphs and works around them by hand
    - Unchecks Gephi's "create missing nodes" after phantom nodes appear from name variants
    - Exports SVG or PDF for Inkscape because PNG resolution is poor
    - Treats one run's output as the answer and reports it descriptively
goals:
    - Common analyses (communities, centrality, paths) in a few clicks with sensible, current defaults
    - Results that are stable across reruns, or a warning when they are not
    - Plain explanations of what each measure says about his domain
    - A figure with a legend and a recorded method he can cite in the methods section
    - Export to GEXF, GraphML or CSV with computed columns for notebook follow-up
frustrations:
    - Modularity giving a different number of communities on each run, and results varying with the order of input rows
    - No rule for choosing the resolution parameter
    - Path statistics that error out on disconnected graphs instead of using the giant component
    - Weighted path measures silently treating weights as distances (or ignoring them)
    - Readers taking a sample map for the whole population
    - Gephi needing more than 8 GB of RAM around a million elements
context:
    frequency: weekly
