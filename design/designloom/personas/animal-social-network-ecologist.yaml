id: animal-social-network-ecologist
name: Animal Social Network Ecologist
role: Postdoctoral Researcher / Behavioral and Wildlife Disease Ecologist
quote: Two winters of feeder detections, 500 tagged birds. Who flocks with whom, does sex predict centrality, and is that real or just who visits the feeders most?
bio: >-
    Dr. Lena Okafor is a postdoc on a long-term study of a marked population: wild birds carrying RFID tags at feeders,
    dolphins or whales identified by photo-ID, a primate group observed in focal follows, or collared ungulates. Her
    nodes are individual animals, not species, and each carries sex, age, rank, kinship and breeding status from the
    project's life-history database. Edges are association indices (simple ratio or half-weight) computed from thousands
    of group sightings, timestamped feeder detections, proximity-logger contacts or GPS relocations. She works in R with
    asnipe, spatsoc, igraph, sna and ANTs, sometimes SOCPROG for long photo-ID data, and RSiena for network change, and
    tests every result against permutations of the raw observation stream or of node labels. A wildlife-disease variant
    of the same person builds contact networks from proximity collars (badgers and cattle, Tasmanian devils) to model
    who could infect whom.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Test whether sex, age, personality or season predicts an individual's social position
    - Show how the social network changes across seasons or years
    - Estimate transmission pathways and who could infect whom in a contact network
    - Use a permutation test reviewers will accept for the data collection design
    - Report how robust the observed network is to sampling effort
behaviors:
    - Turns raw sightings or detection streams into a group-by-individual matrix, inferring flocking events from feeder data
    - Groups GPS relocations by time and distance thresholds (for example 50 m) to define associations
    - Computes simple ratio or half-weight association indices, subset by period, location or class
    - Builds 1,000 null networks by swapping individuals between groups within day, location or class, or by node-label permutation
    - Computes strength, eigenvector centrality, clustering and modularity, and compares them against the null distribution
    - Uses matrix regression or Mantel tests with dyadic predictors such as kinship, and lagged association rates for association duration
    - Draws one network panel per season with nodes colored by sex or age class and sized by strength, edge width by association index
    - Merges proximity-logger records between the same pair within one or two minutes before building contact networks
frustrations:
    - The right permutation is contested; data-stream permutations can give very high false-positive rates for regression
    - Pre-network permutation is hard to implement for focal follows and GPS data
    - Inferring flocking events from feeder streams needs memory that grows with the square of the data
    - Proximity loggers split one long contact into many records and lose about half their detection distance within eight months
    - Graph tools assume an edge list, not a sightings table or a detection stream
    - SOCPROG's full version needs MATLAB
context:
    frequency: weekly
    devices:
        - laptop
        - desktop
    voluntary: true
workflows:
    - W172
sources:
    - title: Farine and Whitehead 2015 - Constructing, conducting and interpreting animal social network analysis
      url: https://kops.uni-konstanz.de/entities/publication/8843792c-3d9a-427e-88d0-c5be7788fb7a
      summary: Step-by-step guide from defining nodes and edges to hypothesis testing and assessing power and accuracy
    - title: Farine 2017 - A guide to null models for animal social network analysis
      url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5656331/
      summary: Pre-network permutation is challenging to implement for focal follows and GPS data
    - title: Weiss et al. - Common permutation methods in animal social network analysis do not control for non-independence
      url: https://www.biorxiv.org/content/10.1101/2020.04.29.068056.full.pdf
      summary: Data-stream permutations gave type I error rates above 30 percent for regression; node-label permutations about 5 percent
    - title: asnipe get_network help
      url: https://search.r-project.org/CRAN/refmans/asnipe/html/get_network.html
      summary: Association indices SRI and HWI from group-by-individual data, subset by time, location and class
    - title: asnipe gmmevents help
      url: https://search.r-project.org/CRAN/refmans/asnipe/html/gmmevents.html
      summary: Infers flocking events from feeder detection streams; memory guidance and ring-number advice
    - title: spatsoc documentation
      url: https://docs.ropensci.org/spatsoc/
      summary: Grouping GPS relocations by time and distance, edge lists and randomizations
    - title: Drewe et al. 2012 - Performance of proximity loggers in recording contacts between badgers and cattle
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3383709/
      summary: 77 badger and 32 cattle collars; split contact records and declining detection distance
    - title: Wytham Woods great tit study (University of Oxford news)
      url: https://www.ox.ac.uk/news/2024-04-04-more-social-birds-are-more-adventurous-feeders-study-finds
      summary: Long-term RFID feeder study of wild great tits
