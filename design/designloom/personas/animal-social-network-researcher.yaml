id: animal-social-network-researcher
name: Animal Social Network Researcher
role: Behavioral Ecologist (Postdoc or Faculty) Working with GPS, RFID or Proximity Loggers
quote: Two caribou within fifty meters in the same five-minute fix are associated. Change either threshold and my network changes, so show me the map too.
bio: >-
    Dr. Priya Lund is a behavioral ecologist who studies how sociality in caribou, birds or bats changes across seasons
    and years and whether it predicts survival or movement. Her data is relocation tables (animal id, date-time,
    projected x and y) from GPS collars at a fixed fix rate, tens to hundreds of animals over months to years, plus
    RFID or proximity-logger contacts that arrive already paired as short intervals. She works in R: spatsoc groups
    fixes in time (a five-minute threshold absorbs fix-time jitter) and then in space (a 50-meter chain rule, all pairs
    within a distance, or nearest neighbor), asnipe builds a group-by-individual matrix and a simple ratio index
    network per year or season, and igraph computes metrics. She compares observed centrality with networks rebuilt
    from randomized data streams. Her results depend on the time and distance thresholds, and the map of where animals
    were and the network of who was with whom live in different plots. (Disease-focused wildlife ecologists are a
    separate persona; species interaction networks such as food webs are covered elsewhere.)
characteristics:
    expertise: advanced
    time_pressure: low
    graph_literacy: intermediate
    domain_knowledge: advanced
motivations:
    - Compare association networks between seasons or years
    - Test observed network structure against randomized movement data
    - Relate an animal's centrality or strength to survival, reproduction or movement
    - See where associations happened on a map alongside who associated with whom
    - Report thresholds and null-model settings so results are reproducible
behaviors:
    - Loads relocations as a table with id, POSIXct date-time and projected coordinates; adds a season or year column
    - Groups fixes in time with a threshold, then groups or pairs them in space with a distance threshold
    - Builds a group-by-individual matrix and a simple ratio index network per period
    - Runs step, daily or trajectory randomizations within each year and rebuilds the networks
    - Computes strength and centrality per animal per period, observed against random
    - Aggregates wearable-sensor contacts (20-second intervals) by day, shift or cumulative contact time
    - Plots maps and networks separately and matches them by eye
frustrations:
    - Results depend on time and distance thresholds with no standard values
    - The map and the network are separate plots; no view shows both for the same window
    - Everything is code; collaborators in the field cannot explore the networks themselves
    - Comparing many period networks means many separate figures
context:
    frequency: monthly
    devices:
        - laptop
        - desktop
    voluntary: true
workflows:
    - W19
    - W309
    - W311
