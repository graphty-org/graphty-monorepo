      url: https://sites.google.com/site/citespace101/6-configure-a-citespace-run/6-1-time-slicing
      summary: Span, years per slice and node selection per slice
    - title: CiteSpace 101 - Interpret results
      url: https://sites.google.com/site/citespace101/first-example/4-3-interpret-results
      summary: Modularity, silhouette, tree rings, burst and betweenness rings
    - title: Chen, Ibekwe-SanJuan and Hou 2010 (arXiv 1002.1985)
      url: https://arxiv.org/abs/1002.1985
      summary: Top 100 per one-year slice over 13 slices, merged into a 655-reference network; cluster labeling
    - title: SMU Libraries - CiteSpace for power users
