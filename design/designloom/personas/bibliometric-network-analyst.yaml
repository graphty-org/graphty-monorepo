id: bibliometric-network-analyst
name: Bibliometric Network Analyst
role: Research-Impact Librarian or Bibliometrician
quote: The dean wants to see who collaborates with whom. Half my week goes into merging "Smith J" and "Smith JA" before I can draw anything.
bio: >-
    Dr. Ines Aldana is a research-impact librarian who produces co-authorship, institutional collaboration and keyword
    co-occurrence maps for deans, grant offices and systematic-review teams. She exports records from Web of Science
    (500 records per file, Full Record and Cited References, tab-delimited) and Scopus (CSV or BibTeX, up to 2,000 per
    export), concatenates the batches, builds a thesaurus file in Excel to merge author and keyword variants, and makes
    maps in VOSviewer; for more control she uses bibliometrix in R. She knows the methodological choices well: full
    versus fractional counting, minimum documents per author, and whether to ignore documents with hundreds of
    authors. Her maps have to be defensible, so she documents every threshold and every merge.
characteristics:
    expertise: advanced
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: expert
motivations:
    - Show which researchers, groups and institutions collaborate and which are isolated
    - Show how topics cluster through keyword co-occurrence
    - Choose and document thresholds and counting methods a reviewer will accept
    - Re-run the same map next year on a fresh export with the same settings
behaviors:
    - Exports records in batches and concatenates them into one file
    - Builds a tab-delimited thesaurus with Label and Replace by columns, sorting to find variants
    - Chooses full or fractional counting and a minimum number of documents per author
    - Ignores documents with a large number of authors (25 in one university guide) so consortium papers do not swamp the map
    - Lowers thresholds when expected authors drop out of the map
    - Reads the first map as many small colored clusters and checks for artifact hubs
frustrations:
    - Concatenating export batches by hand because each database caps records per export
    - Building a thesaurus by hand to merge name and keyword variants
    - The full versus fractional counting choice changes the map and is easy to forget to report
    - Documents with hundreds of authors create giant cliques that dominate the map
    - Multi-value author, affiliation and keyword cells need parsing before any general graph tool can use them
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W18
    - W294
    - W297
    - W298
sources:
    - title: Leiden University Library - VOSviewer collaboration guide
      url: https://gorlaeus-library.github.io/VOSviewer/collab.html
      summary: Export, concatenate, thesaurus, co-authorship analysis; first map is very colored with many small clusters
    - title: University of Notre Dame LibGuide - VOSviewer demo
      url: https://libguides.library.nd.edu/vos-viewer/demo
      summary: Ignore documents with more than 25 authors; minimum documents per author
    - title: UIC research guide - VOSviewer
      url: https://researchguides.uic.edu/bibliometrics/vosviewer
      summary: Web of Science and Scopus export steps for VOSviewer
    - title: bibliometrix - Introduction vignette
      url: https://bibliometrix.org/vignettes/Introduction_to_bibliometrix.html
      summary: Scripted conversion of bibliographic exports to collaboration and co-occurrence networks in R
    - title: Perianes-Rodriguez, Waltman and van Eck - Constructing bibliometric networks, full and fractional counting
      url: https://arxiv.org/abs/1607.02452v4
      summary: Full versus fractional counting changes link weights and the resulting maps
    - title: Graphty user research - Data preparation, import and first assessment
      url: https://github.com/graphty-org/graphty-monorepo/blob/master/design/user-research/data-preparation-and-import.md
      summary: Composite persona section 2.3 and the bibliographic workflow in section 4.7
