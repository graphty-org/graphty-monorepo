sources:
    - title: Guney et al. 2016 - Network-based in silico drug efficacy screening
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4740350/
      summary: Closest-distance proximity, 13,329-protein interactome, degree-matched null, z <= -2 threshold
    - title: Menche et al. 2015 - Uncovering disease-disease relationships through the incomplete interactome
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4435741
      summary: Interactome incompleteness, largest-component significance, modules under about 25 genes not observable
    - title: Gysi et al. 2021 - Network medicine framework for identifying drug repurposing opportunities for COVID-19
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8126852
      summary: 12 pipelines compared on a 918-drug screen; best AUC about 0.63; module figures drawn with igraph base plot
    - title: NetMedPy
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12401583
      summary: Python proximity and separation with precomputed distance matrices; visualization performed outside the tool
    - title: DIAMOnD module detection
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4390154/
      summary: Seed-based module expansion by hypergeometric connectivity significance
    - title: Open Targets target prioritisation
      url: https://platform-docs.opentargets.org/web-interface/target-prioritisation
      summary: Essentiality scored as a safety liability rather than a target-finding criterion
    - title: Cheng, Kovacs and Barabasi 2019 - Network-based prediction of drug combinations
      url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6416394/
      summary: Separation measure; complementary exposure pattern tracks clinical efficacy
    - title: STRING Database
      url: https://string-db.org
      summary: Weighted functional associations; used for omics overlays but usually excluded from proximity work
