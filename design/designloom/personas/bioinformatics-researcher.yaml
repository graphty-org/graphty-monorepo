id: bioinformatics-researcher
name: Network Medicine Researcher
roster_persona: bioinformatics-researcher
tier: B
scope: in-scope
role: Postdoctoral Researcher / Academic Network Medicine Lab (drug repurposing)
quote: A drug's targets sitting next to a hub means nothing. They have to sit closer to the disease module than a random, degree-matched set would.
bio: >-
    Dr. Wei Chen is a postdoc in an academic network medicine lab that screens approved drugs against diseases for
    repurposing. She works on a lab-curated human interactome of 13,000 to 18,500 proteins and 140,000 to 350,000
    physical interactions, kept as a TSV edge list and reduced to its largest connected component. Disease gene sets come
    from OMIM, GWAS (p < 5e-8) or DisGeNET, keeping diseases with at least 20 genes; drug targets come from DrugBank,
    ChEMBL and BindingDB at 10 micromolar affinity or better. In Python (NetMedPy, NetworkX) or R (SAveRUNNER, igraph)
    she computes the closest-distance proximity between each drug's targets and the disease genes, builds a null model
    from 1,000 degree-matched random sets, and ranks drugs by z-score; before that she tests whether the disease genes
    form a module and grows it with DIAMOnD. Centrality describes a module but is not the method: proximity exists to
    correct for the interactome's degree bias, and Open Targets treats essentiality as a safety liability. Her results
    end as DataFrames, and every figure of a module, a drug's targets and the shortest paths between them is drawn by
    hand-written igraph plot code or rebuilt in Gephi or Cytoscape. Wet-lab collaborators then screen the top 10 to 100
    drugs.
characteristics:
    expertise: expert
    time_pressure: low
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Rank approved drugs for a disease by network proximity with a defensible null model
    - Show that a disease's genes form a significant module before building on it
    - Produce a figure of the top drugs' targets, the disease module and the shortest paths between them
    - Hand wet-lab collaborators a short, justified list to screen
    - Publish with every parameter (interactome version, seed list, ID mapping, null model, randomizations, random seed) reproducible
behaviors:
    - Merges physical interaction sources (IntAct, BioGRID, HPRD, CORUM) into one undirected interactome and keeps the largest component
    - Maps every gene and drug-target identifier into the interactome's ID space and drops what does not map
    - Computes closest-distance proximity and 1,000 degree-binned random draws per drug-disease pair, reporting z <= -2 (or z < -1.5 with p < 0.05) as significant
    - Tests largest-component significance of a disease gene set against random sets of equal size, then grows the module with DIAMOnD for about 200 iterations
    - Validates rankings by AUC against known indications and accepts that no single pipeline wins (best AUC about 0.63 in a 918-drug screen)
    - Computes drug-pair separation to judge combinations that hit the module from separate neighborhoods
    - Cuts a 20 to 300 node result subnetwork out of the interactome and draws it with seeds, added proteins and drug targets in different shapes
    - Publishes supplementary CSV or XLSX tables of drugs with z and p, plus a GitHub repository
goals:
    - Ranked drug table with proximity z-scores for one or more diseases
    - Module figure with drug targets and connecting shortest paths
    - Validation figure (AUC against known indications)
    - Reproducible parameter record for the methods section
frustrations:
    - The interactome is roughly 80 percent incomplete, so modules are partial and results depend on the null model
    - Analysis and visualization are split; NetMedPy states that visualization happens outside the tool
    - No tool loads a node set, per-node scores and path sets onto a large base graph and draws only that part
    - Identifier mapping silently drops genes with no report of what was lost
    - Figures are hand-coded with every encoding written by hand and nothing saved for the next run
    - Existing tools present "find the hub" centrality as the target-finding method, which the field moved away from
