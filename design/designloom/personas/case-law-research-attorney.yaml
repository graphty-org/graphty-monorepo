id: case-law-research-attorney
name: Case-Law Research Attorney
roster_persona: legal-citation-network-scholar
tier: B
scope: in-scope
role: Litigation Associate or Law Firm Research Librarian
quote: Show me which of these cases the higher courts rely on, and whether anyone has turned against them since.
bio: >-
    Owen is a litigation associate who researches case law in Lexis and Westlaw. After a case search he sometimes
    switches the result list to a citation map: the top results placed by decision date and by court, with the
    Supreme Court at the top and lower federal and state courts below, circles sized by how often each case is cited,
    and lines between cases colored by positive or negative treatment. He hovers a line to read the citing sentence,
    clicks a central case to move it to the top of the list, and then reads the cases. For one case he checks the
    graphical direct history of its appeals. He does not build or export the graph; the map is a way to decide what
    to read first. Evidence for this persona is weak: it rests on the products, not on any account of how often
    attorneys open the map.
characteristics:
    expertise: novice
    time_pressure: high
    graph_literacy: low
    domain_knowledge: expert
motivations:
    - Find the controlling and most-relied-on cases in a search result quickly
    - See which court decided each case and when
    - Spot negative treatment before citing a case
    - Decide what to read first
behaviors:
    - Opens the citation map from a case search result, not as the default view
    - Reads the vertical position as court level and the horizontal position as time
    - Treats larger circles as more-cited cases
    - Hovers a citation line to read the citing language
    - Checks a case's appellate history in a graphical view
frustrations:
    - The map covers only the top results of the search
    - Treatment colors alone do not say why a later court disagreed
    - No way to keep or share the map with the rest of the case team
context:
    frequency: occasional
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W2038
sources:
    - title: LexisNexis launches Ravel View in Lexis Advance (2018)
      url: https://www.lexisnexis.com/community/pressroom/b/news/posts/lexisnexis-launches-data-visualization-to-enhance-its-flagship-online-legal-research-platform-lexis-advance
      summary: Top 75 results; circle size by citations; Supreme Court at the top of the vertical axis; Shepard's treatment colors; cases mapped across time
    - title: Thomson Reuters - Access KeyCite for cases
      url: https://www.thomsonreuters.com/en-us/help/westlaw-precision/tools/access-keycite-for-cases
      summary: Direct history in a graphical view beside the list of linked documents (search excerpt)
    - title: Neale, Citation Analysis of Canadian Case Law (2013)
      url: https://ojs.law.cornell.edu/index.php/joal/article/view/20
      summary: In-degree and PageRank predict how often a case is viewed on CanLII
