id: chinese-prosopography-historian
name: Chinese Prosopography Historian
roster_persona: digital-humanist
tier: B
scope: in-scope
role: Historian of Song-Dynasty Officials Using the China Biographical Database
quote: I pull five thousand officials out of half a million people, and I need their kin network and their patronage network side by side on a map of prefectures.
bio: >-
    Dr. Wen Li studies how marriage and patronage shaped the careers of Song-dynasty officials. She downloads the China
    Biographical Database (CBDB) as a standalone SQLite file, about 470,000 individuals in 2020 and over 515,000 by
    December 2021, and follows the CBDB user guide to query kinship and social associations by office, period and
    place. Each query extracts 1,000 to 10,000 people: kinship rows coded with normalized kin codes (F, S, D, H, W and
    compounds), social association rows (letters, prefaces, teacher and student) and office postings with dates and
    places. She uses Python (pandas, NetworkX) for joins and metrics and Gephi for pictures. Her analyses depend on
    typed ties: a kin tie and a patronage tie over the same two people mean different things.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: intermediate
    domain_knowledge: expert
motivations:
    - Compare a kinship network with a patronage network over the same people
    - Place both networks on a map of prefectures and follow careers over time
    - Re-run a query for another office or period without rebuilding the styling
    - Trace descent lines and marriage links between official families
behaviors:
    - Writes SQL against the CBDB SQLite file to extract a subnetwork by office, period and place
    - Normalizes raw kinship relations to basic kin terms before rebuilding families
    - Keeps kin, social and office ties as separately typed edges and filters by type
    - Exports to CSV, computes metrics in NetworkX, and draws in Gephi
frustrations:
    - Raw kinship links do not form a clean tree until relations are normalized
    - Every new query means a new export and a re-styled graph
    - Tools treat kin and social ties as untyped edges
    - Maps of the network need separate GIS work
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W176
    - W177
    - W183
