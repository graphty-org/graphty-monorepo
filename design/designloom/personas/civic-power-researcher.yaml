    - title: Commons Library - Power mapping
      url: https://commonslibrary.org/power-mapping/
      summary: Paper-first power mapping and influence-against-alignment placement
    - title: LittleSis - Map the Power
      url: https://littlesis.org/news-topics/map-the-power
      summary: Public-records research training for organizers (2017)
    - title: littlesis-rails README and relationship model
      url: https://github.com/public-accountability/littlesis-rails
      summary: Over 1.6 million relationships among over 400 thousand people and organizations; 12 relationship categories
    - title: Oligrapher workshop notes
      url: https://influencemapping.github.io/workshop/oligrapher.html
      summary: Oligrapher map building and story mode walk-throughs
    - title: Networks of Dispossession - interview (suburban)
      url: https://zeitschrift-suburban.de/sys/index.php/suburban/article/download/169/294?inline=1
      summary: Graph Commons map of 737 companies, 44 government institutions, 43 media firms, 726 projects; maps are not pure data; a public source for every item
    - title: Graph Commons API
      url: https://graphcommons.github.io/api-v1
      summary: Edges name endpoints by name and type; missing nodes created; one edge per type per pair
