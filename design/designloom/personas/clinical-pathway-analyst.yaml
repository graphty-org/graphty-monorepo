sources:
    - title: Munoz-Gama et al. 2022 - Process mining for healthcare, characteristics and challenges
      url: https://www.alexandria.unisg.ch/server/api/core/bitstreams/413ecf90-0787-4e40-806d-cfcdc55ec2b7/content
      summary: Healthcare-specific challenges D1-D6 including spaghetti maps, guidelines as prescriptive models, abstraction of codes and clinician involvement
    - title: Aversano et al. 2025 - healthcare process mining review
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11784703/
      summary: 53 studies; Disco and ProM most common; events most common case id; under 10 articles on conformance; 70.63 percent ignore privacy
    - title: Dallagassa et al. 2022 - systematic mapping of process mining in healthcare
      url: https://link.springer.com/article/10.1007/s12652-021-02894-7
      summary: 270 healthcare process mining articles selected
    - title: COVID-19 clinical pathways process mining (arXiv 2606.00041)
      url: https://arxiv.org/html/2606.00041v1
      summary: Six EHR tables joined for 4,479 patients; consolidated activity labels; timestamp imputation rules; Declare constraints
    - title: MIMICEL - event log from MIMIC-IV-ED
      url: https://arxiv.org/html/2505.19389v1
      summary: ED stays as cases built from six tables with PostgreSQL scripts; triage timestamp set to arrival plus 1 second
    - title: bupaR documentation - frequency maps
      url: https://bupaverse.github.io/docs/frequency_maps.html
      summary: process_map with frequency and performance types, relative-case frequencies
    - title: ED patient flow study (arXiv 2609.32010)
      url: https://arxiv.org/pdf/2609.32010
      summary: 1,754 clean cases with 884 variants; top 10 variants cover 21.3 percent
