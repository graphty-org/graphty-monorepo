id: clinical-pathway-analyst
name: Clinical Pathway Analyst
roster_persona: process-mining-analyst
tier: A
scope: in-scope
role: Health Services Researcher / Hospital Quality Improvement Analyst
quote: Clinicians will not read a spaghetti map. Show them where patients wait and where we leave the guideline, and the data never leaves the hospital.
bio: >-
    Dr. Okafor is a health services researcher in a hospital quality improvement unit. She works in R with bupaR
    (processmapR for maps, processanimateR for animations), with Disco when a clinician wants to click around, and
    occasionally with PM4Py. Her data is an extract from the electronic health record: admissions, triage, diagnoses,
    vitals, labs and medications in separate tables, joined by patient id and time. Timestamps are imprecise, entered
    late or date-only, and hundreds of distinct codes must be abstracted into a manageable set of activities. She works
    with clinicians and nurses throughout, because healthcare process mining guidance treats their involvement as
    essential. Her questions are where patients wait, which pathways deviate from a clinical guideline, and what a
    protocol change did. Healthcare is a small but well-studied niche: one systematic mapping study selected 270
    healthcare process mining articles, and a 2025 review found Disco and ProM the most common tools.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: expert
motivations:
    - Find where patients wait in the emergency department and between wards
    - Check pathways against clinical guidelines and protocols
    - Measure the effect of a protocol change with a before and after comparison
    - Give clinicians a map and an animation they can validate and act on
    - Publish reproducible results without moving patient data off the hospital network
behaviors:
    - Joins several EHR tables through patient identifiers and timestamps into one event log
    - Builds a consolidated activity label set from SNOMED CT or ICD-10 codes and raw record types
    - Chooses the case notion explicitly (episode, ED stay or patient) and documents it
    - Imputes missing or hour-less timestamps from the nearest clinically reliable timestamp only when that restores plausibility, and flags identical timestamps
    - Removes cases with broken boundaries or implausible durations before discovery and reports how many were dropped
    - Draws a process map with case frequency on nodes and mean durations on edges, filtering to the most frequent traces
    - Animates the log in relative mode for clinicians
    - Writes guideline rules (for example monitoring before discharge) as constraints and checks the log against them
frustrations:
    - Spaghetti maps from high clinical variability; hundreds of variants for a few thousand patients
    - Date-only and late-registered timestamps that create false orderings and ties
    - Credentialed data that cannot be uploaded to a cloud tool
    - Few tools that check conformance to a guideline; under 10 articles in a 2025 review addressed it
    - Static images from Python libraries that clinicians cannot explore
    - Privacy left unaddressed in most of the literature (70.63 percent of reviewed studies)
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
