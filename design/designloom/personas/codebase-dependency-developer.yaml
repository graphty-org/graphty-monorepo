    - title: npm download counts, madge, week of 2026-11-18 to 2026-11-24
      url: https://api.npmjs.org/downloads/point/last-week/madge
      summary: 4,252,575 downloads
    - title: npm download counts, nx, week of 2026-11-18 to 2026-11-24
      url: https://api.npmjs.org/downloads/point/last-week/nx
      summary: 15,892,176 downloads
    - title: dependency-cruiser - command line interface
      url: https://github.com/sverweij/dependency-cruiser/blob/main/doc/cli.md
      summary: err reporter exits with the number of error violations; ddot, archi, mermaid, d2 and json output; --focus, --reaches, --affected, --highlight, --collapse; --baseline (shrink-only mode) and --ignore-known
    - title: madge
      url: https://github.com/pahen/madge
      summary: --circular lists circular imports; --image draws the graph with circular modules in red; --depends lists dependents
    - title: Nx - Explore your workspace
      url: https://nx.dev/docs/features/explore-graph
      summary: nx graph, --focus, --file JSON export, nx affected --graph; "Viewing the entire graph can be unmanageable even for smaller repositories"
    - title: Nx - Enforce module boundaries
      url: https://nx.dev/docs/features/enforce-module-boundaries
      summary: Project tags and depConstraints; a violation is a lint error
    - title: ArchUnit user guide
      url: https://www.archunit.org/userguide/html/000_Index.html
      summary: slices().should().beFreeOfCycles(), layeredArchitecture(); FreezingArchRule records existing violations so only new ones are reported
    - title: Import Linter - Interactive UI
      url: https://import-linter.readthedocs.io/en/stable/ui/
      summary: Browser view of a package's children with drill-down, import totals, module counts and cycle breakers; drawgraph writes DOT
    - title: Import Linter - Contract types
      url: https://import-linter.readthedocs.io/en/stable/contract_types/
      summary: Forbidden, layers, independence and acyclic-siblings contracts
    - title: Bazel - Query guide
      url: https://bazel.build/query/guide
      summary: rdeps for reverse dependencies within a universe; for a big graph, start with a single path
