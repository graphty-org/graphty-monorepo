      url: https://dspace.stir.ac.uk/retrieve/f1292af1-5cdb-400b-820a-bccae8f82e1f/NodeXL%20-%20a%20guide%20to%20network%20insights%20-%20Author%20Version.pdf
      summary: Recipe files, betweenness ranking, re-collection, anonymization and data-sharing practice of NodeXL scholars
    - title: Himelboim et al. - Classifying Twitter Topic Networks Using Social Network Analysis
      url: https://www.academia.edu/72459287/Classifying_Twitter_Topic_Networks_Using_Social_Network_Analysis
