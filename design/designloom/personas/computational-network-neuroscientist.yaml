sources:
    - title: nilearn view_connectome reference
      url: https://nilearn.github.io/dev/modules/generated/nilearn.plotting.view_connectome.html
      summary: Interactive browser 3D connectome from a matrix and coordinates, saved as standalone HTML
    - title: NetPlotBrain paper
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10312269/
      summary: Named TemplateFlow templates, view grids and circles, spheres and parcels node styles; no GIfTI or CIFTI yet
    - title: NeuroCave paper (arXiv)
      url: https://arxiv.org/pdf/1706.10297
      summary: Survey of connectome tools and visual clutter; NeuroCave itself opens two synchronized side-by-side views
    - title: NeuroCave full text (Network Neuroscience 2018)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6145855/
      summary: Default of two side-by-side views with synchronized node selection and edge display; web app loading per-subject matrices, topology files and an index file; no scripting interface described
    - title: NeuroMArVL
      url: https://immersive.erc.monash.edu/neuromarvl/
      summary: Web viewer with anatomical and topological projections from uploaded coordinates, matrix and attributes files; no scripting interface described
    - title: Betzel et al. 2019, Distance-dependent consensus thresholds for group-representative structural brain networks
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6444521/
      summary: Uniform consensus loses long connections; binning by fiber length keeps them
    - title: netneurotools consensus clustering example
      url: https://netneurotools.readthedocs.io/en/latest/auto_examples/plot_consensus_clustering.html
      summary: Repeated Louvain, agreement matrix and consensus partition
    - title: brainconn weight_conversion reference
      url: https://brainconn.readthedocs.io/en/latest/generated/brainconn.utils.matrix.weight_conversion.html
      summary: Converting weights to lengths before path-based metrics
    - title: UK Biobank imaging at FMRIB
      url: https://www.fmrib.ox.ac.uk/ukbiobank/
      summary: Group ICA from more than 4,000 participants; connectivity stored as upper triangles
