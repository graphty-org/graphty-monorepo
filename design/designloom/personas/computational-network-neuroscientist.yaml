id: computational-network-neuroscientist
name: Computational Network Neuroscientist
roster_persona: network-neuroscientist
tier: B
scope: in-scope
role: Research Scientist or Junior PI / Network Neuroscience Methods
quote: A dense 3D connectome is a hairball in a skull. I need the anatomical view and the topological view side by side, and the same colors in both.
bio: >-
    Dr. Ngozi Okafor develops network methods for brain data -- null models, consensus networks, community detection,
    multilayer dynamics -- and applies them to large open datasets such as the Human Connectome Project and UK
    Biobank. She works in Python and Jupyter: nilearn for connectivity matrices, atlas centroids and glass-brain
    plots, bctpy and netneurotools for metrics and consensus clustering, GenLouvain for multilayer modularity,
    NetworkX for anything else, netplotbrain for scripted multi-panel figures, Connectome Workbench for CIFTI
    surfaces, and MRtrix or QSIPrep when she needs structural connectomes. Her data spans hundreds to tens of
    thousands of subjects at several parcellation resolutions (Schaefer 100 to 1,000 regions, Glasser 360), with a
    fiber-length matrix alongside each structural weight matrix and sliding-window stacks for dynamics. She is fluent
    in graph theory and statistics and writes every figure as reproducible code. Web viewers such as NeuroCave and
    NeuroMArVL link anatomical and topological views, but they load their own files and offer no scripting, so
    nothing in her Python workflow keeps anatomy, topology and the matrix in step.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Build group-representative structural networks that keep long-range connections
    - Find modules that are stable across repeated runs and resolution parameters, and name hub roles from them
    - Compare two connectomes (two groups, two atlases, structure versus function) with linked views
    - Keep every figure reproducible from code with named templates and saved settings
    - Share an interactive 3D view with co-authors who do not run Python
behaviors:
    - Computes atlas centroids from a NIfTI label image and joins network and hemisphere labels from the atlas TSV
    - Runs Louvain hundreds of times, builds an agreement matrix, re-clusters it and sweeps the resolution gamma
    - Computes participation coefficient, within-module degree z-score and rich club against degree-preserving null networks
    - Converts weights to lengths before path-based metrics and keeps weighted efficiency inputs in the 0 to 1 range
    - Reorders the matrix heatmap by module or network with block outlines as the first sanity check
    - Saves interactive 3D views as standalone HTML and static multi-view grids (for example lateral, superior, right) for papers
    - Repeats analyses across atlases and thresholds as a robustness check
frustrations:
    - Visual clutter of dense 3D node-link drawings
    - Linked anatomical and topological views and synchronized two-connectome views exist only in separate web viewers (NeuroCave, NeuroMArVL) that take their own input files and have no scripting interface, so results from her notebooks must be exported to them by hand
    - Coordinates and background brain in different templates, with nothing that names the template to catch the mismatch
    - Figure libraries that cannot render GIfTI or CIFTI surfaces
    - Parcel names are not kept in CIFTI pconn files, so the matching dlabel file must travel with every matrix
    - Uniform consensus thresholds under-represent long connections in group structural networks
