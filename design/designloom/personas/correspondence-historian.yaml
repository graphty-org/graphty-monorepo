sources:
    - title: Programming Historian - From Hermeneutics to Data to Networks (Duering)
      url: https://programminghistorian.org/en/lessons/creating-network-diagrams-from-historical-sources
      summary: Coding a tie from sources, one spreadsheet for storage and a copy for visualization, Palladio network and caveats about layouts
    - title: Conroy, DHQ 2021, on Palladio
      url: https://dhq.digitalhumanities.org/vol/15/1/000534/000534.html
      summary: Data cannot be edited within Palladio; typos create duplicate nodes
    - title: Harvard histecon - Visualizing historical networks
      url: https://histecon.fas.harvard.edu/visualizing/index.html
      summary: Gephi keeps one edge per pair, forcing separate graphs or weights for parallel letters
    - title: Martin Grandjean - Gephi introduction
      url: https://www.martingrandjean.ch/gephi-introduction
      summary: Letters exercise in Gephi, GeoLayout and finishing the figure over a map in Inkscape
    - title: Leiden DMT - SNA exercises
      url: https://bookandbyte.universiteitleiden.nl/DMT/SNA/sna-exercises.php
      summary: Palladio then Gephi exercise sequence taught to humanities students
    - title: EMLO - About
      url: https://emlo.bodleian.ox.ac.uk/about
      summary: Union catalog of early modern letters used to look up correspondence
    - title: Hartlib papers record counts (Reviews in History)
      url: https://reviews.history.ac.uk/review/1316
      summary: Scale of a single scholarly correspondence catalog (about 4,585 letters)
    - title: Searching for missing links in the Republic of Letters (Vossius and Hartlib)
      url: https://www.ebsco.com/articles/history/43254ed7-1de2-5d0c-81bb-f9002abf19b2/searching-for-missing-links-in-the-republic-of-letters-vossius-and-the-dutch-dimension-of-hartlib-s-circle
      summary: Shared-correspondent analysis used to direct archival search
