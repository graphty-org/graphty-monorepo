id: crime-intelligence-analyst
name: Crime Intelligence Analyst
roster_persona: intelligence-analyst
tier: A
scope: in-scope
role: Criminal Intelligence Analyst, County Sheriff's Office or State Police
quote: Give me every carrier's records in one chart, tell me which numbers two of my suspects both called, and keep my layout when the next warrant return comes in.
bio: >-
    Marisol Ruiz has been a criminal intelligence analyst for four years in a large county sheriff's office, modeled on the
    Harris County unit that sifts "tens of millions of data points" down to a chart of about a hundred people. She does
    not own cases; she serves detectives, task-force officers and prosecutors who bring her warrant returns and ask
    "who is this number, who else is in the crew, was he there". Her day is call detail records (CDRs) from several
    carriers, each with its own columns, time zone and carrier key; tower dumps; license plate reader (ALPR) reads; jail
    call logs (one year of a gang's outbound calls was about 600,000 nodes); Cash App and Zelle returns; provider returns
    from Meta, Google and Snap; adult service ads; and the gang database. She cleans everything in Excel, imports it into
    i2 Analyst's Notebook through saved import specifications (one per carrier), and pulls records-management (RMS)
    data with SQL. She knows degree and "who sits between the sets" from i2's SNA feature and a vendor course, but she
    is not a graph theorist. She hands off charts to detectives in the free i2 Chart Reader and may have to testify
    about how she built them.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Find the phone, vehicle or account that ties a suspect to a scene
    - Find the "shot caller" and the people who bridge rival sets or crews
    - Turn a pile of warrant returns into a short list of numbers for detectives to subpoena next
    - Produce charts a prosecutor can put in front of a jury and that she can defend on the stand
    - Keep a case chart current as pen-register and warrant data keep arriving
behaviors:
    - Requests the carrier's CDR reference document (carrier key) and cell-site list with every warrant return
    - Normalizes phone numbers (country and dialling codes) and time zones in Excel before import, because carriers mix device, switch, central and UTC times
    - Keeps one saved i2 import specification per carrier in a shared workgroup folder
    - Imports calls with Directed link multiplicity so each pair shows one line per direction labeled with a call count and summed duration
    - Looks for numbers called by two or more subjects and for contacts that appear on two or more seized phones
    - Hides one-off contacts and filters to a window around the offense, then opens a single pair to see each call
    - Intersects tower dumps from several scenes to find the few numbers present at all of them
    - Runs convoy analysis on ALPR reads to find vehicles traveling with a target vehicle
    - Builds a theme-line timeline next to the association chart for every major case
    - Grades intelligence items and draws confirmed links solid and suspected links dotted
    - Deconflicts subjects through several agency systems many times a day before an operation
frustrations:
    - 'Built-in link views in RMS and jail systems weight every link the same: "You cannot group them up by crime-type, region, or gang"'
    - Every carrier's records arrive in a different layout and time zone and must be fixed by hand
    - i2 charts lag on large data, cost thousands of dollars a seat a year and take months to learn
    - Re-importing new records risks losing the hand layout and notes on a chart detectives already know
    - Contact names for the same person differ on every seized phone, so the same person appears several times
    - Sometimes the analysis goes nowhere after days of cleaning
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
