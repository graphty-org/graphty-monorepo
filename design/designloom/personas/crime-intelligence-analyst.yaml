      summary: i2 PatternTracer took up to 100,000 telephone records at a time
    - title: i2 Analyst's Notebook 9.4 - Setting the link direction
      url: https://docs.i2group.com/anb/9.4.0/setting_the_link_direction.html
      summary: One direction for all links or read from a column whose values must be transformed
