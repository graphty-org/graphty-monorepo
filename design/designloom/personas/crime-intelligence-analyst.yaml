    - title: IACA 2024 Virtual Conference - Social Network Analysis (Harris County)
      url: https://iaca.net/assets/Training-Files/Webinars/VirtualConferences/2024VirtualConference/2024%20IACA%20SNA%20Bush.pdf
      summary: Harris County analyst's funnel from 10M+ records to about 100 nodes, jail-call networks of 600K nodes per year, 244.6K ads linked by 13,336 phone numbers, and the complaint that operational systems weight all links equally
    - title: Missouri State Highway Patrol - Criminal Intelligence Analyst I job description
      url: https://www.machs.mo.gov/MSHPWeb/PatrolDivisions/HRD/Civilian/CivilianJobDescriptions/documents/CriminalIntelligenceAnalystI-DDCC-TAU.pdf
      summary: Daily deconflictions through multiple systems, record analysis to find interrelationships, intelligence booklets for prosecutors
    - title: SWGDE Recommendations for Cell Site Analysis 17-F-001 v2.0
      url: https://www.swgde.org/wp-content/uploads/2024/06/2023-12-18-SWGDE-Recommendations-for-Cell-Site-Analysis-17-F-001-2.0.pdf
      summary: Carrier keys, cell-site lists, mixed time zones within a single CDR, and verification of plots
    - title: UNODC Criminal Intelligence Manual for Analysts
      url: https://www.azdps.gov/sites/default/files/2023-07/Criminal_Intelligence_Manual_for_Analysts.pdf
      summary: Telephone analysis, association charting, grading systems and charting conventions taught to analysts
    - title: Law Enforcement Analytic Standards, 2nd edition
      url: https://www.azdps.gov/sites/default/files/2023-07/Law_Enforcement_Analytic_Standards_2nd_edition.pdf
      summary: Analysts must be able to testify as fact, summary and expert witnesses; source attribution and grading
    - title: SelectHub - i2 Analyst's Notebook reviews
      url: https://www.selecthub.com/p/data-visualization-tools/i2-analyst-s-notebook/
      summary: Price from about $7,160 a year, learning curve and lag on large data reported by users
    - title: i2 Analyst's Notebook product sheet
      url: https://i2group.com/hubfs/Products/i2-Analysts-Notebook.pdf
      summary: Over 2,000 organizations and 4,500+ users in 140+ countries; redaction and Chart Reader for sharing
