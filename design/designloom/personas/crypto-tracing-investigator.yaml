id: crypto-tracing-investigator
name: Cryptocurrency Tracing Investigator
role: Special Agent or Civilian Investigator, Federal Tax or Cyber Unit
quote: Start at the ransom address, follow the money hop by hop until it lands in an exchange, and show the jury how much went down each branch.
bio: >-
    Kevin Osei is a cryptocurrency tracing investigator in a federal tax or cyber unit (the kind of team at IRS Criminal
    Investigation, the FBI, HSI, Europol or a national cyber unit). He came from accounting and holds a vendor
    certification. He traces ransomware payments, darknet-market and scam proceeds, sanctions evasion and thefts. His
    seeds are a ransom note's payment address, a victim's outgoing transaction, or an address found on a seized device
    or in exchange records. He works in server-backed tools -- Chainalysis Reactor or TRM Forensics (agencies often hold
    more than one), block explorers, and the open-source GraphSense where licensing or openness matters, sometimes
    through Maltego with the INTERPOL GraphSense transform -- because the ledger is far too large to import. Nodes are
    clusters of addresses the vendor believes one party controls, labeled by attribution tags. When the trail reaches an
    exchange he serves legal process for the account holder's identity, then moves that identity to the i2 case chart.
    His graphs end up in affidavits and at trial, where the defense attacks the clustering heuristics.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Follow funds from the first deposit to the final cash-out
    - Find the exchange where funds were cashed out and serve legal process there
    - Seize what remains before it moves again
    - Present a flow graph in court that shows how much traced value went down each branch
    - Defend every attribution and clustering step under a Daubert challenge
behaviors:
    - Looks up the cluster and attribution tags for every seed address before expanding
    - Expands hop by hop forward or backward from a seed rather than loading the whole ledger
    - Restricts expansion by amount and time to keep the graph readable
    - Follows peel chains by finding the change output at each step
    - Tracks funds across tokens and bridges in one graph, dimming assets that are not relevant
    - Adds off-chain identities (exchange KYC returns, bank accounts, documents) to the graph or to the case chart
    - Records which clustering heuristic produced each attribution for court
frustrations:
    - 'Graphs become unreadable: one wash-trading graph was "a veritable Christmas tree of multicolor types of transactions"'
    - Defense attacks on clustering heuristics as "junk science"
    - Heuristic clusters can be wrong, and the tool does not always say which heuristic made them
    - The trace lives on a vendor server and must be re-drawn in another tool for the case chart
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
workflows:
    - W103
    - W105
sources:
    - title: Chainalysis Reactor product page
      url: https://www.chainalysis.com/chainalysis-reactor/
      summary: Follow funds from first deposit to final cash-out; labeled service clusters; add financial entities and documents to the graph
    - title: Chainalysis - Cross-chain investigations
      url: https://www.chainalysis.com/blog/cross-chain-investigations/
      summary: Every case-relevant token in a single graph with an asset selector that dims other clusters
    - title: TRM Forensics
      url: https://www.trmlabs.com/forensics
      summary: Follow UTXO transactions forward or backward with a single click; shows which clustering heuristic is used (search excerpt)
    - title: GraphSense
      url: http://graphsense.org/
      summary: Open-source analytics with transaction traversal, path search between two nodes, and TagPacks for attribution
    - title: INTERPOL GraphSense Maltego transform
      url: https://www.github.com/INTERPOL-Innovation-Centre/GraphSense-Maltego-transform
      summary: To Cluster and To Tags transforms used by investigators inside Maltego
    - title: Stout - Judicial scrutiny of Chainalysis (United States v. Sterlingov)
      url: https://www.stout.com/en/insights/article/judicial-scrutiny-chainalysis
      summary: Co-spend heuristic, over 900,000 addresses attributed to Bitcoin Fog, admissibility after Daubert hearings, defense "junk science" attack
    - title: The Block - New tech streamlines investigations into illicit crypto use
      url: https://www.theblock.co/news/business/2022-05-19-new-tech-streamlines-investigations-into-illicit-crypto-use-chainalysis-147856
      summary: Reactor wash-trading graph described as a Christmas tree of multicolor transactions
    - title: Haslhofer and Meiklejohn 2022 - Cryptocurrency forensics
      url: https://arxiv.org/abs/2205.13882
      summary: Change heuristic and peel chains, and their error modes
