id: cybersecurity-analyst
name: Cybersecurity Threat Hunter
role: Threat Hunter / Security Data Scientist
quote: My hypothesis is a sentence. My data is a SIEM table with ten million rows. I need to get from one to the other as a graph I can query, aggregate and click through to raw events.
bio: >-
    The threat hunter started as a SOC analyst triaging alerts and moved into hypothesis-driven hunting and detection
    engineering. Unlike the alert-driven SOC, the hunter starts from a hypothesis drawn from threat intelligence or an
    ATT&CK technique ("an account is authenticating to many hosts it never used before"), writes the query in KQL or
    SPL, and turns the result table into a graph: entity columns (accounts, hosts, processes, IPs) become nodes and
    each event links the entities it mentions. Ad hoc hunts run in Graphistry from a notebook or a Splunk workflow
    action; Microsoft shops use the Defender XDR hunting graph and its predefined path scenarios. Raw event volumes are
    large (the public LANL benchmark alone holds 1.6 billion events over 58 days), so the hunter aggregates to
    host-to-host or account-to-host edges with counts and drills down to raw events from a suspicious edge. Graph
    literacy is operational: typed edges, paths, fan-out and time order matter; centrality appears only in
    target-scoped forms such as choke points, and generic community detection is not a routine step in any source
    found. A positive hunt is handed to incident response; a negative one is documented and its query saved.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Find intrusions that evade rule-based detection before they cause damage
    - Turn a hunt hypothesis into a repeatable query and, when it works, a detection
    - Read millions of events as a small aggregated graph without losing the path back to raw evidence
    - Hand incident response a clear set of entities, edges and times when a hunt hits
    - Document negative hunts so the team does not repeat them
behaviors:
    - Forms a hypothesis from threat intelligence, an ATT&CK technique or an anomaly signal
    - Writes the hunt in KQL or SPL and pulls a result table of thousands to millions of rows
    - Turns the event table into a graph by picking entity columns (account, host, process, IP), as in Graphistry hypergraphs
    - Aggregates raw events into host-to-host or account-to-host edges with counts, first and last seen, and a minimum-weight threshold
    - Uses Defender XDR hunting graph scenarios with source and target property filters, edge types and direction, and "Show only the shortest paths"
    - Looks for fan-out, first-seen pairs, rare edges and logon chains rather than global centrality
    - Clicks through from an aggregated edge to the raw events behind it
    - Saves parameterized hunt queries and shares them as templates and Splunk workflow actions
goals:
    - Hunt for threats by turning hypotheses into graph queries over SIEM and EDR data
    - Aggregate high-volume telemetry into readable entity graphs with drill-down
    - Hand confirmed findings to incident response with the evidence attached
    - Build a library of reusable hunt queries and templates
frustrations:
    - SIEM tools return tables, so every graph hunt starts with reshaping columns into entities and edges
    - Correlating events across sources whose field names differ
    - Aggregated views lose the link back to raw events unless the tool keeps it
    - Translating an ATT&CK technique into a graph pattern takes expertise and trial and error
    - Large hunts need a GPU server or notebook environment that tier-1 colleagues cannot use
context:
    frequency: weekly
    devices:
        - desktop
    voluntary: true
workflows:
    - W07
    - W12
    - W109
    - W113
    - W336
