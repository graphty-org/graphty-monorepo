id: eeg-meg-connectivity-researcher
name: EEG/MEG Connectivity Researcher
roster_persona: network-neuroscientist
tier: B
scope: in-scope
role: Cognitive or Clinical Neurophysiology Researcher
quote: One figure is one slice of subjects by conditions by methods by frequency bands. I need to move along any of those axes without rebuilding the plot.
bio: >-
    Dr. Zoltan Varga records 30 to 256 channel EEG or whole-head MEG and studies how brain rhythms couple between
    regions in cognition and in clinical groups. He works in MNE-Python with mne-connectivity, and opens Brainstorm,
    FieldTrip or EEGLAB plugins when a colleague's pipeline lives there. His data is not one matrix but a stack:
    subjects x conditions x frequency bands (or every frequency bin) x connectivity methods, and for time-resolved
    measures x windows, each cell an N x N matrix over sensors at electrode or helmet positions, or over source
    regions such as the 68 Desikan-Killiany labels. Measures are undirected (coherence, PLV, PLI, wPLI, ciPLV,
    amplitude envelope correlation) or directed (Granger, spectral Granger, phase transfer entropy). He is an expert
    in signal processing and statistics, comfortable with graph metrics, and wary of volume conduction artifacts.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Compare band-specific networks between groups or conditions
    - Avoid volume conduction and field spread artifacts by working at source level and with leakage-robust measures
    - Avoid threshold bias, for example with minimum spanning trees or percentile thresholds
    - Show several methods, bands or conditions side by side as small multiples for one figure
    - Click a connection and see how its value varies across frequency
behaviors:
    - Decides between sensor and source level first, and between all-pairs, seed (one region against all) or two-list patterns
    - Epochs with artifact rejection and computes several connectivity methods at once over one band or every frequency bin
    - Reduces source space to an atlas parcellation, keeping each label's atlas color for node coloring
    - Keeps only the strongest edges (top 5 percent, or the 300 strongest lines in a circle plot)
    - Orders source labels in a circle by anterior-posterior position with the two hemispheres mirrored
    - Draws sensor-level lines on a 2D scalp layout or 3D MEG helmet, dropping pairs closer than a minimum distance
    - Filters directed graphs by In, Out or Both and shows arrowheads
    - Runs permutation tests between conditions, or cluster-permutation statistics over connection pairs
frustrations:
    - Sensor-level connectivity has limited and ambiguous anatomical interpretation
    - Unconstrained whole-brain source connectomes can reach hundreds of gigabytes per participant and condition
    - Leakage-sensitive measures look reliable because of a few spurious strong edges, while leakage-robust ones show poor test-retest reliability
    - Every band, method or condition multiplies the number of figures to build by hand
    - Plotting functions move between packages (the MNE circle plot moved to mne-connectivity)
