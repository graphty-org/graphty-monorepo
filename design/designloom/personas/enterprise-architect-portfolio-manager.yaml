      url: https://help.ardoq.com/en/articles/44015-getting-started-with-application-rationalization
      summary: Owner and Expert per application; structural complexity score; capabilities at risk; quick wins; Dependency Map, Block Diagram and Timeline before removing anything
    - title: Ardoq - Dependency Map
      url: https://help.ardoq.com/en/articles/44007-dependency-map
      summary: Incoming and outgoing degree sliders; reference chains strictly directional; group by parent and collapse hierarchy; PNG export
    - title: SAP LeanIX - Application Portfolio Management (vendor)
      url: https://www.leanix.net/en/products/application-portfolio-management
      summary: Understand the full impact of retiring an application; see how applications, interfaces and IT components connect
    - title: LeanIX community - Interface provider and consumer
      url: https://community.leanix.net/it-s-all-about-community-7/interface-fact-sheet-category-provider-and-consumer-825
      summary: Provider owns the interface definition; consumers are the applications that invoke it
    - title: Sparx Enterprise Architect - Traceability window
      url: https://sparxsystems.com/enterprise_architect_user_guide/15.1/guidebooks/tools_ea_traceability_window.html
      summary: Lists every relationship an element takes part in, filtered by relationship type, for impact analysis; ArchiMate relationships reported as UML types
