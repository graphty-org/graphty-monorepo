id: event-log-network-builder
name: Event-Log Network Builder
role: Crime or Intelligence Analyst Loading Call Records (also AML and SOC analysts with transaction and connection logs)
quote: Every carrier sends the records in a different layout. I need the same chart out of all of them, by tomorrow's briefing.
bio: >-
    Sgt. Dana Whitfield is a crime and intelligence analyst in a regional police unit. Her raw material is call detail
    records returned by carriers under warrant: one row per call with calling number, called number, start time,
    duration and cell site, thousands to hundreds of thousands of rows per return, and a different column layout from
    every carrier. She reformats each return in Excel, then loads it into i2 Analyst's Notebook through an import
    specification that turns each row into entity-link-entity; sometimes she uses Maltego's table import instead. Her
    questions are who talks to the targets, how often, which contacts they share, and when and where calls happened.
    The chart goes into a case file, so every link has to trace back to a record row. The same pattern holds for an
    anti-money-laundering investigator with bank statements and a security analyst with connection logs.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: expert
motivations:
    - Find who talks to the targets, how often, and which contacts several targets share
    - Load each new return quickly into a saved template instead of rebuilding the mapping
    - Keep every link traceable to the record row it came from, for court
    - Place calls in time and on a map via the cell site
    - Keep legally controlled data on her own machine
behaviors:
    - Reformats each carrier's layout in Excel before import
    - Saves and reuses an import specification per layout, editing it when a carrier changes columns
    - Normalizes phone numbers (country codes, leading zeros, punctuation) with substitution rules before matching
    - Chooses between one link per call and one summarized link per pair with a count
    - Reads link direction from a column that says inbound or outbound and transforms it
    - Joins the carrier's cell-site list on cell id and sector to place calls on a map
    - Checks for self-loops, unmatched numbers and calls that lost an endpoint before charting
frustrations:
    - Each new carrier layout needs a new or edited import specification
    - Phone numbers in several formats break identity matching and split one subscriber into several nodes
    - A spreadsheet with a huge used range of blank cells throws OutOfMemory on import
    - Long text values truncated at 255 characters when imported from Excel
    - Specification files in two formats that cannot be converted into each other
    - Dates that fail to parse silently drop calls out of the timeline
context:
    frequency: daily
    devices:
        - desktop
        - laptop
    voluntary: false
workflows:
    - W18
    - W293
    - W298
    - W299
    - W302
    - W303
