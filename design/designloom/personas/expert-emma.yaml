id: expert-emma
name: Expert Emma
role: Computational Network Scientist (Assistant Professor, Physics or Complex Systems)
quote: Don't give me one number. Give me the run-to-run spread, the null it was compared against, and the seed, or a referee will.
bio: >-
    Dr. Emma Larsen is an assistant professor in physics or complex systems with three PhD students. She publishes on
    community structure, spreading processes and group (higher-order) interactions. She works in code every day:
    graph-tool for stochastic block model inference, rewiring ensembles and motif significance; python-igraph for Leiden;
    NetworkX for prototyping; XGI for hypergraphs; the powerlaw package for tail fitting; EoN or NDlib for epidemic
    simulation. She opens Gephi only to lay out a figure with ForceAtlas2 and finishes it in Inkscape. Her data comes by
    name from Netzschleuder (more than 160,000 network datasets), ICON and SNAP, from XGI-DATA hypergraphs, or from LFR
    and block-model benchmark generators, and ranges from 10^3 to 10^9 edges; she reduces the largest before drawing
    anything. What she needs from a GUI tool is not convenience but method validity and provenance: correct algorithm
    variants, explicit weight semantics, null ensembles, seeds, run-to-run stability and a record of every parameter.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Characterize a network against the right null model before making any headline claim ("scale-free", "small-world", "rich club")
    - Report communities that are statistically supported, not one lucky run of a degenerate objective
    - Know how a process spreads on a network and how fragile the network is to failure and attack
    - Produce a figure that does not mislead a reader about distances, clusters or scale
    - Make every analysis rerunnable by a referee from recorded parameters, versions and seeds
    - Analyze multilayer, two-mode and group data as they are, without silently flattening them to pairs
behaviors:
    - Records what an edge means and decides the representation explicitly (directed or not, weights, parallel edges, layers, projections) before computing anything
    - Fits degree tails by the Clauset-Shalizi-Newman protocol (k_min by Kolmogorov-Smirnov, discrete maximum likelihood, bootstrap p, likelihood-ratio tests against log-normal and cutoff alternatives), never least squares on a log-log histogram
    - Builds 100 to 1000 degree-preserving rewirings and reports observed value, null mean, null standard deviation and z for each statistic
    - Uses Leiden or a nested degree-corrected stochastic block model, never Louvain except to reproduce older work, and sweeps resolution over many seeded runs
    - Compares partitions by normalized mutual information, adjusted Rand or variation of information
    - States the weight convention for every path measure ("betweenness on distances 1/w")
    - Runs many seeded realizations of spreading simulations and removal experiments and plots means with spread
    - Benchmarks new methods on LFR graphs, plotting NMI against the mixing parameter with error bars
    - Puts code, data and seeds in a GitHub or Zenodo repository alongside the paper
goals:
    - Valid methods as the easy path (Leiden default, nulls one click away, correct tail fitting)
    - Seeded, repeatable runs of every stochastic algorithm, with the seed recorded
    - Stability and uncertainty shown, not hidden behind a single partition
    - A provenance record that can be exported with every figure
    - Vector figure export and a handoff back to igraph, NetworkX or graph-tool
frustrations:
    - Louvain partitions that change every run and can be internally disconnected
    - Modularity's exponentially many near-optimal partitions presented as one answer
    - Tools that give one number with no ensemble, null or spread
    - Inconsistent weight conventions between libraries (strength for communities, distance for paths) and silent unweighted path measures in Gephi
    - Gephi silently merging parallel edges on import and recording nothing about what was done
    - Default community settings that return near-singletons (CPM at resolution 1 on an unweighted graph)
    - Hypergraph, multilayer and simulation tools living in separate notebooks from layout and community tools
    - PDF export of large graphs hanging
