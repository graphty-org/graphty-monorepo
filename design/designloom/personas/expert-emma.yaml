sources:
    - title: From Louvain to Leiden - guaranteeing well-connected communities (Traag, Waltman and van Eck 2019)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6435756/
      summary: Louvain yields up to 25% badly connected and up to 16% disconnected communities; Leiden guarantees connected communities and is faster
    - title: Performance of modularity maximization in practical contexts (Good, de Montjoye and Clauset 2010)
      url: https://arxiv.org/abs/0910.0165
      summary: Modularity has exponentially many near-optimal partitions and should be interpreted cautiously in scientific contexts
    - title: Power-law distributions in empirical data (Clauset, Shalizi and Newman 2009)
      url: https://arxiv.org/abs/0706.1062
      summary: The accepted tail-fitting protocol; least squares on log-log histograms is biased
    - title: Scale-free networks are rare (Broido and Clauset 2019)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6399239/
      summary: Across 928 datasets, 49% not scale free, 4% strongest evidence, log-normal fits at least as well for 88%
    - title: graph-tool network collection (Netzschleuder)
      url: https://graph-tool.skewed.de/doc/collection.html
      summary: Datasets fetched by name inside graph-tool, the network scientist's standard data source
    - title: igraph-help thread on weights in path functions (2019)
      url: https://lists.gnu.org/archive/html/igraph-help/2019-10/msg00007.html
      summary: Maintainer states path-based functions read weights as distances and results depend on the transformation chosen
    - title: Gephi Fieldnotes and the reflexive use of Gephi (van Geenen et al. 2023, Frontiers in Big Data)
      url: https://www.frontiersin.org/articles/10.3389/fdata.2022.510310/full
      summary: Gephi cannot record what was done; Fieldnotes plugin built to capture it; over 9,800 citing publications
    - title: Gephi release notes (v0.7.0 parallel-edge merge)
      url: https://github.com/gephi/gephi/releases
      summary: Gephi merges parallel edges on import and by default increases the edge weight
    - title: Postdoctoral posting, Northwestern Center for Network Dynamics
      url: https://cnd.northwestern.edu/?p=673
      summary: Job requirements name complex networks, computational modeling, percolation and spreading
    - title: Gephi bug 808617 - PDF export of large graph hangs
      url: https://bugs.launchpad.net/gephi/+bug/808617
      summary: A 50K-node PDF export stuck at 100%
