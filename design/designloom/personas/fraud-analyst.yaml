id: fraud-analyst
name: Fraud Detection Analyst
role: Bank Fraud and Transaction Monitoring Analyst (Level 1 alert reviewer and receiving-bank mule team), UK or US bank
quote: Is this customer connected to anything we already know is bad? And if a scam payment just landed here, where did it go in the last fifteen minutes?
bio: >-
    Sarah works on the front line of a bank's fraud and financial-crime operations. Most of her day is spent in a vendor
    case queue reviewing alerts that a monitoring scenario raised (cash just under 10,000 dollars, rapid in-and-out wires,
    a new device on an old account): she reads the triggering transactions, compares them with the customer's
    know-your-customer profile, checks the customer's 1 to 2 hop neighborhood for other open alerts, prior cases and
    shared identifiers, and either closes the alert with a written rationale or escalates it to a Level 2 investigator.
    Most alerts are false positives, so her value is speed with a defensible reason. On the bank's receiving-side mule
    team she works the other direction: since October 2024 UK banks share the cost of reimbursing authorised push payment
    scam victims, and when a sending bank reports that a victim's payment landed in one of her customers' accounts she
    seeds the graph with that payment and follows it forward hop by hop, deciding at each account whether to hold, freeze
    or notify the next bank, because in Lloyds data on known mules over half of the value left within an hour. She is
    strong on red flags and Excel, moderately comfortable with "linked", "hops" and "cluster", and does not code.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Close false-positive alerts quickly with a rationale that a quality-control reviewer accepts
    - Escalate the alerts that connect to known-bad customers, accounts or identifiers, with the connection shown
    - Freeze scam proceeds before they leave the bank, and notify the next bank in time
    - Avoid working the same network five times as five separate alerts
behaviors:
    - Starts from the alert in the case queue, not from a graph file; opens the graph only when the alert needs context
    - Looks at the alerted customer's 1 to 2 hop neighborhood, colored by open alert, prior case and prior SAR
    - Checks which identifiers (device, phone, email, address, card, payout account) the customer shares with others and how many accounts share each
    - Discounts identifiers shared by very many accounts (a public Wi-Fi address, a busy branch) instead of treating them as evidence
    - Reads the triggering transactions against the expected activity in the customer profile and a short timeline
    - Writes a close or escalate rationale that names the specific link or transaction that decided it
    - For a reported scam payment, follows only the payments that left after it arrived and up to the amount received, marking each account's hold, freeze or notify decision
frustrations:
    - Most alerts are false positives, and data gathering across separate screens takes most of the time
    - Graph views that open with every neighbor and turn into a hairball
    - Super-connected identifiers that make innocent customers look linked
    - Outbound monitoring tools that do not help with inbound scam money, and notifications that arrive too slowly
    - Nothing she finds in the graph flows into the case rationale; she retypes it
context:
    frequency: daily
    devices:
        - desktop
        - laptop
    voluntary: false
workflows:
    - W01
    - W04
    - W05
    - W06
    - W12
