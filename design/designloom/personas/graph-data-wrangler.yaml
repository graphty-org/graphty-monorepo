      url: https://support.bioconductor.org/p/95965/
      summary: A threshold that is too low produces monstrous files
    - title: Penn networks book - Network data hands-on
      url: http://wonderlab.gse.upenn.edu/networks_book/ch6-network-data-handson.html
      summary: Count repeated replies with groupby before building a graph; DiGraph keeps one edge per pair
    - title: Posit forum - Some vertex names in edge list are not listed in vertex data frame
      url: https://forum.posit.co/t/network-analysis-error-messages-some-vertex-names-in-edge-list-are-not-listed-in-vertex-data-frame/157302
      summary: igraph endpoint matching failure between edge and vertex tables
    - title: Neo4j data ingestion guide - LOAD CSV
      url: https://neo4j.com/docs/data-ingestion-guide/ingestion-methods/load-csv/
      summary: Create uniqueness constraints first, batch with CALL IN TRANSACTIONS, nodes then relationships
    - title: WGCNA - exportNetworkToCytoscape reference
      url: https://search.r-project.org/CRAN/refmans/WGCNA/html/exportNetworkToCytoscape.html
      summary: Matrix to Cytoscape edge and node files with a default threshold of 0.5
