id: graph-deliverable-recipient
name: Graph Deliverable Recipient
role: Non-operator who receives graph deliverables - program officer, executive, prosecutor, compliance reviewer, community partner, editor
quote: I have a minute between meetings and a phone. Tell me the one thing this shows, and tell me whether I'm allowed to forward it.
bio: >-
    Grace Mwangi is a composite of the people who receive graph deliverables but never operate a graph tool: a
    foundation program officer opening a narrated systems map, a chief operating officer reading an organizational
    network readout, a prosecutor reviewing a trial chart, a compliance reviewer checking a suspicious activity case
    file, a community partner of a health department reading a cluster summary, a client reading a penetration test
    report, a newspaper editor checking an embedded graphic. She opens a link on a phone, reads a printed page that is
    often black and white, or uses a screen reader. She has no graph literacy and no time; she needs the message, the
    legend and the caveats on the artifact itself, and she needs to trust that every name she sees is meant for her
    and that nothing hidden ships inside the file. Her tools are a browser (Kumu, Linkurious guest links, VOSviewer
    Online links), PDF readers, i2 Chart Reader and PowerPoint.
characteristics:
    expertise: novice
    time_pressure: high
    graph_literacy: none
    domain_knowledge: intermediate
motivations:
    - Understand the single message of the deliverable in under a minute
    - Know what she may forward, print or show, and to whom
    - Trust that the names and records she sees are meant for her and are backed by sources
    - Read it on whatever she has - a phone, a grayscale printout, a screen reader
    - Get the same view again next month and see what changed
behaviors:
    - Opens a link on a phone or reads a printed copy, rarely a desktop with a mouse
    - Reads titles, captions and legends before looking at the network itself
    - Looks for the finding stated in words (a slide title, a narrative sentence, a table row)
    - Forwards links and PDFs to colleagues without checking what data the file carries
    - Asks the producer for the source behind any surprising element
frustrations:
    - Static exports lose the tooltips that carried the details
    - Color encodings do not survive grayscale printing
    - Dense graphs are unreadable on a phone, where there are no tooltips or hover
    - Node-link diagrams she cannot interpret without an explanation
    - Links that expose more than was meant (whole databases behind guest links, private maps visible to anyone with the link)
    - Deliverables that need the producer's software to open
context:
    frequency: weekly
    devices:
        - mobile
        - laptop
        - desktop
    voluntary: false
