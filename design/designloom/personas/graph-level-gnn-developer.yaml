id: graph-level-gnn-developer
name: Graph-Level GNN Developer
roster_persona: ml-engineer-recsys
tier: none
scope: deferred
role: Machine Learning Scientist / Drug Discovery, Materials or Program Analysis
quote: I have forty thousand molecules and the model gets three hundred wrong. Show me those, one at a time, next to the training molecules that look most like them.
bio: >-
    Petra is a machine learning scientist who predicts a property of a whole graph: is this molecule active or toxic,
    which class is this protein association graph, what does this syntax tree do. Her data is a collection of many small
    graphs, each with its own label and split membership -- ogbg-molhiv has 41,127 molecules averaging about 25 atoms
    and 27 bonds, with a scaffold split that separates molecules by their two-dimensional structural frameworks. She
    turns SMILES strings into graphs with RDKit, trains a GIN or GCN with a pooling readout in PyTorch Geometric or DGL,
    and scores with ROC-AUC. Then she sorts test graphs by error, draws a few dozen in a notebook grid, runs integrated
    gradients or GNNExplainer per graph to get one weight per atom and bond, and colors those weights onto the 2D
    chemical drawing with RDKit's similarity maps -- never onto a force layout, which would scramble rings and functional
    groups. She then compares each error with its nearest training molecules to decide whether it is out of domain or a
    property cliff.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: expert
motivations:
    - Find which test graphs the model gets wrong and why
    - Confirm the model relies on a chemically or structurally meaningful substructure, not an artifact such as a salt fragment
    - Tell out-of-domain errors (no similar training graph) from property cliffs (a near-identical training graph with the opposite label)
    - Decide whether to fix data, featurization or the split
    - Hand chemists a grid figure and a list of compound ids
behaviors:
    - Loads datasets with per-graph labels and splits (PygGraphPropPredDataset, get_idx_split) and keeps per-graph predictions keyed by graph index
    - Sorts and filters test graphs by error, label or scaffold and samples a few dozen into a grid of small drawings
    - Runs an attribution method per chosen graph (Captum integrated gradients, GNNExplainer with task_level="graph")
    - Draws atom and bond weights as color on the 2D chemical structure with fixed chemistry-aware coordinates
    - Finds nearest training graphs by Tanimoto fingerprint distance or learned graph embedding and views them side by side with labels
    - Checks highlighted substructures against known pharmacophores and toxicophores
frustrations:
    - General graph viewers load one graph per document, so browsing a collection happens in a notebook grid of RDKit drawings
    - Force layouts destroy the chemical drawing a chemist reads
    - Summing atom attributions per fragment can mislead because RDKit refills freed valences when a fragment is cut out
    - Distance to the nearest training molecule measures relative uncertainty, not error size
    - Explanation pictures and the dataset's labels and splits live in different places
context:
    frequency: weekly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W273
sources:
    - title: OGB graph property prediction
      url: https://ogb.stanford.edu/docs/graphprop
      summary: ogbg-molhiv (41,127 molecules, scaffold split, ROC-AUC), ogbg-ppa split by species, ogbg-code2 split by project; 9-dimensional atom features
    - title: PyG introduction by example
      url: https://pytorch-geometric.readthedocs.io/en/latest/get_started/introduction.html
      summary: Mini-batches of graphs stored as one block-diagonal graph with a batch vector
    - title: RDKit SimilarityMaps
      url: https://www.rdkit.org/docs/source/rdkit.Chem.Draw.SimilarityMaps.html
      summary: GetSimilarityMapFromWeights draws a molecule colored by per-atom weights
    - title: Attribution on molecular graphs (preprint)
      url: https://arxiv.org/pdf/2610.29589
      summary: Attributions drawn as atom and bond coloring on 2D structures; fragment summation pitfalls from valence refilling
    - title: Uncertainty and distance to training molecules
      url: https://arxiv.org/pdf/2005.10036
      summary: Tanimoto distance to the training set is a metric of relative uncertainty, not of error size
