id: graph-perspective-curator
name: Graph Perspective Curator
role: Graph Solutions Engineer / Data Engineer who prepares views for business users
quote: The analysts keep asking the same six questions. My job is to make each one a search phrase they can run without knowing Cypher.
bio: >-
    Marc Dubois is a data engineer (in other organizations a vendor consultant) responsible for making a graph database
    usable by an investigations or operations team. He does not explore much himself; he builds the views others
    explore. In Neo4j Bloom or Aura Explore he creates perspectives that decide which labels, properties and relationship
    types users see and how they are styled, writes parameterized search phrases and right-click scene actions, maps
    each perspective to a database role, and generates deep links that other systems use to open a search. In
    Linkurious he writes query templates and alert models and shares them with groups. Newer duties include enabling
    natural-language co-pilots, choosing which language model provider may see the schema, and deciding when a
    whole-graph algorithm may write scores back into the database. His users are domain experts who never write a query.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Turn the questions the business keeps asking into one-click, parameterized searches and templates
    - Show users business terms, not raw labels, and hide properties they do not need
    - Prevent accidental writes by users who "may not understand the consequences"
    - Keep scenes small enough to read and fast enough to draw
    - Version and transfer what he built between environments
behaviors:
    - Starts from "Generate Perspective" (quick scan above 10 million elements) and prunes, or from a blank perspective
    - Defines categories in business terms, where the first matching category wins
    - Writes search phrases with typed $parameters and suggestion sources, read-only unless "Write transaction" is set
    - Writes scene actions that run Cypher on the current selection from the right-click menu
    - Grants one custom database role per perspective; in Linkurious shares templates with groups under four rights levels
    - Builds deep links with search=, perspective= and run=true parameters generated by other systems
    - Exports perspectives as JSON for version control
frustrations:
    - '"There isn''t a way to use currently displayed or selected data within the search phrase query"'
    - Generated perspectives include everything and need heavy pruning
    - Rule-based styling sometimes reads a Double property as a String
    - The 10,000-record ceiling on a search phrase
    - Whole-graph algorithm runs write database properties whose names cannot be changed
context:
    frequency: weekly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W145
    - W149
