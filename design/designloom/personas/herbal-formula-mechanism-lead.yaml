sources:
    - title: Zhai et al. 2025, precision network pharmacology (PMC11725223)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11725223
      summary: Argues for measured chemistry and in vivo exposure before prediction; ADME filters ignore abundance, processing and decoction
    - title: Diao et al. 2026, census of network pharmacology results (Frontiers in Pharmacology)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Quercetin key in 63.2% and AKT1 in 48.8% of studies; AKT1 falls from 54.9% to 19.6% with omics integration; recommends in vivo exposure as the primary criterion
    - title: Guanyu Zhixie Granule multi-omics study (PMC11149358)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11149358/
      summary: UPLC-Q-TOF-MS, GEO DEGs, STRING >= 0.9, serum metabolomics and 16S joined to the network, RT-qPCR validation
    - title: Qinghuo Rougan Formula for uveitis (Frontiers in Molecular Biosciences 2025)
      url: https://www.frontiersin.org/journals/molecular-biosciences/articles/10.3389/fmolb.2025.1632027/full
      summary: GEO DEGs, WGCNA module, degree and betweenness cutoffs for six hubs, LASSO with AUC 0.900 to choose among them
    - title: TCMNPAS platform (PMC10958928)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10958928
      summary: R/Shiny constituent lookup, enrichment, network proximity, batch docking, prescription mining and network views
    - title: Xijiao Dihuang Tang serum pharmacochemistry (PMC8845118)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8845118/
      summary: 67 extract peaks and 60 serum constituents feeding a 398-node, 985-edge compound-target network
