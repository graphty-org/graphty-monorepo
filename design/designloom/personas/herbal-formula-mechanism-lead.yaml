id: herbal-formula-mechanism-lead
name: Herbal Formula Mechanism Lead
role: Principal Investigator of a TCM Pharmacology Lab and Attending Physician
quote: Every student's network ends at quercetin and AKT1. Show me which of these compounds we actually measured in serum, and redo everything downstream when the LC-MS list arrives.
bio: >-
    Professor Zhao runs a TCM pharmacology lab at a university hospital, supervises eight graduate students, reviews for
    two journals and has had a computational-only manuscript rejected. He now insists on "precision network
    pharmacology": UPLC-Q-TOF-MS of the decoction and of dosed-animal serum before any target prediction, measured
    disease genes from GEO or the lab's own RNA-seq instead of GeneCards keywords, docking into a known binding site,
    and at least one target validated by western blot or qPCR. His students run the database pipeline; he decides the
    formula, the disease and which hub gets the bench budget. He uses R (limma, WGCNA, glmnet) and TCMNPAS, a
    Shiny platform for constituent lookup, enrichment, network proximity, batch docking and prescription mining. The
    lab also mines hospital prescriptions for a senior physician's core herbs, builds gut microbiome and metabolome
    correlation networks for gut and metabolic disease, and compares the herbs within a formula to explain why they are
    combined. His networks carry measured columns: fold change and adjusted p on targets, detected-or-not on compounds,
    model AUC and Mendelian randomization odds ratios on hubs. He knows the field's homogeneity problem from the
    published census: quercetin is a key compound in 63.2% of studies reporting compounds and AKT1 a key target in
    48.8%, falling to 19.6% when omics data are integrated.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: intermediate
    domain_knowledge: expert
motivations:
    - Show a mechanism specific to his formula rather than the generic quercetin-AKT1-AGE-RAGE result
    - Publish papers that survive Journal of Ethnopharmacology and Phytomedicine review
    - Rerun the analysis when a database updates or when the compound list is replaced by serum data
    - Decide which hub gets the lab's validation budget on measured, not merely predicted, support
    - Rationalize why a formula combines its herbs and which other diseases it could treat
behaviors:
    - Profiles the decoction and dosed-rat serum by UPLC-Q-TOF-MS and feeds only absorbed prototypes and metabolites to target prediction
    - Replaces GeneCards lists with DEGs from GEO (limma, optional ComBat, WGCNA modules) and chooses hubs with LASSO or Mendelian randomization
    - Overlays fold change on targets and detection on compounds, then filters the network to measured-supported paths
    - Adds 16S sequencing and untargeted metabolomics to an animal study and correlates differential taxa with metabolites
    - Compares per-herb compound and target sets and projects target-pathway networks to one-mode for repositioning
    - Has students mine hospital prescriptions into weighted herb co-occurrence networks and extracts the core formula by k-core
    - Asks students to report database versions and access dates after losing a former student's network
frustrations:
    - Students' networks converge on the same compounds, targets and pathways regardless of formula
    - A figure does not show which nodes were measured and which were only listed in a database
    - A former student's network cannot be reproduced because nobody recorded the database version or thresholds
    - He cannot show a reviewer that a high-degree target is not merely a well-studied protein
    - Replacing the compound list with serum data means redoing every downstream network, count and figure by hand
    - LC-MS, GEO, metabolomics and microbiome results are joined to the network by hand in Excel
context:
    frequency: weekly
    devices:
        - desktop
        - laptop
    voluntary: true
