id: insurance-siu-investigator
name: Insurance SIU Investigator
roster_persona: fraud-analyst
tier: A
scope: in-scope
role: Special Investigation Unit (SIU) Investigator, motor insurer (UK, with US differences)
quote: Each detail looks harmless alone. The same garage, the same solicitor and the same payout account across six claims is a crash-for-cash ring.
bio: >-
    Gareth Owen investigates claims for a UK motor insurer's special investigation unit. An automated fraud-scoring engine
    refers claims above a threshold to him; automated tools now make a large share of referrals while SIU staffing barely
    grows. For each referral he switches from the rule-based tool to a link-analysis view (Linkurious on Neo4j, Quantexa,
    SAS or Verisk, depending on the insurer) and expands from the claim to its policies, claimants, drivers, passengers,
    vehicles, addresses, phones, emails, payout accounts, garages, credit-hire firms, solicitors and medical experts, and to
    their other claims. He checks industry data (the Insurance Fraud Register, the Insurance Fraud Bureau hub, the Cifas
    National Fraud Database). He must discount hubs: one busy garage links hundreds of honest claims. He decides whether to
    settle or move the claim to special fraud processing and refers networks to the Insurance Fraud Bureau or the police. His
    US counterpart adds Verisk ClaimSearch and National Insurance Crime Bureau referrals and must report suspected fraud to
    the state fraud bureau.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Decide quickly whether a referred claim is isolated or part of a staged-accident network
    - Stop payment where it is justified without delaying honest claimants
    - Find the other members of a ring, including those whose own claims looked clean and were paid
    - Produce a referral package the fraud bureau, the police or (US) the state insurance department will accept
behaviors:
    - Starts from a referred claim and opens its network of parties, vehicles, contact details and service providers
    - Expands to the parties' other claims and looks for shared addresses, phones, payout accounts, garages, credit-hire firms, solicitors and doctors
    - Treats busy garages and repairers as hubs that need their own check rather than as evidence
    - Checks industry databases and company and credit records for the parties
    - Layers geography for property claims and looks at shared patients for medical claims
    - Records a settle or special-fraud-processing decision and writes the referral
frustrations:
    - Link analysis runs only after referral, so clean-looking ring members are already paid
    - Referral volumes grow while investigator headcount stays flat
    - One shared garage or body shop pulls hundreds of innocent claims into the picture
    - Industry match reports and the claims system live in separate screens
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
workflows:
    - W06
    - W127
