id: intelligence-analyst
name: Intelligence Analyst
roster_persona: intelligence-analyst
tier: A
scope: in-scope
role: Counter-Terrorism and Military Intelligence Analyst
quote: A central figure is not always the leader, and a link chart is a freeze-frame unless I pair it with a timeline.
bio: >-
    Grant spent a decade in military intelligence -- first as an all-source analyst in a brigade and then a division
    intelligence section, then in a targeting cell -- before moving to a civilian counter-terrorism role. He works under
    public doctrine (Army ATP 2-33.4 and FM 3-24) even where his systems are classified. His data is multi-source
    reporting, biometrics, forensics and captured media (DOMEX), personality files, communications metadata, and travel
    and financial records. He builds activities matrices (people by events, organizations and places) and association
    matrices, draws link diagrams with doctrinal shapes and line styles, and asks which entity is central, who bridges
    subgroups, and how interactions changed over time. In targeting he ranks high-value individuals, works out how the
    network would react to losing each, and nominates high-payoff targets to the commander with supporting reporting;
    after an operation he checks what it did to the network's density. His tools are DCGS-A's Axis Pro link diagrams,
    i2 Analyst's Notebook, Palantir Gotham and spreadsheets -- and, when connectivity fails, sticky notes on a
    whiteboard, which doctrine endorses. Every product has to be released in versions for different classification
    levels. (Police crime analysts, trial analysts and cryptocurrency investigators are separate personas.)
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Answer "Which nodes should be targeted for collection or defeat?"
    - Nominate high-value individuals with the supporting reporting attached
    - Predict how the network will react to the loss of each targeted individual
    - Measure what an operation did to the network
    - Brief commanders with charts that separate what is reported from what is judged, with stated confidence
behaviors:
    - Extracts entities and relationships from multi-source intelligence holdings, including biometrics, forensics and DOMEX
    - Builds a two-mode activities matrix (people by organizations, events, addresses and activities) and an association matrix of direct contacts
    - Draws link diagrams with circles for people, rectangles for activities and triangles for facilities, and a line style per activity (money transfers, communications) with a legend
    - Uses degree, betweenness (the broker role) and density, and treats peripheral nodes as links to networks not yet mapped
    - Pairs every link chart with pattern-of-life timelines and time event charts
    - Ranks high-value targets by relative worth and groups the confirmed ones into a high-payoff target list
    - Maps density over time to monitor the effects of operations
    - Releases briefing versions per classification level with ICD 203 likelihood and confidence language
    - Falls back to sticky notes on a whiteboard in environments with intermittent connectivity
goals:
    - Map a threat network's structure, brokers and subgroups
    - Nominate targets for collection or defeat with supporting reporting
    - Anticipate the network's response to the loss of key individuals
    - Assess the effect of operations on the network over time
    - Produce releasable briefing products for decision-makers
frustrations:
    - One person appears under many spellings and selectors across reports
    - Source grades and confidence get lost when a chart is redrawn for a briefing
    - Analysts wrongly assume a central figure is the leader
    - Link charts freeze one moment and hide change over time unless paired with a timeline
    - Producing releasable versions of classified charts by hand
    - No way to attach supporting reports to the node they justify
