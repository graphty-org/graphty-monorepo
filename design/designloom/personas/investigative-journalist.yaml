id: investigative-journalist
name: Investigative Journalist
role: Reporter on a cross-border leaked-records collaboration
quote: Type the minister's name, show me every spelling of it, and tell me how he connects to that shell company in two clicks.
bio: >-
    Daniel Okafor is a reporter on a cross-border investigation of leaked corporate records, like the International
    Consortium of Investigative Journalists' Panama Papers, Paradise Papers and Pandora Papers projects. The Panama
    Papers graph held around 950,000 nodes and 1.2 million edges extracted from 11.5 million files, stored in Neo4j and
    explored through Linkurious (later Bloom inside ICIJ's Datashare). Daniel is not very technical and writes no
    queries. He alternates between full-text document search and the graph: type a politician's or company's name, pick
    among fuzzy-matched variants, expand to officers, intermediaries and addresses, ask for the shortest path between
    two people, and save or embed a small graph in the published story. Everything happens behind private logins with
    two-factor authentication.
characteristics:
    expertise: novice
    time_pressure: high
    graph_literacy: none
    domain_knowledge: advanced
motivations:
    - Find every entity tied to a person of public interest, under all spellings of the name
    - Establish whether and how two people are connected, with evidence he can cite
    - Publish a small, readable graph alongside the story
    - Share leads safely with colleagues in other countries
behaviors:
    - Starts from a name typed in a search box, never from an overview
    - Reviews fuzzy-matched name variants and duplicates before expanding
    - Expands entity to officers, intermediaries and addresses one hop at a time
    - Selects two people and runs shortest path with one click
    - Moves back and forth between the graph and the source documents
    - Saves small visualizations and embeds a graph in the published article
frustrations:
    - Name variants and duplicate entities split one person across several nodes
    - Not knowing what was left out of a capped search or expand result
    - Hubs such as registered-agent addresses connect to tens of thousands of entities
context:
    frequency: as-needed
    devices:
        - laptop
    voluntary: true
workflows:
    - W02
    - W143
sources:
    - title: How ICIJ used Neo4j to unravel the Panama Papers
      url: https://neo4j.com/blog/cypher-and-gql/icij-neo4j-unravel-panama-papers
      summary: About 950,000 nodes and 1.2 million edges from 11.5 million files; Linkurious front end; reporters not tech-savvy; fuzzy search, shortest path
    - title: Neo4j power behind the Paradise Papers
      url: https://neo4j.com/blog/fraud-detection/neo4j-power-behind-paradise-papers/
      summary: ICIJ reused the graph approach for the Paradise Papers
    - title: ICIJ Offshore Leaks database
      url: https://offshoreleaks.icij.org/pages/database
      summary: Public database of more than 810,000 offshore entities, browsed as ego networks
