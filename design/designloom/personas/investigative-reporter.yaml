id: investigative-reporter
name: Investigative Reporter
role: Reporter on an Investigations Desk / Partner Reporter on a Consortium Leak Project
quote: I need the chain from this minister to that shell company, and I need to show my editor the document behind every link.
bio: >-
    Ruth Adler is a reporter on a national investigations desk who joins a cross-border leak project every few years,
    alongside hundreds of partner reporters (Panama Papers had more than 370 journalists in more than 100 media
    organizations; Pandora Papers more than 600). She is fast in spreadsheets and documents, has sat through one
    network-analysis class at a journalism conference (import, Fruchterman-Reingold layout, a range filter and
    betweenness in one session), and does not write SQL or Cypher. Her graphs come from two places: a contacts or
    companies sheet of tens to a few hundred rows that she typed herself, and a consortium graph of about a million
    nodes (officers, entities, intermediaries, addresses) that a small data team built and put behind Linkurious or a
    public database. She uses graph tools in bursts -- weeks of intense work on one project, then nothing for months --
    so every session starts with relearning the tool. What she needs from a graph is not a metric but a defensible
    story: who connects to whom, through which company or nominee, as of which date, and which document proves it.
    Every name she finds is unpublished and legally dangerous until it has passed fact-checking and legal review.
characteristics:
    expertise: novice
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Find the shortest chain of people and companies between two names in her story
    - Batch-check a list of her country's politicians or officials against a leak or registry
    - Find who sits between groups that should not be linked (intermediaries, law firms, nominee services)
    - Hand the editor a clear picture and the fact-checker a table where every edge traces to a document
    - Keep unpublished names on her own machine until publication
behaviors:
    - Starts from a name typed into a search box, relying on fuzzy matching to catch spelling variants and transliterations
    - Uploads a CSV of names for a batch search and works down the resulting list of hits
    - Expands a node one hop, then a second hop, to see officers, entities, intermediaries and registered addresses
    - Runs a one-click shortest path between two names and reads the result name by name
    - Asks a technical colleague to write Cypher for anything beyond search, expand and path
    - Decides for each hit whether it is the real person or a namesake, whether the link is current, and whether a nominee service explains it
    - Adds links the leak does not contain (family ties, later appointments) by hand from her own reporting
    - Builds a two-sheet nodes-and-connections spreadsheet for her own story and imports it into Gephi, Kumu or Flourish
    - Shares a saved visualization with partner reporters and saves source documents for the fact-check
frustrations:
    - A number or a link she cannot trace back to a document
    - Statistics that change depending on which filter was applied first
    - Exports that differ from what is on screen
    - Any sign that unpublished names or the leak itself leave her laptop
    - Tools that assume she can write a query language
    - Registered-agent addresses and nominee directors that sit at the center of every picture and drown out the real story
    - Relearning the tool from scratch at the start of every project
context:
    frequency: as-needed
    devices:
        - laptop
    voluntary: true
workflows:
    - W89
    - W90
    - W91
    - W92
    - W95
sources:
    - title: Neo4j blog - ICIJ, Neo4j and Linkurious unravel the Panama Papers (Cabra 2016)
      url: https://neo4j.com/blog/icij-neo4j-unravel-panama-papers/
      summary: 370+ journalists, three developers, fuzzy name search, batch CSV search, one-click shortest path for non-technical reporters
    - title: ICIJ - Frequently asked questions about the Pandora Papers
      url: https://www.icij.org/investigations/pandora-papers/frequently-asked-questions-about-the-pandora-papers-and-icij/
      summary: 600+ journalists in 117 countries; only politicians who passed verification criteria were counted
    - title: Linkurious ICIJ case summary on the Neo4j site
      url: https://neo4j.com/?p=49297
      summary: Linkurious chosen because most journalists will not write SQL or Cypher queries
    - title: Peter Aldhous - NICAR 2016 Gephi class
      url: https://paldhous.github.io/NICAR/2016/gephi.html
      summary: The one-session conference class reporters take - spreadsheet import, layout, range filter, betweenness
    - title: Online Journalism Blog - A journalist's introduction to network analysis (2020)
      url: https://onlinejournalismblog.com/2020/06/08/a-journalists-introduction-to-network-analysis/
      summary: Defines degree, betweenness and eigenvector in one sentence each; names Gephi, Kumu and Flourish as reporter tools
    - title: Neo4j sandbox - Panama Papers example queries
      url: https://guides.neo4j.com/sandbox/icij-offshoreleaks/panama-papers-examples.html
      summary: The Cypher technical reporters write - control through variable-length paths, intermediaries ranked by companies, officer pairs sharing entities
    - title: Open Ownership - What graph visualisation teaches us about beneficial ownership
      url: https://www.openownership.org/en/blog/what-graph-visualisation-teaches-us-about-beneficial-ownership/
      summary: Registry data has no unique person ids, so one person appears as several; ceased relationships greyed out
