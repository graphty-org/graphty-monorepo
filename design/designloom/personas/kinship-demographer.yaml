id: kinship-demographer
name: Kinship Demographer
roster_persona: digital-humanist
tier: B
scope: in-scope
role: Historical Anthropologist and Demographer Studying Marriage Alliances
quote: I need to count the marriages that re-link families who were already related. A force layout of six thousand people tells me nothing about generations.
bio: >-
    Prof. Beatriz Duarte studies marriage alliances among a regional elite over 300 years. Family historians send her
    GEDCOM files, and she also reconstitutes families from parish registers. Her genealogies run from 2,000 to 50,000
    individuals (the Ragusan nobility genealogy used with Pajek has 5,999 people; the largest network in the Kinsources
    repository, Watchi, has about 50,000). She reads GEDCOM straight into Pajek as an Ore graph (people as nodes,
    parent-child arcs, marriage edges) or a p-graph (couples as nodes, people as arcs), uses Puck for censuses of
    matrimonial circuits and reshuffling simulations against chance, compares her data with the published datasets in
    Kinsources, and uses Gephi for pictures. She thinks in generations, descent lines and kin types, not in communities.
characteristics:
    expertise: advanced
    time_pressure: low
    graph_literacy: advanced
    domain_knowledge: expert
motivations:
    - Count marriages that re-link already related families (relinking index) and find preferred marriage types
    - Trace descent lines, inheritance paths and consanguinity paths between two people
    - Show generations as layers in a figure
    - Compare her population against published kinship datasets
behaviors:
    - Imports GEDCOM as an Ore graph or a p-graph, keeping birth, marriage and death years as node values
    - Chooses the p-graph for analysis because each marriage circuit becomes a cycle of couples
    - Runs a matrimonial circuit census and reshuffling simulations in Puck
    - Assigns pseudogenerations and lays people out in generation layers
    - Treats the genealogy as a mixed graph, directed descent and undirected marriage
frustrations:
    - General graph tools have no family or couple node, no generation layout and no kin-typed edges
    - GEDCOM family records assume one husband and one wife per family
    - Parse scripts for GEDCOM and kin terms are hand-written for each project
    - Pajek is a dated Windows desktop program and Puck has little visualization
context:
    frequency: monthly
    devices:
        - desktop
    voluntary: true
workflows:
    - W177
    - W183
    - W185
sources:
    - title: Mrvar and Batagelj 2004 - Relinking marriages in genealogies
      url: https://dlib.si/stream/URN:NBN:SI:DOC-7VRCE0CW/a6b4ecf9-7ca9-41a5-9e34-9fe88141a2ca/PDF
      summary: Ore graphs and p-graphs, the relinking index, p-graphs more suitable for analyses
    - title: UCINET datasets - Ragusan nobility genealogy
      url: https://sites.google.com/site/ucinetsoftware/datasets/ragusan-nobility-genealogy
      summary: 5,999 people, 9,315 parent-child links, 2,002 marriages; GEDCOM read into Pajek as an Ore graph
    - title: Roued-Cunliffe 2017 - GEDCOM structure
      url: https://journals.aau.dk/index.php/ak/article/download/2684/2116/9131
      summary: GEDCOM family records assume one husband and one wife
    - title: Kinsources networks study (2026)
      url: https://arxiv.org/html/2606.18210
      summary: 105 usable kinship networks from 17 to about 50,000 individuals, pseudogenerations by network simplex
    - title: Puck on SourceForge
      url: https://sourceforge.net/p/simpa-puck/
      summary: Kinship circuit censuses and reshuffling simulations
    - title: Menezes et al. 2016
      url: https://escholarship.org/content/qt5p57j1jm/qt5p57j1jm.pdf
      summary: Kinship network analysis methods and data
