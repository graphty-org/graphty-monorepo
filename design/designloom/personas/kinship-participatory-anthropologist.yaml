id: kinship-participatory-anthropologist
name: Kinship and Participatory Mapping Anthropologist
roster_persona: survey-network-researcher
tier: B
scope: in-scope
role: Anthropologist (Kinship Networks and Applied Participatory Mapping)
quote: Genealogy software draws the family tree but cannot count marriage circuits, and network software forgets who is whose parent.
bio: >-
    Dr. Abena Osei is an anthropologist who works from fieldwork. Part of her work is kinship: genealogies collected in
    a village or from archives, with individuals as nodes, directed parent-child links and undirected marriage or union
    links. She analyzes them in Puck, a free Java program from the Paris TIP group, and uses the Kinsources archive of
    peer-reviewed kinship datasets, which range from 17 to about 50,000 individuals and are often incomplete. Her
    applied work uses Net-Map: in a one- to two-hour interview an informant names the actors around a local decision,
    draws up to five colored link types between them on a large sheet, stacks towers under each actor to show
    influence, and marks each actor's goals. She later retypes those maps into UCINET, one matrix per link type, or
    redraws them in VennMaker or Network Canvas. She learned UCINET and EgoNet in coursework.
characteristics:
    expertise: intermediate
    time_pressure: low
    graph_literacy: intermediate
    domain_knowledge: advanced
motivations:
    - Census marriage circuits (who marries whom along which kin paths) in a community
    - Draw genealogies laid out by generation while still computing network measures
    - Compare kinship structure across societies
    - Turn participant-drawn influence maps into data without losing what the participant drew
behaviors:
    - Records individuals with sex, parent-child links and marriages from fieldwork or archives
    - Downloads peer-reviewed datasets from Kinsources and checks completeness (24.8% of individuals in the aggregate have no recorded parent)
    - Infers generations from parent-child direction because records carry no generation field
    - Runs Net-Map sessions with colored link types drawn one at a time, influence towers and goal codes
    - Digitizes each Net-Map link type as its own matrix, or redraws the map with node size for tower height
frustrations:
    - Genealogy tools draw trees but compute no network measures
    - Network tools ignore generations and the parent versus spouse distinction
    - Hand-drawn maps must be retyped as one matrix per link type before any software can use them
    - Positions, heights and annotations the participant made are lost when digitized
context:
    frequency: monthly
    devices:
        - laptop
    voluntary: true
workflows:
    - W34
    - W35
