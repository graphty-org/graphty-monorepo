    - title: Aaron Tay - All about citation chasing and tools
      url: https://aarontay.substack.com/p/all-about-citation-chasing-and-tools
      summary: Opaque similarity, coverage gaps, PROSPERO counts naming citationchaser and Connected Papers
    - title: Litmaps help - visualization and axes
      url: https://docs.litmaps.com/en/articles/9181490-use-and-edit-litmaps-visualization
      summary: Switchable axes (date, citations, momentum, connectivity, similarity) and pinned positions
    - title: Litmaps help - Monitor
      url: https://docs.litmaps.com/en/articles/9126249-monitor-get-alerts-for-important-research
      summary: Scheduled reruns that email new papers
    - title: Effortless Academic - ResearchRabbit 2026 review
      url: https://effortlessacademic.com/research-rabbit-2026-review-for-researchers/
      summary: Network view removed after redesign; axis plot and Zotero sync remain
    - title: Wohlin - Guidelines for snowballing in systematic literature studies (EASE 2014)
      url: https://www.wohlin.eu/ease14.pdf
      summary: Backward and forward snowballing in iterations with per-stage decisions until saturation
    - title: PRISMA 2020 and PRISMA-S common questions
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9014944
      summary: Citation searching counts reported in the flow diagram and supplements
