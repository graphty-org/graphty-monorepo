sources:
    - title: Relativity - Name normalization
      url: https://help.relativity.com/RelativityOne/Content/Relativity/Analytics/Name_normalization.htm
      summary: Parser rules, alias cap per entity to prevent over-merging, documents with more than 500 entities and aliases excluded
    - title: Relativity - Best practices for name normalization
      url: https://help.relativity.com/Server2024/Content/Relativity/Analytics/Best_practices_for_name_normalization.htm
      summary: Start with the priority custodian, triage categories, verify entities against their documents
    - title: Relativity - Name normalization quick reference
      url: https://help.relativity.com/Server2025/Content/System_Guides/User_quick_reference/Analytics/Name_normalization.htm
      summary: Can create many thousands of entities and aliases; results are not perfect; not practical to verify every entity
    - title: Relativity - Name normalization results
      url: https://help.relativity.com/Server2025/Content/Relativity/Analytics/Name_normalization_results.htm
      summary: Merge up to 50 entities, assign up to 500 aliases, survivor rules, no unmerge, do not edit alias names
    - title: Relativity - Communication analysis
      url: https://help.relativity.com/RelativityOne/Content/Relativity/Analytics/Communication_analysis.htm
      summary: Widget needs name normalization, largest 500 entities by default, deduplicate before counting, no export
    - title: Relativity - Email thread visualization
      url: https://help.relativity.com/RelativityOne/Content/Relativity/Analytics/Email_thread_visualization.htm
      summary: Thread tree states and missing-email placeholders that may not be truly missing
    - title: Relativity - Short message investigative workflow
      url: https://help.relativity.com/RelativityOne/Content/System_Guides/Relativity_Short_Message_Format/Short_message_investigative_workflow.htm
      summary: Chat converted to RSMF; the people graph reads header participants, not message frequency
