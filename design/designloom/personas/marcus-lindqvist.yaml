id: marcus-lindqvist
name: Marcus Lindqvist
roster_persona: attack-path-analyst
tier: B
scope: in-scope
role: Identity Security Engineer / Attack Path Management Owner
quote: I do not need every misconfiguration. I need the three choke points that cut most of the paths into Tier Zero, proof that removing them breaks nothing, and a chart for the CISO showing exposure went down.
bio: >-
    Marcus Lindqvist owns Active Directory and Entra ID hardening at a 30,000-employee company. A former Windows
    administrator, he runs BloodHound Enterprise with continuous SharpHound and AzureHound collection, defines what
    counts as Tier Zero through Privilege Zones, and works the Attack Paths page as a ranked queue: each finding shows
    severity, exposure (the share of principals with a path through it) and impact. He prioritizes choke points over
    individual misconfigurations, checks every proposed change against business processes before making it, files
    change tickets, and verifies after the next collection that the path is gone. He coordinates collection with the
    SOC because vendors publish detections for SharpHound's LDAP enumeration. He also uses the Defender XDR hunting
    graph for scenario queries such as Kerberoast paths to critical assets, and reports posture trends to leadership
    and auditors. He reads graphs fluently but prefers prebuilt scenarios to writing Cypher.
characteristics:
    expertise: advanced
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Drive down the share of principals with any path into Tier Zero
    - Fix the choke points that sever the most paths first
    - Remediate without breaking a business process
    - Prove each fix worked by re-collecting and showing the path gone
    - Show leadership and auditors a trend of exposure over time
behaviors:
    - Defines and widens Tier Zero and other Privilege Zones, knowing that new definitions make new findings appear
    - Filters the Attack Paths page by environment, zone and risk, and reads the choke point graph that aggregates exposed principals per finding
    - Prioritizes findings with both high exposure and high impact
    - Runs time-boxed remediation campaigns around a Privilege Zone, assigns owners and tracks reduction
    - Checks each remediation against business processes before making it in ADUC or ADSI Edit
    - Compares analysis runs on the Posture page to confirm resolved paths and catch regressions
    - Uses Defender XDR hunting graph scenarios ("Paths to domain admins", "Choke points to SQL data stores") with edge-type and direction filters
    - Coordinates SharpHound collection windows with the SOC so it is not raised as an attack
frustrations:
    - Finding counts can rise as visibility improves, which looks like failure in a leadership report
    - No safe way to see in advance which business process a privilege removal will break
    - Vendor claims about paths severed per choke point come without methodology
    - Collection traffic triggers the company's own detections
    - Fixed paths take a collection cycle or more to disappear, so verification lags the change
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
