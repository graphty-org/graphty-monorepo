id: master-data-steward
name: Master Data Steward
roster_persona: notebook-graph-data-scientist
tier: B
scope: in-scope
role: Data Steward / Customer-Insight Analyst keeping one trusted record per customer, household or supplier in an MDM hub
quote: Two profiles share an address and a phone. Before I merge them I need to see every source record behind each one, which value wins and why, and whether they already sit in different households.
bio: >-
    Folake Oyelaran is a data steward in a bank's data governance team. A master data management (MDM) hub -- Reltio,
    Informatica Customer 360, Tamr or IBM Match 360, or a customer-360 screen built on Neo4j -- merges source records
    from core banking, CRM and e-commerce into one "golden record" per customer, household, organization or supplier.
    Records the matcher is not sure about land in her queue. For each one she opens the profile, compares the
    candidate records field by field, and merges them, marks them "not a match" or escalates them; then she checks the
    merged record attribute by attribute, where each attribute lists its source values, the winning source and the
    survivorship rule that chose it, and pins or ignores a value that is wrong. She unmerges a mistaken merge, puts
    people into the right household and companies under the right parent, and reads hierarchies as of an effective
    date. She knows the source systems and the business rules but writes no queries. Customer-insight analysts use the
    same profile, relationship graph and hierarchy screens read-only before a campaign or a complaint. Unlike the entity
    resolution data scientist, who tunes a match threshold over millions of clusters in code, she works one profile at a
    time and every decision is written back to the system of record.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: low
    domain_knowledge: advanced
motivations:
    - Clear the potential-match queue without joining two different people's accounts
    - Know, for every field of a golden record, which source it came from and which rule chose it
    - Undo a wrong merge or a wrong surviving value quickly and visibly
    - Keep households and corporate parent-child hierarchies correct for credit exposure and marketing consent
behaviors:
    - Works from a queue of suggested duplicates and suggested edits, each with a high, medium or low match confidence
    - Opens a profile's potential matches and reads which fields match and partially match
    - Merges, marks not a match, or escalates a pair to someone who can decide
    - Reads the sources view per attribute (source values, winner source system, rule type, crosswalk) and pins or ignores a value
    - Unmerges a mistaken merge from the sources view
    - Opens the relationship graph, expands one node at a time, and adds, edits or deletes relationships from a side pane
    - Opens household and organization hierarchies as a tree, for an effective date, and compares them with an earlier version
frustrations:
    - The relationship graph refuses to load above 10,000 entities instead of showing part of it
    - A hierarchy graph shows 10 members until more are requested, with no sign of how many exist
    - Why a value won (source priority, recency) sits in a table column, not on the graph of source records
    - New relationships in a hierarchy view are not persisted at once
    - Corporate family trees above 7,500 members cannot be fetched reliably
context:
    frequency: daily
    devices:
        - desktop
        - laptop
    voluntary: false
workflows:
    - W1012
    - W1013
