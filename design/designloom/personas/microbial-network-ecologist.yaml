id: microbial-network-ecologist
name: Microbial Co-occurrence Network Ecologist
role: Postdoctoral Researcher / Soil and Plant Microbiome Ecologist
quote: The sequencing core sent me 12,000 ASVs. I need a network per treatment, the keystone taxa, and a figure with positive edges green and negative edges red.
bio: >-
    Dr. Mei Chen is a postdoc comparing soil or plant microbiomes across fertilization, drought or land-use treatments.
    She receives a taxa-by-samples abundance table from a sequencing core (50 to 300 samples by 1,000 to 20,000 ASVs),
    a taxonomy table and sample metadata, usually bundled as a phyloseq object. She filters to the 100 to 1,000 most
    prevalent taxa, infers an association network with SparCC, SPIEC-EASI or NetCoMi (or CoNet in Cytoscape, or the
    iNAP web pipeline), thresholds it, computes degree, modularity, the positive-to-negative ratio and Zi-Pi roles in
    igraph to name "keystone" taxa, and then moves the network into Gephi or Cytoscape for the final figure colored by
    phylum or module. For her the network is one figure among many in a paper, and she knows its edges are statistical
    associations, not direct interactions.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Show that treatment networks differ in complexity, modularity and positive-to-negative edge ratio
    - Name candidate keystone taxa (module hubs and connectors) to follow up
    - Produce a striking, readable network figure per treatment for the paper
    - Report thresholds and methods clearly enough that a reviewer can reproduce them
behaviors:
    - Filters the abundance table to taxa present in a minimum share of samples before inference
    - Tries several inference methods and normalizations and compares how many edges each keeps
    - Applies an absolute correlation cutoff (0.3 is common) and a p-value cutoff, or a random-matrix-theory threshold
    - Colors nodes by phylum or module and draws positive edges green or blue and negative edges red, width by correlation
    - Runs Louvain modularity and ForceAtlas2 in Gephi after exporting a node table whose Id matches the edge table Source and Target
    - Plots Zi against Pi to classify module hubs (Zi above 2.5) and connectors (Pi above 0.62)
    - Builds one network per condition and compares shared edges, modules and global properties
frustrations:
    - Results swing with the threshold, inference method and OTU or ASV definition
    - CoNet in Cytoscape is very memory intensive
    - Moving networks between R, Gephi and Cytoscape loses node attributes
    - Large co-occurrence plots are hairballs nobody can read
    - Reviewers and readers over-interpret edges as direct biological interactions
    - Thresholds and methods are often left undocumented in published networks
context:
    frequency: as-needed
    devices:
        - laptop
        - desktop
    voluntary: true
workflows:
    - W170
sources:
    - title: Goberna and Verdu 2022 - Cautionary notes on the use of co-occurrence networks in soil ecology
      url: https://www.uv.es/verducam/DamnNetworks.pdf
      summary: 485 soil network records from 2011-2020 showing exponential growth; networks used as a pictorial tool; sample-size guidance
    - title: SpiecEasi vignette
      url: https://bioconductor.statistik.tu-dortmund.de/packages/3.24/bioc/vignettes/SpiecEasi/inst/doc/SpiecEasi.html
      summary: spiec.easi with StARS selection and getRefit; abs(cor) >= 0.3 described as an arbitrary cutoff
    - title: NetCoMi - network construction and comparison for microbiome data
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8293835
      summary: netConstruct wraps many association measures; netCompare and diffnet compare conditions
    - title: CoNet app for Cytoscape
      url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5089131/
      summary: Ensemble association measures with permutation significance and multiple-testing correction
    - title: Using CoNet with Cytoscape (practitioner blog)
      url: https://sites.google.com/view/terrimporter/posts/using-conet-with-cytoscape
      summary: Reports that CoNet is very memory intensive
    - title: Microbial network interpretation review
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10989802/
      summary: Co-occurrence edges should not be read as direct interactions
    - title: Example co-occurrence network figure conventions
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10437823/figure/pone.0273890.g008
      summary: Positive edges and negative edges in contrasting colors, width by correlation
