      summary: Pulling ACS county migration flows in R with MOVEDIN, MOVEDOUT, MOVEDNET rows, MOE and centroids
    - title: IRS SOI Tax Stats - Migration Data
      url: https://www.irs.gov/statistics/soi-tax-stats-migration-data
      summary: County-to-county inflow and outflow files of returns, exemptions and AGI per year
    - title: IRS migration data users guide
      url: https://www.irs.gov/pub/irs-soi/2223inpublicmigdoc.pdf
      summary: Total codes 96/97/98, non-migrant rows, flows under 20 returns aggregated
    - title: Census Bureau - County-to-county migration flows guidance
      url: https://www.census.gov/topics/population/migration/guidance/county-to-county-migration-flows.html
      summary: County-to-county series ended with 2016-2020; state-to-county continues
    - title: Census Flows Mapper announcement
      url: https://www.census.gov/newsroom/archives/2014-pr/cb14-165.html
      summary: The select-a-county inbound, outbound and net flow viewer, later decommissioned (October 8, 2024)
    - title: migest mig_chord reference
      url: https://search.r-project.org/CRAN/refmans/migest/html/mig_chord.html
      summary: Chord diagrams for regional migration summaries
    - title: FlowMapper.org (Koylu et al.)
      url: https://arxiv.org/pdf/2110.03662
      summary: Fifty states already form thousands of links; thresholding as a clutter control
    - title: FRED blog - Mapping net migration by county
      url: https://fred.stlouisfed.org/blog/2023/05/mapping-net-migration-by-county
      summary: Net migration rate per county mapped as a choropleth
