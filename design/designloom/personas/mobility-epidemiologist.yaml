      url: https://ar5iv.labs.arxiv.org/html/2008.12238
      summary: SafeGraph-derived daily and weekly flows at 74,001 tracts, 3,219 counties and states, scaled to population
    - title: Balcan et al. - GLEaM multiscale mobility networks
      url: https://arxiv.org/pdf/0907.3304
      summary: Metapopulation model from OAG airline flows and commuting data in 30 countries
    - title: Kraemer et al. Science 2020
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7146642
      summary: Early COVID-19 spread tracked Baidu travel volume out of Wuhan
    - title: Harvard press release - Cell phone data and malaria (Wesolowski et al. 2012)
      url: https://www.hsph.harvard.edu/news/press-releases/cell-phone-data-malaria/
      summary: Malaria sources and sinks from 15 million Kenyan phone users
    - title: Flowminder FlowKit factfile
      url: https://www.flowminder.org/media/cpsoguko/flowkit-factfile.pdf
      summary: OD matrices computed behind the operator firewall; only aggregates leave
    - title: HDX - Meta movement data successor dataset
      url: https://data.humdata.org/dataset/32167ba5-ef67-4254-8eaf-04cdb8b90c1d
      summary: Movement between administrative areas with differential-privacy noise
    - title: IOM and OCHA partners in displacement data
      url: https://centre.humdata.org/iom-and-ocha-partners-in-displacement-data/
      summary: Sensitive flow-monitoring data shared on request
    - title: Effective distance and import risk on airline networks
      url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10843136/
      summary: Import risk along airline shortest-path trees
