id: molecular-networking-chemist
name: Molecular Networking Chemist
roster_persona: molecular-networking-chemist
tier: B
scope: in-scope
role: Natural Products Chemist / Untargeted Metabolomics Scientist
quote: GNPS gave me three thousand spectra in four hundred little families. I need to find the families that differ between my groups and put names on the unknowns.
bio: >-
    Dr. Zainab Okoro is a natural products chemist who runs untargeted liquid chromatography tandem mass spectrometry
    (LC-MS/MS) on extracts, microbiome samples or environmental samples. She converts vendor files, detects features in
    MZmine or MS-DIAL, and submits jobs to GNPS or GNPS2 for classical or feature-based molecular networking. The result
    is a similarity graph: nodes are consensus spectra or features with precursor mass, retention time, per-group
    abundance, library hits and structures; edges are spectral cosine similarity with a mass difference. Because GNPS
    keeps only mutual top-10 neighbors and caps components at 100 nodes, she gets thousands of small molecular families
    plus singletons. She reads them in the GNPS browser one family at a time, propagates annotations with NAP and
    MolNetEnhancer, and finishes the figure in Cytoscape with chemViz2 structures and per-group pie charts. GNPS served
    over 300,000 accesses a month in 2021.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: intermediate
    domain_knowledge: expert
motivations:
    - Find molecular families whose abundance differs between sample groups
    - Put names on unknown spectra from annotated neighbors in the same family
    - Spot new analogs of a known compound by mass difference
    - Compare networks built with different settings without re-reading every family
behaviors:
    - Submits GNPS jobs with default tolerances, cosine 0.7, six matched peaks, TopK 10 and component cap 100
    - Opens families one at a time from the View Spectral Families list in the browser
    - Types a mass difference to highlight matching edges (for example a methylation)
    - Runs NAP and MolNetEnhancer, then imports GraphML and library tables into Cytoscape
    - Sizes nodes by summed peak intensity, draws pies from the group columns and structures from SMILES
frustrations:
    - The GNPS browser viewer is limited to a single component at a time
    - Cytoscape search is very slow on large molecular networks
    - Reruns with other settings give families that differ in size, composition and order, and random per-family layouts make comparison arduous
    - Conventional networking leaves many nodes disconnected as singletons
    - Separate jobs have to be merged by hand in Cytoscape
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W25
    - W253
