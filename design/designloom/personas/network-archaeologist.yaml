      url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/33B5AB5D5282DA60F080631646E464E6/9781009170666c1_1-25.pdf/introducing_network_science_for_archaeology.pdf
      summary: The field's textbook and its methods
    - title: Davis replication code after Peeples (Antiquity 2023 supplement)
      url: https://static.cambridge.org/content/id/urn:cambridge.org:id:article:S0003598X23001230/resource/name/S0003598X23001230sup002.pdf
      summary: Brainerd-Robinson similarity, thresholds, resampling of sites and plotting at coordinates in R
    - title: Habiba, Athenstaedt, Mills and Brandes - similarity measures on SWSN data
      url: https://www.inf.uni-konstanz.de/exalgo/group/habiba/papers/submission.pdf
      summary: Similarity measures do not necessarily have similar contextual meaning; SWSN data sizes
