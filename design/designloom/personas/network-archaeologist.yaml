id: network-archaeologist
name: Network Archaeologist
role: Regional Archaeologist Building Site Similarity Networks in R
quote: The network changes every time I change the similarity measure or the threshold. I need to see that, and I need it on the map.
bio: >-
    Dr. Sam Ortega studies interaction among 50 to 700 settlements over several 50-year periods. His networks are not
    built from documents but from artifacts: a site-by-type table of counts (ceramic wares, obsidian sources) per
    period plus site coordinates, of the kind in the Southwest Social Networks database (over 700 sites, 42 wares,
    AD 1200-1500 in five 50-year periods). He works in R with Peeples's published network scripts (statnet, tnet,
    igraph) and GIS shapefiles of the study area, and opens Gephi or Visone only occasionally. His field has its own
    textbook (Brughmans and Peeples 2023) and a habit of publishing replication code, and his reviewers ask whether
    central sites stay central when the sample is small.
characteristics:
    expertise: advanced
    time_pressure: low
    graph_literacy: advanced
    domain_knowledge: expert
motivations:
    - Infer interaction or shared practice from similarity of material culture, period by period
    - Test whether central sites stay central under sampling error
    - Draw networks over terrain at site coordinates
    - Publish reproducible analysis alongside the article
behaviors:
    - Drops sites with too few sherds, converts counts to row proportions and computes Brainerd-Robinson similarity
    - Thresholds similarity into a network (for example ties above 0.6) or keeps weights
    - Computes degree, eigenvector and betweenness centrality and centralization per period
    - Resamples sites from 90 percent down to 10 percent 1,000 times and correlates centralities with the full network
    - Plots networks at site coordinates over a shapefile in R
frustrations:
    - The choice of similarity measure and threshold changes the network, and tools hide that choice
    - Uncertainty from small samples is invisible in standard network tools
    - Maps need separate GIS work
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W177
    - W184
sources:
