sources:
    - title: RCy3 - Overview vignette
      url: https://bioconductor.org/packages/release/bioc/vignettes/RCy3/inst/doc/Overview-of-RCy3.html
      summary: Scripted Cytoscape from R; requires a running desktop Cytoscape
    - title: py4cytoscape concepts
      url: https://py4cytoscape.readthedocs.io/en/latest/concepts.html
      summary: Scripted Cytoscape from Python with the same model
    - title: Cytoscape Automation (Genome Biology 2019)
      url: https://genomebiology.biomedcentral.com/articles/10.1186/s13059-019-1758-4
      summary: Commands and REST interface that RCy3 and py4cytoscape drive
    - title: NDEx protocols (Current Protocols 2021)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8544027
      summary: Private reviewer links, DOIs and ndex2 scripted upload
    - title: Biostars - WGCNA export threshold removes hub genes
      url: https://www.biostars.org/p/9514423/
      summary: Raising the topological overlap threshold to make an export readable dropped the hubs
    - title: Cytoscape wiki - increasing memory
      url: https://wikiold.cytoscape.org/How_to_increase_memory_for_Cytoscape
      summary: Java heap configuration for large networks
    - title: Research engineer posting - MS-based proteomics, Stockholm
      url: https://www.academicjobs.com/university-jobs/research-engineer-in-bioinformatics-ms-based-proteomics-stockholms-l-n/405981
      summary: Core-facility posting listing Cytoscape next to R and Bioconductor
    - title: Reimand et al. 2019 - Pathway enrichment analysis protocol (Nature Protocols)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6607905/
      summary: About 4.5 hours end to end for the EnrichmentMap pipeline; parameters to report
