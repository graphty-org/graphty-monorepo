id: network-biology-core-bioinformatician
name: Network Biology Core Bioinformatician
roster_persona: genomics-cytoscape-user
tier: A
scope: in-scope
role: Staff Bioinformatician, Genomics or Proteomics Core Facility
quote: I run the same STRING, cluster, enrich, figure pipeline for thirty labs a year. It has to be one script, and the PI has to open the result without installing anything.
bio: >-
    Chinedu Okafor is a staff bioinformatician in a core facility. Every week a different lab hands over a gene list, a
    proteomics table or a sample series, and he runs the same pipeline: build an interaction network, cluster it, run
    enrichment, rank hubs and produce figures and tables. For sample series of 15 or more he runs WGCNA co-expression
    analysis. He scripts Cytoscape from R with RCy3 or from Python with py4cytoscape, uses STRINGdb and igraph headless
    when he can, and publishes results to NDEx with ndex2 so reviewers get a link. His deliverable is a folder a
    principal investigator can open without installing anything, plus a methods paragraph listing every database
    version, cutoff and parameter. He knows graph theory well enough to distrust a single hub ranking.
characteristics:
    expertise: expert
    time_pressure: high
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Rebuild any network, style and figure from one script, months later, with the same result
    - Hand labs a deliverable they can open, read and pass on without installing software
    - Spend his time on interpretation rather than re-clicking the same styling steps
    - Defend cutoffs and hub lists to reviewers with a robustness check
    - Write the methods paragraph from recorded parameters instead of from memory
behaviors:
    - Drives desktop Cytoscape from R or Python scripts (RCy3, py4cytoscape) with cytoscapePing first
    - Runs STRINGdb and igraph headless on a server when no figure is needed
    - Runs WGCNA for sample series and exports module networks thresholded on topological overlap
    - Keeps one style file per lab and reapplies it with a command
    - Uploads finished networks to NDEx with a private reviewer link, then requests a DOI at publication
    - Re-runs hub ranking at a second cutoff when a result looks fragile
frustrations:
    - Scripted Cytoscape still needs a desktop Cytoscape running, which breaks headless servers
    - Thresholding a WGCNA export to make it readable can remove the hub genes
    - Java heap tuning for large networks
    - cytoHubba rankings reported to change between runs, and the plugin was last released in 2017
    - stringApp drops older STRING versions, so an old network cannot be rebuilt exactly
    - NDEx uploads of large networks show no progress
context:
    frequency: daily
    devices:
        - desktop
        - laptop
    voluntary: false
