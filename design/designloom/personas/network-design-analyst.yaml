      url: https://www.scdigest.com/EXPERTS/DrWatson_14-07-08.php?cid=8252
      summary: Baseline validates last year's costs; optimized baseline follows the rules that should have been in place
    - title: Watson, cost data in network design (SCDigest)
      url: https://www.scdigest.com/experts/DrWatson_17-02-21.php?cid=11984
      summary: Cost data is the toughest to get and missing data appears after the baseline is built (read via search summary)
    - title: anyLogistix network optimization tutorial
      url: https://anylogistix.help/tutorial/tutorial-n-optimization.html
      summary: Include, exclude or consider per facility, comparison of the best solutions, routes drawn on a map
