sources:
    - title: Community detection in network neuroscience (Betzel 2020 review)
      url: https://ar5iv.labs.arxiv.org/html/2011.06723
      summary: Brain Connectivity Toolbox and GenLouvain practice; 100 Louvain runs, resolution sweeps, consensus clustering, signed and spatial nulls, Infomap needs positive weights
    - title: Proportional thresholding in resting-state fMRI functional connectivity networks (van den Heuvel et al. 2017)
      url: https://research.vu.nl/en/publications/proportional-thresholding-in-resting-state-fmri-functional-connec/
      summary: Proportional thresholds can turn overall connectivity differences into spurious topology differences
    - title: Functional cartography of complex metabolic networks (Guimera and Amaral 2005)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2175124
      summary: Within-module degree z-score and participation coefficient define hub roles
    - title: Community structure in time-dependent, multiscale and multiplex networks (Mucha et al. 2010)
      url: https://arxiv.org/abs/0911.1824
      summary: Multilayer modularity with interlayer coupling, used for time-windowed brain networks
    - title: Higher-order organization of multivariate time series (Santoro, Battiston, Petri and Amico)
      url: https://arxiv.org/abs/2203.10702
      summary: Higher-order signals from products of z-scored fMRI time series
    - title: Higher-order connectomics of human brain function (Nature Communications 2024 record)
      url: https://research.birmingham.ac.uk/en/publications/higher-order-connectomics-of-human-brain-function-reveals-local-t/
      summary: Higher-order analysis applied to 100 Human Connectome Project subjects
