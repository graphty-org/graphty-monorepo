sources:
    - title: Lotus leaf network pharmacology study (PMC8566053)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8566053
      summary: 93 compounds to 15 by OB/DL, 189 targets, 135 intersected, STRING at 0.4, top-5 degree hubs; papaverine absent from its own compound table
    - title: Pulsatilla decoction network pharmacology study (Frontiers in Oncology 2023)
      url: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2023.1174848/full
      summary: Four herbs, 346 compounds, GeneCards relevance >= 1 giving 11,373 genes, 162 intersected targets, STRING 0.99, a 172-node layered network
    - title: Two-herb pair network pharmacology study (PMC7838196)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7838196
      summary: 354 compounds to 66, median-rule hub screening stated in Methods but fixed cutoffs in Results, fifteen figures, every database dated
    - title: Network pharmacology and the integration of multiple databases (TCMNPAS, PMC10958928)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10958928
      summary: States that integrating results from multiple databases can be time-consuming and demanding
    - title: Biostars question on drawing layered herb-compound-target networks
      url: https://www.biostars.org/p/460186
      summary: Users ask how to arrange node types into tiers in Cytoscape; answers point to manual arrangement
    - title: Paid network pharmacology workshop (Pharnexcloud, 2022)
      url: https://www.pharnexcloud.com/meeting/6618.html
      summary: Two-day 3,000 RMB course including building the network diagram in Cytoscape
    - title: Tencent Cloud tutorial on saving network pharmacology inputs
      url: https://cloud.tencent.com/developer/article/1666096
      summary: Advises saving downloaded data with the access date because databases move or become unreachable
    - title: Lee et al. 2022 - review of network pharmacology methods (BMB Reports)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9537023
      summary: Herb databases (TCMID, TCMSP, BATMAN-TCM, SymMap), predicted targets, disease genes, STRING PPI and GO or KEGG enrichment; warns of reliance on in silico target annotations
    - title: TCMSP - a database of systems pharmacology for drug discovery from herbal medicines
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4001360
      summary: 499 herbs, 29,384 ingredients, 3,311 targets and twelve ADME properties; predicted targets filled by a model
    - title: Diao et al. 2026 - census of network pharmacology results (Frontiers in Pharmacology)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Quercetin a key compound in 63.2% and AKT1 a key target in 48.8% of studies; AKT1 falls to 19.6% in omics-integrated studies
    - title: TCMDATA tutorial - network construction
      url: https://yulab-smu.top/TCMDATA/network-construction.html
      summary: Sankey of herb to molecule to target; force layouts on typed graphs in R
    - title: STRING help - getting started
      url: https://string-db.org/help/getting_started/
      summary: Minimum interaction score medium 0.4, high 0.7, highest 0.9
