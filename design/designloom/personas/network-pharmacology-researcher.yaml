id: network-pharmacology-researcher
name: Network Pharmacology Researcher
role: Graduate Student or Lab Lead studying herbal formula mechanisms with herb-compound-target-disease networks
quote: My supervisor gave me a four-herb formula and a disease. I need the Venn, the PPI, the top ten targets and the layered network figure, and I need the numbers to agree with each other this time.
bio: >-
    Lin is a second-year master's student at a university of Chinese medicine who must publish one paper from a
    network pharmacology study, and the lead variant of a population that also includes herbal formula mechanism
    leads, natural products researchers outside China, ethnopharmacology reviewers and TCM database developers. Her
    supervisor names a formula and a disease; she copies a prior paper's methods, cutoffs included. She collects 300 to
    600 compounds from TCMSP or HERB, filters them by oral bioavailability >= 30% and drug-likeness >= 0.18, predicts
    targets with SwissTargetPrediction one compound at a time, converts protein names to gene symbols in UniProt,
    collects 1,000 to 11,000 disease genes from GeneCards and DisGeNET, intersects the lists in Venny, builds a STRING
    network of the 100 to 200 shared targets, ranks hubs in Cytoscape with cytoHubba, runs GO and KEGG enrichment in
    DAVID or Metascape, draws a layered herb-compound-target-pathway network, docks the top compound into the top
    protein, and validates in cells or animals. Excel carries every list between web tools. Domain knowledge is strong,
    graph literacy low: degree is understood, betweenness is used because the protocol says so. The population is
    large and growing (3,357 PubMed records naming "network pharmacology" in 2024 and 5,172 in 2025; 1,215 works citing
    Cytoscape named it in 2022-2024) and heavily criticized for homogeneous results built on predicted targets.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: novice
    domain_knowledge: advanced
motivations:
    - Produce the standard figure set (workflow diagram, Venn, PPI with core subnetwork, enrichment plots, layered network, docking) that reviewers accept
    - Pick two or three core targets and pathways worth the bench budget for validation
    - Keep counts consistent between methods, figures and tables
    - Show that the formula acts through "multi-component, multi-target" mechanisms with evidence a reviewer will not dismiss
behaviors:
    - Builds every list in Excel, adding a herb column by hand and pasting compound and target lists between web tools
    - Filters compounds by ADME cutoffs copied from earlier papers and target predictions by a probability cutoff the tool does not recommend
    - Intersects drug targets and disease genes and treats the overlap as the therapeutic targets
    - Queries STRING at a confidence of 0.4, 0.7, 0.9 or higher and hides disconnected nodes
    - Ranks core targets by degree, cytoHubba MCC top 10, or median filters on several centralities
    - Imports a stacked edge table (herb-compound, compound-target, target-pathway) with a node type column into Cytoscape
    - Styles node type by shape and color, sizes by degree, then drags types into tiers and fixes labels in Illustrator
frustrations:
    - Protein names that must become gene symbols, with silent drops and Excel turning symbols into dates
    - No layout that arranges herbs, compounds, targets and pathways in ordered tiers from a type column
    - The figure cannot be regenerated after hand-nudging
    - Counts drift between reruns and between methods and results
    - Database versions, access dates and cutoffs that nobody recorded
    - Reviewers dismissing results because quercetin and AKT1 appear in every study
context:
    frequency: weekly
    devices:
        - laptop
        - desktop
    voluntary: true
