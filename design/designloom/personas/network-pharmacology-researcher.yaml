sources:
    - title: Lee et al. 2022 - review of network pharmacology methods (BMB Reports)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9537023
      summary: Herb databases (TCMID, TCMSP, BATMAN-TCM, SymMap), predicted targets, disease genes, STRING PPI and GO or KEGG enrichment; warns of reliance on in silico target annotations
    - title: TCMSP - a database of systems pharmacology for drug discovery from herbal medicines
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4001360
      summary: 499 herbs, 29,384 ingredients, 3,311 targets and twelve ADME properties; predicted targets filled by a model
    - title: Diao et al. 2026 - census of network pharmacology results (Frontiers in Pharmacology)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Quercetin a key compound in 63.2% and AKT1 a key target in 48.8% of studies; AKT1 falls to 19.6% in omics-integrated studies
    - title: Lotus leaf network pharmacology study
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8566053
      summary: Worked example of the full pipeline; STRING 0.4; top five targets by degree
    - title: Two-herb pair network pharmacology study
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7838196
      summary: 354 compounds to 66 after ADME filter; 136-node PPI; stated median rule not applied in Results
    - title: Biostars - arranging node types in tiers in Cytoscape
      url: https://www.biostars.org/p/460186
      summary: Users drag node types into tiers by hand for herb-compound-target figures
    - title: TCMDATA tutorial - network construction
      url: https://yulab-smu.top/TCMDATA/network-construction.html
      summary: Sankey of herb to molecule to target; force layouts on typed graphs in R
    - title: STRING help - getting started
      url: https://string-db.org/help/getting_started/
      summary: Minimum interaction score medium 0.4, high 0.7, highest 0.9
