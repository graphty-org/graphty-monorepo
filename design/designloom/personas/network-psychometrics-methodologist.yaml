id: network-psychometrics-methodologist
name: Network Psychometrics Methodologist
role: Faculty Methodologist, Package Author and Workshop Teacher
quote: Half my job is telling people that the distance between two nodes in a spring layout means nothing and that an interval crossing zero is not a non-significant edge.
bio: >-
    Professor Ines Kramer develops network estimators and teaches one-day network psychometrics workshops of the kind
    run at IMPS and in Amsterdam, Singapore, Leiden and Groningen: cross-sectional estimation in bootnet and JASP in
    the morning, longitudinal, multi-group and latent-variable models in psychonetrics in the afternoon. She works in
    psychonetrics (ggm, prune, modelsearch, panelgvar), BGGM and easybgm for Bayesian edge evidence, EGAnet for
    dimensionality, bnlearn for causal structure and qgraph for figures, and she reviews papers that use all of them.
    Her goal is to move the field from exploratory pictures toward confirmatory tests and honest uncertainty, and her
    complaint is that no drawing tool enforces the reporting standards she helped write.
characteristics:
    expertise: expert
    time_pressure: low
    graph_literacy: advanced
    domain_knowledge: expert
motivations:
    - Move applied users from exploratory pictures toward confirmatory models and honest uncertainty
    - Make the difference between no edge and not enough data visible (inclusion Bayes factors)
    - Teach workshop participants to read stability and uncertainty before centrality
    - Use layouts whose distances mean something (MDS with stress, Procrustes alignment) when position is to be read
    - Reproduce published figures exactly from a saved layout and settings
behaviors:
    - Fits confirmatory GGMs, prunes edges and searches models, then tests the structure on a holdout sample
    - Plots edge evidence colored by inclusion Bayes factor (included, excluded, inconclusive)
    - Draws node predictability as a ring around each node
    - Runs simulations (netSimulator) to judge whether a sample is big enough for the network size
    - Uses EGA and bootEGA for dimensionality and item stability, and bnlearn DAGs with bootstrapped arc strength and direction
    - Teaches with JASP and bootnet side by side and fields how-do-I questions on package issue trackers
frustrations:
    - Applied users read node distance in spring layouts as meaning
    - Applied users read intervals that include zero as non-significance (double thresholding)
    - Drawing tools do nothing to enforce or even support the reporting standards
    - Defaults of easybgm and EGAnet differ between documentation and versions, so tutorials go stale
    - DAG arcs carry two uncertainties (appearance and direction) with no standard way to draw both
context:
    frequency: daily
    devices:
        - desktop
        - laptop
    voluntary: true
