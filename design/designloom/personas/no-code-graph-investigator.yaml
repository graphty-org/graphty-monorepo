id: no-code-graph-investigator
name: No-Code Graph Investigator
role: AML / Fraud Analyst in a bank's compliance unit
quote: Give me the flagged client and everything that shares an IP, an email or an address with them. I have twenty alerts left today.
bio: >-
    Sofia Moreau is an anti-money-laundering and fraud analyst at a bank. She works alerts produced by rules or models,
    and she is an expert in typologies (mule networks, phishing, identity theft) but writes no Cypher. Her graph front
    end is Neo4j Bloom or Aura Explore, or Linkurious Enterprise, prepared by a curator who wrote the search phrases and
    templates she uses; if her bank enabled one, she can also type a plain-language question to a co-pilot. Her data is
    customers, accounts, transfers, check cashing, IP addresses, emails and postal addresses from core banking, held on
    premises. From one flagged client she searches, reads the badge of hidden connections, expands with filters, looks
    for shared identifiers and paths to other suspects, and saves the scene for the case file. Graph front ends are part
    of her daily routine; analysts "across the anti-financial crime teams use Neo4j Bloom daily".
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Decide within minutes whether a flagged client is part of a ring
    - Find every customer who shares an identifier with the flagged one
    - Document what she found for the case, in a form a reviewer or regulator accepts
    - Stop reading thousands of payments as rows in a list
behaviors:
    - Starts from one entity named in an alert, never from an overview of the whole graph
    - Uses search phrases and templates prepared by a curator (shared-attribute ring, UBOs above 20 percent, common neighbors)
    - Reads the hidden-relationship badge before expanding and uses selective expand on hubs
    - Selects two suspects and asks for the shortest path, then re-checks it
    - Uses the timeline or slicer to see when connections appeared
    - Groups parallel transfers between two accounts and reads the summed amount
    - Saves the scene or visualization, adds sticky notes, exports to Excel for the case system
frustrations:
    - Relational lookups took "2 minutes to several hours" per question before the graph tool
    - '"No human can really effectively read something out of 10,000 payments in a list"'
    - Hub nodes (a shared office address, a payment processor) explode the view when expanded
    - The node cap silently cuts results; she sees 38 of 236 nodes and assumes data is missing
    - Filters are not saved with the scene
    - A shortest path "may not be the one you were expecting"
context:
    frequency: daily
    devices:
        - desktop
    voluntary: false
workflows:
    - W02
    - W142
    - W143
    - W147
    - W149
sources:
