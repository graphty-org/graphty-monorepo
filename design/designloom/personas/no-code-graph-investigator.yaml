      url: https://linkurious.com/blog/bforbank-detects-fraud-with-linkurious/
      summary: Data sources (customers, transfers, checks, IP, email, address); ring of 11 found in half an hour; 2 minutes to hours before
    - title: European bank using Neo4j Bloom
      url: https://neo4j.com/?p=435908
      summary: Daily Bloom use across anti-financial crime teams; 10,000 payments in a list quote; on-premises deployment
    - title: Ria accelerates AML investigations with graph technology
      url: https://thepaypers.com/fraud-and-fincrime/thought-leader-insights/ria-accelerates-aml-investigations-5x-with-graph-technology
      summary: Money transfer firm using Linkurious for AML investigation
    - title: Linkurious top 10 query templates
      url: https://linkurious.com/blog/top-10-query-templates-to-accelerate-your-investigations/
      summary: Investigation templates such as UBOs above 20 percent and common neighbors
    - title: Linkurious advanced settings
      url: https://doc.linkurious.com/admin-manual/4.1/advanced-settings
      summary: Selective expand above 50 neighbors, supernode threshold 10,000
    - title: Aura Explore feedback - I can't see all my nodes
      url: https://aura.feedback.neo4j.com/explore/p/i-cant-see-all-my-nodes
      summary: User sees 38 of 236 nodes and assumes data is missing; Bloom not built to load a whole graph
    - title: Neo4j Bloom tips and tricks for domain experts
      url: https://neo4j.com/blog/graph-visualization/neo4j-bloom-tips-tricks-domain-knowledge-experts/
      summary: Shortest path may not be the one expected; good data model needed
