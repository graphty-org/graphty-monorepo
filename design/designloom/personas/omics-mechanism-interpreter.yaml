id: omics-mechanism-interpreter
name: Omics Mechanism Interpreter
roster_persona: genomics-cytoscape-user
tier: A
scope: in-scope
role: Translational Biologist / Bench Scientist (pharma, biotech or academic institute)
quote: I need to know which upstream regulator is switched on, which drug could switch it off, and a figure that shows it.
bio: >-
    Dr. Jiwon Lee is a translational scientist with RNA-seq or proteomics results from a treatment, knockout or
    disease-versus-control comparison. She does not code. She uploads a table of gene IDs with fold change and p-value to
    QIAGEN IPA (or Clarivate MetaCore or Elsevier Pathway Studio, which follow similar steps under other names), runs a
    Core Analysis with a cutoff such as p < 0.05, and reads the results tabs: canonical pathways, upstream regulators,
    diseases and functions, causal networks. The vendor knowledge base is proprietary and curated; IPA's holds "14+
    million findings", each with a direction, an effect (increases or decreases), a cell or tissue context and a source
    PMID. Her graph is therefore directed and signed, with two node-state layers: observed up or down from her data
    (red and green) and predicted activated or inhibited from the analysis (orange and blue, at activation z-scores of
    +2 or more and -2 or less). She ends with a mechanism-of-action figure showing her genes, the predicted regulators and
    known drugs for a paper or a program review. This is probably the largest buyer group in pharma for network tools;
    no source sizes it. Open-source omics-to-network work (STRING, WGCNA, OmniPath, CARNIVAL) belongs to other personas.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: basic
    domain_knowledge: advanced
motivations:
    - Explain a differential expression result as a mechanism of action
    - Find upstream regulators predicted to be activated or inhibited and the drugs that act on them
    - Simulate "what if this node were inhibited" before proposing an experiment
    - Produce a clean, signed mechanism figure for a paper or program review
behaviors:
    - Uploads a case-versus-control table, maps columns to observations and keeps analysis-ready molecules under about 3,000 (hard cap 8,000)
    - Reads the upstream regulator table by z-score and overlap p-value, then opens "Targets of X" as a network
    - Uses Path Explorer and Connect or Grow to link sets of genes with directional shortest paths
    - Sets a node to inhibited or activated in the Molecule Activity Predictor and reads predicted downstream changes
    - Grows upstream from selected nodes and overlays known drug-target labels
    - Compares up to 20 analyses and matches the signature against curated studies, looking for opposite signatures that suggest repurposing
    - Formats the network for publication in a designer view and shares a project link
goals:
    - Upstream regulator list with predicted states
    - Causal network linking regulators to her genes
    - Publication or review figure with drugs overlaid
frustrations:
    - The knowledge base is closed and licensed; libraries cancel subscriptions for cost and note no single free option matches
    - Reproducing a result needs the same license and knowledge-base version
    - Input is capped at 8,000 analysis-ready molecules
    - Figures need a second, manual formatting pass
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W259
sources:
    - title: NIH CCR IPA training slides (2026)
      url: https://bioinformatics.ccr.cancer.gov/btep/wp-content/uploads/sites/2/ipa_slides_20260408.pdf
      summary: Upload, Core Analysis, upstream regulators, z-score thresholds, Path Explorer, Molecule Activity Predictor, drug overlay, 14+ million findings
    - title: Boston University IPA training (2023)
      url: https://www.bumc.bu.edu/gsi/files/2023/03/BU-IPA-030723.pdf
      summary: Menu-by-menu IPA training; analysis-ready molecule limits and result tabs
    - title: QIAGEN Ingenuity Pathway Analysis
      url: https://www.qiagen.com/us/products/ingenuity-pathway-analysis/
      summary: Vendor product page for the curated causal network platform
    - title: Clarivate MetaCore
      url: https://clarivate.com/products/metacore/
      summary: About ten network-building algorithms over a curated knowledge base
    - title: Pathway Studio Sub-Network Enrichment Analysis
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8221786
      summary: Elsevier's text-mined causal network and sub-network enrichment
    - title: Northwestern Galter library guide
      url: https://libguides.galter.northwestern.edu/gene-enrichment-and-pathway-analysis
      summary: MetaCore cancelled; no single free option matches MetaCore or IPA
