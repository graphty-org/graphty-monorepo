      summary: 56 seed channels, 3,871 channels, 57,646 forwards, nine modularity clusters, labels checked against clusters
    - title: Bellingcat Online Investigations Toolkit - Telepathy
      url: https://bellingcat.gitbook.io/toolkit/more/all-tools/telepathy
      summary: Telegram collection toolkit producing forward edge lists; described as unmaintained
    - title: Public Data Lab - Co-hashtag network recipe
      url: https://recipes.publicdatalab.org/co-hashtag_network.html
      summary: Delete query hashtags, range filters, ForceAtlas2 settings, modularity coloring, accepting ambiguity
    - title: CooRTweet vignette (CRAN)
      url: https://cran.r-project.org/web/packages/CooRTweet/vignettes/vignette.html
      summary: Co-sharing coordination detection from four columns with a time window and an edge-weight threshold
    - title: First Draft - How to use network analysis to explore social media and disinformation
      url: https://firstdraftnews.org/latest/how-to-use-network-analysis-to-explore-social-media-and-disinformation/
      summary: Network pictures are great tools for exploration but by no means conclusive charts
    - title: TechCrunch - Meta shut down CrowdTangle (2024)
      url: https://techcrunch.com/2024/08/15/meta-shut-down-crowdtangle-a-tool-for-tracking-disinformation-heres-how-its-replacement-compares
      summary: CrowdTangle shut August 14, 2024; Meta Content Library restricts downloads and outside analysis
    - title: TechCrunch - Twitter's restrictive API may leave researchers out in the cold (2023)
      url: https://techcrunch.com/2023/02/14/twitters-restrictive-api-may-leave-researchers-out-in-the-cold/
      summary: Academic Research tier replaced by a paid basic tier
