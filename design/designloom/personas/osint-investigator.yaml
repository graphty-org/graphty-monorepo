id: osint-investigator
name: OSINT Investigator
roster_persona: osint-investigator
tier: A
scope: in-scope
role: Open-Source Researcher at an NGO Investigations Unit, Newsroom OSINT Desk or Corporate-Intelligence Firm
quote: Same username is a weak signal. I need three independent pivots and a captured page for each before I put a name on this.
bio: >-
    Tomas Varga is an open-source intelligence (OSINT) researcher who started at an NGO investigations unit and now works
    for a due-diligence firm. His cases begin with one "selector" -- an email address, an alias, a domain, a phone
    number, a Google Tag ID or a wallet address -- and he expands it outward in Maltego, running transforms against
    WHOIS, passive DNS, breach records, company registries, OpenCorporates, OpenSanctions and Aleph. A case graph
    holds tens to a few thousand entities; the free Maltego edition caps a graph at 10,000. He uses link analysis daily,
    as job postings in his field require ("prior experience with link analysis platforms, such as Maltego, i2 Analyst's
    Notebook, Palantir"), and writes a little Python for custom transforms. He records every pivot with its source,
    captures and hashes each web page with Hunchly, and treats any single link as a lead rather than a finding. When
    he needs metrics he exports GraphML to Gephi to find gatekeepers by betweenness. His deliverable is a report with a
    pivot chain, hashed captures and a graph file that a client, an editor or a court can check step by step.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Attribute a set of accounts, sites or companies to a person or an organization
    - Map the infrastructure (domains, IPs, tracking tags) behind a network of websites
    - Produce a defensible pivot chain in which every link names its source and capture
    - Keep sensitive lookups private (self-hosted transform servers, encrypted saved graphs)
    - Reuse a finished graph in another tool without losing entity types, notes or layout
behaviors:
    - Picks a distinctive seed, because common strings return profiles belonging to unrelated people
    - Sets a per-transform result limit before running lookups, then prunes non-matching profiles and disposable emails
    - Treats each newly found alias or email as a new, independent seed and repeats until searches yield nothing new, credits run out or the question is answered
    - Pins a few entities out of collapsed groups of same-type results and leaves the rest folded
    - Attaches notes to entities he has checked and records the source of every link
    - Switches between block, hierarchical, circular and organic layouts and a list view of the graph as a table
    - Exports GraphML or CSV, computes betweenness in Gephi, and saves GEXF with metrics and layout
    - Looks for the intersection of several weak signals rather than one strong link
frustrations:
    - Transforms that flood the graph with irrelevant results
    - Per-lookup credit budgets that cut a case short
    - A graph that looks more convincing than its evidence supports
    - GraphML that does not round-trip between Maltego, yEd and Gephi
    - Several reports that appear to corroborate a claim but all rest on the same original source
    - Losing the record of which lookup produced which entity
context:
    frequency: daily
    devices:
        - laptop
        - desktop
    voluntary: true
