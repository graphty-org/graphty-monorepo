id: pharmacovigilance-network-analyst
name: Pharmacovigilance Network Analyst
role: Drug Safety Scientist / Academic Pharmacologist
quote: Two thousand Preferred Terms is noise. Grouped into high-level terms and clustered, it starts to look like a syndrome.
bio: >-
    Dr. Giulia Ferri is a drug safety scientist (at a pharma company or a regulator) or an academic pharmacologist who
    mines spontaneous adverse event reports. She downloads FDA Adverse Event Reporting System (FAERS) quarterly files
    rather than the dashboard so she can remove duplicates, maps reactions from MedDRA Preferred Terms to High-Level
    Terms and System Organ Classes, and computes disproportionality statistics (reporting odds ratio, PRR, IC, EBGM). She
    then builds event-event co-reporting networks (partial correlations pruned by LASSO in an Ising model) or drug-event
    bipartite networks in R with igraph, qgraph and IsingFit, detects communities with Louvain, checks them for clinical
    plausibility and reporting bias, and publishes an interactive visNetwork version filterable by significant signals.
    MedDRA's hierarchy is her grouping ontology.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: intermediate
    domain_knowledge: advanced
motivations:
    - Detect signals of disproportionate reporting early
    - Find clusters of co-reported reactions that make clinical sense
    - Spot drug-drug interaction signals
    - Share an interactive network reviewers can filter
behaviors:
    - Deduplicates FAERS reports and selects a cohort (for example 7,082 COVID-19 reports from 2020)
    - Groups reactions to MedDRA High-Level Terms and drops non-specific System Organ Classes such as Investigations
    - Keeps signals with at least 3 cases and a 95 percent interval of the reporting odds ratio above 1
    - Builds an event-event network of HLTs with at least 10 cases and LASSO-pruned partial correlation edges
    - Runs Louvain and checks assortativity by disproportionality and by organ class
    - Publishes a visNetwork HTML filterable by significant ROR
goals:
    - Signal list with disproportionality statistics
    - Clinically plausible reaction clusters
    - Interactive network for supplementary material
frustrations:
    - Reporting biases that the network does not remove
    - Thousands of Preferred Terms are unreadable until grouped
    - Interactive versions are hand-built per study
    - Polypharmacy prediction models offer only embedding scatter plots as visuals
context:
    frequency: monthly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W261
sources:
    - title: Fusaroli et al. 2021 - The COVID-19 adversome
      url: https://www.frontiersin.org/articles/10.3389/fphar.2021.740707/full
      summary: FAERS extraction, MedDRA HLT grouping, ROR signals, Ising/LASSO event network of 136 nodes and 87 links, Louvain clusters, visNetwork
    - title: Drug-adverse event bipartite network study (2022)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8762263/
      summary: Bipartite network features added to disproportionality signal scores
    - title: Decagon (Zitnik et al. 2018)
      url: https://academic.oup.com/bioinformatics/article/34/13/i457/5045770
      summary: Polypharmacy side effect prediction over 645 drugs and 964 side effect types; only a t-SNE visual
