id: phylogenomics-comparative-biologist
name: Phylogenomicist and Comparative Biologist
role: Faculty Member in Phylogenomics and Comparative Biology
quote: Two thousand gene trees and a species tree. I need to see, branch by branch, how many genes agree, how many disagree, and whether hybridization explains it.
bio: >-
    Dr. Mira Okonkwo is a faculty member resolving a clade from hundreds of loci and testing trait evolution on the
    result. Her data are 50 to 500 taxa by 300 to 5,000 gene trees, dated species trees, trait tables, and reference
    trees of 5,000 to 350,000 tips (birds, mammals, seed plants). She runs IQ-TREE (including gene and site concordance
    factors), ASTRAL, PhyParts with its pie-chart script, DiscoVista and DensiTree; she scripts figures in R with ape,
    phytools, BioGeoBEARS, TreeDist and ggtree; she uses Dendroscope and SplitsTree for tanglegrams and split networks,
    and PhyloNetworks and SNaQ in Julia when hybridization is suspected. Her students also work on microbiome data,
    placing 16S features on a reference tree and viewing it beside sample metadata and an ordination in EMPress. She is
    fluent in code and in graph concepts specific to trees and networks (splits, reticulations, Robinson-Foulds
    distance), and she publishes every figure from a script.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: expert
motivations:
    - Show where gene trees agree and conflict on each branch of the species tree
    - Compare concatenation and coalescent trees and say which differences matter
    - Draw a phylogenetic network with hybrid edges and inheritance proportions
    - Map traits and ancestral ranges onto large dated trees legibly
    - Explore reference trees of hundreds of thousands of tips without a desktop viewer stalling
behaviors:
    - Computes gene and site concordance factors and reads "bootstrap / gCF / sCF" branch labels
    - Runs PhyParts and draws per-branch pies of concordant, top alternative, other conflict and uninformative genes
    - Overlays hundreds of gene or bootstrap trees in DensiTree and compares against a consensus
    - Builds tanglegrams in Dendroscope or phytools cophylo and computes tree distances with TreeDist
    - Runs SNaQ for 0, 1, 2 reticulations and plots networks with gamma on hybrid edges
    - Joins trait and metadata tables to tips and draws heatmaps, bars and ancestral-state pies
    - Writes extended Newick, NEXUS and phyloXML and expects tools to read them losslessly
frustrations:
    - PhyParts needs Maven, Java and git to build
    - BioGeoBEARS node pies become obscured and unreadable when slices are small
    - Tanglegrams scale poorly to large trees
    - Classic viewers cannot display trees with more than a few thousand nodes
    - Writing a network for Dendroscope loses gamma values
    - Tree, conflict and network figures each need a different program
