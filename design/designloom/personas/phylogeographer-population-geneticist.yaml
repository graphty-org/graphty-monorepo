      url: https://hackmd.io/@MarisolDominguez/Master-Labcourse-2024
      summary: Lab-course walkthrough of haplotype definition in DnaSP, NEXUS export, PopART networks and Arlequin AMOVA and FST
    - title: dcsoto - Building a haplotype network (2024 blog)
      url: https://dcsoto.github.io/2024/09/30/haplotype-network
      summary: PopART walkthrough; "the trickiest part ... was to figure out how to display the sample ancestry"; file filter workaround
    - title: PopART - Leigh and Bryant 2015
      url: https://datadryad.org/resource/doi:10.5061/dryad.4n4j1/3
      summary: PopART network methods (MSN, TCS, median-joining, tight span walker, integer neighbor-joining), map view, statistics
    - title: r-sig-genetics thread on overlapping pies (2022)
      url: https://stat.ethz.ch/pipermail/r-sig-genetics/2022-July/000238.html
      summary: Paradis - "There is no simple way to handle your problem"; square-root sizes and link lengths as workarounds
    - title: PopART gap masking figure (PLOS ONE)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6490880/figure/pone.0215754.g003
      summary: Gap or ambiguous sites masked so distinct haplotypes merge
    - title: Kong et al. 2016 - critique of median-joining networks
      url: https://www.scilit.net/publications/32fa40b8a50a89a7f4bce5e563de544c
      summary: Argues median-joining networks cannot yield defensible evolutionary interpretations
    - title: Hapsolutely (Vences et al. 2024)
      url: https://mvences.de/p/p1/Vences_A556.pdf
      summary: Separate programs are typically needed for phasing, reformatting input files and network construction
