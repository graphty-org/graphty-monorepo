id: phylogeographer-population-geneticist
name: Phylogeographer and Molecular Ecologist
roster_persona: phylogeographer-population-geneticist
tier: A
scope: in-scope
role: Postdoctoral Researcher in Phylogeography and Molecular Ecology
quote: I have 400 frogs from 30 ponds and one stretch of mitochondrial DNA. I need the haplotype network with pies by region, next to a map in the same colors, before my committee meeting.
bio: >-
    Dr. Lucia Ferreira is a postdoc studying how glaciation, rivers and islands shaped the genetic structure of a frog,
    bird or plant. She sequences one to a few loci (mitochondrial COI, cytochrome b or the control region; chloroplast
    regions in plants) from 100 to 600 individuals at 10 to 40 sites, giving 500 to 1,200 base pairs and 10 to 80
    haplotypes. Her pipeline spans many programs: Geneious or MEGA for alignment, DnaSP to collapse sequences into
    haplotypes and assign populations, PopART for a minimum spanning, TCS or median-joining network, Arlequin for AMOVA
    and pairwise FST, BEAST and FigTree to date splits, QGIS or R for the map, and Illustrator to assemble the
    multi-panel figure. She sometimes scripts the network in R with pegas. She knows substitution models, coalescent
    theory and neutrality tests deeply, but rarely uses centrality or community detection; to her a graph is a
    genealogy of sequences, with edges that count mutations.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: expert
motivations:
    - Argue for glacial refugia, range expansion or barriers to gene flow from where haplotypes sit on the map
    - Produce one figure where the network pies and the map pies use the same colors for the same regions
    - Report haplotype diversity, nucleotide diversity, Tajima's D and AMOVA beside the network
    - Satisfy reviewers who distrust a single network method by showing a network and a tree together
    - Redraw the figure quickly when new samples arrive or a reviewer asks for a different grouping
behaviors:
    - Starts from an aligned FASTA plus a sample sheet with site, latitude, longitude, region and lineage
    - Collapses sequences into haplotypes in DnaSP and exports NEXUS and Arlequin files
    - Types the PopART TRAITS block (one column per population, one row per sample) into the NEXUS file by hand
    - Tries minimum spanning, TCS and median-joining networks and picks by habit and by what reviewers expect
    - Reads circle area as haplotype count, slices as populations, hatch marks as mutations, black dots as unsampled ancestors
    - Drags nodes by hand to stop large pies from overlapping, then cannot reproduce the layout later
    - Exports SVG or PNG and finishes labels, map and statistics table in Illustrator or Inkscape
frustrations:
    - The PopART traits block must be hand-typed in the same sample order as the alignment
    - PopART refuses to show NEXUS files until the file filter is set to All Files
    - Pies overlap in R; the pegas author says there is no simple way to handle it
    - Gap and ambiguous sites are silently masked, merging haplotypes that differ
    - Reviewers question median-joining networks, so a second figure (a tree) is needed
    - Map and network are drawn in different programs and the colors drift apart
context:
    frequency: monthly
    devices:
        - laptop
        - desktop
    voluntary: true
workflows:
    - W390
    - W391
    - W392
    - W393
    - W394
sources:
