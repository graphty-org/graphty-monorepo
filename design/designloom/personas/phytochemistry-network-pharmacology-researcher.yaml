      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9996785
      summary: 4,010 plants, 17,967 phytochemicals, 189,386 plant-part-phytochemical associations, 1,335-compound drug-like subset
    - title: IMPPAT website
      url: https://cb.imsc.res.in/imppat/
      summary: IMPPAT 3.0 with 4,154 plants, 18,314 phytochemicals and 1,576 traditional formulations (read 2026-11-25)
    - title: F1000Research review of 36 herbal network pharmacology studies
      url: https://f1000research.com/articles/14-1384
      summary: 55.6% from China, 25.0% from India; in vitro work in 22.2% and in vivo in 16.7%; no formal risk-of-bias tool
    - title: Network pharmacology with docking and molecular dynamics (PMC11615512)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11615512
      summary: Example of a non-TCM plant study docking against several proteins with 100 ns molecular dynamics
    - title: IMPPAT-based study using BindingDB and Cytoscape 3.7.2 (NIRT)
      url: https://eprints.nirt.res.in/2165/1/202461.pdf
      summary: Indian plant pipeline from IMPPAT compounds through BindingDB targets to Cytoscape
    - title: TM-MC 2.0 (PMC10790428)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10790428/
      summary: 635 Korean, Chinese and Japanese materials, 5,075 prescriptions; compounds matched on the first 14 InChIKey characters
    - title: Freelance network pharmacology service (Fiverr)
      url: https://fiverr.com/qasimghauri/perform-network-pharmacology-and-bioinformatics-analysis-for-your-project
      summary: Network pharmacology plus docking sold for USD 50-100 with 3-12 day delivery
