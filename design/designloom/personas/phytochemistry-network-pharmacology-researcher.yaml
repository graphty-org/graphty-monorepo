id: phytochemistry-network-pharmacology-researcher
name: Phytochemistry Network Pharmacology Researcher
roster_persona: network-pharmacology-graduate-student
tier: B
scope: in-scope
role: Pharmacognosy Lecturer or Natural Products Researcher outside China
quote: TCMSP does not have my plant. I have my own GC-MS peaks, IMPPAT and twenty papers, and the reviewer wants the Latin name and the plant part on every node.
bio: >-
    Dr. Ahmed lectures in pharmacognosy at a university in Pakistan; his counterpart Dr. Nair works on Ayurvedic
    polyherbal formulations at an Indian pharmacy college. Both study plants that TCMSP does not cover. Their compound
    lists come from their own GC-MS or LC-MS runs, from IMPPAT (which records phytochemicals per plant part: root,
    leaf, bark), from Dr. Duke's database and from the literature: 10 to 400 compounds from three sources with no
    shared key. They use SwissADME for drug-likeness, SwissTargetPrediction for 100 to 600 targets, GeneCards for
    disease genes, STRING and Cytoscape for the network, ShinyGO or DAVID for enrichment, and PyRx or AutoDock Vina to
    dock against five to ten proteins, often followed by 100 ns of molecular dynamics. Everything must be free, and
    nobody in the department has formal Cytoscape training; when time is short the pipeline is sometimes outsourced to
    a freelancer for 50 to 100 USD. Reviewers increasingly reject in-silico-only work, and in a 36-study review only
    22.2% included in vitro and 16.7% in vivo experiments. A Northeast Asian variant works on Korean, Kampo and
    Chinese pharmacopoeial materials with TM-MC 2.0, whose compounds are matched on the first 14 InChIKey characters
    and whose prescription table links the work to formula mining.
characteristics:
    expertise: beginner
    time_pressure: high
    graph_literacy: novice
    domain_knowledge: advanced
motivations:
    - Publish a plausible mechanism for a little-studied medicinal plant
    - Use computation as a cheap substitute for wet-lab screening the department cannot afford
    - Show Latin binomials and plant parts in every figure, as journals require
    - Get the whole pipeline done with free tools and without writing code
behaviors:
    - Merges compound lists from own GC-MS or LC-MS, IMPPAT, Dr. Duke's database and papers by name, with duplicates and spelling variants
    - Uses the IMPPAT drug-like subset or SwissADME rules in place of the TCMSP oral bioavailability filter
    - Records the plant part on each herb-compound edge so the herb tier splits into root, leaf and bark
    - Docks against five to ten proteins and runs molecular dynamics on the best pair
    - Follows English and Chinese tutorials step by step and sometimes buys the whole analysis from a freelancer
frustrations:
    - Three compound sources with no shared identifier; names, PubChem CIDs and CAS numbers have to be matched by hand
    - No Cytoscape training and no budget for commercial tools
    - Reviewers reject in-silico-only manuscripts but the lab cannot run experiments for every paper
    - Plant part and Latin name drop out of the network once the spreadsheets are joined
    - Chinese-hosted databases are sometimes unreachable from outside China
context:
    frequency: occasional
    devices:
        - laptop
    voluntary: true
workflows:
    - W430
    - W431
    - W435
sources:
