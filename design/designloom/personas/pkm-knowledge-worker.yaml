id: pkm-knowledge-worker
name: PKM Knowledge Worker
role: Senior Product Manager keeping a "second brain" in Obsidian
quote: Show me what is near the note I am writing, not a hairball of every daily note I ever made.
bio: >-
    Priya is a senior product manager who has kept work and personal notes in Obsidian for three years. Her vault holds
    about 4,000 Markdown notes in nested folders: daily notes, meeting notes, one note per person and per project, and a
    few hundred tags. Notes link to people and projects with wikilinks and with property links such as
    `project: "[[Alpha]]"`. She writes every day and keeps the local graph docked in the right sidebar while she types,
    because it is the quickest way to see related notes. She opens the global graph only occasionally, to tidy up
    unlinked notes or to regain the context of a project she has not touched for weeks, and she finds it a beautiful but
    useless hairball unless she filters out daily notes and templates first. She does not know graph theory; she thinks
    in notes, links, backlinks, hubs and orphans. She has installed Extended Graph from the community plugin directory to
    get saved views and pinning, and she would install another graph plugin before she would leave Obsidian to use a
    separate graph tool. Her notes are private (client names, people notes), so anything that sends them off her laptop
    is a non-starter unless she explicitly opts in.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: none
    domain_knowledge: advanced
motivations:
    - See what relates to the note she is editing without leaving the editor
    - Recover the context of a project after weeks away by starting from its note and following links outward
    - Spot notes nobody links to and decide whether to link, merge or delete them
    - Get a readable, colored overview of the vault by folder, tag or note type for the occasional showcase
    - Keep her notes on her own machine
behaviors:
    - Keeps the local graph docked beside the editor at depth 2 or 3 and lets it follow the active note
    - Hovers a neighbor to preview it and clicks to open it; size by link count is the only metric she reads
    - Filters the global graph with search syntax such as -path:Daily and -tag:template before looking at it
    - Builds color groups from queries (path:Projects, tag:#person) and loses them when she mis-clicks "restore filters"
    - Installs graph plugins from the community directory rather than exporting to another program
    - Shares a graph only as a screenshot, sometimes annotated in a drawing app
frustrations:
    - The global graph is a hairball of daily notes once the vault passes a few thousand notes ("Where am I?")
    - Property links pull unrelated notes of the same type into the local graph at depth 2, with no way to turn them off
    - The layout is different every time she opens the graph, so nothing stays where she found it
    - Filter and color-group settings cannot be saved as named presets and are re-typed or lost
    - Filtering shows only links among the matches; there is no way to add depth to a filtered set
context:
    frequency: daily
    devices:
        - laptop
        - desktop
    voluntary: true
workflows:
    - W324
    - W325
    - W326
    - W327
    - W328
    - W332
sources:
    - title: Obsidian forum - What's the point of the graph view? How are you using it?
      url: https://forum.obsidian.md/t/whats-the-point-of-the-graph-view-how-are-you-using-it/71316
      summary: Self-reports from users with 2,500 unlabeled notes, Kindle highlights and joke notes; graph seen as pretty but unstable and often unused
    - title: Obsidian forum - How do you use the graph view?
      url: https://forum.obsidian.md/t/how-do-you-use-the-graph-view/
      summary: Graph used for orphan maintenance and regaining context; unusable as the vault grows; screenshots annotated to share
    - title: Obsidian forum - Just tried graph view for first time in half a year
      url: https://forum.obsidian.md/t/just-tried-graph-view-for-first-time-in-half-a-year-and/41288
      summary: '"Where am I?" disorientation in the global graph and the request to mark the current note'
    - title: Obsidian forum - Graph view presets to save and load filters and display settings
      url: https://forum.obsidian.md/t/graph-view-presets-to-save-and-load-filters-display-settings/8131
      summary: Users re-use a handful of filter configurations and lose color groups when restoring filters
    - title: Obsidian forum - An option to disable frontmatter links in graph view
      url: https://forum.obsidian.md/t/an-option-to-disable-frontmatter-links-to-show-up-in-graph-view/114940
      summary: Property links clutter the local graph above depth 1; "There is no workaround at the moment"
    - title: Obsidian forum - You all say the graph is useless, let me show you how to use it
      url: https://forum.obsidian.md/t/you-all-say-the-graph-is-useless-let-me-show-you-how-to-use-it/116738
      summary: Local graph docked bottom-right while writing at depth 2 to 3; filter largest groups out, then group the rest
    - title: Obsidian Help - Graph view
      url: https://obsidian.md/help/plugins/graph
      summary: Global and local graph, query filters, color groups, display and force settings, depth slider, Animate
