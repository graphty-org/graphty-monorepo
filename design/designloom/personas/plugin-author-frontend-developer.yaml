      url: https://2024.stateofjs.com/en-US/usage/
      summary: TypeScript is the default for professional front-end developers, who navigate libraries through their types
    - title: Custom Elements Everywhere
      url: https://custom-elements-everywhere.com/
      summary: How front-end frameworks consume web components through properties and events, the mental model this persona brings
    - title: OpenTelemetry JavaScript - Logs
      url: https://opentelemetry.io/docs/languages/js/
      summary: The telemetry integration shape a front-end developer expects a log destination to plug into
    - title: Cytoscape.js - Extensions
      url: https://js.cytoscape.org/#extensions
      summary: 73 listed extensions, mostly UI widgets (context menus, popper tooltips, minimaps, lasso, map underlays)
    - title: AntV G6 - Custom plugin
      url: https://g6.antv.antgroup.com/en/manual/plugin/custom-plugin
      summary: BasePlugin class for tooltips, minimaps and toolbars
    - title: AntV G6 - React node
      url: https://g6.antv.antgroup.com/en/manual/element/node/react-node
      summary: g6-extension-react lets a React component render a node
    - title: Ogma - React tutorial
      url: https://doc.linkurious.com/ogma/latest/tutorials/react/
      summary: Commercial toolkit documents React, Angular and Vue integrations
    - title: Vue - Vue and Web Components
      url: https://vuejs.org/guide/extras/web-components.html
      summary: isCustomElement, property versus attribute binding, CustomEvent detail
    - title: ReGraph - Getting started
      url: https://developers.cambridge-intelligence.com/docs/regraph/getting-started
      summary: Tarball install; the library must be obfuscated in the bundle and source maps never shipped
    - title: Cambridge Intelligence - ReGraph license renewal
      url: https://cambridge-intelligence.com/regraph-license-renewal
      summary: Components stop working after a six-week watermark period when a license expires
    - title: react-cytoscapejs issue 28
      url: https://github.com/plotly/react-cytoscapejs/issues/28
      summary: Listener cleanup is undocumented
