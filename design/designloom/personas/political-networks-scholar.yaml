id: political-networks-scholar
name: Political Networks Scholar of Legislatures and Alliances
roster_persona: survey-network-researcher
tier: B
scope: in-scope
role: Political Scientist (Legislative Cosponsorship, Roll-Call Agreement, Alliance and Conflict, Policy-Actor Networks)
quote: Project the bills onto senators and everyone looks like a party loyalist. Show me the bills, and show me every session the same way.
bio: >-
    Dr. Yetunde Okafor is a political scientist in American and comparative politics who makes political networks her
    whole research program. She is a variant of the archival-affiliation-researcher: the same record-based, two-mode,
    temporal data, but drawn from released records that cover many sessions or many years. Her data are legislator-by-bill
    cosponsorship records for every Congress or legislative period (Fowler's data cover all 280,000 bills from 1973 to
    2004; parlnet covers 27 chambers in 19 European countries plus Israel), member-by-vote roll calls from Voteview keyed
    by ICPSR code, Correlates of War alliance and dispute dyad-years among states, and policy-actor surveys of the
    organizations in a policy field. She works in R (statnet, btergm, NetMix, peacesciencer, Rvoteview), uses UCINET
    for quick descriptives and Pajek or Gephi for figures, and learned ERGM and TERGM at the summer workshops of APSA's
    Political Networks section. Her questions are who cooperates across party lines and how that changes from session
    to session, and whether cosponsorship, alliance or policy ties predict passage, votes or conflict.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Compare cooperation across many sessions or years with the same rules, styling and layout in every panel
    - Keep legislator-by-bill data two-mode so the analysis does not invent copartisan clustering
    - State every threshold and weight rule so a reviewer can rebuild each session's network
    - Fit ERGM, TERGM or bipartite block models in R and show one figure per session in the paper
behaviors:
    - Downloads cosponsorship and roll-call records for every session and joins them to member data by ICPSR code
    - Builds one network per Congress, legislative period or year, with a node set that changes as members and states enter and leave
    - Turns roll calls into agreement networks with a threshold (Andris and colleagues used the crossing point of same-party and cross-party agreement per Congress)
    - Fits bipartite models of legislators and bills (biMMSBM in NetMix) or TERGMs over twelve Congresses with a binary cutoff on cosponsorship counts
    - Cleans alliance and dispute dyad-years (duplicate directed dyads, several dispute onsets in one year) before building yearly networks
    - Draws per-session figures colored by party and sized by degree, and reads cross-party edges and bridges
frustrations:
    - Projecting bills onto legislators inflates clustering and hides bipartisan bills
    - The binary TERGM forces a cutoff on cosponsorship counts that changes the result
    - Agreement-network thresholds are invisible in the published figure
    - Dyad-year files carry duplicate directed dyads and several dispute onsets per year
    - Every session has a different node set, so layouts and comparisons do not line up
    - UCINET, which the field cites, runs only on Windows
