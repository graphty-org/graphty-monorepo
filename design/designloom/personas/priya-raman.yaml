id: priya-raman
name: Priya Raman
role: Malware Analyst / Reverse Engineer
quote: The injection sequence is three calls deep under a function called sub_401A30. Let me open one level of callees at a time without the graph turning into spaghetti.
bio: >-
    Priya Raman is a malware analyst on a security vendor's research team who receives samples from incident response
    and threat intelligence. She works in IDA with the decompiler and in Ghidra for its free decompiler and
    multi-binary projects, with BinDiff for comparing versions and a sandbox for dynamic runs. Her graphs are not
    imported; they are computed by the disassembler from one binary: function graphs whose nodes are basic blocks of
    assembly text joined by taken and not-taken branch edges, and call graphs of functions with their callers, callees
    and data references. She finds a starting point from imports and strings, reads the function graph, renames and
    comments as behavior becomes clear, walks callers and callees one level at a time to find API sequences such as
    process injection, and diffs a new sample against a known family member. She scripts in IDAPython, reads graph
    layout as control flow, and exports flow charts as GDL or DOT for reports and teaching.
characteristics:
    expertise: expert
    time_pressure: medium
    graph_literacy: advanced
    domain_knowledge: advanced
motivations:
    - Explain what a sample does (persistence, C2 protocol, injection, evasion)
    - Extract indicators for threat intelligence and detection engineering
    - Tell whether a new sample is a variant of a known family and what changed
    - Produce annotated flow graphs for reports and for training junior analysts
behaviors:
    - Lets auto-analysis finish in an isolated lab before reading anything
    - Scans imports (network, process, persistence, crypto, file APIs) and strings (URLs, registry keys, mutexes), then follows cross-references
    - Toggles between graph and text views; reads upward edges as loops and green and red edges as taken and not-taken branches
    - Drags blocks to untangle a function graph, saves the custom layout, and collapses groups of blocks into one labeled node
    - Renames functions and variables and checks decompiler output against the assembly
    - Uses the proximity view to see a function's callers, callees and referenced strings by name, with hover previews of code
    - Expands a call graph one level of callees at a time to find an API sequence
    - Diffs two versions in BinDiff, sorts matched functions by similarity and opens changed functions side by side
frustrations:
    - The interesting API sequence is buried several levels of calls deep
    - Call graphs tangle when expanded until nodes are dragged apart, so some analysts give up and use the text call tree
    - Graph views are locked inside the disassembler, so exporting a readable figure for a report is manual
    - Auto names such as sub_401A30 carry no meaning until she renames them
context:
    frequency: daily
    devices:
        - desktop
    voluntary: true
workflows:
    - W115
sources:
    - title: Portland State University - Reverse engineering platforms (malware course notes)
      url: https://web.cecs.pdx.edu/~dmcgrath/courses/Su26/malware/re_platforms.html
      summary: IDA and Ghidra workflow, graph view toggling, edge colors, rename and comment practice
    - title: Varonis - How to use Ghidra
      url: https://varonis.com/blog/how-to-use-ghidra
      summary: Auto-analysis first, imports and strings as starting points, Function Graph window
    - title: Hex-Rays docs - Graph view
      url: https://docs.hex-rays.com/user-guide/disassembler/graph-view
      summary: Basic blocks, branch edge colors, saved custom layouts, grouped nodes, overview window
    - title: Hex-Rays docs - Proximity view
      url: https://docs.hex-rays.com/core/disassembler/concepts/proximity-view
      summary: Callers, callees and data references around a function with hover previews
    - title: SANS ISC diary 25032 - Ghidra call graph
      url: https://isc.sans.edu/diary/25032
      summary: Call graph starts one level deep, expanding a level at a time, tangling, preference for text trees
    - title: zynamics BinDiff manual
      url: https://www.zynamics.com/bindiff/manual/index.html
      summary: Matched functions with similarity and confidence, side-by-side flow graphs colored identical, changed or missing
