id: process-mining-analyst
name: Process Mining Analyst
role: Process Mining Analyst in a Center of Excellence (consultants, internal auditors and clinical pathway analysts as variants)
quote: The slider hides the rare paths, and the rare paths are the findings. I need to know the numbers on this map still add up.
bio: >-
    Priya is a Celonis-certified analyst in a manufacturer's process excellence team who writes SQL and PQL, not
    Python. Her input is not a graph but an event log: one row per activity that happened to a case (a purchase order
    item, a ticket, a patient stay) at a time, usually by a resource. For SAP purchase-to-pay that is hundreds of
    thousands of cases and millions of events (the public BPI Challenge 2019 log has 251,734 cases, 1,595,923 events and
    42 activities). Her first screen is the directly-follows graph: one node per activity, one directed edge per "A was
    immediately followed by B in the same case", with frequency or waiting time on every node and edge. She moves the
    activity and path sliders, opens the variant explorer, filters slow cases into a named data set, finds the wait
    before a rework loop, changes the node attribute from activity to department to see handovers, and checks
    conformance against a reference model. The graph is small (tens of activities, a few hundred edges) but every
    filter re-aggregates millions of rows. Variants: operational excellence consultants doing first looks in Disco,
    internal auditors testing whole populations for skipped approvals and segregation-of-duties violations, and
    clinical pathway analysts. She uses almost none of the vocabulary of network analysis. Celonis Academy pages claim
    224,000 to 300,000+ learners.
characteristics:
    expertise: intermediate
    time_pressure: medium
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Find rework, bottlenecks, late payments and skipped controls, and size their value
    - Trust that a simplified map still tells the truth about frequencies and durations
    - Hand stakeholders a map and an animation they can read, with the exact filter chain behind every exhibit
    - Monitor KPIs and conformance over time
behaviors:
    - Maps CSV columns to case, activity, timestamp and resource roles before anything is drawn
    - Lowers the paths slider first, then the activities slider, and returns to 100 percent to check numbers
    - Switches between frequency and performance (mean, median, total waiting time) overlays
    - Clicks a path or activity to create a filter, then copies and filters into a named data set
    - Changes the node attribute (activity, role, department) to see handovers
    - Replays cases as animated tokens for executives
    - Exports the map, metrics and filtered log with the filter recipe
frustrations:
    - Simplified maps hide the rare paths that are the audit findings, and slider and panel KPIs disagree
    - Hiding an activity filters edges on the built graph instead of rebuilding it, producing wrong frequencies and durations
    - Layouts jump when one edge changes, destroying the mental map
    - Data extraction and event-log building happen outside the tool and take most of the effort
    - Variant explosion in loosely structured processes
