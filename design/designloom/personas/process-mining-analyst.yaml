sources:
    - title: Fluxicon Disco tutorial
      url: https://fluxicon.com/book/read/tutorial/
      summary: 608 purchase orders, column roles, sliders, performance view, copy and filter, animation, handover view
    - title: Fluxicon - Simplification strategies
      url: https://fluxicon.com/book/read/simplification/
      summary: Slider, variation, endpoint and attribute filters; milestones agreed with a domain expert
    - title: van der Aalst - Process mining and directly-follows graph pitfalls (p1101)
      url: https://www.vdaalst.com/publications/p1101.pdf
      summary: Filtering edges instead of rebuilding the DFG gives wrong frequencies and durations in commercial tools
    - title: Zimmermann, Zerbato and Weber - process mining analyst challenges
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11646219/
      summary: Distrust of slider-simplified maps; ETL outside the tools; tool knowledge gaps
    - title: BPI Challenge 2019 report
      url: https://ckmnet-website-blog.s3.amazonaws.com/CKM_BPI_Challenge2019_FINAL+(SUBMIT).pdf
      summary: SAP P2P log with 251,734 cases and 1,595,923 events; 3,384 segregation-of-duties cases
    - title: Celonis docs - KPI calculations
      url: https://docs.celonis.com/en/kpi-calculations.html
      summary: Edge KPIs differ between panel mode and slider mode (via search snippet)
    - title: Microsoft Power Automate Process Mining - process map
      url: https://learn.microsoft.com/en-us/power-automate/minit/process-map
      summary: Mining attribute selection recalculates the map by resource, region or department
    - title: Mennens et al. 2019 - layout stability of process maps (Computer Graphics Forum)
      url: https://diglib.eg.org/handle/10.1111/cgf13723
      summary: Dot layout often fails to keep the mental map; one edge can produce a completely different layout
