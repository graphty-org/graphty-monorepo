id: prosopography-archivist
name: Prosopography Archivist and Database Editor
roster_persona: knowledge-engineer
tier: B
scope: in-scope
role: Archivist and Editor of a Correspondence Catalog and Factoid Prosopography
quote: A tie is a claim someone made from a source. If the tool throws away who claimed it and from which document, it has thrown away the evidence.
bio: >-
    Femke Vos is an archivist responsible for a correspondence catalog and a factoid prosopography, and she contributes
    records to a union catalog and to Wikidata and FactGrid. Her unit of data is not an edge but a factoid, "a
    statement by a modern scholar of a thing a source says about a person", with its source, the date the assertion was
    made as well as the date of the event, a certainty grade, and conflicting claims kept side by side. She works in
    database tools such as nodegoat and Wikibase, writes SPARQL against Wikidata, and publishes views that readers use
    to walk from a person to their correspondents to the records behind each tie. She has watched bespoke project
    websites die when funding ended and wants views that survive staff turnover.
characteristics:
    expertise: advanced
    time_pressure: low
    graph_literacy: intermediate
    domain_knowledge: expert
motivations:
    - Readers can navigate person to correspondents to records with provenance on every link
    - Uncertainty, conflicting claims and date ranges survive into the visualization and the export
    - Authority ids (VIAF, Q-ids, project ids) stay the node ids so data can be re-run and merged
    - A published view that lasts longer than the project grant
behaviors:
    - Models objects (Person, Letter, Place, Event) with sub-objects such as Birth or Letter-sent, each with date and place
    - Grades each statement (Primary, Secondary, Inference, Conjecture or a 1-100 score) and filters views by certainty
    - Stores uncertain dates as ranges or relative statements and uncertain places as polygons
    - Keeps two-mode charter-witness data and projects it only for metrics
    - Queries Wikidata or FactGrid and exports result tables to CSV for network tools
    - Reviews machine-extracted ties from catalog text before they enter the catalog
frustrations:
    - Network tools flatten assertions into bare edges with no source, certainty or asserting scholar
    - Uncertainty and conflicting claims are lost on export
    - Bespoke D3 or sigma.js project sites decay and are retired
    - SPARQL is unforgiving of typos and the query service has no network view
context:
    frequency: weekly
    devices:
        - desktop
    voluntary: false
workflows:
    - W174
    - W179
    - W180
    - W182
    - W318
