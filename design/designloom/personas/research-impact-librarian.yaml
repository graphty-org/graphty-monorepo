      url: https://iassistdata.org/jobs-repository/2026-07-22_2/
      summary: Asks for network analysis and collaboration mapping (VOSviewer, Gephi, NetworkX), Python or R, reproducible workflows, non-technical summaries
    - title: University of Waterloo - Bibliometrics and Research Impact Librarian
      url: https://uwaterloo.ca/lib/about/work-libraries/bibliometrics-and-research-impact-librarian
