id: research-impact-librarian
name: Research Impact Librarian
roster_persona: bibliometric-analyst
tier: A
scope: in-scope
role: Bibliometrics and Research Intelligence Librarian
quote: The dean asked who we collaborate with. I have twenty hours, a roster with half the ORCIDs missing, and an audience that has never seen a network map.
bio: >-
    Tunde Oyelaran is a Health Research Intelligence Librarian at a research university library, with an MLIS and
    three years in a bibliometrics unit. He answers strategic requests from leadership: which institutions and countries
    a department collaborates with, which internal groups bridge to which partners, what a center's topic structure looks
    like. He pulls a department's publications for 5 to 10 years (hundreds to a few thousand records) from Web of
    Science, Scopus, Dimensions or OpenAlex, matches authors to a staff roster by ORCID or Scopus Author ID, cleans names
    in Python, R or OpenRefine, and uses InCites and SciVal for indicators and their built-in world maps. When a question
    is about structure rather than counts, he builds organization and country co-authorship maps and keyword maps in
    VOSviewer or Gephi and delivers them as a short report or a Tableau dashboard "for non-technical audiences" with
    documented methods. He is often a team of one and works to a fixed hour budget per report, like the NIH Library's
    20 staff hours and 8-week turnaround.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Answer a leadership question with a clear picture and a defensible method inside the hour budget
    - Reuse the same cleaning and mapping steps for the next department instead of rebuilding by hand
    - Show collaboration structure that SciVal's tables and world map cannot show
    - Keep reports on named researchers accurate, because errors are visible and sensitive
behaviors:
    - Scopes the question first and decides whether a network is needed or a SciVal table answers it
    - Exports within each database's limit or pulls from OpenAlex, Crossref or Semantic Scholar APIs
    - Matches authors to a roster by ORCID or Scopus Author ID and keeps a thesaurus of name and organization variants
    - Uses fractional counting for organization and country co-authorship and caps authors per document
    - Builds organization, country and keyword maps with the same settings as earlier reports
    - Writes a methods appendix and a plain-language summary for a dean or center director
    - Produces dashboards in Tableau or Shiny and shares interactive VOSviewer Online links
frustrations:
    - Name homonyms create false bridges in co-author networks, worst for common Chinese and Korean surnames
    - Every report rebuilt by hand because the cleaning and mapping steps are not saved as a repeatable run
    - Hour budgets cut cleaning short
    - Export limits that change between releases and differ by database
    - Network maps that non-technical readers cannot read without explanation
context:
    frequency: weekly
    devices:
        - desktop
        - laptop
    voluntary: true
