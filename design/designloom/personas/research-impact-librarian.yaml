    - title: NIH Library bibliometrics classes and services
      url: https://www.nihlibrary.nih.gov/about-us/news/bibliometrics-classes-and-services
      summary: Teaches VOSviewer network visualization; basic service capped at 20 staff hours per report
    - title: SciVal Collaboration module
