id: supply-chain-analyst
name: Supply Chain Network Analyst
role: Supply Chain Risk Manager / Supplier Risk Analyst
quote: A low-cost sensor can stop a whole vehicle line. Tell me which sites cost us the most revenue while they are
    down, and tell me within hours of the earthquake, not weeks.
bio: >-
    David is a supply chain risk manager at an automotive manufacturer. He spent ten years in logistics operations
    before moving into risk, and he now owns the company's exposure model and its event response. His network is not a
    social graph: a node is a part or a manufacturing process at one supplier site or plant, an edge is a directed flow
    of material, and the whole thing is mostly a directed acyclic graph that runs from raw materials up through ten
    tiers to finished vehicles. The published Ford model behind this work covered 50+ plants, 4,400+ tier-1 sites and
    130,000 parts. He ranks sites by the money lost while each is down for its time to recover, which is an optimization
    over the bill of materials, inventory and alternate sources -- not a centrality ranking -- and Ford found that
    exposure was not correlated with how much the company spends at a supplier. When an event alert arrives he draws a
    radius around the location, finds the supplier sites inside it, and follows parts up to products and revenue. His
    team works in a vendor platform (Resilinc, Everstream or Interos), an internal SQL-plus-solver model with a Tableau
    map, Excel and supplier surveys. He is comfortable with SQL and pivot tables, not with graph databases.
characteristics:
    expertise: intermediate
    time_pressure: high
    graph_literacy: moderate
    domain_knowledge: advanced
motivations:
    - Know the revenue at risk for every site over its time to recover before an event happens
    - Respond to an event alert within hours with a list of exposed sites, parts, products and revenue
    - Find the cheap, overlooked parts and sub-tier sites that carry high exposure
    - Stop monitoring sites that carry no exposure so effort goes where it matters
    - Justify dual sourcing, safety stock and diversification spend with quantified impact
behaviors:
    - Defines the graph as part-at-site nodes with directed material-flow edges, built from MRP bills of materials, routings, purchasing and inventory records
    - Collects time to recover per site from supplier surveys and flags where time to survive (from inventory and alternates) is shorter than time to recover
    - Runs a disruption scenario for every node, plant, part or region and stores the lost units or margin as a per-site performance impact
    - Treats propagation as AND across required bill-of-materials inputs and OR across alternate sources, with inventory as a time buffer, not as plain reachability
    - Draws a 50 or 100 mile radius around an earthquake, flood or fire and propagates from the sites inside it to parts, products and revenue
    - Asks which tier-1 suppliers share a hidden tier-2 source and which inputs are single-sourced
    - Hands executives a map with circles sized by impact linked to ranked supplier and part tables
    - Uses centrality only on hub networks such as ports and airports, not on the bill-of-materials graph
goals:
    - Rank every supplier site by lost revenue or margin over its time to recover
    - Screen for sites whose time to survive is shorter than their time to recover
    - Turn an event location into confirmed exposure and secured alternates within a day
    - Make sub-tier dependencies visible, and mark unknown sub-tier links as unknown rather than absent
    - Track how exposure changes as sourcing, inventory and products change
frustrations:
    - Sub-tier data is self-reported by suppliers, often optimistic, and depends on their upload discipline across tiers
    - A traditional analysis of 4,000+ tier-1 sites would take two or three years by hand
    - Industry visibility into tier two and beyond is far below tier one (42 percent versus 95 percent in a 2025 survey)
    - Generic graph tools default to centrality, which does not track exposure in a bill-of-materials graph
    - Geographic views and network views live in different tools and do not share a selection
    - Supplier data is scattered across ERP systems, with one supplier under many names at several tiers
context:
    frequency: weekly
    devices:
        - desktop
        - laptop
    voluntary: true
workflows:
    - W11
    - W215
    - W216
    - W217
sources:
    - title: Simchi-Levi et al., Identifying Risks and Mitigating Disruptions in the Automotive Supply Chain (Interfaces, 2015)
      url: https://hdl.handle.net/1721.1/101782
      summary: Ford time-to-recover and time-to-survive model; part-at-site nodes, LP impact per node, 4,534 sites ranked, exposure not correlated with spend
    - title: Resilinc cyber supply chain risk management case study (NIST)
      url: https://www.nist.gov/document/nistusrp-resilinc-cyber-scrm-case-studypdf
      summary: Site and part level mapping, event radius selection, impacted parts, products and revenue at risk
    - title: Creating More Resilient Supply Chains (MIT Sloan Management Review)
      url: https://sloanreview.mit.edu/article/creating-more-resilient-supply-chains
      summary: Cisco knew of the 2011 tsunami within 40 minutes and assessed 300+ suppliers within 12 hours
    - title: McKinsey supply chain risk pulse survey
      url: https://www.mckinsey.com/capabilities/operations/our-insights/supply-chain-risk-survey
      summary: 95 percent visibility into tier-one risk versus 42 percent into tier two or beyond (read via search summary)
    - title: Exiger SCRM Analyst job posting
      url: https://jobs.insightpartners.com/companies/exiger/jobs/74802609-scrm-analyst-healthcare-supply-chain-risk
      summary: Postings ask for Excel, SQL, Python and Tableau or Power BI, not graph databases
    - title: Supply chain analysis with Neo4j GDS and Bloom
      url: https://neo4j.com/developer-blog/supply-chain-neo4j-gds-bloom/
      summary: Betweenness applied to hub networks such as airports and ports
    - title: Supply Chain Visualization With Graph Analytics - Cambridge Intelligence
      url: https://cambridge-intelligence.com/supply-chain-management-with-graph-analytics/
      summary: Webinar on using graph visualization for supply chain risk analysis and network optimization
    - title: Supply Chain Graph Database Use Cases - Neo4j
      url: https://neo4j.com/use-cases/supply-chain-management/
      summary: How graph databases improve supply chain visibility, risk analysis, and traceability
    - title: Towards Knowledge Graph Reasoning for Supply Chain Risk Management
      url: https://www.tandfonline.com/doi/full/10.1080/00207543.2022.2100841
      summary: Research on using GNNs and knowledge graphs to detect hidden supply chain risks
