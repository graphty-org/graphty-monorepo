sources:
    - title: Robinaugh et al. 2020 - The network approach to psychopathology, a review of the literature 2008-2018
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7334828
      summary: 363 articles, 204 empirical; 141 of 170 network psychometrics papers used cross-sectional data; median N 508
    - title: Epskamp, Borsboom and Fried 2018 - Estimating psychological networks and their accuracy (bootnet tutorial)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5809547
      summary: PTSD example (N 359, 17 symptoms); edge bootstraps, case-dropping, CS strength 0.44, betweenness and closeness 0.05
    - title: Burger et al. 2023 - Reporting standards for psychological network analyses in cross-sectional data
      url: https://pure.uva.nl/ws/files/184239260/ContentServer_2_.pdf
      summary: Redundancy merging, raw centrality, no double thresholding, shared layouts and maxima, dashed negative edges for print
    - title: qgraph reference manual
      url: https://cran.r-project.org/web/packages/qgraph/qgraph.pdf
      summary: maximum, minimum and cut arguments; colorblind theme called the de facto standard while classic green-red stays the default
    - title: networktools bridge reference
      url: https://search.r-project.org/CRAN/refmans/networktools/html/bridge.html
      summary: Bridge strength and bridge expected influence need a community assignment per node
    - title: bootnet GitHub issues 108, 129 and 139
      url: https://github.com/SachaEpskamp/bootnet/issues/139
      summary: User reports of 10+ hour bootstraps (N 2,000, 60-70 nodes), label overlap and not positive definite errors
    - title: Bringmann et al. 2019 - What do centrality measures measure in psychological networks?
      url: https://research-collection.ethz.ch/bitstream/20.500.11850/383309.1/1/Bringmannetal.2019JAP.pdf
      summary: Betweenness and closeness assume shortest-path flow and are especially unsuitable for psychological variables
