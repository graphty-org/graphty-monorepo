sources:
    - title: Saqr 2023 - Temporal network analysis -- introduction, methods and analysis with R (arXiv 2307.12339)
      url: https://arxiv.org/abs/2307.12339
      summary: MOOC forum tutorial; durations for posts with no clear end time, degree above 20 subset, tsna metrics and tPath reachability
    - title: ndtv vignette (CRAN)
      url: https://cran.r-project.org/web/packages/ndtv/vignettes/ndtv.pdf
      summary: filmstrip, timePrism, slice parameters, overlapping windows, sparse low-turnover networks animate best
    - title: ndtv compute.animation reference
      url: https://search.r-project.org/CRAN/refmans/ndtv/html/compute.animation.html
      summary: Chained layouts seeded with the previous slice's coordinates
    - title: tsna vignette (CRAN)
      url: https://cran.r-project.org/web/packages/tsna/vignettes/tsna_vignette.html
      summary: tSnaStats sliding-window metrics, tPath and forward reachable sets
    - title: Holme and Saramaki 2012 - Temporal networks (arXiv 1108.1780)
      url: https://arxiv.org/abs/1108.1780
      summary: Contact sequences and interval graphs; information is always lost when projecting to a static graph
    - title: pathpy temporal networks tutorial
      url: https://ingoscholtes.github.io/csh2018-tutorial/4_temporal_networks.html
      summary: Temporal network construction, causal paths with a maximum waiting time, look-ahead layouts
