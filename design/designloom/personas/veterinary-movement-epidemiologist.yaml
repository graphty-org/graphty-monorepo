sources:
    - title: Noremark and Widgren, EpiContactTrace - an R package for contact tracing (BMC Veterinary Research 2014, 10:71)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3974595/
      summary: Movement row format, ingoing and outgoing contact chains that respect movement order, NetworkStructure and NetworkSummary outputs, per-holding HTML and PDF reports, 70,190-movement example dataset and the 2010 Swedish foot-and-mouth disease exercise
    - title: Sequeira et al., A systematic scoping review and thematic analysis of livestock and poultry movement networks (PLoS ONE 2025, 20(7):e0328518)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12279109/
      summary: 203 studies in 52 countries, 2006-2023 (cattle 40.3%, swine 33.2%, poultry 13.0%); five themes; 89.2% of studies in high- or upper-middle-income countries; data sources and their gaps
    - title: Lentz et al., Disease spread through animal movements - a static and temporal network analysis of pig trade in Germany (PLoS ONE 2016)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4859575/
      summary: 97,980 premises and 6,359,697 transactions (HI-Tier, 2011-2014); static reach overstated by almost 35%; betweenness best for targeted removal at scale
    - title: Buttner et al., Efficient interruption of infection chains by targeted removal of central holdings in an animal trade network (PLoS ONE 2013)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3771899/
      summary: Targeted removal by seven measures against random removal; out-degree best in a pyramidal pork supply chain; NetworkX and SAS
    - title: Fielding et al., Contact chains of cattle farms in Great Britain (Royal Society Open Science 2019)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6408381/
      summary: Cattle Tracing System 2001-2015, about 70,000 holdings a year; ingoing contact chain sizes; R with igraph and EpiContactTrace
    - title: Leung, Rudge and Fournie, Simulating contact networks for livestock disease epidemiology - a systematic review (Journal of the Royal Society Interface 2023)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10189310/
      summary: 37 network-simulation models; traceability systems missing or unshared especially in low- and middle-income countries
