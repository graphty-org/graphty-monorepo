id: V01
name: Welcome
description: "Landing screen for first-time users and users without loaded data. Provides clear paths to get started:
  import data, try sample datasets, or resume recent projects. Designed to minimize time-to-first-visualization."
workflows:
  - W14
  - W18
layout:
  type: single-column
  zones:
    - id: header
      position: header
      components:
        - toolbar
      height: 64px
      visibility:
        base: visible
        md: visible
        lg: visible
    - id: main
      position: main
      components:
        - file-drop-zone
        - button
        - sample-data-dialog
      max_width: 600px
      padding:
        base: 16px
        md: 24px
        lg: 48px
      visibility:
        base: visible
    - id: footer
      position: footer
      components:
        - keyboard-shortcut
      height: 48px
      visibility:
        base: hidden
        md: visible
  centered: true
states:
  - id: default
    type: default
    description: Fresh start state with import options prominently displayed
  - id: empty
    type: empty
    description: Same as default - this IS the empty state for the app
  - id: loading
    type: loading
    description: File being parsed and validated
  - id: error
    type: error
    description: Import failed or file invalid
routes:
  - path: /
    title: Graphty - Graph Analysis Made Visual
    requires_auth: false
  - path: /welcome
    title: Welcome - Graphty
    requires_auth: false
data_requirements:
  - id: recent-projects
    source: local-storage
    required: false
    loading_state: default
    error_state: default
  - id: sample-datasets
    source: api
    required: false
    loading_state: default
    error_state: default
sources: []
version: 1.0.1
created_at: 2026-01-16T16:20:57.646Z
updated_at: 2026-01-16T16:41:22.782Z
