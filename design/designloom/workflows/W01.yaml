goal: >-
    **Intent**: Rapidly understand an unfamiliar graph dataset before committing to deep analysis. User needs to determine
    if the data is suitable for their question, identify data quality issues, and formulate initial hypotheses.


    **Mental Model**: "Triage" - quickly assessing what you're working with before diving in. Like a doctor's initial
    assessment before ordering tests.


    **Task Phases** (the order follows Gephi Quick Start, Programming Historian and the Cytoscape Network Analyzer;
    no source gives minutes for any step, so durations are unvalidated):

    1. **Read the counts** - Node and edge counts against what the user expected (Programming Historian's sanity check
    is 119 nodes and 174 edges); size decides whether sampling or filtering is needed (W299)

    2. **Structure check** - Directed or undirected as loaded (Gephi CSV defaults to directed, Cytoscape Analyzer to
    undirected), weighted or not, unique versus duplicate edges, self-loops, reciprocal pairs collapsed

    3. **Global descriptors** - Average degree, density, connectedness and component count with the giant component's
    share, transitivity; diameter and path lengths only on the giant component (NetworkX raises an error on a
    disconnected graph)

    4. **Look at hubs** - Sort the degree list and check the top entries for artifacts (a mailing list, an Unknown
    placeholder, a consortium paper)

    5. **Run a layout** - Force-directed until balanced, prevent overlap, size nodes by degree

    6. **Reduce clutter** - Keep the giant component, or filter degree at 2 or more

    7. **Attribute assessment** - Inspect sample rows and attribute completeness


    **Decision Points**:

    - Is graph size manageable or does it require sampling/filtering?

    - Does structure (directed/undirected, weighted) match domain expectations?

    - Are there data quality red flags requiring cleaning?

    - Should I proceed with this dataset or seek better data?


    **Information Needs**:

    - Node/edge counts and their ratio (sparse vs dense indicator)

    - Connectivity status (single component or fragmented?)

    - Degree distribution shape on a log-log CCDF (heavy-tailed or not); a power law only as a fitted, tested claim
    (W37), never read off the plot, and no hub cut-off at the mean plus three standard deviations

    - Attribute completeness percentages

    - Sample of actual node/edge data to verify interpretation

    - Self-loop count, duplicate (parallel) edge count and reciprocal pairs collapsed at import

    - Isolates count; diameter labeled as computed on the giant component

    - Top of the degree list, to spot artifact hubs

    - What each oddity usually means: unexpected component counts point to id mismatch or duplication, isolates to
    edges that did not attach, doubled edges to an undirected file loaded as directed, self-loops to alias problems


    **Pain Points**:

    - Large datasets can crash or hang tools during initial load

    - Unclear what "normal" looks like for this domain

    - Attribute names may be cryptic without documentation

    - Missing values may not be obvious

    - Path statistics fail or mislead on a disconnected graph

    - Artifact hubs top the degree list and are mistaken for findings

    - The first view is a hairball until a layout runs


    **Data Flow**:

    - Input: Raw graph file (CSV, JSON, GraphML) or database connection

    - Transformations: Basic statistics computation, distribution calculation

    - Output: Mental model of dataset + decision to proceed/clean/abandon
success_criteria:
    - metric: Time to basic understanding
      target: Unvalidated -- no source gives a duration; earlier 15-minute target had no evidence
    - metric: Data quality issues identified
      target: All major issues flagged
    - metric: Proceed/abandon decision confidence
      target: User can articulate why they're proceeding or not
sources:
    - title: Broido and Clauset 2019 - Scale-free networks are rare (Nature Communications)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6399239/
      summary: Before computing statistics, turn each non-simple property (direction, weight, layers) into a simple graph by a stated transformation; degree tails fitted against alternatives, not assumed scale-free
    - title: Brown University Gephi LibGuide
      url: https://libguides.brown.edu/gephi
      summary: Network analysis workflow starting with data preparation and basic statistics
    - title: Gephi Quick Start
      url: http://gephi.org/quickstart/
      summary: ForceAtlas 2, prevent overlap, size by degree, degree range filter at 2
    - title: Programming Historian - Exploring and analyzing network data with Python (Ladd et al.)
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: Count sanity check, density, connectedness, diameter on the largest component, transitivity
    - title: Cytoscape - Network Analyzer
      url: https://manual.cytoscape.org/en/3.10.3/_sources/Network_Analyzer.md.txt
      summary: Directed or undirected prompt (default undirected); components, diameter, path length, clustering
    - title: NodeXL - a guide to network insights
      url: https://dspace.stir.ac.uk/retrieve/f1292af1-5cdb-400b-820a-bccae8f82e1f/NodeXL%20-%20a%20guide%20to%20network%20insights%20-%20Author%20Version.pdf
      summary: Overall metrics separate unique edges, duplicate edges and self-loops
    - title: Duke University Library - Gephi visualizing
      url: https://guides.library.duke.edu/gephi/visualizing
      summary: Giant component filter to reduce clutter
