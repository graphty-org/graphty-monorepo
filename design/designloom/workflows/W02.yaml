starting_state:
    data_type: "overview-first variant: graph loaded in full; search-first variant: empty canvas over a live database or very large file"
    node_count: "overview-first: up to a few thousand elements drawn in full; search-first: stored graph of any size, tens to a few thousand on screen"
    edge_density: any
