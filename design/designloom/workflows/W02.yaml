goal: >-
    **Intent**: Read a graph that is already loaded and drawn in full: find its clusters, hubs and outliers and pick
    the elements worth a closer look. This is the interactive reading loop between W01 (counts, structure and data
    quality before trusting the data) and W43 (styling a figure for export). It ends in understanding, not a file.


    **Scope**: Only graphs small enough to draw whole (up to a few thousand elements). For a stored graph too large
    to draw, or a live database, the documented start is a search, not an overview (van Ham and Perer, InfoVis 2009):
    see W3024 (generic), W142 and W143 (graph database explorers), W06, W88 and W89 (investigators start from an
    alerted entity, a selector or a name) and W324 (a note vault starts from the local graph beside the open note).


    **Mental Model**: Shneiderman's "overview first, zoom and filter, then details-on-demand" is a design guideline,
    not an observed user sequence. The tutorials that walk a user through a loaded graph (Gephi Quick Start for Gephi
    and Gephi Lite, Cytoscape's basic data visualization tutorial, Graphistry's UI guide) use the same actions but
    interleave them with layout, appearance and metrics, and loop rather than run once. The phases below are those
    tutorial steps, in the order the tutorials give them.


    **Task Phases**:

    1. **Draw the whole graph** - Run a force layout (ForceAtlas 2 in Gephi) and size nodes by a degree ranking with a
    minimum and maximum size, so hubs stand out (Gephi Quick Start, "Appearance")

    2. **Zoom, pan and select** - Scroll to zoom, drag the background to pan, select nodes one at a time or with a
    rectangle or lasso (Gephi Lite); recenter to get back to the whole graph

    3. **Filter** - Hide low-degree nodes with a degree range of 2 or more (Gephi "Degree Range"), or keep nodes whose
    attribute passes a threshold (Cytoscape column filter; matching nodes are highlighted); in Graphistry, drag across
    a histogram to keep a range of values

    4. **Grow the selection to neighbors** - Add the first neighbors of the selected nodes, and repeat for the second
    degree (Cytoscape "First Neighbors of Selected Nodes")

    5. **Details on demand** - The selection limits the node table to its rows, and selecting table rows selects the
    nodes (Cytoscape); sort and search the table (Gephi Data Laboratory); click a node or a table row to find it in
    the graph (Graphistry)


    **Decision Points**:

    - Which areas look interesting enough to zoom into?

    - What filter criteria will reveal vs. hide important structure?

    - When to stop exploring and start targeted analysis?

    - Is the current view answering my question or do I need to reconfigure?


    **Information Needs**:

    - Overview: Overall network size, presence of clusters, hubs and outliers

    - Zoom: Local structure, node labels become readable

    - Filter: What share of the data remains, did important nodes disappear?

    - Details: All attributes of selected elements, and their neighbors


    **Pain Points**:

    - Large graphs become a "hairball" - impossible to see structure

    - Losing context/orientation when zoomed in

    - Not knowing what filter criteria would be useful

    - Difficulty returning to a previous view state


    **Data Flow**:

    - Input: Loaded graph with a layout applied

    - Transformations: Zoom level changes, filter application, selection and its neighbors

    - Output: Understanding of graph structure + specific elements of interest identified
success_criteria:
    - metric: Pattern discovery
      target: User identifies at least one structural pattern
    - metric: Orientation maintained
      target: User can describe where they are in relation to whole graph
    - metric: Navigation fluidity
      target: Transitions feel smooth, not jarring
sources:
    - title: Shneiderman, The Eyes Have It (1996)
      url: https://www.cs.umd.edu/~ben/papers/Shneiderman1996eyes.pdf
      summary: Design guideline "overview first, zoom and filter, then details-on-demand"; not an observed user sequence
    - title: Gephi Quick Start (desktop and Gephi Lite)
      url: https://gephi.org/quickstart/
      summary: Interact (zoom, pan, select by rectangle or lasso), size by degree ranking, ForceAtlas 2, degree range filter at 2, Data Laboratory sort and search
    - title: Cytoscape tutorial - Basic Data Visualization
      url: https://cytoscape.org/cytoscape-tutorials/protocols/basic-data-visualization/
      summary: Column filter highlights matching nodes; First Neighbors of Selected Nodes, repeated for second degree; selection limits the Node Table
    - title: Graphistry UI guide
      url: https://hub.graphistry.com/docs/ui/index/
      summary: Click a node for details; drag across a histogram to keep a range; click a Data Inspector row to find it in the graph
    - title: van Ham and Perer, Search, Show Context, Expand on Demand (InfoVis 2009)
      url: https://dig.cmu.edu/publications/2009-doigraphs.html
      summary: For large graphs an overview is often not relevant or practical; why this workflow is limited to graphs drawn in full (search-first is W3024)
