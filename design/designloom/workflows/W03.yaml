goal: >-
  **Intent**: Systematically investigate graph data through hypothesis-driven exploration. User has a question and wants
  to find a defensible answer through iterative refinement.


  **Mental Model**: "Scientific method" - observe patterns, form hypothesis, test with algorithms, refine understanding.
  Also like detective work - following leads, testing theories, building a case.


  **Task Phases**:

  1. **Question** - Define what you want to know (descriptive, comparative, predictive, diagnostic)

  2. **Explore** - Visual and statistical exploration, try different views/encodings

  3. **Hypothesize** - Formulate specific, testable hypothesis based on observations

  4. **Test** - Apply appropriate algorithms, validate against baselines

  5. **Refine** - Document findings, generate follow-up questions, or adjust approach

  6. **Conclude** - Draw confident conclusions when evidence is sufficient


  **Decision Points**:

  - Is the question well-defined enough to answer?

  - Which visual encoding reveals the pattern I'm looking for?

  - Is my hypothesis confirmed, refuted, or inconclusive?

  - Should I continue iterating, pivot to a new hypothesis, or conclude?

  - How confident am I in my conclusions?


  **Information Needs**:

  - Question phase: Clear problem statement, success criteria

  - Explore phase: Multiple centrality measures, community structures, distributions

  - Test phase: Algorithm results, comparison to null models/baselines

  - Conclude phase: Evidence summary, confidence level, limitations


  **Pain Points**:

  - Analysis paralysis - too many possible directions

  - Confirmation bias - seeing patterns that aren't there

  - Not knowing when "enough" evidence has been gathered

  - Difficulty documenting analysis path for reproducibility


  **Data Flow**:

  - Input: Graph + research question

  - Transformations: Algorithm execution, statistical tests, visualizations

  - Output: Documented findings with confidence levels and limitations
success_criteria:
  - metric: Question answered
    target: Clear conclusion with supporting evidence
  - metric: Reproducibility
    target: Analysis steps documented for replication
  - metric: Confidence articulated
    target: User can state confidence level and limitations
