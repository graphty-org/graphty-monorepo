starting_state:
    data_type: alerted customer, account or claim plus its identifiers, transactions and links to prior alerts and cases
    node_count: 20-500 drawn (from a store of millions)
    edge_density: sparse, with a few very high-degree identifiers
    user_expertise: intermediate
goal: >-
    **Intent**: Decide whether one alerted customer, account or claim is isolated or connected to other suspicious
    entities, alerts or cases, and close it or escalate it with a written reason. This is the most frequent graph question
    in financial crime: Level 1 and Level 2 alert reviewers and insurance special investigation unit staff ask it many
    times a day. It is a 1 to 2 hop look from a seed, not a whole-graph analysis; finding rings across the whole customer
    base is W119, and following the money is W120.


    **Mental Model**: "Is this one connected to anything we already know is bad?" The analyst reads the neighborhood as a
    list of specific links (this device, this phone, this payout account, this wire) and each link must be explainable on
    its own. Shared identifiers are leads, not proof.


    **Task Phases**:

    1. **Open the alert** - Search the alerted entity by name, account or claim number and open it with its
    triggering transactions and profile

    2. **Show the neighborhood** - Expand 1 hop to identifiers, accounts, counterparties and claims, then a
    second hop to other customers sharing them; style nodes by open alert, prior case, prior SAR and known fraud label

    3. **Discount hubs** - Read how many accounts share each identifier; hide or flag identifiers above a cap (a
    public IP address, a busy garage, a bank branch) so they do not link innocent people

    4. **Read the connected group** - Take the connected component that remains, read each shared link and its
    dates, check the triggering transactions on a short timeline against expected activity

    5. **Decide one case or several** - Merge connected alerts into one case or keep them apart

    6. **Close or escalate** - Record the decision with the specific links and transactions that decided it,
    annotate the view and export the image and the table of links for the case file


    **Decision Points**:

    - Which identifier types count as links for this alert type, and above what sharing count is an identifier noise?

    - One hop or two? Expanding further rarely helps a Level 1 decision and quickly becomes a hairball

    - Is the shared detail coincidental (family members, a shared office) or suspicious?

    - Close with rationale, escalate to Level 2, or (insurance) refer to special fraud processing?

    - Are several open alerts really one network that should be investigated once?


    **Information Needs**:

    - Neighborhood with flags for open alerts, prior cases and prior SARs

    - For each identifier, how many accounts share it, so hubs can be discounted

    - The reason for every link (which identifier, which transaction, which claim) and its date

    - Triggering transactions with amount, direction, counterparty and time, against the customer's expected activity

    - Component size after hubs are removed


    **Pain Points**:

    - Most alerts are false positives (a RUSI working paper cites about 70 to 95 percent), so speed with a reason matters
    more than depth

    - Data gathering across separate systems dominates the time

    - Expanding to every neighbor produces a hairball

    - Super-connected identifiers merge innocent customers

    - What the analyst saw in the graph has to be retyped into the case rationale


    **Data Flow**:

    - Input: Alert with the flagged entity id; customer, account, identifier and transaction records; prior alert, case
    and SAR flags; or (insurance) the referred claim and its parties

    - Transformations: Seeded 1-2 hop expansion, identifier degree count and hub cap, connected component, short timeline

    - Output: Close or escalate decision with rationale naming the deciding links, annotated image and link table for the
    case file
success_criteria:
    - metric: Explainable decision
      target: Every close or escalate rationale names the specific identifiers or transactions that link the entity, with dates
    - metric: Hub handling
      target: User can see the sharing count of every identifier and exclude those above a cap before reading the group
    - metric: Case-file handoff
      target: The image and the link table export together without retyping
sources:
    - title: FFIEC BSA/AML Examination Manual - Suspicious Activity Reporting
      url: https://bsaaml.ffiec.gov/manual/AssessingComplianceWithBSARegulatoryRequirements/04
      summary: Alert management by Level 1, Level 2 and quality control is separate from alert generation and the SAR decision
    - title: Linkurious - AML investigation solution
      url: https://linkurious.com/aml-investigation-solution
      summary: Vendor; the subject's 1-2 hop neighborhood styled by open alert and prior SAR to decide one case or several
    - title: Linkurious Enterprise Watchtower brochure
      url: https://resources.linkurio.us/hubfs/On-demand%20Resources/PDFs/Brochure_Linkurious-Enterprise-Watchtower.pdf
      summary: Consolidates alert results relating to the same entity into a single case
    - title: Exploring fraud detection with Neo4j and Graph Data Science, part 2
      url: https://neo4j.com/blog/developer/exploring-fraud-detection-neo4j-graph-data-science-part-2/
      summary: Very high-degree identifiers treated as noise; identifiers capped at 10 or fewer accounts
    - title: Neo4j customer story - Zurich Insurance
      url: https://neo4j.com/customer-stories/zurich-insurance/
      summary: Investigators switch from the rule-based tool to the graph application for each escalated claim
    - title: Neo4j - Beyond the alert
      url: https://neo4j.com/?p=435608
      summary: Investigators must judge significance, weigh legitimate explanations and document their reasoning
    - title: Redhead - SWIFT Institute / RUSI working paper (2021)
      url: https://swift.com/swift-resource/252235/download
      summary: False-positive rates about 70 to 95 percent (read through search summary)
    - title: Cambridge Intelligence Fraud Investigation
      url: https://cambridge-intelligence.com/enterprise-fraud-management-investigation-v-detection/
      summary: Distinguishes fraud detection from investigation workflows
