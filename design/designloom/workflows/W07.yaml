goal: >-
  **Intent**: Proactively search for threats in network/system data before they cause damage. Unlike alert-driven
  investigation, user forms hypotheses about potential threats and queries the graph to find evidence.


  **Mental Model**: "Hunting expedition" - you're not waiting for prey to come to you, you're actively tracking it based
  on known behavior patterns. Also like "pattern matching" against known attack playbooks (TTPs).


  **Task Phases**:

  1. **Hypothesis Formation** - Based on threat intelligence, known TTPs, or anomaly signals

  2. **Pattern Translation** - Convert hypothesis into a graph query/pattern

  3. **Query Execution** - Search for matching patterns in the data

  4. **Result Triage** - Review matches, investigate promising ones, filter noise

  5. **Iteration** - Refine query based on findings, expand or narrow scope

  6. **Response** - If threat found, trigger incident response; if not, document hunt


  **Decision Points**:

  - What threat hypothesis should I hunt for?

  - How do I translate TTP into a graph pattern?

  - Are query results true threats or false positives?

  - Should I refine the query or try a different hypothesis?

  - When is the hunt complete?


  **Information Needs**:

  - Threat intelligence feeds (current TTPs, IOCs)

  - Entity behavior baselines (what's normal?)

  - Query results with context

  - Confidence scores for matches

  - Historical hunt results (what worked before?)


  **Pain Points**:

  - Translating TTPs into graph queries requires expertise

  - High false positive rates in query results

  - Balancing query specificity (too narrow misses threats, too broad is noisy)

  - Documenting hunts for future reference

  - SIEM tools often lack native graph query support


  **Data Flow**:

  - Input: Behavioral graph (users, endpoints, processes, connections) + threat intelligence

  - Transformations: Pattern matching, anomaly detection, correlation

  - Output: Threat findings or documented negative hunt + refined queries for reuse
success_criteria:
  - metric: Threats found proactively
    target: Detect threats before damage
  - metric: Query reusability
    target: Successful queries saved for future hunts
  - metric: False positive rate
    target: Manageable triage workload
