starting_state:
    data_type: SIEM or EDR query result table (authentication, process, network and DNS events) reshaped into an entity graph
    node_count: 1,000-100,000 entities after aggregation; raw rows thousands to millions
    edge_density: sparse, typed temporal multi-edges aggregated to weighted pairs
    user_expertise: expert
goal: >-
    **Intent**: Proactively look for intrusions that no alert caught. The hunter starts from a hypothesis, pulls the
    matching events from the SIEM, reshapes the result table into an entity graph, and looks for the shapes the
    hypothesis predicts (an account reaching many new hosts, a process tree that should not exist, a rare pair of
    hosts). Threat hunting was the top use of threat intelligence in a 2024 SANS survey (75 percent). The graph tools
    are Graphistry from a notebook or a Splunk workflow action, the Microsoft Defender XDR hunting graph, and graph
    databases loaded with logs.


    **Mental Model**: "Hunting expedition with a field guide." The hypothesis is the field guide (an ATT&CK technique
    or an intelligence report); the graph is the terrain after the noise is aggregated away; every interesting shape
    must be walked back to raw events before it counts.


    **Task Phases**:

    1. **Form a hypothesis** - From threat intelligence, an ATT&CK technique or an anomaly signal, for
    example "an account is authenticating to many hosts it never used before"

    2. **Query** - Write KQL or SPL that pulls the relevant events for a time window; the result is a table

    3. **Turn the table into a graph** - Pick entity columns (account, host, process, IP, domain); each event
    links the entities it mentions (a Graphistry demo turned 5,035 Splunk events into 170 entities and 15,105 links)

    4. **Aggregate and threshold** - Collapse raw events into host-to-host or account-to-host edges with counts
    and first and last seen; drop pairs below a minimum count; keep event type, port and logon type as edge attributes

    5. **Look for the predicted shape** - Fan-out, first-seen pairs, rare edges, chains in time order,
    paths to critical assets (in Defender XDR: predefined path scenarios with property filters, edge types, direction
    and shortest paths only)

    6. **Drill down** (ongoing) - From an interesting edge or node back to its raw events; corroborate with a second
    source

    7. **Respond or document** - If a threat is found, hand entities, edges and times to incident response; if
    not, document the negative hunt; save the query as a parameterized template or Splunk workflow action


    **Decision Points**:

    - Which hypothesis is worth the time this week?

    - Which columns become nodes, and what aggregation keeps the signal?

    - Is this shape malicious or a known admin, scanner or backup pattern?

    - Refine the query, change the hypothesis, or stop?


    **Information Needs**:

    - Row and entity counts after the table-to-graph step, and what was dropped

    - Count, first and last seen per aggregated edge

    - Baseline of normal pairs (seen before the hunt window)

    - The raw events behind any edge

    - Prior hunts and their saved queries


    **Pain Points**:

    - SIEMs return tables, so every hunt starts by reshaping columns into entities and edges

    - Field names differ between data sources

    - Aggregated views lose the path back to raw events unless the tool keeps it

    - Translating an ATT&CK technique into a graph shape takes expertise and trial and error

    - Large hunts need a GPU server or notebook environment

    - High false-positive rates from admin tools, scanners and backup servers


    **Data Flow**:

    - Input: SIEM or EDR query results (CSV, dataframe), optional threat intelligence indicators

    - Transformations: Table to entity graph, aggregation with counts and time, threshold, time filter, path and
    pattern queries, drill-down to rows

    - Output: Findings handed to incident response, or a documented negative hunt; saved parameterized query
success_criteria:
    - metric: Table to graph
      target: A SIEM CSV becomes an entity graph by choosing columns, with counts of rows used and dropped
    - metric: Drill-down
      target: From any aggregated edge the hunter reaches its raw rows in one action
    - metric: Query reusability
      target: Successful hunts saved as parameterized queries for future use
