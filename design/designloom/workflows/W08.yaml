starting_state:
    data_type: human interactome edge list, disease gene sets, drug-target lists, and proximity or module results computed in Python or R
    node_count: 13000-18500 in the base graph; 20-300 drawn
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Find drugs to repurpose and targets to pursue for a disease using the published network medicine method:
    test whether the disease genes form a module, measure how close each drug's targets sit to that module compared with
    degree-matched random sets, and present the result as a figure of the top drugs' targets, the module and the shortest
    paths between them, with targets then checked for tractability and safety. This is the overview; the detailed
    proximity screen is W256 and the module-to-target path is W257.


    **Mental Model**: "Closer than chance, inside a real module." Hub centrality is not the method: proximity exists to
    correct for the interactome's degree bias, and Open Targets scores essentiality as a safety liability. Centrality
    only describes a module once it is found.


    **Task Phases**:

    1. **Assemble inputs** - Interactome of physical interactions (largest component; 13,329 to 18,508 proteins);
    disease genes from OMIM, GWAS Catalog (p < 5e-8) or DisGeNET (at least 20 genes); drug targets from DrugBank, ChEMBL,
    BindingDB at 10 micromolar or better; identifiers mapped to the interactome with unmapped IDs reported

    2. **Module definition** - Largest component significance of the seeds against random sets; module expansion
    (DIAMOnD, Steiner tree, random walk) validated by enrichment

    3. **Proximity screen** - Closest-distance proximity, 1,000 degree-matched random draws, z <= -2 (or z < -1.5 with p
    < 0.05); separation for drug pairs; computed in NetMedPy, SAveRUNNER or own scripts

    4. **Validation** - AUC against known indications (best about 0.63 across 12 pipelines in a 918-drug screen)

    5. **Visualize the result** - Load the scores and sets onto the interactome, draw only the module, the top drug's
    targets and the connecting shortest paths, encode set membership and z-scores

    6. **Target assessment** - Join Open Targets tractability and safety evidence onto candidate targets; expert review

    7. **Hand off** - Ranked drug and target tables, module figure, and parameters (interactome version, seed list, ID
    mapping, null model, randomizations, random seed)


    **Decision Points**:

    - Which interactome version and sources?

    - Is the seed set a significant module?

    - Which proximity measure, null model and z threshold?

    - Which candidates go to wet-lab screening or the target committee?


    **Information Needs**:

    - Mapped versus unmapped identifier counts

    - Set membership (seed, added, target, connector) on every drawn node

    - Proximity z and p per drug, selecting into the drawing

    - Per-target evidence (tractability, safety, expression, literature)

    - Run parameters traveling with the figure


    **Pain Points**:

    - The interactome is about 80 percent incomplete; results depend on the null model

    - Scripts end in DataFrames; figures are hand-coded (igraph base plot) or rebuilt in Gephi or Cytoscape

    - Whole-interactome drawings are hairballs

    - Identifier mapping silently drops nodes

    - Target evidence lives in a table separate from the network


    **Data Flow**:

    - Input: Interactome TSV; disease gene sets; drug-target lists; proximity and module result tables; target evidence

    - Transformations: ID mapping, set tagging, subgraph of sets plus shortest paths, attribute join, encoding

    - Output: Figure of module, targets and paths; ranked tables; parameter record
success_criteria:
    - metric: Figure from script output
      target: Module-and-targets figure produced in under 15 minutes without plotting code (design goal; no source measures it)
    - metric: Evidence profile
      target: Each candidate target shows proximity, membership and tractability and safety columns
    - metric: Reproducibility
      target: Interactome version, seeds, null model and thresholds exported with the figure
sources:
    - title: Guney et al. 2016 - Network-based in silico drug efficacy screening
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4740350/
      summary: Closest-distance proximity with degree-matched null; designed to correct interactome degree bias
    - title: Menche et al. 2015
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4435741
      summary: Disease modules on the incomplete interactome
    - title: Gysi et al. 2021
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8126852
      summary: 12 pipelines, 918-drug experimental screen, AUC about 0.63
    - title: NetMedPy
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12401583
      summary: Proximity and separation in Python; visualization outside the tool
    - title: DIAMOnD
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4390154/
      summary: Seed-based module expansion
    - title: Open Targets target prioritisation
      url: https://platform-docs.opentargets.org/web-interface/target-prioritisation
      summary: Tractability and safety grid; essentiality as a safety liability
    - title: DrugBank downloads
      url: https://go.drugbank.com/downloads
      summary: Drug-target data under a non-commercial license
