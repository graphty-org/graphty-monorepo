starting_state:
    data_type: multi-source records about people, phones, accounts, vehicles, places and events (CDRs, extractions, RMS, intelligence logs, financial returns)
    node_count: working charts of 100-1,000 nodes filtered from 100,000 or more records; court and briefing charts of tens of nodes
    edge_density: sparse multigraph (many typed, timestamped, directed links per pair)
    user_expertise: intermediate
goal: >-
    **Intent**: Map a criminal organization's structure to support investigation and intervention planning: identify
    key players, bridges between groups and subgroups, and where intervention would be most effective. This is the
    umbrella workflow; the concrete steps analysts follow are split into their own workflows: importing call records
    (W97), telephone analysis and live appends (W98), timelines (W99), cell-site analysis (W100), convoy analysis
    (W101), multi-device extractions (W102), court and briefing charts (W103), group analysis and disruption from
    intelligence records (W104), cryptocurrency tracing (W105), military targeting (W106), and social media and ads
    (W107).


    **Mental Model**: "Organizational chart reconstruction" and "finding the weak links". Analysts treat the chart as a
    tool, not a product: every item has a source and a grade, a central figure is not necessarily the leader, and a
    disrupted network tends to rewire rather than collapse.


    **Task Phases**:

    1. **Case Initialization** - Define the question, seed entities and time window; deconflict seeds through agency
    systems

    2. **Data Integration** - Import records through saved mappings per source; normalize phone numbers and time zones

    3. **Network Building** - Merge the same entity across sources (one person, many phones and accounts), keep parallel
    typed links with counts and sums, grade every item; Harris County funnels 10M+ records to about 100,000, then about
    1,000, then about 100 nodes

    4. **Structural Analysis** - Common neighbors across seeds, centrality (degree, betweenness, eigenvector), components
    per link type, communities, paths including time order

    5. **Vulnerability Assessment** - Degree-by-betweenness profiles; sequential or block removal with re-ranking,
    tracking the largest connected component; expected replacement

    6. **Intelligence Production** - Timelines paired with charts, graded line styles, hand layout, dated and
    sequence-numbered exports, redacted copies per audience


    **Decision Points**:

    - Who are the initial seed entities, and how many sweeps outward?

    - Which grades are reliable enough to keep, and how are suspected links drawn?

    - What time window is relevant?

    - Who are likely leaders vs. brokers vs. highly visible members vs. peripheral people?

    - Where would intervention be most effective, and how will the network respond?


    **Information Needs**:

    - Entity relationships with source records and grades

    - Per-pair counts and sums by direction and type

    - Centrality scores and profiles, per link type and combined

    - Community structure (cells, crews, sets)

    - Temporal evolution and pattern of life

    - Largest-component size after simulated removals


    **Pain Points**:

    - Incomplete data -- criminal networks hide connections, and wiretaps cover short windows

    - Data from multiple sources with different formats, time zones and quality

    - Entity resolution (same person, multiple identities; one phone, many users)

    - Operational systems weight all links equally and cannot group by crime type, region or gang

    - Maintaining traceability to records for disclosure and testimony

    - Data keeps arriving during a case and must be appended without losing layout


    **Data Flow**:

    - Input: CDRs, extractions, RMS, intelligence logs, ALPR, financial and provider returns

    - Transformations: Import mapping, normalization, entity resolution, parallel-link aggregation, grading, centrality,
    community detection, removal simulation

    - Output: Network map, key player profiles, vulnerability assessment, timelines, court or briefing charts
success_criteria:
    - metric: Network mapped
      target: Structure with key players identified, filtered from 100,000+ records to a working chart of 100-1,000 nodes
    - metric: Roles understood
      target: Members profiled (central, gatekeeper, highly visible, peripheral) with values and sources behind each
    - metric: Vulnerabilities identified
      target: Intervention points prioritized with removal curves and expected replacement noted
    - metric: Evidence documented
      target: Every element on an exported chart traces to its source record and grade
