goal: >-
  **Intent**: Map and analyze a criminal organization's structure to support investigation and intervention planning.
  User needs to identify key players, understand hierarchy, and find vulnerabilities for disruption.


  **Mental Model**: "Organizational chart reconstruction" - building the hidden org chart of a criminal enterprise. Also
  "finding the weak links" - identifying where intervention would be most effective.


  **Task Phases**:

  1. **Case Initialization** - Define scope, identify seed entities, establish time frame

  2. **Data Integration** - Collect and merge records (communications, financial, travel, surveillance)

  3. **Network Building** - Extract entities and relationships, resolve duplicates, build graph

  4. **Structural Analysis** - Identify leadership (centrality), subgroups (communities), communication flows

  5. **Vulnerability Assessment** - Find single points of failure, critical brokers, weak links

  6. **Intelligence Production** - Create visualizations and briefings for operational planning


  **Decision Points**:

  - Who are the initial seed entities?

  - How to handle uncertain or conflicting information?

  - What time window is relevant?

  - Who are the likely leaders vs. lieutenants vs. foot soldiers?

  - Where would intervention be most effective?

  - What's the anticipated network response to intervention?


  **Information Needs**:

  - Entity relationships with evidence documentation

  - Centrality scores (degree, betweenness, eigenvector) to identify leaders/brokers

  - Community structure (cells, subgroups)

  - Communication patterns (who talks to whom, when)

  - Financial flows (follow the money)

  - Temporal evolution (how has network changed?)


  **Pain Points**:

  - Incomplete data - criminal networks hide connections

  - Data from multiple sources with different formats/quality

  - Entity resolution challenges (same person, multiple identities)

  - Maintaining chain of custody for legal proceedings

  - Balancing investigation depth with operational timeline


  **Data Flow**:

  - Input: Multi-source intelligence data (COMMS, financial, surveillance)

  - Transformations: Entity extraction, relationship mapping, centrality analysis, community detection

  - Output: Network map + key player profiles + vulnerability assessment + operational recommendations
success_criteria:
  - metric: Network mapped
    target: Complete structure with key players identified
  - metric: Hierarchy understood
    target: Leadership and roles documented
  - metric: Vulnerabilities identified
    target: Intervention points prioritized
  - metric: Evidence documented
    target: Chain of custody maintained
