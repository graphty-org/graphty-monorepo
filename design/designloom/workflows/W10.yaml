starting_state:
    data_type: typed engagement edges (reply, mention, repost, comment) from a listening-tool or NodeXL export, or a collected follow graph; creator metrics table
    node_count: 500-20000
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Identify accounts that matter in a conversation or audience - broadcasters with reach, bridges between
    communities, and active participants - and turn them into a screened, ranked shortlist for a campaign. Marketers
    rarely hold a raw follower graph (Instagram returns counts, not follower lists); the realistic input is an
    engagement network exported from a listening tool or NodeXL, or a follow graph collected for a research project.


    **Mental Model**: "Different kinds of influence." In-degree or engagement measures reach; betweenness finds bridges;
    community membership says which audience an account reaches. Seeding well-connected people works mainly because
    hubs participate more, not because they persuade their peers more (Hinz et al.), so centrality is a shortlist, not a
    forecast.


    **Task Phases**:

    1. **Define influence** - Reach, engagement, brokerage between communities, or topical authority

    2. **Load the network** - Import the vendor or NodeXL export with typed edges; join the creator metrics
    table (engagement rate, fake-follower score, rates, demographics)

    3. **Compute metrics** - In-degree or weighted engagement, betweenness, PageRank; community detection for
    audience membership

    4. **Segment** - Classify accounts as broadcasters, bridges or community hubs; separate news outlets and
    brands from creators

    5. **Screen** - Remove accounts with high fake-follower scores or suspicious dense interaction; review
    content and brand fit by hand

    6. **Check audience overlap** - Pairwise overlap among shortlisted creators; low overlap for reach, high for
    repeated exposure

    7. **Rank and export** - Ranked list with type, community and metrics; network image for the deck


    **Decision Points**:

    - Which type of influence matters for this goal?

    - How to weight centrality against engagement rate and cost?

    - Which accounts fail fake-follower or fit screening?

    - How much audience overlap to accept?


    **Information Needs**:

    - Several centrality scores per account beside engagement metrics

    - Community membership per account

    - Distribution of each metric to set cutoffs

    - Posts behind an account

    - Overlap between shortlisted creators


    **Pain Points**:

    - Fake followers inflate metrics; one vendor attributes 56.5 percent of reported influencer-fraud issues to them

    - High centrality does not mean persuasion or sales; follower count predicts sales poorly

    - Vendor overlap and influence scores are undocumented

    - Audience overlap among creators gives diminishing returns


    **Data Flow**:

    - Input: Engagement network export (GEXF, GraphML, CSV, NodeXL workbook) and a creator metrics table

    - Transformations: Centralities, community detection, attribute join, screening filters

    - Output: Ranked, screened creator list with influence type, community and metrics; network image with legend
success_criteria:
    - metric: Influencers identified
      target: Ranked list by influence type with community membership
    - metric: Screening
      target: Fake-follower and fit screening recorded for every shortlisted account
    - metric: Overlap awareness
      target: Pairwise audience overlap known for the final roster
