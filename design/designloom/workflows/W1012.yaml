    - live-data-source
    - search
    - entity-resolution-review
    - node-merging
    - provenance-tracking
    - edge-evidence-review
    - comparison-view
    - details-on-demand
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
