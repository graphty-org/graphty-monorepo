id: W1013
name: Investigating One Customer, Household or Corporate Family
category: exploration
validated: false
personas:
    - master-data-steward
requires_capabilities:
    - live-data-source
    - search
    - ego-network
    - neighborhood-expansion
    - supernode-safeguards
    - truncation-reporting
    - typed-edge-filtering
    - layout-hierarchical
    - hierarchy-scenario-editing
    - temporal-validity
    - graph-diff
    - details-on-demand
    - typed-graph-editing
    - undo-redo
    - export-image
suggested_components:
    - search-input
