id: W102
name: Multi-Device Communication Analysis from Phone Extractions
category: analysis
validated: false
personas:
    - crime-intelligence-analyst
requires_capabilities:
    - data-import
    - node-merging
    - filtering
    - temporal-navigation
    - details-on-demand
