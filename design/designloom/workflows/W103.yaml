id: W103
name: Producing a Court or Briefing Chart by Hand
category: reporting
validated: false
personas:
    - crime-intelligence-analyst
    - prosecution-trial-analyst
    - intelligence-analyst
    - crypto-tracing-investigator
requires_capabilities:
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - annotation
    - style-presets
    - filtering
    - details-on-demand
    - export-image
    - data-export
    - report-generation
    - provenance-tracking
    - source-grading
    - manual-layout-preservation
    - redacted-sharing
suggested_components:
    - graph-canvas
    - visual-encoding-panel
    - legend-panel
    - annotation-toolbar
    - filter-panel
