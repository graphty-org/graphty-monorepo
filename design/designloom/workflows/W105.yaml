id: W105
name: Cryptocurrency Tracing from a Seed Address to a Cash-Out Exchange
category: analysis
validated: false
personas:
    - crypto-tracing-investigator
requires_capabilities:
    - neighborhood-expansion
    - progressive-loading
    - filtering
    - path-highlighting
    - all-paths-finding
    - visual-encoding-edges
    - visual-encoding-nodes
    - details-on-demand
    - annotation
    - legend-display
    - export-image
    - time-respecting-paths
    - group-collapse
    - parallel-edge-aggregation
    - value-flow-tracing
    - attribution-tags
suggested_components:
    - graph-canvas
    - cluster-collapse-control
    - progressive-loader
    - filter-panel
    - range-slider
