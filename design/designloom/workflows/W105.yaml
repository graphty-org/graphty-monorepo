starting_state:
    data_type: a seed address or transaction hash; a vendor or GraphSense server-side ledger with address clusters, the
        heuristic behind each and attribution tags; later the exchange's subpoena or KYC return
    node_count: 1 seed growing to 10-1,000 addresses, clusters and transactions in the working view (one service cluster
        had over 900,000 attributed addresses)
    edge_density: sparse directed chains and fans (peel chains), with occasional large multi-input transactions
    user_expertise: expert
goal: >-
    **Intent**: Follow funds from a seed -- a ransom address, a victim's payment, an address on a seized device, an
    alert -- hop by hop across swaps, bridges and mixers until they reach an exchange or other identified service,
    serve legal process there for the account holder's identity, freeze and seize what remains, and present the flow
    in court with the heuristics behind it. This is the one record for the whole tracing sequence; law-enforcement
    specialists and exchange financial-crimes teams run the same steps, the team ending in a SAR or a 314(b) request
    instead of a subpoena. The journalist variant is W95.


    **Mental Model**: "Follow the money downstream; transactions are nodes, clusters are guesses." On Bitcoin-style
    ledgers a transaction spends several inputs and creates several outputs, one usually change back to the sender.
    Clusters of addresses believed to be one controller open into their addresses; every merge must be explainable and
    undoable. Edges carry amount, asset and time; the analyst cares how much of the traced value went down each branch
    and where on-chain tracing legitimately stops. The graph lives on a server and is never imported whole.


    **Task Phases**:

    1. **Get a seed and enter it** - Ransom note address, victim transaction, seized-device or exchange-record
    address, or alert; pasted rather than retyped (Colonial Pipeline: 63.7 of 75 bitcoin traced and seized)

    2. **Read the transaction structure** - Transaction-as-node view with input and output edges; identify the likely
    change output; account-based chains are address-to-address transfers

    3. **Look up the cluster and how it was formed** - Co-spend (skipping detected CoinJoin co-spends), change
    heuristics, deposit addresses that sweep into an exchange's consolidation address; see which rule merged each
    address and split a wrong merge back out

    4. **Overlay attribution with its source** - Vendor labels or GraphSense TagPacks on clusters (exchange, mixer,
    darknet market, sanctioned entity), plus imported private tags

    5. **Map the network hop by hop** - Forward or backward one hop at a time from the server; amount and time on each
    hop; restrict by amount and time window; flag pass-through addresses; path search between two nodes; bounded search
    for the nearest node labeled as an exchange (maximum hops, maximum degree)

    6. **Interpret peel chains, mixers, swaps and bridges** - Follow the change output down a peel chain; check
    whether a "peel chain" is really an unlabeled mixer; collapse swaps, bridges and mixers into one hop that opens on
    demand; keep every relevant token in one graph and dim other assets

    7. **Allocate commingled funds** - Poison, haircut or first in first out (W121), stating which and how sensitive
    the answer is to it

    8. **Stop at the service** - Outgoing history of a service deposit address is hidden and marked as not traceable
    on chain; check for nested services and merchant processors hosted inside the labeled cluster

    9. **Document the trace** - Annotate, bookmark the view, export graph image, transaction list and report; every
    export recorded in an audit log

    10. **Serve legal process** (outside the tool) - Subpoena or warrant naming the deposit addresses or transaction
    hashes; ask for KYC, balances, IP and device data and linked accounts; request a freeze; an exchange uses 314(b) or a
    SAR

    11. **Watch what has not moved** - Addresses still holding funds go on a watch list with movement alerts; new
    transactions append without resetting the view

    12. **Fold the returns back in** - Add the account holder, bank accounts and documents to the graph or move them to
    the i2 case chart; mark the attributions the return confirmed

    13. **Seize and forfeit** (outside the tool) - Through the exchange or from wallets found on devices

    14. **Produce the court graph** - Flow, value per branch, the allocation rule, and the heuristic and source behind
    every cluster and attribution; attributions confirmed by subpoena returns or undercover transactions marked


    **Decision Points**:

    - Which output is change and which is payment at each hop, and should change be merged into the sender's cluster?

    - Is a large co-spend a real single owner or a CoinJoin or PayJoin?

    - Is this a peel chain or an unlabeled mixer?

    - Where to stop expanding (amount threshold, time window, a labeled service)?

    - Trust a vendor attribution, or treat it as tentative until a return confirms it?

    - Which allocation rule applies, and how sensitive is the answer to it?

    - Which exchange gets the legal process, and is the labeled cluster really the counterparty or a nested service?


    **Information Needs**:

    - Inputs, outputs, amount, asset and time of every transaction, and value per branch from the seed

    - Which heuristic merged each address into a cluster, so a wrong merge can be undone

    - Attribution label on each cluster with its source and whether a return confirmed it

    - Paths from the seed to labeled services, and the nearest service within bounds

    - Which addresses still hold funds, and any movement since the last look

    - What was exported, when and by whom


    **Pain Points**:

    - Graphs become cluttered ("a veritable Christmas tree of multicolor types of transactions")

    - CoinJoin and PayJoin defeat co-spend; naively merging predicted change produced one supercluster (a 1596 percent
    jump in addresses), and one wrong change link can merge two exchanges

    - Mistaking an unlabeled mixer for a peel chain led to wrong conclusions and possibly erroneous subpoenas

    - Cross-chain hops break simple paths

    - Exchange deposit and sweep addresses add noise, and tracing past a deposit address is meaningless

    - Allocation rules give very different answers and vendors do not document theirs

    - Defense attacks clustering heuristics as "junk science"

    - The vendor graph cannot be combined with the off-chain case chart without re-drawing

    - Filters for amount and time are poorly documented in public


    **Data Flow**:

    - Input: Seed address or hash; server-side ledger, clusters with their heuristics, and tags; imported private tags;
    exchange returns

    - Transformations: Transaction-as-node view, heuristic clustering with recorded reasons and undo, attribution
    overlay, hop expansion with amount and time filters, peel-chain following, swap, bridge and mixer collapse,
    cross-asset tracking, path and nearest-service search, allocation, stop at services, off-chain identity joins

    - Output: Flow graph from seed to cash-out with value per branch, allocation rule and attribution evidence;
    transaction list; report; export audit log; watch list; records requests; affidavits, seizure, trial exhibit or SAR
success_criteria:
    - metric: Incremental expansion
      target: Each hop loads from the server on demand, without importing the ledger
    - metric: Undoable clusters
      target: Every address merge names its heuristic and can be undone, splitting the cluster back
    - metric: Value accounting
      target: Each hop shows the amount carried and the time, and the analyst can state how much traced value reached
          each labeled service under a named allocation rule
    - metric: Stops at services
      target: Expansion past a service deposit address is blocked and marked as not traceable on chain
    - metric: Heuristic transparency
      target: Every cluster and attribution shows the heuristic and source behind it in the export
sources:
