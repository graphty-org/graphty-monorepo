      url: https://arxiv.org/abs/2107.05749
      summary: False positives from CoinJoin and PayJoin; naive change merging produced a supercluster
    - title: Anderson et al. - Bitcoin Redux (WEIS 2018)
      url: https://www.cl.cam.ac.uk/~rja14/Papers/bitcoin-redux-weis2018.pdf
      summary: Poison, haircut and FIFO allocation
