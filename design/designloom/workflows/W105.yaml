      url: https://www.trmlabs.com/resources/blog/january-product-highlights-accelerating-investigations-with-intuitive-workflows
      summary: Add a graph address to monitoring for near real-time movement alerts
    - title: GraphSense
      url: http://graphsense.org/
      summary: Transaction traversal, automatic path search between two nodes, public and private TagPacks
