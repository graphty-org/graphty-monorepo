    - title: TRM Forensics
      url: https://www.trmlabs.com/forensics
      summary: Single-click forward or backward UTXO tracing; shows which clustering heuristic is used (search excerpt)
    - title: TRM Labs - What's new, October 2026
      url: https://www.trmlabs.com/forensics/whats-new-2026-10
      summary: Swap matching across 36 EVM chains and 21 bridges
