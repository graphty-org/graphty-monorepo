goal: >-
    **Intent**: Build a gang or trafficking network from social media accounts, provider returns and online ads,
    linking accounts and ads through shared phone numbers, emails, IP addresses and devices, then join it to call
    records and agency records in the case chart.


    **Mental Model**: "Shared identifiers tie the pieces together." An ad and an account are linked when they share a
    phone number; two accounts are linked by messages, friends and followers; accounts tie to IP addresses, login times
    and devices.


    **Task Phases**:

    1. **Collect** - Provider returns arrive as ZIP files of HTML, JSON, CSV, PDF, mbox and images with no
    standard layout, nested in folders and archives; public posts are found by hashtag searches in gang slang and
    through less careful relatives' and friends' profiles, and saved as dated screenshots; agency data comes as CSV
    or Excel from SQL Server, reports and subpoena returns

    2. **Extract link types** - Account to account (messages, friends, followers), account to IP address and
    login time, account to device, account to phone and email

    3. **Link ads, numbers and callers** - Ads and inmates' jail calls joined through shared phone numbers; in
    ArcGIS Pro: import, link chart, generate nodes, generate ties, change layout, generate node scores

    4. **Find key nodes and listen** - Eigenvector and betweenness pick nodes; calls to those nodes are keyword
    searched for context

    5. **Add records and re-run** - Add RMS and criminal justice records; map senders and receivers from Cash App
    returns and find bridge accounts between targets to subpoena

    6. **Add friend and follower ties** - Graded like any other report; check the structure against behavior
    rather than assuming a hierarchy (most gangs are loose subgroups joined by non-members)

    7. **Reduce and hand over** - About 100 key nodes reviewed in Excel with a background line each; merge into
    the case chart with call records and records-management data


    **Decision Points**:

    - Which shared identifiers are strong enough to link two accounts or ads?

    - Is a friend or follower tie meaningful for this gang?

    - Which bridge accounts or numbers are worth a subpoena?

    - Which account belongs to which real person?


    **Information Needs**:

    - Per identifier: how many ads or accounts share it

    - Account metadata: IP addresses, login times, devices

    - Clusters of ads and accounts tied by shared identifiers

    - The return file and record behind each link


    **Pain Points**:

    - Every provider's return has its own layout inside a ZIP

    - Two-mode ad-to-number data must be projected by hand

    - Accounts, phones and people need merging across sources

    - Built-in link views in records systems weight every link the same and cannot group by crime type, region or
    gang

    - Members rarely use real names online, so the hard part is identifying people, not finding posts


    **Data Flow**:

    - Input: Provider returns, OSINT collections, ads, CDRs, RMS records

    - Transformations: Parsing per provider, link-type extraction, shared-identifier projection, identity merging,
    joining with call and agency data

    - Output: Multi-modal network of accounts, ads, phones, payment accounts and people, a key-node list of about 100
    entries with backgrounds and subpoena targets, merged into the case chart
success_criteria:
    - metric: Shared-identifier linking
      target: Ads and accounts sharing a phone number, email or IP are linked with counts in one step
    - metric: Source traceability
      target: Every link names the return file and record it came from
