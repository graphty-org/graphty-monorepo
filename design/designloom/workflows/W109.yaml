starting_state:
    data_type: Continuously collected AD and Entra ID graph with Tier Zero and other Privilege Zone definitions, plus history of analysis runs
    node_count: 10,000-500,000
    edge_density: sparse, typed and directed
    user_expertise: advanced
goal: >-
    **Intent**: Run attack path reduction as a continuous program instead of a one-off audit: measure how many
    principals can reach Tier Zero, remove the choke points that sever the most paths, prove each fix worked, and show
    the trend to leadership. This is the defensive counterpart of the penetration tester's BloodHound work, done in
    BloodHound Enterprise or the Microsoft Defender XDR hunting graph.


    **Mental Model**: "Close the funnel." Thousands of principals flow into a few chokes before reaching the crown
    jewels; cut the choke and every path through it disappears at once. Success is a falling exposure number, not a
    shorter findings list.


    **Task Phases**:

    1. **Define the zone** (one-off, revisited) - Decide which assets are Tier Zero or another Privilege Zone; widening
    it (for example adding a help desk group) makes new findings appear

    2. **Let collection and analysis run** (continuous) - Collection runs on a schedule; attack paths are recomputed
    after each run

    3. **Read the queue** (daily, 15 min) - Filter the Attack Paths page by environment, zone and risk; each finding
    shows severity, exposure (share of principals with a path through it), impact and remediation; a choke point graph
    aggregates the exposed principals behind each finding

    4. **Prioritize** (30 min) - Pick findings with high exposure and high impact; one published example had a single
    choke point reachable by 93 percent of users, others by 41 and 10 percent

    5. **Run a campaign** (weeks) - Define a Privilege Zone around in-scope assets, review findings, assign owners, track
    reduction

    6. **Check safety and remediate** - Before removing a privilege, determine whether it breaks a business process;
    file the change

    7. **Verify** - After the next collection, the path must be gone; the Posture page compares counts and changes per
    attack path type across runs

    8. **Ad hoc scenarios** - In the Defender XDR hunting graph, run predefined scenarios (paths to domain admins,
    Kerberoast paths to critical assets, choke points to SQL data stores, critical Kubernetes clusters), filter source
    and target node properties, pick among 19 edge types and direction, and show only shortest paths

    9. **Report** (monthly) - Exposure trend and campaign progress for the CISO and auditors


    **Decision Points**:

    - What belongs in Tier Zero, knowing that a wider definition raises the finding count?

    - Which choke point first: highest exposure, highest impact, or easiest safe fix?

    - Is this privilege used by a business process, and who must approve its removal?

    - Did the fix work, or did a new path appear around it?


    **Information Needs**:

    - Exposure per finding as a share of all principals, and the list of principals behind it

    - The choke point nodes and edges that appear on the most paths into the zone

    - A what-if count: how many paths and principals remain if this edge or node is removed

    - Counts and changes per attack path type across analysis runs

    - Why a node is on a path (which edges put it there)


    **Pain Points**:

    - Finding counts rise as visibility improves, which reads as failure in a leadership report

    - No view of which business process depends on a privilege before it is removed

    - Vendor claims of paths severed per choke point come without published methodology

    - Collection is detected as reconnaissance by the company's own security tools

    - Verification waits for the next collection run


    **Data Flow**:

    - Input: Scheduled SharpHound and AzureHound collections; zone definitions; prior analysis runs

    - Transformations: Set-to-zone reachability, exposure counts, choke point ranking, what-if removal, run-to-run diff

    - Output: Ranked remediation queue, change tickets, verified-removed paths, exposure trend report
success_criteria:
    - metric: Choke point ranking
      target: User can list the top choke points into a chosen zone with the share of principals each one exposes
    - metric: What-if removal
      target: User can see the change in exposure before making a change
    - metric: Trend
      target: Exposure per zone shown across at least two analysis runs with new and resolved paths separated
