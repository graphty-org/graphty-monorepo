starting_state:
    data_type: multi-tier part-at-site supply network (directed, mostly acyclic) with recovery times, inventory, alternates, revenue and coordinates
    node_count: 100-130000
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Identify vulnerabilities in a supply chain network before disruptions occur: which sites and parts would
    cost the most revenue while down, where inventory and alternates do not cover the recovery time, which inputs are
    single-sourced, and where suppliers cluster geographically. This is the umbrella assessment; the detailed procedures
    are the time-to-recover stress test (W215), event response (W216) and multi-tier mapping (W217).


    **Mental Model**: "Stress testing the chain" - knock out each site for as long as it really takes to recover and
    count what cannot be built. Exposure follows the bill of materials, inventory and alternates, not centrality or spend.


    **Task Phases**:

    1. **Network Mapping** - Build the part-at-site network (tier 1 from ERP, tier 2+ from surveys, trade data or vendors),
    marking unknown sub-tier links as unknown rather than absent

    2. **Dependency Analysis** - Count suppliers per input to find single-sourced parts; find tier-1 suppliers that share
    a hidden tier-2 source; group suppliers by region to see concentration

    3. **Exposure Scoring** - For each node, compute time to survive from inventory and alternates and the impact of a
    disruption lasting its time to recover; propagate AND across required inputs and OR across alternates; store the
    impact per node

    4. **Scenario Modeling** - Region, plant or part scenarios (what if region Y is disrupted?) compared against the base

    5. **Mitigation Planning** - Dual sourcing, safety stock or monitoring for high-exposure, low-spend sites; drop
    zero-exposure sites from monitoring


    **Decision Points**:

    - How deep into the supply chain to map (Tier 2? Tier 3?), and how to treat unknown links?

    - Which supplier-reported recovery times are credible?

    - What constitutes unacceptable exposure or concentration?

    - How much redundancy investment is justified by the impact avoided?


    **Information Needs**:

    - Supplier network with tier, part and site information and the source of each link

    - Recovery time, inventory days, alternates, margin and coordinates per node

    - Per-node impact and time to survive, side by side with spend

    - Historical disruption data


    **Pain Points**:

    - Tier 2+ suppliers often unknown or self-reported

    - Data scattered across procurement systems, with one supplier under many names

    - Betweenness centrality does not track exposure in a bill-of-materials graph (Ford: exposure not correlated with
    spend; betweenness fits hub networks like ports and airports)

    - Plain removal analysis treats every downstream node as lost, ignoring alternates and inventory buffers

    - A per-node scenario sweep is a batch job across tens of thousands of nodes


    **Data Flow**:

    - Input: BOM and sourcing data, survey recovery times, inventory, margins, geographic coordinates

    - Transformations: Network construction, single-source and shared-dependency analysis, per-node disruption scenarios
    with AND/OR propagation and time buffers, regional grouping

    - Output: Ranked exposure table linked to an impact map, single-source list, prioritized mitigation recommendations
success_criteria:
    - metric: Exposure coverage
      target: Every site has a stored impact value over its recovery time
    - metric: Single points of failure identified
      target: All single-sourced inputs and shared hidden sources listed
    - metric: Scenarios modeled
      target: Top 5 disruption scenarios quantified against the base
    - metric: Mitigation plan
      target: Actionable recommendations with cost/benefit
