id: W111
name: SOC Alert Triage with an EDR Process Tree
category: analysis
validated: false
personas:
    - luis-ferreira
requires_capabilities:
    - layout-hierarchical
    - neighborhood-expansion
    - node-selection
    - details-on-demand
    - tooltip-display
    - visual-encoding-nodes
    - path-highlighting
    - filtering
    - temporal-analysis
    - temporal-navigation
    - animated-transitions
    - keyboard-shortcuts
    - path-focus-dimming
    - expansion-history
suggested_components:
    - graph-canvas
    - node-details-panel
    - node-tooltip
    - badge
    - filter-chip
    - context-menu
    - temporal-controls
    - keyboard-shortcut
    - status-bar
starting_state:
    data_type: EDR process telemetry around one alert (process events with parent links, plus file, registry and network events; vendor entity IDs)
    node_count: 10-200 per alert; incident graphs up to a few hundred entities
    edge_density: tree-like with time order
    user_expertise: intermediate
goal: >-
    **Intent**: Decide quickly whether one endpoint alert is malicious by reading what launched the flagged process and
    what it did next, act on it, and escalate to the incident graph when it is part of something larger. This is the
    highest-volume graph use in security: many times per shift for every SOC analyst, in Microsoft Defender XDR,
    Elastic Security, SentinelOne and similar EDR consoles.


    **Mental Model**: "Family tree with a clock." Each process has one parent and many children; side events (files
    written, registry keys set, connections made) hang off each process; the question is whether the lineage and the
    side effects make sense for this host and user.


    **Task Phases**:

    1. **Open the alert** (seconds) - From the queue: title, affected assets, details pane, and the alert story tree of
    processes and entities before and after the trigger, including other alerts from the same execution tree

    2. **Walk the tree** (2-10 min) - Select entities, expand non-alert entity cards; read event-category markers
    (file, registry, network) and time elapsed between processes; read the condensed chronological timeline beside the
    tree; the time range defaults to the alert table's range

    3. **Act** (1 min) - From the details pane: isolate the device, quarantine the file

    4. **Classify** (1 min) - True alert with a determination, or false alert; for a line-of-business false positive,
    create a suppression rule

    5. **Escalate to the incident graph** (as needed) - Alerts, users, devices and mailboxes as nodes; replay alerts
    and nodes over time; filter by severity and source; hunt from a node; view blast radius (the top eight paths to
    critical targets, at most seven hops)


    **Decision Points**:

    - Is this parent-child relationship normal for this host and software?

    - Which collapsed entity is worth expanding?

    - True, false, or needs escalation?

    - Contain now, or gather more evidence first?


    **Information Needs**:

    - Command line, user, signer and hash for each process

    - Which nodes are alerts, with severity, and what other alerts share the tree

    - Time between parent and child and the order of side events

    - Whether this lineage has been seen elsewhere (prevalence)

    - Possible blast radius paths from the affected entity


    **Pain Points**:

    - Alert volume: a 2026 practitioner survey reports a median of about 100 alerts a day, with 27 percent of
    organizations receiving 500 or more

    - The tree shows what spawned what but not whether the relationships matter more broadly

    - Blast radius paths are possible, not guaranteed

    - PID reuse confuses lineage when vendors do not mint stable process IDs


    **Data Flow**:

    - Input: EDR process and side events keyed by process entity ID, with timestamps

    - Transformations: Tree layout with time order, collapse and expand of entity groups, alert overlay, time replay

    - Output: Alert classification and determination, containment action, optional escalation to an incident
success_criteria:
    - metric: Lineage readability
      target: Parent-child order and elapsed time readable without opening each node
    - metric: Alert overlay
      target: Every alert node in the tree is visually marked with its severity
    - metric: Replay
      target: User can step through the incident graph in event order
sources:
    - title: Microsoft Learn - Investigate alerts in Defender for Endpoint
      url: https://learn.microsoft.com/en-us/defender-endpoint/investigate-alerts
      summary: Alert story process tree, entity expansion, condensed timeline, actions, classification, suppression
    - title: Elastic Security - Visual event analyzer
      url: https://www.elastic.co/guide/en/security/current/visual-event-analyzer.html
      summary: Process graph with event-category pills, elapsed time between processes, default time range
    - title: Microsoft Learn - Investigate incidents in Defender XDR
      url: https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents
      summary: Incident graph replay, severity and source filters, Go hunt, blast radius of eight paths up to seven hops
    - title: SentinelOne - Rapid threat hunting with Deep Visibility
      url: https://www.sentinelone.com/blog/rapid-threat-hunting-with-deep-visibility-feature-spotlight/
      summary: Storyline ID grouping related events, updated as telemetry arrives
    - title: NIST SP 800-61r3
      url: https://csrc.nist.gov/pubs/sp/800/61/r3/final
      summary: Incident response framed in CSF 2.0 functions; no prescribed triage steps
    - title: NHI Mgmt Group - SOC and alert statistics guide
      url: https://www.nhimg.org/soc-and-alert-statistics-guide
      summary: Survey of 250 practitioners on alerts per day
    - title: Symantec - Threat tracer investigation capabilities
      url: https://www.security.com/product-insights/threat-tracer-investigations-capabilities-you-need
      summary: Vendor view that a process tree alone does not show whether relationships matter
