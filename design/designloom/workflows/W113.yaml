goal: >-
    **Intent**: Find who is talking to whom that should not be - scanning, beaconing, new external peers, segment
    violations - by aggregating connection records into a graph, and pivot from a suspicious pair straight to the raw
    sessions and packets. Daily work for network security monitoring analysts in Arkime, Zeek with RITA, and
    Graphistry; network and OT engineers do a related periodic review of what can reach what by zone.


    **Mental Model**: "Traffic map with a noise floor." Millions of connections collapse into weighted pairs; the
    shape (one source fanning out, one pair repeating like a clock, a link crossing a zone boundary) is the finding, and
    the raw session is the proof.


    **Task Phases**:

    1. **Pick a window and query** - Filter sessions by expression and time; raise the query size for a
    complete picture, accepting that it is slower (smaller queries show only the top sessions)

    2. **Open the connections graph** - Force-directed; choose which fields become source and destination nodes
    (defaults source IP to destination IP and port; alternatives: IP to protocol, originating to responding segment,
    GeoIP city, MAC vendor); segment fields collapse addresses into subnets

    3. **Weight and threshold** - Set the link weight method and a minimum connection count to drop rare or
    noisy pairs; color nodes as source, destination or both

    4. **Read patterns** - Fan-out from one source to many destinations or ports suggests scanning; regular
    repeated connections between one pair suggest beaconing (scored outside the graph by RITA)

    5. **Pivot** - Click a node or link to add it to the query filter; list the sessions; export PCAP; join a
    connection to its dns, http and ssl records by Zeek uid

    6. **Ad hoc variants** - Load Zeek logs into a graph database and run predefined queries or expand neighbors; turn a
    Splunk result into a hypergraph in Graphistry (one demo: 5,035 events gave 170 entities and 15,105 links)

    7. **Reachability and OT maps** (periodic) - Config-derived models (RedSeal) answer whether traffic can move from one
    point to another without traffic data; passive OT monitors draw devices grouped by zone and Purdue level with
    protocols between zones


    **Decision Points**:

    - Which fields should be nodes for this question?

    - What threshold removes noise without hiding a low-and-slow beacon?

    - Is this fan-out a scanner, a backup server or a monitoring tool?

    - Which pair is worth pulling the PCAP for?


    **Information Needs**:

    - Connection count, bytes, ports, protocols, first and last seen per pair

    - Fan-out (distinct destinations and ports) per source

    - Internal versus external and subnet or zone membership of every address

    - Beacon score per pair from an outside tool, joined onto the edge

    - The raw sessions behind an aggregated edge


    **Pain Points**:

    - Small queries show only top sessions; large queries are slow

    - NAT and DHCP make IP addresses unstable identities

    - No subnet or zone grouping unless segment fields are picked by hand

    - Beacon scores live in a different tool from the graph

    - The open-source ICS mapping tool GRASSMARLIN was archived in 2023


    **Data Flow**:

    - Input: Zeek logs or Arkime sessions, firewall logs; optional beacon scores; zone or subnet definitions

    - Transformations: Field choice for node identity, aggregation into weighted pairs, minimum-weight threshold,
    subnet and zone grouping, time filter

    - Output: Suspicious pairs and hosts, filtered session lists and PCAP, hunt notes, zone-violation list
success_criteria:
    - metric: Aggregation
      target: A million connection rows render as an aggregated graph with counts on edges
    - metric: Grouping
      target: Addresses can be grouped by subnet or zone and collapsed or expanded
    - metric: Drill-down
      target: From any aggregated edge, the user reaches its raw rows in one action
