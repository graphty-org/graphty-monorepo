id: W1132
name: Who Still Uses This Application Before We Retire It
category: analysis
validated: false
personas:
    - enterprise-architect-portfolio-manager
requires_capabilities:
    - data-import
    - search
    - node-selection
    - directed-closure
    - typed-edge-filtering
    - group-collapse
    - computed-attributes
    - filtering
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - layout-hierarchical
    - details-on-demand
    - data-export
