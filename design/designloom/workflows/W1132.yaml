      url: https://help.ardoq.com/en/articles/43927-an-introduction-to-application-rationalization
      summary: Seven-step process ending in the 5Rs (retain, retire, replace, renovate, re-engineer)
    - title: SAP LeanIX - Circle Map report
      url: https://docs-eam.leanix.net/docs/circle-map-report
      summary: Interfaces shown with provider and consumer applications, which must be documented on each interface
    - title: SAP LeanIX - Differential view in the Interface Circle Map
      url: https://updates.leanix.net/announcements/differential-view-in-interface-circle-map
      summary: Shows whether provider or consumer links are added, removed or unchanged for a planned change
    - title: LeanIX community - Capability links at the lowest application level
      url: https://community.leanix.net/application-portfolio-management-42/l1-applications-leave-empty-bcs-and-orgs-705
      summary: Capability relations kept on child applications, not duplicated on the parent
    - title: SAP LeanIX - GraphQL basics
      url: https://docs-eam.leanix.net/reference/graphql-basics
      summary: Retrieve fact sheets and relations for custom reports and extracts
    - title: The Open Group - ArchiMate Model Exchange File Format
      url: https://www.opengroup.org/open-group-archimate-model-exchange-file-format
      summary: XML exchange of elements, relationships and views; required for certified tools since June 1, 2018
    - title: LeanIX virtual workspaces webinar (vendor)
      url: https://www.slideshare.net/leanIX_net/leanix-virtual-workspaces
      summary: Average workspace 6,700 fact sheets and 23,000 relations; maxima 70,000 and 215,000 (May 2019)
