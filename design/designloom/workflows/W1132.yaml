starting_state:
    data_type: hand-curated enterprise architecture model (applications in a parent-child hierarchy, interfaces with provider and consumer applications, IT components, business capabilities three levels deep, organizations, owners) exported as Excel tables or ArchiMate exchange XML
    node_count: 1,000-70,000 (LeanIX workspaces averaged about 6,700 fact sheets and 23,000 relations in 2019, vendor)
    edge_density: sparse, typed by meta-model
    user_expertise: intermediate
goal: >-
    **Intent**: Before an application is retired or replaced, list every application and interface that still uses it,
    every business capability it is the only one to support, the infrastructure it runs on, and the owners who must
    agree.


    **Mental Model**: "Who points at this, and what part of the business falls over without it." The model is curated
    by hand and typed by a meta-model; usage references run into the application, and capabilities sit above it in a
    hierarchy.


    **Task Phases** (no source gives per-step durations):

    1. **Pick candidates** - Place applications on a TIME chart (tolerate, invest, migrate, eliminate); rank by a
    structural complexity score (realized capabilities, integrations, connected infrastructure); list quick wins that
    reach end of life within a year with no capability at risk

    2. **Open in context** - Make the candidate the focus, with incoming depth raised; choose which reference types count

    3. **Follow incoming usage references** - Through the interfaces it provides to every consumer application, and on
    to their dependents, ignoring ownership and hierarchy links; a chain that changes direction needs a second view

    4. **Roll up to capabilities** - Collect realized capabilities at the lowest application level (module, not whole
    ERP), roll up to level 2 and level 1, and flag any capability with no other realizer

    5. **Add infrastructure and organizations** - Connected servers and services; owning organizational units and experts

    6. **List owners** - Owner and expert for every affected application, interface and capability

    7. **Hand off and plan** - Export the table to Excel, a map image for a presentation, a roadmap; write the decision
    (retire, replace, keep) back to the application; compare the planned state with today's to see which links change


    **Decision Points**:

    - Which reference types count as usage for this question, and how deep to follow them?

    - Is a capability truly covered by another application, or only mapped to one at a different level?

    - Retire now, replace first, or keep (quick win versus capability at risk)?

    - Is the model current enough to trust, or must owners confirm first?


    **Information Needs**:

    - Upstream closure with the reference types and depth used stated

    - Affected capabilities grouped by the capability hierarchy, with a count of other realizers for each

    - Owner and expert per affected item

    - Provider versus consumer role on each interface, kept apart from data direction


    **Pain Points**:

    - Ardoq's Dependency Map cannot follow a chain that changes direction

    - Sparx shows ArchiMate relationship types as plain UML dependencies in its Traceability window

    - Provider and consumer are confused with data direction

    - The model goes stale between surveys


    **Data Flow**:

    - Input: Excel tables of items and relations from LeanIX or Ardoq, or an ArchiMate Model Exchange File Format XML
    file; capability hierarchy; owners

    - Transformations: Reverse closure over usage reference types, rollup of realized capabilities through the
    hierarchy, other-realizer count per capability, owner join

    - Output: Affected application, interface and capability list with owners as Excel or CSV; grouped map image;
    retirement decision recorded per application
success_criteria:
    - metric: Consumer completeness
      target: User lists every application that uses the candidate through usage references, with the depth and types stated
    - metric: Capability risk
      target: User can name each capability, at every hierarchy level, that would be left with no supporting application
    - metric: Hand-off
      target: Affected items export with their owners as a table the owners can act on
