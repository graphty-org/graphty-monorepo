starting_state:
    data_type: legislator-by-bill cosponsorship records or a member-by-vote roll-call table, one per session, plus a member table keyed by ICPSR code
    node_count: 100-1700 legislators per collection; up to 20,000+ bills per session
    edge_density: dense once projected
    user_expertise: expert
goal: >-
    **Intent**: Build one legislator network per Congress or legislative period from cosponsorship or roll-call
    records, keep the bills in view rather than hiding them in a projection, and compare cooperation across party lines
    from session to session.


    **Mental Model**: "One chamber, many sessions." Each session is its own network with its own members; the same
    legislator keeps the same id and the same place across sessions so change is visible. Bills are the second kind
    of node; a legislator-only network is a derived view with a stated rule.


    **Task Phases**:

    1. **Load records** - Sponsor, cosponsors and date per bill (Fowler's archive, the briatte/congress code, or parlnet
    for European chambers), or Voteview's member votes; join the member table by ICPSR code for party, state and
    seniority

    2. **Split by session** - One network per Congress or legislative period, members present that session only

    3. **Keep it two-mode** - Legislator-by-bill network with bills colored by the party mix of their supporters; or
    roll calls turned into an agreement network with a visible threshold (fixed, or the crossing point of same-party
    and cross-party agreement counts)

    4. **Project only with a stated rule** - Binary, count or Newman weight, or a cutoff such as "more than one bill
    from the same sponsor"; compare clustering in the bipartite network and in the projection

    5. **Compare sessions** - Small multiples with one layout seed and shared styling: party color, degree size,
    cross-party edges highlighted; per panel the share of cross-party ties, modularity by party and top bridges

    6. **Hand off and publish** - Export per-session edge lists, member attributes and the rule used to R (ergm,
    btergm, NetMix); export one figure per session in journal format


    **Decision Points**:

    - Keep legislator-by-bill data bipartite or project it, and with which weight?

    - Which threshold makes an agreement tie, and is it set per session or once for all?

    - Which cutoff turns cosponsorship counts into binary ties for a TERGM?

    - How to handle members who serve part of a session or switch party?


    **Information Needs**:

    - Bills per session and the share with cross-party cosponsors

    - Clustering in the two-mode network versus the projection

    - Edge counts and component counts as the threshold moves

    - Per-session statistics side by side: density, cross-party share, modularity by party

    - Which members appear in which sessions


    **Pain Points**:

    - Projection inflates clustering and suggests copartisan cooperation where many bills are bipartisan

    - Different bipartite networks can give the same projection

    - Thresholds and cutoffs are invisible in the published figure

    - Each session has a different node set, so layouts and comparisons do not line up


    **Data Flow**:

    - Input: Cosponsorship or roll-call records per session; member table keyed by ICPSR code

    - Transformations: Session split, two-mode network, agreement or projection with a stated rule, per-session
    statistics

    - Output: Small-multiple figures per session, per-session edge lists and attributes for R, the rule written into the
    export
success_criteria:
    - metric: Rule visibility
      target: Every exported network and figure states its projection weight or agreement threshold
    - metric: Session comparability
      target: A legislator present in two sessions is drawn with the same color and, where layouts are shared, near the same place
    - metric: Projection check
      target: User can read clustering for the bipartite network and its projection side by side
