starting_state:
    data_type: GFA assembly graph plus a table of sequence hits (BLAST tabular output, or GAF) for a FASTA of query genes
    node_count: 3-3,000 segments
    edge_density: sparse
    user_expertise: advanced
goal: >-
    **Intent**: Find where a resistance, virulence or marker gene lies on the assembly graph, see which replicon it is
    on, and pull out the sequence along the path that spells it.


    **Mental Model**: "Paint the gene on the map." Each hit covers part of one or more segments; the component the hit
    sits on is the molecule that carries the gene.


    **Task Phases**:

    1. **Load the graph and hits** - Load the GFA, then a hits table keyed on segment name with query, start, end,
    identity and coverage

    2. **Filter hits** - Set identity and coverage cutoffs and pick one query or all queries

    3. **Show hits on the graph** - Paint each hit onto the covered part of its segment in the query's color

    4. **Narrow the view** - Redraw only the nodes within a chosen number of steps of the hit segments

    5. **Follow the path** - Find oriented paths through the hit segments that spell the query; choose one

    6. **Extract and save** - Copy the sequence along the chosen path, honoring orientation and removing overlaps;
    export the hit table with component ids and an image


    **Decision Points**:

    - Which identity and coverage cutoffs separate real hits from partial matches?

    - Which candidate path is real when a gene runs through a repeat? Depth on each path helps

    - Is the gene on the chromosome or a plasmid component?


    **Information Needs**:

    - Hits per query with segment, position range, identity and coverage

    - Number of candidate paths per query, and each path's node list with orientation

    - Component and depth of each hit segment


    **Pain Points**:

    - The search needs BLAST installed on the same computer

    - Paths with gaps are not accepted, so scaffold paths are split

    - Path sequence is shorter than the sum of its nodes because overlaps are removed, which confuses length checks


    **Data Flow**:

    - Input: GFA graph, BLAST tabular or GAF hits, optional node label CSV

    - Transformations: hit-to-segment join, neighborhood scope, oriented path search, sequence spelling

    - Output: path sequence FASTA, hit table with component, highlighted image
success_criteria:
    - metric: Replicon assignment
      target: User can state which component carries each query gene
    - metric: Path sequence correctness
      target: Extracted sequence equals the oriented concatenation of segments minus overlaps
