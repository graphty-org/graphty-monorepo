id: W1158
name: Inspect a Structural Variant Bubble in a Pangenome Subgraph with Haplotype Paths
category: exploration
validated: false
personas:
    - pangenome-graph-researcher
requires_capabilities:
    - data-import
    - data-validation
    - graph-rendering
    - layout-force-directed
    - path-highlighting
    - path-focus-dimming
    - node-selection
    - details-on-demand
    - visual-encoding-nodes
    - visual-encoding-edges
    - external-label-overlays
    - legend-display
    - filtering
    - linked-views-selection
    - export-image
    - gfa-sequence-graph-import
    - bidirected-edge-model
    - sequence-length-node-geometry
    - path-track-overlay
    - linearized-path-matrix-view
suggested_components:
    - file-drop-zone
    - data-import-dialog
    - attribute-table-join-dialog
    - graph-canvas
    - filter-panel
    - layout-panel
    - visual-encoding-panel
    - legend-panel
