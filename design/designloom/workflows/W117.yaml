starting_state:
    data_type: A system design drawn by hand as a data flow diagram (processes, external interactors, data stores, data flows, trust boundaries)
    node_count: 10-100 elements
    edge_density: sparse, directed data flows crossing grouped trust boundaries
    user_expertise: intermediate
goal: >-
    **Intent**: Find where untrusted data crosses a trust boundary in a proposed design and list the threats to fix
    before it is built. Security architects and application security engineers do this early in design and again when
    the system changes, in the Microsoft Threat Modeling Tool, OWASP Threat Dragon, a whiteboard, or as code in pytm or
    Threagile. Fewer than half of the companies that threat model do it for every release (2025 vendor survey). The
    graph is small and hand-made, so this workflow carries should-have requirements only.


    **Mental Model**: "Where does data cross a line?" Elements are typed stencils, flows are arrows, trust boundaries are
    lines or boxes; every flow that crosses a boundary is a place to ask the STRIDE questions (spoofing, tampering,
    repudiation, information disclosure, denial of service, elevation of privilege). STRIDE was part of the strategy
    of 88% of respondents to the 2024-2025 Threat Modeling Connect survey.


    **Task Phases**:

    1. **Draw or declare the diagram** - Place process, external interactor, data store and data
    flow stencils, with child types such as HTTP versus HTTPS flows, and draw trust boundaries; or declare the same
    elements in Python (pytm) or YAML (Threagile) and generate the diagram

    2. **Set element properties** - Out of scope with a reason; protocol, encrypted and public
    network on flows; stores credentials on data stores

    3. **Generate threats** - Rules read properties and position: pytm conditions test whether a flow
    crosses, enters or exits a boundary; Threagile has about 40 built-in risk rules; Threat Dragon suggests threats per
    element by STRIDE type or by context

    4. **Triage** - Selecting a threat highlights its interaction on the diagram; set status
    (open, not applicable, mitigated, accepted, transferred, avoided, eliminated), severity and justification

    5. **Decompose goals** (optional) - Attack trees break an attacker's goal into alternative paths

    6. **Report and keep current** - Threat model report with per-element threats; check the model against the code
    as the system changes


    **Decision Points**:

    - Where do the trust boundaries go, and what is out of scope?

    - Is each generated threat real for this design, and what mitigates it?

    - Has the design changed enough to revisit the model?


    **Information Needs**:

    - Which flows cross which boundaries, in which direction

    - Threats per element with status and severity, visible on the diagram

    - Element type and properties at a glance

    - How old the model is relative to the system it describes


    **Pain Points**:

    - Scope is hard to set and architecture documentation is often missing (interviews in large Dutch organizations)

    - Diagrams drawn in general tools carry no element types, so no threats can be generated from them

    - Generated threat lists are long and need manual triage; practitioners keep returning to the diagram to validate
    threats

    - Models go stale as code changes, and follow-up on results is weak


    **Data Flow**:

    - Input: Hand-drawn typed diagram, or a pytm or Threagile model file

    - Transformations: Rule-based threat generation per element and boundary-crossing flow

    - Output: Threat list with statuses, report, diagram image

success_criteria:
    - metric: Typed diagramming
      target: User can place typed elements and group them inside named trust boundaries
    - metric: Boundary crossings
      target: Every flow crossing a boundary is listed with its direction
    - metric: Threat status on the diagram
      target: User sees which elements still carry open threats without opening the threat list
sources:
    - title: OWASP - Threat modeling cheat sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
      summary: Data flow diagrams, tools, attack trees
    - title: Microsoft Learn - Threat Modeling Tool data flow diagrams
      url: https://learn.microsoft.com/en-us/training/modules/tm-use-recommended-tools-to-create-a-data-flow-diagram/2-threat-modeling-tool
      summary: Stencils, child types, properties, threat generation
    - title: OWASP Threat Dragon - Threat generation
      url: https://owasp.org/www-project-threat-dragon/docs-1/threat-generation
      summary: STRIDE threats per element
    - title: Microsoft Learn - Threat Modeling Tool feature overview
      url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-feature-overview
      summary: Stencil categories, out of scope with reason, unconnected-flow messages, interaction focus, priority, HTML report
    - title: Threat Dragon docs - Threats
      url: https://www.threatdragon.com/docs/usage/threats.html
      summary: Threats by type or by context; flow and store properties; status and severity values
    - title: OWASP pytm
      url: https://github.com/OWASP/pytm
      summary: Threat model as Python; crosses, enters, exits and inside conditions; Graphviz DFD; risk color map; staleness check
    - title: Threagile
      url: https://github.com/Threagile/threagile
      summary: Threat model as YAML; about 40 built-in risk rules; generated data flow diagrams (read through a search summary)
    - title: Shostack - State of threat modeling 2024-2025
      url: https://shostack.org/blog/state-of-threat-modeling-2024-2025/
      summary: 60+ organizations; STRIDE 88%; diagrams a main source for 37%
    - title: Security Compass - 2025 state of threat modeling (vendor survey)
      url: https://www.securitycompass.com/Research%20Reports/The-2025-state-of-threat-modeling-and-security-by-design.pdf
      summary: Fewer than half of companies that threat model do so every release (read through a search summary)
    - title: Verreydt et al. - Threat modeling state of practice in Dutch organizations (SOUPS 2024)
      url: https://usenix.org/conference/soups2024/presentation/verreydt
      summary: Challenges of scope, architecture documentation, scaling and follow-up
