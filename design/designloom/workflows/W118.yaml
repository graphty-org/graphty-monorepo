starting_state:
    data_type: alert payload plus 6-12 months of transactions (amount, direction, channel, counterparty, timestamp) for each subject account, KYC profiles, prior alerts and SARs
    node_count: 10-300 accounts and counterparties; hundreds to thousands of transaction edges
    edge_density: sparse, star-shaped around subject accounts, with many parallel edges per pair
    user_expertise: intermediate
goal: >-
    **Intent**: Take an alert that a Level 1 reviewer escalated, build the full transaction picture for every subject,
    decide whether the activity is suspicious, and either file a suspicious activity report (SAR) with a narrative that
    gives who, what, when, where and why, or record a supported decision not to file. In the US the SAR is due 30 days
    from detection (up to 60 if no suspect is identified); supporting documentation is kept five years and must reproduce
    the narrative's numbers.


    **Mental Model**: "Build the case file around the money." The subject accounts sit in the middle; counterparties are
    around them; every edge is a sum of real transactions that can be listed. Only the bank's own legs are visible, so
    the picture is a star with external leaves until names are grouped and other banks answer.


    **Task Phases**:

    1. **Read the alert** - Open the triggering transactions and the customer profile; note the scenario that
    fired (cash just under 10,000 dollars, rapid in-and-out wires)

    2. **Link alerts and subjects** - Look at the 1 to 2 hop neighborhood styled by "has open alert" and "has
    prior SAR"; decide whether this is one case or several and pull the related alerts in

    3. **Assemble the transaction picture** (the longest step, a vendor estimate puts the whole case at about three hours)
    - Import 6 to 12 months for all subjects as accounts-as-nodes and transactions-as-edges; group free-text wire and ACH
    counterparty names into probable counterparties, keeping external counterparties as their own kind of node; sum
    parallel transactions per pair and direction (W120)

    4. **Ask other institutions** - Where money leaves to another bank, send a 314(b) request to a registered peer;
    merge the answer's legs into the case graph with the responding bank recorded as their source. (UK firms use the
    Economic Crime and Corporate Transparency Act 2023 sharing provisions)

    5. **Research subjects** - Screening lists, company registries, adverse media; attach the hits to nodes

    6. **Test typologies** - On the summed graph look for fan-in, fan-out, pass-through, round-tripping cycles
    and sub-threshold cash, using a histogram near the reporting threshold and a timeline

    7. **Recommend** - Write the recommendation for the second reviewer or committee, with the chart and the
    supporting tables

    8. **File or document** - Write the narrative (a chart image cannot be attached, so what the chart shows must
    be described in words); export the transaction or per-pair table as the one CSV the SAR allows (at most 1 MB, chosen
    columns, its contents described in the narrative, because tabular data does not belong in the narrative); or record
    the no-file decision; save the case state for retention

    9. **Continuing activity** (later) - At the optional 90-day review compare counterparties and flows between the
    period already reported and the new period; file again by day 120 if activity continues


    **Decision Points**:

    - One case or several? Which alerts and subjects belong together?

    - Which free-text counterparty spellings are the same party?

    - Is it worth a 314(b) request, and to which bank?

    - Which typology, if any, does the activity match, and is there a legitimate explanation?

    - Which columns and rows go into the single CSV, and does it fit in 1 MB?

    - File, do not file, or (UK) request a defence against money laundering, which starts a seven-working-day notice
    period?

    - At the 90-day review, is the activity continuing?


    **Information Needs**:

    - Per pair and direction: transaction count, total, minimum, maximum, first and last date

    - Source of every leg (own records, 314(b) response, statement)

    - Distribution of cash deposit amounts near the reporting threshold

    - Timeline of flows for the narrative's "when"

    - New and dropped counterparties and changed totals between two date ranges

    - The deadline (shown by the case system or the app, not computed over the graph)


    **Pain Points**:

    - Data gathering dominates the case; transaction analysis often means manual SQL

    - Hundreds of parallel transactions draw as a hairball unless summed

    - The same counterparty under many spellings and partial account numbers

    - The trail goes dark at the bank's edge

    - Nothing in the chart flows into the narrative; numbers are retyped

    - Graph tools priced and complex enough that few investigators have one


    **Data Flow**:

    - Input: Alert payload, transaction extract per subject (CSV or Excel), KYC profiles, screening hits, 314(b)
    responses

    - Transformations: Counterparty name grouping, parallel-edge aggregation, date and amount filters, typology tests,
    period comparison

    - Output: File or no-file decision, SAR narrative with five essential elements, one CSV attachment of at most 1 MB
    (transactions or per-pair sums with chosen columns), chart plus tables of sums, dates and paths retained as
    supporting documentation
success_criteria:
    - metric: Narrative support
      target: Every amount and date stated in the narrative can be regenerated from the saved case graph and its tables
    - metric: Provenance
      target: Every edge shows whether it came from own records or another institution's response
    - metric: Attachment
      target: The case subset exports as one CSV of at most 1 MB with the columns the investigator chose
    - metric: Continuing activity
      target: User can list new counterparties and changed totals between two date ranges in one step
sources:
    - title: FFIEC BSA/AML Examination Manual - Suspicious Activity Reporting
      url: https://bsaaml.ffiec.gov/manual/AssessingComplianceWithBSARegulatoryRequirements/04
      summary: Alert generation, alert management and SAR decision; decisions must be supported and reasonable
    - title: FinCEN SAR FAQs, October 2025 (NCUA copy)
      url: https://ncua.gov/regulation-supervision/regulatory-compliance-resources/bank-secrecy-act-resources/frequently-asked-questions-regarding-suspicious-activity-reporting
      summary: 30 and 60 day deadlines, 90-day continuing activity review with filing at 120 days, no-file documentation optional
    - title: 31 CFR 1020.320 - Reports by banks of suspicious transactions
      url: https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1020/subpart-C/section-1020.320
      summary: Filing obligation, deadlines and five-year retention
    - title: FinCEN - Suggestions for addressing common errors in SARs
      url: https://www.fincen.gov/resources/statutes-regulations/guidance/suggestions-addressing-common-errors-noted-suspicious
      summary: Five essential elements; explain why the activity is suspicious
    - title: FinCEN SAR Filing Instructions (April 2026, version 1.0)
      url: https://bsaefiling.fincen.gov/resources/FinCENSARFilingInstructions.pdf
      summary: Section 6.1.6 allows one Excel-compatible CSV of at most one megabyte, described in Part V and suited to transaction records too numerous for Part V; no other attachments; no tabular data in the narrative
    - title: FinCEN - SAR supporting documentation
      url: https://www.fincen.gov/index.php/resources/statutes-regulations/guidance/suspicious-activity-report-supporting-documentation
      summary: Supporting documentation deemed filed and produced on request
    - title: Morrison Foerster - FinCEN expands section 314(b) guidance
      url: https://www.mofo.com/resources/insights/260617-fincen-expands-section-314-b-information-sharing-guidance
      summary: Suspected fraud alone qualifies; real-time sharing; SARs themselves may not be shared
    - title: SymphonyAI - How AI agents reduce AML investigation time
      url: https://www.symphonyai.com/resources/blog/financial-services/how-ai-agents-reduce-aml-investigation-time/
      summary: Vendor estimate of about 17 minutes of transaction analysis, often manual SQL, and about three hours per case
    - title: Linkurious - AML investigation solution
      url: https://linkurious.com/aml-investigation-solution
      summary: Vendor; neighborhood styled by open alert and prior SAR
    - title: Neo4j - Beyond the alert
      url: https://neo4j.com/?p=435608
      summary: Adds Companies House officers and OpenSanctions matches during subject research
    - title: POCA 2002 section 335
      url: https://www.legislation.gov.uk/ukpga/2002/29/section/335
      summary: UK defence against money laundering notice period of seven working days and 31-day moratorium
