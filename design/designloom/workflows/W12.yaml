goal: >-
    **Intent**: Identify unusual patterns or entities that deviate from expected behavior. User wants to find anomalies
    that could indicate fraud, errors, security threats, or interesting discoveries.


    **Mental Model**: "Finding what doesn't fit" - like spotting the one person in a crowd wearing winter clothes in
    summer. Anomalies are defined relative to a baseline of "normal", and in networks "normal" is usually heavy-tailed,
    not bell-shaped.


    **Task Phases**:

    1. **Establish Baseline** - Define what "normal" looks like per node type (degree distribution, clustering
    patterns, attribute ranges); look at the distributions on log scales before choosing a rule

    2. **Statistical Detection** - Score on log-transformed or rank scores rather than raw z-scores, since degree and
    betweenness are heavy-tailed and raw z-scores flag the tail by construction

    3. **Structural Detection** - Score each node by its distance from a fitted pattern of egonet features (for
    example, edges vs nodes or total weight vs edges in the egonet, the OddBall approach), or by within-module z-score
    and unexpected community membership

    4. **Triage** - Rank anomalies by score, group similar ones, and show the reason for each flag

    5. **Investigation** - Deep dive into top anomalies (ego network, attributes, history)

    6. **Classification** - Label as error, threat, or genuine discovery


    **Decision Points**:

    - What constitutes "normal" for this domain and node type?

    - Which score: log or rank of a metric, distance from a fitted egonet pattern, or within-module z?

    - Where to cut the ranked list, given triage capacity?

    - Is this anomaly an error, a threat, or something interesting?

    - Should I adjust the baseline definition?


    **Information Needs**:

    - Baseline distributions per node type, on log scales

    - Anomaly scores with the reason for each (which feature, how far from the fit)

    - Local context (what's unusual about this entity's neighborhood?)

    - Temporal context (did this just change or was it always anomalous?)

    - Similar anomalies (are there others like this?)


    **Pain Points**:

    - "Normal" is hard to define in heterogeneous networks

    - Standard-deviation rules assume roughly normal metrics, which network metrics rarely are

    - Fitted-pattern methods assume most nodes follow the pattern

    - Too sensitive = too many false positives; too strict = missing real anomalies

    - Explaining why something is anomalous to non-technical stakeholders

    - New entities always look anomalous (lack of history)


    **Data Flow**:

    - Input: Graph with node/edge attributes + baseline definition per node type

    - Transformations: Distribution inspection, heavy-tail-aware scoring, egonet pattern fitting, ranking

    - Output: Prioritized anomaly list with reasons, classification and evidence
success_criteria:
    - metric: Anomalies detected
      target: True anomalies surfaced
    - metric: Heavy tails respected
      target: Scores use log, rank, fitted-pattern or within-module measures, not raw z on heavy-tailed metrics
    - metric: Reason shown
      target: Each flag carries the feature and deviation that triggered it
    - metric: False positive rate
      target: Manageable triage workload
    - metric: Classification accuracy
      target: Anomalies correctly labeled as error/threat/discovery
sources:
