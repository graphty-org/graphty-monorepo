goal: >-
    **Status**: Retired. This record used to describe a domain-free "find the anomalies" pass in six phases (establish
    a baseline, statistical detection, structural detection, triage, investigation, classification). No tool manual or
    practitioner report documents that sequence; it cited only research methods (OddBall and a survey of graph anomaly
    methods). Every evidenced anomaly workflow starts from a domain rule or from known labels instead. The record is kept
    so that old references resolve, and it is linked to no persona.


    **Use instead**:

    - W336 Ranked Case List from Detection Rules or Seeded Scores -- the fraud, AML and security version: a saved
    pattern query or a label-seeded score fills a ranked case list; each row opens its subgraph; the analyst assigns,
    comments and confirms or dismisses. In Linkurious "The models of an alert are the detection patterns which users
    set", the target entity is "used to deduplicate and group pattern occurences", and an alert runs every hour by
    default. Neo4j's fraud series starts from flagged accounts and ranks the rest by weighted degree over shared
    identifiers.

    - W109 Enterprise Attack Path Management and Choke Point Remediation, W111 SOC Alert Triage with an EDR Process
    Tree, and W112 Host-to-Host Logon Graph During Incident Response -- the security sequences.


    **What survives from the old record**: anomaly-detection only as the scoring step that feeds the ranked case list.
    Where rows are ranked by a heavy-tailed centrality, use log, rank or within-module scores, not z-scores. The
    anomaly-panel component is replaced by the ranked case list (ranked-node-table with case triage).


    **Evidence that a domain-free scan is not a practitioner workflow**: PyGOD returns a score per node, "the higher,
    the more abnormal", with no workflow around it; the BOND benchmark by its authors found that "Most methods evaluated
    fail to detect organic outliers" as opposed to injected ones.
success_criteria:
    - metric: No requirement is drawn from this record
      target: Capabilities and components cite W336, W109, W111 or W112 instead
sources:
    - title: Linkurious Enterprise user manual 4.2 - alert setup
      url: https://doc.linkurious.com/user-manual/4.2/alert-setup/
      summary: Alert models are user-set detection patterns; the target entity deduplicates and groups occurrences; runs every hour by default
    - title: Exploring fraud detection with Neo4j Graph Data Science, part 3
      url: https://neo4j.com/blog/developer/exploring-fraud-detection-neo4j-graph-data-science-part-3/
      summary: Starts from flagged accounts, ranks others by weighted degree over shared identifiers, analysts label more fraud accounts
    - title: BOND - benchmarking unsupervised outlier node detection on static attributed graphs (NeurIPS 2022)
      url: https://arxiv.org/html/2206.10071
      summary: Most methods evaluated fail to detect organic outliers as opposed to injected ones
    - title: PyGOD 0.2.0 on PyPI
      url: https://pypi.org/project/pygod/0.2.0/
      summary: Returns an outlier score per node, higher is more abnormal; no analyst workflow
