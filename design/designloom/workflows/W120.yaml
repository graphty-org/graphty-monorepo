starting_state:
    data_type: transaction extract, one row per transaction (from account, to account, amount, currency, timestamp, channel)
    node_count: 20-2,000 accounts
    edge_density: sparse between accounts but with tens to hundreds of parallel transactions per pair
    user_expertise: intermediate
goal: >-
    **Intent**: Show where money came from and went, how much and when, for every escalated case. The graph is a directed,
    timestamped multigraph; the job is to collapse it into one readable edge per pair and direction carrying the sum, the
    count and the date range, filter it by time and amount, and follow directed paths. It shows that money moved; how much
    of a particular deposit arrived is W121.


    **Mental Model**: "A flow chart of accounts." i2 users call it summing the links; Linkurious calls it edge grouping;
    KeyLines calls it aggregate links. Thick arrows mean big totals, the timeline says when, and any thick arrow can be
    opened back into its transactions.


    **Task Phases**:

    1. **Import** (10 min) - Load a statement or transaction extract, mapping columns to account and transaction types
    (i2 uses a saved import specification)

    2. **Collapse parallel edges** (2 min) - One edge per pair and direction with count, sum, average, minimum, maximum and
    first and last date; width by sum

    3. **Show net flow and a timeline** (5 min) - Net flow between pairs; play a time bar to see the sequence

    4. **Filter by time and amount** (5 min) - Keep transactions over a threshold (the Cambridge Intelligence XRP example
    uses 3,000 dollars) or within a period; filters apply to the individual transactions before summing; histograms show
    peaks

    5. **Trace paths with direction** (10 min) - Directed paths from a source to a destination; templates such as "all
    transactions within 24 hours of this one"; look for loops of 3 to 6 hops where each amount is 80 to 100 percent of the
    previous and dates increase

    6. **Hand off** (10 min) - Export the image plus tables of sums, dates and paths for the case file or narrative


    **Decision Points**:

    - Sum per direction, or show net flow?

    - Which threshold and period isolate the suspicious activity?

    - Is a loop a round-trip (shrinking amounts, increasing dates) or ordinary business?

    - Which paths go into the exhibit or narrative?


    **Information Needs**:

    - Per aggregated edge: count, sum, average, min, max, first and last date, currency

    - The transactions behind any aggregated edge, listable and exportable

    - Amount and date histograms

    - Paths that respect direction and time order, with per-hop amount and date


    **Pain Points**:

    - Hundreds of parallel edges draw as an unreadable bundle

    - In KeyLines, graph functions ignore aggregated links, so analysis and display disagree

    - Aggregation is developer work in SDK-based tools

    - Graph databases model the transaction as a node (account performs transaction, transaction benefits account) for
    time-constrained queries, but investigators need it drawn as an edge

    - Paths and sums do not answer how much of a given deposit arrived


    **Data Flow**:

    - Input: Transaction rows as CSV or Excel (bank extract, wire and ACH records, ISO 20022 or SWIFT exports converted to
    rows)

    - Transformations: Column mapping, parallel-edge aggregation, net flow, time and amount filtering before aggregation,
    time-ordered path and cycle search

    - Output: Flow chart image, table of aggregated edges, list of paths with per-hop amounts and dates
success_criteria:
    - metric: Readable multigraph
      target: Parallel transactions collapse into one edge per pair and direction showing count, sum and date range, and expand back on demand
    - metric: Filter before sum
      target: Changing the date or amount filter updates every aggregated edge's totals
    - metric: Exhibit tables
      target: Aggregated edges and paths export as tables matching the drawn numbers
