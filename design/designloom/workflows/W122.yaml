id: W122
name: Tracing APP Scam Proceeds From a First-Hop Mule
category: analysis
validated: false
personas:
    - fraud-analyst
requires_capabilities:
    - search
    - node-selection
    - neighborhood-expansion
    - temporal-navigation
    - filtering
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - layout-hierarchical
    - path-highlighting
    - details-on-demand
    - annotation
    - analysis-history
    - data-export
    - time-respecting-paths
    - live-graph-streaming
suggested_components:
    - search-input
    - graph-canvas
    - context-menu
    - temporal-controls
    - filter-panel
    - visual-encoding-panel
