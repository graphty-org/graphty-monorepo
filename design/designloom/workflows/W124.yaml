goal: >-
    **Status**: Retired. This record described the same crypto tracing sequence as W105 (seed, clustering,
    attribution, hop-by-hop expansion, stop at an exchange, records request, export) for the same persona, from the
    exchange financial-crimes side. Each record held steps the other lacked, so both were partial. The record is kept so
    that old references resolve, and it is linked to no persona.


    **Use instead**: W105 Cryptocurrency Tracing from a Seed Address to a Cash-Out Exchange -- the full sequence in
    fourteen steps, including the transaction-as-node view, CoinJoin exclusion and undoable clusters, the allocation
    rule (W121), the watch list and the export audit log that this record carried.


success_criteria:
    - metric: Undoable clusters
      target: Every address merge names its heuristic and can be undone, splitting the cluster back
    - metric: Hop amounts
      target: Each hop on the trace shows the amount carried and the time
    - metric: Cash-out found
      target: The trace ends at a labelled service, with the label's source shown
