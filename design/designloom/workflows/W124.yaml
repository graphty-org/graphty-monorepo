      url: https://www.chainalysis.com/product/reactor/
      summary: Vendor; swaps, bridges and mixers auto-interpreted; attribution coverage; integrations with i2, Cellebrite and Siren
    - title: Chainalysis Academy - Reactor Essentials
      url: https://chainalysis-academy-clone.skilljar.com/reactor-essentials
      summary: Course ending with exporting from Reactor and OSINT (read through search summary)
    - title: Chainalysis Academy - Automated change detection in peel chains
      url: https://chainalysis-academy-clone.skilljar.com/automated-change-detection-peelchains
      summary: Change detection along peel chains (read through search summary)
    - title: Bisbee declaration, United States v. Sterlingov
      url: https://storage.courtlistener.com/recap/gov.uscourts.dcd.232431/gov.uscourts.dcd.232431.149.1.pdf
      summary: Co-spend clustering skipping CoinJoin, deposit-address sweeps, attributions confirmed by subpoena returns
    - title: Moser and Narayanan - Resurrecting address clustering in Bitcoin (FC 2022)
      url: https://arxiv.org/abs/2107.05749
      summary: False positives from CoinJoin and PayJoin; naive change merging produced a supercluster
    - title: Anderson et al. - Bitcoin Redux (WEIS 2018)
      url: https://www.cl.cam.ac.uk/~rja14/Papers/bitcoin-redux-weis2018.pdf
      summary: Poison, haircut and FIFO allocation
