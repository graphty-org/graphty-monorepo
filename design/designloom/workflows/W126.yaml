starting_state:
    data_type: statements, check images, deposit tickets and wire records from several banks, extracted from PDF into rows
    node_count: 5-100 accounts, payees and sources
    edge_density: sparse, with many parallel transactions per pair
    user_expertise: expert
goal: >-
    **Intent**: Turn many banks' subpoenaed records into one reconciled transaction database, show sources and uses of
    funds, and present an exhibit in which every number ties back to a page of a statement. Forensic accountants and
    law-enforcement financial investigators follow a long-established sequence (Peterson's 14 steps for the National White
    Collar Crime Center) that ends in a chart.


    **Mental Model**: "Spreadsheet first, chart last." The chart is the summary of a reconciled ledger, not the place where
    the analysis happens; it has to be defensible line by line.


    **Task Phases**:

    1. **Plan and obtain** - Subpoenas; inventory every record received with an index and status log

    2. **Extract** (the longest step) - Statements, checks, deposit items and wires into rows by OCR

    3. **Normalize** - One template: date, account, counterparty, amount, instrument, check number, memo, source
    file and page; import many files into one graph

    4. **Review for leads** - Payees, endorsements, signatories, where checks were negotiated

    5. **Match internal transfers** - Pair a debit and a credit of the same amount within a few days across the
    subject's own accounts so they are not counted as income

    6. **Analyze** - By date, payee and source; a flow matrix among accounts

    7. **Chart** - Flow-of-funds Sankey or link chart sized by amount, each flow drillable to its transactions

    8. **Trace under a rule** (when needed) - W121

    9. **Present** - Exhibit and summary tied to source documents


    **Decision Points**:

    - Which debit and credit pairs are internal transfers, and which matches are coincidences?

    - Which payees are the same party under different names?

    - What goes on the exhibit and what stays in the workpapers?


    **Information Needs**:

    - For every transaction, the source file and page

    - Proposed transfer matches with amount and day gap, accepted or rejected one by one

    - Totals by source, use and payee

    - Flow matrix between accounts


    **Pain Points**:

    - Extraction and transfer matching across banks take most of the time

    - Charting tools do not carry the source page, so tie-out is manual

    - Link charts show movement but not the totals a court asks about


    **Data Flow**:

    - Input: PDF statements and images extracted to CSV or Excel per bank and account

    - Transformations: Normalization to one template, multi-file import, transfer matching, payee grouping, aggregation,
    flow matrix

    - Output: Reconciled transaction database, flow-of-funds chart, exhibit tables tied to source pages
success_criteria:
    - metric: Tie-out
      target: Clicking any flow lists its transactions with source file and page
    - metric: Transfer matching
      target: User reviews proposed internal-transfer matches and the chart excludes accepted ones from income
    - metric: Multi-file import
      target: Statements from several banks load into one graph with each row's file recorded
