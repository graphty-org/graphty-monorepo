starting_state:
    data_type: claims, policies, parties, vehicles, addresses, phones, emails, payout accounts and service providers (garages, credit-hire firms, solicitors, doctors); industry database matches
    node_count: 20-500 in the working view (Zurich Switzerland's store holds about 20 million nodes)
    edge_density: sparse, with hub providers linked to hundreds of claims
    user_expertise: intermediate
goal: >-
    **Intent**: Decide whether a claim referred by automated scoring is isolated or part of a staged-accident
    (crash-for-cash) network, stop payment where justified, and refer networks to the fraud bureau or police. US
    investigators must also report suspected fraud to the state.


    **Mental Model**: "Each detail looks harmless alone." A shared garage, a shared solicitor and a shared payout account
    across several claims, each innocent alone, together form a ring. Busy providers are hubs, not evidence.


    **Task Phases**:

    1. **Score and refer** (automated) - A rules engine refers claims above a threshold

    2. **Open the claim network** - Claim with policies, customers, vehicles, payments and matches against
    national databases and blacklists

    3. **Expand to parties and their other claims** - Look for shared addresses, phones, payout accounts (fan-in
    of payouts), garages, credit-hire firms, solicitors and doctors; for property claims layer geography; for medical
    claims check whether providers share many patients

    4. **Discount hubs** - A garage linked to hundreds of claims gets its own check instead of linking everything

    5. **Check industry data** - UK: Cifas National Fraud Database, Insurance Fraud Register, IFB hub; Zurich UK
    adds Companies House and Equifax; US: ClaimSearch match reports and NICB

    6. **Decide** - Settle, or move to special fraud processing

    7. **Refer** - IFB or police (UK); state fraud division, district attorney and NICB (US)

    8. **Sweep the network** (periodic) - Find other claims in the same ring, including paid ones; academically, a
    claims-parties bipartite graph ranked with BiRank seeded by known fraud


    **Decision Points**:

    - Isolated claim or ring?

    - Which shared providers are hubs to discount?

    - Settle or special fraud processing?

    - Refer now, or keep investigating?


    **Information Needs**:

    - Each party's other claims, with dates and outcomes

    - Claim count per provider and per payout account, so hubs stand out

    - Industry database matches attached to parties

    - Ranking of claims and parties by closeness to known fraud


    **Pain Points**:

    - Link analysis runs only after referral, so clean-looking ring members are paid

    - Automated tools make 45 percent of referrals while SIU staffing grew 0.5 percent

    - One shared garage links hundreds of innocent claims

    - No public source records a click-by-click SIU session in a graph tool


    **Data Flow**:

    - Input: Referred claim id; claims system extract; industry database matches

    - Transformations: Seeded expansion to parties and their claims, hub discounting, components, seeded ranking

    - Output: Settle or special-fraud-processing decision, referral package with chart, list of linked claims for a sweep
success_criteria:
    - metric: Hub visibility
      target: Every provider and payout account shows how many claims it links, and hubs can be excluded before reading the ring
    - metric: Ring sweep
      target: From a confirmed ring the user can list every linked claim, including paid ones
