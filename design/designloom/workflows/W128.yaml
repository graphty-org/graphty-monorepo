    - title: Paudel, Eberle and Talbert - FLAIRS 2017
      url: https://cdn.aaai.org/ocs/15455/15455-68704-1-PB.pdf
      summary: Graph-based anomaly detection on CMS claims graphs; hit-and-run versus steal-a-little schemes
    - title: HHS-OIG - MFCU data mining
      url: https://oig.hhs.gov/fraud/medicaid-fraud-control-units-mfcu/data-mining.asp
      summary: Data mining by MFCUs under 42 CFR 1007.20
