goal: >-
    **Intent**: Build and maintain an enterprise knowledge graph that integrates data from many sources. This is the
    umbrella over several narrower workflows; for builders the graph view is a debugging and sanity-checking instrument,
    not the deliverable (18 of 19 interviewed practitioners used node-link diagrams, mostly as sanity checks).


    **Mental Model**: "Does the building match the blueprint?" The schema is the blueprint; each load or extraction run
    produces an as-built graph that must be checked against it.


    **Task Phases** (with what the visual tool does in each):

    1. **Schema design** - Sketch labels and relationship types (Neo4j Data Importer, arrows.app) or classes and
    properties (Protege); the visual task is reading the model as a small diagram (see W131, W134)

    2. **Entity extraction** - ETL from structured sources or LLM extraction from documents (see W132, W129); the visual
    task is a quality profile of the result (see W130)

    3. **Relationship mapping and load** - Generate and run ingestion; the visual task is comparing the loaded schema
    meta-graph with the intended model and checking counts per type (see W131)

    4. **Entity resolution** - Build duplicate candidates, review each group with its neighbors and evidence, merge, and
    keep a log that re-applies after rebuilds (see W130)

    5. **Quality validation** - SHACL or ROBOT reports for RDF graphs, counts and rebuild diffs for property graphs; the
    visual task is locating violations on the schema (see W137, W135)

    6. **Deployment and exploration** - Connect to query interfaces and applications; builders keep exploring around
    resources while writing queries (see W138)


    **Decision Points**:

    - What entities and relationships should the schema include?

    - How to handle schema evolution as requirements change?

    - What confidence threshold for entity resolution matches?

    - How to balance ontological rigor with practical mappability?

    - When is a rebuild good enough to promote to consumers?


    **Information Needs**:

    - Source system schemas and data samples

    - Schema meta-graph of the loaded data with exact counts, compared with the intended model

    - Duplicate candidate groups with neighbors and source evidence

    - Quality metrics (coverage, consistency, freshness) and count deltas since the last rebuild


    **Pain Points**:

    - Whole-graph views turn into hairballs (9 of 19 practitioners criticized hairballs)

    - Neo4j Browser shows 300 nodes by default and freezes near 1,000

    - Invalidated links come back on every rebuild

    - Graph tools handle RDF semantics poorly (literals hidden, language tags stripped, RDF-star dropped)

    - Consumers cannot read node-link diagrams at scale (12 of 19) and need abstracted views


    **Data Flow**:

    - Input: Multiple source systems (databases, documents, APIs, ontologies)

    - Transformations: Extraction, mapping, resolution, validation

    - Output: Integrated knowledge graph, query interfaces, quality reports, merge and invalidation logs
success_criteria:
    - metric: Coverage
      target: Key domain entities and relationships captured
    - metric: Load verification
      target: Loaded schema and per-type counts checked against the model after every rebuild
    - metric: Usability
      target: Downstream applications successfully query the KG
