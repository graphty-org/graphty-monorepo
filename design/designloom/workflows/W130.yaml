      url: https://neo4j.com/blog/developer/global-graphrag-neo4j-langchain/
      summary: 2,000-article profile, degree statistics, WCC, kNN 0.95 duplicate candidates, LLM adjudication, apoc merge
    - title: Neo4j blog - Microsoft GraphRAG output in Neo4j
      url: https://neo4j.com/blog/developer/microsoft-graphrag-neo4j/
      summary: Importing parquet into Neo4j; Scrooge duplicates; Project Gutenberg noise hub
    - title: One entity, seven identities
      url: https://dev.to/eyanpen/the-biggest-pitfall-in-graphrag-one-entity-seven-identities-5d8d
      summary: 12.7 percent of entities multi-typed on a 5G specification; PMIC with seven types; voting fix
    - title: CORE-KG
      url: https://arxiv.org/html/2510.26512
      summary: GraphRAG baseline 30.53 percent duplicate nodes vs 20.28 percent; coreference resolution matters most
    - title: Neo4j LLM Graph Builder features
      url: https://neo4j.com/labs/genai-ecosystem/llm-graph-builder-features/
      summary: Duplicate node merging and Delete Disconnected Nodes screens
