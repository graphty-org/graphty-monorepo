id: W134
name: Review Ontology Structure and the Inferred Hierarchy
category: exploration
validated: false
personas:
    - knowledge-engineer
requires_capabilities:
    - data-import
    - layout-hierarchical
    - layout-radial
    - search
    - neighborhood-expansion
    - filtering
    - visual-encoding-nodes
    - details-on-demand
