id: W135
name: Review an Ontology Release with ODK and ROBOT
category: reporting
validated: false
personas:
    - knowledge-engineer
requires_capabilities:
    - data-import
    - comparison-view
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - filtering
    - search
    - details-on-demand
    - export-image
    - report-generation
    - graph-diff
    - rdf-import
    - polyhierarchy-view
    - validation-report-overlay
    - mapping-set-view
suggested_components:
    - data-import-dialog
    - comparison-view
    - layout-panel
    - graph-canvas
    - visual-encoding-panel
