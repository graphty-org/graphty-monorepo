starting_state:
    data_type: user's first graph file or a hand-built spreadsheet (a from-to table, often typed by hand)
    node_count: unknown
    edge_density: unknown
    user_expertise: novice
goal: >-
    **Intent**: Help a new user successfully load their first graph and understand what the tool can do. User arrives with
    data but no prior graph analysis experience and needs to feel confident they can accomplish something meaningful.


    **Mental Model**: "Guided tour" - like a museum audio guide that introduces key features progressively. Also "training
    wheels" - supported early steps that build confidence before removing assistance.


    **Task Phases**:

    1. **Arrival** - See clear call-to-action (not empty canvas), understand what's possible

    2. **Data Loading** - Choose method (file, URL, paste, sample), see preview of how columns become nodes, edges and
    attributes, confirm load; a raw from-to spreadsheet is accepted, not only graph files

    3. **Import Check** - See node and edge counts beside the source's row counts, with skipped rows, duplicates and
    unmatched ids listed

    4. **First Visualization** - See graph rendered after a layout (the raw first picture is "kind of a mess"),
    understand basic stats (node/edge counts)

    5. **Guided Exploration** - Prompted to try key features (zoom, select, layout); every step can be undone

    6. **First Analysis** - Answer "who is central?" and "what groups are there?": size by a centrality and color by
    community, each with a plain-language note on what it measures and what it cannot tell

    7. **Read It Correctly** - A short note that drawn distance is not similarity, size is only one measure, and
    communities can change between runs unless seeded

    8. **Next Steps** - Export or share the picture, understand what else is possible, how to learn more


    **Decision Points**:

    - Which data loading method to use?

    - Should I try sample data first to learn the tool?

    - What do I want to explore in my data?

    - What analysis should I try?


    **Information Needs**:

    - Clear guidance on supported formats

    - Preview of data before committing to load

    - Basic statistics after loading, compared with the source's counts

    - Plain-language explanation of each measure applied

    - Explanations of what each feature does

    - Suggestions for what to try next


    **Pain Points**:

    - Overwhelming interface with too many options

    - No idea where to start

    - Data doesn't load and error messages are cryptic

    - Don't know what questions to ask of the data

    - Feel stupid asking "basic" questions

    - No undo: after a crash or wrong click, novices "had to start over"

    - First question is not yet a network question and needs reshaping

    - Metrics shown as a wall of numbers recall math anxiety


    **Data Flow**:

    - Input: User with data file + no prior experience

    - Transformations: Data loading, initial layout, basic visualization

    - Output: User understands basic workflow + has seen their data visualized
success_criteria:
    - metric: Time to first visualization
      target: Under 2 minutes (design goal; no source measures it)
    - metric: Comprehension
      target: User can describe what they see
    - metric: Confidence
      target: User feels capable of exploring further
    - metric: Activation
      target: User runs at least one analysis
    - metric: Import check
      target: User can state whether node and edge counts match the source
    - metric: Valid reading
      target: User can state one valid and one invalid conclusion about the picture
sources:
    - title: Nielsen Norman Group Progressive Disclosure
      url: https://www.nngroup.com/articles/progressive-disclosure/
      summary: UX pattern for reducing complexity for new users
    - title: Hansen et al. - Do You Know the Way to SNA?
      url: https://www.cs.umd.edu/users/ben/papers/DerekL.2012Do.pdf
      summary: Novice analysts need help reshaping questions and tables; messy first picture; metric anxiety; no undo forced restarts
    - title: Bonsignore et al. - First Steps to NetViz Nirvana
      url: https://www.cs.umd.edu/~ben/papers/Bonsignore2009First.pdf
      summary: Novices asked to find a social role and a sub-group; Excel skill the primary barrier
    - title: Zoss et al. 2018 - Network visualization literacy
      url: https://cns.iu.edu/docs/publications/2018-NetSci-Zoss.pdf
      summary: Outline which conclusions are and are not valid; distance read as similarity
    - title: Programming Historian - Exploring and Analyzing Network Data with Python
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: Count check against the source file after import
    - title: Gephi FAQ
      url: http://gephi.org/faq/
      summary: No undo in Gephi; beginners sent to Gephi Lite in the browser
