goal: >-
  **Intent**: Help a new user successfully load their first graph and understand what the tool can do. User arrives with
  data but no prior graph analysis experience and needs to feel confident they can accomplish something meaningful.


  **Mental Model**: "Guided tour" - like a museum audio guide that introduces key features progressively. Also "training
  wheels" - supported early steps that build confidence before removing assistance.


  **Task Phases**:

  1. **Arrival** - See clear call-to-action (not empty canvas), understand what's possible

  2. **Data Loading** - Choose method (file, URL, paste, sample), see preview, confirm load

  3. **First Visualization** - See graph rendered, understand basic stats (node/edge counts)

  4. **Guided Exploration** - Prompted to try key features (zoom, select, layout)

  5. **First Analysis** - Run a simple analysis (e.g., community detection) with guidance

  6. **Next Steps** - Understand what else is possible, how to learn more


  **Decision Points**:

  - Which data loading method to use?

  - Should I try sample data first to learn the tool?

  - What do I want to explore in my data?

  - What analysis should I try?


  **Information Needs**:

  - Clear guidance on supported formats

  - Preview of data before committing to load

  - Basic statistics after loading

  - Explanations of what each feature does

  - Suggestions for what to try next


  **Pain Points**:

  - Overwhelming interface with too many options

  - No idea where to start

  - Data doesn't load and error messages are cryptic

  - Don't know what questions to ask of the data

  - Feel stupid asking "basic" questions


  **Data Flow**:

  - Input: User with data file + no prior experience

  - Transformations: Data loading, initial layout, basic visualization

  - Output: User understands basic workflow + has seen their data visualized
success_criteria:
  - metric: Time to first visualization
    target: Under 2 minutes
  - metric: Comprehension
    target: User can describe what they see
  - metric: Confidence
    target: User feels capable of exploring further
  - metric: Activation
    target: User runs at least one analysis
