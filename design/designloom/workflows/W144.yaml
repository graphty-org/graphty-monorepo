id: W144
name: Debugging a Graph Data Model and Query in a Database Console
category: analysis
validated: false
personas:
    - graph-database-developer
requires_capabilities:
    - data-import
    - graph-rendering
    - node-selection
    - details-on-demand
    - neighborhood-expansion
    - basic-statistics
    - large-graph-rendering
    - data-export
    - schema-meta-graph
    - query-editor
suggested_components:
    - graph-canvas
    - data-table-panel
    - node-details-panel
    - status-bar
    - toolbar
    - statistics-panel
starting_state:
    data_type: freshly imported graph database (Neo4j, Neptune, Memgraph) plus a drawn model of what it should contain
    node_count: "stored: thousands to millions; on screen: tens to a few hundred (Neo4j Browser caps at 1,000)"
    edge_density: any
    user_expertise: expert
goal: >-
    **Intent**: Check that the database holds the shape the developer designed, and work out why a query returns too
    much, too little, or runs slowly, before handing it to colleagues. Neo4j calls Browser "a developer-focused tool";
    this is its everyday use.


    **Mental Model**: "The drawing is a debugger, not a report." The graph view is one of three renderings of a query
    result (Graph, Table, RAW), and it can lie: it flattens overlapping paths and drops what it cannot draw.


    **Task Phases**:

    0. **Draw the model first** - In Arrows.app (exports an image or Cypher) or on the Data Importer canvas: Add Node,
    type a label, drag a handle to another node for a relationship, map each element to a source file, id column and
    property columns; this is authoring, not exploring

    1. **Look at the schema and compare** - CALL db.schema.visualization() draws imported labels and relationship types
    as a small meta-graph; the Database Information drawer lists labels, relationship types and property keys; the
    developer compares with the drawn model by eye (no tool found shows the difference)

    2. **Pull a sample, then targeted patterns** - Always with LIMIT

    3. **Read the result** - Toggle Graph, Table and RAW; current Browser caps at maxVizNodes 1,000, maxNewNeighbours 100
    and recordLimit 1,000; legacy Browser drew 300 first and had "Connect result nodes" on, fetching relationships among
    returned nodes

    4. **Notice the mismatch** - Overlapping paths flatten: 47 nodes and 70 relationships on screen can stand for 5,673
    unique paths; returning only relationships, or nodes without relationships, gives empty-looking graphs; return paths
    or n, r, m

    5. **Separate execution from rendering** - RETURN count(path) to size the result; PROFILE (a plan view replaces the
    graph) and EXPLAIN; cypher-shell --format plain to bypass rendering; if PROFILE is fast and the view is slow, "the
    problem is rendering"

    6. **Narrow** - Add LIMIT, bound variable-length patterns (*1..3), return only needed properties or ids

    7. **Hand off** - Copy the query into a search phrase, a Linkurious template or a NeoDash report, or choose "Explore
    graph" on an Aura Query result to continue in Explore


    No source gives per-step timings. Developers repeat phases 2 to 6 many times a day while building.


    **Decision Points**:

    - Does the imported schema match the drawn model, label for label and relationship for relationship?

    - Is the result wrong, or only drawn wrong?

    - Is slowness in the query plan or in the rendering?

    - How tightly to bound a variable-length pattern?


    **Information Needs**:

    - Rows and paths returned versus nodes and relationships drawn

    - The schema as a meta-graph, readable for more than a handful of labels

    - Whether relationships among returned nodes were added automatically

    - Query time versus render time


    **Pain Points**:

    - "What it draws and what the query results are can be different"

    - The UI "crashes or goes page unresponsive" after raising the limit to 1,000; 100 to 500 nodes may already be slow

    - The schema view "does not work very well for non-trivial schemata"

    - No diff between the intended model and the imported schema

    - The query tab and the explore tab have separate node limits


    **Data Flow**:

    - Input: Drawn model (Arrows JSON or Cypher), imported database, Cypher, Gremlin or SPARQL queries

    - Transformations: Schema meta-graph, query execution, result rendering as graph, table or raw JSON, profiling

    - Output: A verified model and a bounded query, handed to a search phrase, template or dashboard
success_criteria:
    - metric: Result fidelity
      target: Developer can state returned rows and paths and drawn nodes and edges for the same query
    - metric: Schema check
      target: Developer finds a label or relationship type that is in the model but missing from the database without reading lists by eye
    - metric: Responsiveness
      target: Drawing 1,000 nodes does not freeze the page
