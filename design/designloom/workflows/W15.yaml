goal: >-
    **Intent**: Hand graph analysis findings to someone else in the form their setting requires. The deliverable is
    rarely "a picture of the graph": it is a picture plus a legend, the parameters that produced it, references back to
    source records and a document around it - and in several high-stakes settings it is not a node-link picture at all
    (a US suspicious activity report narrative plus one CSV, a public health cluster-level table, a hop table or STIX
    bundle, an illustrative aid that stays out of the jury room). This is the umbrella workflow; the concrete
    deliverables are W313 (journal figure and deposit), W314 (court exhibit), W315 (SAR output), W316 (organizational
    network readout and dashboard), W317 (narrated map and map links), W318 (web exports and embeds), W319 (public
    health aggregates), W320 (attack-path findings), W321 (temporal deliverables), W322 (3D to print) and W323
    (recurring deliverables).


    **Mental Model**: "The recipient's rules define the deliverable." A journal's specifications, Federal Rules of
    Evidence 1006 and 107, the FinCEN form, CDC partner guidance or a minimum group size decide what may appear, in what
    format, before any styling choice. Within those rules: data, visuals and narrative combined to drive action.


    **Task Phases**:

    1. **Identify the deliverable type and its rules** - Journal figure, court summary or aid, regulatory filing,
    public health partner summary, client report, public embed, executive readout; note format, size, privacy and
    provenance rules

    2. **Audience assessment** - Who receives it (often a non-operator on a phone or a grayscale printout, or an
    expert reviewer looking for missing parameters)? What may they see?

    3. **Message crystallization** - Write the single takeaway or caption first

    4. **Cut to the message** - Filter to the evidenced or relevant subset, aggregate clusters, aggregate instead of
    drawing when individuals must not be visible, pin a manual layout

    5. **Visualization design** - Highlight the finding with neutral, grayscale-safe encodings; bake labels in because
    tooltips vanish; add annotations

    6. **Attach parameters and provenance** - Source and version, filters, algorithms, layout and seed, time window,
    date; per-element source references where required

    7. **Production** - Image, slides, narrative, table, structured export, web embed, video or dashboard; decide whether
    it is a one-off frozen at hand-off or a recurring product regenerated from refreshed data

    8. **Formal review** - Peer review, SAR quality control, opposing counsel, works councils, data sharing agreements;
    iterate


    **Decision Points**:

    - Which deliverable type applies, and what do its rules forbid?

    - Static image, narrative and table, structured export or interactive embed?

    - One-off or recurring?

    - What level of detail and identification is permitted for this audience?

    - What to emphasize without making the picture argue?

    - What action do I want the audience to take?


    **Information Needs**:

    - The recipient's rules (format, size, privacy, provenance)

    - Audience background and the device or medium they will use

    - Key findings and supporting evidence with source references

    - The parameters that produced each view

    - Accessibility requirements (grayscale, colorblind safety, text alternative, keyboard access)


    **Pain Points**:

    - The graph tool's job ends at a picture; legends, parameters, sources, aggregate tables and narratives are
    finished by hand in Illustrator, PowerPoint, Word or Excel

    - Every upstream change means redoing the assembly, and the next period means rebuilding it

    - Picture and data separate at export; exported data drops styling and filters

    - Web exports ship hidden attributes; share links expose more than intended

    - "Hairball" visualizations overwhelm rather than inform; graphs are unfamiliar to many audiences

    - Stakeholders want certainty but findings have caveats


    **Data Flow**:

    - Input: Analysis results, the recipient's rules, audience profile

    - Transformations: Filtering, aggregation, highlighting, annotation, parameter and provenance capture, narrative
    framing

    - Output: Deliverable (figure with legend and methods, exhibit, narrative and CSV, aggregate table, hop table or STIX,
    slides, embed, video, dashboard), one-off or regenerated per period
success_criteria:
    - metric: Rule compliance
      target: The deliverable meets its setting's rules (format, privacy, provenance) on first review
    - metric: Audience comprehension
      target: Key message understood in under a minute by a non-operator
    - metric: Provenance
      target: Parameters and source references travel with the deliverable
    - metric: Accessibility
      target: Colorblind-safe, grayscale-readable, labeled, with a text alternative for web output
