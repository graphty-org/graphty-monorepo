      url: https://codex.flywire.ai/faq
      summary: Search syntax, partner thresholds per dataset, network graph options, pathways, exports, root ID changes
    - title: neuprint-python query tutorial
      url: https://connectome-neuprint.github.io/neuprint-python/docs/notebooks/QueryTutorial.html
      summary: NeuronCriteria and fetch_adjacencies returning neuron and per-region connection tables
    - title: FlyWire connectome data release on Zenodo
      url: https://zenodo.org/records/10676866
      summary: Feather tables of neurons and connections
    - title: Hemibrain connectome paper (eLife)
      url: https://elifesciences.org/articles/57443
      summary: About 25,000 neurons in the hemibrain
