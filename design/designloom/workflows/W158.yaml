starting_state:
    data_type: diffusion and T1 MRI per subject, ending in an 84 x 84 (or atlas-sized) weight matrix, a mean-length matrix and streamline assignments
    node_count: 84-400
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Turn diffusion MRI into a region-by-region structural connectome (weights and edge lengths), check it,
    and draw the significant or interesting connections as real white-matter pathways rather than straight lines.
    The graph steps come at the end of a long imaging pipeline (FreeSurfer alone takes a few hours per subject).


    **Mental Model**: "The wiring is real geometry." Every edge corresponds to a bundle of streamlines with a shape and
    a length; every node is a parcel with a shape.


    **Task Phases**:

    1. **Preprocess and model** - Preprocess diffusion and T1 images, estimate fiber orientations

    2. **Tissue segmentation and parcellation** - Five-tissue-type image for anatomically constrained
    tractography; FreeSurfer parcellation relabeled so node indices start at 1 and match matrix rows

    3. **Track and weight** - Generate streamlines (for example 10 million) and per-streamline SIFT2 weights

    4. **Build matrices** - Symmetric, zero-diagonal weight matrix scaled by inverse node volume, plus a mean
    edge-length matrix and a streamline-to-edge assignment file

    5. **Inspect** - Heatmap of the matrix, expecting two hemisphere blocks

    6. **Figure with real pathways** - One exemplar streamline per edge drawn as a tube; nodes drawn as the
    parcel meshes; extract specific connections of interest for inspection


    **Decision Points**:

    - How many streamlines, and which weighting (SIFT2, inverse node volume)?

    - Straight lines or streamline exemplars for the figure?

    - Spheres or parcel meshes for nodes?


    **Information Needs**:

    - Matrix heatmap with hemisphere blocks visible

    - Weight and length for any selected edge

    - Which parcels have no connections (failed assignment)


    **Pain Points**:

    - The official HCP tutorial now says not to use its steps for connectomics projects; guidance changes

    - Output formats vary by pipeline version (QSIRecon .mat)

    - Pathway and parcel rendering lives in one desktop viewer tied to its own file formats


    **Data Flow**:

    - Input: Weight matrix CSV, mean-length matrix CSV, parcellation image, exemplar streamlines (.tck)

    - Transformations: Row-to-label join, weight and length kept per edge, exemplar geometry attached to edges, parcel meshes attached to nodes

    - Output: Inspected weight and length matrices; figure with tube edges and parcel nodes
success_criteria:
    - metric: Matrix sanity check
      target: Hemisphere block structure visible within one step of loading
    - metric: Paired matrices
      target: Weight and length matrices load together and both show for a selected edge
    - metric: Pathway figure
      target: Edges can be drawn from supplied streamline geometry instead of straight lines
