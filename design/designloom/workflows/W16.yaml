starting_state:
    data_type: user-item interaction graph (bipartite or heterogeneous) plus externally scored recommendations (user, item, probability, rank, optional explanation edges)
    node_count: 20-500 per seed user viewed; source graph 10^4 to 10^9 never drawn whole
    edge_density: very sparse
    user_expertise: expert
goal: >-
    **Intent**: Before a recommender ships, review its output qualitatively across a deliberately chosen set of users:
    are the recommendations sensible, and where are the popularity artifacts, leakage and filtering bugs? This is the one
    step of recommender work with evidence of happening in a visual tool, because there is no ground truth beyond the
    graph itself.


    **Mental Model**: "Grade a sample of cases." Building, training, scoring and deploying happen in code; the review
    loads the scored output beside the interaction graph, picks seed users across strata, reads each seed's
    neighborhood, and records a judgment that goes back to the training code.


    **Task Phases**:

    1. **Load the scored output** - Interaction edges, item catalog and the model's recommendations (user, item,
    probability, rank, optional explainer edges), mapping tensor indices back to user and item ids

    2. **See the distribution** - Probability histograms brushed by item type and popularity; aggregate views
    only, never a drawing of the whole graph

    3. **Sample seed users** - Heavy, cold-start and complaint users and a sample stratified by predicted
    probability, because aggregation can obscure trends and outliers

    4. **Inspect each seed** - History, top-N items with probability, item attributes, and the shortest path,
    shared neighbors or explainer edges between history and each recommendation (see W267 for the per-seed steps)

    5. **Rate** - Star-rate questionable recommendations with a note (popularity artifact, already consumed,
    distant but feature-similar)

    6. **Export** - Ratings and notes as CSV with original ids, into training or filtering code


    **Decision Points**:

    - Which strata of users to sample, and how many per stratum?

    - Is a pattern across seeds a model problem, a filtering bug or data leakage?

    - Is the model ready to go to an online test?


    **Information Needs**:

    - Probability distribution by item type and popularity

    - Seed user list with strata and review status

    - Per seed: history, top-N, probabilities, item attributes, connecting paths or shared neighbors

    - Whether a recommended item is already in the user's history


    **Pain Points**:

    - The input graph is too large to examine and did not help validity assessments

    - Hop distance alone misleads because the model also uses features

    - Heterogeneous explanations cannot be drawn with PyG's built-in helper

    - Time leakage from future edges unless filtering is meticulous

    - Annotations must leave the tool as CSV to be used in existing workflows


    **Data Flow**:

    - Input: Interaction log, item catalog, scored recommendations, optional explanation edges

    - Transformations: Id mapping, distribution views, stratified seed sampling, per-seed neighborhood extraction

    - Output: Ratings CSV keyed by user and item id; a go or no-go note for the model


    **Correction note**: This record replaces an earlier version that put graph construction, feature engineering,
    similarity computation, recommendation generation and deployment in the viewer and cited an unpublished guide. Those
    steps happen in code (PyG HeteroData and LightGCN, Neo4j GDS FastRP and kNN), Neo4j Bloom exposes no similarity or
    link prediction, and no source shows a viewer taking part in deployment. Heuristic link prediction is not needed
    here: scores come from the model under review.
success_criteria:
    - metric: Time from opening a seed user to a recorded judgment (hypothesis)
      target: Under 5 minutes per user (design goal; no source measures it)
    - metric: Ratings export
      target: Exported ratings carry the original user and item ids
    - metric: Stratified coverage
      target: Each chosen stratum of users has at least one reviewed seed
sources:
    - title: RekomGNN
      url: https://arxiv.org/html/2310.11562
      summary: No ground truth beyond the graph; seed users, probability histograms brushed by item type, star ratings exported as CSV; input graph too large to examine
    - title: PyG LightGCN example
      url: https://github.com/pyg-team/pytorch_geometric/blob/master/examples/lightgcn.py
      summary: Generation by logits.topk(k) and Precision@20 and Recall@20 each epoch, in code
    - title: Neo4j GDS client - FastRP and kNN tutorial
      url: https://neo4j.com/docs/graph-data-science-client/current/tutorials/fastrp-and-knn/
      summary: Every step in Python, checked with Cypher, no viewer
    - title: Neo4j Bloom - GDS integration
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-tutorial/gds-integration/
      summary: Bloom exposes centrality and community algorithms only, no similarity or link prediction
    - title: neo4j-viz GDS integration
      url: https://neo4j.com/docs/python-graph-visualization/current/integration/gds/
      summary: Notebook rendering samples above 10,000 nodes
    - title: NVIDIA - How distributed training works
      url: https://docs.nvidia.com/sdgm/how-distributed-training-works
      summary: Training on future edges without meticulous time filtering
