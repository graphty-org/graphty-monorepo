id: W16
name: Graph-Based Recommendation
category: analysis
validated: false
personas:
  - ml-engineer-recsys
requires_capabilities:
  - link-prediction
  - shortest-path
  - clustering-coefficient
  - data-import
  - data-export
  - filtering
  - statistics-panel
suggested_components:
  - graph-canvas
  - data-import-dialog
  - data-export-dialog
  - filter-panel
  - statistics-panel
