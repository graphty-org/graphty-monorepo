starting_state:
    data_type: many weighted bipartite networks (sites times seasons) sharing a species list
    node_count: 30-210 per network, 8-160 networks
    edge_density: moderate
    user_expertise: intermediate
goal: >-
    **Intent**: Compare many replicate networks (sites, seasons, weeks, treatments) to test the study hypothesis,
    while accounting for unequal sampling and separating changes caused by different species from changes caused by
    the same species interacting differently (rewiring).


    **Mental Model**: "Small multiples with the same species in the same place." Every panel uses the same species
    order, colors and scales, so the eye sees what changed.


    **Task Phases**:

    1. **Assemble comparable webs** - Pad every network to one shared species list

    2. **Check sampling completeness** - Interaction accumulation curves and richness estimators per network,
    noting links that are impossible (forbidden) because of phenology or size mismatch

    3. **Compute null-corrected indices per network** - Then export them to model against treatment

    4. **Partition link turnover** - Split dissimilarity between pairs of networks into species turnover and
    rewiring, choosing the partitioning method

    5. **Choose temporal resolution** - Pooled season versus weekly or monthly windows, since pooling makes
    many topology measures inaccurate

    6. **Show side by side** - Faceted panels with shared colors, ordering and scales, or a multilayer view
    across sites or times

    7. **Hand off** - Multi-panel figure with aligned species, z-score table, beta-diversity components and a
    completeness supplement


    **Decision Points**:

    - Is each network sampled well enough to compare?

    - Pool the season or analyze weekly windows?

    - Which link-turnover partitioning method?

    - Which networks go in the figure, and in what panel order?


    **Information Needs**:

    - Per-network species counts, interaction counts and estimated completeness

    - Index values and z-scores for every network in one table

    - Pairwise turnover split into species turnover and rewiring

    - Links present in one network and absent in another, highlighted


    **Pain Points**:

    - Comparison tools handle two networks, not dozens

    - Each panel lays species out differently, so changes cannot be seen

    - Incomplete sampling distorts connectance and nestedness and inflates specialization

    - The older rewiring partition over-estimates rewiring


    **Data Flow**:

    - Input: Set of networks with site, season and treatment metadata

    - Transformations: Padding to shared species, completeness estimation, per-network indices, turnover partitioning,
    time-window aggregation

    - Output: Aligned small-multiple figure, index and z-score table, beta-diversity table, completeness plots
success_criteria:
    - metric: Alignment
      target: Every species keeps the same position and color across all panels
    - metric: Scale
      target: At least 40 networks shown side by side without manual layout
    - metric: Completeness visibility
      target: Each network's estimated sampling completeness is visible next to its indices
