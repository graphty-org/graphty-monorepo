id: W168
name: Ecosystem Network Analysis of Flows
category: analysis
validated: false
personas:
    - food-web-ecologist
requires_capabilities:
    - data-import
    - data-validation
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - computed-attributes
    - statistics-panel
    - layout-hierarchical
    - comparison-view
    - details-on-demand
    - report-generation
    - data-export
    - trophic-level-layout
    - boundary-flows
suggested_components:
    - data-import-dialog
    - file-drop-zone
    - graph-canvas
    - visual-encoding-panel
    - legend-panel
    - computed-attributes-panel
    - statistics-panel
    - metric-card
