starting_state:
    data_type: signed directed graph of species, functional groups and drivers, often drawn with stakeholders
    node_count: 10-50
    edge_density: moderate
    user_expertise: expert
goal: >-
    **Intent**: Build a signed directed model of an ecosystem (who helps or harms whom), then predict how every
    component responds when one is pushed up or down (a press perturbation, such as more fishing or a recovering
    predator), and report how certain each prediction is.


    **Mental Model**: "Plus and minus arrows, then ask what happens if I push here." Only the signs are known, so the
    model is simulated many times with random strengths and the answer is the share of simulations that agree.


    **Task Phases**:

    1. **Draw the signed digraph** (30-120 min, often in a workshop with managers) - Nodes for species, groups,
    fishing or environmental drivers; positive and negative directed links; or derive the structure from a
    quantitative model's diet matrix by keeping links above a cutoff

    2. **Add self-limitation** (1 min) - A negative self-loop on every node to stabilize the model

    3. **Simulate** (5 min) - 1,000 community matrices with random magnitudes for each signed link, discarding unstable
    ones

    4. **Validate** (10 min) - Mark nodes whose observed responses are known and score the share of simulations
    matching them

    5. **Press a node** (2 min) - Choose one node and the direction of the push

    6. **Read the impact table** (5 min) - Per node, the share of positive and negative outcomes; call a response
    positive or negative when more than 60 percent agree, otherwise mixed

    7. **Iterate structure** (repeat) - Change links and rerun; hand off impact tables and the diagram


    **Decision Points**:

    - Which links to include, and at which cutoff when deriving from a quantitative model?

    - Is the model validated well enough to use?

    - What agreement threshold makes a response positive or negative?


    **Information Needs**:

    - Clear distinction between positive and negative links and self-loops

    - Share of simulations that were stable

    - Per-node response shares for the chosen press, shown on the graph and in a table

    - A record of each model version and its results


    **Pain Points**:

    - Models are drawn in a separate diagram editor and read into R, so every change is a round trip

    - Self-loops and signed edges are poorly supported in graph tools

    - Comparing results across model versions is manual


    **Data Flow**:

    - Input: Signed digraph drawn by hand or derived from a quantitative model's diet and mortality matrices

    - Transformations: Self-limitation, random community matrices, stability filter, validation, press simulation

    - Output: Impact tables and bar charts, model diagram, record of model versions
success_criteria:
    - metric: Iteration speed
      target: A structural change and rerun completes in under one minute for a 30-node model
    - metric: Stakeholder readability
      target: Participants can read link signs and press results directly on the diagram
sources:
