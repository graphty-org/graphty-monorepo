id: W17
name: Hub Investigation
category: exploration
validated: false
personas:
  - analyst-alex
  - fraud-analyst
  - intelligence-analyst
requires_capabilities:
  - ego-network
  - centrality-degree
  - centrality-betweenness
  - temporal-analysis
  - details-on-demand
  - filtering
  - visual-encoding-nodes
  - layout-radial
  - selection-statistics
  - neighborhood-expansion
