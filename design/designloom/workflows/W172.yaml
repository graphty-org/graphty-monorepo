starting_state:
    data_type: group sightings, RFID or PIT detection stream, proximity-logger contacts or GPS relocations, plus an individual attribute table
    node_count: 4-1,400 individuals (median about 15; hundreds in long-term studies)
    edge_density: moderate to dense
    user_expertise: expert
goal: >-
    **Intent**: Build a network of individual animals from raw observations, weight each pair by how often they were
    seen together, test whether traits such as sex, age or season predict social position against permutation-based
    null models, and show how the network changes over time. A disease variant builds a contact network from
    proximity collars and simulates transmission across it.


    **Mental Model**: "Who was seen with whom, relative to how often each was seen at all." Edges are association
    indices between 0 and 1, and significance comes from shuffling the raw observations, not the finished network.


    **Task Phases**:

    1. **Define nodes and edges** (planning) - Individuals as nodes; associations, directed interactions or proximity
    as edges

    2. **Collect and load** (10 min) - Group scans or photo-ID surveys, feeder detection streams (timestamp, tag,
    location), proximity contacts or GPS tables (id, datetime, x, y), plus sex, age, rank and kinship

    3. **Build groups** (10-60 min) - Group-by-individual matrix from sightings; infer flocking events from detection
    streams; group GPS points by a time window and a distance threshold (for example 50 m); merge proximity records
    between the same pair within one or two minutes

    4. **Compute association indices** (2 min) - Simple ratio or half-weight index, subset by period, location or
    class

    5. **Build null networks** (10-60 min) - Swap individuals between groups within day, location or class, shuffle
    identities within time steps, shift whole trajectories, or permute node labels

    6. **Compute node and network measures** (2 min) - Strength, eigenvector centrality, clustering, modularity

    7. **Test hypotheses** (15 min) - Compare observed effects (for example sex difference in strength) against the
    null distribution; matrix regression with kinship; lagged association rates

    8. **Check power and accuracy** (15 min) - Subsample observations or bootstrap groups

    9. **Draw** (10 min) - Nodes colored by sex or age class and sized by strength, edge width by association index,
    one panel per season or time window

    10. **Disease variant** (30 min) - Contact network from proximity loggers, then simulate transmission across it


    **Decision Points**:

    - What counts as a group or a contact (time window, distance threshold)?

    - Simple ratio or half-weight index?

    - Data-stream permutation, node-label permutation or both?

    - Which time windows to compare?


    **Information Needs**:

    - Number of sightings per individual, since rarely seen animals have unreliable indices

    - Association index per pair on hover with the counts behind it

    - Observed statistic against the null distribution with p-value

    - Individual attributes (sex, age, rank) driving color, size and group comparisons

    - Network per time window with stable node positions


    **Pain Points**:

    - Graph tools assume an edge list, not sightings, detection streams or GPS tables

    - Permutation choice is contested; data-stream permutations inflate false positives for regression

    - Inferring flocking events needs memory that grows with the square of the data

    - Proximity loggers split contacts and lose detection range over months


    **Data Flow**:

    - Input: Sightings, detection streams, proximity contacts or GPS relocations; individual attribute table

    - Transformations: Grouping, association indices, permutation nulls, node measures, hypothesis tests, time windows

    - Output: Per-period sociograms, measure tables, test results, contact networks for transmission models
success_criteria:
    - metric: Raw-to-network path
      target: User builds an association network from a detection or sighting table without leaving the tool
    - metric: Temporal stability
      target: Individuals keep their positions across season panels
    - metric: Test transparency
      target: The permutation type and number are shown with every p-value
sources:
