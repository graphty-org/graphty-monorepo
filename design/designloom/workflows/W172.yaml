      url: https://search.r-project.org/CRAN/refmans/asnipe/html/get_network.html
      summary: SRI and HWI indices subset by time, location and class
    - title: asnipe network_permutation help
      url: https://search.r-project.org/CRAN/refmans/asnipe/html/network_permutation.html
      summary: Data-stream permutations within day, location or class
    - title: asnipe gmmevents help
      url: https://search.r-project.org/CRAN/refmans/asnipe/html/gmmevents.html
      summary: Flocking event inference from detection streams and memory guidance
    - title: spatsoc randomizations reference
      url: https://docs.ropensci.org/spatsoc/reference/randomizations.html
      summary: Step, daily and trajectory randomizations for GPS data
    - title: Weiss et al. - permutation methods and type I error
      url: https://www.biorxiv.org/content/10.1101/2020.04.29.068056.full.pdf
      summary: Data-stream permutations over 30 percent false positives for regression; node-label about 5 percent
