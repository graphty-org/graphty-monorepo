id: W175
name: Quick Network, Map and Timeline Exploration (Palladio Style)
category: exploration
validated: false
personas:
    - correspondence-historian
    - literary-network-scholar
requires_capabilities:
    - data-import
    - data-preview
    - graph-rendering
    - layout-force-directed
    - visual-encoding-nodes
    - filtering
    - temporal-navigation
    - temporal-analysis
    - details-on-demand
    - export-image
