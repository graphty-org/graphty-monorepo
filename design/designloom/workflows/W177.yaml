goal: >-
    **Intent**: Compute network statistics reproducibly in a script, then hand the result to a view that colleagues
    without Python can explore. Programming Historian's NetworkX lesson and Sadler's R workflow are the templates;
    the 2024 Mainz lab taught the same steps in Jupyter.


    **Mental Model**: "The script is the method section; the picture is for reading." Numbers come from code that can
    be rerun; the interactive view must show exactly those numbers, not recompute different ones.


    **Task Phases**:

    1. **Load lists** - Node and edge lists into a graph with attributes (Quakers: 119 nodes, 174 edges)

    2. **Whole-network measures** - Density, shortest paths, diameter of the largest component, transitivity

    3. **Node measures** - Degree, betweenness (to find low-degree brokers), eigenvector

    4. **Communities** - Greedy modularity communities; rank people inside each community

    5. **Robustness** - Check stability before interpreting (de Valeriola, "Can historians trust centrality?")

    6. **Hand off** - Write GEXF for Gephi, or in R aggregate letters to weighted routes (Sadler: 114 letters
    become 13 cities and 15 routes) and plot with igraph, ggraph or visNetwork


    **Decision Points**:

    - Analyze the whole graph or only the largest component?

    - Which community method and which resolution?

    - Do the computed values travel with the export, or does the viewer recompute them?


    **Information Needs**:

    - Script-computed attributes visible as columns in the viewer

    - Component sizes and which nodes fall outside the largest component

    - Community membership with rank inside the community


    **Pain Points**:

    - Static plots from scripts are weak for exploration

    - Re-exporting after every re-clean loses styling and notes in the viewer

    - Colleagues without Python cannot open the results


    **Data Flow**:

    - Input: CSV node and edge lists

    - Transformations: Script-side metrics and communities stored as attributes; aggregation of letters to weighted
    routes

    - Output: GEXF or CSV with computed attributes, opened in an interactive view and shared
success_criteria:
    - metric: Attribute fidelity
      target: Every script-computed column appears in the viewer and can drive color and size
    - metric: Re-import
      target: Updated output replaces data without losing the saved style
sources:
