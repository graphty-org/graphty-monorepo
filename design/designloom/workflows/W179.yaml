    edge_density: sparse
    user_expertise: advanced
goal: >-
    **Intent**: Keep what historians know about how sure they are, and where each statement came from, all the way
    into the network view: filter by certainty, show uncertain ties differently, click any tie to see its sources, and
    project two-mode data (person to charter) only when a metric needs it.


    **Mental Model**: "Every edge is a claim with a source and a confidence." Removing the source or the certainty
    turns evidence into decoration.


    **Task Phases**:

    1. **Model objects** (days) - Object types with sub-objects such as Birth or Letter-sent, each with a date and place

    2. **Grade uncertainty** (ongoing) - Per field, a flag, a certainty class with "Derived from" (Primary, Secondary,
    Inference, Conjecture), or a 1-100 score that can be filtered with "at least 80"

    3. **Store uncertain dates** (ongoing) - Before or after, between ("around 1666" stored as 1664-1668), or relative
    to another event; nodegoat built ChronoJSON because EDTF could not handle relational date statements

    4. **Store uncertain places** (ongoing) - Polygons for "probably in or near London"

    5. **Attach sources** (ongoing) - A source per statement; conflicting statements side by side

    6. **Two-mode data** (1 hour) - Charter-witness data where frequent co-witnessing makes a real tie more probable;
    project to person-person for metrics, keep two-mode for readers

    7. **View or export** (30 min) - Geographic, social and chronological views, or export for another tool


    **Decision Points**:

    - What certainty threshold does a figure use, and is it stated in the caption?

    - How should a date range be treated by a time filter (any overlap or fully inside)?

    - Project two-mode data with raw counts or a normalized weight?


    **Information Needs**:

    - Certainty and "derived from" for any node or edge on click, with the source citation

    - Count of ties hidden by the current certainty filter

    - Conflicting statements about the same tie, side by side

    - Weight of a projected tie and the shared documents behind it


    **Pain Points**:

    - Tools flatten assertions into bare edges; uncertainty is lost on export

    - Uncertainty cannot be shown with the visual variables current tools offer (Frontiers 2024)

    - Six Degrees of Francis Bacon's confidence calculations could not be independently reproduced


    **Data Flow**:

    - Input: Object and relation tables with certainty, date ranges, place polygons and source fields

    - Transformations: Certainty filtering, uncertainty encoding (opacity, dashes), date-range filtering, two-mode
    projection with weights

    - Output: Filtered network view, figures with stated thresholds, export that keeps certainty and source fields
success_criteria:
    - metric: Provenance on click
      target: Every edge shows its source citation and certainty
    - metric: Round trip
      target: Certainty, date range and source columns survive import and export unchanged
    - metric: Honest filtering
      target: User can state how many ties the current certainty threshold hides
