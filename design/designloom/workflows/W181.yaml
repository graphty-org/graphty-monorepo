      url: https://archive.linux.duke.edu/cran/web/packages/rdracor/readme/README.html
      summary: get_dracor, co-occurrence and relation networks, per-play metrics, text data frames
    - title: rdracor get_net_cooccur_edges
      url: https://rdrr.io/cran/rdracor/man/get_net_cooccur_edges.html
      summary: Edge weight equals number of shared scenes
    - title: Co-presence vs co-reference networks in Kleist (DH abstracts)
      url: https://dh-abstracts.library.virginia.edu/works/11766
      summary: Different tie rules reveal different aspects of a play
    - title: Labatut and Bost - Extraction and analysis of fictional character networks
      url: https://arxiv.org/abs/1907.02704v5
      summary: Survey of character extraction and network definitions for novels and plays
    - title: Moretti - Network Theory, Plot Analysis
      url: https://newleftreview.org/issues/ii68/articles/franco-moretti-network-theory-plot-analysis
      summary: Removing Horatio from Hamlet's network and rereading
    - title: Trilcke - SNA as a method of literary studies
      url: https://www.uni-potsdam.de/fileadmin01/projects/lit-19-jhd/Dokumente/Trilcke_-_Social_Network_Analysis_als_Methode_einer_textempirischen_Literaturwissenschaft.pdf
      summary: Metrics are difficult to interpret for literary texts
