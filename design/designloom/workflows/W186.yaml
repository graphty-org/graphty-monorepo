starting_state:
    data_type: match CSV (match, shared cM, segments, predicted relationship) and in-common-with CSV (pairs of matches)
    node_count: 100-2,700
    edge_density: moderate
    user_expertise: novice
goal: >-
    **Intent**: Sort a DNA tester's matches into groups that each point to one ancestral couple, ideally the four
    grandparent lines, to identify an unknown parent or break a brick wall. Three views of one shared-match graph are
    in use: the hand-colored Leeds spreadsheet, the AutoCluster matrix, and a Gephi node-link graph.


    **Mental Model**: "Matches who match each other share an ancestor." Each cluster is a family line, and the tester
    labels it from the trees of its members.


    **Task Phases**:

    1. **Download matches** (30 min) - DNAGedcom Client (paid) writes a match file and an in-common-with file; choose
    a cM range (50-400 cM for a first graph, 219 matches in Family Locket's example; 90-400 cM for Leeds)

    2. **Group them** (1-3 hours) - Leeds: one hand-filled color column per cluster, often four groups but matches land
    in two colors; AutoClusters: a matrix reordered so clusters form colored squares on the diagonal (HTML plus CSV,
    not node-link); Gephi: in-common-with pairs as undirected edges, matches as nodes, OpenOrd then ForceAtlas 2,
    color by modularity, size by cM, tune resolution until clusters split maternal and paternal and then by
    grandparent line

    3. **Label clusters** (hours) - The ancestral couple most frequent in members' trees; mark it on a pedigree chart
    (two of six clusters stayed unknown in Family Locket's example)

    4. **Read between clusters** (30 min) - Count edges between two clusters per member (419 for one pair, 12 for
    another read as random)

    5. **Test placements** (1 hour) - DNA Painter's What Are the Odds with a candidate tree and shared cM per match

    6. **Know the limits** - Close cousins and matches under 30-50 cM add spurious links; network analysis is not
    helpful with moderate to severe endogamy


    **Decision Points**:

    - Which cM range to include?

    - Which modularity resolution splits the lines without fragmenting them?

    - Which ancestral couple does each cluster represent?


    **Information Needs**:

    - Cluster membership and sizes, with members' shared cM

    - The same graph as node-link and as a reordered matrix

    - Number of edges between clusters per member

    - Surnames or ancestors common to a cluster's members


    **Pain Points**:

    - Thresholds are hidden (AutoClusters) or manual (Leeds)

    - Gephi setup is hard for non-technical users and the center of the graph is a tangle

    - Endogamy breaks clustering


    **Data Flow**:

    - Input: Match CSV and in-common-with CSV

    - Transformations: cM threshold filter, shared-match graph, community detection, cluster labeling, between-cluster
    counts

    - Output: Labeled cluster graph and matrix, notes on a pedigree chart, exported image
success_criteria:
    - metric: Time from two CSVs to colored clusters
      target: Under 20 minutes for a non-technical user
    - metric: Threshold control
      target: cM range and resolution adjustable with immediate feedback
    - metric: Cluster labeling
      target: Each cluster can carry a user label and note that is saved and shown in the legend
