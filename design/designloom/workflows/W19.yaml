goal: >-
  **Intent**: Understand how a network changes over time. User wants to track growth, detect significant changes,
  identify emerging patterns, and understand network dynamics.


  **Mental Model**: "Time-lapse photography" - compressing network evolution into observable patterns. Also "vital signs
  monitoring" - tracking key metrics over time to detect health changes.


  **Task Phases**:

  1. **Time Segmentation** - Define time windows (daily, weekly, monthly snapshots)

  2. **Metric Tracking** - Compute key metrics per time period (size, density, centrality distributions)

  3. **Change Detection** - Identify significant changes (new nodes, disappeared edges, centrality shifts)

  4. **Pattern Recognition** - Look for trends (growth, decline, seasonality, events)

  5. **Community Evolution** - Track how communities form, merge, split over time

  6. **Interpretation** - Connect changes to external events or internal dynamics


  **Decision Points**:

  - What time granularity is appropriate?

  - What metrics should be tracked over time?

  - What constitutes a "significant" change?

  - How to handle nodes that appear/disappear?

  - Should animation or small multiples show evolution?


  **Information Needs**:

  - Time-series of key network metrics

  - Change detection alerts (spikes, drops, trends)

  - Community evolution mapping (which communities merged/split?)

  - New/disappeared entity lists per period

  - Correlation with external events timeline


  **Pain Points**:

  - Choosing the right time granularity (too fine = noise, too coarse = miss events)

  - Defining "significant" change without arbitrary thresholds

  - Computational cost of re-analyzing at each time point

  - Visualizing change over time without overwhelming user

  - Attributing changes to causes (correlation vs. causation)


  **Data Flow**:

  - Input: Timestamped graph data spanning a period

  - Transformations: Snapshot creation, metric calculation, change detection

  - Output: Evolution report + trend analysis + significant events flagged
success_criteria:
  - metric: Trends identified
    target: Major growth/decline patterns documented
  - metric: Events detected
    target: Significant changes flagged with timestamps
  - metric: Evolution understood
    target: User can explain how network changed and why
