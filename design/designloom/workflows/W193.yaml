starting_state:
    data_type: HRIS position hierarchy (position id, parent position id, incumbent, grade, cost, location)
    node_count: 1000-50000
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Diagnose spans of control and management layers on the formal reporting hierarchy, then model one or
    more restructuring scenarios and compare headcount, cost, spans and layers against the baseline. All features below
    are vendor-reported; no independent practitioner source was found.


    **Mental Model**: "A tree I can edit on a copy." The baseline is the current hierarchy; each scenario is a copy where
    positions move to new parents, and the numbers recompute as I move them.


    **Task Phases**:

    1. **Import and baseline** - Import the position hierarchy; capture a baseline snapshot that can be refreshed later

    2. **Diagnose** - Compute direct reports per manager and layers per leader; color segments Micro, Narrow, Optimal
    or Wide; flag managers off the span target and positions below the target layer

    3. **Model a scenario** - Copy the baseline; drag organizations or positions to new parents, bulk-move, create or
    inactivate positions; stage moves and exits in a holding area that computes savings; warn without blocking when a
    change breaks a guideline

    4. **Watch metrics** - Headcount, FTE, total workforce cost, span of control and layers recompute after every move

    5. **Compare and export** - Hover shows scenario, baseline and difference; compare scenarios side by side with
    counts of new, inactivated and moved organizations; export changes to CSV or XLSX and a deck; route for approval


    **Decision Points**:

    - What span target and layer target apply to this function?

    - Which narrow-span managers to consolidate, and where do their teams go?

    - Which scenario to recommend, given cost and disruption?


    **Information Needs**:

    - Span and layer per manager, with off-target counts

    - Headcount and cost sums per subtree, recomputed live

    - Scenario-versus-baseline differences per node and in total

    - Change list (moved, created, inactivated) for HR operations


    **Pain Points**:

    - No informal-network data in the same view as the hierarchy being redesigned

    - Enterprise trees of tens of thousands of positions need collapse and expand to navigate

    - No independent evaluation of the vendor tools found


    **Data Flow**:

    - Input: Position hierarchy CSV or XLSX with cost and grade columns

    - Transformations: Tree layout, span and layer computation, subtree sums, scenario copies with reparenting, diff
    against baseline

    - Output: Scenario comparison, change list in CSV or XLSX, slide deck
success_criteria:
    - metric: Diagnosis speed
      target: Off-target spans and excess layers are listed within 5 minutes of import (design goal; no source measures it)
    - metric: Live recompute
      target: Moving a branch updates headcount, cost, span and layers without a manual refresh
    - metric: Change list
      target: Every difference between scenario and baseline is exportable as rows
