starting_state:
    data_type: one small egocentric network per participant (ego, named contacts with ratings, optional contact-to-contact ties)
    node_count: 5-40 per participant, 20-40 participants
    edge_density: dense
    user_expertise: novice
goal: >-
    **Intent**: Give each manager in a leadership cohort a readable map and profile of their own network, compare it
    with patterns from research, and agree on development actions.


    **Mental Model**: "My network, seen from me." Each map is centered on one person and belongs to that person; the
    interesting thing is the mix and the separate clusters of contacts, not the count.


    **Task Phases**:

    1. **Name generator** - Each participant recalls contacts ("who do you go to for ...") in expanding slots

    2. **Name interpreters** - Rate each contact: level, function, frequency, closeness, what the tie provides

    3. **Alter-alter ties (optional)** - For each pair of contacts, whether they know each other (one undirected
    question per pair)

    4. **Ego maps and profiles** - One map per participant colored by function or level, with the share of contacts in
    each category and the number of separate contact clusters, compared with research patterns (diversity and
    bridging rather than size); optionally peer and team raters

    5. **Debrief and act** - Coach and participant agree on actions (delegation, rotation across divisions) and may
    re-measure; no source found for a standard re-measurement interval


    **Decision Points**:

    - Ask alter-alter questions, given the burden grows with the square of contacts?

    - Which attribute (function, level, location) best shows this participant's imbalance?

    - Which actions follow from the profile?


    **Information Needs**:

    - Per participant: contact count by category, number of contact clusters after removing the ego, share of contacts
    outside the participant's own unit

    - Cohort-level patterns without exposing individual maps


    **Pain Points**:

    - General survey tools treat contacts as text fields, not nodes

    - Producing one map per participant by hand for 20 to 40 people

    - Keeping each map private to its owner and the coach


    **Data Flow**:

    - Input: Ego table, alter table with ratings, optional alter-alter table, per participant

    - Transformations: Many small graphs built in a batch, ego-centered layout, category shares, structural diversity

    - Output: One private map and profile per participant, cohort summary
success_criteria:
    - metric: Batch production
      target: Maps for a 30-person cohort are produced with one shared style in one pass
    - metric: Privacy
      target: Each participant's map is exported or shared separately from every other participant's
