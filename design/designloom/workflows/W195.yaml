starting_state:
    data_type: posts, replies, reactions and mentions per community over a rolling window, as directed person-to-person interactions with organizational attributes
    node_count: 100-100000
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Judge the health of enterprise social network communities -- who engages two ways versus who only
    broadcasts, and which communities depend on one or two hubs -- and report it monthly against benchmarks.


    **Mental Model**: "Conversation, not broadcast." A healthy community has many people both giving and receiving; an
    unhealthy one is a few people posting into silence or a single hub everyone depends on.


    **Task Phases**:

    1. **Scope** - Choose a community or the whole network and a period; count a person active when they average at
    least one post, reply or reaction every two weeks

    2. **Classify by activity balance** - Engagers balance giving and receiving, Catalysts start threads that draw
    replies, Responders mostly reply and react, Broadcasters post more than they receive, Observers rarely participate

    3. **Rank influence and hub risk** - Rank people by reach (people engaged); compute the percentage drop from the
    first- to the third-ranked person's reach; no score with fewer than six listed users

    4. **Filter and benchmark** - Filter by organizational attributes and report against internal targets and
    cross-company benchmarks


    **Decision Points**:

    - Which window and activity threshold define "active"?

    - Which communities need a second or third champion to reduce hub dependence?

    - Which broadcasters to coach toward two-way engagement?


    **Information Needs**:

    - Given and received counts per person and the resulting role

    - Reach per person and the drop between top-ranked people per community

    - Role distribution per community, trended over months


    **Pain Points**:

    - Role and risk rules are vendor-defined and cannot be changed

    - Network analytics unavailable when fewer than half of users hold a qualifying license

    - Benchmarks show a drift toward broadcasting without showing where


    **Data Flow**:

    - Input: Interaction events per community (actor, target, type, time) with organizational attributes

    - Transformations: Windowing, in and out activity counts, role classification, reach ranking, concentration score

    - Output: Monthly community health report with role distributions and hub-risk scores
success_criteria:
    - metric: Role transparency
      target: User can see and change the thresholds that assign each activity role
    - metric: Hub risk
      target: Communities whose reach drops by more than half from the first to the third person are listed
