      url: https://github.com/kumu/docs/raw/main/content/Workbook-012617.pdf
      summary: Forces, cause and effect, loops, deep structure, build the map, socialize, leverage; phase durations and 15-30 loops
    - title: Kumu documentation (full text)
      url: https://docs.kumu.io/llms-full.txt
      summary: Systems template, polarity notation, delays, loops, automatic loop detection limits, MICMAC, export dropping loops
    - title: Hewlett Foundation - Madison Initiative systems map launch
      url: https://hewlett.org/?p=66747
      summary: Grants overlay map and narrative walk-through
    - title: Media Impact Funders - Democracy Fund local news systems map
      url: https://mediaimpactfunders.org/mapping-to-learn-applying-a-systems-lens-to-local-journalism
      summary: Roughly 43 feedback loops reduced to 17 over a year
    - title: Wikipedia - Causal loop diagram
      url: https://en.wikipedia.org/wiki/Causal_loop_diagram
      summary: Loop polarity by the parity of negative links
    - title: FSG - Introduction to System Mapping
      url: https://www.fsg.org/blog/introduction-system-mapping/
      summary: Causal loop diagrams and actor maps in consultancy practice
