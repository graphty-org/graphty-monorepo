    url: https://cytoscape.org/cytoscape-tutorials/protocols/differentially-expressed-genes/
    summary: STRING protein query at confidence 0.4, largest subnetwork, table import keyed on query term, logFC continuous mapping, driver-gene bypass, export
  - title: Cytoscape tutorial - RNA-Seq Data Network Analysis
    url: https://cytoscape.org/cytoscape-tutorials/protocols/rna-seq-data-analysis/
    summary: About 150 nodes, fold change red-blue gradient, style saved as "de genes"
  - title: Cytoscape tutorial - Visualizing Expression Data
    url: https://cytoscape.org/cytoscape-tutorials/protocols/mapping-data/
    summary: Continuous mapping with a default color outside the gradient for nodes with no value
  - title: Cytoscape User Manual - Node and Edge Column Data
    url: https://manual.cytoscape.org/en/stable/Node_and_Edge_Column_Data.html
    summary: Table import requires a key column matching node identifiers exactly, case sensitive
  - title: JensenLab stringApp exercises
    url: https://jensenlab.org/training/stringapp/
    summary: Disambiguation dialogs and gradient optimization for skewed data listed as pain points
