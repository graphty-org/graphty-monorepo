    - data-import
    - import-report
    - graph-collection-browser
    - network-collection-small-multiples
    - layout-circular-chord
    - layout-force-directed
    - manual-layout-preservation
    - basic-statistics
    - filtering
    - search
    - node-selection
    - details-on-demand
    - export-image
    - journal-figure-export
