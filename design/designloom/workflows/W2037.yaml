starting_state:
    data_type: Citation network of all decisions on one provision (for example ECtHR Article 8 from HUDOC) plus a per-decision topic vector from a text model
    node_count: 1,000-10,000 decisions
    edge_density: sparse, directed
    user_expertise: intermediate
goal: >-
    **Intent**: Find every decision on a legal topic and group them into coherent lines of case law, using the
    citations between decisions and the similarity of their texts together, then check the groups against cases the
    researcher already knows.


    **Mental Model**: "Cases that cite each other and talk about the same thing belong together." Citations alone mix
    topics; text alone ignores how judges link their reasoning.


    **Task Phases**:

    1. **Import** - Load the citation network and join a per-decision topic vector computed outside

    2. **Trim** - Keep the largest connected part and note how many decisions fell outside it

    3. **Weight** - Weight each citation by the cosine similarity of the two decisions' topic vectors

    4. **Group** - Run community detection on the weighted network and compare with the unweighted run

    5. **Check** - Search known seed decisions, open the community that holds them, list its members and read the
    ones not already known

    6. **Export** - Export the member list with community ids and the weighting used


    **Decision Points**:

    - Weighted or unweighted grouping, judged by how many known cases land together?

    - Is a decision outside the largest part a real outlier or a missed citation?

    - Which community size is reviewable by hand?


    **Information Needs**:

    - Share of decisions in the largest connected part

    - Community sizes and the known seed cases in each

    - Members of one community with date and title


    **Pain Points**:

    - Combining text similarity with citation links needs custom code

    - Communities are unlabeled; the researcher names them by reading cases


    **Data Flow**:

    - Input: Citation edge list, decision table, topic vector columns

    - Transformations: Largest component, similarity edge weights, community detection

    - Output: Grouped decision list with community ids, figure
success_criteria:
    - metric: Seed recall
      target: User can see how many known seed decisions fall in the community selected
    - metric: Weighting recorded
      target: Exported list names the edge weighting and community algorithm used
