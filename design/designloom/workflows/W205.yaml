      url: https://docs.kumu.io/llms-full.txt
      summary: Label, From and To columns, pipe-separated multi-values, ID column for updates, Google Sheets link, Cluster and Bridge projections, SLPA communities, size limits
    - title: Commons Library - A guide to power analysis in community organising
      url: https://commonslibrary.org/a-guide-to-power-analysis-in-community-organising/
      summary: Decision-maker, influencers, allies and opponents; hidden power
    - title: Graph Commons API
      url: https://graphcommons.github.io/api-v1
      summary: Edges name endpoints by name and type; missing nodes created
    - title: University of Arizona - AEA 2024 actor mapping poster
      url: https://fmi.arizona.edu/sites/fmi.arizona.edu/files/2024-10/cred-aea-2024_actor-mapping.pdf
      summary: Bullseye by issue experience and sector plus power type
    - title: ODI - Alignment, Interest and Influence Matrix
      url: https://www.researchtoaction.org/2012/01/the-alignment-interest-and-influence-matrix-aiim-a-basic-introduction
      summary: Policy influence actors placed by alignment and interest against influence
