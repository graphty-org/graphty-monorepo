starting_state:
    data_type: CRM exports (contacts, affiliations, reciprocal relationships, gifts, grants), a LinkedIn-compiled board sheet and a prospect list
    node_count: 50-500 people and organizations
    edge_density: sparse
    user_expertise: novice
goal: >-
    **Intent**: Find which board members and partners can open doors to which prospects and funders, from the
    spreadsheets a small nonprofit already has, and hand back a slide and a list the development team can use. Refresh
    quarterly or before a major campaign.


    **Mental Model**: "Who do we know who knows them?" A lookup over real people and organizations, not an abstract
    network; answers are names to paste back into the CRM.


    **Task Phases**:

    1. **Export** - Contacts, affiliations (person to organization), reciprocal relationships, gifts and grants
    from the CRM; board data compiled from LinkedIn at 15-20 minutes per member

    2. **Shape and clean** - Node and edge lists, often without Source/Target headers; clean name variants
    because CRM, LinkedIn and grant data share no identifier

    3. **Load and check** - Import; compare node and edge counts with the spreadsheet; review unmatched and
    duplicate names

    4. **Overlay prospects** - Join the 20-40 prospect list; look for shared employers, alma maters and board
    seats; bipartite person-organization and funder-grantee views

    5. **Ask** - Most connected board members; two-step paths to each prospect; single points of failure
    (prospects reachable through one person only)

    6. **Hand off** - One slide for leadership; a list of prospect, connector and path pasted back into the CRM;
    save for next quarter's refresh by re-import


    **Decision Points**:

    - Which column is the source and which the target when there are no headers?

    - Are "Bob Smith" and "Robert Smith Jr." the same person?

    - Count past board service and alma maters as connections, or only current roles?

    - Which prospects to prioritize when several board members connect?


    **Information Needs**:

    - Import preview naming which column became which, with counts matching the spreadsheet

    - Suspected duplicate names to merge

    - For a prospect: every board member within two steps and the path through them

    - Board members ranked by number of prospect connections

    - Prospects that depend on a single connector


    **Pain Points**:

    - Import dialogs that assume graph vocabulary

    - Duplicate people after re-importing next quarter's export

    - Desktop tools that are hard to share; cloud tools that are wrong for sensitive donor names

    - No list output to paste back into Excel or the CRM


    **Data Flow**:

    - Input: CSV or XLSX exports from the CRM and LinkedIn compilation, prospect list

    - Transformations: Column mapping, name deduplication, bipartite import, prospect join, two-step path search,
    single-connector check

    - Output: Board connection slide, prospect-connector-path table for the CRM, saved project for the next refresh
success_criteria:
    - metric: Time from exports to first answer
      target: Under 1 hour for a 15-member board and 30 prospects (design goal; no source measures it)
    - metric: Count check
      target: Imported node and edge counts match the spreadsheet or the differences are listed
    - metric: Hand-off
      target: Prospect-connector-path list exported as CSV in one action
