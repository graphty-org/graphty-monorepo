    - data-import
    - columnar-table-import
    - fixed-node-positions
    - large-graph-rendering
    - zoom-pan
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - neighborhood-label-mixing
    - matrix-view
    - linked-views-selection
    - node-selection
    - spatial-selection
    - details-on-demand
    - seeded-runs
    - provenance-tracking
