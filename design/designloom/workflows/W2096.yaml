      url: https://www.yourdnaguide.com/ydgblog/myheritage-autoclusters
      summary: Labeling clusters from known matches; placing a mystery match by what it shares and does not share
    - title: DNA Explained - How to use Ancestry's new match clusters
      url: https://dna-explained.com/2025/07/10/how-to-use-ancestrys-new-match-clusters-and-what-they-mean/
      summary: Parental tabs, grey cells for people in two clusters, grid only to 100 matches, a multi-cluster match listed once, no export
    - title: DNA Painter - What Are the Odds FAQ
      url: https://dnapainter.com/help/wato-faq
      summary: Hypotheses scored from shared centimorgans; 0.00% as statistically impossible; endogamy caveat
    - title: DNA Explained - ThruLines and shared matches now require a subscription
      url: https://dna-explained.com/2024/02/05/ancestrys-thrulines-and-shared-matches-now-require-a-subscription/
