      url: https://dfrlab.org/2023/03/01/networks-of-pro-kremlin-telegram-channels-spread-disinformation-at-a-global-scale/
      summary: 56 seeds, 45,054 and 12,593 forwards, 3,871 channels, 57,646 forwards, nine modularity clusters, forensic corroboration
    - title: DFRLab - Coordinated Telegram channels aggregate anti-Ukrainian news
      url: https://dfrlab.org/2023/06/01/coordinated-telegram-channels-aggregate-anti-ukrainian-news-from-around-the-globe/
      summary: Companion study of 19 aggregator channels
    - title: GESIS Methods Hub - Telegram Toolkit
      url: https://methodshub.gesis.org/library/methods/TelegramToolkit
      summary: Channel-to-channel GML graph with forward counts
    - title: Oxford Internet Institute - Junk news distribution on Telegram
      url: https://demtech.oii.ox.ac.uk/wp-content/uploads/sites/12/2020/07/Junk-News-Distribution-on-Telegram.-Data-Memo.pdf
      summary: No channel directory, so discovery is snowball sampling
    - title: Telegram propaganda study admitting no ground truth
      url: https://arxiv.org/html/2406.08084v1
      summary: Study states it lacks definitive ground truth
    - title: Graphika - Spamouflage report
      url: https://graphika.com/spamouflageUS
      summary: Paid reports list full network maps, attribution indicators, cross-platform topology and takedown timeline
