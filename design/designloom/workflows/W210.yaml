starting_state:
    data_type: seed channel list plus forwarded-message records (source channel, forwarding channel, message, date) and channel metadata (creation date, name history, subscribers, description, language)
    node_count: 1000-5000
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Show that a set of Telegram channels forms a network that spreads the same content, find its regional or
    language clusters, and tie it to an operator through evidence outside the graph. Modeled on DFRLab's study of
    pro-Kremlin channels: 56 seed channels, 3,871 channels and 57,646 forwarded messages.


    **Mental Model**: "Follow the forwards." A forward is a visible, directed act of amplification from a source channel
    to a forwarding channel. The graph shows the structure; creation dates, name histories and archives prove the
    connection.


    **Task Phases**:

    1. **Seed** (30 min) - Assemble seed channels and group them by naming pattern ("Node of Time", "Surf Noise", "Info
    Defense"); Telegram has no channel directory, so discovery is snowball sampling

    2. **Collect** (hours) - Telegram API for messages the seeds forwarded (45,054); TGStat for messages others forwarded
    from them (12,593) plus creation dates, name histories and subscriber counts; fix a time window

    3. **Build** (10 min) - Nodes are channels; directed edges from source to forwarding channel weighted by forward
    count; node size by incoming forwards; GESIS Telegram Toolkit outputs this as GML

    4. **Cluster** (5 min) - Modularity communities (nine clusters in DFRLab's case), colored by class

    5. **Label clusters** (30 min) - Use channel name suffixes ("_ger", "_ita", "SPAIN"), descriptions and post
    language; report where labels and clusters disagree (one German channel fell outside the German cluster)

    6. **Corroborate outside the graph** (hours) - Shared creation dates and name changes link networks; subscriber
    charts flag inactive channels; archived captures; forwards traced from embassy channels; translation review

    7. **Publish** (hours) - Full graph plus annotated close-ups, charts, screenshots, archive links, and explicit flags
    on every unconfirmed claim


    **Decision Points**:

    - Which seeds define the network, and how many snowball hops to expand?

    - What forward count makes an edge meaningful (no published standard threshold was found)?

    - Do cluster labels from names and language match the detected communities?

    - Which links are confirmed by forensics and which stay flagged as unconfirmed?


    **Information Needs**:

    - Channel attributes beside the graph: creation date, name history, subscribers over time, language

    - Channels created in the same week or renamed together, selectable from a chart

    - Per-cluster languages and name patterns

    - For a forward edge, the messages behind it with dates and links


    **Pain Points**:

    - No ground truth; studies admit they lack definitive confirmation

    - Snowball discovery makes the network's boundary arbitrary

    - Evidence (archives, screenshots, metadata) lives outside the graph tool

    - Interactive sharing of a Gephi file requires conversion to a web viewer


    **Data Flow**:

    - Input: GML from GESIS Telegram Toolkit, or CSV of forwards plus a channel metadata table from TGStat or the
    Telegram API

    - Transformations: Weighted directed forward graph, modularity communities, attribute join of forensic metadata,
    per-cluster language and name summaries

    - Output: Annotated full graph and close-ups, cluster table, flagged evidence list, exported data
success_criteria:
    - metric: Forensic linkage
      target: Analyst can select channels by creation date or rename event and see where they sit in the graph
    - metric: Evidence trace
      target: Every published edge or cluster claim links to messages or records, and unconfirmed claims are flagged
    - metric: Cluster labeling
      target: Mismatches between name-based labels and detected clusters are visible
sources:
