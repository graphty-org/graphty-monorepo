    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Show how one claim, link or post spread: who posted first, which accounts caused bursts, which edges
    carried it between communities, and in what order. Fact-checkers and researchers did this with Hoaxy, now Hoaxy2
    and OSoMeNet on Bluesky.


    **Mental Model**: "Replay the outbreak." The network and the timeline are one object: brushing time filters the
    graph, playing time grows it, and every edge is a post you can open.


    **Task Phases**:

    1. **Query** (2 min) - Enter a claim's keywords, a URL or a post; collect matching posts with their repost, quote,
    reply and mention relations

    2. **Build the network** (1 min) - Directed edges between accounts by relation type, each with its post and
    timestamp; nodes sized by how often they were reposted

    3. **Read the timeline** (5 min) - Cumulative posts over time beside the network; zoom into an interval, hover for
    daily counts, add older or newer posts

    4. **Replay the spread** (2 min) - Animate the network unfolding from start to end date, in 2D or 3D

    5. **Find early spreaders and amplifiers** (10 min) - Who posted first, which large nodes preceded bursts, which
    edges bridge communities; edges colored by type (reposts, mentions, replies, quotes, multiple types)

    6. **Open the evidence** (10 min) - Click an edge to open the posts behind it; click a node for the account's
    mentions, replies and quotes with links

    7. **Export** (5 min) - Image and data; pair the figure with the timeline in a published investigation


    **Decision Points**:

    - Which relation types count as spread?

    - Which time interval holds the story?

    - Who is the origin versus the amplifier?

    - Prune the network for performance, and what is lost?


    **Information Needs**:

    - Activity over time linked to the graph in both directions

    - Edge type legend with counts

    - First-seen time per account

    - The posts behind any edge


    **Pain Points**:

    - The original Hoaxy was retired in July 2025 and bot scores were removed

    - Networks are pruned for performance without saying what was dropped

    - The timeline and graph live in separate tools when data comes from elsewhere


    **Data Flow**:

    - Input: Post records (CSV, JSON, NDJSON) with author, target author, relation type, timestamp, post ID and text

    - Transformations: Typed directed multigraph with timestamps, time-window filter, animation, first-seen times

    - Output: Network image with edge-type legend and timeline, exported edge list, list of early spreaders and amplifiers
success_criteria:
    - metric: Linked time and graph
      target: Brushing an interval on the activity chart filters the network and playback animates growth
    - metric: Evidence access
      target: Clicking an edge shows the posts and timestamps that created it
    - metric: Origin identification
      target: User can name the first posters and the accounts preceding the largest bursts
