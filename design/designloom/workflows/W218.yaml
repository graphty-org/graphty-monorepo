      summary: Violation tables by area and contingency
    - title: Visualizations for power system contingency analysis (PSERC 2004)
      url: https://documents.pserc.wisc.edu/documents/publications/papers/2004_general_publications/Visualizations-for-Power-System_Nov-2004.pdf
