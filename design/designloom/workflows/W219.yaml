id: W219
name: Trace, Isolate and Rank Criticality on a Utility Network
category: analysis
validated: false
personas:
    - utility-network-gis-analyst
requires_capabilities:
    - data-import
    - data-validation
    - component-analysis
    - neighborhood-expansion
    - path-highlighting
    - node-selection
    - removal-impact-analysis
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - details-on-demand
    - data-export
