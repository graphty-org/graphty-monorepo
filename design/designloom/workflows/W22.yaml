starting_state:
  data_type: enrichment results table (pathway, p-value, FDR, NES, genes) plus gene-set definitions
  node_count: 100-2000 gene sets
  edge_density: medium
  user_expertise: intermediate
goal: >-
  **Intent**: Summarize hundreds of enriched pathways as a network where nodes are gene sets and edges mean two
  gene sets share genes, so that redundant pathways collapse into a handful of biological themes.


  **Mental Model**: "Zoom out from pathways to themes." Individual pathways overlap heavily; drawing overlap as
  edges makes the themes appear as clusters that can be named and collapsed.


  **Task Phases**:

  1. **Build the map** (5 min) - Load an enrichment table (g:Profiler, GSEA, or generic) and its gene-set file; set
  the FDR q-value cutoff (0.01 to 0.05) and the similarity cutoff (Jaccard, overlap, or combined, typically 0.375);
  node size is gene-set size, node color is enrichment direction or FDR, edge width is overlap

  2. **Explore** (10 min) - Search a gene and highlight every pathway containing it; click a node to see its genes;
  sort the node table by FDR or NES; when an expression matrix is present, show a heat map of the genes in the
  selected pathways

  3. **Tune** (5 min) - Slide the node q-value and edge similarity cutoffs to thin the map; re-run layout; separate
  up-regulated (positive NES) and down-regulated pathways into two halves of the canvas

  4. **Name the themes** (10 min) - Cluster the map, auto-label each cluster from the most frequent words in its
  pathway names, rename by hand, collapse clusters into single theme nodes for the summary figure

  5. **Publish** (5 min) - Export the figure as PDF or SVG with a legend; record the creation parameters (q cutoff,
  similarity metric and cutoff) for the methods section


  **Decision Points**:

  - Which enrichment tool produced the table (flat gene list -> g:Profiler; ranked list -> GSEA)?

  - FDR cutoff: lenient (0.25) for exploration or strict (0.01) for publication?

  - Similarity metric and cutoff: fewer edges gives cleaner themes but may split real ones

  - Which clusters to collapse and what to name them

  - Whether to build a sub-map for one theme of interest


  **Information Needs**:

  - Node count and edge count after each cutoff change, live

  - Gene-set size, FDR, NES or p-value, and the gene list for any node

  - For a searched gene, all pathways that contain it

  - Cluster membership and auto-generated labels

  - The exact creation parameters, always retrievable


  **Pain Points**:

  - Very lenient cutoffs produce thousands of nodes and a slow canvas

  - Overlapping cluster labels and hand-arranging clusters to reduce overlap

  - Collapsed theme nodes lose the ability to inspect member pathways unless expandable

  - Legend for node size, color, and edge width must be drawn by hand in most tools

  - Publication figures need labels hidden on nodes but visible on themes


  **Data Flow**:

  - Input: Enrichment results table (tab-delimited), gene-set file (GMT), optional ranks and expression matrix

  - Transformations: Gene-set overlap computation, threshold filtering, clustering, label generation, cluster
  collapse

  - Output: Enrichment map figure, theme list, parameter record

  **Adoption Note (2026-09-04)**: Adopted as a data-only case. The enrichment table and gene-set file load as an
  edge list plus node attributes through the standard Data panel; no enrichment-specific UI is added. Thresholding
  by q-value and similarity uses the generic filter builder.
success_criteria:
  - metric: Map built
    target: Enrichment table and gene-set file load with correct node and edge encodings in under 10 minutes
  - metric: Themes named
    target: Every cluster of >= 3 pathways carries a label
  - metric: Parameters recorded
    target: q-value and similarity cutoffs appear in the exported report
