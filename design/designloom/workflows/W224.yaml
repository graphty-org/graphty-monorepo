goal: >-
    **Intent**: Build a model that reproduces last year's network costs, then compare scenarios that open, close or
    resize facilities, and present flows and costs to leadership.


    **Mental Model**: "Baseline first, then what-ifs against it." Every scenario is the same network with facilities
    switched on or off and flows re-solved.


    **Task Phases**:

    1. **Fill tables** - Locations, products, demand, lanes and rates, facility costs and capacities, sourcing rules

    2. **Baseline** - Reproduce how the network performed last year and validate costs

    3. **Optimized baseline** - Follow the rules that should have been in place; this becomes the new starting point

    4. **Scenarios** - Each facility set to include, exclude or consider; greenfield proposes locations

    5. **Compare** - The best solutions side by side on profit and cost; a map draws the routes

    6. **Stress test** - Simulated disruptions on the chosen design


    **Decision Points**:

    - Does the baseline match actual costs closely enough to trust?

    - Which facilities are fixed, excluded or open for the optimizer?

    - Which scenario balances cost, service and risk?


    **Information Needs**:

    - Flow volume and cost per lane, per scenario

    - Which facilities are open in each scenario

    - Total cost and service differences between scenarios

    - Missing cost data discovered while building the baseline


    **Pain Points**:

    - Cost data is the hardest to get and the gaps appear only after the baseline is built

    - Scenario results end up in separate spreadsheets

    - Location codes vary across systems


    **Data Flow**:

    - Input: Location, product, demand, lane, rate and facility tables; last year's shipments

    - Transformations: Optimization (in the design tool), facility on/off per scenario, flow assignment

    - Output: Flow maps with lane width by volume, scenario cost comparison table, recommendation deck
success_criteria:
    - metric: Baseline validation
      target: Baseline cost difference from actuals stated explicitly
    - metric: Scenario comparison
      target: Several scenarios compared side by side with facility status and lane flows
