id: W228
name: Venture Co-Investment Network
category: exploration
validated: false
personas:
    - economic-network-analyst
requires_capabilities:
    - data-import
    - data-validation
    - node-merging
    - computed-attributes
    - degree-analysis
    - filtering
    - layout-force-directed
    - ego-network
    - centrality-degree
    - visual-encoding-nodes
    - details-on-demand
    - export-image
    - bipartite-projection
    - linked-views-selection
suggested_components:
    - file-drop-zone
    - data-import-dialog
    - column-mapper
    - node-merge-dialog
    - computed-attributes-panel
    - filter-panel
    - range-slider
    - graph-canvas
    - layout-panel
    - ego-network-dialog
