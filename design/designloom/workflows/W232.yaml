id: W232
name: Algorithms Learner - Draw a Graph, Step Through an Algorithm, Check the Hand Trace
category: analysis
validated: false
personas:
    - graph-algorithms-learner
    - network-analysis-instructor
requires_capabilities:
    - shortest-path
    - path-highlighting
    - algorithm-progress
    - visual-encoding-edges
    - node-selection
    - analysis-history
    - export-image
    - keyboard-shortcuts
    - matrix-view
    - graph-authoring
    - undo-redo
    - algorithm-step-through
