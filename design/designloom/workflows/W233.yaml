id: W233
name: Build a Class Network from a Survey
category: analysis
validated: false
personas:
    - network-analysis-instructor
    - class-project-student
    - r-statistical-network-student
requires_capabilities:
    - data-import
    - data-validation
    - data-preview
    - node-merging
    - layout-force-directed
    - degree-analysis
    - visual-encoding-nodes
    - legend-display
    - details-on-demand
    - comparison-view
    - export-image
    - survey-network-import
