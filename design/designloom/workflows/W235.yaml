goal: >-
    **Intent**: Answer a weekly problem set in a Jupyter notebook (often Google Colab) with NetworkX: build a graph,
    compute measures, answer questions, and look at the structure. Coding-track courses (Leiden, Georgia Tech, Oklahoma,
    Indiana, Rochester, Michigan's Coursera course) work this way, and their datasets reach 10^4 to 10^5 nodes.


    **Mental Model**: "The notebook is the lab book." Every number must come from a cell that reruns; the picture is a
    check on the numbers and, at the end, a figure for the report.


    **Task Phases**:

    1. **Open the notebook** - Hosted in Colab or with a pinned requirements file; no desktop installs

    2. **Load and count** - Read CSVs into nx.Graph, print node and edge counts against the source

    3. **First look** - nx.draw with matplotlib; above a few hundred nodes it is a hairball

    4. **Ask an assistant** (where allowed) - For the call that computes a measure; document the prompt in the notebook

    5. **Measures** - Density, transitivity, degree, eigenvector and betweenness centrality, greedy modularity
    communities; take the largest component first because diameter fails on a disconnected graph

    6. **Weights** - Decide whether weights are strengths or distances; invert strengths before path measures

    7. **Export** - Write GEXF to finish the figure in Gephi, or display inline

    8. **Interpret** - Say whether a diameter of 8 is large or small, and treat findings as an invitation to more
    research


    **Decision Points**:

    - Work on the whole graph or the largest component

    - Are weights strengths or distances?

    - Which random seed to fix for layouts and community detection

    - Draw in the notebook or export to a desktop tool


    **Information Needs**:

    - Counts and component sizes after loading

    - Clear statement of how weights were interpreted by each measure

    - Interactive view of 10^4 to 10^5 nodes colored by a computed column, inside the notebook

    - Baseline values to judge whether a measure is large


    **Pain Points**:

    - Diameter and path measures fail on disconnected graphs

    - Weights silently read as distances

    - Layouts change every run until a seed is set

    - Matplotlib drawing is unreadable at course dataset sizes

    - Round trips to Gephi lose types or computed columns


    **Data Flow**:

    - Input: CSV edge lists, SNAP text files, instructor notebooks

    - Transformations: Graph construction, largest-component extraction, centralities, communities, weight inversion

    - Output: Answered notebook with computed values, figures, GEXF export, documented AI prompts
success_criteria:
    - metric: In-notebook view
      target: A 10^5-node, 5 x 10^5-edge graph from NetworkX displays interactively in a hosted notebook
    - metric: Weight clarity
      target: The student can state whether each measure treated weights as strengths or distances
    - metric: Reproducibility
      target: Rerunning the notebook with the same seed gives the same layout and communities
