id: W237
name: Biology Lab - Gene List to a Clustered, Enriched Protein Network (Cytoscape and STRING)
category: analysis
validated: false
personas:
    - network-analysis-instructor
requires_capabilities:
    - data-import
    - data-validation
    - component-analysis
    - community-detection
    - visual-encoding-nodes
    - legend-display
    - layout-force-directed
    - details-on-demand
    - export-image
    - data-export
suggested_components:
    - gene-set-import-dialog
    - attribute-table-join-dialog
    - data-table-panel
    - visual-encoding-panel
    - gradient-editor
    - legend-panel
