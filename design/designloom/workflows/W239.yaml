    - onboarding-wizard
    - graph-canvas
    - algorithm-panel
starting_state:
    data_type: classic teaching dataset, a class survey, an exam network or students' own data
    node_count: 10-1000
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Prepare a lab or workshop so every student reaches a correct, readable result in one session: concepts
    first, a small sparse dataset, a handout with exact steps, a fallback, a demo plan and a grading scheme. Done each
    term, and redone after each tool release.


    **Mental Model**: "A recipe that must still work next term." The handout is only as good as the tool's stability;
    a starting state students can open in one click removes most of the risk.


    **Task Phases**:

    1. **Concept before tool** - Two lessons of network concepts before opening the software

    2. **Pick the dataset** - Students' own data, a class survey, a classic (karate club 34 members and 78 edges, Les
    Miserables, political books) or an exam network

    3. **Write the handout** - Exact menus and version notes; post it with data and install notes on the LMS; prepare
    pre-made files as a fallback when a data source closes

    4. **Run the lab** - Demonstration, task, discussion, second task; a 5-15 minute Network of the Day warm-up; or a
    stepped algorithm demo on the projector

    5. **Grade** - Use of tools, insight and presentation; fixed deliverables with late penalties; for algorithms, the
    order and working


    **Decision Points**:

    - Which tool, given installs, operating systems and privacy of free tiers

    - Which dataset, at what size and density

    - What AI-use policy to set

    - What to grade and how to keep it fast


    **Information Needs**:

    - A saved starting state students open by link, identical for everyone

    - A data card for each teaching dataset (source, size, meaning of attributes)

    - A step list that stays valid across versions

    - A private, read-only share for grading


    **Pain Points**:

    - Handouts rot with each release

    - Install time eats the first lab; Windows-only tools exclude Mac students

    - Free tiers publish student work

    - Students' pictures differ from the demo because layouts and communities are not seeded


    **Data Flow**:

    - Input: Dataset, learning goals, tool choice

    - Transformations: Saved starting state, handout, fallback files, demo script

    - Output: LMS package (data, handout, link), graded submissions
success_criteria:
    - metric: Zero-install lab
      target: Every student opens the prepared starting state from a link with no install
    - metric: Handout durability
      target: A handout written for one release still works for the next without edits
    - metric: Identical start
      target: Every student sees the same layout and colors when opening the prepared state
