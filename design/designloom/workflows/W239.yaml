id: W239
name: Instructor Lab Preparation That Survives the First Session
category: administration
validated: false
personas:
    - network-analysis-instructor
    - graph-algorithms-learner
requires_capabilities:
    - sample-datasets
    - data-import
    - view-bookmarks
    - analysis-history
    - guided-onboarding
    - shortest-path
    - algorithm-progress
    - export-image
    - analysis-provenance
    - graph-authoring
    - algorithm-step-through
    - private-share-link
