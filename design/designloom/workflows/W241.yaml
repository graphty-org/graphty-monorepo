      url: https://cytoscape.org/cytoscape-tutorials/protocols/AP-MS-network-analysis/
      summary: Import, STRING at 0.999, merge, styling, enrichment donuts and export, with step times
    - title: Morris et al. 2014 - AP-MS and network analysis
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4332878
      summary: CRAPome, SAINT, MiST and CompPASS pre-processing
    - title: Ten simple rules for creating biological network figures
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6762067
      summary: Complexes and groups shown as enclosing hulls
    - title: SARS-CoV-2 interactome example
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9904289
      summary: 332 high-confidence interactions
    - title: BioPlex 3.0
      url: https://pubmed.ncbi.nlm.nih.gov/33961781/
      summary: 118,162 interactions in a large AP-MS interactome
