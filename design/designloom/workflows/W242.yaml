id: W242
name: Site-Level Phosphoproteomics or Time Course on a Network
category: analysis
validated: false
personas:
    - proteomics-bench-scientist
    - network-biology-core-bioinformatician
requires_capabilities:
    - data-import
    - data-validation
    - filtering
    - visual-encoding-nodes
    - legend-display
    - community-detection
    - layout-force-directed
    - details-on-demand
    - export-image
    - temporal-analysis
    - node-glyph-charts
suggested_components:
    - data-import-dialog
    - attribute-table-join-dialog
    - data-table-panel
    - filter-panel
    - node-chart-overlay
    - legend-panel
    - node-details-panel
    - graph-canvas
    - image-export-dialog
starting_state:
    data_type: long table with several rows per protein (phosphosites or time points) plus a STRING network
    node_count: 100-1,300 proteins (1,278 in the time-course exercise)
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Show data that has several values per protein -- many phosphosites, or many time points -- on an
    interaction network without averaging them into one number.


    **Mental Model**: "A small chart on every node." Each protein is a ring or a pie; each slice is a site or a time
    point colored by its log ratio. The network gives neighbors; the ring gives the measurements.


    **Task Phases**:

    1. **Import the long table** (5 min) - One row per phosphosite (protein, site, log ratio, adjusted p) or per protein
    and time point

    2. **Filter** (2 min) - Keep sites at adjusted p of 0.01 or lower

    3. **Retrieve the network** (5 min) - STRING network for the remaining proteins at confidence 0.7

    4. **Draw per-node charts** (10 min) - A donut ring per node, one slice per site or time point, colored on a
    diverging scale by log ratio; a categorical pie inside for cluster

    5. **Read and export** (10 min) - Find neighborhoods where several sites move together; export the figure with a
    legend for both chart encodings


    **Decision Points**:

    - Which significance cutoff for sites, and keep proteins with no significant site?

    - How to order slices (by site position, by time) so rings compare across nodes?

    - One shared color scale for all slices, or per time point?

    - Show all sites, or only the top few per protein when a protein has dozens?


    **Information Needs**:

    - Rows per protein after filtering, and proteins with more slices than can be read

    - Which slice is which site or time point on hover

    - Color scale endpoints and the zero midpoint in the legend

    - Cluster membership alongside the site values


    **Pain Points**:

    - Data that is one-to-many per node does not fit one color per node, so sites get averaged

    - Chart configuration is a text expression typed into a table column

    - Rings become unreadable when a protein has many sites

    - Time courses are node attribute vectors, but tools offer them only as animation or not at all


    **Data Flow**:

    - Input: Long phosphosite or time-course table; species; STRING confidence

    - Transformations: Significance filter, network retrieval, one-to-many join from rows to a node, per-node ring and
    pie charts

    - Output: Network figure with per-node site or time rings and legend; filtered site table
success_criteria:
    - metric: Several values per node visible
      target: Every measured site or time point is a separate slice, none averaged
    - metric: Legend completeness
      target: Legend explains ring slices, ring colors and inner pie categories
    - metric: Time to figure
      target: Under 30 minutes from long table to figure
sources:
