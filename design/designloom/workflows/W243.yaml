starting_state:
    data_type: curated pathway diagram (KGML, GPML, Reactome, SBGN) plus a per-gene or per-metabolite value table
    node_count: 20-300 per map
    edge_density: sparse
    user_expertise: novice to intermediate
goal: >-
    **Intent**: Paint measured values onto a pathway diagram exactly as curators drew it (KEGG, WikiPathways, Reactome),
    keeping the drawn layout, compartments and the meaning of each arrow.


    **Mental Model**: "The textbook figure, with my data on it." The fixed layout is the point: readers recognize the
    map, and the direction and sign of each relation (activation, inhibition, phosphorylation) carry the mechanism.


    **Task Phases**:

    1. **Pick the map** - Search KEGG, WikiPathways or Reactome for the pathway; choose WikiPathways as a
    curated "pathway" or a simplified "network"

    2. **Load** - KGML via KEGGscape or GPML via the WikiPathways app; Reactome in its own browser; check
    that compartments and relations came through

    3. **Join the data** - Map gene ids (Entrez, Ensembl, KEGG ids such as hsa:7157) to map nodes; several genes
    can share one box

    4. **Color** - Fill by log fold change on a diverging scale; for several numeric columns, step through
    them as "experiments" (Reactome) or split boxes

    5. **Export** - Image with legend, keeping the curated drawing


    **Decision Points**:

    - Quick web route (KEGG Mapper Color, Reactome, 5 minutes) or editable route (Cytoscape, 30 to 60 minutes) or code
    route (Pathview)?

    - Native KEGG drawing or a recomputed layout (Pathview Graphviz mode)?

    - How to color a map box that stands for several genes with different values?

    - Is the map licensed for this use (KEGG for non-academic users)?


    **Information Needs**:

    - How many of the user's genes landed on the map, and which ids failed

    - Relation type of every edge: activation, inhibition, expression, repression, binding, phosphorylation,
    ubiquitination

    - Which boxes stand for more than one gene

    - Legend with the value scale and the edge notation (arrow versus T-bar)


    **Pain Points**:

    - KGML imports can be incomplete; KEGGscape loses compartments

    - The quick web tools return static images that cannot be edited

    - General network tools ignore the curated coordinates and re-layout the map

    - Arrow versus T-bar notation must be mapped by hand

    - KEGG requires a license for non-academic use


    **Data Flow**:

    - Input: KGML, GPML, Reactome or SBGN pathway; per-gene or per-metabolite value table

    - Transformations: Fixed-coordinate import with relation subtypes, identifier mapping, many-genes-per-box join,
    color mapping

    - Output: Colored pathway diagram with legend in the curated layout
success_criteria:
    - metric: Layout preserved
      target: Imported node coordinates, groups and compartments match the curated map
    - metric: Relation meaning preserved
      target: Activation and inhibition are drawn with distinct arrowheads after import
    - metric: Match transparency
      target: User sees how many genes mapped to the diagram and which did not
