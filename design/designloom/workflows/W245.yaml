id: W245
name: Robustness Check Across Cutoffs, Databases and Resolutions
category: analysis
validated: false
personas:
    - genomics-cytoscape-user
    - proteomics-bench-scientist
    - signaling-network-modeler
    - single-cell-computational-biologist
requires_capabilities:
    - comparison-view
    - community-detection
    - centrality-degree
    - centrality-betweenness
    - computed-attributes
    - filtering
    - basic-statistics
    - statistics-panel
    - analysis-history
