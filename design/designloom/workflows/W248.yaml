    - data-import-dialog
    - filter-panel
    - select
    - comparison-view
    - visual-encoding-panel
    - legend-panel
    - graph-canvas
    - image-export-dialog
starting_state:
    data_type: "K x K x N array: cell groups by cell groups by ligand-receptor pairs or pathways, with counts and weights"
    node_count: 10-30 cell groups
    edge_density: dense, with self-loops, across hundreds of layers
    user_expertise: advanced
goal: >-
    **Intent**: Infer which cell types send signals to which, through which ligand-receptor pairs and pathways, and how
    that communication changes between conditions.


    **Mental Model**: "A switchboard between cell types." Nodes are cell groups; each pathway is a separate set of
    directed, weighted wires on the same nodes; comparing conditions means comparing wires on a fixed board.


    **Task Phases**:

    1. **Create and preprocess** - createCellChat(object, meta, group.by = "cell_type"); CellChatDB.human
    (2,021 interactions in 229 pathway families originally); identifyOverExpressedGenes

    2. **Infer** - computeCommunProb(type = "triMean") with 100 permutations, p < 0.05;
    filterCommunication(min.cells = 10); computeCommunProbPathway

    3. **Aggregate** - aggregateNet gives count and weight between each pair of groups

    4. **Draw** - netVisual_circle with vertex size by group size; per-sender panels keep a global maximum edge
    width so widths compare; per pathway netVisual_aggregate as circle, hierarchy, chord or spatial, with sources,
    targets, threshold and top-n

    5. **Compare conditions** - mergeCellChat and netVisual_diffInteraction by count or weight: red increased,
    blue decreased

    6. **Check consensus** (optional) - LIANA runs 7 methods over 16 resources and ranks by consensus because the choice
    strongly changes predictions


    **Decision Points**:

    - Which ligand-receptor resource and which inference method?

    - Which pathways to show out of hundreds?

    - Count or weight; which sender and receiver groups to keep?

    - Same edge-width scale across panels and conditions?


    **Information Needs**:

    - Layer list (pathways, ligand-receptor pairs) with total weight per layer

    - Self-loops (autocrine signaling) drawn

    - Difference per edge between conditions with a diverging color

    - Group sizes on nodes


    **Pain Points**:

    - Each pathway is a separate static plot

    - Widths are not comparable across panels unless the maximum is fixed by hand

    - Methods and resources disagree

    - No interactive way to step through layers on one fixed drawing


    **Data Flow**:

    - Input: CellChat or LIANA objects or tables: source group, target group, ligand, receptor, pathway, probability,
    p-value

    - Transformations: Aggregation per pair and per pathway, layer filtering, condition difference

    - Output: Circle, chord and hierarchy figures; difference network; ligand-receptor table
success_criteria:
    - metric: Layer switching
      target: User steps through pathways on one fixed node arrangement
    - metric: Comparable widths
      target: Edge widths share one scale across layers and conditions
    - metric: Self-loops
      target: Autocrine signaling is drawn
