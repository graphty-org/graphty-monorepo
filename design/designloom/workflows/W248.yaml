id: W248
name: Cell-Cell Communication Networks (CellChat, LIANA)
category: analysis
validated: false
personas:
    - single-cell-computational-biologist
requires_capabilities:
    - data-import
    - visual-encoding-edges
    - visual-encoding-nodes
    - legend-display
    - filtering
    - comparison-view
    - layout-radial
    - export-image
    - data-export
    - multiplex-relations
    - network-collection-small-multiples
    - layout-circular-chord
