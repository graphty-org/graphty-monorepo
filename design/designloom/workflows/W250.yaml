id: W250
name: Metabolic Flux Overlay on a Curated Pathway Map
category: analysis
validated: false
personas:
    - metabolic-network-modeler
requires_capabilities:
    - data-import
    - visual-encoding-edges
    - visual-encoding-nodes
    - legend-display
    - filtering
    - node-merging
    - comparison-view
    - search
    - export-image
    - fixed-node-positions
    - biological-network-formats
    - currency-node-handling
suggested_components:
    - data-import-dialog
    - visual-encoding-panel
    - gradient-editor
    - legend-panel
    - filter-panel
    - search-panel
    - comparison-view
    - graph-canvas
    - image-export-dialog
starting_state:
    data_type: bipartite metabolite-reaction model (COBRA JSON, SBML) or curated map plus flux or concentration values
    node_count: tens to hundreds on a map; thousands of reactions per model
    edge_density: sparse with currency hubs
    user_expertise: advanced
goal: >-
    **Intent**: Show predicted fluxes or measured metabolite changes on a metabolic map, compare flux solutions
    (for example before and after a knockout solved in COBRApy or Escher-FBA), and see which reactions carry more or
    less flux. Solving the model stays in the solver; this workflow overlays its results. Metabolomics network analysis
    without a flux model is W3102 (knowledge-driven) and W3103 (DSPC partial correlation).


    **Mental Model**: "Traffic on a road map." Reactions are roads with a direction; flux is traffic volume and its sign
    the direction of travel; currency metabolites like water and ATP are not destinations.


    **Task Phases**:

    1. **Load the model** - cobra.io.load_json_model, or convert SBML

    2. **Solve, outside Graphty** - model.optimize() in COBRApy, or a knockout in Escher-FBA; export the flux
    table (out of scope: Graphty never solves the model)

    3. **Load the map** - Builder(map_name, model); maps are hand-built JSON drawings

    4. **Paint data** - reaction_data from solution fluxes: width by magnitude, color by value, arrow by sign;
    metabolite data as node color or size

    5. **Handle currency metabolites** - Hide, remove or duplicate water, ATP, NADH and H+

    6. **Export** - SVG


    **Decision Points**:

    - Which map, or draw a new one?

    - Which currency metabolites to hide or duplicate?

    - Absolute flux or difference from a reference condition?


    **Information Needs**:

    - Flux magnitude and sign per reaction

    - Reversibility

    - Metabolites that appear several times on the map

    - Which reactions changed after a knockout


    **Pain Points**:

    - Currency metabolites dominate degree and layout

    - Maps are built by hand

    - SBML must be converted to COBRA JSON

    - General network tools ignore reversibility and flux sign


    **Data Flow**:

    - Input: COBRA JSON or SBML model; flux solution; metabolite concentrations; map JSON or KGML

    - Transformations: Flux-to-edge mapping, flux difference between two solutions, currency-node handling
    (optimization and knockouts run in the solver)

    - Output: Flux map figure; changed-reaction list
success_criteria:
    - metric: Flux readable
      target: Magnitude and direction of flux visible on every reaction
    - metric: Currency handling
      target: Listed currency metabolites can be hidden or duplicated in one step
    - metric: Knockout feedback
      target: Loading a second flux table (the knockout solution) recolors the same map and lists changed reactions
