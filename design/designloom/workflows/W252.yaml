starting_state:
    data_type: genetic interaction profile-similarity network or co-essentiality network
    node_count: about 5,000 (4,909 in the yeast map)
    edge_density: medium (34,468 edges)
    user_expertise: advanced
goal: >-
    **Intent**: Read a genome-scale genetic interaction or co-essentiality network as a functional map: lay it out, then
    test each node's neighborhood on the layout for function enrichment and color the regions.


    **Mental Model**: "The layout carries the meaning." Genes with similar interaction profiles sit together; regions of
    the drawing are named after the functions enriched in them.


    **Task Phases**:

    1. **Build** (varies) - Profile similarity network at Pearson correlation > 0.2

    2. **Lay out** (10 min) - Spring-embedded layout

    3. **SAFE** (10 min) - Test each node's local neighborhood on the layout for GO enrichment

    4. **Color regions** (10 min) - Color the 19 functional regions and label them

    5. **Query** (ongoing) - Find where a gene of interest falls and what region surrounds it


    **Decision Points**:

    - Correlation cutoff for edges

    - Neighborhood radius for SAFE

    - Which annotation set to test


    **Information Needs**:

    - Region labels with enrichment scores

    - Where a searched gene sits

    - Edge count at the chosen cutoff


    **Pain Points**:

    - Region enrichment requires the layout, so the layout must be fixed and reproducible

    - Co-essentiality networks carry a mitochondrial bias


    **Data Flow**:

    - Input: Profile similarity matrix or edge list; GO annotations

    - Transformations: Thresholding, spring layout, neighborhood enrichment over the layout, region coloring

    - Output: Annotated functional map
success_criteria:
    - metric: Regions labeled
      target: Every enriched region has a function label
    - metric: Stable layout
      target: Same layout reproduces with a recorded seed
    - metric: Scale
      target: 5,000 nodes and 35,000 edges interactive
