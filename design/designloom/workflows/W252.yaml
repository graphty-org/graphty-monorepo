id: W252
name: Genetic Interaction Networks and Spatial Functional Enrichment (SAFE)
category: analysis
validated: false
personas:
    - network-biology-core-bioinformatician
requires_capabilities:
    - data-import
    - filtering
    - layout-force-directed
    - community-profiling
    - visual-encoding-nodes
    - annotation
    - legend-display
