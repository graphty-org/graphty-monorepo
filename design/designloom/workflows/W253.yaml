starting_state:
    data_type:
        GNPS GraphML (consensus spectra or features as nodes, cosine edges with mass difference) plus library hits,
        or a .cys session; per-group intensities and SMILES
    node_count: 500-55,000 features per job in many small components capped at 100 nodes, plus singletons; 5-100 nodes
        per family drawn in a figure
    edge_density: sparse, many small components
    user_expertise: intermediate
goal: >-
    **Intent**: Turn an untargeted LC-MS/MS dataset into a molecular network, find the molecular families that differ
    between sample groups, and name unknown spectra from annotated neighbors.


    **Mental Model**: "Families of related molecules." Spectra that fragment alike are probably related compounds; a
    library hit names its neighbors, and an edge's mass difference says what chemical change links them.


    **Task Phases**:

    1. **Convert** (varies) - Vendor files to mzML with ProteoWizard

    2. **Detect features** - Feature-based networking only: MZmine or MS-DIAL exports a feature table and an
    MGF

    3. **Submit** - Groups G1-G6; defaults precursor 2.0 Da, fragment 0.5 Da, cosine 0.7, 6 matched
    peaks, TopK 10 mutual, maximum component size 100

    4. **Read in the browser** - View Spectral Families lists components; open one at a time; library hits
    blue; pies per group; type a delta m/z to turn matching edges red

    5. **Propagate annotations** - NAP re-ranks candidate structures from annotated neighbors within a
    component; MolNetEnhancer gives each family a chemical class

    6. **Download for Cytoscape** - Zip with .graphml and library-match .csv, or a ready .cys session with a
    preset style (GNPS2 builds one with molecular-family groups and the GNPS pie-chart style)

    7. **Import and join tables** - Import the network, then join library hits keyed on the scan or feature ID

    8. **Style** (every job) - Label by precursor mass or compound name; size by summed peak intensity; pies over
    the group columns; fill by MolNetEnhancer class; edge width by cosine with min and max tuned by hand; or import a
    saved style file

    9. **Draw structures** - Set the SMILES attribute and paint structures on nodes (chemViz2)

    10. **Filter and isolate families** - Column filters (ppm error, compound name, condition), repeated first
    neighbors of a selection, new network from selection; the component index marks families (-1 for singletons); one
    network had 810 sub-families

    11. **Compare groups** - Per-condition subnetworks; Venn or Euler diagrams for group-unique features

    12. **Handle size** - A 55,000-node network triggered Cytoscape's "This could take a long time" prompt, and the
    user was told to browse families in GNPS instead

    13. **Export** - PDF for the paper and the .cys session for collaborators; the whole analysis takes "4h-weeks"


    **Decision Points**:

    - Classical or feature-based networking?

    - Cosine, matched peaks and TopK settings

    - Show singletons or hide them?

    - Which families to show in the figure?

    - Is an unannotated neighbor of a library hit a credible analog?


    **Information Needs**:

    - Component list with size, group abundance and library hits, sortable

    - Edges matching a given mass difference

    - Structure images for annotated nodes

    - Building parameters shown with the network

    - Per node: precursor m/z, retention time, intensity, per-group means, library match, SMILES, chemical class

    - Which features are unique to one sample group


    **Pain Points**:

    - Browser viewer shows one component at a time

    - Cytoscape search is slow on large molecular networks

    - Reruns reshape families and random per-family layouts make comparison arduous

    - Classical networking splits one compound into many nodes (13 duplicates for EDTA)

    - Many nodes left as singletons

    - The style is rebuilt or re-imported for every job; structure images and pie charts are set up by hand

    - Whole networks can be too large to open in Cytoscape


    **Data Flow**:

    - Input: GNPS GraphML, library hit table, feature table with group columns, or a .cys session; metadata table

    - Transformations: Component listing and packing, mass-difference edge highlight, group pies, structure glyphs,
    class coloring

    - Output: Molecular family figures (PDF), annotated feature table, session for collaborators, shared job link
success_criteria:
    - metric: All families at once
      target: Every component and singleton can be shown and ranked in one view
    - metric: Mass difference search
      target: Edges matching a typed delta m/z highlight in one step
    - metric: Parameters visible
      target: Job parameters accompany the network
    - metric: Restyling cost
      target: A saved molecular-network style reapplied to a new job in one action
    - metric: Large network handling
      target: A 55,000-node network opens and families can be browsed without a warning prompt
