starting_state:
    data_type: sparse cells x cells connectivity matrix with a cell observation table (.h5ad or Seurat)
    node_count: 10^4-10^6 cells; PAGA graph of tens of nodes
    edge_density: near-uniform degree, about 15 per cell
    user_expertise: advanced
goal: >-
    **Intent**: Find the cell populations in a single-cell dataset by clustering its nearest-neighbor graph, judge how
    stable the clusters are, and see how populations connect.


    **Mental Model**: "Cells are towns, neighbors are roads." Clusters are towns; PAGA is the highway map between towns;
    the UMAP is a picture of the towns whose distances should not be trusted.


    **Task Phases**:

    1. **Matrix** (30 min) - Cells x genes; QC, normalize, 2,000 variable genes, PCA

    2. **Neighbors** (1-5 min) - sc.pp.neighbors with n_neighbors 15 in PCA space; Seurat FindNeighbors with
    shared-neighbor weights

    3. **Cluster** (5 min) - Leiden or Louvain at several resolutions compared on the UMAP by eye; clustering tree for
    stability

    4. **Embed** (5 min) - UMAP or ForceAtlas2; edges not drawn

    5. **Abstract** (2 min) - PAGA: one node per cluster, edges by observed over expected connectivity; seeds UMAP

    6. **Interactive look** (varies) - SPRING live force layout up to about 10,000 cells; CELLxGENE plots a million
    cells without edges


    **Decision Points**:

    - Number of neighbors and PCA dimensions

    - Which resolution, and is it stable?

    - Annotate clusters as which cell types?


    **Information Needs**:

    - Cluster sizes per resolution

    - Cells moving between clusters across resolutions

    - PAGA edge weights

    - Recorded neighbor parameters


    **Pain Points**:

    - Resolution chosen by eye

    - UMAP distances misread

    - Graph edges never shown

    - SPRING slow above 10,000 cells


    **Data Flow**:

    - Input: .h5ad obsp connectivities and obs table; or sparse matrix plus node table

    - Transformations: kNN construction, Leiden at several resolutions, PAGA abstraction, coarse-to-fine layout

    - Output: Annotated cluster map, PAGA graph, stability view
success_criteria:
    - metric: Scale
      target: 10^5 cells with edges interactive
    - metric: Two-level view
      target: PAGA graph linked to member cells
    - metric: Stability
      target: Cluster flows across resolutions visible
