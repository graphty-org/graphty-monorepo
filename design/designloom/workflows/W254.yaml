    - title: Single-cell best practices - integration
      url: https://www.sc-best-practices.org/cellular-structure/integration/
      summary: Neighbors on X_scVI or X_scANVI, BBKNN writes the integrated graph, scIB graph connectivity, UMAPs do not show integration quality
    - title: Single-cell best practices - annotation
      url: https://www.sc-best-practices.org/cellular-structure/annotation/
      summary: Marker dot plots per cluster, rank_genes_groups, CellTypist, scArches label transfer
