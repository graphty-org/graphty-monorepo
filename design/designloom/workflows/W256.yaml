starting_state:
    data_type: interactome edge list (TSV) plus disease gene sets, drug-target lists and a precomputed proximity table
    node_count: 13000-18500 in the base graph; 20-300 drawn
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Rank approved drugs for a disease by how close their targets sit to the disease's genes on the human
    interactome, compared with degree-matched random sets, and then turn the top results into a readable figure of the
    drug's targets, the disease module and the shortest paths between them. The statistics run in Python or R
    (NetMedPy, SAveRUNNER, own scripts); the figure step is the least documented and the one these users lack tools for.


    **Mental Model**: "Closer than chance." A drug matters for a disease only if its targets are nearer to the disease
    genes than random protein sets of the same size and degree would be. The whole interactome is never the picture; the
    picture is one drug's neighborhood of the disease module.


    **Task Phases**:

    1. **Assemble the interactome** (once per project) - Merge physical interaction sources (IntAct, BioGRID,
    HPRD, CORUM) into one undirected graph, keep the largest component (13,329 proteins and 141,150 interactions in
    Guney 2016; 17,706 and 351,444 in Zhou 2020); output a TSV edge list

    2. **Collect disease genes** - From OMIM, GWAS (p < 5e-8) or DisGeNET, keeping diseases with at least 20
    genes because modules under about 25 genes are not observable

    3. **Collect drug targets** - From DrugBank, ChEMBL and BindingDB at 10 micromolar affinity or better

    4. **Map identifiers** - Map every gene and target into the interactome's ID space (Entrez or UniProt) and
    drop what does not map

    5. **Compute distances and the null model** (scripted) - Closest-distance d_c (mean over targets of the
    shortest path to the nearest disease protein); 1,000 random draws matched in size and degree (degree bins of at least
    100 nodes); z = (d - mean_rand) / sd_rand; significant at z <= -2 (Guney) or z < -1.5 with p < 0.05 (Zhou)

    6. **Validate** - AUC against known indications; in a 918-drug screen the best of 12 pipelines reached only
    about 0.63

    7. **Hand off to a figure** (hand-coded) - Load the interactome, the disease gene set, the top
    drug's targets and the z-score table; show only the module, the targets and the shortest paths between them;
    distinguish disease genes, targets and connector proteins by shape and color; hide or fade the rest of the
    interactome; export a figure and the node table with set membership

    8. **Hand off results** - Supplementary CSV or XLSX of drugs with z and p, plus a GitHub repository with parameters


    **Decision Points**:

    - Which interactome version and which sources (STRING is usually excluded from proximity work)?

    - Which proximity measure (closest is most used) and which null model?

    - Which z threshold counts as significant?

    - Which top drugs deserve a figure, and how many connector proteins to show?

    - For combinations: is the drug pair's separation negative (overlapping targets) or positive (separate
    neighborhoods hitting the same module)?


    **Information Needs**:

    - Count of genes and targets that mapped and the list of those that did not

    - Membership of each node in the disease set, the drug's target set, or the connecting paths

    - Proximity z and p per drug, sortable, selecting into the drawing

    - Shortest paths from each target to the nearest disease protein

    - The run parameters (interactome version, seed list, null model, randomizations, random seed)


    **Pain Points**:

    - "Visualization and interpretation are performed outside of NetMedPy"; scripts end in DataFrames

    - Published module figures were drawn with igraph base plot with every encoding hand-written and nothing saved

    - Drawing the whole interactome is a hairball; no tool cuts out "sets plus the paths between them"

    - Identifier mapping silently drops nodes

    - Results depend on the null model and method; users compare several pipelines


    **Data Flow**:

    - Input: Interactome TSV edge list; disease gene set; drug-target lists; precomputed proximity table (drug, z, p)

    - Transformations: ID mapping, set-membership tagging, shortest paths between sets, subgraph extraction, encoding by
    set and score

    - Output: Module-and-targets figure, node table with set membership and scores, parameter record
success_criteria:
    - metric: Time from script output to a figure of one drug near the disease module
      target: Under 15 minutes, with no plotting code (design goal; no source measures it)
    - metric: Mapping transparency
      target: User can state how many disease genes and targets mapped and which did not
    - metric: Reproducibility
      target: Exported figure and table carry the interactome version and thresholds used
sources:
    - title: Guney et al. 2016 - Network-based in silico drug efficacy screening
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4740350/
      summary: Closest-distance proximity, degree-matched null, z <= -2; figure of targets, module and shortest paths
    - title: Zhou et al. 2020 - Network-based drug repurposing for novel coronavirus
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7073332/
      summary: 17,706-protein interactome; z < -1.5 and p < 0.05; figures drawn in Gephi 0.9.2
    - title: Gysi et al. 2021 - Network medicine framework for COVID-19 repurposing
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8126852
      summary: 12 pipelines on a 918-drug screen; best AUC about 0.63
    - title: Barabasi-Lab COVID-19 repository
      url: https://github.com/Barabasi-Lab/COVID-19
      summary: Module drawn with igraph base plot in 00_Intro.R; encodings hand-written, nothing saved
    - title: NetMedPy
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12401583
      summary: Precomputed distance matrix, parallel null model, DataFrame outputs; visualization outside the tool
    - title: SAveRUNNER
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7891752
      summary: R proximity screen producing a bipartite drug-disease network
    - title: Cheng, Kovacs and Barabasi 2019 - Network-based prediction of drug combinations
      url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6416394/
      summary: Separation measure for drug pairs; complementary exposure tracks efficacy
