starting_state:
    data_type: internal typed knowledge graph (compound, gene, disease, phenotype, assay, pathway) with per-edge source, uncertainty and PubMed links
    node_count: 10-300 drawn from a graph of 10-30 million nodes
    edge_density: dense
    user_expertise: expert
goal: >-
    **Intent**: Produce ranked, explainable hypotheses of the form "this compound may act on this disease through this
    gene" from the company knowledge graph, with every edge traceable to its evidence, and learn which evidence sources a
    connection depends on. No public source shows the click-level interface; the steps are reconstructed from the query
    patterns that Novartis and AstraZeneca describe.


    **Mental Model**: "Short, strong, evidenced triangles." A hypothesis is a short typed path; its strength is the sum
    of its edges' uncertainties; it is only believed after someone reads the abstracts behind each edge.


    **Task Phases**:

    1. **Load and weight** (platform team) - Text-mine about 25 million PubMed abstracts plus about ten other sources;
    store co-occurrence lift scaled 0 to 1 on each edge as an uncertainty (inverse of strength) so it works as a distance

    2. **Triangle search** - Find compound-gene-disease (or -phenotype) triangles for a query; sum the three
    uncertainties; sort the triangles by that sum

    3. **Check the evidence** - Open the PubMed articles behind each edge of each top triangle; a biologist
    reviews and marks what holds

    4. **Reachability contrast** - From screening results, find nodes reachable from active compounds but not
    from inactive ones, then partition the graph (one example put 12 of 14 actives on one side and all inactives on the
    other)

    5. **Ablate an evidence type** - Remove text-mined edges and compare the resulting, weaker and more
    roundabout connection

    6. **Recommendation variant** - Ask an embedding service for the nearest gene nodes to a disease node; keep
    evidence and context for each assertion

    7. **Hand off** - Ranked hypothesis list with an evidence trail per edge to the target-assessment committee


    **Decision Points**:

    - What uncertainty threshold separates usable text-mined edges from noise (still being refined at Novartis)?

    - Is a top result new, or will the biologist say "I knew that"?

    - Does the connection survive removing one evidence source?

    - Which hypotheses go to the committee?


    **Information Needs**:

    - Per-edge source, uncertainty and list of PubMed IDs or sentences

    - Triangle and path lists ranked by summed edge weight, selecting into the drawing

    - Node and edge type filters applied before expansion

    - Active versus inactive membership of compounds

    - A side-by-side of the same query with and without one evidence type


    **Pain Points**:

    - Graph browsers cap the drawing (Neo4j Browser 300 nodes) and need Cypher

    - Evidence review is manual, edge by edge

    - Internal and public identifiers disagree

    - Association scores reflect data volume, not quality

    - Confidential and licensed data cannot leave the company, so cloud viewers are excluded


    **Data Flow**:

    - Input: Query entities (compound, disease, gene sets), screening activity labels

    - Transformations: Typed path and triangle search, weight summation and ranking, reachability from two sets,
    evidence-type filtering

    - Output: Ranked hypothesis table with evidence links; small subgraph figures for the dossier
success_criteria:
    - metric: Evidence traceability
      target: Every edge in a shown hypothesis opens its source and abstracts in one click
    - metric: Source contribution
      target: User can compare a result with and without an evidence type in under a minute (design goal; no source measures it)
    - metric: Ranking transparency
      target: Rank order is explained by visible per-edge weights
