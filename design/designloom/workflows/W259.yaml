starting_state:
    data_type: case-versus-control table of gene IDs with fold change and p-value, against a curated signed causal knowledge base
    node_count: 10-150 drawn; up to 8000 analysis-ready molecules
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Explain a differential expression or proteomics result as a mechanism of action: which upstream
    regulators are predicted to be activated or inhibited, how they connect to the measured genes, what would happen if
    one were inhibited, and which known drugs act there. Done today in QIAGEN IPA (MetaCore and Pathway Studio follow
    similar steps under other names).


    **Mental Model**: "Run the wiring diagram backwards." Each curated finding is a directed, signed edge (increases or
    decreases) with a citation. Observed changes at the bottom imply the state of regulators at the top.


    **Task Phases**:

    1. **Upload** (5 min) - Case-versus-control table (IDs, fold change, optional p-value); map columns to observations

    2. **Run Core Analysis** (10 min) - Cutoff such as p < 0.05; keep analysis-ready molecules under about 3,000 (hard cap
    8,000)

    3. **Read result tabs** (20 min) - Graphical summary, canonical pathways, upstream analysis, diseases and functions,
    regulator effects, networks; each entity has an enrichment p-value and an activation z-score (+2 or more predicted
    activated, shown orange; -2 or less predicted inhibited, blue); observed up and down genes are red and green

    4. **Upstream regulators** (15 min) - Table with predicted state, z-score and overlap p-value (dupilumab-treated
    atopic dermatitis: IL4 inhibited at z = -6.09); "Targets of X" opens the regulator and its downstream dataset genes
    as a network

    5. **Causal networks and building** (20 min) - Master regulators linked through intermediates; Path Explorer between
    Set A and Set B with direction, shortest paths plus one; Connect or Grow with filters

    6. **Simulate** (10 min) - Molecule Activity Predictor: set a node inhibited or activated and read predicted
    downstream changes on the network

    7. **Overlay drugs** (10 min) - Grow upstream from selected nodes and overlay labels for known drug targets (the
    training example ends with a candidate drug for atopic dermatitis)

    8. **Compare** (20 min) - Comparison Analysis across up to 20 analyses; match the signature against curated studies,
    where an opposite signature suggests repurposing

    9. **Figure and share** (30 min) - Format the network for publication in a designer view; share a project link


    **Decision Points**:

    - Which p-value and fold-change cutoffs keep the molecule count in range?

    - Which upstream regulators are biologically credible, not just high z?

    - Which path between two gene sets is the mechanism to show?

    - Which drug overlays belong in the figure?


    **Information Needs**:

    - Edge sign and direction with the source PMID for each finding

    - Two node-state layers at once: observed expression and predicted activity

    - Regulator table sorted by z-score with overlap p-value

    - Predicted downstream consequences of a simulated perturbation

    - Known drug-target relationships for nodes in view


    **Pain Points**:

    - Closed, licensed knowledge base; reproducing a result needs the same license and knowledge-base version

    - Input cap of 8,000 molecules

    - Figures need a manual formatting pass

    - Libraries cancel subscriptions; no single free option matches


    **Data Flow**:

    - Input: Gene table with fold change and p-value; curated signed directed findings with PMIDs

    - Transformations: Enrichment, upstream z-score inference, directional path search, perturbation propagation, drug
    overlay

    - Output: Regulator list, causal network figure with drugs, shared project link
success_criteria:
    - metric: Signed reading
      target: Activation and inhibition edges, and predicted versus observed node states, are distinguishable without the legend after first use
    - metric: Evidence access
      target: Every edge opens its source finding and PMID
    - metric: Figure readiness
      target: Mechanism figure exported with a legend for both node-state layers
