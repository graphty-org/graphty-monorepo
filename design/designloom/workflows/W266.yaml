starting_state:
    data_type: edge table (DataFrame, CSV or parquet) of interactions plus a node attribute table
    node_count: 1000-100000
    edge_density: sparse
    user_expertise: advanced
goal: >-
    **Intent**: Turn a table of interactions (transactions, messages, co-purchases, co-authorships) into a graph inside
    a notebook, compute a few metrics, and get a quick, trustworthy look at its shape -- one blob, many components, a
    few hubs -- before using it for anything else.


    **Mental Model**: "Did I build the graph I think I built?" The picture is a sanity check on a construction from a
    table, plus one figure for a slide. The real output is a DataFrame of node metrics.


    **Task Phases**:

    1. **Load and clean** (10 min) - Read the CSV or run a SQL query; decide node identity (customer id vs account
    id), drop self-pairs, aggregate repeated pairs into a weight count, decide directed or undirected and what counts
    as an edge (any transaction or above a threshold)

    2. **Build** (5 min) - `nx.from_pandas_edgelist(df, "src", "dst", edge_attr="weight", create_using=nx.DiGraph)`,
    attach node attributes from a second table; check node count, number of connected components and the degree
    histogram

    3. **First picture** (2 min) - `nx.draw(G)`; above a few hundred nodes this is a hairball, so many stop here or
    switch representation (matrix, arc, circos or hive plots grouped by an attribute)

    4. **Metrics** (5 min) - PageRank with weights, betweenness sampled with k=500 on larger graphs, Louvain with
    seed=42; results are dicts or lists of sets, written back to node attributes and into a DataFrame for sorting

    5. **Interactive look** (10 min) - pyvis with precomputed `spring_layout(seed=42)` positions and physics off on
    thousands of nodes, ipysigma with color by community and size by PageRank in the cell, or GEXF export to Gephi for
    ForceAtlas2 after stringifying list and dict attributes

    6. **Read and decide** (10 min) - Do communities match known labels? Is a hub an artifact (a test account, a
    default merchant id)? If so, return to step 1 and filter

    7. **Hand off** (5 min) - PNG or HTML into a slide or wiki page; node metric DataFrame to the modeling pipeline


    **Warehouse-scale variant**: With 10^8 to 10^9 edge rows she builds a GraphFrame in Databricks, runs
    connectedComponents, pageRank or labelPropagation, aggregates (component sizes, top-k), extracts one suspicious
    component, community or k-hop neighborhood, converts it with `toPandas()` and continues at phase 3. The viewer must
    accept node and edge tables with precomputed metric columns.


    **Decision Points**:

    - What is a node (customer, account, device) and what is an edge (any interaction or above a threshold)?

    - Directed or undirected; aggregate repeated pairs into a weight?

    - Node-link drawing or a different representation when the drawing is a hairball?

    - Is a top-ranked hub real or an artifact of data entry?

    - Sample betweenness (k) or wait for the exact value?


    **Information Needs**:

    - Node and edge counts, component count and sizes, degree histogram right after construction

    - Per-node metric values sortable as a table beside the drawing

    - Community membership as color and a metric as size, with a legend

    - The full attribute row of a clicked hub, to spot test accounts and default ids

    - Which attributes were dropped or changed type on import or export


    **Pain Points**:

    - Hairballs that show only that the graph is complex

    - pyvis physics freezing, and pyvis in Streamlit failing above about 1,000 nodes

    - Plotly network charts cannot hover an edge

    - GraphML and GEXF writers reject list or dict attributes, so data is stringified or lost

    - NetworkX slow at scale; switching libraries changes defaults

    - Interactive HTML does not survive in GitHub or nbviewer; reproducibility depends on code plus a seed


    **Data Flow**:

    - Input: Edge DataFrame (src, dst, weight, time) and node attribute table; or a Spark extract of one component

    - Transformations: Edge aggregation, graph construction, component and degree checks, metric computation written
    back as node columns, seeded layout

    - Output: Figure (PNG or HTML), node metric table for the modeling pipeline
success_criteria:
    - metric: Time from DataFrame to a readable, metric-encoded view
      target: Under 15 minutes for 10,000 nodes
    - metric: Attribute fidelity
      target: Every node and edge column survives import and export with its type, including list-valued columns
    - metric: Reproducibility
      target: The same data and seed give the same drawing
sources:
    - title: Network Analysis Made Simple - Visualizing graphs
      url: https://ericmjl.github.io/Network-Analysis-Made-Simple/01-introduction/03-viz
      summary: Hairball critique; matrix, arc, circos and hive plots with nxviz grouped by attribute
    - title: pyvis tutorial
      url: https://pyvis.readthedocs.io/en/stable/tutorial.html
      summary: Network(notebook=True), from_nx, show, physics toggles
    - title: NetworkX drawing reference
      url: https://networkx.org/documentation/stable/reference/drawing.html
      summary: Visualization is not NetworkX's goal; matplotlib drawing and pointers to Gephi and Cytoscape
    - title: ipysigma on PyPI
      url: https://pypi.org/project/ipysigma/
      summary: Sigma(G, node_color=..., node_size=...) renders WebGL in a notebook cell
    - title: yFiles Graphs for Jupyter
      url: https://www.yworks.com/yfiles-graphs-for-jupyter
      summary: Notebook widget for Jupyter, VS Code and Colab with selection returned to Python
    - title: NetworkX GraphML writer source
      url: https://networkx.org/documentation/latest/_modules/networkx/readwrite/graphml.html
      summary: Writer rejects list and dict attribute values
    - title: Streamlit forum - pyvis large network
      url: https://discuss.streamlit.io/t/streamlit-pyvis-error-when-displaying-large-network/28501
      summary: pyvis network stops loading above about 1,000 nodes
    - title: Databricks GraphFrames user guide
      url: https://docs.databricks.com/aws/en/integrations/graphframes/user-guide-scala
      summary: Warehouse-scale connectedComponents, pageRank and labelPropagation returning DataFrames
