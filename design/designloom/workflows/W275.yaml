id: W275
name: Review Entity Resolution Clusters
category: analysis
validated: false
personas:
    - entity-resolution-cluster-reviewer
requires_capabilities:
    - data-import
    - component-analysis
    - computed-attributes
    - centrality-betweenness
    - centrality-degree
    - removal-impact-analysis
    - filtering
    - data-preview
    - visual-encoding-edges
    - visual-encoding-nodes
    - details-on-demand
    - annotation
    - data-export
    - graph-collection-browser
suggested_components:
    - data-import-dialog
    - cluster-table
    - filter-panel
