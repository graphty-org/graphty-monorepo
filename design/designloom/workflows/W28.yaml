goal: >-
    **Intent**: Analyze data where people belong to groups (women at events, legislators on bills, directors on boards)
    either as a bipartite network or as a projection onto one mode, with a defensible weight and without mistaking
    projection artifacts for findings.


    **Mental Model**: "Two kinds of nodes, and ties only between kinds." A projection is a derived view: two actors are
    tied because they share a group, and every group becomes a clique.


    **Task Phases**:

    1. **Store** (estimate: 10 min) - Actor-by-event incidence matrix, a UCINET node list, or a two-column edge list.
    Pajek .net files declare the total vertex count and the size of the first mode. Classic example: Davis's Southern
    Women, 18 women by 14 events.

    2. **Look at it as bipartite first** (estimate: 10 min) - Two-mode layout with the modes distinguished by shape or
    color (NetDraw opens two-mode data directly); density is edges / (N x M).

    3. **Project if the question is about one mode** (estimate: 5 min) - Cross-products or minimums (UCINET Data >
    Affiliations); A times A-transpose with the diagonal zeroed; Pajek Net > Transform > 2-mode to 1-mode.

    4. **Choose a weight** (estimate: 10 min) - Binary, sum (shared groups) or Newman (each shared group weighted by
    1/(Np - 1)); or turn shared-group weights into distances (Fowler's connectedness score).

    5. **Watch for artifacts** (estimate: 10 min) - Projection inflates clustering (one co-authorship network: two-mode
    coefficient 0.28 versus 0.36 one-mode) and structural-hole measures; compare two-mode and one-mode values.

    6. **Or analyze bipartite directly** (estimate: 30 min) - Two-mode centrality and clustering, bipartite communities,
    correspondence analysis, two-mode ERGM, bipartite backbones.


    **Decision Points**:

    - Is the research question about one mode, or about the affiliation itself?

    - Binary, sum or Newman weights for the projection?

    - Keep very large groups (which create huge cliques) or down-weight or drop them?

    - Report two-mode or one-mode clustering?


    **Information Needs**:

    - Mode sizes and two-mode density

    - Degree distribution per mode (groups per actor, actors per group)

    - Projected edge weights under each weighting rule, side by side

    - Clustering and other measures computed on both the two-mode and the projected network


    **Pain Points**:

    - Projections turn every group into a clique and inflate clustering and constraint

    - Little guidance on choosing a weight

    - Partial two-mode support across tools (the R network package's Pajek reader cannot read 2-mode files)

    - Menu paths for projection that changed between tool versions


    **Data Flow**:

    - Input: Incidence matrix (CSV or Excel), two-column edge list, UCINET node list, or two-mode Pajek .net

    - Transformations: Mode assignment, bipartite layout, projection with a chosen weight, two-mode and one-mode measures

    - Output: Bipartite figure, weighted one-mode network, comparison table of two-mode and projected measures
success_criteria:
    - metric: Projection transparency
      target: User can state which weighting rule produced the projected network
    - metric: Artifact awareness
      target: Two-mode and projected clustering are both available for the same data
sources:
