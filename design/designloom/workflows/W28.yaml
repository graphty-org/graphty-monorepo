      url: https://faculty.ucr.edu/~hanneman/nettext/C6_Working_with_data.html
      summary: UCINET Data > Affiliations with cross-products or minimums
    - title: tnet two-mode projection
      url: https://toreopsahl.com/tnet/two-mode-networks/projection/
      summary: projecting_tm with binary, sum and Newman weights
    - title: Opsahl (2013) Triadic closure in two-mode networks
      url: https://arxiv.org/abs/1006.0887v2
      summary: Projection inflates clustering
    - title: tnet structural holes in two-mode networks
      url: https://toreopsahl.com/tnet/two-mode-networks/structural-holes/
      summary: Structural holes measures on projections are inflated
    - title: Two-mode versus one-mode clustering on a co-authorship network
      url: https://arxiv.org/pdf/2102.03270
      summary: Two-mode coefficient 0.28 versus 0.36 one-mode
    - title: Borgatti and Everett (1997) Network analysis of 2-mode data
      url: https://www.bebr.ufl.edu/sites/default/files/Borgatti%20and%20Everett%20-%201997%20-%20Network%20analysis%20of%202-mode%20data.pdf
      summary: Two-mode methods; Davis Southern Women 18 by 14
    - title: SOCIOL208 two-mode course notes
      url: https://olizardo.github.io/SOCIOL208/tm-basic.html
      summary: Incidence matrices, two-mode density, bipartite analysis in igraph
    - title: Pajek help
      url: https://www.artsrn.ualberta.ca/ccewiki/index.php/Pajek_help
      summary: Two-mode .net header declaring the first mode size
    - title: Fowler (2006) Connecting the Congress
      url: https://www.cambridge.org/core/journals/political-analysis/article/connecting-the-congress-a-study-of-cosponsorship-networks/B42907E13C3D1F12BBC7618C8E0EECED
      summary: 280,000 bills; shared-bill weights turned into a connectedness score
    - title: R-help thread on Pajek 2-mode to 1-mode
      url: https://stat.ethz.ch/pipermail/r-help/2008-May/161805.html
      summary: Pajek projection menu path
