starting_state:
    data_type: entity search results from a graph database or API (IP addresses, emails, device ids, accounts) with typed relationships
    node_count: 1-300 initial, growing by up to about 100 per expand
    edge_density: sparse with occasional supernodes
    user_expertise: expert developer building for intermediate analysts
goal: >-
    **Intent**: Build the core screen of an investigation product: seed a graph from a search, let the analyst expand
    neighbors, merge and reduce what comes back, annotate it, save the workspace and export a report.


    **Mental Model**: "Pull a thread." The canvas starts tiny and grows one deliberate expand at a time; the store
    behind it holds billions of records the analyst never sees at once.


    **Task Phases**:

    1. **Seed** - The analyst searches; the backend returns the matches and their first-degree neighbors

    2. **Cap the payload** - About 300 initial nodes and 100 neighbors per expand (Neo4j Browser defaults); 10,000
    elements per query (Bloom); a supernode threshold above which the analyst must refine the expand (Linkurious)

    3. **Merge and lay out incrementally** - Merge by id, keep existing positions, place only new nodes

    4. **Enrich and encode** - Type styles, risk badges, annotations, a time bar

    5. **Reduce** - Group duplicates into combos, filter, delete

    6. **Save and share** - Serialize the workspace for a colleague or a later session

    7. **Export** - PDF reports, PNG and SVG images, CSV or Excel tables, often rendered on the server

    8. **Analytics later** - Path finding and centrality follow the expand-and-annotate loop, not precede it


    **Decision Points**:

    - How many neighbors to return before asking the analyst to refine?

    - Which entities are duplicates and should be grouped?

    - What belongs in a saved workspace (positions, annotations, filters, time range)?


    **Information Needs**:

    - Count of hidden neighbors before an expand, and a supernode warning

    - Which nodes are new after an expand

    - Full properties of a clicked entity and its source feed


    **Pain Points**:

    - Raising the neighbor cap to 1,000 makes the UI unresponsive

    - Expands that duplicate nodes or reshuffle the whole layout

    - Reports that must be rebuilt by hand outside the product

    - Admissible-evidence exports in policing need reproducible, documented views


    **Data Flow**:

    - Input: Search terms; backend neighbor queries returning entities and relationships

    - Transformations: Capped expand, merge by id, incremental layout, grouping, filtering, annotation

    - Output: Saved workspace, PDF report, images, CSV or Excel tables
success_criteria:
    - metric: Expand responsiveness
      target: An expand of 100 neighbors is placed without moving existing nodes and without a visible freeze
    - metric: Supernode safety
      target: An expand above the threshold is refused with a count, never silently truncated or frozen
    - metric: Workspace round trip
      target: A saved workspace reloads with identical positions, groups and annotations
