id: W282
name: Building a Live Service Map
category: analysis
validated: false
personas:
    - observability-service-map-engineer
requires_capabilities:
    - graph-rendering
    - layout-hierarchical
    - layout-force-directed
    - visual-encoding-nodes
    - visual-encoding-edges
    - temporal-navigation
    - details-on-demand
    - tooltip-display
    - neighborhood-expansion
    - centrality-degree
    - legend-display
