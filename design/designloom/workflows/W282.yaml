      url: https://grafana.com/docs/grafana/latest/panels-visualizations/visualizations/node-graph/
      summary: Nodes and edges frame contract, arc fields summing to 1, fixedX and fixedY, 200-node default, layered slow above 500
    - title: Grafana Tempo - Service graph
      url: https://grafana.com/docs/grafana/latest/datasources/tempo/service-graph/
      summary: Service-graph metrics generated from spans
    - title: Kiali - Topology
      url: https://v1-82.kiali.io/docs/features/topology
      summary: Animated dots and diamonds, health colors, pause and replay, node ranking
    - title: Kiali - Console customization
      url: https://v1-52.kiali.io/docs/configuration/console-customization
      summary: Refresh intervals from pause to 15 minutes; 15 seconds default
    - title: Kiali graph config (Go package)
      url: https://pkg.go.dev/github.com/kiali/kiali/graph/config/cytoscape
      summary: Edge response time, throughput, mutual TLS percentage and protocol traffic; node health and compound parents
