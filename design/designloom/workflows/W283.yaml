id: W283
name: Embedding a 3D Graph
category: exploration
validated: false
personas:
    - 3d-graph-embedder
requires_capabilities:
    - graph-rendering
    - large-graph-rendering
    - layout-force-directed
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - zoom-pan
    - hover-highlight
    - node-selection
    - edge-flow-animation
    - xr-graph-interaction
    - framework-neutral-embedding
    - layout-lifecycle-events
    - stable-id-data-binding
    - manual-layout-preservation
    - export-image
    - element-accessibility
    - render-context-lifecycle
suggested_components:
    - graph-canvas
    - zoom-controls
    - node-tooltip
    - layout-panel
starting_state:
    data_type: >-
        JSON nodes and links built from notes and their links (an Obsidian vault), from a knowledge graph an LLM or RAG
        pipeline extracted, from a Neo4j query, or from a code base's file imports
    node_count: 200-10000 typical (one Neo4j demo loads 5,000 relationships; one report has 4,000 nodes and 80,000
        links); requests reach 200,000
    edge_density: sparse to moderate
    user_expertise: intermediate developer
goal: >-
    **Intent**: Put an explorable 3D graph into a web app, a developer tool or a host plugin (an Obsidian plugin), so
    a reader can fly around a knowledge base, an AI memory, a database query result or a code base, click into a
    node, and see what it connects to. Sometimes also a VR or AR version.


    **What gets built** (GitHub, 2026): personal knowledge-base and notes-vault viewers (obsidian-3d-graph,
    TagsRoutes, obsidian-galaxy); 3D views of knowledge graphs that LLM and RAG tools extract (graphaura, The-Brain,
    inferagraph); Neo4j query explorers (neo4j-3d-force-graph); code-dependency views opened from a command-line tool
    (dep-tree). The readers are the developer, their users, or a hackathon or demo audience. Products with a paying
    audience that use the same author's libraries (SigNoz's service map, cognee's graph view) chose the 2D package.


    **Mental Model**: "Drop in a 3D scene, wire it to my app's state, and decorate it." The library owns the
    simulation and the camera; the developer copies the README examples for interaction and reaches into the
    three.js scene for anything else.


    **Task Phases**:

    1. **Install and mount** - Script tag from a CDN, or npm. In Next.js or Gatsby, wrap the graph in a client-only
    component loaded with a dynamic import with ssr false, and move the ref into that wrapper so methods such as
    cameraPosition still work

    2. **Bind data** - Pass nodes and links (often mapped from a database or LLM output). Color by a group field.
    Size by a score, such as PageRank

    3. **First frame** - Optionally lay out before the first frame (warmupTicks, cooldownTicks 0). When the engine
    stops, call zoomToFit to frame the settled graph

    4. **Interaction loop** - On hover, highlight the node, its links and its neighbors, and show a label or HTML
    tooltip. On click, select the node, fly the camera to it and open a side panel in the app. Double-click empty
    space or press a button to frame the whole graph again. Keep a dragged node fixed where it was dropped

    5. **Live changes** - Add or remove nodes as the app's data changes, keep existing positions, and send a
    particle along a link when something happens (emitParticle) or show particles only on highlighted links

    6. **Customize** - Replace spheres with text sprites or custom meshes, add bloom, tune link distance and charge
    per node type, switch to DAG mode for trees

    7. **Tune for size** - Turn off pointer interaction, pause the animation for a static view, lower node
    resolution, hide labels at distance

    8. **Capture and share** - Save a picture through the renderer's canvas (needs the right moment or blank
    output), record the screen, or share a link to the hosted page; no camera state in the URL

    9. **VR (sometimes)** - Switch to the A-Frame package and handle controllers by hand

    10. **Unmount** - Remove the graph when the route changes without leaking GPU memory


    **Decision Points**:

    - 2D or 3D? (well-funded products picked 2D; 3D is chosen for "explore my vault or my AI's memory")

    - Lay out before the first frame, or let readers watch it build?

    - Labels on every node, on hover only, or by distance?

    - When to freeze the simulation, and whether dragged nodes stay put

    - Is a headset mode worth the extra work?


    **Information Needs**:

    - When the layout has settled, so the view can be framed and a spinner hidden

    - Which node is hovered or clicked, with its neighbors, as plain data for the app's own panels

    - Frame rate at the target size with labels on, and whether the render loop idles when nothing changes

    - Whether the browser can render at all (WebGL available, context not lost)


    **Pain Points**:

    - Server-side rendering throws window or self is not defined; the dynamic-import fix breaks ref methods
    (react-force-graph issues 155, 324, 357, 475)

    - zoomToFit from onEngineStop fires 10+ seconds after the graph shows; developers poll with setTimeout (issues
    231, 593; dep-tree)

    - The click-to-focus camera arithmetic is copied into every app (dep-tree, graphaura)

    - Text sprites on 10,000+ nodes are very slow; the animation loop never stops on graphs over 5,000 nodes and gets
    slower each time data is replaced (3d-force-graph issues 515, 479)

    - Screenshots come out blank or black; the canvas is not exposed (3d-force-graph issues 25, 68, 189, 564;
    react-force-graph 255)

    - WebGL context loss on big graphs with custom meshes, and resource leaks on unmount (issues 595, 732)

    - VR controller hit-testing and camera access undocumented; any React state change re-renders the VR graph

    - No keyboard access and no text alternative; no accessibility issue has been filed against either library


    **Data Flow**:

    - Input: Nodes and links JSON from the app's own data

    - Transformations: 3D force or DAG layout, custom meshes and sprites, particles on links, highlight sets
    computed in the app

    - Output: An embedded 3D view the app's panels react to; screenshots by hand; no saved camera or shared view
success_criteria:
    - metric: Time to a framed first view
      target: The graph appears already laid out and framed, with no consumer timer or polling, within the settle
          time of the layout
    - metric: Focus and highlight without copied code
      target: Click-to-focus and hover-highlight of neighbors work from options and events, with no camera
          arithmetic or neighbor lookup written by the consumer
    - metric: SSR-safe embed
      target: The element can be imported in a Next.js App Router page with no dynamic import, and its methods work
    - metric: Live update
      target: Adding nodes keeps existing positions and frame rate does not degrade after 10 data replacements
    - metric: Capture
      target: One call returns a non-blank image of the current 3D view at any time
    - metric: Idle cost
      target: Zero rendering work when the simulation has settled and the camera is still
    - metric: Labeled scale
      target: Readable labels at 10,000 nodes at interactive frame rates
    - metric: Fallback
      target: When WebGL and WebGPU are unavailable, the page receives an error code and can show its own fallback
    - metric: XR input
      target: A controller can select a node in VR with no custom hit-testing code
sources:
