      summary: 31 README examples including click to focus, highlight, fix after drag, dynamic data, emit particles on
          demand, fit to canvas, pause; onEngineStop, zoomToFit, emitParticle; issues 479, 491, 515
    - title: react-force-graph
      url: https://github.com/vasturiano/react-force-graph
      summary: 2D, 3D, VR and AR packages; SSR issues 155, 324, 357, 475; zoomToFit issues 231, 427, 593; VR issues
          243, 285, 581
    - title: 3d-force-graph dependents
      url: https://github.com/vasturiano/3d-force-graph/network/dependents
      summary: About 4,741 dependent repositories and 92 packages (2026-11-25)
    - title: dep-tree web view
      url: https://github.com/gabotechs/dep-tree
      summary: Code-dependency 3D view (react-force-graph-3d); copies the click-to-focus arithmetic and frames with
          setTimeout(zoomToFit, 1000)
    - title: graphaura
      url: https://github.com/liamellison02/graphaura
      summary: Next.js 15 AI knowledge graph with react-force-graph-3d; click flies the camera to the node
    - title: neo4j-3d-force-graph
      url: https://github.com/jexp/neo4j-3d-force-graph
      summary: Neo4j queries rendered in 3D; 5,000 relationships, PageRank sizes, Louvain colors, particles
    - title: 3d-force-graph screenshot issues
      url: https://github.com/vasturiano/3d-force-graph/issues/564
      summary: Black or blank images from canvas.toDataURL; also issues 25, 68 and 189
    - title: obsidian-3d-graph
      url: https://github.com/Apoo711/obsidian-3d-graph
      summary: 3D notes graph as an Obsidian plugin
