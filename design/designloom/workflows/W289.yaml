    - title: AMatReader (F1000Research)
      url: https://f1000research.com/articles/7-823/v2
      summary: Preview that predicts import settings
    - title: dot-app (F1000Research)
      url: https://f1000research.com/articles/5-2543/v2
      summary: Graphviz import and export app
