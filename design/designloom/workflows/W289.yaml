      summary: App project template
    - title: Cytoscape API - InputStreamTaskFactory
      url: https://cytoscape.org/javadoc/3.10.0/org/cytoscape/io/read/InputStreamTaskFactory.html
      summary: Reader interface registered from the activator
    - title: cytoscape-discuss - app stuck in Installed
      url: https://groups.google.com/g/cytoscape-discuss/c/xYU8gO-hRHE
      summary: Dependency problems leave bundles Installed rather than Resolved
    - title: RCy3 - Importing data
