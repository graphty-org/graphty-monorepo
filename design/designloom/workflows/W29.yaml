starting_state:
    data_type: either a whole network, or three linked survey tables (egos, alters, alter-alter ties) for many respondents
    node_count: 5-50 alters per ego, hundreds to thousands of egos
    edge_density: medium
    user_expertise: intermediate
goal: >-
    **Intent**: Produce one row of ego-level network measures per respondent (size, density, composition, diversity,
    brokerage) for a regression, plus a few illustrative egograms -- either by extracting ego networks from a whole
    network or by importing hundreds of separate personal networks from a survey.


    **Mental Model**: "Many small worlds, one table." Each respondent's network is its own small graph; the analysis
    output is a spreadsheet with one row per ego.


    **Task Phases**:

    **Path A, from a whole network:**

    1. **Symmetrize** (estimate: 2 min) - Some helpers reject directed graphs.

    2. **Extract ego networks** (estimate: 2 min) - UCINET Data > Egonet, statnet ego.extract(), igraph make_ego_graph().

    3. **Compute brokerage measures** (estimate: 5 min) - Size, density among alters, effective size (n - 2t/n),
    efficiency, constraint, hierarchy. In the Florentine families the Medici have degree 6, effective size about 5.67
    and the lowest constraint (about 0.24).

    **Path B, from a personal network survey:**

    1. **Design** (outside the tool) - Name generators, name interpreters (alter attributes) and an alter-alter question
    in Qualtrics with egor templates, Network Canvas (participants draw alter-alter ties on a sociogram), EgoNet or
    VennMaker.

    2. **Import** (estimate: 15 min) - One file or three files (egos, alters, alter-alter ties) into egor
    (onefile_to_egor, threefiles_to_egor, read_egoweb).

    3. **Compute per-ego measures** (estimate: 10 min) - ego_density, composition (proportion kin), diversity entropy,
    EI index, ply.

    4. **Visualize** (estimate: 20 min) - Egograms with alters grouped by attribute; vis_clustered_graphs; Network
    Canvas stores participant-drawn positions normalized to 0-1.

    5. **Hand off** (estimate: 5 min) - Export one row per ego to a regression.


    **Decision Points**:

    - One-step neighborhood or larger; include ties to ego in density?

    - Which alter attribute defines composition and the EI index?

    - Which respondents to show as illustrative egograms (typical, extreme)?

    - Keep or replace participant-drawn positions?


    **Information Needs**:

    - Per-ego table of size, density, effective size, efficiency, constraint, hierarchy, composition, EI, diversity

    - Distribution of each measure across egos

    - Many egograms side by side, sortable by a measure, with shared styling

    - Count of egos with missing alter-alter data


    **Pain Points**:

    - Whole-network tools assume one big graph and do not handle hundreds of small ones

    - No good way to view 500 egograms side by side

    - Alter-alter questions grow with the square of the alter count

    - Recall bias (2.7 of 10 allowed alters named on average in one web survey)


    **Data Flow**:

    - Input: Whole network; or egos, alters and alter-alter tables (CSV, Network Canvas CSV or GraphML, EgoWeb export)

    - Transformations: Symmetrize, ego extraction, per-ego measures, grouping of alters by attribute

    - Output: One-row-per-ego measures table, egogram figures
success_criteria:
    - metric: Ego table completeness
      target: One row per ego with all chosen measures exported to CSV
    - metric: Small-multiples review
      target: User can browse egograms of many respondents in one view sorted by a measure
