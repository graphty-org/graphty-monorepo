      summary: Effective size, efficiency, constraint and hierarchy functions
    - title: egor package vignette
      url: https://cran.r-project.org/web/packages/egor/vignettes/using_egor.html
      summary: Three-table data model, import functions, density, composition, diversity, EI and visualization
    - title: egor Qualtrics templates
      url: https://tilltnet.github.io/egor/articles/qualtrics.html
      summary: Survey design for name generators and alter-alter questions
    - title: Network Canvas roster and sociogram
      url: https://github.com/complexdatacollective/Interviewer/wiki/Name-Generator:-Roster-List
      summary: Participant-drawn alter-alter ties
    - title: Network Canvas data export
      url: https://documentation-rlpthbxim-network-canvas-f4790d84.vercel.app/en/desktop/key-concepts/data-export
      summary: CSV and GraphML export with positions normalized to 0-1
    - title: Hanneman and Riddle, chapter 6
      url: https://faculty.ucr.edu/~hanneman/nettext/C6_Working_with_data.html
      summary: UCINET Data > Egonet
    - title: Rice et al. (2014) recall bias
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4184035
      summary: 2.7 of 10 allowed alters named on average
