      url: https://manual.cytoscape.org/en/stable/Creating_Networks.html
      summary: Network from File column roles, attribute types, list delimiter, one sheet at a time
    - title: Cytoscape User Manual - Node and Edge Column Data
      url: https://manual.cytoscape.org/en/3.10.3/_sources/Node_and_Edge_Column_Data.md.txt
      summary: Table import destinations, key column for network, identifier mapping with force single
    - title: Cytoscape tutorial - Importing Network From Table
      url: https://cytoscape.org/cytoscape-tutorials/protocols/importing-network-from-table/
      summary: Bait-prey example where a prey seen with several baits keeps the last value imported
    - title: Cytoscape helpdesk - only column headers imported
      url: https://groups.google.com/g/cytoscape-helpdesk/c/O0Qpdb0zuLc
      summary: shared name is a string; numeric key must be switched to string; first column is the default key
    - title: Cytoscape helpdesk - half the values imported
      url: https://groups.google.com/g/cytoscape-helpdesk/c/tB4mcg8VHvA
      summary: User report of a partial join with no explanation
    - title: Cytoscape - Quick Tour
      url: https://manual.cytoscape.org/en/latest/Quick_Tour_of_Cytoscape.html
      summary: Edit menu Remove Duplicated Edges and Remove Self-Loops
    - title: Biostars - collapse reciprocal edges in a directed network
      url: https://www.biostars.org/p/9524627
      summary: Users asking how to merge A-to-B and B-to-A while staying directed
