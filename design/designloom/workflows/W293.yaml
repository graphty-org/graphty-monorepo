id: W293
name: Event Table to Weighted Network (Calls, Emails, Transactions, Connections)
category: onboarding
validated: false
personas:
    - event-log-network-builder
    - graph-data-wrangler
requires_capabilities:
    - data-import
    - data-validation
    - data-preview
    - node-merging
    - computed-attributes
    - basic-statistics
    - degree-analysis
    - visual-encoding-edges
    - event-table-to-graph
    - provenance-tracking
    - import-report
    - edge-merge-policy
