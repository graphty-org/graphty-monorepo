id: W298
name: Saved Import Mappings and the First Minutes After Loading
category: onboarding
validated: false
personas:
    - spreadsheet-first-network-builder
    - crime-intelligence-analyst
    - research-impact-librarian
requires_capabilities:
    - data-import
    - data-validation
    - basic-statistics
    - degree-analysis
    - component-analysis
    - statistics-panel
    - metric-histograms
    - layout-force-directed
    - filtering
    - saved-filters
    - saved-import-mappings
    - import-report
suggested_components:
    - data-import-dialog
    - column-mapper
    - statistics-panel
    - histogram
    - ranked-node-table
    - filter-panel
    - layout-panel
    - graph-canvas
starting_state:
    data_type: A new file in a layout seen before (next carrier return, next month's export), or any freshly loaded graph
    node_count: 19-100,000
    edge_density: any
    user_expertise: novice to expert
goal: >-
    **Intent**: Two linked habits. First, re-apply a saved import mapping to a new file of the same layout instead of
    rebuilding it, and be warned when the file no longer fits. Second, in the minutes after any load, read counts and
    global descriptors, look at hubs, run a layout and reduce clutter, because these checks catch the import errors that
    would otherwise corrupt every later result.


    **Mental Model**: "Same recipe, new ingredients; then taste before serving." The mapping is a reusable recipe; the
    first look is a sanity check against what the user expected.


    **Task Phases** (no source gives step timings):

    1. **Pick the saved mapping** - i2 import specifications (.ximp or .oimp, not convertible between each other);
    Maltego table-import mappings with connectivity (meshed, sequential, tree, manual) and save mapping on by default;
    Kumu and Polinode templates; Neo4j Data Importer models. No source found for Gephi or Cytoscape GUI users saving a
    column mapping; scripted users reuse code

    2. **Check fit** - Columns renamed, added or missing in the new file

    3. **Read the counts** - Node and edge counts before confirming (the Programming Historian sanity check is 119 nodes
    and 174 edges)

    4. **Global descriptors** - Average degree, density, connectedness, diameter only on the largest component
    (NetworkX raises an error on a disconnected graph), transitivity; Cytoscape Analyze Network asks directed or
    undirected (default undirected); NodeXL separates unique edges, duplicate edges and self-loops

    5. **Look at hubs** - Sort the degree list

    6. **Run a layout** - ForceAtlas 2 until balanced, prevent overlap, size nodes by degree

    7. **Reduce clutter** - Keep the giant component, or filter degree at 2 or more


    **Decision Points**:

    - Does the saved mapping still fit this file?

    - Are counts and component structure what the user expected?

    - Are top hubs real, or artifacts (a mailing list, an Unknown placeholder, a consortium paper)?

    - Proceed, re-import with different settings, or clean the source?


    **Information Needs**:

    - Mapping fit report: columns matched, missing and new

    - Nodes, edges, density, average degree, components with giant-component share, isolates, self-loops, duplicate
    edges, reciprocal pairs

    - Diameter computed on the giant component and labeled as such

    - Degree list with the top entries visible

    - What each oddity usually means: unexpected components point to id mismatch, isolates to edges that did not attach,
    doubled edges to an undirected file loaded as directed, self-loops to alias problems


    **Pain Points**:

    - Each new source layout needs a new or edited mapping

    - Mapping files that cannot be converted or shared between tool editions

    - Diameter or path statistics fail or mislead on disconnected graphs

    - Artifact hubs top the degree list and are mistaken for findings

    - The first view is a hairball until a layout and a filter run


    **Data Flow**:

    - Input: New file plus a saved mapping; or a freshly loaded graph

    - Transformations: Mapping application with fit check; descriptor computation; layout; giant-component or degree
    filter

    - Output: Loaded graph, first-look descriptors, and a go, fix or re-import decision
success_criteria:
    - metric: Mapping reuse
      target: A file in a known layout loads with a saved mapping in one step, with a warning when columns changed
    - metric: First-look completeness
      target: Counts, components, isolates, self-loops and duplicate edges are visible without running separate tools
    - metric: Error detection
      target: The user can tie an oddity in the first look to a likely import cause
sources:
    - title: i2 Analyst's Notebook 9.4.1 - Import specifications
      url: https://docs.i2group.com/anb/9.4.1/import_specifications.html
      summary: Saved .ximp and .oimp specifications that cannot convert between each other
    - title: Maltego - Import graph from table
      url: https://docs.maltego.com/support/solutions/articles/15000010797-import-graph-from-table
      summary: Connectivity patterns, column-to-entity mapping, link sampling and merging; save mapping on by default
    - title: Polinode - Networks guide
      url: https://docs.polinode.com/guide/networks.html
      summary: Downloadable templates fix the sheet shape
    - title: Neo4j GraphAcademy - Importing relational to graph, creating relationships
      url: https://graphacademy.neo4j.com/courses/importing-relational-to-graph/3-importing/4-creating-relationships
      summary: Saved, reusable Data Importer model; data does not leave the computer except to be imported
    - title: Gephi Quick Start
      url: http://gephi.org/quickstart/
      summary: ForceAtlas 2, prevent overlap, size by degree, degree range filter
    - title: Programming Historian - Exploring and analyzing network data with Python (Ladd et al.)
      url: https://programminghistorian.org/en/lessons/exploring-and-analyzing-network-data-with-python
      summary: Sanity check 119 nodes and 174 edges; density, connectedness, diameter on the largest component, transitivity
    - title: Cytoscape - Network Analyzer
      url: https://manual.cytoscape.org/en/3.10.3/_sources/Network_Analyzer.md.txt
      summary: Directed or undirected prompt; components, diameter, radius, path length, clustering
    - title: NodeXL - a guide to network insights
      url: https://dspace.stir.ac.uk/retrieve/f1292af1-5cdb-400b-820a-bccae8f82e1f/NodeXL%20-%20a%20guide%20to%20network%20insights%20-%20Author%20Version.pdf
      summary: Overall metrics separate unique edges, duplicate edges and self-loops
    - title: Duke University Library - Gephi visualizing
      url: https://guides.library.duke.edu/gephi/visualizing
      summary: Giant component filter to reduce clutter
