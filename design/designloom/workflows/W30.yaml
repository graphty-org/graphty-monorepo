goal: >-
    **Intent**: Test hypotheses about ties with permutation tests and statistical network models: whether two
    relations or a dyadic attribute predict ties (QAP, MRQAP), which local processes and attribute effects generate the
    network (ERGM), and whether friends become alike or alike people become friends across waves (SAOM in RSiena). The
    models run in R; the visual tool prepares inputs, explores before modeling and displays results.


    **Mental Model**: "A regression table where the observations are dyads." Estimates come with permutation p-values or
    standard errors, and the model is only trusted if simulated networks look like the observed one.


    **Task Phases**:

    **QAP and MRQAP:**

    1. **Build dyadic predictors** - Same gender, absolute grade difference (UCINET Data >
    Attribute; ideanet qap_setup()).

    2. **QAP correlation** - qaptest(nets, gcor, g1=1, g2=2), 1,000 permutations by default.

    3. **MRQAP** - UCINET Tools > Testing Hypotheses > Dyadic (QAP) > MR-QAP > Double-Dekker
    Semi-Partialling, or netlm()/netlogit() with nullhyp = "qap"; DSP is recommended for collinear predictors.

    4. **Read results** - Estimates with permutation p-values and a null-distribution histogram; CUG
    tests for "is this density unusual for a random graph of this size".

    **ERGM:**

    1. **Explore** - mixingmatrix() and summary(net ~ edges + triangle) to catch empty cells.

    2. **Fit** - ergm(net ~ edges + nodefactor("Grade") + nodematch("Grade",
    diff=T) + gwesp(...)); dyad-dependent terms switch to MCMC; empty mixing cells give -Inf.

    3. **Diagnose** - mcmc.diagnostics() trace plots.

    4. **Goodness of fit** - plot(gof(fit)): observed degree, shared partner and geodesic distributions
    against simulations.

    **SAOM (RSiena):**

    1. **Stack waves** - sienaDependent() for the network, coCovar() and varCovar() for covariates,
    sienaDependent(drink, type = "behavior") for behavior.

    2. **Describe change** - sienaDataCreate(), print01Report() for wave-to-wave change.

    3. **Specify effects** - getEffects(), includeEffects(myeff, transTrip, cycle3), avAlt for
    influence.

    4. **Estimate until converged** (repeated) - siena07(), re-run with prevAns until the overall
    maximum convergence ratio is below 0.25.

    5. **Test and check fit** - Tabulate, sienaGOF.


    **Decision Points**:

    - QAP or MRQAP, and which permutation method for collinear predictors?

    - Which ERGM terms; is the model degenerate?

    - Which SAOM selection and influence effects; has it converged?

    - Is goodness of fit acceptable for the paper?


    **Information Needs**:

    - Mixing matrix per attribute, with empty cells flagged

    - Dyadic predictor matrices built from node attributes

    - Wave-to-wave change counts (ties created, dissolved, kept)

    - Null-distribution histograms and GOF plots alongside the sociogram

    - Sociogram colored by the homophily attribute; one sociogram per wave in a fixed layout colored by behavior


    **Pain Points**:

    - Valued data read as binary unless the user says otherwise

    - Long SIENA re-runs until convergence

    - Empty mixing cells that make ERGM estimates infinite, found only after fitting

    - Moving data between the visual tool and R in different formats, and losing missing-dyad marks on the way


    **Data Flow**:

    - Input: Cleaned networks and attributes from W26 and W27, waves for SAOM

    - Transformations: Dyadic predictor construction, mixing matrices, permutation tests; model fitting in R

    - Output: Regression-style tables, null-distribution and GOF plots, sociograms per wave, edge lists with NA dyads and
    attribute tables for R
success_criteria:
    - metric: Pre-model exploration
      target: User sees a mixing matrix with empty cells flagged before fitting
    - metric: R hand-off integrity
      target: Exported edge lists keep missing dyads as NA and attributes in matching ID order
