id: W3024
name: Search-First Exploration of a Stored Graph Too Large to Draw
category: exploration
validated: false
personas:
    - aml-investigator
    - investigative-journalist
    - graph-database-developer
requires_capabilities:
    - schema-meta-graph
    - live-data-source
    - search
    - hover-highlight
    - details-on-demand
    - degree-analysis
    - neighborhood-expansion
    - supernode-safeguards
    - truncation-reporting
    - reveal-relationships
    - filtering
    - view-bookmarks
suggested_components:
    - search-input
    - graph-canvas
    - node-tooltip
    - node-details-panel
    - badge
    - context-menu
    - filter-panel
    - bookmark-panel
starting_state:
    data_type: empty canvas over a live graph database or a file too large to draw in full
    node_count: "stored: any size; on screen: tens to a few thousand elements, built up by the user"
    edge_density: any
    user_expertise: any
goal: >-
    **Intent**: Find a known entity in a stored graph, see its context and grow a small working subgraph around it,
    without ever drawing the whole graph. This is the generic sequence; W142 (Neo4j Bloom search phrases and saved
    scenes) and W143 (Linkurious search and expand with supernode safeguards) give the tool-specific detail, and W324
    is the local-graph start for personal note vaults.


    **Mental Model**: "Search, show context, expand on demand" (van Ham and Perer, InfoVis 2009): for large graphs an
    overview is often "not relevant or practical", so the user starts from a search and expands, shown on over 3
    million legal citations. Apolo (CHI 2011) likewise supports bottom-up sensemaking "starting small" from seed
    nodes. Every graph database front end reviewed (Neo4j Bloom, Linkurious, AWS Graph Explorer, BigQuery and Spanner
    Studio) starts from a search box or query, and Bloom calls itself a "search-first environment". Investigators start
    the same way: an alerted entity (W06 step 1), one selector (W88) or a name in a leak database (W89).


    **Task Phases**:

    1. **Orient on the schema** (optional, mostly developers) - A small meta-graph of node and relationship types
    stands in for the overview; knowledge graph builders check "the graph is connected as expected" but say "I don't
    want to have to see the full graph"

    2. **Search** - Name, identifier or a prepared parameterized search; results are added to an empty canvas

    3. **Show context** - Hover and details for the found entity; a badge shows how many relationships are not drawn

    4. **Expand on demand** - Expand by relationship type, direction, neighbor category and maximum count; hubs above a
    threshold ask before expanding; reveal relationships among nodes already drawn

    5. **Prune** - Dismiss nodes, dismiss isolated nodes, filter; the canvas only ever holds what the user built

    6. **Save** - A scene or bookmark that records what was searched, expanded and filtered


    **Decision Points**:

    - Which search term or prepared search finds the entity?

    - Is this node a hub worth expanding, and has a result cap silently cut the answer?

    - When is the working subgraph complete enough to hand to analysis or a case file?


    **Information Needs**:

    - Count of results returned versus drawn

    - Hidden-relationship count per node before expanding

    - Which relationship types and neighbor categories an expansion would add


    **Pain Points**:

    - Caps cut results silently: an Aura Explore user saw 38 of 236 nodes and assumed data was missing

    - Expanding a hub floods the view


    **Data Flow**:

    - Input: A live database or large file and a search term

    - Transformations: Search, expand, reveal, dismiss, filter

    - Output: A saved working subgraph and the record of how it was built
success_criteria:
    - metric: Entity found
      target: The searched entity is on the canvas from a cold start
    - metric: No silent truncation
      target: Every capped result says how many were returned versus drawn
    - metric: Hub control
      target: No hub above the threshold expands without the user agreeing
sources:
    - title: van Ham and Perer, Search, Show Context, Expand on Demand (InfoVis 2009)
      url: https://dig.cmu.edu/publications/2009-doigraphs.html
      summary: For large graphs an overview is often not relevant or practical; start from search and expand, shown on over 3 million legal citations
    - title: Apolo (CHI 2011)
      url: https://poloclub.github.io/polochau/papers/11-chi-apolo.pdf
      summary: Bottom-up sensemaking starting small from seed nodes
    - title: Bloom search bar
      url: https://neo4j.com/docs/bloom-user-guide/current/bloom-visual-tour/search-bar/
      summary: Bloom describes itself as a search-first environment
    - title: Li et al., knowledge graph practitioners interview study
      url: https://arxiv.org/html/2304.01311v4
      summary: Builders verify the graph is connected as expected but do not want to see the full graph
    - title: Aura Explore feedback - I can't see all my nodes
      url: https://aura.feedback.neo4j.com/explore/p/i-cant-see-all-my-nodes
      summary: Silent cap; 38 of 236 nodes shown
