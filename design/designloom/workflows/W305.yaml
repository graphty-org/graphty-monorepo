id: W305
name: Filter and Play a Case with a Time Bar
category: exploration
validated: false
personas:
    - intelligence-analyst
requires_capabilities:
    - data-import
    - data-validation
    - temporal-navigation
    - temporal-analysis
    - filtering
    - node-selection
    - details-on-demand
    - metric-histograms
    - visual-encoding-edges
    - legend-display
    - export-image
    - view-bookmarks
    - temporal-data-model-import
    - event-window-aggregation
    - stable-temporal-layout
    - periodicity-views
    - map-time-sync
suggested_components:
    - data-import-dialog
    - column-mapper
    - temporal-controls
    - histogram
    - range-slider
