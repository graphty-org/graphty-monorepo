      summary: Span, years per slice, g-index and top N selection
    - title: CiteSpace 101 - Interpret results
      url: https://sites.google.com/site/citespace101/first-example/4-3-interpret-results
      summary: Modularity, silhouette, tree rings, burst and betweenness markers, timeline view
    - title: Chen, Ibekwe-SanJuan and Hou 2010 (arXiv 1002.1985)
      url: https://arxiv.org/abs/1002.1985
      summary: Top 100 per slice over 13 slices merged into 655 references; synthesizing network snapshots
    - title: CiteSpace application study (arXiv 2411.19858)
      url: https://arxiv.org/pdf/2411.19858
      summary: Reported g-index k = 25 and slice settings in a recent application
    - title: TU Delft Library - Evolution of research
      url: https://tudelft.nl/library/research-analytics/case-2-evolution-of-research
      summary: VOSviewer overlay by average publication year as the simple alternative
    - title: bibliometrix thematicEvolution
      url: https://rdrr.io/cran/bibliometrix/man/thematicEvolution.html
      summary: Cutting years and a Sankey diagram of themes across periods
