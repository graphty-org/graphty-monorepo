starting_state:
    data_type: cleaned network with attributes and computed scores
    node_count: 20-1500
    edge_density: sparse
    user_expertise: intermediate+
goal: >-
    **Intent**: Draw the one or two sociograms that go into the paper: nodes colored, shaped and sized by attributes,
    a stable layout reused across relations and waves, groups outlined, a legend, pseudonymized labels, and a file that
    meets the journal's artwork rules.


    **Mental Model**: "The figure is a claim the reader will check." Visual closeness should mean structural closeness,
    every pruning must be stated in the caption, and the same node must stay in the same place across panels.


    **Task Phases**:

    1. **Build and simplify** - From edge and node tables; drop loops (simplify with remove.loops).

    2. **Map attributes** - Color from a palette indexed by node type, size from a numeric attribute,
    labels off when crowded, smaller arrows and slight curves.

    3. **Add the legend** - Base igraph draws none and the palette is repeated by hand; ggraph gives
    legends for mapped aesthetics.

    4. **Fix the layout** - "The F-R layout is not deterministic"; compute the layout once and reuse it
    everywhere; rescale for tighter or looser versions of the same layout.

    5. **Reduce the hairball** - Keep edges above the mean weight, or split tie types into panels;
    state the cutoff, since thresholding valued ties is unwise unless there is a real threshold effect.

    6. **Panels with a shared layout** - One panel per relation or wave with the same coordinates
    ("make sure the nodes stay in the same place in both plots"); ggraph facet_edges repeats nodes in every panel.

    7. **Group hulls** - Outline communities or classes with filled hulls.

    8. **Nudge by hand** - Drag nodes (tkplot, sna::gplot interactive) and keep the returned
    coordinates for reuse; mostly for small networks.

    9. **Export to journal specs** - SVG, EPS or PDF so text stays editable; Elsevier wants EPS for
    vector art and TIFF for bitmaps at 1000 dpi line art, 300 dpi halftones, 500 dpi combination, widths 90, 140 or 190
    mm and standard fonts; APSR requires figures readable in grayscale. Final touch-ups often in Inkscape.


    **Decision Points**:

    - Which attribute drives color, and is the palette readable in grayscale?

    - Are isolates shown or omitted (and stated)?

    - Is any edge pruning needed, and at what stated cutoff?

    - One combined figure or panels per relation or wave?

    - Real labels, pseudonyms or none?


    **Information Needs**:

    - Live preview at final print width and in grayscale

    - Legend generated from the actual mappings

    - Saved layout coordinates that can be exported and re-imported

    - A caption note listing what was pruned or hidden


    **Pain Points**:

    - Non-deterministic layouts that change between runs

    - Legends drawn by hand that drift from the palette

    - NetDraw formatting that does not persist between sessions

    - Hairball figures; ForceAtlas2 images that lose context ("storyletting")

    - No standard step for size, resolution and format; figures rebuilt in a vector editor


    **Data Flow**:

    - Input: Network with attributes, community or class membership, optional saved coordinates

    - Transformations: Attribute mappings, fixed layout, edge pruning, panelling, hulls, manual nudges

    - Output: SVG, EPS, PDF or high-dpi TIFF at journal width with legend; layout coordinates file; caption note
success_criteria:
    - metric: Layout stability
      target: Same node positions across every panel and re-open of the figure
    - metric: Journal readiness
      target: Export at a chosen width in mm and dpi with a legend and grayscale-safe colors, no vector editor needed
