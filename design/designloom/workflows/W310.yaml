starting_state:
    data_type: node x time signal matrix (brain regions x volumes, stocks x days, grid cells x months), or a precomputed matrix stack (nodes x nodes x windows)
    node_count: 10-500 (fixed across windows)
    edge_density: dense before thresholding
    user_expertise: expert
goal: >-
    **Intent**: Build one weighted network per time window from per-node signals, measure each window, group windows
    into recurring states, and report how long the system stays in each state. Neuroscientists do this for dynamic
    functional connectivity; finance researchers for rolling correlation trees; climate scientists for climate
    networks. The network does not exist until the user builds it, so the window and threshold choices are the
    analysis.


    **Mental Model**: "A matrix movie." Each frame is a correlation matrix over the same nodes; the question is which
    frames look alike and how often the system switches between them.


    **Task Phases**:

    1. **Get node signals** (outside the graph tool) - Parcellate into regions or components and average per region;
    or assemble returns or anomalies per node

    2. **Choose the window** (the key judgment) - Length, step (often one sample), shape (rectangular or tapered); there
    is no agreed length, and published tests span 20 to 150 seconds

    3. **Connectivity per window** (in a toolbox) - Pearson correlation by default; alternatives give
    different results

    4. **Threshold or keep weights** - Keep the weighted matrix, or threshold to a fixed density so windows are
    comparable

    5. **Measure each window** - Graph metrics per window as time series

    6. **Cluster windows into states** - k-means on windowed matrices; per-state mean matrix, dwell time and
    transition counts

    7. **Test against nulls** - Phase-randomized surrogates (250 per subject in one study); short windows add
    spurious fluctuations


    **Decision Points**:

    - Window length, step and taper

    - Connectivity metric

    - Fixed threshold, fixed density, or full weights?

    - Number of states

    - Is the observed variability above the null?


    **Information Needs**:

    - Per-window matrix as a heatmap and as a thresholded node-link view on fixed positions

    - Density and edge-weight distribution per window

    - Metric time series aligned with the state sequence

    - Per-state mean matrix and dwell times


    **Pain Points**:

    - No standard window length; states recovered only when the window matches state duration

    - Results depend on metric and threshold

    - Everything is code in neuroimaging toolboxes; viewing a window means writing a plot

    - Node-link animation is rarely used; heatmaps and glass-brain plots dominate


    **Data Flow**:

    - Input: Precomputed matrix stack (nodes x nodes x windows) plus node labels and fixed coordinates; building the
    stack from signals stays in toolboxes

    - Transformations: Per-window threshold or density target, per-window metrics, window clustering into states

    - Output: Metric time series CSV, state sequence, per-state matrices and figures
success_criteria:
    - metric: Stack import
      target: A matrix stack loads as a snapshot series over one fixed node set without scripting
    - metric: Comparable windows
      target: User can threshold every window to the same density and see the result per window
    - metric: State readout
      target: Per-state mean networks and dwell times exported for the paper
sources:
    - title: Allen et al. 2014 - Tracking whole-brain connectivity dynamics in the resting state (PubMed 23146964)
      url: https://pubmed.ncbi.nlm.nih.gov/23146964/
      summary: Spatial ICA components, sliding-window correlation, k-means states with dwell times
    - title: Savva et al. 2019 - Assessment of dynamic functional connectivity (PMC6456784)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6456784/
      summary: Window sizes 20 to 150 s, ten connectivity metrics compared, 250 phase-randomized surrogates
    - title: Shakil et al. 2016 - Evaluation of sliding window correlation (PMC4889509)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4889509
      summary: Window length and offset dominate; poor per-state correlation estimates in simulation
    - title: Liuzzi et al. 2019 - Optimizing experimental design for MEG resting state functional connectivity (PMC6688728)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6688728/
      summary: MEG connectivity metrics (amplitude envelope correlation, phase locking); fixed windows miss brief states
    - title: pyunicorn climate networks tutorial
      url: https://www.pik-potsdam.de/~donges/pyunicorn/tutorials/ClimateNetworks.html
      summary: Climate networks thresholded by value or by link density
    - title: Onnela et al. 2003 - Dynamic asset trees (cond-mat/0302546)
      url: https://arxiv.org/abs/cond-mat/0302546
      summary: Minimum spanning tree per rolling window of stock returns; window width trades noise for smoothing
