id: W3103
name: Metabolite Concentration Table to a DSPC Partial Correlation Network
category: analysis
validated: false
personas:
    - metabolomics-network-analyst
requires_capabilities:
    - data-import
    - data-validation
    - identifier-mapping
    - partial-correlation-network
    - interactive-threshold
    - signed-edges
    - component-browser
    - centrality-degree
    - gene-set-enrichment
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - details-on-demand
    - analysis-provenance
    - export-image
    - data-export
suggested_components:
    - data-import-dialog
    - data-preview-table
    - range-slider
    - network-list-panel
