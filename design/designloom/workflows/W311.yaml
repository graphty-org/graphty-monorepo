starting_state:
    data_type: relocation table (animal id, date-time, projected x, y) at a fixed fix rate, or RFID / proximity-logger contacts
    node_count: 10-300 animals
    edge_density: medium to dense within a period
    user_expertise: advanced
goal: >-
    **Intent**: Turn where animals were into who was with whom, one network per season or year, and compare those
    networks against randomized movement to see whether sociality changed. The thresholds decide the network, so the
    researcher needs to see the map and the network for the same window.


    **Mental Model**: "Same place, same time." Two animals are associated when their fixes fall in the same time group
    and within a distance; the network for a period is how often each pair met.


    **Task Phases**:

    1. **Load relocations** (5 min) - Table with id, date-time and projected coordinates; add a season or year column

    2. **Group in time** (2 min) - Fixes within a threshold (for example 5 minutes) count as simultaneous, absorbing GPS
    fix-time jitter

    3. **Group or pair in space** (2 min) - Within each time group: chain rule groups within 50 meters, all pairs within
    a distance, or each animal's nearest neighbor

    4. **Build a network per period** (5 min) - Group-by-individual matrix, then a simple ratio index association
    network per year or season

    5. **Randomize** (30 min to hours) - Step, daily or trajectory randomizations within each year; rebuild networks
    from each null data stream

    6. **Compare** (20 min) - Strength and centrality per animal per period, observed against random; compare seasons
    or years

    7. **Check on the map** (10 min) - Where associations happened in a period, beside the network


    **Decision Points**:

    - Time threshold and distance threshold

    - Grouping rule: chain, all pairs within distance, or nearest neighbor

    - Period boundaries (calendar year, biological season)

    - Association index and randomization type

    - For wearable contacts: aggregate by day, by shift or by cumulative contact time


    **Information Needs**:

    - Number of time groups and groups per animal under the current thresholds

    - Per-period network with association index weights

    - Observed metric against the null distribution per animal

    - Positions on a map filtered to the same window as the network


    **Pain Points**:

    - Results depend on thresholds with no standard values

    - Map and network are separate plots

    - Everything is R code; field collaborators cannot explore

    - Many periods means many separate figures


    **Data Flow**:

    - Input: Relocation CSV or contact intervals; animal attribute table (sex, age, survival)

    - Transformations: Time grouping, spatial grouping, per-period association networks, randomized nulls, per-animal
    metrics

    - Output: Per-period networks, metric table observed vs random, map-plus-network figures
success_criteria:
    - metric: Threshold sensitivity visible
      target: Changing time or distance threshold updates the per-period network in under a minute
    - metric: Map and network together
      target: User sees positions and associations for the same window in one view
    - metric: Period comparison
      target: Per-animal metrics for every period exported as one table
