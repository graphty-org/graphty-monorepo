id: W313
name: Journal Figure and Network Deposit
category: reporting
validated: false
personas:
    - publication-figure-author
    - graph-deliverable-recipient
    - genomics-cytoscape-user
    - network-biology-core-bioinformatician
requires_capabilities:
    - label-overlap-removal
    - filtering
    - component-analysis
    - community-detection
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - layout-force-directed
    - annotation
    - export-image
    - data-export
