id: W315
name: Regulatory SAR Output from a Graph Investigation
category: reporting
validated: false
personas:
    - aml-investigator
    - graph-deliverable-recipient
requires_capabilities:
    - view-bookmarks
    - filtering
    - selection-statistics
    - path-highlighting
    - computed-attributes
    - temporal-analysis
    - comparison-view
    - data-export
    - export-image
    - report-generation
    - analysis-history
    - provenance-tracking
    - structured-findings-export
