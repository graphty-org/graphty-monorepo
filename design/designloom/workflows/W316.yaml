id: W316
name: ONA Executive Readout and Recurring Dashboard
category: reporting
validated: false
personas:
    - graph-deliverable-recipient
requires_capabilities:
    - filtering
    - community-detection
    - centrality-degree
    - visual-encoding-nodes
    - legend-display
    - annotation
    - view-bookmarks
    - comparison-view
    - removal-impact-analysis
    - export-image
    - report-generation
    - guided-presentation
    - privacy-aggregation
    - deliverable-templates
suggested_components:
    - graph-canvas
    - filter-panel
    - visual-encoding-panel
    - legend-panel
    - annotation-toolbar
    - bookmark-panel
    - comparison-view
    - metric-card
    - image-export-dialog
    - report-generator-dialog
starting_state:
    data_type: organizational network from a relationship survey or collaboration metadata, with team, function and location attributes
    node_count: 20-2,000
    edge_density: moderate
    user_expertise: intermediate+
goal: >-
    **Intent**: Present organizational network analysis results to leadership as a short deck whose every slide states
    a finding, then keep leaders informed with a monthly dashboard - without exposing individuals beyond what was agreed.


    **Mental Model**: "Visibility first, then a finding per slide." Who may see which names is settled before any map
    is shown, because management may act on the maps.


    **Task Phases**:

    1. **Set visibility** (before anything) - Agree what leaders see (names, pseudonyms, groups only) and the minimum
    group size (Viva Insights cannot go below five)

    2. **Label every network slide** (per slide) - The survey question behind the network and a legend ("the larger the
    dot, the more connections")

    3. **Title each slide with its finding** (per slide) - For example "the key barrier to connectivity is function"

    4. **Show before and after** (30 min) - Modeled connectivity after proposed introductions ("we can improve current
    connectivity by 31%")

    5. **End with named actions** (20 min) - Recommended one-on-one pairs within the agreed visibility, using pseudonyms
    where required

    6. **Facilitate** (1 h) - Show the diagrams and explain what the numbers mean

    7. **Publish the recurring dashboard** (monthly) - Refresh group-level metrics in Power BI or Viva; send personal
    network reports where the practice includes them


    **Decision Points**:

    - Names, pseudonyms or groups only for this audience?

    - Which grouping (function, location, level) tells the story?

    - Which interventions to model for the "after" view?

    - Which metrics are stable enough to track monthly?


    **Information Needs**:

    - Cross-group tie percentages and degree by group

    - Group sizes against the minimum

    - Modeled change in connectivity for proposed ties

    - The survey question text for each network


    **Pain Points**:

    - Maps that expose individuals beyond the agreement; three parties to consent in organizations

    - Survey question and legend dropped from slides when images are pasted into PowerPoint

    - Before/after comparisons built by hand

    - Monthly dashboards rebuilt outside the graph tool


    **Data Flow**:

    - Input: Survey or collaboration network with HR attributes; visibility agreement

    - Transformations: Pseudonymization or aggregation, grouping, degree and cross-group metrics, modeled added ties

    - Output: 10-20 slide readout deck, monthly dashboard, optional personal network reports
success_criteria:
    - metric: Visibility compliance
      target: No slide or dashboard shows a name or a group smaller than the agreed minimum
    - metric: Slide self-sufficiency
      target: Every network slide carries its survey question, legend and finding title
    - metric: Recurring effort
      target: The monthly dashboard refreshes from new data without restyling
sources:
