      url: https://www.innovisor.com/wp-content/uploads/2026/06/Sample-Output-Leadership-Network-Accelerator.pdf
      summary: Survey question and legend on each slide, finding titles, before and after connectivity, recommended one-on-ones with pseudonyms
    - title: Microsoft Viva Insights - privacy considerations
      url: https://learn.microsoft.com/en-us/viva/insights/privacy/privacy-considerations
      summary: Minimum group size cannot go below five
    - title: Borgatti and Molina - Toward ethical guidelines for network research in organizations
      url: https://scholars.uky.edu/en/publications/toward-ethical-guidelines-for-network-research-in-organizations/
      summary: Risks of management acting on network maps
    - title: Lumen Learning - Ethical considerations with social network analysis
      url: https://courses.lumenlearning.com/atd-tc3-management/chapter/ethical-considerations-with-social-network-analysis/
      summary: Secondary summary of consent and management misuse risks
    - title: The Organizational Network Fieldbook - reviewing results with the department
      url: https://www.oreilly.com/library/view/the-organizational-network/9780470542200/9780470542200_reviewing_the_results_with_the_departmen.html
      summary: Consultant shows the diagrams and explains what the numbers represent
    - title: Posit - Democratizing organizational surveys with Quarto and Shiny
      url: https://opensource.posit.co/resources/videos/2024-10-31_brennan-antone-democratizing-organizational-surveys-with-quarto-and-shiny/
      summary: Personal network reports generated for respondents
