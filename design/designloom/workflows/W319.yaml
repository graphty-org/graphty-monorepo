id: W319
name: Public Health Cluster Communication without Network Diagrams
category: reporting
validated: false
personas:
    - graph-deliverable-recipient
requires_capabilities:
    - community-detection
    - component-analysis
    - community-profiling
    - temporal-analysis
    - filtering
    - data-export
    - report-generation
    - privacy-aggregation
suggested_components:
    - graph-canvas
    - cluster-table
    - community-panel
    - temporal-controls
    - filter-panel
    - data-table-panel
    - data-export-dialog
    - report-generator-dialog
starting_state:
    data_type: molecular (genetic distance) or contact network of cases with demographic, geographic and diagnosis-date attributes
    node_count: 100-10,000 cases
    edge_density: sparse
    user_expertise: advanced
goal: >-
    **Intent**: Turn a molecular or contact network into the deliverables public health actually hands off - a line
    list and narrative for internal program staff, and cluster- or population-level summaries for partners and the
    public - without showing a node-link diagram or individual-level data outside the program.


    **Mental Model**: "The network is the working tool, never the handout." Federal guidance says not to use molecular
    network diagrams with partners; what leaves the program is counts by cluster, growth, population group and
    geography, with small cells protected.


    **Task Phases**:

    1. **Internal hand-off** (1 h) - Turn a cluster into a line list and narrative for disease intervention specialists
    and program staff

    2. **Partner summary** (1-2 h) - A cluster-level table: counts by cluster, growth over the period, population group,
    geography; individual data only where a data sharing agreement allows

    3. **Protect small cells** (30 min) - Check population size and cell counts against the jurisdiction's own
    threshold; suppress or combine

    4. **Public communication** (varies) - Describe clusters or groups experiencing rapid transmission, never individuals


    **Decision Points**:

    - Which audience is this for, and is a data sharing agreement in place?

    - Which groupings and periods to report?

    - Which cells fall below the jurisdiction's threshold?


    **Information Needs**:

    - Cluster membership, size and growth over a period

    - Breakdowns by population group and geography

    - Cell counts against the suppression threshold

    - Which recipients are covered by data sharing agreements


    **Pain Points**:

    - Cluster tools show networks, but the partner deliverable must be built by aggregation elsewhere

    - Easy to export a node-link picture for an audience that must not see one

    - No national numeric small-cell rule; jurisdictions set their own


    **Data Flow**:

    - Input: Case network with clusters and attributes

    - Transformations: Cluster detection, aggregation by cluster, group, place and period, small-cell suppression

    - Output: Internal line list and narrative; aggregate cluster table and short report for partners and the public
success_criteria:
    - metric: No individual-level leakage
      target: Partner and public outputs contain no node-link diagram and no individual-level rows
    - metric: Small-cell protection
      target: Every cell below the configured threshold is suppressed or combined
    - metric: Aggregation effort
      target: Cluster table produced from the network without a spreadsheet step
sources:
    - title: CDC - Cluster Detection and Response Guidance for Health Departments (Communications and Data Protection, October 30, 2024)
      url: https://www.cdc.gov/hivpartners/php/cdr/health-department-guidance.html
      summary: Avoid molecular network diagrams with partners; share only cluster- or population-level data without agreements; consider cell counts; no individual data to the public
version: 1.0.0
