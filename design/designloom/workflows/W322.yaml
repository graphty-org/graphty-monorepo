    - data-export-dialog
starting_state:
    data_type: brain connectivity matrix with atlas coordinates, region labels, module assignments and a threshold
    node_count: 68-1,000 regions
    edge_density: dense before thresholding
    user_expertise: advanced
goal: >-
    **Intent**: Turn a 3D brain network into journal deliverables - fixed multi-view ball-and-stick figures, a
    network-ordered matrix heatmap, a connectogram, a supplementary edge table and an optional rotating movie - because
    paper, PDF and court have no 3D medium.


    **Mental Model**: "Positions are anatomy, not layout." Node coordinates come from the atlas and must be kept;
    a 3D view becomes a deliverable only as a set of fixed, labeled views.


    **Task Phases**:

    1. **Keep anatomical positions** - Never recompute positions from a layout

    2. **Render named views** - Lateral and medial views per hemisphere in a grid with one shared color bar,
    often next to the ball-and-stick view of the same nodes in the same colors

    3. **Export at size** - Pixel or physical size and DPI to TIFF, EPS or PNG; or a rotating movie (about ten
    minutes to render)

    4. **Add companion views** - Matrix heatmap ordered by network or module with block outlines, circular
    connectogram, supplementary edge table with region labels

    5. **Save settings** - An option file so figures regenerate in batch for every subject or condition


    **Decision Points**:

    - Which camera views show the result?

    - Does depth carry data? If not, flatten to 2D

    - Which ordering for the matrix (network, module, attribute)?

    - Which threshold, and is it reset for each matrix?


    **Information Needs**:

    - Atlas name, threshold, density and connectome version for the caption

    - One color scale shared across all views

    - Module assignments for matrix ordering and block outlines


    **Pain Points**:

    - Tools are MATLAB-bound; movies take about ten minutes to render

    - Threshold must be reset per matrix

    - Multi-view grids and matrices are assembled in separate tools


    **Data Flow**:

    - Input: Connectivity matrix, atlas coordinates and labels, modules, threshold

    - Transformations: Thresholding, fixed-position rendering from named cameras, matrix ordering, batch settings

    - Output: Multi-view figure with shared color bar, ordered matrix heatmap, connectogram, edge table CSV, movie
success_criteria:
    - metric: Position fidelity
      target: Exported views use atlas coordinates unchanged
    - metric: Consistent encoding
      target: All views in one figure share one color bar and node colors
    - metric: Batch regeneration
      target: Saved settings regenerate the same figure for a new matrix
sources:
    - title: Ten simple rules to create biological network figures for communication (Marai et al.)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6762067
      summary: Rule 10 - avoid unjustified 3D; flatten when depth carries no data
    - title: BrainNet Viewer - a network visualization tool for human brain connectomics (Xia, Wang and He 2013)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3701683
      summary: Single, medium (lateral and medial per hemisphere) and full views; TIFF, BMP, EPS, JPEG, PNG at a set DPI; 12-second 30 FPS AVI that takes about 10 minutes to generate; settings saved as a .mat file and reused by BrainNet_MapCfg in batch
    - title: BrainNet Viewer manual v1.42 (sections 6.2 Option and 7.1 Load Files and Save as Image)
      url: https://nitrc.org/docman/view.php/504/1280/brainnet
      summary: Node and edge file formats, the per-matrix threshold warning, image export and saved option files
    - title: nilearn plot_connectome reference
      url: https://nilearn.github.io/dev/modules/generated/nilearn.plotting.plot_connectome.html
      summary: Glass-brain display modes such as ortho, lzr and lyrz; export to png, pdf or svg; no medial view named
    - title: NetPlotBrain paper
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10312269/
      summary: View letters combine into multi-panel and multi-row figures, preset view combinations and rotating frames
