name: From 3D to a Deliverable (Connectomics)
category: reporting
validated: false
personas:
    - publication-figure-author
    - network-neuroscience-researcher
    - clinical-connectome-researcher
    - computational-network-neuroscientist
    - eeg-meg-connectivity-researcher
requires_capabilities:
    - graph-rendering
    - community-detection
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - view-bookmarks
    - export-image
    - data-export
    - animated-transitions
    - journal-figure-export
    - analysis-provenance
    - matrix-view
    - multi-view-figure-export
