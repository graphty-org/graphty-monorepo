    - bookmark-panel
    - image-export-dialog
starting_state:
    data_type: note link graph with folders, tags, note-type properties and daily notes
    node_count: 1,000-20,000
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Turn the global hairball into a readable overview of what the vault contains, then start from one topic
    and follow its connections outward to regain context.


    **Mental Model**: "Remove what I don't care about, color what I do, then grow out from here." The user thinks in
    folders, tags and note types, not in graph terms.


    **Task Phases**:

    1. **Filter** (1-2 min) - Query filters such as -path:Daily, -tag:useless or path:"My ideas"; path filters can hide
    wanted links

    2. **Group** (2-5 min) - "New group" with a query and a color; start with the largest groups, filter them out, then
    group what remains

    3. **Tune** (1 min) - Arrows, text fade, node size, link thickness; center, repel and link forces

    4. **Focus** (1-3 min) - Zoom to a large node, drag it out, ask what connects to it and why

    5. **Expand from a topic** (2-10 min) - Filters show only links among matches, so the user switches to a local graph
    on a hub at higher depth, which drags in daily notes and hubs; a plugin adds right-click "Expand here (+1)",
    "Reduce here (-1)" and "Reset this branch"

    6. **Save and share** (1 min) - Re-use a handful of filter configurations; bookmarks can save graph settings; share as
    a screenshot, sometimes annotated


    **Decision Points**:

    - Which folders, tags and note types are noise?

    - Which groups get which colors, and in what order do overlapping groups win?

    - Expand this branch one more hop, or reset it?

    - Hide a hub entirely, or keep routes through it?


    **Information Needs**:

    - Group legend with query and color, saved with the view

    - Count of nodes hidden by each filter

    - For an expanded topic, which notes are within k hops and through which path


    **Pain Points**:

    - "There's no way to see any depth to our filtered results" (requested since January 2021)

    - Excluding hubs cuts every path through them; users want only paths reaching a target within k steps

    - Color groups are lost when restoring filters; presets cannot be named and saved

    - Layout differs on every open


    **Data Flow**:

    - Input: Note link graph with folder, tag, property and date metadata

    - Transformations: Query filters, query-defined color groups, per-node expand and collapse, depth applied to a
    filtered set, path-preserving hub hiding

    - Output: Saved view preset; screenshot; notes opened or linked during exploration
success_criteria:
    - metric: Readable overview
      target: User reaches a colored overview with daily notes and templates removed in under 5 minutes
    - metric: Filter then expand
      target: Depth can be applied to a query-defined set of notes
    - metric: Preset persistence
      target: Filters, color groups and display settings save as a named preset and restore exactly
