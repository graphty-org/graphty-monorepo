id: W327
name: Filter, Group, Focus and Expand from a Topic in a Note Graph
category: exploration
validated: false
personas:
    - pkm-knowledge-worker
    - zettelkasten-writer
    - academic-literature-note-researcher
requires_capabilities:
    - filtering
    - saved-filters
    - visual-encoding-nodes
    - style-presets
    - legend-display
    - search
    - neighborhood-expansion
    - ego-network
    - path-highlighting
    - layout-force-directed
    - view-bookmarks
    - export-image
    - filter-then-expand
suggested_components:
    - graph-canvas
    - filter-panel
    - filter-chip
    - search-input
    - visual-encoding-panel
    - color-picker
    - legend-panel
    - layout-panel
    - slider
