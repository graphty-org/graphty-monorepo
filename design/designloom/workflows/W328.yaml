      summary: Graph useful for spotting missing or mistaken links
    - title: Logseq forum - Getting started with the Journals page
      url: https://discuss.logseq.com/t/how-to-get-started-with-logseqs-journals-page/8432
      summary: A new journal page each day (search summary)
    - title: Logseq docs - Database version
