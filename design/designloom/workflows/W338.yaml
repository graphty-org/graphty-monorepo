starting_state:
    data_type: herb list plus spreadsheets copied from web databases (compound table with ADME columns, compound-target predictions, disease gene list, STRING edge list, enrichment table)
    node_count: 100-750 (100-200 targets in the PPI; up to 736 nodes in the compound-target network)
    edge_density: medium
    user_expertise: intermediate
goal: >-
    **Intent**: Build the networks a network pharmacology paper needs from a herbal formula and a disease - the shared
    targets, their protein interaction network with core targets, and the layered herb-compound-target-pathway figure -
    with the counts at every step recorded so methods, results and figures agree. The pipeline is a near-fixed recipe
    taught in tutorials and copied between papers; its documented weaknesses (predicted targets, arbitrary cutoffs,
    hand-carried counts) make provenance and set accounting the core needs.


    **Mental Model**: "Funnel, then layers." Each step narrows a list (compounds by ADME, targets by prediction score,
    disease genes by relevance, the intersection, the core); the final figure stacks the surviving herbs, compounds,
    targets and pathways in tiers, so a reader follows a herb down to a pathway.


    **Task Phases**:

    1. **Load the compound table** (10 min) - Import compounds per herb with ADME columns (oral bioavailability,
    drug-likeness); filter (OB >= 30% and DL >= 0.18 is the de facto default); keep the count before and after

    2. **Load predicted targets and normalize** (20 min) - Import compound-target rows; map protein names to gene symbols
    for human; see how many mapped, which did not, and duplicates

    3. **Intersect with disease genes** (10 min) - Import the disease gene list (with its relevance cutoff); intersect with
    compound targets; the overlap count and Venn are Figure 1

    4. **Build the PPI** (15 min) - Import the STRING edge list for the overlap at the chosen confidence (0.4, 0.7, 0.9);
    hide or keep disconnected targets; note node and edge counts

    5. **Screen core targets** (20 min) - Rank by degree, or by several centralities with a median rule, or intersect
    several top-10 lists; extract the core subnetwork; keep full, filtered and core networks together

    6. **Join enrichment** (15 min) - Import GO and KEGG results; attach pathways to their targets; prune pathways and
    compounds by degree

    7. **Draw the layered network** (20 min) - One stacked edge table with a node type column (herb, compound, target,
    pathway, disease); shape and color by type, size by degree; arrange types in ordered tiers with crossings reduced;
    label compounds by short codes with a mapping table

    8. **Export** (15 min) - Vector figures with legend for each network, node tables with type, degree and source
    database, and a step record (database, version, access date, cutoff, count in and out)


    **Decision Points**:

    - Which ADME cutoffs, and should compounds measured in serum be added back?

    - Which target prediction probability and disease relevance cutoffs (each changes the list several-fold)?

    - Which STRING confidence, and keep disconnected targets?

    - Which core-target rule, and does it match what is reported?

    - Which two or three pathways and targets go to docking and bench validation?


    **Information Needs**:

    - Count in, count out and dropped identifiers at every step

    - Source database and evidence class (predicted or experimental) for every compound-target edge

    - Centrality table for all targets, with the rule applied

    - Which herbs reach each core target, and through which compounds

    - Frequency context: core targets and compounds that appear in most studies (AKT1, quercetin) flagged


    **Pain Points**:

    - Identifier conversion drops symbols silently, and Excel turns symbols into dates

    - Force layout scatters node types; tiers are dragged by hand and cannot be regenerated

    - No set algebra or per-node provenance in the network tool

    - Counts drift between reruns and between methods and results

    - Styles redone for each of the four to six networks in a paper


    **Data Flow**:

    - Input: Herb names; compound table with ADME columns; compound-target predictions; disease gene list; STRING edge
    list; enrichment table

    - Transformations: ADME filter, identifier mapping, set intersection, PPI import, centrality ranking and core
    extraction, enrichment join, tiered layout by node type

    - Output: Venn counts, PPI and core subnetwork figures, layered herb-compound-target-pathway figure with legend,
    node tables, step record with counts and versions
success_criteria:
    - metric: Count consistency
      target: Every count in the step record matches the drawn networks and exported tables
    - metric: Tiered figure
      target: Layered figure regenerated from the type column with no hand dragging
    - metric: Provenance
      target: Every compound-target edge carries its source database and evidence class
sources:
    - title: Lee et al. 2022 - review of network pharmacology methods (BMB Reports)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9537023
      summary: Herb databases, predicted targets, disease genes, herb-compound-target-disease network, STRING PPI and GO or KEGG enrichment; warns of in silico target annotations
    - title: Lotus leaf network pharmacology study
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8566053
      summary: 93 compounds to 15 by ADME; 135 intersected targets; STRING 0.4; top targets by degree
    - title: Pulsatilla decoction network pharmacology study
      url: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2023.1174848/full
      summary: 346 compounds; 162 intersected targets; STRING 0.99 gave 70 nodes and 101 edges
    - title: Two-herb pair network pharmacology study
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7838196
      summary: Median rule stated but fixed cutoffs applied; 736-node compound-target network; fifteen figures
    - title: Yougui Pill network pharmacology study
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6877955
      summary: Node type by shape and color; compounds and pathways pruned at degree 10
    - title: Yinchensini decoction study
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6317126/
      summary: Attribute circle layout named in methods for the layered network
    - title: cytoHubba - hub ranking methods
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4290687/
      summary: Eleven ranking methods; MCC top 10 is the common pattern
    - title: Diao et al. 2026 - census of network pharmacology results (Frontiers in Pharmacology)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Quercetin and AKT1 appear as key results in most studies; omics-integrated studies are less homogeneous
    - title: Cytoscape manual - Creating networks
      url: https://manual.cytoscape.org/en/stable/Creating_Networks.html
      summary: Import network from file and table from file keyed on name
