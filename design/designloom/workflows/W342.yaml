goal: >-
    **Intent**: Explore a process that spans several business objects (orders, items, deliveries, invoices) in an
    enterprise platform such as Celonis: build an event log around a lead object, explore the multi-object map with
    per-object sliders, pick KPIs, check adherence, and deliver dashboards. A map alone has little business value
    without the KPI views around it.


    **Mental Model**: "Several processes meeting at shared steps." Each object type has its own path; shared
    activities appear once and the paths meet there.


    **Task Phases**:

    1. **Enable a process** (data engineer) - Turn on object types, event types and relationships from a catalog;
    the platform shows object types as nodes and relationships as lines

    2. **Build an event log around a lead object** - Pick the lead object, select events with filters, set the
    activity column, order attributes carefully (concatenated attributes can create unwanted variants), preview

    3. **Explore the multi-object map** - Shared activities once; event counts per object type with colored
    markers; one global slider and one slider per object type; adding an event may pull in others to keep it connected

    4. **Pick KPIs** - Case frequency, activity frequency, throughput time, variants, or custom KPIs

    5. **Check adherence** - Against a target model (W345)

    6. **Deliver** - KPI views and dashboards for the business, monitoring and actions


    **Decision Points**:

    - Which object is the lead object for this question?

    - Which attributes form the activity label without exploding variants?

    - Per-object slider settings versus the global slider

    - Whether an edge KPI should include hidden intermediate events (panel mode) or not (slider mode)


    **Information Needs**:

    - Event and object counts per object type

    - Which object types each activity touches

    - KPI values for the current filter

    - Whether a shown number includes hidden events


    **Pain Points**:

    - Heavy data engineering and many setup steps before a basic map

    - Slider and panel KPIs that disagree for the same edge (52 versus 32 percent of cases in one documented example)

    - Object type encoded only by color

    - Most documentation behind a sign-in


    **Data Flow**:

    - Input: Object-centric tables (objects, events, event-to-object and object-to-object links)

    - Transformations: Lead-object event log, multi-object map aggregation, per-type sliders, KPI calculation

    - Output: Multi-object map, KPI views, dashboards, adherence results
success_criteria:
    - metric: Object visibility
      target: User can tell which object types pass through any activity without relying on color alone
    - metric: KPI honesty
      target: Every edge KPI states whether hidden intermediate events are included
