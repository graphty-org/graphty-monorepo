    - filtering
    - saved-filters
    - node-merging
    - layout-hierarchical
    - visual-encoding-edges
    - statistics-panel
    - analysis-history
    - data-validation
    - process-map-derivation
    - process-detail-sliders
    - variant-analysis
    - case-drilldown
    - details-on-demand
