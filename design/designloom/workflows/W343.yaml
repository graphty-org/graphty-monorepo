id: W343
name: Simplify a Spaghetti Process Map Without Misleading Numbers
category: analysis
validated: false
personas:
    - process-mining-consultant
    - process-mining-auditor
    - clinical-pathway-analyst
    - customer-journey-analyst
    - process-mining-analyst
