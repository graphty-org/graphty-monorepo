      url: https://fluxicon.com/book/read/simplification/
      summary: Simplification strategies in practice order, from sliders to milestones
    - title: van der Aalst 2019 - A practitioner's guide to process mining, limitations of the directly-follows graph
      url: https://www.vdaalst.com/publications/p1101.pdf
      summary: The filtering trap example; contradictory DFGs after simplification; long tail holds most problems
    - title: Celonis - KPI calculations
      url: https://docs.celonis.com/en/kpi-calculations.html
      summary: Panel versus slider mode edge KPIs disagree
    - title: Tax et al. - chaotic activities
      url: https://link.springer.com/article/10.1007/s10844-018-0507-6
      summary: Frequency filtering does not remove chaotic activities
    - title: ProMiSE - provenance in process mining
