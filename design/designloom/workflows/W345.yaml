      url: https://community.celonis.com/product-updates/process-adherence-manager-deviation-allowlisting-added-2025-02-13-5108
      summary: Allowlisted deviations stay on the model graph but leave the conformance rate
    - title: Microsoft Power Automate - compare and compliance
      url: https://learn.microsoft.com/en-us/power-automate/minit/process-compare-compliance
      summary: BPMN layer compared with the open view; shared elements in the compare color
    - title: UiPath Process Mining - conformance checking
      url: https://docs.uipath.com/process-mining/automation-suite/2.2510/user-guide/conformance-checking
      summary: Deviations labeled Skip and Invalid activity
