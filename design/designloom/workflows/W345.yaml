      summary: Mining, modeling and conformance in one interface; general availability December 2023
    - title: Celonis - Creating a Process Adherence Manager model
      url: https://docs.celonis.com/en/creating-a-process-adherence-manager-model.html
      summary: Baseline or imported BPMN target; one start and end; exclusive or parallel gateways only
