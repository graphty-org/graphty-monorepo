starting_state:
    data_type: event log (XES or CSV) plus a reference model (BPMN 2.0, PNML) or a model discovered from the log
    node_count: 10-60 activities, plus places or gateways
    edge_density: sparse
    user_expertise: advanced
goal: >-
    **Intent**: Check whether execution follows a model -- discovered from the log or designed by the business -- and
    see where it does not, drawn on the model itself, with the cases behind every deviation.


    **Mental Model**: "Lay the log over the model." Each case is aligned to the closest run through the model; steps
    the model did not allow and steps the case skipped become marks on the model.


    **Task Phases**:

    a. Discover and read deviations (ProM Inductive visual Miner or PM4Py):

    1. **Import and discover** - Set the classifier, an activity threshold and a noise threshold; the chain of
    filter, discover, align and animate reruns from the first step a change affects

    2. **Read the model** - Petri net or process tree with execution counts on every element

    3. **Turn on deviations** - A log move (event not allowed by the model) drawn as a self-edge, a model move
    (required event missing) drawn as an edge circumventing the activity, both dashed red with frequencies

    4. **Select and animate** - Click nodes to keep only traces through them; animate the log on the model

    5. **Scores and export** - Fitness and precision (about 0.90-0.95 fitness is usual for structured
    processes); export the model, images and animation

    b. Compare against a reference BPMN (Celonis Process Adherence Manager, Power Automate):

    1. **Create the target model** - Mine a baseline and edit it, or import BPMN 2.0 (one start, one end, only
    exclusive or parallel gateways)

    2. **Read the conformance rate and deviations** - Deviations grouped into categories (skipped, unexpected
    events) and ranked by impact on performance

    3. **Drill and allowlist** - Select a deviation to see its variants and cases; allowlist accepted deviations
    so they leave the conformance rate but stay on the model

    4. **Compare layers** - Overlay the BPMN as a colored layer on the discovered map; shared elements take a
    common color


    **Decision Points**:

    - Discovered or reference model?

    - Which noise threshold gives a model that is fit and precise enough?

    - Which deviations are acceptable (allowlist) and which are findings?


    **Information Needs**:

    - Per-element execution counts on the model

    - Log moves and model moves with case counts, on the model

    - Ranked deviation list with impact and case lists

    - Fitness, precision and conformance rate, shown with the model

    - Deviating variants and individual cases


    **Pain Points**:

    - No single tool shows the map, the deviations and the global scores together

    - Petri nets and BPMN need notations (places, transitions, gateways) that general graph tools do not draw

    - Imported BPMN restrictions and no editing of imported models

    - Static model images from Python


    **Data Flow**:

    - Input: Event log, plus BPMN 2.0 XML, PNML or Declare constraints

    - Transformations: Model discovery, alignment or token replay, deviation aggregation, layer comparison

    - Output: Model with deviation overlay, deviation list with cases, fitness and precision, exported model and images
success_criteria:
    - metric: Deviations on the model
      target: User can point to the activity most often skipped and open its cases in under 2 minutes (design goal; no source measures it)
    - metric: Scores with the picture
      target: Fitness, precision or conformance rate visible beside the model they describe
