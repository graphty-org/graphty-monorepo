id: W346
name: Clinical Pathway Analysis from EHR Data
category: analysis
validated: false
personas:
    - clinical-pathway-analyst
requires_capabilities:
    - data-import
    - data-validation
    - data-preview
    - computed-attributes
    - filtering
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - animated-transitions
    - comparison-view
    - details-on-demand
    - export-image
    - event-log-import
    - process-map-derivation
    - conformance-overlay
    - token-replay-animation
suggested_components:
    - data-import-dialog
    - attribute-table-join-dialog
    - column-mapper
    - data-preview-table
