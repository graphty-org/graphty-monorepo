starting_state:
    data_type: desktop UI action recordings (task mining) or web analytics and touchpoint logs (customer journeys)
    node_count: 10-200 steps or touchpoints, from 20,000-70,000 recorded actions or millions of web events
    edge_density: dense
    user_expertise: intermediate
goal: >-
    **Intent**: Apply process maps to data finer or messier than system logs: desktop clicks recorded on a few users'
    machines, or customer touchpoints across channels. Both need abstraction into levels and comparison with an
    intended path.


    **Mental Model**: Task mining: "the clicks inside a step." Customer journey: "the path the customer really took
    versus the one we designed."


    **Task Phases**:

    Task mining:

    1. **Record** - 2 to 7 experienced users, 20,000 to 70,000 actions, with PII masking; users pause when off
    task

    2. **Segment and cluster** (vendor) - Cut routines out of unsegmented per-user streams; cluster screenshots of the
    same screen into steps and tasks with decision points

    3. **Review steps** - Check each step's screenshots, rename and merge

    4. **Link to cases** - Match tasks to system-level cases; drill from a system activity into its UI actions

    Customer journey:

    1. **Map data** - Customer or session as case, touchpoint or channel as activity

    2. **Discover** - Simplified map of real journeys

    3. **Check against designed journeys** - Share of journeys conforming to each design

    4. **Slice and compare** - By device, campaign or landing page; before and after a designed change


    **Decision Points**:

    - Where does one routine end and the next begin in a UI stream?

    - Which level of the hierarchy answers the question?

    - Session or customer as the case?

    - Which segments to compare?


    **Information Needs**:

    - Action, step and task counts with time per task and per application

    - Hierarchy of UI actions inside tasks inside system activities

    - Conforming share per designed journey and where journeys leave it

    - Segment comparison on one layout


    **Pain Points**:

    - Click-level maps too detailed to read

    - UI logs with no case identifier

    - Personal data in screenshots and keystrokes

    - Very many variants and loops in web journeys


    **Data Flow**:

    - Input: UI action logs with screenshots metadata, or analytics and touchpoint event exports

    - Transformations: Segmentation, step clustering, hierarchical abstraction, case matching, journey derivation,
    conformance to designed journeys, segment filters

    - Output: Task map with automation candidates; journey maps with conformance rates and segment comparisons
success_criteria:
    - metric: Level switching
      target: User can collapse UI actions into tasks and expand a system activity into its UI actions on one map
    - metric: Designed versus actual
      target: Conforming share per designed journey shown with the map
