id: W351
name: Rule Compliance and Four-Eyes Check
category: analysis
validated: false
personas:
    - process-mining-auditor
    - process-mining-analyst
requires_capabilities:
    - pattern-search
    - filtering
    - saved-filters
    - path-highlighting
    - details-on-demand
    - selection-statistics
    - layout-hierarchical
    - visual-encoding-edges
    - analysis-history
    - report-generation
    - data-export
    - process-map-derivation
