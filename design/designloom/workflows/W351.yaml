      url: https://fluxicon.com/book/read/filtering/
      summary: Follower filter with eventually, directly or never, time constraint and 4-eyes rule; attribute filter mandatory or forbidden
    - title: Fluxicon Process Mining in Practice - tutorial
      url: https://fluxicon.com/book/read/tutorial/
      summary: Path skipping Release Supplier's Invoice found from the full map, filtered to 10 cases
