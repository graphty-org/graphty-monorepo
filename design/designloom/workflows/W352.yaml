starting_state:
    data_type: >-
        Object-centric SAP data in Celonis: object types (purchase order, item, invoice, goods receipt), event types and
        relationships enabled from a process catalog; hundreds of thousands of cases, millions of events
    node_count: 20-80 activities across several object types; the object model graph has 5-20 object types
    edge_density: sparse per object type; object paths meet at shared activities
    user_expertise: advanced
goal: >-
    **Intent**: Go from an enabled process in the catalog to KPI views a business owner uses every week: build an event
    log from a lead object, explore how several object types move through shared activities, choose KPIs, check
    adherence, and deliver dashboards. Celonis users report that a map alone has little business value without
    dashboards.


    **Mental Model**: "Objects are the nouns, events are the verbs; the map shows how the nouns meet." Each object type
    has its own path and they cross where an event touches several objects.


    **Task Phases**:

    1. **Enable the process** (data engineer) - Object types, event types, relationships and a perspective are enabled
    from the catalog; the Process Intelligence Graph view shows object types as nodes and relationships as lines

    2. **Build an event log in a Knowledge Model** - Choose a lead object, select events with filters, set the
    activity column, order attributes (concatenated in order, which can create unwanted variants), preview and save;
    KPIs and filters are defined as PQL in the Knowledge Model

    3. **Explore the Multi-Object Process Explorer** - Shared activities appear once and object paths meet there; event
    counts per object type sit beside colored squares; a global slider plus one slider per object type; adding an
    event may add others to keep it connected

    4. **Pick KPIs** - Built-in views (case frequency, activity frequency, throughput time, variants) or custom KPI
    groups from the Knowledge Model

    5. **Check adherence** - Process Adherence Manager against a target model (see the conformance workflow)

    6. **Deliver** - Studio views, KPI dashboards and action flows


    **Decision Points**:

    - Which object is the lead object for this question?

    - Which attributes, in which order, make the activity name?

    - Global or per-object-type detail level?

    - Panel-mode or slider-mode KPI on an edge (they disagree when events are hidden)?


    **Information Needs**:

    - The object model as a graph: object types, relationship cardinalities, event counts per type

    - Per-object-type event counts and edge counts on the multi-object map

    - Which events were added automatically to keep the map connected

    - KPI values per node and edge with the rule used to compute them


    **Pain Points**:

    - Many setup steps before "a basic 2D map"; heavy data engineering

    - An edge KPI includes hidden intermediate events in panel mode but ignores them in slider mode; one edge read 52
    percent of cases on the panel and 32 percent on the slider

    - Object types are encoded only by hue, which fails without color

    - Most documentation needs sign-in, so practitioners learn from community posts


    **Data Flow**:

    - Input: SAP tables transformed into objects, events and relationships

    - Transformations: Lead-object event log, PQL KPIs, multi-object directly-follows aggregation with per-type
    thresholds

    - Output: Multi-object process map, KPI dashboards, adherence results, action flows
success_criteria:
    - metric: Object model readability
      target: User can see every object type, relationship and event count before building an event log
    - metric: KPI consistency
      target: An edge KPI states whether hidden intermediate events are included, and two views of one edge agree or explain why not
    - metric: Type encoding
      target: Object types remain distinguishable without color (shape, dash or label)
