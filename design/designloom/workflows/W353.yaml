id: W353
name: Simplifying a Spaghetti Map and the Filtering Trap
category: exploration
validated: false
personas:
    - process-mining-analyst
    - process-mining-consultant
    - process-mining-auditor
    - clinical-pathway-analyst
requires_capabilities:
    - filtering
    - saved-filters
    - node-merging
    - layout-hierarchical
    - visual-encoding-edges
    - details-on-demand
    - comparison-view
    - data-validation
    - process-map-derivation
    - variant-analysis
suggested_components:
    - graph-canvas
    - range-slider
    - filter-panel
    - filter-chip
    - cluster-collapse-control
    - node-merge-dialog
    - comparison-view
    - node-details-panel
    - badge
starting_state:
    data_type: Event log of a weakly structured process (service desk, hospital, customer journeys)
    node_count: 30-200 activities before simplification; 5-20 after
    edge_density: dense spaghetti at full detail (hundreds of edges, many loops)
    user_expertise: intermediate+
goal: >-
    **Intent**: Turn an unreadable map of a variable process into one a stakeholder can read without making the map
    lie. The analyst applies simplification strategies in practice order and must know which ones keep the numbers
    correct.


    **Mental Model**: "Simplify the data, not the drawing." Removing an activity should rebuild the graph from the log
    without it; deleting edges from the full graph produces wrong frequencies and durations.


    **Task Phases**:

    1. **Sliders** - Lower the paths and activities thresholds; every shown activity should stay on a start-to-end path

    2. **Keep main variants** - For structured processes, filter to the main variants; then both sliders can go to 100
    percent and the numbers add up

    3. **Remove incomplete cases** - Endpoints filter; half-finished cases otherwise look faster than they are

    4. **Split by process type** - One named data set per type (attribute value)

    5. **Split scenarios** - Mandatory or forbidden activity filters

    6. **Trim to a phase, split by start or end** - Keep the segment under study

    7. **Remove spider activities** - Activities such as "Send email" that connect to everything

    8. **Milestones** - Keep 5-7 milestones agreed with a domain expert, then drill into the part between two of them


    **Decision Points**:

    - Is this process structured enough for variant filtering?

    - Which activities are noise ("spiders") and which are the point?

    - When an activity is hidden, should its edges be bridged or the graph re-derived from the projected log?

    - Which milestones does the domain expert accept?


    **Information Needs**:

    - Whether a shown number is exact or computed on a simplified view

    - For each edge after hiding activities, whether it is a real directly-follows relation or a bridge over hidden
    events

    - Cases lost by each filter, and the filter chain

    - Side-by-side of the map before and after a simplification step


    **Pain Points**:

    - The filtering trap: for 500 traces a-b-c and 500 traces a-c with b removed, the correct graph shows a->c 1,000
    times and 6 days; Disco 2.2.1 and Celonis 4.4 showed a->c in 50 percent of cases and 10 days

    - Concurrency creates loops between activities that run once; simplifying such a map in two tools produced "two
    completely different DFGs allowing for contradictory conclusions"

    - Bottleneck information may be deceiving after simplification

    - Frequency filtering does not fix chaotic activities that occur anywhere in the trace

    - Layouts jump as detail changes, so the analyst loses their place


    **Data Flow**:

    - Input: Full event log and its process map

    - Transformations: Threshold views, variant, endpoint, attribute and phase filters, activity projection with
    re-derivation, milestone abstraction

    - Output: Simplified map with a stated simplification chain, named data sets per scenario
success_criteria:
    - metric: Correct numbers after hiding
      target: Hiding an activity re-derives frequencies and durations from the projected log, or marks every bridged edge
    - metric: Layout stability
      target: Shown activities keep their positions as the sliders move
    - metric: Simplification provenance
      target: User can state which filters and thresholds produced the current map and how many cases remain
sources:
    - title: Fluxicon Process Mining in Practice - simplification
      url: https://fluxicon.com/book/read/simplification/
      summary: Nine simplification strategies in practice order, from sliders to milestones
    - title: van der Aalst 2019 - a practitioner's guide to process mining limitations of the directly-follows graph
      url: https://www.vdaalst.com/publications/p1101.pdf
      summary: The filtering trap example; concurrency loops; contradictory DFGs from two tools; deceiving bottlenecks
    - title: Celonis docs - KPI calculations
      url: https://docs.celonis.com/en/kpi-calculations.html
      summary: Panel and slider modes treat hidden intermediate events differently (via search snippet)
    - title: Tax et al. 2018 - filtering chaotic activities from event logs
      url: https://link.springer.com/article/10.1007/s10844-018-0507-6
      summary: Frequency filtering does not remove chaotic activities
    - title: Mennens et al. 2019 - stable process map layouts
      url: https://diglib.eg.org/handle/10.1111/cgf13723
      summary: One edge can produce a completely different dot layout
