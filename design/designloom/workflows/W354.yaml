name: Code-First Process Analysis in PM4Py and bupaR
category: analysis
validated: false
personas:
    - process-mining-researcher
    - clinical-pathway-analyst
requires_capabilities:
    - data-import
    - data-validation
    - filtering
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - temporal-analysis
    - animated-transitions
    - centrality-degree
    - community-detection
    - export-image
    - data-export
    - process-map-derivation
