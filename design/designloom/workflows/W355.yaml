starting_state:
    data_type: >-
        Event log (XES or CSV) plus either a model discovered from it (Petri net, process tree) or a reference BPMN 2.0
        diagram with one start, one end and exclusive or parallel gateways
    node_count: 10-60 tasks or transitions, plus places or gateways
    edge_density: sparse; Petri nets are bipartite (places and transitions)
    user_expertise: advanced
goal: >-
    **Intent**: Check how far real executions deviate from a model and where. Conformance checking is one of the three
    core types of process mining, next to discovery and enhancement. It changes what must be drawn: a model with
    execution semantics (Petri net, process tree, BPMN with gateways) with deviations overlaid on it, not a
    directly-follows graph.


    **Mental Model**: "Replay every case on the model; wherever the case and the model disagree, mark it." A log move is
    an event the model does not allow; a model move is a step the model requires that the case lacks.


    **Task Phases**:

    1. **(a) Discover a sound model** - In ProM run Inductive visual Miner on an XES log; set the classifier, an
    activity threshold and a noise threshold on paths; the chain (prepare, filter activities, discover, align, filter,
    animate) reruns from the first step a change affects. PM4Py: `discover_petri_net_inductive(log,
    noise_threshold=...)` or `discover_process_tree_inductive`

    2. **(a) Read deviations** - Elements carry execution counts; alignments find each trace's closest run through the
    model; model moves are drawn as dashed red edges bypassing an activity, log moves as dashed red self-edges. Global
    scores: `fitness_alignments`, `precision_alignments` (replay fitness around 0.90-0.95 is usual for structured
    processes)

    3. **(a) Drill and animate** - Click nodes to keep only traces through them; animate the log on the model; export
    the Petri net or process tree, images, animation

    4. **(b) Create the target model** - In Celonis Process Adherence Manager mine a baseline model, edit and confirm
    it, or import BPMN 2.0 (one start, one end, only exclusive or parallel gateways)

    5. **(b) Read the conformance rate and deviations** - Share of conforming cases; deviations grouped into categories
    (including unexpected events) and ranked by impact on process performance

    6. **(b) Triage deviations** - Select a deviation to see its variants and cases; allowlist accepted deviations so
    they stay on the model but leave the conformance rate

    7. **(b) Compare as layers** - Power Automate overlays a BPMN as a colored layer on the current view; shared
    elements take the compare color; UiPath labels deviations "Skip" and "Invalid activity"


    **Decision Points**:

    - Discover a model or use the documented reference?

    - Which noise threshold gives a model simple enough to read but fitting enough to trust?

    - Is a deviation a violation, an accepted variation to allowlist, or a model error?

    - Which deviations matter most: by case count or by performance impact?


    **Information Needs**:

    - Per-element execution counts on the model

    - Log moves and model moves with frequencies, drawn on the model

    - Fitness, precision and conformance rate together with the map (no single tool shows all three today)

    - Ranked deviation list with case counts and impact

    - Cases behind a selected deviation


    **Pain Points**:

    - Inductive visual Miner lists global fitness and precision as future work; PM4Py shows scores but static images

    - BPMN imports with other gateway types are rejected and cannot be edited

    - Petri nets and BPMN shapes are not first-class in general graph tools

    - Usability of ProM


    **Data Flow**:

    - Input: Event log and a Petri net (PNML), process tree or BPMN 2.0 XML

    - Transformations: Inductive discovery, alignments or token replay, fitness and precision, deviation grouping and
    ranking, allowlisting

    - Output: Model with deviation overlay, deviation list with cases, scores, exported model (PNML, BPMN), images and
    animation
success_criteria:
    - metric: Deviations on the model
      target: Log and model moves are drawn on the model with frequencies, distinguishable from normal edges
    - metric: Scores beside the view
      target: Fitness, precision or conformance rate are shown with the model they refer to
    - metric: Drill to cases
      target: Selecting a deviation lists its variants and cases in one step
