starting_state:
    data_type: >-
        EHR or registry tables (admissions with ER, inpatient and ICU times; diagnoses; vitals; labs; medications) joined
        by patient id and time; a COVID-19 study used six tables and 4,479 patients; MIMICEL has 425,028 ED stays
    node_count: 6-40 abstracted activities from hundreds of raw codes
    edge_density: dense spaghetti before abstraction; moderate after
    user_expertise: advanced
goal: >-
    **Intent**: Show clinicians where patients wait, which pathways deviate from a guideline and what a protocol change
    did, from data that cannot leave the hospital. Healthcare process mining guidance stresses involving clinicians and
    nurses throughout.


    **Mental Model**: "The guideline is the intended pathway; the map is the pathway patients actually took." Clinicians
    read it as a patient journey, not as a graph.


    **Task Phases**:

    1. **Extract** - Join the EHR tables through patient identifiers and timestamps

    2. **Map records and codes to activities** - Build a consolidated activity label set (ER admission, triage, ward
    and ICU transfer, vitals, labs, medication); abstract SNOMED CT or ICD-10 codes into a manageable set

    3. **Choose the case notion** - Events, patients or episodes; MIMICEL used one ED stay, the COVID-19 study one
    patient

    4. **Repair timestamps** - Impute missing or date-only timestamps from the nearest clinically reliable timestamp
    only when that restores plausibility; keep and flag identical timestamps; remember that late registration means a
    timestamp does not match execution time

    5. **Map** - Frequency on nodes, performance on edges (Disco or bupaR `process_map`); animate in relative mode for
    clinicians

    6. **Compare with the guideline** - Guidelines are prescriptive models; the COVID-19 study wrote Declare
    constraints (monitoring before discharge, valid ordering)

    7. **Protect data** - Credentialed data stays inside the network; share only aggregates or pseudonymized logs


    **Decision Points**:

    - Which codes collapse into one activity, at what level of the terminology?

    - Patient, episode or stay as the case?

    - Impute a missing time, flag it, or drop the event?

    - Which guideline rules to encode, and how strictly?


    **Information Needs**:

    - Mapping table from raw codes to activities with counts

    - Count of imputed, date-only and tied timestamps per activity

    - Waiting times between activities with distribution, not only means

    - Share of patients conforming to each guideline rule, and the patients who do not

    - Before and after maps around a protocol change date


    **Pain Points**:

    - Spaghetti maps from high variability

    - Hundreds of distinct codes need abstraction before a map is readable

    - Imprecise, late-registered or date-only timestamps create ties and false orders

    - Data must stay inside the hospital; 70.63 percent of reviewed studies did not address privacy at all

    - Conformance is the least studied healthcare topic, so few worked examples exist


    **Data Flow**:

    - Input: EHR tables, a code-to-activity mapping, guideline rules

    - Transformations: Table join, code abstraction, case notion, timestamp repair with flags, DFG with performance,
    rule checking, before and after split

    - Output: Pathway maps and animations for clinicians, deviation lists, aggregates safe to share
success_criteria:
    - metric: Local processing
      target: The whole analysis runs without patient data leaving the analyst's machine
    - metric: Timestamp transparency
      target: Imputed and tied timestamps are counted and visible on the affected activities
    - metric: Clinician readability
      target: A clinician can read the main pathway and the longest wait from the map without explanation
sources:
    - title: Munoz-Gama et al. 2022 - process mining for healthcare, characteristics and challenges
      url: https://www.alexandria.unisg.ch/server/api/core/bitstreams/413ecf90-0787-4e40-806d-cfcdc55ec2b7/content
      summary: Spaghetti from variability, guidelines as prescriptive models, abstraction of terminologies, late registration, clinician involvement
    - title: Aversano et al. 2025 - systematic review of process mining in healthcare
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11784703/
      summary: Events most common case id; under 10 conformance articles; 70.63 percent did not address privacy
    - title: COVID-19 hospital pathways process mining study
      url: https://arxiv.org/html/2606.00041v1
      summary: Six tables, 4,479 patients, consolidated activity labels, timestamp imputation rules, Declare constraints
    - title: MIMICEL - an event log for emergency department stays from MIMIC-IV-ED
      url: https://arxiv.org/html/2505.19389v1
      summary: ED stay as case; credentialed data access
    - title: processanimateR - animate_process
      url: https://search.r-project.org/CRAN/refmans/processanimateR/html/animate_process.html
      summary: Relative mode animation used for clinicians
