starting_state:
    data_type: >-
        OCEL 2.0 log (SQLite, XML or JSON): typed events, typed objects with time-varying attributes, event-to-object
        and object-to-object links with qualifiers; the public order management log has 21,008 events of 11 types and
        10,840 objects of 6 types
    node_count: 10-40 activities on the object-centric map; thousands to tens of thousands of event and object nodes in an event knowledge graph
    edge_density: sparse per object type; shared activities join several edge sets
    user_expertise: expert
goal: >-
    **Intent**: Analyze processes where one event touches several objects (an order, its items, deliveries and
    invoices) without forcing everything into one case. Flattening causes convergence (one event copied into many
    cases, inflating counts) and divergence (false loops).


    **Mental Model**: "Several processes woven together." Each object type has its own flow; they meet at shared
    events.


    **Task Phases**:

    1. **Load and inspect** - `read_ocel2_sqlite`; `ocel_get_object_types`, `ocel_objects_interactions_summary` to see
    which types exist and how they relate

    2. **Discover** - `discover_ocdfg`, `view_ocdfg`: one directly-follows graph per object type, merged; shared
    activities once, edges colored per type

    3. **Compare with flattening** - `ocel_flattening(ocel, "order")` to see what a single-case view hides or
    duplicates

    4. **Graph database route** - Load events and entities into Neo4j as an event knowledge graph: one directly-follows
    chain per entity, chains meeting at shared events; Cypher aggregates them to a multi-entity map

    5. **Drill** - From a shared activity to the objects it touched and their individual histories


    **Decision Points**:

    - Which object types to include in the map?

    - Per-type thresholds or one global threshold?

    - Flatten on which type for a comparison, and is the inflation acceptable?

    - Library route or graph database route?


    **Information Needs**:

    - Object types, object counts and event counts per type

    - Object-to-object relations (part-of) and their cardinalities

    - Per-type edge counts at shared activities

    - Difference between the object-centric counts and the flattened counts


    **Pain Points**:

    - Object types are encoded only by hue; "if color is removed, they can be considered traditional process maps"

    - Event knowledge graphs are research-grade with no map interface

    - Most tools still flatten to one case, distorting counts

    - Real processes are more complex than vendor standard processes


    **Data Flow**:

    - Input: OCEL 2.0 file or an event knowledge graph in Neo4j

    - Transformations: Per-type directly-follows chains, merge at shared activities, per-type thresholds, flattening
    for comparison

    - Output: Object-centric map, per-type statistics, object histories
success_criteria:
    - metric: OCEL import
      target: An OCEL 2.0 file loads with every object type, event type and qualifier preserved
    - metric: Type encoding
      target: Object types are distinguishable by more than hue
    - metric: Flattening comparison
      target: User can see how counts change when the log is flattened on one type
sources:
    - title: OCEL 2.0 specification
      url: https://www.ocel-standard.org/2.0/ocel20_specification.pdf
      summary: Typed events and objects, E2O and O2O relations with qualifiers, SQLite, XML and JSON forms
    - title: Berti and van der Aalst - object-centric directly-follows graphs
      url: https://arxiv.org/pdf/2206.11017v3.pdf
      summary: One DFG per object type merged at shared activities
    - title: van der Aalst - Rainbow Spaghetti (object-centric process mining)
      url: https://www.vdaalst.com/publications/p1434.pdf
      summary: Convergence and divergence when events are forced into one case
    - title: Esser and Fahland - multi-dimensional event data in graph databases
      url: https://arxiv.org/pdf/2005.14552v2
      summary: Event knowledge graphs in Neo4j with directly-follows chains per entity
    - title: Event graph tutorial
      url: https://github.com/multi-dimensional-process-mining/eventgraph_tutorial
      summary: Hands-on construction of event knowledge graphs with Cypher
    - title: OCEL 2.0 order management log on Zenodo
      url: https://zenodo.org/records/8428112
      summary: 21,008 events, 11 event types, 10,840 objects of 6 types
    - title: van den Elzen et al. 2025 - visualization in process mining case studies
      url: https://eprints.whiterose.ac.uk/id/eprint/225747/9/1-s2.0-S0306437925000444-main.pdf
      summary: Object-centric maps encode type only by hue
