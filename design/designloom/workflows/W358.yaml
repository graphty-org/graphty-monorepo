      summary: Captures screenshots and metadata for every input and click, applies PII masking
    - title: UiPath Task Mining - introduction
      url: https://docs.uipath.com/task-mining/automation-cloud/latest/user-guide/introduction
      summary: Clusters screenshots across traces, merges matching steps, creates decision points
    - title: UiPath Task Mining - best practices
      url: https://docs.uipath.com/task-mining/automation-suite/2023.4/user-guide/best-practices-utm
      summary: 2-7 experienced users, 20,000-70,000 actions, 200-1,000 actions an hour per active user
    - title: Celonis - what is task mining
      url: https://www.celonis.com/process-mining/what-is-task-mining
      summary: Records clicks, copy and paste, time per application and matches actions to business cases
    - title: Microsoft Power Automate Process Mining - process map
      url: https://learn.microsoft.com/en-us/power-automate/minit/process-map
      summary: Hierarchical maps to drill into UI recordings combined with system event logs
    - title: Leno et al. 2020 - robotic process mining from unsegmented UI logs
      url: https://arxiv.org/pdf/2008.05782
      summary: UI logs have no case ids; routines are segmented before discovery
    - title: Weijs and Caron, ICSOFT 2022 - customer journey mining from Google Analytics 4
      url: https://scitepress.org/PublishedPapers/2022/112639/pdf/index.html
      summary: User, session and event mapped to customer, journey and touchpoint; only 10.31 percent conformed to one designed journey
    - title: Hansson et al. 2021 - Telenor cross-channel customer journeys in Disco
      url: https://ceur-ws.org/Vol-3112/paper3.pdf
      summary: 4,934 customers; designed journeys caused unintended deviations for 10-25 percent
