starting_state:
    data_type: timestamped retweet, mention or co-hashtag edges, or account-by-object two-mode data, from a platform collection
    node_count: 1000-20000 (millions before filtering)
    edge_density: sparse
    user_expertise: intermediate+
goal: >-
    **Intent**: Summary of the platform-data network work that shares departments with academic social network
    researchers but not their data, scale or tools. The full personas and workflows are owned by the social media
    research document (communication-network-scholar and coordination-detection-scientist); this record exists so the
    academic population's map is complete.


    **Mental Model**: "The map is a sample." Clusters of accounts are read as communities of discourse, but the
    collection query decides who is on the map.


    **Task Phases**:

    **Polarization map:**

    1. **Collect** - Posts for a keyword via an API, NodeXL, 4CAT or Communalytic (since Twitter's 2023 paywall, Bluesky,
    Reddit and Telegram).

    2. **Build** - A timestamped retweet, mention or co-hashtag network; in co-hashtag networks delete the query
    hashtags and rare nodes.

    3. **Lay out and cluster** - ForceAtlas2 and modularity.

    4. **Label clusters** - By hubs and top hashtags and URLs (Himelboim, Smith and Shneiderman).

    5. **Caveat** - State that the map is a sample, not a population.

    **Coordinated behavior:**

    1. **Pair accounts** - Keep account pairs that share an object within 30 to 60 seconds a minimum number of times.

    2. **Project** - To an account network.

    3. **Inspect** - Components (CooRTweet).


    **Decision Points**:

    - Which relation (retweet, mention, co-hashtag) answers the question?

    - Which query nodes and rare nodes to delete?

    - Coordination time window and minimum repetitions?


    **Information Needs**:

    - Cluster labels from hubs, hashtags and URLs

    - Component sizes of the coordination network

    - The collection query shown with the map


    **Pain Points**:

    - Platform access changes (Twitter paywall in 2023)

    - Maps misread as populations rather than samples

    - Scale far beyond survey networks


    **Data Flow**:

    - Input: Platform posts collected by API or tool, as edge tables or two-mode tables

    - Transformations: Network construction, query-node removal, time-window projection, layout and clustering

    - Output: Polarization map with labeled clusters, coordination component list
success_criteria:
    - metric: Ownership pointer
      target: Detailed requirements are tracked in the social media research document's workflows
