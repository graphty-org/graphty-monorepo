starting_state:
    data_type: >-
        A discovered process map or BPMN model with measured frequencies and durations, plus scenario parameters (skip
        an activity, remove rework, change a duration, set an automation rate, arrival and resource timetables)
    node_count: 10-60 activities
    edge_density: sparse process map
    user_expertise: advanced
goal: >-
    **Intent**: Estimate what a change would do before making it -- skip a step, remove rework, speed up an activity,
    automate part of it -- to justify the investment. The results are estimates, and the graph output is two derived
    graphs over the same activities, as-is and scenario, overlaid or side by side.


    **Mental Model**: "The same map twice: today in one color, the proposal in another."


    **Task Phases**:

    1. **Create a simulation** - Pick the process, optionally filter it (UiPath Process Simulation)

    2. **Choose scenarios** - Skip an activity, remove direct rework, change an activity's or an edge's throughput time
    by a percentage, set an automation rate; in Apromore set arrival timetables and inter-arrival distributions,
    resources and their timetables, branching and durations on a BPMN model

    3. **Run** - The tool produces a simulated log or simulated metrics

    4. **Compare** - The process graph shows the as-is process in blue and the what-if process in purple on the same
    graph; either can be hidden; node and edge metrics selectable; IBM shows baseline and scenario side by side

    5. **Read results** - Simulated average throughput time with a range, automation rate; compare saved simulations;
    export PNG


    **Decision Points**:

    - Which scenario parameters are realistic?

    - Overlay on one layout or side by side?

    - Is the improvement larger than the simulated range?


    **Information Needs**:

    - Per-node and per-edge difference between as-is and scenario

    - Simulated throughput time with its range, not only a point value

    - Which elements exist only in one of the two graphs

    - Saved scenarios listed for comparison


    **Pain Points**:

    - Results are estimates that stakeholders may read as promises

    - Overlay and side-by-side views exist only inside each vendor's tool

    - Model-based simulation (Apromore) needs many parameters the analyst has to estimate


    **Data Flow**:

    - Input: Discovered map or BPMN with measured metrics, scenario parameters

    - Transformations: Simulation (outside the graph view), derivation of the scenario graph, per-element differences

    - Output: As-is and scenario graphs overlaid or side by side, KPI ranges, exported image
success_criteria:
    - metric: Overlay on one layout
      target: As-is and scenario graphs share positions so differences are read per element
    - metric: Range reporting
      target: Simulated metrics are shown with their range
sources:
