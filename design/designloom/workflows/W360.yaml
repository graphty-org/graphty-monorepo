id: W360
name: What-If Simulation over the Discovered Process
category: analysis
validated: false
personas:
    - process-mining-consultant
    - process-mining-analyst
requires_capabilities:
    - comparison-view
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - removal-impact-analysis
    - statistics-panel
    - export-image
    - process-model-notation
suggested_components:
    - graph-canvas
