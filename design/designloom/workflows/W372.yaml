id: W372
name: Comparing Psychological Networks Across Groups or Time Points
category: analysis
validated: false
personas:
    - symptom-network-researcher
    - experience-sampling-dynamics-researcher
    - network-psychometrics-methodologist
requires_capabilities:
    - data-import
    - comparison-view
    - visual-encoding-edges
    - visual-encoding-nodes
    - legend-display
    - layout-force-directed
    - filtering
    - hover-highlight
    - tooltip-display
    - statistics-panel
    - export-image
    - data-export
    - signed-edges
    - matrix-import
    - shared-fixed-layout
    - interpretable-distance-layout
suggested_components:
    - data-import-dialog
    - comparison-view
    - graph-canvas
    - visual-encoding-panel
