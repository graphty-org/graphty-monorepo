starting_state:
    data_type: survey responses recoded so every response option of every item is a node (item:level), with phi-correlation edges between options of different items, node covariate means, and optionally one network per survey wave
    node_count: 25-60 (8 items x 5 options = 40 in the package vignette)
    edge_density: moderate; positive correlations only
    user_expertise: advanced
goal: >-
    **Intent**: Place attitudes and respondents on a latent ideological axis and measure whether a belief system is
    polarizing over time. Unlike the rest of the field, this analysis reads node position as a measurement.


    **Mental Model**: "Response options that people endorse together pull together; the main axis of the layout is the
    left-right dimension." The x coordinate is the result, not decoration.


    **Task Phases**:

    1. **Recode** - Each item's options become symbols ("Strongly Agree" to ++, "Strongly Disagree" to --)

    2. **Build** - Each option is a binary node; a positive phi correlation between options of two different
    issues becomes a weighted edge

    3. **Lay out** - Fruchterman-Reingold, then rotate so the main dimension lies on the x axis; anchor a chosen
    option on the left; fix the seed

    4. **Read positions** - Each option's x is its latent position (correlated 0.87 with endorsers' mean
    partisanship in the vignette); each respondent gets the mean position of the options they endorsed

    5. **Clusters and statistics** - Leading-eigenvector clusters; strength, closeness, betweenness, expected
    influence; mean covariates per node

    6. **Compare waves** - One network per survey wave (ANES 2000 to 2020 on five issues); linearization (x
    spread over y spread) and link density, with 200 resamples of 80 percent of respondents for uncertainty

    7. **Export** - igraph, qgraph or Gephi CSV; node coordinates as data


    **Decision Points**:

    - Which option anchors the left of the axis?

    - Which seed, and is the result stable across seeds and resamples?

    - Are waves comparable on one rotated axis?


    **Information Needs**:

    - Node x and y as exported data, not only a picture

    - Item grouping of option nodes (shared hue per item, ordered shade per response level)

    - Linearization and density per wave with resampling intervals


    **Pain Points**:

    - Package output is ggplot only

    - Ordinary force layouts are not deterministic or orientation-anchored, so positions cannot be compared or
    reported

    - Many option nodes per item with no visual grouping by item


    **Data Flow**:

    - Input: Option-level node table (item, level, covariates) and phi-correlation edge list, per wave

    - Transformations: Seeded force layout, rotation to principal axis, left anchor, coordinate export, per-wave
    statistics

    - Output: Ideological-axis figure, node and respondent coordinates, per-wave comparison
success_criteria:
    - metric: Deterministic measurement
      target: Same data and seed give the same coordinates and orientation on every run
    - metric: Coordinates as data
      target: Node x and y are exportable with the node table
