starting_state:
    data_type: published hourly or daily OD counts between districts or H3 cells (for example Spain's open mobility data), plus a zone table with centroids
    node_count: 500-10000
    edge_density: moderate
    user_expertise: advanced
goal: >-
    **Intent**: Explore an already aggregated phone-derived mobility table -- millions of hourly OD rows -- as an
    interactive flow map that stays readable at every zoom, and scrub through the hours of the day to compare peaks.
    A team holding raw pings first runs the trajectories-to-OD workflow.


    **Mental Model**: "A living map of trips." Places cluster together when zoomed out and split apart when zoomed in;
    only the biggest flows in view are drawn; a time slider replays the day.


    **Task Phases**:

    1. **Get zones and dates** (minutes) - Fetch the zone set (district polygons, delivered in a projected system,
    ETRS89 / UTM zone 30N) and the valid date range; zone versions change between data releases (Spain v1 2020-02-14 to 2021-05-09; v2 from 2022 with sociodemographics)

    2. **Query lazily** (minutes) - The OD table stays on disk as a DuckDB table of 19 columns (date, hour, origin,
    destination, activity, income, age, sex, trips); one week is 135,866,524 records and three years exceed 200 GB

    3. **Aggregate** (minutes) - Sum trips per origin and destination per day, or per hour, which gives 24 times more
    rows

    4. **Build the location table** (minutes) - Reproject the zone polygons to WGS84 and reduce each to a point as id,
    lon, lat (or load H3 cell ids directly); flows naming an id missing from it are lost

    5. **Clip the study area** (a decision) - A 10 km buffer around a city; keep flows with both ends inside;
    intra-zonal pairs are kept

    6. **Map** (seconds) - Clustered flow map; clustering stays on for hundreds to thousands of locations; a time column
    adds a time filter and playback

    7. **Read** - Zoom so clusters split and the largest flows in the viewport appear; scrub time to compare peaks; take
    numbers back to code for analysis

    8. **Hand off** - Share an interactive link or HTML widget; a static PNG for reports


    **Decision Points**:

    - Daily or hourly aggregation, given the 24-fold size difference?

    - Which study area and buffer?

    - Clustering on (random pick-up points) or off (fixed stations)?

    - How many top flows to draw, and should small flows fade?

    - Which hours or days to compare?


    **Information Needs**:

    - Count of flows dropped because an id is missing from the place table

    - Location totals (incoming, outgoing, internal) per place or cluster

    - Top flows in the current viewport, recomputed as the user zooms

    - The current time slice shown on the map and in the legend


    **Pain Points**:

    - Arc layers become many intersecting lines

    - Long flows over-plot while short intra-urban flows are basically invisible

    - Hourly data is too large to load whole; aggregation must happen before or during loading

    - Location clustering by proximity disregards which flows connect the places

    - Vendor or licensed data cannot be uploaded to a third-party server


    **Data Flow**:

    - Input: Long OD table (origin, destination, trips, date, hour, optional demographic columns) and a zone table
    (id, name, lon, lat)

    - Transformations: Lazy query, daily or hourly aggregation, id join with missing-id report, spatial clip,
    zoom-dependent location clustering with summed flows, top-N per viewport, time filter

    - Output: Interactive clustered flow map with time playback, shared link, static image
success_criteria:
    - metric: Responsiveness
      target: Zoom and time scrubbing stay interactive with a week of district-level hourly flows loaded
    - metric: Readability
      target: At any zoom the user can name the largest flows in view without hovering
    - metric: Privacy
      target: No row of the user's data leaves the browser
