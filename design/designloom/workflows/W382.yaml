      url: https://tdscience.github.io/tartu26/workbook.html
      summary: Course steps from OD data to flow maps and analysis outside the map
    - title: flowmapblue R vignette
      url: https://cran.r-project.org/web/packages/flowmapblue/vignettes/flowmapblue.html
      summary: Clustering recommended for hundreds and thousands of locations; time column
    - title: Kotov et al. 2026
      url: https://eprints.whiterose.ac.uk/id/eprint/236055
      summary: Spanish open mobility data and its tooling
    - title: Foursquare Studio - Flow layer
      url: https://docs.foursquare.com/analytics-products/docs/layer-flow
      summary: Clustering, Max Top Flows, Fade, Adaptive Scaling, Location Totals, Animation
    - title: kepler.gl - Time playback
      url: https://docs.kepler.gl/docs/user-guides/h-playback
      summary: Time filter playback for animated flows
    - title: spanishoddata - spod_get_zones reference
      url: https://ropenspain.github.io/spanishoddata/reference/spod_get_zones.html
      summary: Zones are MULTIPOLYGON simple features in ETRS89 / UTM zone 30N
    - title: kepler.gl - Add data to the map
      url: https://docs.kepler.gl/docs/user-guides/b-kepler-gl-workflow/a-add-data-to-the-map
      summary: CSV, GeoJSON, GeoArrow; WKT or GeoJSON columns become polygons; h3_id or hexagon_id columns become an H3 layer
