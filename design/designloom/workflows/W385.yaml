id: W385
name: Observed Versus Expected Flows
category: analysis
validated: false
personas:
    - urban-mobility-analyst
    - mobility-epidemiologist
requires_capabilities:
    - data-import
    - data-validation
    - computed-attributes
    - filtering
    - visual-encoding-edges
    - legend-display
    - metric-histograms
    - details-on-demand
    - comparison-view
    - export-image
    - geographic-layout
    - od-flow-import
    - spatial-interaction-models
suggested_components:
    - data-import-dialog
    - column-mapper
    - computed-attributes-panel
    - filter-panel
    - range-slider
    - histogram
    - visual-encoding-panel
    - gradient-editor
    - legend-panel
