starting_state:
    data_type: long-form commuting OD table by mode between small zones plus zone centroids (for example 2.4 million rows over 7,201 zones)
    node_count: 1000-8000
    edge_density: sparse
    user_expertise: advanced
goal: >-
    **Intent**: Turn a large commuting OD table into desire lines -- straight lines between zone centroids sized by
    trips -- filtered to the pairs that matter, so a transport planner can see which corridors would serve the most
    trips for a new cycle route, bus line or service.


    **Mental Model**: "Where people want to go, regardless of the network." Each line is unmet or met demand between
    two zones; thick bundles of parallel lines suggest a corridor.


    **Task Phases**:

    1. **Load long-form OD** - England and Wales MSOA commuting (2,402,201 rows, 7,201 zone centroids); long form is the
    most useful for large sparse data, but matrix and long forms convert both ways

    2. **Split intra-zonal from inter-zonal** - Same-zone pairs are local activity with zero-length lines

    3. **Merge directions** - Sum A to B and B to A, because overlapping one-way lines hide each other

    4. **Make lines** - Join both ends to zones by code (a polygon or point layer), placing each at a point inside its
    zone, after checking for ids that match no zone

    5. **Filter** - London has 352,654 lines; keeping inter-zonal flows of 20 or more leaves 28,879 lines (8.19 percent
    of lines, 55.7 percent of trips); about 20,000 lines plot quickly; the Propensity to Cycle Tool keeps pairs under
    20 km with at least 10 commuters and offers a top-N slider

    6. **Jitter or route** - Sample start and end points within zones and split large flows, or route lines on the
    street network and sum them into a route network (excluding within-zone trips)


    **Decision Points**:

    - Minimum flow and maximum distance?

    - Merge directions or keep them separate?

    - Which mode or purpose column to size by?

    - Centroid lines, jittered lines or routed network?

    - How many top pairs to show?


    **Information Needs**:

    - Share of lines and share of trips kept by the current filter

    - Count of intra-zonal trips per zone, shown even though their lines have length zero

    - Ids that match no zone

    - Ranked top OD pairs by trips


    **Pain Points**:

    - Hundreds of thousands of lines overwhelm plotting and the reader

    - Desire lines in modeling software are straight only

    - All-zone desire maps are hard to read without aggregation to districts

    - Within-zone trips disappear because their lines have no length


    **Data Flow**:

    - Input: Long OD table (origin zone, destination zone, all trips, trips per mode) and zone centroids

    - Transformations: Intra-zonal split, two-way merge, id join, minimum-flow and distance filter, top-N

    - Output: Desire-line map with width legend, ranked OD pair table, filtered flow export
success_criteria:
    - metric: Filter transparency
      target: User sees the share of trips kept and lines kept for every filter change
    - metric: Scale
      target: Tens of thousands of desire lines remain interactive
    - metric: Local trips visible
      target: Intra-zonal totals are shown per zone, not silently dropped
