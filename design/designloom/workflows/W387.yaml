starting_state:
    data_type: national county-to-county net migration or commuting table (long form, signed net values) plus county centroids
    node_count: 3000-3300
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Treat a migration or commuting table as a directed weighted network, compute centrality and
    communities, and -- the step today's tools leave out -- see the results on a map rather than on a force layout
    that ignores geography.


    **Mental Model**: "Counties are nodes, net moves are edges." Which places are central in the flow network, and do
    its communities form coherent regions on the map?


    **Task Phases**:

    1. **Pull flows** (minutes) - Every county's flows for one ACS vintage

    2. **Keep one measure** - Only the net flow rows (MOVEDNET)

    3. **Clean** - Drop moves from abroad (missing destination), malformed ids and self-loops: 1,440,390 rows become
    406,348

    4. **Deduplicate mirrored pairs** - Net A to B is minus net B to A, so keep one row per unordered pair: 203,174 rows

    5. **Threshold** (a decision) - Keep pairs with absolute net above 50

    6. **Orient signed edges** - Reverse every edge with a negative value and use the absolute value as weight, so
    every edge points the way people net-moved

    7. **Build the graph** - Directed and weighted: 3,083 vertices, 40,279 edges, density 0.0042, 3 components

    8. **Centrality, with a weight choice per measure** - In- and out-strength; betweenness and closeness on inverse
    weights (large flows are short distances); eigenvector, PageRank and hub and authority scores on raw weights; a
    top-10 table. Some studies extract a disparity-filter backbone first

    9. **Communities** - Collapse to undirected with summed weights; compare Louvain (13 communities, modularity
    0.506), Walktrap (377, 0.465) and label propagation (98, 0.442); the algorithm changes the answer by an order of
    magnitude

    10. **Plot (the gap)** - A Kamada-Kawai drawing "does not respect the geographic locations"; positions must be fixed
    to latitude and longitude by hand, and communities are mapped in a separate tool


    **Decision Points**:

    - Which measure: net, inbound, outbound or gross?

    - Net threshold?

    - Weight meaning per measure: raw volume, inverse volume, or hop count?

    - Backbone extraction before centrality?

    - Which community algorithm and resolution?


    **Information Needs**:

    - Row counts after each cleaning step

    - Component count and sizes

    - Top-10 table per centrality, with the weight meaning stated

    - Community count and modularity per algorithm, and where communities fall on the map

    - Nodes sized by a centrality and colored by community at their geographic positions


    **Pain Points**:

    - Antisymmetric net tables need manual deduplication and sign orientation

    - The weight must be inverted by hand for path-based measures

    - Network layouts ignore geography, so central places cannot be read in context

    - Results move to another tool for mapping

    - Community algorithms disagree by an order of magnitude with no side-by-side view


    **Data Flow**:

    - Input: Long net-flow table (origin, destination, signed net) and place coordinates

    - Transformations: Cleaning, mirrored-pair deduplication, threshold, sign orientation, per-measure weight choice,
    centrality, community detection

    - Output: Geographic network with centrality sizing and community coloring, top-N tables, community lookup
success_criteria:
    - metric: Geographic result view
      target: Centrality and community results shown at place coordinates without leaving the tool
    - metric: Weight transparency
      target: Each centrality result states whether raw, inverse or hop weights were used
    - metric: Community comparison
      target: Two community algorithms compared on the map with counts and modularity
