      url: https://scikit-mobility.github.io/scikit-mobility/reference/preprocessing.html
      summary: filter() max_speed_kmh default 500; stay_locations() 20 minutes within 0.2 km
    - title: MovingPandas TrajectoryStopDetector
      url: https://movingpandas.readthedocs.io/en/main/api/trajectorystopdetector.html
      summary: get_stop_points(min_duration, max_diameter)
    - title: MeowMotion quick start
      url: https://urbanbigdatacentre.github.io/meowmotion/getting-started/quick-start
      summary: Accuracy filter, trip generation, zoning, OD per AM peak, PM peak, all-day and non-peak window with weighted trips
    - title: kepler.gl - Trip layer
      url: https://docs.kepler.gl/docs/user-guides/c-types-of-layers/k-trip
      summary: Animated trajectories from line strings with timestamps
