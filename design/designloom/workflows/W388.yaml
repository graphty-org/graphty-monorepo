id: W388
name: From Raw Trajectories to an OD Table
category: analysis
validated: false
personas:
    - urban-mobility-analyst
requires_capabilities:
    - data-import
    - data-validation
    - data-preview
    - temporal-navigation
    - filtering
    - data-export
    - od-flow-import
