id: W39
name: Weighted Path Measures - Deciding What a Weight Means
category: analysis
validated: false
personas:
    - expert-emma
    - analyst-alex
requires_capabilities:
    - centrality-betweenness
    - centrality-closeness
    - shortest-path
    - computed-attributes
    - data-preview
    - comparison-view
    - analysis-history
    - analysis-provenance
    - weight-semantics
