starting_state:
    data_type: aligned mitochondrial or chloroplast sequences (FASTA or NEXUS) plus a sample sheet with site, region, latitude and longitude
    node_count: 10-80 haplotypes plus inferred unsampled ancestors, from 50-3,500 sequences
    edge_density: sparse (a tree with a few reticulations)
    user_expertise: intermediate
goal: >-
    **Intent**: Collapse aligned sequences into haplotypes, connect them by mutational steps, and show which populations
    carry each haplotype as pie slices, then put the same pies on a map. This is the central figure of nearly every
    phylogeography and conservation-genetics paper, and the step-by-step exercise of population-genetics lab courses.


    **Mental Model**: "A family tree of sequences." Each circle is one unique sequence, its size is how many animals
    carry it, its colors are where they came from; tick marks on a line count the mutations between two sequences;
    small black dots are ancestors nobody sampled.


    **Task Phases**:

    1. **Prepare sequences** (hours to days) - Edit Sanger reads (reverse-complement, merge, trim), check with BLAST,
    align with MUSCLE or ClustalW, save FASTA

    2. **Define haplotypes** (20 min) - In DnaSP open the file (filter "All files"), set mtDNA haploid, read haplotype
    count, segregating sites, Hd and Pi; define sequence sets for populations; export NEXUS with sequences clustered
    into populations and Arlequin files; check no group is "Additional_Seqs"

    3. **Write the traits block by hand** (20-60 min) - Append BEGIN TRAITS with one column per population and one row
    per sample, names and order matching the alignment; or load a delimited trait and geotag table

    4. **Load and choose a method** (5 min) - Open the NEXUS (set "Files of type" to All Files if greyed out); choose
    minimum spanning network (epsilon 0), TCS, median-joining, tight span walker or integer neighbor-joining

    5. **Read the network** (10 min) - Circle area is frequency, slices are populations, hatch marks count mutations,
    black dots are inferred haplotypes; check Statistics > Identical Sequences for merged samples

    6. **Style and untangle** (15-30 min) - Pick palette, vertex sizes and fonts; drag nodes by hand to stop pies
    overlapping

    7. **Map view** (10 min) - With geotags, pies appear at sampling sites on a base map in the same colors

    8. **Statistics** (30 min) - Tajima's D, AMOVA and nucleotide diversity in PopART; Standard AMOVA and pairwise FST
    in Arlequin from a Structure block, read against Wright's thresholds (below 0.05 low, above 0.25 very high)

    9. **Export and assemble** (1-2 hours) - SVG or PNG; combine network, map, tree and statistics table in
    Illustrator or Inkscape


    **Decision Points**:

    - Which network algorithm, given reviewer expectations and whether reticulations should show?

    - How are gaps coded: as a fifth state or masked (masking merges distinct haplotypes)?

    - Group pies by site, region or lineage?

    - How much manual node placement is acceptable when the figure must be reproducible?


    **Information Needs**:

    - Haplotype count, which samples were merged into each haplotype, and which sites were masked

    - Mutation count on every edge and which nodes are inferred

    - Population composition of each haplotype with a shared color legend

    - The same colors on the network and the map

    - Diversity, neutrality and AMOVA statistics beside the figure


    **Pain Points**:

    - Hand-typed traits block that must match sample order exactly

    - File filter bug hides NEXUS files

    - Gap sites silently masked, merging haplotypes

    - Large pies overlap and must be dragged apart by hand; the layout is then not reproducible

    - Four programs (DnaSP, PopART, Arlequin, Illustrator) for one figure


    **Data Flow**:

    - Input: Aligned FASTA or NEXUS, sample sheet keyed by sequence name (population, coordinates)

    - Transformations: Haplotype collapsing, network inference with inferred median vectors, population composition
    per haplotype, pie layout, map placement, AMOVA and FST

    - Output: Network SVG or PNG with legend, map with pies, statistics table
success_criteria:
    - metric: Sample metadata entry
      target: Population assignment comes from a sample sheet keyed by sequence name, with no hand-typed traits block
    - metric: Pie overlap
      target: No two pies overlap after automatic layout, without manual dragging
    - metric: Color consistency
      target: Network, map and legend use identical colors for each population
