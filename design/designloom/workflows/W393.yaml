starting_state:
    data_type: Newick or NEXUS tree with support values as inner node labels or [&key=value] comments, plus a tab-delimited tip annotation table
    node_count: 50-2,000 tips (tens of thousands for large studies)
    edge_density: tree (n-1 edges)
    user_expertise: advanced
goal: >-
    **Intent**: Turn an inferred tree into the annotated figure that anchors a systematics, barcoding or phylogeography
    paper: rooted, support on the right branches, weak clades collapsed, clades highlighted, metadata strips beside
    tips.


    **Mental Model**: "The tree is the result; everything else is labels on it." Branch length is evolutionary change;
    support belongs to a branch, not to a node.


    **Task Phases**:

    1. **Infer** (hours) - MAFFT alignment; IQ-TREE with ModelFinder, ultrafast bootstrap and SH-aLRT written as
    "SH-aLRT/UFBoot" labels, or MrBayes or BEAST with [&posterior=...]

    2. **Root** (5 min) - Root by outgroup or midpoint in FigTree; order nodes; display support; check support moved
    with its branch

    3. **Collapse and highlight** (10 min) - Collapse clades below a support threshold (commonly 70 bootstrap or 0.95
    posterior); highlight clades of interest

    4. **Annotate** (30-90 min) - FigTree File > Import Annotations keyed by tip; iTOL dataset files (color strips,
    binary columns, simple bars, tree colors, collapse) with regex and substring matching; ggtree joins a data frame and
    aligns a heatmap or alignment

    5. **Layout** (10 min) - Rectangular, slanted, circular, fan, unrooted equal-angle or daylight, cladogram; aligned
    tip labels; ladderize

    6. **Export and finish** (1-3 hours) - PDF, SVG or PNG; Illustrator for labels, scale bars and fonts; save the
    style to reapply to the next version of the tree


    **Decision Points**:

    - Outgroup or midpoint rooting?

    - Which support threshold to collapse?

    - Phylogram or cladogram; rectangular or circular?

    - Which metadata columns become strips, bars or heatmaps?


    **Information Needs**:

    - Whether inner labels are names or support values, and confirmation that support stayed on its branch after
    rerooting

    - Tip labels that failed to match the annotation table

    - Scale bar in substitutions per site

    - Legend for every strip and color


    **Pain Points**:

    - Support moves to the wrong branch on rerooting in 8 of 20 tools

    - Limited annotation in FigTree; iTOL subscription for unrestricted use

    - Newick forbids spaces so labels and metadata keys diverge

    - Every analysis change means rebuilding the figure and redoing Illustrator edits


    **Data Flow**:

    - Input: Newick, NEXUS or phyloXML tree; tip annotation tables; optional alignment

    - Transformations: Rerooting with support kept on branches, ladderizing, collapsing by support, table join on tip
    label, strip and heatmap tracks

    - Output: Publication PDF or SVG with legend and scale bar; a saved style for the next tree
success_criteria:
    - metric: Support correctness
      target: Support values stay on the same bipartition after any reroot
    - metric: Annotation match
      target: User sees how many tips matched the table and which did not
    - metric: Restyle time
      target: A saved style applies to a new tree in under one minute
