starting_state:
    data_type: BEAST .log parameter trace and .trees file of thousands of sampled trees with [&key=value] annotations; optional location trait
    node_count: 20-2,000 tips per tree; 1,000-20,000 trees per file
    edge_density: tree
    user_expertise: advanced
goal: >-
    **Intent**: Check that a Bayesian run converged, summarize thousands of sampled trees into one dated tree with
    uncertainty bars, see the uncertainty directly by overlaying the posterior, and optionally show the spread of
    lineages on a map.


    **Mental Model**: "Thousands of plausible trees, one summary." The summary is only trustworthy if the chain mixed,
    and the overlay shows what the summary hides.


    **Task Phases**:

    1. **Run BEAST** - Tip dates or fossil calibrations; a location trait for phylogeography

    2. **Convergence in Tracer** - Import trace; burn-in at least 10% (up to 50%); ESS above 200, values below
    100 shown red; run longer if many are red or yellow. Tracer checks parameters, not topologies

    3. **Summarize in TreeAnnotator** - Burn-in 10%; posterior limit 0 or 0.5; maximum clade credibility or
    MAP(CCD0) target tree; mean, median or common-ancestor node heights

    4. **Overlay in DensiTree** - Load the .trees file directly; turn on consensus and central views; show
    clade support; list every clade with its posterior

    5. **Draw the dated tree in FigTree** - Order nodes decreasing; node labels = posterior; node bars =
    height_95%_HPD; reversed time axis, offset to the most recent sample date

    6. **Spatial view** - SpreaD3 animates BEAST output on a D3 map with Bayes-factor-supported rates or HPD
    contours; without BEAST, phytools phylo.to.map links tips to map points

    7. **Ancestral ranges** (optional) - BioGeoBEARS pies at nodes; unreadable with many states


    **Decision Points**:

    - How much burn-in, and is ESS high enough to stop?

    - MCC or MAP(CCD0) summary, and which node heights?

    - Show the summary tree, the overlay, or both?


    **Information Needs**:

    - ESS and trace per parameter

    - Posterior and 95% HPD interval per node

    - Clades with their posterior frequencies across the sample

    - Time axis in calendar years or millions of years before present


    **Pain Points**:

    - Tracer, TreeAnnotator, DensiTree and FigTree are four separate programs

    - DensiTree is desktop Java

    - Node pies for ancestral ranges become unreadable

    - The map view is a separate tool again


    **Data Flow**:

    - Input: BEAST .log and .trees files (NEXUS with TRANSLATE and [&...] comments)

    - Transformations: Burn-in removal, clade frequency counting, MCC selection, height summaries, tree overlay,
    time-axis placement, map projection

    - Output: Dated summary tree with HPD bars, posterior overlay figure, optional animated map
success_criteria:
    - metric: Posterior overlay
      target: A file of at least 1,000 trees overlays interactively on shared tips
    - metric: Uncertainty display
      target: Every internal node shows posterior and a 95% HPD bar on a calendar time axis
sources:
