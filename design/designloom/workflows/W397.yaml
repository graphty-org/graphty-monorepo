      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5309710
      summary: GERMLINE IBD, 12 cM and 72 cM cutoffs, Beta-weighted edges, 769,444-vertex component, recursive Louvain, spectral embedding
