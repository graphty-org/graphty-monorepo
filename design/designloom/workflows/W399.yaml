id: W399
name: Ancestral Recombination Graph in tskit_arg_visualizer
category: exploration
validated: false
personas:
    - population-genomics-snp-analyst
requires_capabilities:
    - data-import
    - layout-hierarchical
    - hover-highlight
    - tooltip-display
    - node-selection
    - ego-network
    - visual-encoding-nodes
    - visual-encoding-edges
    - large-graph-rendering
