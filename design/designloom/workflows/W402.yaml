starting_state:
    data_type: XGMML sequence similarity network from EFI-EST (full or representative-node), node attributes from UniProt
    node_count: 10^3-10^5 nodes
    edge_density: dense within clusters; 10^5-10^8 edges
    user_expertise: intermediate
goal: >-
    **Intent**: Raise the alignment-score threshold on a protein similarity network until clusters separate by
    function, color clusters by known annotations, and choose uncharacterized clusters for lab work.


    **Mental Model**: "Turn up the stringency until families fall apart into functions." Each connected cluster at the
    right threshold is a candidate isofunctional family.


    **Task Phases**:

    1. **Submit** - Pfam or InterPro family, BLAST query, FASTA or accession list to EFI-EST with optional
    fragment, length and taxonomy filters

    2. **Read the plots** - Edges per alignment score, length histogram, alignment length and percent
    identity by score

    3. **Pick a starting threshold** - Isofunctional families often share over 40% identity; start lower near
    35% (alignment score 50 in one example, 100 for a multidomain example); a download link arrives by email, active
    14 days

    4. **Download** - Full network (about 500 MB and greater; not generated above 10 million edges) or a
    representative-node network collapsed by CD-HIT at 40-100% identity

    5. **Threshold loop in Cytoscape** - Import XGMML; organic layout; filter out edges below a higher
    score; re-lay out; repeat until clusters with known SwissProt functions separate

    6. **Color and analyze** - Color SSN utility numbers and colors clusters and lists functions and FASTA
    per cluster; cluster analysis builds alignments, logos and HMMs

    7. **Genome context** - EFI-GNT returns genome neighborhood networks and diagrams per cluster

    8. **Viral variant** - vConTACT2 c1.ntw as a network; import genome_by_genome_overview.csv keyed on the
    Genome column


    **Decision Points**:

    - Which alignment-score threshold makes clusters isofunctional?

    - Full or representative-node network, at which identity?

    - Which uncharacterized clusters to send to the lab?


    **Information Needs**:

    - Edge count and cluster count at each threshold

    - Cluster membership with SwissProt functions and taxonomy

    - Members behind each representative node

    - Join result of the annotation table (matched and unmatched keys)


    **Pain Points**:

    - Full networks exceed desktop memory; Cytoscape handles a few thousand nodes and under about 500,000 edges

    - A 47.5-million-edge network cannot be opened on most computers

    - Each threshold change needs a slow manual re-layout

    - Annotation tables fail to attach without the right key column


    **Data Flow**:

    - Input: XGMML network, UniProt annotations, optional annotation CSV

    - Transformations: Edge threshold filtering, connected components, cluster numbering and coloring, representative
    node expansion

    - Output: Colored SSN figure, cluster tables with FASTA, clusters passed to genome-neighborhood analysis
success_criteria:
    - metric: Live threshold
      target: Moving the threshold slider updates components and cluster colors without a manual re-layout
    - metric: Scale
      target: A network of 63,000 nodes and millions of edges opens in the browser
    - metric: Join transparency
      target: User sees matched and unmatched annotation keys
