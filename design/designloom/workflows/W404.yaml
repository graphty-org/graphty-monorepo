      url: https://seinecle.github.io/gephi-tutorials/generated-pdf/working-with-text-en.pdf
      summary: Term, count, unit and weight decisions; 1,484 PubMed abstracts to 250 terms and 19,613 relations; label-only styling and ForceAtlas2
    - title: Nocodefunctions semantic network walkthrough
      url: https://medium.com/@vespinozag/transform-any-text-into-a-semantic-network-with-nocodefunctions-app-in-just-4-steps-36621a354cae
      summary: Free web app, no registration, returns a Gephi file
    - title: quanteda.textplots textplot_network
      url: https://search.r-project.org/CRAN/refmans/quanteda.textplots/html/textplot_network.html
      summary: Feature co-occurrence matrix, min_freq, 1,000-node limit
    - title: textnets (Python) tutorial
      url: https://textnets.readthedocs.io/en/stable/tutorial.html
      summary: Textnet, projection, disparity-filter backbone, Leiden, GML export, fixed seed
    - title: Bail, Text networks (SICSS)
      url: https://sicss.io/2020/materials/day3-text-analysis/text-networks/rmarkdown/Text_Networks.html
      summary: R textnets tutorial for social scientists
