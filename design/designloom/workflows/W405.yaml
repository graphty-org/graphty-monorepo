starting_state:
    data_type: coded segments from a QDA project (segment id, document, codes, coder, participant attributes) or an exported code-by-code matrix
    node_count: 30-150 codes
    edge_density: moderate to dense before a minimum co-occurrence filter
    user_expertise: novice to intermediate
goal: >-
    **Intent**: Find which codes co-occur across quotations, overall and by participant subgroup, decide whether a
    cluster of codes forms a theme, and confirm it by reading the quotations behind each edge. Increasingly the codes on
    the segments were proposed by a model and accepted or rejected by a person, so the network must also show who
    coded what.


    **Mental Model**: "Counts show frequency, not meaning." An edge is a pile of quotations where two codes meet; the
    researcher has to read the pile before calling it a theme.


    **Task Phases**:

    1. **Code with comparison in mind** - Codes per dimension, code groups, participant or demographic codes so
    groups can be compared later

    2. **Optional: AI-assisted coding** - Write a code memo defining each code; run AI coding on a code and up to
    50 documents; approve or discard each suggestion; keep the model's explanation as a comment on each segment; or
    pick from model-suggested codes per highlighted segment

    3. **Compute co-occurrence** - Count segments where both codes apply under overlap, within, enclose or same
    relations, or within N paragraphs, or in the same document; optionally a normalized coefficient (c-coefficient
    n12 / (n1 + n2 - n12)); flag coefficients above 1 caused by overlapping segments

    4. **Drill down** - Click a cell or an edge to read its quotations; test AND, OR, WITHIN, FOLLOWS queries

    5. **Visualize** - Matrix heat map, Sankey, force-directed graph, or a concentric model with selected codes
    in an inner circle and co-occurring codes outside, with a minimum co-occurrence filter, line width by frequency
    and symbol size by segment count

    6. **Leave for Gephi when built-ins fail** - Export the matrix, aggregate by incident or by person, size by
    frequency, color by code family, ForceAtlas2, Louvain, subset by setting or attribute

    7. **Validate** - Read responses next to the network; triangulate; compare subgroups


    **Decision Points**:

    - Which co-occurrence relation (overlap, proximity, same document) and which aggregation (incident or person)?

    - Raw counts or a normalized coefficient, given codes whose frequencies differ more than fivefold?

    - What minimum co-occurrence keeps the network readable?

    - Accept or discard each model suggestion, and should model-coded segments count the same as human ones?

    - Does a community of codes deserve to be named as a theme?


    **Information Needs**:

    - The quotations behind any edge or code, with document and participant attributes

    - Who or what coded each segment, the model's explanation and whether a person accepted it

    - Code frequencies, so lopsided pairs can be spotted

    - The same network filtered by subgroup, on the same layout

    - Inter-coder agreement figures


    **Pain Points**:

    - Co-occurrence matrices are slow or unreadable for large datasets

    - The trip to Gephi loses every quotation

    - Web versions cannot export the co-occurrence views

    - Coefficients above 1 from overlapping segments mislead

    - No way to separate human-coded from model-coded edges


    **Data Flow**:

    - Input: Coded-segment table or QDPX project, participant attributes, or a code-by-code adjacency matrix (XLSX)

    - Transformations: Pairwise co-occurrence counting per relation and aggregation, optional normalization,
    minimum-weight filter, community detection, subgroup filtering, coder filtering

    - Output: Code co-occurrence figure, themes with supporting quotations, subgroup comparison, matrix export
success_criteria:
    - metric: Edge evidence
      target: Every edge opens its quotations, with coder and acceptance status, in one click
    - metric: Subgroup comparison
      target: Two subgroup networks shown on one layout
    - metric: Scale
      target: A 150-code network with tens of thousands of segments stays responsive
