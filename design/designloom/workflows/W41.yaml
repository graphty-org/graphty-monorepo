id: W41
name: Hub Interpretation with Domain-Aware Normalization
category: analysis
validated: false
personas:
    - expert-emma
    - analyst-alex
    - network-neuroscience-researcher
requires_capabilities:
    - centrality-degree
    - centrality-betweenness
    - centrality-pagerank
    - community-detection
    - community-profiling
    - ego-network
    - neighborhood-expansion
    - computed-attributes
    - details-on-demand
    - comparison-view
    - visual-encoding-nodes
