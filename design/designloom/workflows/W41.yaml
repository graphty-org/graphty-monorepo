starting_state:
    data_type: graph with a community partition (or one to be computed)
    node_count: 100-1000000
    edge_density: any
    user_expertise: intermediate+
goal: >-
    **Intent**: Decide which high-ranking nodes are genuine hubs and what role each plays -- a provincial hub inside one
    module, a connector between modules, an artifact of how the data was collected, or infrastructure -- using
    normalizations rather than a raw degree cutoff.


    **Mental Model**: "High compared to what?" A hub is high relative to its module, to how often it was measured, and
    to what a random graph with the same degrees would give.


    **Task Phases**:

    1. **Rank on several centralities** (2 min) - Degree, betweenness on distances, PageRank; look for high-betweenness,
    low-degree brokers that degree alone misses

    2. **Normalize against modules** (3 min) - Within-module degree z-score and participation coefficient P; z >= 2.5
    marks module hubs; provincial hubs (P <= 0.30) stay in their module, connector hubs link many

    3. **Normalize against collection effort** (5 min) - Check whether degree tracks how often a node was screened or
    studied; flag supernodes (a shared address, a bank) above a cap as likely artifacts

    4. **Normalize against a null** (minutes) - Hub-to-hub connectivity (rich club) only relative to a
    degree-preserving null

    5. **State uncertainty** (2 min) - Centrality accuracy declines as data error rises; check rank stability under
    subsampling (W42)

    6. **Hand off** (5 min) - A role label per hub (provincial or connector; artifact, infrastructure or genuine) with
    its evidence


    **Decision Points**:

    - Which centralities answer the question (popularity, brokerage, influence)?

    - Is this node's degree a property of the system or of the measurement effort?

    - Above what degree is a node treated as a supernode and expanded selectively?

    - Provincial or connector?


    **Information Needs**:

    - Several centrality ranks side by side

    - Within-module z and participation coefficient per node, on a role map (z vs P)

    - A study-effort or collection covariate where one exists

    - Supernode count above the cap

    - Rich-club rho(k) against the null


    **Pain Points**:

    - A protein's degree largely reflects how many times it was screened; study bias alone can produce a power law

    - Burt's constraint mostly tracks inverse network size

    - Supernodes swamp ego networks and layouts

    - No tool found computes participation coefficient and within-module z in a GUI


    **Data Flow**:

    - Input: Graph, partition, optional collection-effort column

    - Transformations: Multi-centrality ranking, module-normalized roles, effort normalization, null comparison

    - Output: Hub table with roles and evidence, role map, highlighted figure
success_criteria:
    - metric: Hub threshold justified
      target: Hubs defined by within-module z >= 2.5, a null comparison or an effort normalization, not an arbitrary degree
    - metric: Roles assigned
      target: Every reported hub labeled provincial or connector and genuine, artifact or infrastructure with evidence
sources:
    - title: Functional cartography of complex metabolic networks (Guimera and Amaral 2005)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2175124
      summary: z >= 2.5 for module hubs, P <= 0.30 provincial; about 80% of nodes link only within their module
    - title: Bias tradeoffs in the creation and analysis of protein-protein interaction networks (Gillis, Ballouz and Pavlidis 2014)
      url: https://repository.cshl.edu/id/eprint/29493/
      summary: Degree reflects study effort
    - title: Schaefer et al. 2015, Frontiers in Genetics
      url: https://www.frontiersin.org/journals/genetics/articles/10.3389/fgene.2015.00260/full
      summary: A protein's degree largely reflects the number of times it was screened
    - title: Lucchetta et al. 2024, eLife
      url: https://elifesciences.org/articles/99951.pdf
      summary: Study bias alone can produce power-law degree distributions
    - title: On the robustness of centrality measures under imperfect data (Borgatti, Carley and Krackhardt 2006)
      url: https://scholars.uky.edu/en/publications/on-the-robustness-of-centrality-measures-under-conditions-of-impe/
      summary: Centrality accuracy declines smoothly with data error
    - title: Linkurious user manual - expand
      url: https://doc.linkurious.com/user-manual/3.1/expand
      summary: superNodeThreshold flags and limits expansion of supernodes
    - title: Burt's constraint and network size (Strategy Science 2024)
      url: https://pubsonline.informs.org/doi/10.1287/stsc.2024.0297
      summary: Constraint mostly tracks inverse network size
    - title: Detecting rich-club ordering (Colizza et al. 2006)
      url: https://arxiv.org/abs/physics/0602134
      summary: Rich club meaningful only against a degree-preserving null
