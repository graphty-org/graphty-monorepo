id: W417
name: From a 3D Session to a Shareable 2D Deliverable
category: reporting
validated: false
personas:
    - correlation-network-3d-biologist
    - network-medicine-vr-researcher
    - multilayer-network-3d-biologist
    - desktop-3d-graph-investigator
    - clinical-connectome-researcher
    - eeg-meg-connectivity-researcher
requires_capabilities:
    - view-bookmarks
    - export-image
    - data-export
    - report-generation
    - analysis-history
    - legend-display
    - style-presets
    - annotation
    - render-mode-switching
    - viewpoint-and-video-export
suggested_components:
    - bookmark-panel
    - image-export-dialog
    - data-export-dialog
    - report-generator-dialog
