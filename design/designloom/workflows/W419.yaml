starting_state:
    data_type: entity and relation exports (CSV) or a Neo4j database; people, accounts, phones, addresses, posts
    node_count: hundreds to a few thousand (no source reports a typical size)
    edge_density: sparse
    user_expertise: intermediate
goal: >-
    **Intent**: Find a fraud ring or a network of accounts in investigation data, place it on a map and a timeline, and
    present it, working in a browser-based 3D graph tool on an ordinary monitor. Evidence is vendor-published or from a
    single user's tutorial.


    **Mental Model**: "Visualization first." See the shape, then filter by where and when, then tell the story.


    **Task Phases**:

    1. **Connect data** (5 min) - Open the tool in a browser or as a Neo4j Desktop graph app and connect to Neo4j, or
    drag a CSV into a workspace where each row becomes a node

    2. **Shape the graph** (10 min) - Extract new nodes from an existing label's properties (only for the selection when
    one exists); set property tags and colors per type

    3. **Lay out in 3D** (5 min) - Run the force layout; switch to a parametric view that maps a property to an axis,
    distribute nodes along an axis by binning a property, or sort them on a line

    4. **Place on a map and a timeline** (15 min) - Geospatial views and timeline filtering, named as the main value for
    desktop users

    5. **Inspect** (15 min) - An enhanced property table with aggregations of neighbor values; images on nodes

    6. **Present** (varies) - Data-driven presentation to a supervisor or prosecutor; export and case-file steps are
    not documented


    **Decision Points**:

    - Which columns become their own nodes (phones, addresses) to reveal shared identifiers?

    - Force layout, or a property on an axis?

    - Which time window and place narrow the ring?


    **Information Needs**:

    - Entity types and counts after extraction

    - Neighbor aggregations (for example total amount sent by a ring)

    - Node images and full properties on demand


    **Pain Points**:

    - Schema-loading problems in the interface reported by a user

    - Undocumented export and case-file steps

    - 3D is hard to print and some colleagues find it disorienting


    **Data Flow**:

    - Input: CSV exports or a Neo4j database, sometimes fed by OCR and entity extraction

    - Transformations: Node extraction from properties, typing and coloring, force or parametric layout, geospatial and
    timeline filtering, neighbor aggregation

    - Output: Presentation views and images
success_criteria:
    - metric: Time from CSV to a typed graph
      target: Under 15 minutes without writing code
    - metric: Ring identification
      target: User can show the ring's shared identifiers, places and dates in one view
