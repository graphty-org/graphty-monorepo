name: Investigator in 3D on a Desktop (GraphXR)
category: analysis
validated: false
personas:
    - desktop-3d-graph-investigator
requires_capabilities:
    - data-import
    - data-preview
    - node-merging
    - computed-attributes
    - layout-force-directed
    - graph-rendering
    - visual-encoding-nodes
    - temporal-navigation
    - filtering
    - details-on-demand
    - neighborhood-expansion
