id: W421
name: Exploring a Running Software System as a 3D City (ExplorViz)
category: exploration
validated: false
personas: []
requires_capabilities:
    - data-import
    - graph-rendering
    - layout-hierarchical
    - visual-encoding-nodes
    - visual-encoding-edges
    - node-selection
    - hover-highlight
    - details-on-demand
    - zoom-pan
    - immersive-xr-session
    - xr-label-legibility
    - multi-user-session
suggested_components:
    - data-import-dialog
    - graph-canvas
    - cluster-collapse-control
    - node-details-panel
    - node-tooltip
    - zoom-controls
starting_state:
    data_type: OpenTelemetry traces from an instrumented application
    node_count: not reported
    edge_density: hierarchical containment plus directed calls
    user_expertise: advanced
goal: >-
    **Intent**: Understand how a running software system is put together and which components call which, alone on a
    desktop or phone or with teammates in shared VR or AR.


    **Mental Model**: "The system is a city." Applications are foundations, packages are stacked districts, classes are
    buildings, and method calls are pipes between them.


    **Task Phases**:

    1. **Instrument** (setup) - For Java, an agent such as inspectIT Ocelot; export traces to an OpenTelemetry collector

    2. **Open the web view** (1 min) - The city is drawn from the hierarchy and the observed calls

    3. **Explore** (20 min) - Alone on a desktop or phone, or together in VR where users share one space and see each
    other as avatars

    4. **Answer a comprehension question** (varies) - Which components and calls implement a behavior; what depends on
    a class


    **Decision Points**:

    - Which districts to open and which to keep collapsed?

    - Desktop alone, or a shared immersive session?


    **Information Needs**:

    - Containment hierarchy with call counts between components

    - Readable names of buildings and districts

    - Where teammates are looking


    **Pain Points**:

    - Readability of visualized entities in VR and AR

    - Performance problems in immersive mode

    - AR helped novices but not experts identify dependencies in a separate study


    **Data Flow**:

    - Input: Live or recorded traces

    - Transformations: Hierarchy aggregation, city layout, call-edge routing

    - Output: Shared understanding; no export documented
success_criteria:
    - metric: Dependency identification
      target: User names the callers of a chosen class correctly
    - metric: Readability
      target: Names stay legible in immersive mode
sources:
    - title: ExplorViz project page and 2022 collaborative program comprehension study (read through a search summary)
      url: https://explorviz.uni-kiel.de/1-about/
      summary: City metaphor, OpenTelemetry traces, desktop, mobile, VR, AR and avatars; readability and performance problems
    - title: ExplorViz 2022 study PDF
