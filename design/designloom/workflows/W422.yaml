id: W422
name: Browsing a Note Vault in 3D
category: exploration
validated: false
personas: []
requires_capabilities:
    - data-import
    - graph-rendering
    - layout-force-directed
    - layout-radial
    - filtering
    - hover-highlight
    - node-selection
    - details-on-demand
    - zoom-pan
    - render-mode-switching
suggested_components:
    - graph-canvas
    - layout-panel
    - filter-panel
    - node-tooltip
    - zoom-controls
starting_state:
    data_type: Markdown note vault with links, folders and tags
    node_count: hundreds to thousands of notes (see the personal-knowledge-graphs research document)
    edge_density: sparse
    user_expertise: novice
goal: >-
    **Intent**: See a personal note vault as a 3D cloud of linked notes, rotate it to find clusters, and jump into a
    note. This is the largest group touching a 3D network view, and it uses no headset.


    **Mental Model**: "My notes as a galaxy." The view is for wandering and noticing, not for measurement.


    **Task Phases**:

    1. **Install or switch** (2 min) - Install a 3D graph plugin (Obsidian 3D Graph, desktop and mobile) or switch
    org-roam-ui to 3D

    2. **Rotate, zoom and highlight** (5 min) - See links, clusters and node details

    3. **Open a note** (seconds) - Double-click opens the note in org-roam-ui

    4. **Refilter** (2 min) - In Graph Styler's experimental 3D, the view is a snapshot of the global graph's visible
    nodes, so after changing filters the user closes and reopens it; force, orbital hop shell and globe layouts


    **Decision Points**:

    - 2D or 3D for this vault on this machine?

    - Labels on or off?


    **Information Needs**:

    - Note title on hover

    - Which folder or tag a cluster belongs to


    **Pain Points**:

    - 3D is very slow on large vaults; the README advises turning off labels and favoring 2D

    - Filters do not update a snapshot view live

    - Users split on whether the graph is useful at all


    **Data Flow**:

    - Input: Note files and their links

    - Transformations: Link extraction, filtering by folder or tag, 3D layout

    - Output: Navigation into a note
success_criteria:
    - metric: Responsiveness
      target: Rotation stays smooth on the user's vault with labels on
    - metric: Live filtering
      target: Filter changes update the 3D view without reopening it
