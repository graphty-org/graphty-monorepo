      url: https://www.pywhy.org/dowhy/main/example_notebooks/gcm_rca_microservice_architecture.html
      summary: Inverted service graph of 11 nodes and 13 edges, anomaly and distribution-change attribution, what-if
    - title: AWS Open Source blog - root cause analysis with DoWhy
      url: https://aws.amazon.com/blogs/opensource/root-cause-analysis-with-dowhy-an-open-source-python-library-for-causal-machine-learning
      summary: Business profit-drop graph, arrow strength, intrinsic causal influence, negative scores
    - title: Pham, Ha and Zhang - ASE 2024 evaluation of causal RCA methods
      url: https://arxiv.org/html/2408.13729v1
      summary: 21 methods on benchmarks up to 212 metrics; large graphs and edge directions are hard
