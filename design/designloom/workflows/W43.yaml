id: W43
name: Laying Out, Styling and Reading a Network Figure
category: analysis
validated: false
personas:
    - analyst-alex
    - expert-emma
requires_capabilities:
    - layout-force-directed
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - community-detection
    - centrality-degree
    - filtering
    - zoom-pan
    - style-presets
    - view-bookmarks
    - comparison-view
    - export-image
    - analysis-provenance
    - layout-reproducibility
    - partition-drawing-agreement
suggested_components:
    - layout-panel
    - layout-option
    - visual-encoding-panel
    - gradient-editor
    - color-picker
    - legend-panel
