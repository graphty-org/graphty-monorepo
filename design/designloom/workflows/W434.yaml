starting_state:
    data_type: compound-target network with a herb attribute per compound; target-pathway membership table; pathway-disease table
    node_count: 100-300 targets; one-mode projections up to 280 nodes
    edge_density: dense after projection (up to 6,500 edges)
    user_expertise: advanced
goal: >-
    **Intent**: Explain why a formula combines its herbs -- what each herb contributes and where they overlap -- and
    find which other diseases the formula could treat.


    **Mental Model**: "Whose targets are these?" Every compound keeps its herb and every target remembers which herbs
    reach it; overlaps are the synergy story, unique sets are each herb's role.


    **Task Phases**:

    1. **Keep per-herb provenance** - Each compound carries its herb; each target the set of herbs reaching it

    2. **Compare the sets** - For example 20 compounds from one herb, 48 from the other, 2 shared; eight to twelve herbs
    need a many-set view a Venn cannot draw

    3. **Project two-mode to one-mode** - Turn the target-pathway membership into a target-target network (for example
    279 nodes, 6,549 edges)

    4. **Rank targets** - Degree, betweenness and loss of network efficiency on removal; keep the top 10%

    5. **Check against literature** - Correlate the ranking with co-occurrence counts in a literature database

    6. **Reposition** - Directed targets-pathways-diseases network; keep pathways and diseases above in-degree cutoffs;
    read off candidate diseases


    **Decision Points**:

    - Which herbs to compare and whether shared compounds count for both?

    - Project on shared pathways, and with what edge weight?

    - Which ranking (efficiency loss, degree, betweenness) to report?

    - Which in-degree cutoffs define a candidate disease?


    **Information Needs**:

    - Per-herb set sizes and all pairwise and many-way overlaps

    - Degree labeled by layer so bipartite degree is not confused with projected degree

    - Ranking table with several measures side by side


    **Pain Points**:

    - The herb label rarely survives spreadsheet joins

    - Projection and efficiency ranking need Pajek, Gephi and custom Python

    - Many-set comparisons do not fit in a Venn


    **Data Flow**:

    - Input: Typed compound-target network with herb attribute, target-pathway and pathway-disease tables

    - Transformations: Per-herb set operations, bipartite projection, centrality and removal-impact ranking,
    in-degree filtering on a directed network

    - Output: Herb contribution comparison, ranked target table, candidate disease list, figures
success_criteria:
    - metric: Herb provenance
      target: User can select one herb and see its compounds and targets, and which targets are shared
    - metric: Projection
      target: One-mode target network produced from the bipartite table without leaving the tool
