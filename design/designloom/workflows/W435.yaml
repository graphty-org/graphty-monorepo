      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3024874/
      summary: 737 herbs, mutual-information pair scores, top 100 pairs, nodes colored by property and sized by neighbor count, checked against 775 traditional pairs
    - title: Aplastic anemia prescription mining (PMC9436587)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9436587/
      summary: 859 prescriptions, 255 herbs, Apriori in SPSS Modeler
    - title: Influenza-like illness prescription rules (Journal of Multidisciplinary Healthcare)
      url: https://www.dovepress.com/diagnostic-features-and-prescription-rules-of-influenza-like-illnesses-peer-reviewed-fulltext-article-JMDH
      summary: 457 records, 105 herbs, 1,603-edge Gephi network colored by modularity, k > 26 core matching Maxing Shigan Decoction
    - title: Ginseng for Xiaoke (PMC7140142)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7140142/
      summary: 303 classical prescriptions, ginseng removed, 243 nodes and 3,552 edges in Cytoscape, DPClus clusters
    - title: Coronary heart disease prescription mining (PMC8557045)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8557045/
      summary: 715 cases, 182 herbs, five core herbs handed to the standard pipeline
    - title: TM-MC 2.0 (PMC10790428)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10790428/
      summary: 5,075 Korean, Chinese and Japanese prescriptions with materials, processing and doses
    - title: TCMNPAS platform (PMC10958928)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10958928
      summary: R/Shiny platform combining prescription mining with network pharmacology
