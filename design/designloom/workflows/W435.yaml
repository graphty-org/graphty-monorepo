starting_state:
    data_type: prescription-by-herb table from hospital records or classical texts, plus a herb attribute table (property, flavor, meridian, role)
    node_count: 100-740 herbs
    edge_density: dense (up to about 3,600 edges after a cut)
    user_expertise: intermediate
goal: >-
    **Intent**: Find the herbs a senior physician (or a classical text) combines for a syndrome, and extract the core
    formula, often as the first half of a paper whose second half is the standard mechanism pipeline. About 300 PubMed
    records name data mining or association rules with Chinese medicine prescriptions; the Chinese-language literature
    is larger.


    **Mental Model**: "Which herbs travel together." Each prescription is a basket; herbs are joined by how often they
    are co-prescribed, and the dense core of the network is the physician's core formula.


    **Task Phases**:

    1. **Assemble the table** - 300 to 3,900 prescriptions; convert to a Boolean prescription-by-herb matrix

    2. **Standardize herb names** - Merge processed and raw forms; attach property, flavor and meridian from the
    pharmacopoeia

    3. **Frequencies** - Herb counts and pair counts

    4. **Association rules** - Apriori at support 0.03-0.20 and confidence 0.5-0.8

    5. **Build the network** - Project to a weighted herb-herb network (co-occurrence, rule confidence or mutual
    information); size by frequency; drop a herb present in every prescription

    6. **Extract the core** - k-core, DPClus or modularity clusters; compare with a known classical formula

    7. **Hand on** - Core herbs go to the standard pipeline


    **Decision Points**:

    - Which herb name variants to merge?

    - Which edge weight and cut (count, support, confidence, mutual information, top N pairs)?

    - Which k for the core, and does it match a known formula?


    **Information Needs**:

    - Herb frequencies and pair weights in a sortable table

    - Edge count at each cut, live as it changes

    - Traditional attributes (cold to hot property, flavor, meridian, monarch-minister-assistant-guide role) available
    for color and grouping


    **Pain Points**:

    - Rules come from SPSS Modeler, R arules or Python, and the network step leaves the tool

    - The cut that defines the network is rarely recorded

    - Styling inputs come from traditional theory, which generic tools do not know about


    **Data Flow**:

    - Input: Prescription records (Excel), herb attribute table

    - Transformations: Name merging, incidence-to-one-mode projection with a weight, threshold cut, k-core and community
    detection

    - Output: Weighted herb network with the core highlighted, frequency and rule tables, core herb list
success_criteria:
    - metric: Projection in place
      target: User builds the herb network from the prescription table without code
    - metric: Recorded cut
      target: The weight and threshold used are stored with the network and shown on export
    - metric: Core extraction
      target: k-core result highlighted and exportable as a herb list
sources:
