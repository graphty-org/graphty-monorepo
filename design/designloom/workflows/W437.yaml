starting_state:
    data_type: query subgraph returned by a server from millions of known and predicted ingredient-target edges, as JSON
    node_count: hundreds to low thousands per query
    edge_density: medium; each compound capped at its top N predicted targets
    user_expertise: advanced
goal: >-
    **Intent**: Give every visitor of a TCM database a network view of what the resource knows around a herb,
    ingredient, formula or target, without the developer writing and maintaining a viewer. Every database visit starts
    here; it is the resource's front door.


    **Mental Model**: "Seed in the middle, the database around it." The queried entity sits at the center, its typed
    neighbors around it; predicted edges are thinner when less confident; clicking a node grows the network.


    **Task Phases**:

    1. **Query** - The visitor enters a herb, ingredient, formula, target or gene list in one of several identifier types

    2. **Fetch a capped subgraph** - The server returns, for example, the top 20 predicted targets per compound

    3. **Render** - Typed nodes, seed central, known and predicted edges distinguished, edge width from confidence

    4. **Explore** - Expand a node's neighbors on click, choose which entity types to show, filter, relayout, follow a
    link to the record page

    5. **Export** - SVG or JPG image; GraphML, XGMML or CX2 for Cytoscape and NDEx; bulk download and JSON API beside the
    view


    **Decision Points**:

    - How many neighbors to return per expansion before the view becomes unreadable?

    - Show predicted edges by default, or known only?

    - Which entity types are visible on first load?


    **Information Needs**:

    - Node type, identifier and link-out URL per node

    - Edge evidence class (known or predicted) and confidence score

    - Counts of hidden neighbors so the visitor knows what an expansion will add


    **Pain Points**:

    - Each resource builds its own viewer

    - Existing embeddable explorers model proteins and drugs, not herbs, ingredients and formulas

    - Static images do not let the visitor expand or export


    **Data Flow**:

    - Input: JSON subgraph from the resource's API, with node types, scores and link-out URLs

    - Transformations: Typed rendering, confidence-to-width mapping, incremental expansion from server calls, type
    filtering

    - Output: Interactive on-page view, image export, CX2, GraphML or XGMML for desktop tools
success_criteria:
    - metric: Embedding effort
      target: A developer shows a typed subgraph on a page in about 15 lines of code
    - metric: Expansion
      target: Clicking a node adds its neighbors from the server without resetting the layout
    - metric: Round-trip
      target: An exported CX2 or GraphML file opens in desktop Cytoscape with types and scores intact
sources:
