starting_state:
    data_type: >-
        A named formula of 2-12 herbs and a disease; ingredient tables copied from TCMSP or HERB (MOL ID, name, oral
        bioavailability, drug-likeness, Caco-2, half-life) with a herb column added by hand; predicted target lists
        (protein names or gene symbols with a probability score); a disease gene list from GeneCards, OMIM or DisGeNET
        with relevance scores; a STRING TSV of the intersected targets
    node_count: 100-200 targets in the protein network; 300-700 nodes in the compound-target network
    edge_density: moderate
    user_expertise: novice to intermediate
goal: >-
    **Intent**: Explain how a traditional Chinese medicine formula or a medicinal plant acts on a disease by linking its
    compounds to predicted protein targets and to the disease's genes, then rank the overlapping targets so two or
    three can be docked and tested at the bench. This near-fixed recipe is the method of thousands of papers a year
    (3,357 PubMed records naming "network pharmacology" in 2024, 5,172 in 2025), mostly by graduate students who copy a
    prior paper's methods, cutoffs included.


    **Mental Model**: "Narrow the formula down to a few core targets." Each step is a funnel: hundreds of compounds
    shrink to tens by an absorption filter, thousands of disease genes meet hundreds of predicted targets in a Venn
    diagram, the overlap becomes a protein interaction network, and degree picks the "core targets". A high-degree
    compound is the "key active ingredient"; an enriched pathway is "the mechanism".


    **Task Phases**:

    1. **Name the herbs** (10 min) - Chinese, pinyin and Latin pharmacopoeial names plus plant part, as journals require

    2. **Collect compounds** (30-90 min) - Search each herb in TCMSP (499 herbs, 13,144 unique molecules); copy each
    ingredient table into a spreadsheet, adding a herb column by hand; herbs TCMSP lacks come from TCMID, BATMAN-TCM,
    HERB, ETCM or SymMap (Pulsatilla decoction: 4 herbs, 346 compounds)

    3. **Filter by absorption** (10 min) - Oral bioavailability >= 30% and drug-likeness >= 0.18 is the copied standard
    (354 compounds to 66 in one two-herb study); variants use OB >= 40% and DL >= 0.2, half-life >= 4 h, or SwissADME
    rules; some add back compounds measured in serum

    4. **Predict targets** (1-3 h of pasting) - TCMSP targets tab and/or SwissTargetPrediction one compound at a time
    from PubChem SMILES, Homo sapiens, at a probability cutoff anywhere from > 0 to 0.5 (the tool recommends none);
    yields of 180-670 targets

    5. **Normalize identifiers** (30-60 min) - UniProt ID mapping of protein names to human gene symbols, deduplicated;
    unmapped names drop without a count and spreadsheets turn some symbols into dates

    6. **Collect disease genes** (30 min) - GeneCards by keyword filtered by relevance score (>= 1, > 1 or > 10; the
    cutoff changes the list tenfold), unioned with OMIM, DisGeNET, TTD or CTD across spellings of the disease name

    7. **Intersect** (10 min) - Venny, jvenn or TBtools; the overlap (73-162 targets in published examples) is the
    "potential therapeutic targets" and the Venn diagram is Figure 1

    8. **Build the protein network** (15 min) - STRING multiple-protein query at a minimum score of 0.4, 0.7, 0.9 or 0.99,
    disconnected nodes hidden; the cutoff alone moves one study from 135 nodes and 2,348 edges to 70 nodes and 101
    edges

    9. **Screen core targets** (20-40 min) - Top 10 by degree; or cytoHubba top 10 by Maximal Clique Centrality, or the
    intersection of several methods' top 10; or CytoNCA median rules (degree at least twice the median, then above the
    median on betweenness, closeness, eigenvector and others); optional MCODE modules; figure in three panels (full,
    filtered, core ring)

    10. **Enrich** (20 min) - DAVID, Metascape or clusterProfiler at P < 0.05; top 10 GO bars and top 20-30 KEGG bubbles,
    often a genes-to-pathways Sankey; targets highlighted on a KEGG map

    11. **Compound-target-pathway network** (30 min) - Add pathway nodes, prune by degree (compounds >= 10, pathways >=
    10 targets); Pulsatilla: 172 nodes, 914 edges; pick two or three pathways to validate

    12. **Dock and validate** (half a day to weeks) - Top three or four compounds against the top five targets in
    AutoDock Vina, pass threshold usually -5.0 kcal/mol; then cell viability, western blots, qPCR and an animal model


    **Decision Points**:

    - Which absorption filter, and whether to add back measured compounds that fail it?

    - Which target-prediction probability cutoff, and one prediction source or two?

    - Which GeneCards relevance cutoff (it changes the disease list tenfold)?

    - Which STRING confidence cutoff (0.4 to 0.99 changes the network size by an order of magnitude)?

    - Which core-target rule: top-N degree, MCC, intersection of methods, or median multiples?

    - Which two or three enriched pathways are worth the bench budget?


    **Information Needs**:

    - Count at every step (compounds before and after the filter, targets before and after mapping, set sizes and
    overlap, nodes and edges after the STRING cutoff, survivors of each screening rule) kept consistent across methods,
    figures and tables

    - Which identifiers failed to map, listed rather than silently dropped

    - The herb each compound came from, and the set of herbs that reach each target

    - Degree and other centralities side by side, with the screening rule's thresholds shown

    - The surviving core subnetwork kept beside the full network, not replacing it

    - Pathway membership of each target, from an imported enrichment table


    **Pain Points**:

    - Every list travels between web tools through spreadsheets by hand, so counts drift and every full methods section
    read contained a contradiction (162 vs 130 intersection genes; 106 vs 131 vs 126 compounds)

    - Protein names must become gene symbols before anything joins, and failures drop silently

    - No tool does the set intersection and the network in one place; the Venn is a separate web tool

    - Results converge on the same compounds and targets regardless of formula (quercetin a key compound in 63.2% of
    465 studies, AKT1 a key target in 48.8% of 880), and nothing in the workflow flags it

    - A rule stated in Methods (median multiples) cannot be connected to the cutoffs used in Results


    **Data Flow**:

    - Input: Herb ingredient tables with ADME columns, predicted target lists with scores, disease gene lists with
    relevance scores, STRING interaction TSV, enrichment term tables

    - Transformations: ADME filter, identifier mapping, set intersection, protein-network import at a confidence cutoff,
    centrality ranking and screening rule, module detection, enrichment join as pathway nodes, degree pruning

    - Output: Venn counts, full, filtered and core protein networks, compound-target-pathway network, ranked target and
    compound tables, figures as PNG, PDF or SVG, supplementary spreadsheets
success_criteria:
    - metric: Count consistency
      target: Every count in the methods can be re-derived from the recorded inputs and thresholds
    - metric: Identifier mapping transparency
      target: User can state how many names mapped to gene symbols and list the ones that did not
    - metric: Core-target rule traceability
      target: The screening rule and its thresholds are stored with the surviving subnetwork
    - metric: Time from ingredient tables to core targets
      target: Under one working day instead of several
sources:
    - title: Network pharmacology of lotus leaf (PMC8566053)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8566053
      summary: 93 compounds to 15 by OB and DL, 189 targets, GeneCards relevance > 1, 135 intersected targets, STRING 0.4 with 2,348 edges, top 10 by degree (AKT1 103), DAVID enrichment
    - title: Pulsatilla decoction network pharmacology (Frontiers in Oncology 2023)
      url: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2023.1174848/full
      summary: 4 herbs, 346 compounds, 11,373 GeneCards genes, 162 intersected targets, STRING 0.99 gives 70 nodes and 101 edges, 172-node compound-target-pathway network
    - title: Two-herb pair network pharmacology (PMC7838196)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7838196
      summary: 354 compounds to 66, 136 intersected targets, CytoNCA median rule in Methods but fixed degree cutoffs in Results, docking table up to +4.5 kcal/mol reported as binding
    - title: TCMSP database paper
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4001360
      summary: 499 herbs, 29,384 ingredients, 13,144 unique molecules, 3,311 targets, twelve ADME properties; predicted targets filled by the SysDT model
    - title: STRING getting started
      url: https://string-db.org/help/getting_started/
      summary: Minimum interaction score thresholds medium 0.4, high 0.7, highest 0.9
    - title: cytoHubba paper
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4290687/
      summary: Eleven hub-ranking methods; Maximal Clique Centrality reported as most precise for yeast essential proteins
    - title: MCODE user manual
      url: https://baderlab.org/Software/MCODE/UsersManual
      summary: Module detection parameters (degree cutoff 2, node score 0.2, k-core 2, depth 100) copied into network pharmacology methods
    - title: Docking practice in network pharmacology (Frontiers in Pharmacology 2025)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2025.1566772/full
      summary: In 35 papers AutoDock Vina in 20, -5.0 kcal/mol threshold in 15, no positive controls in any, only 6 docked into a specific site
    - title: Homogeneous results in network pharmacology (Diao et al., Frontiers in Pharmacology 2026)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Quercetin a key compound in 63.2% of 465 studies and AKT1 a key target in 48.8% of 880
    - title: TCMDATA target retrieval tutorial
      url: https://yulab-smu.top/TCMDATA/target-retrieval.html
      summary: GeneCards relevance cutoff > 10 in a scripted version of the pipeline
