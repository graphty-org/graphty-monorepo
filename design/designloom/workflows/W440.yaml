starting_state:
    data_type: >-
        One stacked edge table (source, target, type: herb-compound, compound-target, target-pathway, target-disease)
        and a node table with a type column (herb, compound, target, pathway, disease), degree, herb of origin and a
        short-code label mapping
    node_count: 140-740
    edge_density: moderate
    user_expertise: novice to intermediate
goal: >-
    **Intent**: Draw the central figure of a network pharmacology paper: herbs, their compounds, the protein targets
    those compounds reach, and the pathways or disease those targets belong to, arranged as ordered tiers so a reader
    can follow "multi-component, multi-target" action from left to right or from the outer ring inward.


    **Mental Model**: "Layers." Figure legends speak of a "herbs layer" and a "targets layer". Each node type is a tier
    with its own shape and color; a compound hit by many edges is a "key active ingredient"; a target reached from many
    compounds shows "synergy".


    **Task Phases**:

    1. **Assemble one edge table** (20 min) - Stack herb-compound, compound-target, target-pathway and target-disease
    rows into source, target, type; build the node table with a type column

    2. **Import** (10 min) - Import the network from file, then the node table keyed on name; drop compounds with no
    target in the intersection

    3. **Style by type** (20-40 min) - Shape and color per type, chosen per paper ("green rhombuses are herbs, brown
    squares are components, blue dots are targets, red hexagons are pathways"); size by degree; compounds labeled by
    short codes (HQ1, HQ2 or MOL IDs) with a mapping table

    4. **Lay out in tiers** (20-60 min, the painful step) - In Cytoscape: Attribute Circle (one circle ordered by a
    column), Group Attributes (a circle per type), Hierarchical (layers from edge direction, not a column); none gives
    ordered tiers keyed on the type column with crossings reduced between adjacent tiers, so users drag nodes by hand;
    the R alternative is a herb-molecule-target Sankey

    5. **Read** (10 min) - Rank compounds and targets by degree; trace from a herb through its compounds to a chosen
    pathway

    6. **Export** (15 min) - Vector export, then fix labels and draw the legend in Illustrator


    **Decision Points**:

    - Tiers as columns, as concentric rings, or as a Sankey?

    - Which order of tiers, and which tier sits at the center?

    - Drop compounds without an intersected target, or keep them to show the full formula?

    - Label with full names or short codes plus a mapping table?

    - Prune pathways and compounds by a degree cutoff before drawing?


    **Information Needs**:

    - Node count per type and degree per node, labeled by layer (compound degree counts targets; target degree counts
    compounds)

    - The herb or herbs of origin for each compound and target

    - The path from any herb to a chosen pathway, highlighted on demand

    - Legend stating every shape and color by type and the size mapping


    **Pain Points**:

    - Force layout scatters the node types; hand-dragged tiers exist only in the saved session and cannot be
    regenerated when an input list changes

    - No layout takes the type column as the tier key and also orders nodes within a tier to reduce crossings

    - Labels overlap at 700 nodes; legend is redrawn by hand in Illustrator

    - Style conventions differ per paper, so the style is rebuilt for every network

    - Figures contradict their own tables (a top-five compound missing from the paper's compound table)


    **Data Flow**:

    - Input: Stacked typed edge table, node table with type, herb of origin, degree and short codes

    - Transformations: Typed import, per-type style, tiered layout keyed on a node column with crossing reduction,
    degree ranking, path highlighting

    - Output: Layered network figure with legend (SVG, PDF, PNG), short-code mapping table, saved arrangement that
    reloads identically
success_criteria:
    - metric: Tiered arrangement without hand dragging
      target: One action places every type in its own ordered tier with crossings visibly reduced
    - metric: Reproducible figure
      target: Reloading the project or replacing one input list redraws the same tiers and styles without manual edits
    - metric: Figure readiness
      target: Exported image includes a legend for type shapes, colors and size mapping
sources:
    - title: Cytoscape manual - Creating Networks
      url: https://manual.cytoscape.org/en/stable/Creating_Networks.html
      summary: Import network from file, then table from file keyed on node name
    - title: Cytoscape manual - Navigation and Layout
      url: https://github.com/cytoscape/cytoscape-manual/blob/956f3b70754d79fbe25502f76af88edc3278d690/docs/Navigation_and_Layout.md
      summary: Attribute Circle orders one circle by a node column; Group Attributes draws a circle per value; Hierarchical layers follow edge direction
    - title: Yougui Pill network pharmacology (PMC6877955)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6877955
      summary: Shape and color per type (green rhombus herbs, brown square components, blue dot targets, red hexagon pathways); degree pruning of compounds and pathways
    - title: Yinchensini decoction network pharmacology (PMC6317126)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6317126/
      summary: States the attribute circle layout was applied to the layered network
    - title: Herbs layer and targets layer figure (PMC6723118)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6723118
      summary: Figure legend describing tiered layers of herbs and targets
    - title: TCMDATA network construction
      url: https://yulab-smu.top/TCMDATA/network-construction.html
      summary: tcm_sankey draws herb-molecule-target flows; network view uses igraph force layouts with type by shape and color
    - title: Biostars thread on layering Cytoscape networks
      url: https://www.biostars.org/p/460186
      summary: Users drag node types into tiers by hand and fix labels outside Cytoscape
    - title: Two-herb pair network pharmacology (PMC7838196)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7838196
      summary: Compound-target network of 736 nodes and 3,034 edges; core compound-target-pathway network 143 nodes and 646 edges
