starting_state:
    data_type: >-
        LC-MS peak tables of the decoction and of dosed and blank animal serum (compound, m/z, prototype or metabolite);
        GEO or own RNA-seq differential expression tables (log fold change, adjusted p); WGCNA module membership;
        optional Mendelian randomization odds ratios, LASSO-selected genes and ROC AUC per gene; untargeted metabolomics
        (VIP, p)
    node_count: 150-400 in the compound-target network; 90-180 intersected targets
    edge_density: moderate
    user_expertise: intermediate to advanced
goal: >-
    **Intent**: Replace database compound lists and keyword disease-gene lists with measured data (compounds actually
    found in the product and in dosed-animal serum, genes actually changed in patients or models) so the mechanism is
    specific to the formula and survives review. Lab leads insist on this "precision network pharmacology"; a
    computational-only manuscript is routinely rejected.


    **Mental Model**: "Evidence tiers." A compound measured in serum outranks one listed in a database; a target
    changed in the disease outranks one named by a keyword search. When the measured list arrives, everything
    downstream must be re-derived.


    **Task Phases**:

    1. **Profile the product** (days, at the instrument) - UPLC-Q-TOF-MS of the decoction in positive and negative modes
    (one granule: 33 compounds identified, 9 selected)

    2. **Serum pharmacochemistry** (days) - Dose rats for about seven days; pool serum; call a compound absorbed when its
    peak is in dosed serum and absent from blank (one formula: 178 extract compounds to 77 absorbed parents plus 9
    metabolites); tag each compound with an evidence class (database-listed, measured in product, absorbed prototype,
    metabolite, absorbability predicted)

    3. **Predict targets** (1-3 h) - For the measured compounds, as in the standard pipeline

    4. **Measured disease genes** (hours in R) - limma differential expression from a GEO series (one study: 686 DEGs at
    logFC > 0.5, p < 0.05), optional batch correction and WGCNA modules; import the result table as numeric node columns

    5. **Re-derive the network** (minutes if the tool allows) - Swap the compound and disease lists, then intersect, build
    the protein network, screen and enrich again (one study: 181 common targets, STRING >= 0.9, 152 nodes, 1,352 edges,
    16 core genes)

    6. **Argue causality for a hub** (days in R) - Mendelian randomization, immune deconvolution, single-cell and ROC
    checks or LASSO; the hub list now comes from a model, imported as a column, not from degree

    7. **Overlay and filter** (20 min) - Color targets by fold change, mark compounds detected or not, filter to paths
    supported by measurement; join enriched pathways to key metabolites

    8. **Validate** in the animal model by RT-qPCR and blots


    **Decision Points**:

    - Which evidence classes stay in the figure, and whether database-only compounds are dropped or drawn differently?

    - Which DEG thresholds (|log2FC| > 1 vs > 0.5; adjusted vs raw p)?

    - Degree-based hubs or model-chosen hubs (LASSO, Mendelian randomization)?

    - Which measured paths are strong enough to send to validation?


    **Information Needs**:

    - Evidence class for every compound and how many fall in each class

    - Numeric measured columns (log fold change, adjusted p, AUC, odds ratio) on any node, with histograms to set
    gradient endpoints

    - What changes between the database-list network and the measured network (nodes added, dropped, hubs moved)

    - Which compound-target-pathway paths are supported by measurement at both ends


    **Pain Points**:

    - Replacing the compound list means redoing every downstream network, count and figure by hand, including styling
    and layout

    - A figure does not show which nodes were measured and which were only listed

    - R results (limma, WGCNA, Mendelian randomization) are joined to the network by hand

    - Popular compounds and targets fall sharply once measured data is used (quercetin from 71.9% to 42.3% of studies),
    but nothing shows the user that shift for their own study


    **Data Flow**:

    - Input: LC-MS peak lists with evidence class, DEG tables, module and model outputs, metabolomics tables

    - Transformations: Evidence-class tagging, list replacement with downstream re-derivation, numeric attribute join,
    overlay and filter by measured support, before-and-after comparison

    - Output: Measured-evidence network figure, evidence-class counts, before-and-after comparison, target table with
    measured columns
success_criteria:
    - metric: Re-derivation effort
      target: Replacing the compound or disease list rebuilds every downstream network and count without restyling or relayout
    - metric: Evidence visibility
      target: A reader of the exported figure can tell measured compounds from database-listed ones
    - metric: Comparison
      target: User can list which hubs survived the switch from database lists to measured data
sources:
    - title: Precision network pharmacology (Zhai et al. 2025, PMC11725223)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11725223
      summary: Argues for LC-MS of decoction and serum before prediction; ADME filters ignore abundance, processing and decoction
    - title: Guanyu Zhixie Granule study (PMC11149358)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11149358/
      summary: 33 compounds by UPLC-Q-TOF-MS, GSE76588 with 686 DEGs, 181 common targets, STRING 0.9, 47 key metabolites, RT-qPCR validation
    - title: Serum pharmacochemistry of a gastric-lesion formula (PMC7768900)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7768900
      summary: 178 extract compounds to 77 absorbed parents plus 9 metabolites, STITCH confidence > 0.4, 105 targets
    - title: Xijiao Dihuang Tang serum constituents (PMC8845118)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8845118/
      summary: 60 serum constituents (23 prototypes, 37 metabolites) feeding a 398-node, 985-edge compound-target network
    - title: Qinghuo Rougan Formula for uveitis (Frontiers in Molecular Biosciences 2025)
      url: https://www.frontiersin.org/journals/molecular-biosciences/articles/10.3389/fmolb.2025.1632027/full
      summary: GSE7850 with 216 DEGs, WGCNA module, degree and betweenness cutoffs for six hubs, LASSO with AUC 0.900
    - title: Dahuang-Huangqin acute lung injury study (Journal of Inflammation Research)
      url: https://www.dovepress.com/multi-target-synergy-against-acute-lung-injury-systems-pharmacology-de-peer-reviewed-fulltext-article-JIR
      summary: Herb targets intersected with disease genes and DEGs, then Mendelian randomization, CIBERSORT, single-cell and ROC checks
    - title: Homogeneous results in network pharmacology (Diao et al. 2026)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Quercetin falls from 71.9% to 42.3% of studies when experimental identification replaces database lists
