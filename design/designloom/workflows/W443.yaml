starting_state:
    data_type: >-
        A herb-compound-target network with a herb-of-origin column; a target-pathway membership matrix; a
        targets-pathways-diseases table with ICD-11 classes; literature co-occurrence counts for validation
    node_count: 280-700
    edge_density: dense after one-mode projection (279 nodes, 6,549 edges in one study)
    user_expertise: intermediate to advanced
goal: >-
    **Intent**: Explain why a formula combines these particular herbs (what each contributes, what they share) and
    which other diseases the formula's targets point to. Formula papers use this to rationalize a prescription.


    **Mental Model**: "Each herb brings its own set." Per-herb compound and target sets overlap a little; the shared part
    is the synergy, the unique parts are each herb's role. Projecting the two-mode target-pathway graph onto targets
    shows which targets hold the system together.


    **Task Phases**:

    1. **Keep per-herb provenance** (30 min) - Every compound keeps its herb; every target keeps the set of herbs that
    reach it (in spreadsheets this label rarely survives the joins)

    2. **Compare the sets** (20 min) - Per-herb compound and target sets (one two-herb pair: 20 compounds from one herb,
    48 from the other, 2 shared); eight to twelve herbs exceed what a Venn diagram can draw

    3. **Project two-mode to one-mode** (1-2 h across tools) - Turn the target-pathway matrix into a one-mode target
    network (Xiaoyao decoction: Pajek, then Gephi; 279 nodes, 6,549 edges)

    4. **Rank by removal impact** (hours with custom code) - Loss of network efficiency when each target is removed; keep
    the top 10% (28 targets); check the ranking against literature co-occurrence (Spearman r = 0.388 for efficiency vs
    0.346 for degree against full texts)

    5. **Reposition** (1 h) - Directed targets-pathways-diseases network; keep pathways at in-degree > 10, read diseases
    classified by ICD-11 at in-degree > 20


    **Decision Points**:

    - How many herbs to compare, and whether a many-set view replaces the Venn?

    - Which projection weight (shared pathway count or a normalized score)?

    - Which ranking (efficiency loss, degree, betweenness) and what share to keep?

    - Which in-degree cutoffs make a disease a repositioning candidate?


    **Information Needs**:

    - Set sizes and intersections across 2-12 herbs, with members of each intersection selectable

    - Herb membership as a per-node attribute after every join

    - Degree labeled by layer after projection

    - Efficiency loss per removed node next to degree and betweenness


    **Pain Points**:

    - Herb provenance is lost when lists are joined in spreadsheets

    - Projection, analysis and removal ranking span Pajek, Gephi and custom Python

    - Venn tools stop at a handful of sets


    **Data Flow**:

    - Input: Herb-compound-target network with herb column, target-pathway matrix, pathway-disease table

    - Transformations: Per-herb set comparison, one-mode projection, removal-impact ranking, directed in-degree
    filtering

    - Output: Herb contribution table, ranked target list, repositioning disease list, network figures
success_criteria:
    - metric: Provenance survival
      target: Every target shows which herbs reach it after all joins
    - metric: Single-tool projection and ranking
      target: Projection and removal-impact ranking run without leaving the tool or writing code
    - metric: Many-set comparison
      target: Up to twelve herb sets compared with counts and selectable intersections
sources:
