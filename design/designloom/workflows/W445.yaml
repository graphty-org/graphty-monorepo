id: W445
name: Selecting Quality-Marker Compounds From a Layered Formula Network
category: analysis
validated: false
personas:
    - network-pharmacology-researcher
requires_capabilities:
    - data-import
    - computed-attributes
    - centrality-degree
    - filtering
    - node-selection
    - selection-statistics
    - visual-encoding-nodes
    - legend-display
    - layout-hierarchical
    - details-on-demand
    - report-generation
    - export-image
    - data-export
