starting_state:
    data_type: >-
        A "formula - herbs - compounds - targets - pathways" network; UPLC-QTOF-MS identifications (64-128 compounds);
        compound content measured across 15-40 batches; optional bioassay results
    node_count: 80-300
    edge_density: moderate (79 nodes and 281 edges in one study)
    user_expertise: intermediate to advanced
goal: >-
    **Intent**: Choose the few compounds a quality standard for an herbal product should assay. Manufacturers and
    regulators-facing labs weigh network importance together with measured content and detectability; the deliverable
    is a product specification, not a paper figure.


    **Mental Model**: "Important, present and measurable." A marker must matter to the effect (degree or bioassay),
    be present in useful amounts across batches, and be detectable by the assay.


    **Task Phases**:

    1. **Characterize** (days) - UPLC-QTOF-MS identification (64 or 128 compounds) and batch fingerprints (40 batches)

    2. **Measure content** (days) - Content of candidate compounds across batches

    3. **Build the layered network** (1-2 h) - Formula, herbs, compounds, targets, pathways

    4. **Rank by effect and content** (1 h) - Combine degree, bioassay and content, for example by grey relational
    analysis

    5. **Choose markers and write the assay** - Six to ten compounds and a UPLC-DAD method


    **Decision Points**:

    - How to weigh network degree against content and detectability?

    - How many markers, and from which herbs (each herb represented)?


    **Information Needs**:

    - Degree, content mean and batch variation, and detectability side by side for each compound

    - Herb of origin per candidate

    - A combined score from attributes, not topology alone


    **Pain Points**:

    - Network tools rank by topology only; content and detectability live in spreadsheets

    - Combined scoring is done in separate statistics software


    **Data Flow**:

    - Input: Layered formula network, compound content and detectability tables

    - Transformations: Attribute join, combined score from topology and measured attributes, ranking and selection

    - Output: Marker list with scores, network figure highlighting markers, specification tables
success_criteria:
    - metric: Combined ranking
      target: Compounds ranked by a score mixing degree with content and detectability in one table
    - metric: Herb coverage
      target: User can see which herbs the chosen markers represent
