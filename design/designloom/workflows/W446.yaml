      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10767940
      summary: 17,068 known and 2,319,272 predicted ingredient-target interactions; network views with edge width proportional to confidence; top 20 predicted targets per compound; JSON API
    - title: ETCM v2.0 (PMC10326295)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10326295
      summary: JavaScript network visualization tool with editing, layout control, filtering and SVG or JPG export
    - title: Drugst.One (PMC10274948)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10274948
      summary: Embeddable protein-drug-disease explorer integrated into 21 tools with as little as three lines of code; GraphML export
    - title: Cytoscape Web (Ono et al., Nucleic Acids Research 2025)
      url: https://idekerlab.ucsd.edu/wp-content/uploads/2025/05/Ono-NucleicAcidsRes-2025.pdf
