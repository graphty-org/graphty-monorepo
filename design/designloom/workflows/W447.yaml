starting_state:
    data_type: >-
        Compound and target lists from two or more databases with versions and access dates; a STRING network of the
        intersected targets; the study's thresholds; frequent-hitter and PAINS flags; docking results
    node_count: 100-700
    edge_density: moderate
    user_expertise: intermediate to expert
goal: >-
    **Intent**: Show that a network pharmacology result does not depend on one database, one cutoff or one centrality,
    and that every number in the paper can be traced to an input. Reviewers and editors ask for this; authors rarely do
    it. Journal rules require experimental support and a network drawn so the mechanism and individual data points are
    visible.


    **Mental Model**: "Would the hubs survive a different choice?" Each node and edge carries where it came from and
    how strong the evidence is; excluding the weakest class and changing each threshold should leave the conclusion
    standing.


    **Task Phases**:

    1. **Cross-check sources** (1-2 h) - Pull compounds and targets from two or more databases, record overlap, prefer
    targets predicted by two sources; record every database version and access date

    2. **Flag frequent hitters** (30 min) - Mark frequent-hitter and pan-assay interference compounds and
    popular targets that appear in most studies regardless of formula

    3. **Re-run hub ranking** (30 min) - At several STRING cutoffs (0.4, 0.7, 0.9) and with betweenness, eigenvector or
    propagation; report which hubs persist

    4. **Exclude by evidence class** (15 min) - Drop predicted edges and see what survives

    5. **Enrichment check** (30 min) - GSEA or topology-aware enrichment, with the background gene set reported

    6. **Dock properly** (days) - Known site, positive control, second program

    7. **Report** (1 h) - Every database version, access date, threshold and full list; counts at every step


    **Decision Points**:

    - Which alternative cutoffs and centralities make a fair sensitivity check?

    - Is a hub that appears only at one cutoff reportable?

    - Which flagged compounds or targets to drop or caveat?


    **Information Needs**:

    - Source, version, access date and evidence class (curated, predicted with native score, text-mined, measured) on
    every node and edge

    - Hub lists at each cutoff and centrality side by side with persistence counts

    - Which threshold removed which nodes

    - Popularity or frequent-hitter flags on compounds and targets


    **Pain Points**:

    - Database versions are rarely recorded, so a study cannot be reproduced even by its author a year later

    - Re-running at another cutoff means repeating the web-tool chain by hand

    - Every full methods section read contained an internal contradiction in its counts

    - No risk-of-bias tool exists for network pharmacology studies


    **Data Flow**:

    - Input: Multi-source compound and target lists with provenance, protein network, thresholds, flag lists

    - Transformations: Provenance-tagged merge, evidence-class exclusion, threshold and centrality sweeps, hub
    persistence comparison

    - Output: Sensitivity table of hub persistence, provenance record exportable as a methods paragraph, flagged-node
    report
success_criteria:
    - metric: Hub persistence
      target: User can state which hubs persist across three STRING cutoffs and two centralities in one table
    - metric: Evidence exclusion
      target: Excluding predicted edges shows the surviving network in one action
    - metric: Provenance completeness
      target: Every source, version, access date and threshold exports with the network
sources:
    - title: Homogeneous results in network pharmacology (Diao et al. 2026)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2026.1748478/full
      summary: Remedies include in vivo exposure data, frequent-hitter screening, debiased target prediction, GSEA with a reported background and context-aware centrality
    - title: Network pharmacology critique (Wang et al., Frontiers in Pharmacology 2024)
      url: https://www.frontiersin.org/journals/pharmacology/articles/10.3389/fphar.2024.1303693/full
      summary: Methodological problems and recommendations for robust network pharmacology
    - title: PAINS and flavonoids (PMC10264668)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10264668
      summary: Pan-assay interference and unreachable concentrations among common flavonoid hits
    - title: Single-database dependence (PMC9143318)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9143318
      summary: Studies depend on usually one single database
    - title: Frontiers in Pharmacology Four Pillars of Best Practice
      url: https://www.frontiersin.org/files/pdf/4_pillars_FULL_TEXT.pdf
      summary: Network analysis must be combined with experimental pharmacology and drawn so the mechanism and individual data points can be understood
    - title: Two-herb pair network pharmacology (PMC7838196)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7838196
      summary: Dates every database source, a rare practice
