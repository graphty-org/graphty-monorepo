    - title: bibliometrix mergeDbSources reference
      url: https://search.r-project.org/CRAN/refmans/bibliometrix/html/mergeDbSources.html
      summary: Merges sources with remove.duplicated
    - title: bibliometrix biblioNetwork source
      url: https://raw.githubusercontent.com/massimoaria/bibliometrix/master/R/biblioNetwork.R
      summary: Collaboration, co-citation, coupling and co-occurrence matrices
    - title: bibliometrix networkPlot source
      url: https://raw.githubusercontent.com/massimoaria/bibliometrix/master/R/networkPlot.R
      summary: Normalizations, clustering algorithms, layouts and seed default 123
    - title: bibliometrix thematicMap source
