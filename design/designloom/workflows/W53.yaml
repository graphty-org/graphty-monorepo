starting_state:
    data_type: Exports from two or more databases (Web of Science, Scopus, Dimensions, Lens, OpenAlex, PubMed) for the same query
    node_count: 1,000-10,000 records producing maps of 50-500 items
    edge_density: medium
    user_expertise: intermediate+
goal: >-
    **Intent**: Combine exports from Web of Science and Scopus (and sometimes Dimensions, Lens, OpenAlex or PubMed) into
    one deduplicated corpus, build networks from it, and draw a thematic map that sorts keyword clusters into motor,
    niche, basic and emerging-or-declining themes. Merging is needed because no single database covers a field and
    VOSviewer cannot combine sources.


    **Mental Model**: "Two catalogs, one library." Each database describes the same papers with different field names,
    author forms and reference formats; the merge maps them to one schema and keeps one record per paper, and every
    network is computed from the merged records.


    **Task Phases**:

    1. **Export each source** (hours) - Within each database's export limit; record queries and dates

    2. **Convert** (5 min) - convert2df(file, dbsource, format) maps each source to Web of Science field tags

    3. **Merge and deduplicate** (10 min) - mergeDbSources(..., remove.duplicated = TRUE), by DOI and then by normalized
    title; check how many duplicates were dropped

    4. **Build networks** (10 min) - biblioNetwork(M, analysis, network) for collaboration, co-citation, coupling or
    co-occurrence matrices

    5. **Plot networks** (30 min) - networkPlot with normalization (association, Jaccard, inclusion, Salton,
    equivalence), number of vertices, clustering (Louvain, Leiden, Infomap, Walktrap), layout (Fruchterman-Reingold,
    Kamada-Kawai, MDS), seed 123 by default

    6. **Thematic map** (30 min) - thematicMap clusters keyword co-occurrence and plots each cluster's Callon centrality
    (links to other clusters) against density (internal links) into four quadrants

    7. **Hand off** (variable) - Export the merged data; when the merged keyword field breaks VOSviewer, users write their
    own fix


    **Decision Points**:

    - Which sources to combine, and which wins when two records disagree?

    - Deduplicate by DOI only, or by title plus author plus year as well?

    - Which normalization and clustering algorithm?

    - How many vertices to plot?


    **Information Needs**:

    - Per-source record counts, overlap counts and duplicates removed

    - Fields that were missing or truncated in one source (references, keywords)

    - Cluster centrality and density values behind the thematic quadrants

    - The seed and every network parameter used


    **Pain Points**:

    - The merged output's keyword field is unreadable by VOSviewer, forcing a custom script

    - Scopus references were capped at 10 per document during 2025, so some corpora are truncated

    - Walktrap tends to give trivial clusters

    - Moving between R and a GUI map tool loses parameters and seeds


    **Data Flow**:

    - Input: Plain-text, CSV or BibTeX exports from several databases

    - Transformations: Field mapping to a common schema, deduplication, bipartite-to-unipartite projection by analysis
    type, normalization, clustering, layout, Callon centrality and density per cluster

    - Output: Merged corpus, network plots, thematic map, exported networks and data
success_criteria:
    - metric: Merge transparency
      target: User can state how many records came from each source and how many duplicates were removed
    - metric: Downstream compatibility
      target: The merged corpus and its networks export in formats VOSviewer, Gephi and Pajek read without custom scripts
    - metric: Thematic map
      target: Quadrant placement of each cluster with its centrality and density values visible
