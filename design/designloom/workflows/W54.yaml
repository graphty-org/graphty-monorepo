starting_state:
    data_type: A department's or center's publications for 5-10 years plus a staff roster with ORCID or Scopus Author IDs
    node_count: hundreds to a few thousand records; 50-300 organizations or authors shown
    edge_density: sparse to medium
    user_expertise: intermediate
goal: >-
    **Intent**: Answer a leadership question such as "who do we collaborate with?" or "which of our groups bridge to
    which partners?" with organization, country and author co-authorship maps and a short report for a non-technical
    audience, inside a fixed staff-hour budget.


    **Mental Model**: "A briefing, not a paper." The dean wants an answer and a picture; the librarian wants a method
    that holds up and that can be rerun for the next department.


    **Task Phases**:

    1. **Intake and scoping** (1 hour) - Clarify the question, units and years; the NIH Library caps basic service at 20
    staff hours per report with an 8-week turnaround

    2. **Decide whether a network is needed** (15 min) - SciVal's collaboration module answers many questions with a
    world map and collaborator table; a network adds structure (bridges, co-author clusters, topic structure)

    3. **Export data** (1-3 hours) - Within each database's export limit, or from OpenAlex, Crossref, Europe PMC,
    Semantic Scholar or OpenCitations APIs

    4. **Clean** (4-10 hours) - Match authors to the roster by ORCID or Scopus ID, build thesauri for organization and
    name variants, cap authors per document

    5. **Map** (2-3 hours) - Organization and country co-authorship with fractional counting, author co-authorship
    colored by internal unit, keyword co-occurrence for topics

    6. **Deliver** (2-4 hours) - Summary for non-technical readers, annotated figures, top-partner table, documented
    methods; sometimes a dashboard or interactive link


    **Decision Points**:

    - Does this question need a network, or does a table and world map answer it?

    - Which name variants are the same organization or person?

    - Full or fractional counting, and what cap on authors per paper?

    - Which partners and bridges to call out in the summary?


    **Information Needs**:

    - Roster match rate (matched, unmatched, ambiguous authors)

    - Top partner organizations and countries by joint papers

    - Which internal authors or units connect to which external partners (bridges)

    - Possible homonyms: one name node with implausibly diverse affiliations or topics


    **Pain Points**:

    - Name homonyms create false bridges, worst for common Chinese and Korean surnames

    - Each report is rebuilt by hand from scratch

    - The hour budget cuts cleaning short

    - Readers unfamiliar with network maps need annotation and plain-language legends


    **Data Flow**:

    - Input: Publication records with authors and affiliations; staff roster with identifiers

    - Transformations: Roster join by identifier, name and organization merges, author cap, co-authorship projection at
    author, organization and country level with fractional counting, clustering, centrality

    - Output: Annotated maps, partner tables, plain-language summary, methods appendix, optional interactive link
success_criteria:
    - metric: Rerun cost
      target: The same cleaning and mapping steps applied to a new department in under an hour
    - metric: Identity transparency
      target: Report states the roster match rate and flags ambiguous names
    - metric: Reader comprehension
      target: A non-technical reader can name the top three partners and one bridge from the annotated figure
