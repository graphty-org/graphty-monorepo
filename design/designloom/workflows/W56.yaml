starting_state:
    data_type: Records with cited references (papers from Web of Science or OpenAlex, or patents with backward citations) forming a direct citation network
    node_count: 500-20,000 documents; main path of 10-60 documents shown
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Find the backbone of knowledge flow in a field or technology: the chain of documents through which most
    citation paths pass, drawn chronologically as a historiograph, and complemented by the years of the field's
    historical roots.


    **Mental Model**: "The river through the delta." A citation network is a delta of many small channels from old
    sources to new sinks; the main path is the channel that carries the most flow.


    **Task Phases**:

    1. **Build the direct citation network** - From records with cited references; keep only citations inside
    the corpus

    2. **Make it acyclic** - Remove or shrink cycles from mutual or same-year citations

    3. **Compute traversal weights** - SPC (search path count: source-to-sink paths through each link), SPLC or
    SPNP; in Pajek via Network > Acyclic Network > Create Weighted Network + Vector > Traversal Weights, or with mpaR in R

    4. **Search for the main path** - Local "priority first" search follows the heaviest outgoing link; global
    search finds the chain with the largest total weight; key-route search forces the top key links into the path and
    adds detail as their number grows

    5. **Draw** - A year-layered directed graph with time on one axis, as in HistCite historiographs;
    bibliometrix histNetwork returns the matrix for one

    6. **Complement with RPYS** - Plot the distribution of cited references' publication years to find
    historical roots; compare with the main path, since the two can disagree


    **Decision Points**:

    - Which weight (SPC, SPLC, SPNP) and which search (local, global, key-route with how many key links)?

    - How to break cycles without distorting the history?

    - Which documents on the path deserve a narrative paragraph?


    **Information Needs**:

    - Number of cycles found and how they were resolved

    - Link weight distribution and the top key links

    - Path documents with year, title, weight and citations in corpus

    - The RPYS spectrum with peak years and the references behind each peak


    **Pain Points**:

    - Pajek's menus are the main tool, and its usability has no published evaluation (no source found)

    - Generic layouts ignore time, so the historiograph is drawn by hand or in a separate tool

    - Static and over-time analyses of one corpus can disagree, and nothing shows both together


    **Data Flow**:

    - Input: Documents with publication years and cited references

    - Transformations: In-corpus citation filtering, cycle removal, traversal weights, main path search, year-layered
    layout, cited-year distribution

    - Output: Main path figure, path document table, RPYS chart, exported weighted network
success_criteria:
    - metric: Time to a main path from loaded records
      target: Under 15 minutes without leaving the tool (design goal; no source measures it)
    - metric: Method coverage
      target: SPC, SPLC and SPNP weights with local, global and key-route search
    - metric: Chronological readability
      target: Every node on the drawn path sits at its publication year
