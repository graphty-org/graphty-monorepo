starting_state:
    data_type: case sampling dates with sequences or a dated phylogeny, plus generation-time and incubation-period distributions
    node_count: 20-500
    edge_density: sparse
    user_expertise: expert
goal: >-
    **Intent**: Estimate who infected whom, and when, with the uncertainty kept rather than resolved: a probability
    on each possible transmission link, several candidate infectors per case, and unsampled intermediate hosts
    inferred rather than ignored. This is academic and field-investigation analysis, and its output is read against
    the interviews.


    **Mental Model**: "Not one tree, a distribution over trees." Each sampled transmission tree is one possible
    history. The answer is how often a given person appeared as the infector of a given case, which means every edge
    is a weight and every node may have several parents.


    **Task Phases**:

    1. **Choose the approach** (30 min) - One method works from case data directly; another works from a dated
    phylogeny, which has to be built first

    2. **Run the case-data method** (hours) - Supply sampling dates, genetic data as sequences or a tree, and
    generation-time and incubation-period distributions; it samples the transmission tree, infection times and
    unobserved cases as augmented data

    3. **Check convergence** (30 min) - Read the trace of the sampling chain before reading any result

    4. **Read the posterior ancestries** (1 hour) - A plot in which the size of each circle is how often that
    individual was sampled as the infector of a given case, with the index case shown as infector zero

    5. **Run the phylogeny-based method** (hours to days) - Start from a dated phylogeny whose leaves sit at sampling
    dates; it returns who infected whom and when including unsampled intermediate hosts, a phylogeny colored by host
    so a color change marks a transmission event, a matrix of the probability of direct transmission for every pair,
    a matrix of the number of transmission steps between pairs, and a medoid tree as a single summary

    6. **Draw it with the uncertainty intact** (hours) - Every edge carries a probability and a node can have several
    candidate ancestors, so the drawing needs edge opacity or width by probability and a way to show the
    alternatives rather than only the consensus parent

    7. **Compare with the interviews** (hours) - Read the posterior ancestries against the contact data;
    disagreements are either a missing interview link or an unsampled case


    **Decision Points**:

    - Which method the available data supports: case data with sequences, or a dated phylogeny

    - Which generation-time and incubation-period distributions to assume, and how much the result moves when they
    change

    - Whether the chain has converged well enough to report anything

    - Whether to present the consensus tree, the medoid tree, or the probability matrix

    - How to say in public that a named person probably infected another, which is epidemiologically useful and
    legally and ethically sensitive


    **Information Needs**:

    - A probability per candidate infector per case, not a single assignment

    - Unsampled intermediate hosts drawn as inferred nodes, visibly different from observed cases

    - Convergence diagnostics beside the result

    - Pairwise matrices of direct-transmission probability and number of transmission steps

    - A single summary tree for briefing, with the distribution still reachable

    - The assumed distributions recorded with the output


    **Pain Points**:

    - Outputs are static plots and matrices, not an interactive network, so exploring alternatives means re-plotting

    - A consensus picture hides exactly what the method was run to produce: the alternatives

    - Runs are long and must be re-run whenever an assumption changes

    - R is required, which limits who can run or re-run it during a response

    - Inferring direction between named people is ethically loaded, and public health guidance stresses that
    molecular analysis cannot determine that a specific person transmitted to another


    **Data Flow**:

    - Input: Case sampling dates, sequences or a tree, generation-time and incubation-period distributions; or a
    dated phylogeny with leaves at sampling dates

    - Transformations: Markov chain Monte Carlo sampling over transmission trees, infection times and unobserved
    cases; per-pair direct-transmission probability and transmission-step counts; host coloring of the phylogeny;
    medoid tree selection

    - Output: A weighted directed transmission network with candidate ancestors per case, inferred unsampled hosts,
    pairwise probability and step matrices, a summary tree, and a comparison against the contact data
success_criteria:
    - metric: Uncertainty preserved
      target: Every edge shows its probability and every case its alternative infectors, not just a consensus parent
    - metric: Inferred nodes distinguishable
      target: Unsampled intermediate hosts are visually distinct from observed cases
    - metric: Interview comparison
      target: Disagreements between the inferred network and the contact data can be listed
sources:
    - title: Campbell et al., outbreaker2 - a modular platform for outbreak reconstruction (BMC Bioinformatics 2018)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6196407/
      summary: Sampling dates plus genetic data plus generation-time and incubation-period distributions; transmission tree, infection times and unobserved cases as augmented data; the chain object with trace plots and a posterior ancestry plot sized by how often each individual was sampled as infector, with the index case as infector zero
    - title: Didelot et al., TransPhylo (Current Protocols 2021)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7995038
      summary: Dated phylogeny input, inference of unsampled intermediate hosts, host-colored phylogeny where a color change marks transmission, pairwise direct-transmission probability and transmission-step matrices, and a medoid tree summary
    - title: CDC on what molecular HIV cluster analysis can and cannot show
      url: https://www.cdc.gov/hivcluster
      summary: Molecular analysis cannot determine that a specific person transmitted to another person, the constraint on how any who-infected-whom result may be communicated
