id: W76
name: Incident Triage on a Service Map
category: analysis
validated: false
personas:
    - sre-incident-responder
requires_capabilities:
    - data-import
    - search
    - filtering
    - saved-filters
    - visual-encoding-nodes
    - visual-encoding-edges
    - legend-display
    - ego-network
    - neighborhood-expansion
    - path-highlighting
    - hover-highlight
    - details-on-demand
    - temporal-navigation
    - large-graph-rendering
    - layout-hierarchical
    - export-image
    - multiplex-relations
    - group-collapse
    - directed-closure
    - focus-caller-callee-view
    - graph-diff
