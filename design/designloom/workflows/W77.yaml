      url: https://neo4j.com/developer/industry-use-cases/agnostic/it-service-graph/it-service-graph
      summary: Typed model, count of distinct dependents, redundancy check for important customers
    - title: GraphAware - Insightful IT operations with Hume
      url: https://graphaware.com/blog/insightful-it-operations-with-hume/
      summary: Bottom-up impact query following DEPENDS_ON in reverse with variable length
    - title: Linkurious - Network management and impact analysis with Neo4j
      url: https://linkurious.com/blog/network-management-and-impact-analysis-with-neo4j/
      summary: Affected services and customers for a maintenance window; schedule or reroute
    - title: ServiceNow - CI relationships
      url: https://www.servicenow.com/docs/r/yokohama/servicenow-platform/configuration-management-database-cmdb/c_CIRelationships.html
      summary: Typed relationship pairs
