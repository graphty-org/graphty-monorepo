    - title: Nx - Explore your workspace
      url: https://nx.dev/docs/features/explore-graph
      summary: nx graph --file writes the project graph as JSON; nx affected --graph; "Viewing the entire graph can be unmanageable even for smaller repositories"
    - title: Nx - large-ts-monorepo benchmark
      url: https://github.com/nrwl/large-ts-monorepo
      summary: Benchmark project graphs of 10 to 253 packages and 220 to 5,566 TypeScript files
    - title: Nx - The butterfly effect, a 100x faster linter
      url: https://dev.to/nx/the-butterfly-effect-how-we-gave-the-linter-a-100x-boost-4nl9
      summary: Nx team on "large monorepos with thousands of projects"
    - title: Terraform - graph command
      url: https://developer.hashicorp.com/terraform/cli/commands/graph
      summary: DOT of resource ordering, -type=plan, -draw-cycles
    - title: Spacelift - Terraform graph
      url: https://spacelift.io/blog/terraform-graph
      summary: Large graphs dense and hard to read; grep by module; Rover, Blast Radius, Inframap alternatives
