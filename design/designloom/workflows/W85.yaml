    - title: Lattix DSM paper (OOPSLA 2005)
      url: https://groups.csail.mit.edu/sdg/pubs/2005/oopsla05-dsm.pdf
      summary: A DSM appears to overcome scaling problems of node-link views
    - title: dependency-cruiser
      url: https://www.npmjs.com/package/dependency-cruiser
      summary: Forbidden rules such as no circular imports, failing CI
    - title: madge
      url: https://github.com/pahen/madge
