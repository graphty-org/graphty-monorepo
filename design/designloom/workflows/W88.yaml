      url: https://academy.maltego.com/workflow-digital-footprint-desktop
      summary: Alias profile search, leaked records, personal-detail extraction; each new alias is a new seed; distinctive seeds
    - title: Maltego - Setting the transform result limit slider
      url: https://support.maltego.com/en/support/solutions/articles/15000061694-setting-the-transform-result-limit-slider
      summary: Small, Balanced and Large result limits; Large increases graph complexity and load time
    - title: Maltego - Collections tab
      url: https://docs.maltego.com/support/solutions/articles/15000010775-collections-tab
      summary: Same-type entities sharing parents and children fold into collections (minimum 25); pinning; noted entities never collected
    - title: Maltego - Graph sidebar
      url: https://docs.maltego.com/support/solutions/articles/15000009615-graph-sidebar
      summary: Sizing by links, entity rank or weight; list view of the graph
    - title: Maltego - Export graph as XML (GraphML)
      url: https://docs.maltego.com/support/solutions/articles/15000019396-export-graph-as-xml
      summary: GraphML in Maltego, yEd and Gephi dialects, optionally selected entities only, or CSV
