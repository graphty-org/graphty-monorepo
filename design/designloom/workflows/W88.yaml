      url: https://www.maltego.com/blog/the-networks-behind-the-headlines/
      summary: Tag ids from six seed sites led to seven more sites sharing them
    - title: EBU Spotlight - Investigative network mapping and link analysis
      url: https://spotlight.ebu.ch/p/investigative-network-mapping-link
      summary: Run only transforms that yield relevant data; betweenness in Gephi for gatekeepers; GEXF keeps metrics and layout (read via search summary)
