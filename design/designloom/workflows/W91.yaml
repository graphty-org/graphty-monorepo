      url: https://paldhous.github.io/NICAR/2016/gephi.html
      summary: Spreadsheet import, directed-by-default warning, Fruchterman-Reingold, 0.67 weight range filter, betweenness, visible-only export
    - title: Online Journalism Blog - A journalist's introduction to network analysis (2020)
      url: https://onlinejournalismblog.com/2020/06/08/a-journalists-introduction-to-network-analysis/
      summary: Define the relationship first; nodes and connections sheets; measures in one sentence
    - title: First Draft - How to use network analysis to explore social media and disinformation
      url: https://firstdraftnews.org/latest/how-to-use-network-analysis-to-explore-social-media-and-disinformation/
      summary: Starting from one person makes that person look central; pictures are not conclusive charts
    - title: Kumu - Import from Google Sheets
      url: https://docs.kumu.io/guides/import/google-sheets
      summary: Shared sheet link that refreshes on reload (read via search summary)
    - title: LittleSis - Oligrapher for beginners
      url: https://littlesis.org/news/littlesiss-oligrapher-for-beginners
      summary: Hand-drawn power maps (read via search summary)
    - title: Miriam Posner - Flourish network graph tutorial (2021)
      url: https://miriamposner.com/classes/dh201w21/tutorials-guides/network-analysis/flourish-graph
      summary: Points and Links sheets, arrows off, maximum width, popups, embed
