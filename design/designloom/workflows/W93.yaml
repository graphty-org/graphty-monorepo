starting_state:
    data_type: account records with shared signals (devices, IPs, emails, phones, payment instruments, content hashes) or co-sharing events (object, account, content, timestamp)
    node_count: no source found for the size of a working graph per case; warehouses hold millions of accounts
    edge_density: unknown
    user_expertise: expert
goal: >-
    **Intent**: From a few accounts already known to be violative, find the whole network that shares infrastructure
    or acts in lockstep, review it by hand, and enforce on it at once. This is a reconstruction from vendor blogs, a
    fraud-clustering paper, a coordination-detection package and platform policy, not a documented trust-and-safety
    procedure.


    **Mental Model**: "No signal proves much by itself; the proof is in the pattern." Accounts are linked through the
    values they share; a hard link (phone, card, national id) means more than a soft link (device fingerprint, cookie,
    IP).


    **Task Phases**:

    1. **Seeds** - User reports, classifier hits or a partner's tip give a small set of known-bad accounts

    2. **Pull signals** (SQL) - Technical: shared devices, serialized email patterns, IPs within a short
    window, phone numbers, payment methods, domain registrations, redirect chains; behavioral: near-identical content,
    shared branding

    3. **Build the account-to-attribute graph** - Project it onto accounts, weighting hard links above soft
    links; take connected components over shared attributes

    4. **Build a coordination network** - From four columns (object id, account id, content id, share
    timestamp) link accounts that shared the same object within a time window (examples of 60, 30 and 10-20 seconds),
    with a minimum participation (examples 1 and 2), keeping edges at or above a weight threshold whose default is
    the median; two platforms in one input do not by themselves establish cross-platform coordination

    5. **Human review** - Inspect each cluster; split supposed networks that are really several groups linked
    only by mentions of common public figures or popular hashtags; check that shared attributes are not innocent
    (shared wifi, shared devices)

    6. **Enforce at network level** - Act on behavior, not content, and only on assets directly involved;
    feed confirmed indicators back into detection

    7. **Report** - Internal case write-up or public threat report


    **Decision Points**:

    - Which shared values count as hard links and which as soft?

    - What time window and weight threshold define coordination for this case?

    - Is a bridge between clusters a real operator link or a coincidence?

    - Which accounts are directly involved and which are authentic bystanders?


    **Information Needs**:

    - For each account-to-account edge, which shared values created it and their kind (hard or soft)

    - Component sizes and how many seeds each contains

    - The time gaps between co-shares behind a coordination edge

    - Edges that would disappear at a stricter threshold


    **Pain Points**:

    - Shared attributes that link innocent users

    - Proving coordination rather than coincidence, with no ground truth

    - Graph views that cannot show why two accounts are linked

    - Legally restricted data that cannot leave internal systems


    **Data Flow**:

    - Input: SQL extracts of accounts and their attribute values; or a four-column co-sharing table

    - Transformations: Bipartite account-to-attribute graph, projection with hard and soft weights, connected
    components, time-windowed co-action edges, weight threshold, community detection

    - Output: Reviewed clusters with per-edge evidence, enforcement list, indicator list, report
success_criteria:
    - metric: Edge explanation
      target: Every account-to-account edge lists the shared values or co-shares that created it
    - metric: Threshold sensitivity
      target: User sees how cluster membership changes when the time window or weight threshold changes
    - metric: Bystander separation
      target: Reviewer can mark accounts as not involved and see the remaining network
sources:
    - title: LegitScript - How network investigators stop bad actors on platforms
      url: https://www.legitscript.com/fraud-risk-and-prevention/how-network-investigators-stop-bad-actors-on-platforms-and-how-you-can-too/
      summary: Seeds known to be violative; technical and behavioral signals; the proof is in the pattern (vendor blog)
    - title: arXiv 2512.19061 - Payment-platform fraud clustering
      url: https://arxiv.org/html/2512.19061v1
      summary: Hard links (phone, card, national id) vs soft links (device, cookie, IP); embeddings plus HDBSCAN (borrowed by analogy)
    - title: Castle - Finding links between fraudulent email domains using graph-based clustering
      url: https://blog.castle.io/finding-links-between-fraudulent-email-domains-using-graph-based-clustering/
      summary: Connected components over shared attributes in NetworkX (vendor blog)
    - title: CooRTweet vignette (CRAN)
      url: https://cran.r-project.org/web/packages/CooRTweet/vignettes/vignette.html
      summary: Four-column input, time_window, min_participation, edge_weight threshold defaulting to the median; cross-platform caution
    - title: Meta - Inauthentic behavior policy update (2019)
      url: https://about.fb.com/news/2019/10/inauthentic-behavior-policy-update/
      summary: Enforcement on behavior, not on who the actors are or what they say
    - title: Stanford Internet Observatory - Takedown analysis
      url: https://cyber.fsi.stanford.edu/node/21662
      summary: A supposed network was four or five distinct groups linked only by mentions of common public figures or hashtags (read via search summary)
    - title: Meta - Threat reporting
      url: https://transparency.meta.com/en-us/metasecurity/threat-reporting/
      summary: Index of public threat reports (read via search summary)
