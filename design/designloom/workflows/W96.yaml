    - title: Security Force Monitor research handbook - How dates work
      url: https://help.securityforcemonitor.org/en/latest/how-dates-work.html
      summary: Precise and imprecise ranges, real start and end flags, current claims end at publication date
    - title: Security Force Monitor research handbook - Unit relations
      url: https://help.securityforcemonitor.org/en/latest/units-relations.html
      summary: child-of and member-of relations with command, administrative or cohort class; contiguous merge
    - title: Security Force Monitor research handbook - Multiple citations and conflicting claims
      url: https://help.securityforcemonitor.org/en/latest/multiple-citations-claims.html
      summary: accepted, conflict, work_needed and issue status; split of partly conflicting citations with public notes
