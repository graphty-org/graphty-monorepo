id: W97
name: Importing Call Detail Records into a Link Chart
category: analysis
validated: false
personas:
    - crime-intelligence-analyst
    - prosecution-trial-analyst
requires_capabilities:
    - data-import
    - data-validation
    - data-preview
    - node-merging
    - visual-encoding-edges
    - degree-analysis
    - statistics-panel
    - details-on-demand
    - entity-resolution-review
    - provenance-tracking
    - parallel-edge-aggregation
    - saved-import-mappings
    - identifier-normalization
