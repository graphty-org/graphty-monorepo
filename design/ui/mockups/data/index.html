<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Data management mocks</title>
        <link rel="icon" href="data:," />
        <style>
            :root {
                --bg: #1e1e1e;
                --panel: #2c2c2c;
                --line: #444;
                --text: #e3e3e3;
                --dim: #b0b0b0;
                --accent: #82aafb;
                --special: #e0b45a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font:
                    14px/1.45 system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            header {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 14px 24px;
                border-bottom: 1px solid var(--line);
                background: var(--panel);
                position: sticky;
                top: 0;
                z-index: 5;
            }
            h1 {
                font-size: 18px;
                margin: 0;
            }
            .rounds button {
                background: none;
                color: var(--dim);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 4px 10px;
                cursor: pointer;
                font: inherit;
            }
            .rounds button[aria-pressed="true"] {
                color: #fff;
                border-color: var(--accent);
                background: #2b3a55;
            }
            main {
                padding: 20px 24px 60px;
            }
            .top {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
                margin-bottom: 24px;
            }
            .box {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 14px 18px;
            }
            .box h2 {
                font-size: 15px;
                margin: 0 0 8px;
            }
            .box ul,
            .box ol {
                margin: 0;
                padding-left: 20px;
            }
            .box li {
                margin: 4px 0;
            }
            .questions li {
                font-weight: 600;
            }
            table {
                border-collapse: separate;
                border-spacing: 0;
                width: 100%;
                table-layout: fixed;
            }
            th,
            td {
                vertical-align: top;
                border-bottom: 1px solid var(--line);
                padding: 12px;
                text-align: left;
            }
            thead th {
                background: var(--panel);
                font-weight: normal;
            }
            th.flow {
                width: 200px;
            }
            .optname {
                font-size: 16px;
                font-weight: 700;
                margin: 0 0 6px;
            }
            .optname span {
                color: var(--accent);
            }
            .idea {
                margin: 0 0 8px;
            }
            .opt h3 {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--dim);
                margin: 10px 0 2px;
            }
            .opt ul {
                margin: 0;
                padding-left: 18px;
                color: var(--dim);
                font-size: 13px;
            }
            .flowtitle {
                font-weight: 600;
            }
            .tag {
                display: inline-block;
                font-size: 11px;
                padding: 1px 6px;
                border-radius: 4px;
                margin-top: 4px;
                border: 1px solid var(--line);
                color: var(--dim);
            }
            .tag.special {
                color: var(--special);
                border-color: var(--special);
            }
            .strip {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .strip a {
                display: block;
                width: calc(33.3% - 4px);
                min-width: 120px;
                color: var(--dim);
                text-decoration: none;
                font-size: 11px;
            }
            .strip img {
                width: 100%;
                display: block;
                border: 1px solid var(--line);
                border-radius: 4px;
            }
            .strip a:hover img,
            .strip a:focus img {
                border-color: var(--accent);
            }
            .strip a:focus {
                outline: none;
            }
            .strip a:focus-visible img {
                outline: 2px solid var(--accent);
            }
            #viewer {
                position: fixed;
                inset: 0;
                background: #111;
                display: none;
                flex-direction: column;
                z-index: 10;
            }
            #viewer.open {
                display: flex;
            }
            .vbar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 16px;
                color: var(--text);
            }
            .vbar button,
            .vbar a {
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 4px 10px;
                cursor: pointer;
                font: inherit;
                text-decoration: none;
            }
            .vbar .grow {
                flex: 1;
            }
            #vstage {
                flex: 1;
                position: relative;
                overflow: hidden;
            }
            #vframe {
                position: absolute;
                width: 1440px;
                height: 900px;
                border: 0;
                transform-origin: 0 0;
                background: #111;
            }
            #vcap {
                padding: 10px 16px 16px;
                max-width: 1100px;
                margin: 0 auto;
                font-size: 15px;
                text-align: center;
            }
            .hint {
                color: var(--dim);
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Data management mocks</h1>
            <div class="rounds" id="rounds" role="group" aria-label="Round"></div>
            <span class="hint">Click any screen to step through its flow; arrow keys move, Esc closes.</span>
        </header>
        <main id="main"></main>
        <div id="viewer" role="dialog" aria-modal="true" aria-label="Screen viewer">
            <div class="vbar">
                <button id="vprev" aria-label="Previous screen">&larr;</button>
                <button id="vnext" aria-label="Next screen">&rarr;</button>
                <strong id="vtitle" class="grow"></strong>
                <a id="vopen" target="_blank" rel="noopener">Open full size</a>
                <button id="vclose">Close (Esc)</button>
            </div>
            <div id="vstage"><iframe id="vframe" title="Mock screen"></iframe></div>
            <div id="vcap"></div>
        </div>

            var cur = null,
                seq = [],
                idx = 0,
                lastFocus = null;
            function esc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
                });
            }
            function list(items) {
                return (
                    "<ul>" +
                    items
                        .map(function (i) {
                            return "<li>" + esc(i) + "</li>";
                        })
                        .join("") +
                    "</ul>"
                );
            }
            function render(id) {
                cur =
                    ROUNDS.filter(function (r) {
                        return r.id === id;
                    })[0] || ROUNDS[ROUNDS.length - 1];
                document.getElementById("rounds").innerHTML = ROUNDS.map(function (r) {
                    return (
                        '<button data-r="' + r.id + '" aria-pressed="' + (r === cur) + '">' + esc(r.label) + "</button>"
                    );
                }).join("");
                var h =
                    '<div class="top"><section class="box"><h2>What this round decided</h2>' +
                    list(cur.decided) +
                    '</section><section class="box questions"><h2>Questions for you</h2><ol>' +
                    cur.questions
                        .map(function (q) {
                            return "<li>" + esc(q) + "</li>";
                        })
                        .join("") +
                    "</ol></section></div>";
                h +=
                    '<table><thead><tr><th class="flow">Flow</th>' +
                    cur.options
                        .map(function (o) {
                            return (
                                '<th class="opt"><p class="optname"><span>Option ' +
                                o.id +
                                ":</span> " +
                                esc(o.name) +
                                '</p><p class="idea">' +
                                esc(o.idea) +
                                "</p>" +
                                "<h3>On the first screen</h3>" +
                                list(o.first) +
                                "<h3>A few clicks away</h3>" +
                                list(o.later) +
                                "<h3>For</h3>" +
                                list(o["for"]) +
                                "<h3>Against</h3>" +
                                list(o.against) +
                                "<h3>Still weak after critique</h3>" +
                                list(o.weak) +
                                "</th>"
                            );
                        })
                        .join("") +
                    "</tr></thead><tbody>";
                cur.flows.forEach(function (f) {
                    h +=
                        '<tr><th class="flow"><div class="flowtitle">' +
                        esc(f.title) +
                        '</div><span class="tag ' +
                        f.kind +
                        '">' +
                        (f.kind === "special" ? "special case: a few clicks away" : "common: reached at once") +
                        "</span></th>";
                    cur.options.forEach(function (o) {
                        h +=
                            '<td><div class="strip">' +
                            (o.flows[f.id] || [])
                                .map(function (s, i) {
                                    return (
                                        '<a href="' +
                                        s.file +
                                        '" data-o="' +
                                        o.id +
                                        '" data-f="' +
                                        f.id +
                                        '" data-i="' +
                                        i +
                                        '" title="' +
                                        esc(s.caption) +
                                        '">' +
                                        '<img loading="lazy" src="' +
                                        s.thumb +
                                        '" alt="Option ' +
                                        o.id +
                                        ", " +
                                        esc(f.title) +
                                        ", screen " +
                                        (i + 1) +
                                        '">' +
                                        (i + 1) +
                                        "</a>"
                                    );
                                })
                                .join("") +
                            "</div></td>";
                    });
                    h += "</tr>";
                });
                document.getElementById("main").innerHTML = h + "</tbody></table>";
            }
            function fit() {
                var st = document.getElementById("vstage"),
                    fr = document.getElementById("vframe");
                var s = Math.min(st.clientWidth / 1440, st.clientHeight / 900);
                fr.style.transform = "scale(" + s + ")";
                fr.style.left = (st.clientWidth - 1440 * s) / 2 + "px";
                fr.style.top = (st.clientHeight - 900 * s) / 2 + "px";
            }
            function show() {
                var s = seq[idx];
                document.getElementById("vframe").src = s.file;
                document.getElementById("vopen").href = s.file;
                document.getElementById("vtitle").textContent =
                    s.title + " -- screen " + (idx + 1) + " of " + seq.length;
                document.getElementById("vcap").textContent = s.caption;
                document.getElementById("vprev").disabled = idx === 0;
                document.getElementById("vnext").disabled = idx === seq.length - 1;
            }
            function openViewer(oid, fid, i) {
                var o = cur.options.filter(function (x) {
                    return x.id === oid;
                })[0];
                var f = cur.flows.filter(function (x) {
                    return x.id === fid;
                })[0];
                seq = o.flows[fid].map(function (s) {
                    return {
                        file: s.file,
                        caption: s.caption,
                        title: "Option " + o.id + ": " + o.name + " / " + f.title,
                    };
                });
                idx = i;
                lastFocus = document.activeElement;
                document.getElementById("viewer").classList.add("open");
                fit();
                show();
                document.getElementById("vclose").focus();
            }
            function closeViewer() {
                document.getElementById("viewer").classList.remove("open");
                document.getElementById("vframe").src = "about:blank";
                if (lastFocus) lastFocus.focus();
            }
            function step(d) {
                var n = idx + d;
                if (n >= 0 && n < seq.length) {
                    idx = n;
                    show();
                }
            }
            document.addEventListener("click", function (e) {
                var b = e.target.closest("[data-r]");
                if (b) {
                    location.hash = "round-" + b.getAttribute("data-r");
                    return;
                }
                var a = e.target.closest("a[data-o]");
                if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
                    e.preventDefault();
                    openViewer(a.getAttribute("data-o"), a.getAttribute("data-f"), +a.getAttribute("data-i"));
                }
            });
            document.getElementById("vprev").onclick = function () {
                step(-1);
            };
            document.getElementById("vnext").onclick = function () {
                step(1);
            };
            document.getElementById("vclose").onclick = closeViewer;
            document.addEventListener("keydown", function (e) {
                if (!document.getElementById("viewer").classList.contains("open")) return;
                if (e.key === "ArrowRight") step(1);
                else if (e.key === "ArrowLeft") step(-1);
                else if (e.key === "Escape") closeViewer();
                else return;
                e.preventDefault();
            });
            window.addEventListener("resize", fit);
            window.addEventListener("hashchange", function () {
                render(location.hash.replace("#round-", ""));
            });
            render(location.hash.replace("#round-", ""));
        </script>
