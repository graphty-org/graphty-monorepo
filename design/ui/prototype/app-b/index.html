<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refined B skeleton</title>
<link rel="stylesheet" href="kit/cm.css">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="lib.js"></script>
<script src="app.js"></script>
</head>
<body data-page="app">
<div id="ab-review" class="ab-review" aria-label="Review bar (not part of the product)"></div>
<main id="ab-page" class="ab-page"></main>
<div id="ab-app" class="ab-app">
  <header id="ab-top" class="ab-top" aria-label="Project"></header>
  <div class="ab-body">
    <nav id="ab-rail" class="k-rail ab-rail" aria-label="Places"></nav>
    <aside id="ab-left" class="ab-left" aria-label="Left panel"></aside>
    <div id="ab-main" class="ab-main">
      <div id="ab-canvas" class="k-canvas ab-canvas" aria-label="Graph drawing"></div>
      <div id="ab-toolbar" class="k-toolbar-dock ab-toolbar"></div>
      <section id="ab-dock" class="k-dock ab-dock" aria-label="Table"></section>
    </div>
    <aside id="ab-right" class="ab-right" aria-label="Inspector"></aside>
    <div id="ab-workspace" class="ab-workspace"></div>
  </div>
  <div id="ab-full" class="ab-full"></div>
  <div id="ab-overlay" class="ab-overlay" data-active="false"></div>
  <div id="ab-live" class="k-sr" aria-live="polite" role="status"></div>
</div>
</body>
</html>
