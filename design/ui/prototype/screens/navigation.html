<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The rebuilt navigation, before and after</title>
<link rel="stylesheet" href="../kit/cm.css">
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js" defer></script>
<!--
  One page, two modes.
  - No query: the storyboard. Each frame pairs today's layout with the new one, as live copies of
    this page scaled down, with the rail's buttons listed underneath and named in the ontology.
  - ?frame=<state>: one app frame at full size (1440 x 900), with a bar to change state, turn the
    annotation layer on and switch theme. &embed hides the bar (the storyboard uses it);
    &annot turns the annotations on; &theme=dark|light forces a theme.
  States: today, today-results (both kept as Before frames), new, new-node, new-results, new-run,
  new-run-bridges (reached from the Bridges layer's "From run:" link; focus lands on the run's
  heading), new-menu, new-file, new-prefs, new-data.
  The new frames follow the shell (kit/template.html, kit/shell.mjs): the rail is main menu, Graph,
  Data, Results, Notes, Assistant, and the inspector with nothing selected has no Results section.
  The page builds its markup in script, so kit/shell.mjs cannot rewrite it: keep it on the template
  by hand.
-->
<style>
  /* ---------- the storyboard ---------- */
  .nv-rule { margin: 16px 0 8px; padding: 12px 16px; border-radius: 8px; background: var(--cm-bg-secondary); font-size: 15px; line-height: 24px; max-width: none; }
  .nv-frame { margin: 40px 0 0; }
  .nv-frame > h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 32px; }
  .nv-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .nv-side > .nv-label { font-weight: 600; margin: 0 0 6px; }
  .nv-side > .nv-label a { font-weight: 400; margin-inline-start: 8px; }
  .nv-ribbon { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .nv-rb { padding: 6px 6px 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--cm-border); font-size: 11px; line-height: 15px; }
  .nv-rb[data-on] { box-shadow: inset 0 0 0 2px var(--k-annot); }
  .nv-rb[data-gone] { background: var(--cm-bg-secondary); }
  .nv-rb b { display: flex; align-items: center; gap: 4px; font-weight: 600; margin-bottom: 2px; }
  .nv-rb .nv-kind { display: block; color: var(--k-annot-ink); font-weight: 600; }
  .nv-cap { margin-top: 12px; display: grid; grid-template-columns: 120px 1fr; gap: 4px 16px; font-size: 13px; line-height: 20px; }
  .nv-cap dt { color: var(--cm-text-secondary); }
  .nv-cap dd { margin: 0; max-width: 90ch; }
  .nv-cap .k-said { display: block; color: var(--cm-text-secondary); font-style: italic; }
  .nv-shot { position: relative; }
  .nv-outcome { margin-top: 40px; }
  @media (max-width: 900px) { .nv-pair { grid-template-columns: 1fr; } .nv-ribbon { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* ---------- one frame ---------- */
  .nv-bar { position: fixed; z-index: 200; top: 8px; left: 314px; right: 257px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 4px; padding: 4px 8px; border-radius: 8px; background: var(--k-annot-bg); border: 1px solid var(--k-annot); font-size: 11px; white-space: nowrap; }
  .nv-bar a { display: inline-flex; align-items: center; min-height: 24px; box-sizing: border-box; padding: 0 6px; border-radius: 4px; color: var(--k-annot-ink); text-decoration: none; }
  .nv-bar a[aria-current] { background: var(--k-annot); color: #fff; }
  .nv-bar label { display: flex; align-items: center; gap: 4px; color: var(--k-annot-ink); font-weight: 600; margin-inline-start: 6px; }
  .nv-bar button { font: inherit; color: var(--k-annot-ink); background: none; border: 1px solid var(--k-annot); border-radius: 4px; padding: 0 6px; min-height: 24px; }
  .nv-bar .nv-sep { width: 1px; height: 14px; background: var(--k-annot); margin: 0 4px; }
  .nv-badge { position: fixed; z-index: 160; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--k-annot); color: #fff; font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; pointer-events: none; }
  .nv-key { position: fixed; z-index: 150; left: 314px; top: 48px; width: 560px; max-height: 560px; overflow: auto; padding: 10px 14px 12px; }
  .nv-key h2 { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--k-annot-ink); }
  .nv-key ol { margin: 0; padding-inline-start: 22px; }
  .nv-key li { margin: 0 0 4px; }
  .nv-key li::marker { color: var(--k-annot-ink); font-weight: 700; }
  .nv-key .nv-cm { color: var(--cm-text-secondary); }
  /* The privacy line under the project name: body ink, a link to Data > Sent and saved */
  .nv-panel-title { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--cm-border); font-weight: 550; }
  .nv-cap-line { padding: 0 8px 4px 16px; font-size: 11px; line-height: 16px; }
  .nv-grip { color: var(--cm-icon-secondary); flex: none; }
  .nv-prefs .k-fieldrow { padding: 4px 16px; }
  .nv-prefs .k-prose { padding: 0 16px 4px; }
  /* Results: the run list and a run opened in place */
  .nv-run { display: grid; grid-template-columns: 16px 1fr auto; gap: 0 8px; align-items: baseline; padding: 6px 8px 6px 16px; }
  .nv-run:hover, .nv-run[data-hover] { background: var(--cm-bg-hover); }
  .nv-run > .k-i { align-self: center; }
  .nv-run .nv-sub { grid-column: 2 / 4; color: var(--cm-text-secondary); font-size: 11px; line-height: 16px; }
  .nv-acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 8px 8px 16px; }
  .nv-side[data-frame="before"] > .nv-label { text-align: end; }
  .nv-submenu-caret { margin-inline-start: auto; color: var(--cm-icon-secondary); }
  /* A style layer made by "Show as style layer": its own name, then a link to the run that made it */
  .k-item.nv-two { flex-wrap: wrap; height: auto; min-height: 32px; padding-block: 6px; row-gap: 0; }
  .k-item.nv-two::before { inset: 2px 0; }
  .nv-from { flex-basis: calc(100% - 20px); margin-inline-start: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; line-height: 16px; color: var(--cm-text-brand); }
  .nv-run-h { margin: 0; font: inherit; }
</style>
</head>
<body data-dataset="lesmis">
<div id="root"></div>
<script>
(() => {
const q = new URLSearchParams(location.search);
const state = q.get("frame");
const embed = q.has("embed");
const theme = q.get("theme");
if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
const I = (n, cls = "") => `<svg class="k-i ${cls}"><use href="../kit/icons.svg#${n}"/></svg>`;
const fx = (key, text, digits) => `<span data-fx="${key}"${digits ? ` data-fx-digits="${digits}"` : ""}>${text}</span>`;

/* ---------------- annotations: element key -> [framework section, compact-mantine component] ---------------- */
const AN = {
  "rail":       ["The rail lists what a project owns: main menu, Graph, Data, Results, Notes, Assistant (information-architecture.md 5, the navigation rule proposed in framework-changes.md, \"Navigation model\"; 4, \"Places\").", "NavRail"],
  "rail-menu":  ["Main menu: the app's commands under their own scheme -- File, Edit, View, Selection, Algorithms, Recipes, Preferences, Help. Not a place (information-architecture.md 10, rule 1).", "RailButton + Mantine Menu"],
  "rail-graph": ["Graph: the collection of graphs, the sets and paths kept on them, and saved views. The rail opens here (information-architecture.md 5; the Graph row of 4).", "RailButton"],
  "rail-data":  ["Data (new): sources and their columns with each weight's state, versions, Update with new data, Add a table, applied recipes, and what was sent and saved (framework-changes.md, \"Places\"; output-homes.md).", "RailButton"],
  "rail-notes": ["Notes: every note, newest first (information-architecture.md 4).", "RailButton"],
  "rail-asst":  ["Assistant: conversations, kept in the app and never in the project. Off until a provider is set; says nothing is sent (information-architecture.md 4 and 11).", "RailButton (the off variant)"],
  "rail-results": ["Results: every run of a measure, with its settings and date. A run is an object the project keeps, so it has a rail place; a node's value is still read on the node and in the table (framework-changes.md, \"Places\").", "RailButton"],

  "run-record": ["A run opened in place: the back arrow (or Esc) returns to the list; the state line; the record (settings, date, time taken); Re-run and Compare with another run...; top nodes; Show in table, sorted; Show as style layer. Nothing else in the panel moves (framework-changes.md, \"Interface specification\").", "ControlSection, DataRow, Mantine Button"],
  "project":    ["Project name and its chevron menu: the File list -- Open..., Update with new data..., Export..., Download project file, Version history, Project info..., Rename, Duplicate, Close. Stays above every rail panel (interface-specification.md 1.2, left panel header; output-homes.md, the Export... row).", "ActionRow + Mantine Menu"],
  "privacy":    ["The privacy line replaces nothing: it is where \"what left this project\" is read, one click from Data > Sent and saved (framework-changes.md, \"Interface specification: the rail, the header...\").", "Mantine Anchor (Text size xs)"],

  "graphs":     ["Graphs: Figma's Pages slot (interface-specification.md 1.2, Graphs section).", "PageList, PageRow, InlineRename"],
  "sets":       ["Sets and paths kept on this graph. A set row selects the set, and the inspector shows it (information-architecture.md 4, the Graph panel).", "Tree (level-1 rows)"],
  "views":      ["Views: saved camera, filter and look, in the findings report's order (information-architecture.md 9).", "Tree (level-1 rows)"],
  "zoom":       ["The right column's one header row: the zoom and view menu, and a mode's tab while Version history or the comparison holds the column. No Export button, no avatar, no tabs (proposed here; framework-changes.md, \"Navigation: one header row on the right\").", "Mantine Menu; Mantine Tabs in a mode"],
  "typerow":    ["Type row: what is selected, and nothing else (interface-specification.md 4.0).", "ActionRow"],
  "overview":   ["Overview with nothing selected: the graph's headline readings, the Last import row, the Edges row (interface-specification.md 4.1, Nothing).", "ControlSection, DataRow, ActionRow"],
  "stack":      ["Style stack with nothing selected: the whole ordered stack, top wins, drag to reorder, the Look with its label; the legend on the canvas reads it (framework-changes.md, \"Interface specification: ... inspector's sections\"; interface-templates.md 9).", "ControlSection + Tree (treegrid mode), FieldRow + StyleSelect for the Look"],
  "appearance": ["Appearance on a selection: the same stack, the rows that paint this node highlighted with the property each wins; \"+\" adds a layer for the selection, as Figma's Selection colors does (framework-changes.md, \"Figma crosswalk\").", "ControlSection + Tree (treegrid mode)"],
  "node-results": ["Results on a node: this node's value and rank in each run; a row opens the table sorted by that column. The runs themselves are listed only on the Results rail place (framework-changes.md, \"Interface specification\").", "ControlSection, DataRow"],
  "attrs":      ["Attributes of the node (interface-specification.md 4.1, One node).", "ControlSection, DataRow"],
  "members":    ["Memberships: the kept sets that hold this node (interface-specification.md 4.1).", "ActionRow"],
  "dock":       ["The bottom dock compares rows: every result is a column here, sortable, with its range in the header (information-architecture.md 8.1).", "Mantine Tabs (pills), DataTable"],
  "canvas":     ["Canvas: the drawing, the legend and the not-drawn line (information-architecture.md 4).", "graphty-element"],
  "toolbar":    ["Floating toolbar: Select, Path, Note, Quick actions, view mode (interface-specification.md 1.2).", "Toolbar, ToolGroup, ToolButton"],
  "menu-export": ["Export... opens the one Export dialog: figure, findings report, tables, project, recipe (output-homes.md, Export... row; Ctrl+Shift+E).", "Mantine Menu.Item + TooltipShortcut"],
  "file-list":  ["One File list: Main menu > File and the project-name menu are built from one definition and show the same commands in the same order. With a project open, Open... opens the file as a new project; this one stays in Recent (framework-changes.md, \"Output homes\").", "Mantine Menu (submenu)"],
  "main-recipes": ["Recipes: Apply a recipe... and Save as a recipe... A recipe that holds only styles is still a recipe: one word everywhere (framework-changes.md, \"Content design\").", "Mantine Menu.Item"],
  "prefs-name": ["The author setting: notes and recipes record it; shown only when a project holds more than one author; blank if unset (owner decision of 2026-09-28).", "FieldRow + TextInput"],
  "data-sources": ["Sources: each file or query and its columns, a numeric edge column with its weight state in the three agreed wordings; Update with new data... (Replace is the main button when the columns match), and \"+\" in the header to add a table (framework-changes.md, \"Content design\").", "ControlSection, Tree, DataRow"],
  "data-versions": ["Versions: each version of the data, opened to read the graph as it was, and Version history (framework-changes.md, \"Output homes\").", "ControlSection, ActionRow + TrailingSlot"],
  "data-recipes": ["Recipes: each recipe applied to this project, a recipe that holds only styles among them; \"+\" opens the one Apply dialog. Their style layers also show in the color picker's Libraries tab (framework-changes.md, \"Interface specification\").", "ControlSection (empty header with +)"],
  "data-sent": ["Sent and saved: every file written and everything sent, never a password or key (framework-changes.md, \"Output homes\").", "ControlSection, ActionRow"],
  "data-export": ["Export... in the Data panel's title row: a second starting place for the one Export dialog.", "Mantine Button (secondary, compact)"],
  "from-run":   ["A style layer made with Show as style layer keeps its own name and gains a second line, \"From run:\" and the run's title as Results lists it. The line is a link: Enter opens that run in Results and focus moves to the run's heading. The layer's name is the reader's to change; the link is how the layer leads back to how it was made (framework-changes.md, \"Interface specification\").", "Tree (treegrid mode) row + Mantine Anchor"],
  "run-heading": ["The run's heading takes focus when the run is opened from a style layer's From run: link, so a screen-reader or keyboard reader lands on what they asked for. The back arrow (or Esc) returns to the list, and focus goes back to the From run: link that opened it, as focus returns to the opener everywhere.", "Title (order 2, tabIndex -1)"],
  "rerun":      ["Re-run says what it will run on and that it adds a run: \"Re-run on 41 of 77 (keeps Run 1)\". The filter now keeps 41 of 77 nodes and Run 1 ran on the full graph, so the button names the new scope; Run 1 stays listed and readable.", "Mantine Button (secondary)"],
  "today-styles": ["Before: the style stack sits in the Graph panel, where the owner asked why.", "--"],
  "today-export": ["Before: an export button in the header.", "--"],
  "today-avatar": ["Before: an avatar, with no accounts behind it.", "--"],
  "today-results": ["Before: the Results rail panel mixed what ran with what could run (the catalog).", "--"],
};
const an = (k) => ` data-an="${k}"`;

/* ---------------- pieces ---------------- */
const rb = (key, icon, word, on) => `<div class="k-rail-btn" role="button" aria-pressed="${on ? "true" : "false"}"${an(key)} data-box="${key}"><span class="k-rail-pill">${I(icon)}</span>${word}</div>`;
const asst = `<div class="k-rail-btn k-asst-off" role="button" aria-pressed="false" title="Assistant: off until you set a provider in Preferences"${an("rail-asst")} data-box="rail-asst">Assistant<span class="k-asst-cap">Off. Nothing is sent.</span></div>`;
const menuBtnOf = (open) => `<div class="k-rail-btn" role="button" aria-label="Main menu" aria-haspopup="menu" aria-expanded="${open ? "true" : "false"}"${open ? ` aria-pressed="true"` : ""}${an("rail-menu")} data-box="rail-menu"><span class="k-rail-pill">${I("menu")}</span></div><div class="k-rail-sep"></div>`;
const menuBtn = menuBtnOf(false);
const railToday = (on) => `<nav class="k-rail" aria-label="Main"${an("rail")}>${menuBtn}${rb("rail-graph", "network", "Graph", on === "graph")}${asst}${rb("rail-results", "flask-conical", "Results", on === "results")}${rb("rail-notes", "sticky-note", "Notes", on === "notes")}</nav>`;
const railNew = (on, menuOpen) => `<nav class="k-rail" aria-label="Main"${an("rail")}>${menuBtnOf(menuOpen)}${rb("rail-graph", "network", "Graph", on === "graph")}${rb("rail-data", "database", "Data", on === "data")}${rb("rail-results", "flask-conical", "Results", on === "results")}${rb("rail-notes", "sticky-note", "Notes", on === "notes")}${asst}</nav>`;

const CHIP_FULL = `Full graph`;
const CHIP_41 = `<span class="k-num">Filtered: <span data-fx="datasets.lesmis.filterSteps.statsByState.2.nodes" data-fx-of="datasets.lesmis.nodes" data-fx-noun="nodes">41 of 77 nodes</span></span>`;
const head = (isNew, menuOpen, chip = CHIP_FULL) => `<div class="k-panel-head">
  <div class="k-title-line"${isNew ? an("project") : ""} data-box="project"><span class="k-project">Les Miserables</span><span class="k-icon-btn" role="button" aria-label="Project menu" aria-haspopup="menu" aria-expanded="${menuOpen ? "true" : "false"}">${I("chevron-down", "k-i-sm")}</span></div>
  ${isNew ? `<a class="k-privacy" href="?frame=new-data${embed ? "&embed" : ""}"${an("privacy")}>Nothing has been sent from this project</a>` : ""}
  <span class="k-chip k-chip-btn" role="button" aria-expanded="false"${an("chip")}>${I("funnel", "k-i-sm")}${chip}${I("chevron-down", "k-i-sm k-caret")}</span>
</div>`;

const graphsSec = `<section class="k-section"${an("graphs")}>
  <div class="k-section-head">Graphs<span class="k-grow"></span><span class="k-icon-btn" role="button" aria-label="Find a graph">${I("search")}</span><span class="k-icon-btn" role="button" aria-label="Add a graph">${I("plus")}</span></div>
  <ul class="k-list" role="listbox" aria-label="Graphs"><li class="k-item" role="option" aria-selected="true">${I("network")}<span class="k-grow k-ellipsis">Co-appearances</span><span class="k-trail k-num">${fx("datasets.lesmis.nodes", "77")} nodes</span></li></ul>
</section>`;
const setsSec = `<section class="k-section"${an("sets")}>
  <div class="k-section-head">Sets and paths<span class="k-grow"></span><span class="k-icon-btn" role="button" aria-label="New set">${I("plus")}</span></div>
  <ul class="k-list">
    <li class="k-item">${I("group")}<span class="k-ellipsis">Friends of Valjean</span><span class="k-kind">frozen</span><span class="k-trail"><span class="k-num">36</span></span></li>
    <li class="k-item">${I("group")}<span class="k-ellipsis">The barricade</span><span class="k-kind">rule</span><span class="k-trail"><span class="k-paint-slot"><span class="k-chit" style="background:#56B4E9"></span></span><span class="k-num">13</span></span></li>
    <li class="k-item">${I("waypoints")}<span class="k-ellipsis">Fantine to Marius</span><span class="k-kind">path</span><span class="k-trail"><span class="k-num">3</span></span></li>
  </ul>
</section>`;
const stackRows = (sel) => `
    <li class="k-item" role="treeitem"${sel ? " data-member" : ""}>${I("grip-vertical", "k-i-sm nv-grip")}<svg class="k-sizechip" viewBox="0 0 16 12"><circle cx="3" cy="8" r="2" fill="#808080"/><circle cx="10" cy="6" r="5" fill="#808080"/></svg><span class="k-ellipsis">Size: degree</span>${sel ? `<span class="k-kind">size</span>` : ""}</li>
    <li class="k-item" role="treeitem"${sel ? " data-member" : ""}>${I("grip-vertical", "k-i-sm nv-grip")}<span class="k-stack"><span class="k-chit" style="background:#009E73"></span><span class="k-chit" style="background:#56B4E9"></span><span class="k-chit" style="background:#E69F00"></span></span><span class="k-ellipsis">Group color</span>${sel ? `<span class="k-kind">color</span>` : ""}</li>
    <li class="k-item nv-two" role="treeitem" data-off>${I("grip-vertical", "k-i-sm nv-grip")}<span class="k-chit" style="background:#D55E00"></span><span class="k-ellipsis">Bridges</span><span class="k-kind">off</span><span class="k-trail"><span class="k-icon-btn k-secondary" role="button" aria-label="Show Bridges">${I("eye-off")}</span></span><a class="k-link nv-from" href="?frame=new-run-bridges${embed ? "&embed" : ""}"${an("from-run")} data-box="from-run">From run: Bridges, 27 Sep, 16:40</a></li>
    <li class="k-item" role="treeitem"${sel ? " data-member" : ""}>${I("grip-vertical", "k-i-sm nv-grip")}<span class="k-chit" style="background:#808080"></span><span class="k-ellipsis">Base style</span>${sel ? `<span class="k-kind">shape, label</span>` : ""}</li>`;
const stylesTodaySec = `<section class="k-section" data-box="today-styles"${an("today-styles")}>
  <div class="k-section-head">Styles<span class="k-grow"></span><span class="k-icon-btn" role="button" aria-label="Add a style layer">${I("plus")}</span></div>

    <li class="k-item"><svg class="k-sizechip" viewBox="0 0 16 12"><circle cx="3" cy="8" r="2" fill="#808080"/><circle cx="10" cy="6" r="5" fill="#808080"/></svg><span class="k-ellipsis">Size: degree</span></li>
    <li class="k-item"><span class="k-stack"><span class="k-chit" style="background:#009E73"></span><span class="k-chit" style="background:#56B4E9"></span><span class="k-chit" style="background:#E69F00"></span></span><span class="k-ellipsis">Group color</span></li>
    <li class="k-item" data-off><span class="k-chit" style="background:#D55E00"></span><span class="k-ellipsis">Bridges</span><span class="k-kind">run</span></li>
    <li class="k-item"><span class="k-chit" style="background:#808080"></span><span class="k-ellipsis">Base style</span></li>

const viewsSec = (open) => open ? `<section class="k-section"${an("views")}>
  <div class="k-section-head">Views<span class="k-grow"></span><span class="k-icon-btn" role="button" aria-label="Save a view">${I("plus")}</span></div>

const graphPanel = (isNew, menuOpen) => `<aside class="k-panel" aria-label="Graph">${head(isNew, menuOpen)}<div class="k-scroll">${graphsSec}${setsSec}${isNew ? "" : stylesTodaySec}${viewsSec(isNew)}</div></aside>`;

const resultsPanelToday = `<aside class="k-panel" aria-label="Results" data-box="today-results"${an("today-results")}>${head(false)}<div class="k-scroll">
  <section class="k-section">
    <div class="k-section-head">In this project<span class="k-grow"></span></div>
    <div class="k-row">${I("flask-conical")}<span class="k-grow">Betweenness</span><span class="k-secondary">done</span></div>
    <div class="k-row">${I("flask-conical")}<span class="k-grow">Bridges</span><span class="k-secondary">done</span></div>
  </section>
  <section class="k-section">
    <div class="k-section-head">Catalog<span class="k-grow"></span></div>
    <div class="k-search"><span class="k-field">${I("search", "k-i-sm")}Find a method</span></div>

/* ---------------- one frame at full size ---------------- */
if (state) {
  const s = STATES[state] || STATES.new;
  const annotOn = q.has("annot");
  let html = s.build();
  if (!embed) {
    const link = (k) => { const p = new URLSearchParams(q); p.set("frame", k); return `<a href="?${p}"${k === state ? ` aria-current="page"` : ""}>${STATES[k].label}</a>`; };
    html += `<div class="nv-bar" data-kit-switcher>${Object.keys(STATES).map(link).join("")}<span class="nv-sep"></span>
      <label><input type="checkbox" id="nv-annot"${annotOn ? " checked" : ""}> Annotations</label>
      <button type="button" id="nv-theme">Dark / light</button><a href="navigation.html">The storyboard</a></div>`;
  }
  document.getElementById("root").outerHTML = html;
  const drawAnnot = (on) => {
    document.querySelectorAll(".nv-badge, .nv-key, .nv-annot-box").forEach((n) => n.remove());
    if (!on) return;
    const items = [];
    document.querySelectorAll(".k-app [data-an], .k-app ~ * [data-an]").forEach((el) => {
      const r = el.getBoundingClientRect();
      if (!r.width || !AN[el.dataset.an]) return;
      items.push(AN[el.dataset.an]);
      const n = items.length;
      const box = document.createElement("span");
      box.className = "k-annot-box nv-annot-box";
      Object.assign(box.style, { position: "fixed", left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
      const badge = document.createElement("span");
      badge.className = "nv-badge k-annot-note";
      badge.style.cssText = `left:${Math.max(0, r.right - 20)}px;top:${Math.max(0, r.top + 2)}px;padding:0 4px;border:0;box-shadow:none;max-width:none`;
      badge.textContent = n;
      document.body.append(box, badge);
    });
    const key = document.createElement("div");
    key.className = "nv-key k-annot-note";
    key.innerHTML = `<h2>What each numbered part is, the framework section behind it, and its compact-mantine component</h2><ol>${items.map(([t, c]) => `<li>${t} <span class="nv-cm">Component: ${c}.</span></li>`).join("")}</ol>`;
    document.body.append(key);
  };
  addEventListener("load", () => { document.querySelector("[data-autofocus]")?.focus({ preventScroll: true }); drawAnnot(annotOn); });
  document.getElementById("nv-annot")?.addEventListener("change", (e) => {
    const p = new URLSearchParams(location.search);
    e.target.checked ? p.set("annot", "") : p.delete("annot");
    history.replaceState(null, "", `?${p}`);
    drawAnnot(e.target.checked);
  });
  document.getElementById("nv-theme")?.addEventListener("click", () => {
    const d = document.documentElement;
    const dark = d.getAttribute("data-theme") ? d.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    d.setAttribute("data-theme", dark ? "light" : "dark");
    setTimeout(() => drawAnnot(document.getElementById("nv-annot").checked), 0);
  });
  return;
}

/* scale each live copy to its box, and draw the boxes on the parts each frame is about */
const fit = () => document.querySelectorAll("[data-scale-me]").forEach((el) => el.style.setProperty("--k-scale", (el.clientWidth / 1440).toFixed(4)));
new ResizeObserver(fit).observe(document.body);
fit();
const themeOf = () => document.documentElement.getAttribute("data-theme");
/* A theme set on this page (by shoot.mjs --dark or by hand) reaches the copies without reloading them */
const pushTheme = (fr) => { const t = themeOf(); const d = fr.contentDocument; if (t && d) d.documentElement.setAttribute("data-theme", t); };
document.querySelectorAll(".k-frame-shot iframe").forEach((fr) => {
  fr.addEventListener("load", () => {
    pushTheme(fr);
    const doc = fr.contentDocument;
    fr.parentElement.querySelectorAll("[data-for]").forEach((box) => {
      const el = doc && doc.querySelector(`[data-box="${box.dataset.for}"]`);
      if (!el) return;
      const r = el.getBoundingClientRect();
      Object.assign(box.style, { left: `${(r.left / 1440) * 100}%`, top: `${(r.top / 900) * 100}%`, width: `${(r.width / 1440) * 100}%`, height: `${(r.height / 900) * 100}%` });
      box.hidden = false;
    });
  });
});
new MutationObserver(() => document.querySelectorAll(".k-frame-shot iframe").forEach(pushTheme)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
