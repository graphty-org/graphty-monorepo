<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fontconfig graphviz.mjs runs Graphviz under: the repository's pinned fonts (visual-fonts/, the same fonts,
  conf.d and generic-family rules as visual-fonts/fonts.conf), with every font-family Graphviz writes measured in
  the face a browser draws the oracle SVG's text in, so Graphviz sizes each node for the label its SVG shows (#5223).
  graphviz.mjs fills in @VISUAL_FONTS@ (the absolute visual-fonts/ directory) and @CACHE@ (a fresh cache directory
  of its own, because the scan rules below change what fontconfig caches for the pinned fonts).

  Chromium, under visual-fonts/fonts.conf, takes the first family in a font-family list that the pinned fonts have
  or have a metric twin of (Times and Times New Roman: Liberation Serif; Helvetica and Arial: Liberation Sans;
  Courier and Courier New: Liberation Mono), draws the generic serif in Liberation Serif, sans-serif in Liberation
  Sans and monospace in DejaVu Sans Mono, and draws a list it has none of (Verdana, Dialog, cursive) in its
  standard font, Liberation Serif. Plain fontconfig differs twice:

  - A PostScript font name (Times-Roman, Graphviz's default, written "Times,serif"; Helvetica; Courier) is resolved
    by Graphviz itself: the first family of its own list that fontconfig lists, and DejaVu Serif, Sans and Sans Mono
    come before the Liberation faces there. The scan rules give each Liberation face the name its list starts with
    (Times New Roman, Arial, Courier New), so Graphviz picks the metric twin, as the browser does.
  - Any other list goes to fontconfig whole, where weak generic aliases outrank the metric twins and an unknown
    family falls to DejaVu Sans. The pattern rules make the browser's choices strong.
-->
<fontconfig>
	<dir>@VISUAL_FONTS@/fonts</dir>
	<cachedir>@CACHE@</cachedir>
	<!-- visual-fonts/fonts.conf's own rules -->
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>system ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
	</match>
	<match target="scan">
		<test name="family" compare="eq"><string>Liberation Serif</string></test>
		<edit name="family" mode="prepend_first" binding="same"><string>Times New Roman</string></edit>
	</match>
	<match target="scan">
		<test name="family" compare="eq"><string>Liberation Sans</string></test>
		<edit name="family" mode="prepend_first" binding="same"><string>Arial</string></edit>
	</match>
	<match target="scan">
		<test name="family" compare="eq"><string>Liberation Mono</string></test>
		<edit name="family" mode="prepend_first" binding="same"><string>Courier New</string></edit>
	</match>
	<!-- the metric twins Chromium accepts (rasterize.mjs METRIC_TWIN) -->
	<match target="pattern">
		<test name="family" compare="eq"><string>Times</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Times New Roman</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Tinos</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Helvetica</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Arial</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Arimo</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Courier</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Courier New</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>Cousine</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
	</match>
	<!-- Chromium's generic families -->
	<match target="pattern">
		<test name="family" compare="eq"><string>serif</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>sans-serif</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="eq"><string>monospace</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
	</match>
	<!-- a list Chromium has none of: its standard font -->
	<match target="pattern">
		<edit name="family" mode="append_last" binding="strong"><string>Liberation Serif</string></edit>
	</match>
	<include ignore_missing="no">@VISUAL_FONTS@/conf.d</include>
</fontconfig>
