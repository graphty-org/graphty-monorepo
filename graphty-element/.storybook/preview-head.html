    This file used to fetch Babylon.js from https://cdn.babylonjs.com/babylon.js and four Lit

    None of that is true any more. The UMD build was replaced by `./bundle`, Storybook builds

    `window["@babylonjs/core"]`, `window.lit` or any of the aliases the old script created.

    So the tags fetched a second, unused copy of Babylon on every story render, and made every
    visual snapshot depend on two public hosts resolving. That is not theoretical: sweeps of the
    159 stories lost five, then two, then a different set again, to
    "net::ERR_NAME_NOT_RESOLVED" and "[preview-head] BABYLON not loaded!" -- stories reported
    BROKEN for a reason that has nothing to do with the code, moving between runs.

    Keep this file empty. If a story ever needs a global, give it one from a module the bundle
    already contains rather than fetching a second copy over the network.
