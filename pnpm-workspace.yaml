packages:
    - "graph-format"
    - "graph-io"
    - "webgpu-graph-algorithms"
    - "graph-samples"
    - "babylonjs-map"
    - "algorithms"
    - "layout"
    - "cytoscape-extensions"
    - "graphty-element"
    - "graphty"
    - "remote-logger"
    - "compact-mantine"
    - "visual-review"
    - "githerd"

# Hold back any version published less than a day ago (in minutes). A compromised release is
# usually found and pulled within hours; this keeps an install from picking it up in that window.
minimumReleaseAge: 1440

# One Vitest for every package. Each package names these as "catalog:", so a bump is one edit
# here and pnpm resolves a single instance.
catalog:
    vitest: 4.1.12
    "@vitest/browser": 4.1.12
    "@vitest/browser-playwright": 4.1.12
    "@vitest/coverage-v8": 4.1.12
    "@vitest/ui": 4.1.12

# Fixes to published packages, applied at install. Delete an entry once the catalog moves to a
# release that has the fix (`pnpm install` then drops the patch).
patchedDependencies:
    # Vitest 4.1.12's browser mocker (unchanged since 4.1.11) strips the project root from a mocked module's URL with a
    # bare startsWith, so graphty's root (.../graphty) also eats the front of .../graphty-element
    # and every vi.mock of @graphty/graphty-element in graphty's browser tests is silently
    # ignored: the real element loads instead. Vitest 5 checks for the trailing slash; this is
    # that fix (issue #493).
    "@vitest/browser@4.1.12": patches/@vitest__browser@4.1.12.patch
    # Vitest 4.1.12's Playwright provider answers a request for a vi.mock'd module by asking the test
    # page that registered the mock to run its factory. When that page closes first (its file ended,
    # failed to load, or Vite reloaded it), the ask rejects with "rpc is closed" inside Playwright's
    # route handler, where nothing catches it: an unhandled rejection that failed graphty-element
    # browser shards whose every test passed. Every browser test file hits this through
    # test/setup.ts's @babylonjs/core mock, whose factory loads all of Babylon.js, so a busy machine
    # widens the window. The patch drops the request when the page's connection is closed
    # (issue #6525).
    "@vitest/browser-playwright@4.1.12": patches/@vitest__browser-playwright@4.1.12.patch
    # graphty-element's live voice (src/ai/engine/tanstack/live.ts, UPSTREAM.md). OpenAI's realtime
    # adapter sends response.create after every tool result, so a response with two calls asks for a
    # second response while the first result is still alone: this sends one after the response's
    # last result. It also reports a response with only calls as complete, and a data channel the
    # provider closed, neither of which the adapter tells its caller.
    "@tanstack/ai-openai@0.29.1": patches/@tanstack__ai-openai@0.29.1.patch
    # Gemini's realtime adapter stops sending audio on stopAudioCapture and never ends the stream,
    # so on push-to-talk release the server never ends the reader's turn: this pads the silence its
    # turn detection waits for and sends audioStreamEnd. It also drops the setup's
    # proactiveAudio: false, which gemini-3.8-live refuses.
    "@tanstack/ai-gemini@0.37.2": patches/@tanstack__ai-gemini@0.37.2.patch
    # nx 22.7.12 starts a process-metrics collector in every nx process that refreshes every
    # process on the machine through sysinfo, which keeps a /proc/<pid>/stat and a
    # /proc/<pid>/task/<tid>/stat open for each (about 11,000 handles per nx process here). A few
    # nx runs at once fill the system file table (file-max) and other processes fail with ENFILE.
    # Nothing here reads the metrics, so the patch never starts the collector (issue #2558).
    # Still unfixed in nx 23.3.0; recheck at the next nx upgrade.
    # The same patch makes `nx release` treat a commit listed in release-not-breaking.json (the owner's
    # ruling that an already-pushed `!` or BREAKING CHANGE commit is not breaking) as not breaking, for the
    # version bump and the changelog (issue #6476). Carry it to every nx upgrade: it is repo policy.
    "nx@22.7.12": patches/nx@22.7.12.patch
    # Babylon decodes an RGBD texture (a PBR material's BRDF lookup texture) in a post-process after
    # an async shader import and compile, and never checks that the engine is still alive. A
    # disposed engine's effects report ready with no program, so disposing a graph while a model's
    # first PBR material decodes threw "Cannot read properties of null (reading 'program')" as an
    # unhandled rejection (issue #6683). This stops the decode once the engine is disposed.
    "@babylonjs/core@8.56.2": patches/@babylonjs__core@8.56.2.patch
    # Mantine 8.3.18's useCombobox keeps the list's id in a ref that Combobox.Options fills in an
    # effect, and nothing re-renders the target afterwards. A list open when it mounts
    # (defaultDropdownOpened, or dropdownOpened true from the start) leaves its combobox with
    # aria-expanded="false" and no aria-controls until the next re-render, so a screen reader is
    # told the list is closed. The patch re-renders the combobox once when the id is set
    # (issue #1913).
    "@mantine/core@8.3.18": patches/@mantine__core@8.3.18.patch

# Security floors for transitive packages that a parent in pnpm-lock.yaml pins to a vulnerable
# version. Each line names the parent that holds it back; delete an entry once that parent moves
# past the floor (remove it, `pnpm install`, then `pnpm audit --audit-level=moderate` and
# `pnpm why <name>`). The audit behind this list: design/decisions/2026-09-27-pnpm-overrides-audit.md.
overrides:
    # nx 22.7.12 pins brace-expansion 5.0.8 (nx 23.2.1 still pins 5.0.9) and smol-toml 1.6.1.
    # Floor 5.0.11 covers GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 on the chain
    # @nx/eslint > @nx/devkit > minimatch 10 > brace-expansion 5.
    "brace-expansion@>=4.0.0 <5.0.11": ^5.0.11
    "smol-toml@<1.7.1": ^1.7.1
    # nx 22.7.12 also asks for axios ^1 and was locked to 1.18.1. Floor 1.20.0 covers
    # GHSA-3pq3-5fj3-cg6v, GHSA-542g-h47m-68v8, GHSA-m8m8-qj5v-23w3 and GHSA-r4gj-5m52-g5wh.
    "axios@<1.20.0": ^1.20.0
    # commitizen pins lodash 4.17.21 (4.17.23 in a fresh resolution).
    "lodash@<4.18.0": ^4.18.0
    # compact-mantine's vite-plugin-dts -> @microsoft/api-extractor pins minimatch 10 and, through
    # @microsoft/tsdoc-config, ajv 8.13; nx, @nx/devkit and typedoc pin minimatch 10, and Storybook's
    # docgen plugin (@joshwooding/vite-plugin-react-docgen-typescript) pins glob 10 -> minimatch 9.
    # GHSA-g3hv-75wg-m249 (minimatch >=7.0.0 <11.0.1) is patched only in 11.0.1, with no 9.x or 10.x
    # backport, so the floor moves those majors to 11 (same exports; drops Node 18). glob 10 cannot
    # run on minimatch 11 (it finds no files), and glob >=9.0.0 <=14.0.1 has GHSA-3g3m-2fjr-6pw4, so
    # glob moves to 14 too (the docgen plugin calls only globSync, unchanged in 14).
    # typedoc 0.28.20 (the newest) calls Minimatch#matchOne, which minimatch 11 removed, so typedoc
    # keeps minimatch 10 until it moves; it only matches this repository's own entry-point globs.
    "minimatch@>=7.0.0 <11.0.1": ^11.0.1
    "typedoc>minimatch": ^10.2.6
    "glob@>=9.0.0 <14.0.2": ^14.0.2
    "ajv@>=7.0.0-alpha.0 <8.18.0": ^8.18.0
    # graphty-element's @jsonhero/schema-infer -> @jsonhero/json-infer-types pins ip-address 8 and
    # uuid 8. Floor 10.7.4 covers GHSA-j6r3-76f7-8jcv, GHSA-h3mg-xc3c-68pw and GHSA-rxp7-6hxx-x8q5; uuid 11.1.1 covers
    # GHSA-w5hq-g745-h8pq (graphty-element's @storybook/addon-console -> @storybook/addon-actions 8 also pins
    # uuid 9).
    "ip-address@<10.7.4": ^10.7.4
    "uuid@<11.1.1": ^11.1.1
    # storybook 9.1.20 pins @vitest/mocker 3.2.4; GHSA-82fw-gwwq-j7x9 is patched only in 4.1.11, and
    # GHSA-qxg6-89mg-rqv8 and GHSA-xp26-3454-mjgp only in 4.1.12.
    "@vitest/mocker@>=2.1.0 <4.1.12": ^4.1.12
    # semantic-release -> @semantic-release/npm -> @actions/core -> @actions/http-client locked 6.29.0; @nx/react ->
    # @nx/module-federation -> @module-federation/enhanced -> @module-federation/dts-plugin locked 7.29.1
    # and 7.30.0. Floors 6.29.1 and 7.30.1 cover GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472,
    # GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm,
    # GHSA-9fm3-97px-rjf6 and GHSA-55wc-3pg8-jfw6.
    "undici@<6.29.1": ^6.29.1
    "undici@>=7.0.0 <7.30.1": ^7.30.1
    # nx 22.7.12 locked follow-redirects 1.16.0 (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c), and
    # remote-logger's http-proxy 1.16.1 (GHSA-mrwp-f3q8-3g9p).
    "follow-redirects@<1.16.2": ^1.16.2
    # typedoc locked markdown-it 14.3.2 (GHSA-gfr2-rv44-r23c, GHSA-vfgh-jcmw-g37q).
    "markdown-it@>=14.0.0 <14.3.3": ^14.3.3
    # @microsoft/api-extractor -> @microsoft/tsdoc-config -> ajv 8 locked fast-uri 3.1.8
    # (GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp).
    "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
    # @nx/react -> express locked qs 6.16.0 (GHSA-6pq8-jhm2-2vcw).
    "qs@>=6.7.0 <6.16.1": ^6.16.1
    # remote-logger's @modelcontextprotocol/sdk locked hono 4.13.13 and @hono/node-server 2.1.3
    # (GHSA-4h7h-rv7c-7m2v, GHSA-3gg2-335m-rxc6 and the other fixes of hono 4.13.16 and
    # @hono/node-server 2.1.6). The pipeline health dashboard's own workspace carries the same floors.
    "hono@<4.13.16": ^4.13.16
    "@hono/node-server@>=2.0.0 <2.1.6": ^2.1.6
    # knip locked zod 4.6.5 (GHSA-mrhx-c7xc-m3w5).
    "zod@>=4.0.0 <4.6.6": ^4.6.6
    # @sonar/scan 5.0.1 locked node-forge 1.4.0 (GHSA-86w9-cpqp-85rv and the other fixes of the 1.4.1
    # security release), then 1.4.2 (GHSA-j8rw-jp99-435v, GHSA-w4xr-hqv8-ch44, GHSA-6889-vf6x-f3g5).
    "node-forge@<1.4.3": ^1.4.3
    # vitepress 1.x depends on vite 5, which the Vite 6.4.3 advisories do not patch.
    "vite@<6.4.3": ^6.4.3
    # graphty-element builds TanStack AI and the provider SDKs it drives into its own chunks, so
    # the versions the contract suite and the paid regression run tested are the versions that
    # ship: each SDK is pinned exactly under the TanStack adapter that declares it, inside that
    # adapter's own range (graphty-element/test/packaging/ai-pins.test.ts checks both). Move them
    # together with the @tanstack/ai* pins (design/ai/tanstack-ai-harness-design.md, section 3.1).
    "@tanstack/ai-openai>openai": 7.32.0
    "@tanstack/ai-anthropic>@anthropic-ai/sdk": 0.97.1
    "@tanstack/ai-gemini>@google/genai": 2.28.0
    # The TanStack packages the adapters pull in, and the OpenAI SDK under the shared OpenAI base,
    # pinned the same way: each is built in too, and a caret range would let a lockfile refresh
    # move it. @tanstack/ai-utils has five dependents, all TanStack's, so it is pinned once.
    "@tanstack/ai-openai>@tanstack/openai-base": 0.13.1
    "@tanstack/openai-base>openai": 7.32.0
    "@tanstack/ai>@tanstack/ai-event-client": 0.13.1
    "@tanstack/ai-event-client>@tanstack/devtools-event-client": 0.4.4
    "@tanstack/ai-utils": 0.4.1
    # In-page code: TanStack Code Mode's QuickJS driver and the WebAssembly build it loads, built
    # into graphty-element's own program chunk, pinned the same way.
    "@tanstack/ai-isolate-quickjs>quickjs-emscripten": 0.31.0
    "quickjs-emscripten>@jitl/quickjs-wasmfile-release-sync": 0.31.0
    # One Playwright for the whole workspace: the version CI installs browsers for (ci.yml's
    # browser cache). graphty-element's @playwright/test ^1.54.1 otherwise resolved 1.63.0, and any
    # lockfile re-resolution moved @vitest/browser-playwright's playwright peer to it, so every
    # browser shard failed with "Executable doesn't exist ... chromium_headless_shell-1243". Move
    # all three together, with the browser cache key. tools/ci-workflows.test.mjs checks the lock.
    playwright: 1.57.0
    playwright-core: 1.57.0
    "@playwright/test": 1.57.0
