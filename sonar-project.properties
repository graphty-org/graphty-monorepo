# SonarQube scanner settings, shared by the pre-push gate (tools/sonar-gate.mjs, a scan of the
# changed files into <key>-local) and the baseline job (tools/sonar-baseline.mjs, a full scan of
# origin/master into <key>). The project key, the server and the token are NOT here: they come
# from the environment or the gitignored .env (SONAR_PROJECT_KEY, SONAR_HOST_URL, SONAR_SCAN_TOKEN).
# The scripts pass them on the command line. See design/sonarqube/design.md.

sonar.projectName=Graphty
sonar.sourceEncoding=UTF-8

# Sources and tests both, from the root. A file is a test when it matches sonar.test.inclusions;
# the same patterns are in sonar.exclusions so source and test sets never overlap.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.test-d.ts,**/test/**,**/tests/**,**/stories/**,**/*.stories.ts,**/*.stories.tsx

# Tracked files that are generated, vendored or not code. Gitignored files (node_modules, dist,
# coverage, tmp) are skipped through git already; they are listed too for scans run outside git.
# The list is written twice (sources, tests): the scanner has no variables in this file.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/storybook-static/**,visual-baselines/**,design/**,tmp/**,**/tmp/**,.claudehistory/**,.worktrees/**,**/*.d.ts,graph-samples/src/datasets/**,visual-review/trusted/vendor/**,docs/**,algorithms/benchmark-results/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.test-d.ts,**/test/**,**/tests/**,**/stories/**,**/*.stories.ts,**/*.stories.tsx
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/storybook-static/**,visual-baselines/**,design/**,tmp/**,**/tmp/**,.claudehistory/**,.worktrees/**,**/*.d.ts,graph-samples/src/datasets/**,visual-review/trusted/vendor/**,docs/**,algorithms/benchmark-results/**

# The dataset modules are tables written by graph-samples/scripts/convert-datasets.mjs.
sonar.cpd.exclusions=graph-samples/src/datasets/**

# Never download a JRE from the server: the scanner uses SONAR_SCANNER_JAVA_EXE_PATH.
sonar.scanner.skipJreProvisioning=true

# CI's merged coverage, written by tools/merge-coverage.sh. Only the baseline job has it; the
# gate's scans pass no report, and coverage is not a gate condition locally.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# False positives by path. Each entry names exact files or a narrow glob, never a whole package,
# with its reason. Prefer `// NOSONAR(<rule>): <reason>` on the line for a single false positive.
sonar.issue.ignore.multicriteria=rand1,rand2,rand3,rand4,rand5,path1,path2

# S2245 (Math.random): seeded random number generators and test-data generators, where
# randomness is the point and nothing security-related depends on it.
sonar.issue.ignore.multicriteria.rand1.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand1.resourceKey=layout/src/simulation/seed.ts
sonar.issue.ignore.multicriteria.rand2.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand2.resourceKey=layout/src/utils/random.ts
sonar.issue.ignore.multicriteria.rand3.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand3.resourceKey=webgpu-graph-algorithms/src/layouts/seed.ts
sonar.issue.ignore.multicriteria.rand4.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand4.resourceKey=graphty-element/src/simple/defineLayout.ts
sonar.issue.ignore.multicriteria.rand5.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand5.resourceKey=algorithms/benchmarks/**

# S4036 (command found through PATH): developer tooling that runs git, pnpm and node from the
# developer's own PATH.
sonar.issue.ignore.multicriteria.path1.ruleKey=*:S4036
sonar.issue.ignore.multicriteria.path1.resourceKey=tools/**
sonar.issue.ignore.multicriteria.path2.ruleKey=*:S4036
sonar.issue.ignore.multicriteria.path2.resourceKey=*/scripts/**
