# SonarQube scanner settings, shared by the pre-push gate (tools/sonar-gate.mjs, a scan of the
# changed files into <key>-local) and the baseline job (tools/sonar-baseline.mjs, a full scan of
# origin/master into <key>). The project key, the server and the token are NOT here: they come
# from the environment or the gitignored .env (SONAR_PROJECT_KEY, SONAR_HOST_URL, SONAR_TOKEN).
# The scripts pass them on the command line. See design/sonarqube/design.md.

sonar.projectName=Graphty
sonar.sourceEncoding=UTF-8

# Sources and tests both, from the root. A file is a test when it matches sonar.test.inclusions;
# the same patterns are in sonar.exclusions so source and test sets never overlap.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.test-d.ts,**/test/**,**/tests/**,**/stories/**,**/*.stories.ts,**/*.stories.tsx

# Tracked files that are generated, vendored or not code. Gitignored files (node_modules, dist,
# coverage, tmp) are skipped through git already; they are listed too for scans run outside git.
# The list is written twice (sources, tests): the scanner has no variables in this file.
# webgpu-graph-algorithms/docs/** holds archived research probes kept as the record of what was
# measured: not shipped, not run by any test or workflow, and importing from the pre-monorepo
# checkout, so nothing there can be fixed or broken.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/storybook-static/**,visual-baselines/**,design/**,tmp/**,**/tmp/**,.claudehistory/**,.worktrees/**,**/*.d.ts,graph-samples/src/datasets/**,visual-review/trusted/vendor/**,docs/**,webgpu-graph-algorithms/docs/**,algorithms/benchmark-results/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.test-d.ts,**/test/**,**/tests/**,**/stories/**,**/*.stories.ts,**/*.stories.tsx
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/storybook-static/**,visual-baselines/**,design/**,tmp/**,**/tmp/**,.claudehistory/**,.worktrees/**,**/*.d.ts,graph-samples/src/datasets/**,visual-review/trusted/vendor/**,docs/**,webgpu-graph-algorithms/docs/**,algorithms/benchmark-results/**

# The dataset modules are tables written by graph-samples/scripts/convert-datasets.mjs.
sonar.cpd.exclusions=graph-samples/src/datasets/**

# Never download a JRE from the server: the scanner uses SONAR_SCANNER_JAVA_EXE_PATH.
sonar.scanner.skipJreProvisioning=true

# CI's merged coverage, written by tools/merge-coverage.sh. Only the baseline job has it; the
# gate's scans pass no report, and coverage is not a gate condition locally.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code no test suite runs, so coverage there would only read as 0%: build and maintenance scripts,
# benchmarks, the example programs in the docs, and the Vite and Vitest configuration files. Their
# issues are still reported; only coverage leaves them out.
sonar.coverage.exclusions=**/scripts/**,**/benchmarks/**,**/benchmark/**,**/docs/**/examples/**,**/vite.config.*,**/vite.*.config.*,**/vitest.config.*,**/vitest.*.config.*

# False positives by path. Each entry names exact files or a narrow glob, never a whole package,
# with its reason. Prefer `// NOSONAR(<rule>): <reason>` on the line for a single false positive.
sonar.issue.ignore.multicriteria=rand1,rand2,rand3,rand4,rand5,path1,path2,path3,jsx1,int1,port1,api1,msg1,msg2,render1,render2,render3,glyph1,data1,iri1,same1

# S2245 (Math.random): seeded random number generators and test-data generators, where
# randomness is the point and nothing security-related depends on it.
sonar.issue.ignore.multicriteria.rand1.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand1.resourceKey=layout/src/simulation/seed.ts
sonar.issue.ignore.multicriteria.rand2.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand2.resourceKey=layout/src/utils/random.ts
sonar.issue.ignore.multicriteria.rand3.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand3.resourceKey=webgpu-graph-algorithms/src/layouts/seed.ts
sonar.issue.ignore.multicriteria.rand4.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand4.resourceKey=graphty-element/src/simple/defineLayout.ts
sonar.issue.ignore.multicriteria.rand5.ruleKey=*:S2245
sonar.issue.ignore.multicriteria.rand5.resourceKey=algorithms/benchmarks/**

# S4036 (command found through PATH): developer tooling that runs git, pnpm and node from the
# developer's own PATH.
sonar.issue.ignore.multicriteria.path1.ruleKey=*:S4036
sonar.issue.ignore.multicriteria.path1.resourceKey=tools/**
sonar.issue.ignore.multicriteria.path2.ruleKey=*:S4036
sonar.issue.ignore.multicriteria.path2.resourceKey=*/scripts/**
# githerd runs the owner's own git, gh, bash and tmux from his PATH, as the tools above do.
sonar.issue.ignore.multicriteria.path3.ruleKey=*:S4036
sonar.issue.ignore.multicriteria.path3.resourceKey=githerd/**

# S125 (commented-out code): the graph-io React example shows, as a comment, the JSX component a
# reader writes; the file itself runs under Node in the docs tests, without a JSX compiler.
sonar.issue.ignore.multicriteria.jsx1.ruleKey=*:S125
sonar.issue.ignore.multicriteria.jsx1.resourceKey=graph-io/docs/examples/loading/react.js

# S3776 (cognitive complexity): line-for-line ports of reference algorithms -- the left-right
# planarity test and the de Fraysseix-Pach-Pollack drawing from NetworkX's planar_layout -- kept in
# the reference's shape so they can be checked against it.
sonar.issue.ignore.multicriteria.port1.ruleKey=*:S3776
sonar.issue.ignore.multicriteria.port1.resourceKey=layout/src/indexed/planar.ts

# S7767 (`| 0` instead of Math.trunc): Threefry-2x32 is 32-bit integer arithmetic, and `| 0` there
# is addition modulo 2^32, not truncation; Math.trunc would change every random draw.
sonar.issue.ignore.multicriteria.int1.ruleKey=*:S7767
sonar.issue.ignore.multicriteria.int1.resourceKey=graph-samples/src/random/threefry.ts

# S107 (more than 7 parameters): EventManager.emitDataLoadingComplete is public API
# (graphty-element/api/index.api.md). Grouping its parameters is a breaking change, so it waits for
# the next major. A NOSONAR on its line would be copied into the published .d.ts.
sonar.issue.ignore.multicriteria.api1.ruleKey=*:S107
sonar.issue.ignore.multicriteria.api1.resourceKey=graphty-element/src/managers/EventManager.ts

# S2819 (message origin): the Graphviz layouts' dedicated Worker. A dedicated Worker receives
# messages only from the page that created it, and such a message carries no origin to check.
sonar.issue.ignore.multicriteria.msg1.ruleKey=*:S2819
sonar.issue.ignore.multicriteria.msg1.resourceKey=graphty-element/src/layout/graphviz/worker.ts
# The same for the dedicated Worker an algorithm's CPU port runs in.
sonar.issue.ignore.multicriteria.msg2.ruleKey=*:S2819
sonar.issue.ignore.multicriteria.msg2.resourceKey=graphty-element/src/algorithms/offThreadWorker.ts

# S6478 (component defined inside a component): these files pass render functions -- a table
# cell's renderer, a tree row's menu -- that the table or tree calls with a row. They are not
# components, so moving them out of the parent would only thread its state through props.
sonar.issue.ignore.multicriteria.render1.ruleKey=*:S6478
sonar.issue.ignore.multicriteria.render1.resourceKey=graphty/src/workspace/data-page/DataPage.tsx
sonar.issue.ignore.multicriteria.render2.ruleKey=*:S6478
sonar.issue.ignore.multicriteria.render2.resourceKey=graphty/src/workspace/data-place/Filters.tsx
sonar.issue.ignore.multicriteria.render3.ruleKey=*:S6478
sonar.issue.ignore.multicriteria.render3.resourceKey=graphty/src/workspace/join/JoinScreen.tsx

# S6770 (JSX component names in PascalCase): the workspace draws its icons as <GLYPHS.name />,
# members of one constant map of icon components (graphty/src/workspace/glyphs.ts), which the
# rule reads as a component named GLYPHS. Every other component name there is PascalCase.
sonar.issue.ignore.multicriteria.glyph1.ruleKey=*:S6770
sonar.issue.ignore.multicriteria.glyph1.resourceKey=graphty/src/workspace/**

# S7780 (String.raw): the dataset tables are generated by graph-samples/scripts/convert-datasets.mjs,
# which writes every string as JSON.stringify does; a backslash in a source name is data, escaped.
sonar.issue.ignore.multicriteria.data1.ruleKey=*:S7780
sonar.issue.ignore.multicriteria.data1.resourceKey=graph-samples/data/*.ts

# S5332 (http): a guide example whose code the page shows, so no NOSONAR comment can go on it;
# its http string is Wikidata's RDF namespace IRI, an identifier that is never fetched.
sonar.issue.ignore.multicriteria.iri1.ruleKey=*:S5332
sonar.issue.ignore.multicriteria.iri1.resourceKey=graph-io/docs/examples/sources/sparql-wikidata.ts

# S3516 (a function that always returns the same value): WindowSlider.rebuild returns the counts it
# measured on both of its paths; what differs is the slide state it leaves for the next move.
sonar.issue.ignore.multicriteria.same1.ruleKey=*:S3516
sonar.issue.ignore.multicriteria.same1.resourceKey=graphty-element/src/session/visibility/slide.ts
