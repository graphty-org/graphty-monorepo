# The release scheduler Worker. See README.md. Secrets (APP_ID, INSTALLATION_ID, PRIVATE_KEY) are
# set with `npx wrangler@4 secret put`, never written here.
name = "graphty-release-scheduler"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# Its cap: no public URL, so nothing but the crons below can invoke it (5 runs a day, each a handful of GitHub API
# calls). The Worker has no fetch handler, and with a workers.dev URL a stranger's request would still be a billed
# invocation. test/index.test.mjs holds both, and the cron count, in place.
workers_dev = false
preview_urls = false

[triggers]
# UTC: the full run's 00:00, 06:00, 12:00 and 18:00 slots, and the daily deploy key check at 03:17
# (KEY_CHECK_CRON in src/worker.js)
crons = ["0 0,6,12,18 * * *", "17 3 * * *"]
