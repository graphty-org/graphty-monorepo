<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts every visual-review capture draws with (visual-review.config.json "fontconfig"). Capture
  points FONTCONFIG_FILE here, so no host font or host font setting is consulted, locally or in CI.
  fonts/ and conf.d/ are a snapshot of the GitHub ubuntu-24.04 runner (image 20260927.320.1):
  /usr/share/fonts and /etc/fonts/conf.d, minus 50-user.conf and 51-local.conf, which read the
  user's and the host's own configuration. This file is the runner's /etc/fonts/fonts.conf with
  its font and cache directories replaced. design/visual-testing/local-previews.md section 3.
-->
<fontconfig>
	<dir prefix="relative">fonts</dir>
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>system ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
	</match>
	<selectfont><rejectfont><glob>*.dpkg-tmp</glob></rejectfont></selectfont>
	<selectfont><rejectfont><glob>*.dpkg-new</glob></rejectfont></selectfont>
	<include ignore_missing="no" prefix="relative">conf.d</include>
	<cachedir prefix="xdg">fontconfig</cachedir>
	<config><rescan><int>30</int></rescan></config>
</fontconfig>
