<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>XR technique sandbox</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #0f131b;
                --panel: #1a2130;
                --text: #e8ecf4;
                --muted: #9fb3d9;
                --accent: #6ea8ff;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font:
                    15px/1.45 system-ui,
                    sans-serif;
            }
            header {
                padding: 12px 16px;
                background: var(--panel);
                display: flex;
                flex-wrap: wrap;
                gap: 12px 24px;
                align-items: center;
            }
            h1 {
                font-size: 18px;
                margin: 0;
            }
            #session {
                font-family: ui-monospace, monospace;
                color: var(--accent);
            }
            #enter-vr {
                font-size: 18px;
                padding: 10px 22px;
                border-radius: 8px;
                border: 0;
                background: var(--accent);
                color: #08101e;
                font-weight: 600;
                cursor: pointer;
            }
            #enter-vr:disabled {
                background: #555c6b;
                cursor: default;
            }
            main {
                display: grid;
                grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
                gap: 0;
                min-height: calc(100vh - 64px);
            }
            nav {
                padding: 12px 16px;
                overflow: auto;
                max-height: calc(100vh - 64px);
            }
            nav a {
                color: var(--text);
            }
            nav a.current {
                color: var(--accent);
                font-weight: 600;
            }
            nav li {
                margin: 4px 0;
            }
            nav small {
                color: var(--muted);
                display: block;
            }
            #status {
                color: var(--muted);
            }
            canvas {
                width: 100%;
                height: 100%;
                min-height: 420px;
                display: block;
                touch-action: none;
                outline: none;
            }
            @media (max-width: 720px) {
                main {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>XR technique sandbox</h1>
            <span>Session <span id="session">...</span></span>
            <label
                >Mode
                <select id="mode">
                    <option value="vr">VR</option>
                    <option value="ar">Passthrough AR</option>
                </select></label
            >
            <label><input type="checkbox" id="arm-mic" /> Arm the microphone (voice, dictation)</label>
            <button id="enter-vr" disabled>Loading...</button>
            <span id="status"></span>
            <a id="download" hidden download="xr-sandbox-save.json">Download the last save</a>
            <a href="/tutorial.html">How to use it (tutorial)</a>
        </header>
        <main>
            <nav>
                <strong>Presets</strong>
                <ul id="presets"></ul>
                <strong>One technique alone</strong>
                <ul id="solo"></ul>
                <strong>Step lists</strong>
                <ul id="steps"></ul>
            </nav>
            <canvas id="scene"></canvas>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
